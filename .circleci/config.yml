version: 2.1

jobs:
  generated-sync-probe:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Rebuild canonical userscript outputs
          command: npm run userscript:build
      - run:
          name: Resolve generated-output ownership policy
          command: |
            mode="$(node tools/validation/generated-output-policy.mjs)"
            case "$mode" in
              enforce|ephemeral) ;;
              *) echo "unknown generated-output policy mode: $mode" >&2; exit 1 ;;
            esac
            echo "export GENERATED_MODE=$mode" >> "$BASH_ENV"
      - run:
          name: Validate generated outputs
          command: |
            if [ "$GENERATED_MODE" = 'enforce' ]; then
              git diff --exit-code -- userscript/hex.user.template.js userscript/release-version.json
            else
              echo 'Component lane built generated output ephemerally; integration owns committed synchronization.'
            fi

workflows:
  probe:
    jobs:
      - generated-sync-probe
