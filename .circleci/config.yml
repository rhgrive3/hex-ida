version: 2.1

jobs:
  probe-invariant-classifier:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: node tests/invariant-pr-baseline.mjs

  probe-invariant-baseline-proof:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm ci --no-audit --no-fund
      - run: HEX_INVARIANT_BASE_REF=refs/remotes/origin/main node tools/validation/invariant-pr-baseline.mjs

  probe-semantic-v2:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm run semantic-v2:test

  probe-benchmark-baseline:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm run benchmark:baseline

workflows:
  analysis-proof-diagnostic:
    jobs:
      - probe-invariant-classifier
      - probe-invariant-baseline-proof
      - probe-semantic-v2
      - probe-benchmark-baseline
