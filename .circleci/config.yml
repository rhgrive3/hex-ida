version: 2.1

jobs:
  probe-install:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund

  probe-build:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm run userscript:build

  probe-policy:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate generated-output policy
          command: |
            mode="$(node tools/validation/generated-output-policy.mjs)"
            case "$mode" in
              enforce|ephemeral) echo "$mode" ;;
              *) echo "unknown generated-output policy mode: $mode" >&2; exit 1 ;;
            esac

  probe-generated-diff:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm run userscript:build
      - run:
          name: Require canonical generated outputs
          command: git diff --exit-code -- userscript/hex.user.template.js userscript/release-version.json

workflows:
  probe:
    jobs:
      - probe-install
      - probe-build
      - probe-policy
      - probe-generated-diff
