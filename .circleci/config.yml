version: 2.1

jobs:
  universal-benchmark-generate:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    environment:
      HEX_BENCHMARK_SAMPLES: 1
      HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
      HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
      HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP
    steps:
      - checkout
      - run:
          name: Fetch and verify pinned real fixtures
          command: |
            npm run fixtures:fetch
            npm run fixtures:check
      - run:
          name: Generate universal benchmark report with audit labels
          command: |
            set -o pipefail
            npm --silent run binary:benchmark | tee universal-platform-benchmark.json
      - persist_to_workspace:
          root: .
          paths:
            - universal-platform-benchmark.json

  address-null:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs address-offset-roundtrip null
  address-nonnull:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs address-offset-roundtrip nonnull
  offset-null:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs offset-address-roundtrip null
  offset-nonnull:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs offset-address-roundtrip nonnull
  roundtrip-start:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: |
          node scripts/ci/circleci-audit-code-probe.mjs address-offset-roundtrip start ||
          node scripts/ci/circleci-audit-code-probe.mjs offset-address-roundtrip start
  roundtrip-end:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: |
          node scripts/ci/circleci-audit-code-probe.mjs address-offset-roundtrip end ||
          node scripts/ci/circleci-audit-code-probe.mjs offset-address-roundtrip end

workflows:
  probe:
    jobs:
      - universal-benchmark-generate
      - address-null: { requires: [universal-benchmark-generate] }
      - address-nonnull: { requires: [universal-benchmark-generate] }
      - offset-null: { requires: [universal-benchmark-generate] }
      - offset-nonnull: { requires: [universal-benchmark-generate] }
      - roundtrip-start: { requires: [universal-benchmark-generate] }
      - roundtrip-end: { requires: [universal-benchmark-generate] }
