version: 2.1

jobs:
  universal-benchmark-generate:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    environment:
      HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
      HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
      HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP
    steps:
      - checkout
      - run:
          name: Fetch and verify pinned real fixtures
          command: |
            npm run fixtures:fetch
            npm run fixtures:check
      - run:
          name: Generate universal benchmark report
          command: |
            set -o pipefail
            npm --silent run binary:benchmark | tee universal-platform-benchmark.json
      - persist_to_workspace:
          root: .
          paths:
            - universal-platform-benchmark.json

  benchmark-battlecats-identity:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-benchmark-target-probe.mjs battlecats identity

  benchmark-battlecats-work:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-benchmark-target-probe.mjs battlecats work

  benchmark-tsumtsum-identity:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-benchmark-target-probe.mjs TsumTsum identity

  benchmark-tsumtsum-work:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-benchmark-target-probe.mjs TsumTsum work

  benchmark-ywp-identity:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-benchmark-target-probe.mjs YWP identity

  benchmark-ywp-work:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-benchmark-target-probe.mjs YWP work

workflows:
  probe:
    jobs:
      - universal-benchmark-generate
      - benchmark-battlecats-identity: { requires: [universal-benchmark-generate] }
      - benchmark-battlecats-work: { requires: [universal-benchmark-generate] }
      - benchmark-tsumtsum-identity: { requires: [universal-benchmark-generate] }
      - benchmark-tsumtsum-work: { requires: [universal-benchmark-generate] }
      - benchmark-ywp-identity: { requires: [universal-benchmark-generate] }
      - benchmark-ywp-work: { requires: [universal-benchmark-generate] }
