version: 2.1

commands:
  setup-benchmark-target-check:
    parameters:
      target:
        type: string
      category:
        type: string
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Check << parameters.target >> << parameters.category >>
          command: node scripts/ci/circleci-benchmark-target-probe.mjs << parameters.target >> << parameters.category >>

jobs:
  universal-benchmark-generate:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    environment:
      HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
      HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
      HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP
    steps:
      - checkout
      - run:
          name: Fetch and verify pinned real fixtures
          command: |
            npm run fixtures:fetch
            npm run fixtures:check
      - run:
          name: Generate universal benchmark report
          command: |
            set -o pipefail
            npm --silent run binary:benchmark | tee universal-platform-benchmark.json
      - persist_to_workspace:
          root: .
          paths:
            - universal-platform-benchmark.json

  benchmark-battlecats-source-backed:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps: [{ setup-benchmark-target-check: { target: battlecats, category: source-backed } }]
  benchmark-battlecats-audit-errors:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps: [{ setup-benchmark-target-check: { target: battlecats, category: audit-errors } }]

  benchmark-tsumtsum-source-backed:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps: [{ setup-benchmark-target-check: { target: TsumTsum, category: source-backed } }]
  benchmark-tsumtsum-audit-errors:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps: [{ setup-benchmark-target-check: { target: TsumTsum, category: audit-errors } }]

  benchmark-ywp-source-backed:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps: [{ setup-benchmark-target-check: { target: YWP, category: source-backed } }]
  benchmark-ywp-audit-errors:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps: [{ setup-benchmark-target-check: { target: YWP, category: audit-errors } }]

workflows:
  probe:
    jobs:
      - universal-benchmark-generate
      - benchmark-battlecats-source-backed: { requires: [universal-benchmark-generate] }
      - benchmark-battlecats-audit-errors: { requires: [universal-benchmark-generate] }
      - benchmark-tsumtsum-source-backed: { requires: [universal-benchmark-generate] }
      - benchmark-tsumtsum-audit-errors: { requires: [universal-benchmark-generate] }
      - benchmark-ywp-source-backed: { requires: [universal-benchmark-generate] }
      - benchmark-ywp-audit-errors: { requires: [universal-benchmark-generate] }
