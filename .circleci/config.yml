version: 2.1

jobs:
  universal-benchmark-generate:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    environment:
      HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
      HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
      HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP
    steps:
      - checkout
      - run:
          name: Fetch and verify pinned real fixtures
          command: |
            npm run fixtures:fetch
            npm run fixtures:check
      - run:
          name: Generate universal benchmark report with audit codes
          command: |
            set -o pipefail
            npm --silent run binary:benchmark | tee universal-platform-benchmark.json
      - persist_to_workspace:
          root: .
          paths:
            - universal-platform-benchmark.json

  audit-code-duplicate-function:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs duplicate-function

  audit-code-negative-function-size:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs negative-function-size

  audit-code-file-range-outside:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs file-range-outside

  audit-code-address-offset-roundtrip:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs address-offset-roundtrip

  audit-code-offset-address-roundtrip:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs offset-address-roundtrip

workflows:
  probe:
    jobs:
      - universal-benchmark-generate
      - audit-code-duplicate-function: { requires: [universal-benchmark-generate] }
      - audit-code-negative-function-size: { requires: [universal-benchmark-generate] }
      - audit-code-file-range-outside: { requires: [universal-benchmark-generate] }
      - audit-code-address-offset-roundtrip: { requires: [universal-benchmark-generate] }
      - audit-code-offset-address-roundtrip: { requires: [universal-benchmark-generate] }
