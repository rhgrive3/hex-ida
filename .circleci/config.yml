version: 2.1

executors:
  node22-large:
    docker:
      - image: cimg/node:22.23
    resource_class: large

commands:
  prepare-main:
    steps:
      - checkout
      - run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git checkout --detach refs/remotes/origin/main
      - run: npm ci --no-audit --no-fund

jobs:
  main-phase6:
    executor: node22-large
    steps:
      - prepare-main
      - run:
          command: npm run phase6:test
          no_output_timeout: 30m
  main-phase11:
    executor: node22-large
    steps:
      - prepare-main
      - run:
          command: npm run phase11:test
          no_output_timeout: 30m
  main-phase12:
    executor: node22-large
    steps:
      - prepare-main
      - run:
          command: npm run phase12:test
          no_output_timeout: 30m
  main-npm-test:
    executor: node22-large
    steps:
      - prepare-main
      - run:
          command: npm test
          no_output_timeout: 30m
  main-invariant-baseline:
    executor: node22-large
    steps:
      - prepare-main
      - run:
          command: HEX_INVARIANT_BASE_REF=refs/remotes/origin/main node tools/validation/invariant-pr-baseline.mjs
          no_output_timeout: 30m

workflows:
  pristine-main-comparison:
    jobs:
      - main-phase6
      - main-phase11
      - main-phase12
      - main-npm-test
      - main-invariant-baseline
