version: 2.1

jobs:
  migration-guardrails:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Detect migration-guardrail impact
          command: |
            set -euo pipefail
            git fetch --no-tags origin main:refs/remotes/origin/main
            changed="$(git diff --name-only origin/main...HEAD || true)"
            if printf '%s\n' "$changed" | grep -Eq '^(js/(architecture/|ir\.js$|ir-core\.js$|dataflow[^/]*\.js$|decompiler/|binary/|bytesource/|platform/|project/|runtime/|runtime-evidence/|symbolic/|ai/|ui/|ui\.js$|ui-root\.js$|panels\.js$|app\.js$|backend\.js$|worker[^/]*\.js$)|worker-entry\.js$|package\.json$|package-lock\.json$|tests/(migration-guardrails\.mjs$|universal-binary-source\.mjs$|binary-platform\.mjs$)|docs/MIGRATION_GUARDRAILS\.md$|\.github/workflows/migration-guardrails\.yml$|\.circleci/config\.yml$)'; then
              echo 'export RUN_MIGRATION_GUARDRAILS=true' >> "$BASH_ENV"
            else
              echo 'export RUN_MIGRATION_GUARDRAILS=false' >> "$BASH_ENV"
              echo 'No migration-guardrail inputs changed; expensive steps will be skipped.'
            fi
      - run:
          name: Install dependencies
          command: |
            if [ "$RUN_MIGRATION_GUARDRAILS" != "true" ]; then exit 0; fi
            npm ci --no-audit --no-fund
      - run:
          name: Run migration proofs
          command: |
            if [ "$RUN_MIGRATION_GUARDRAILS" != "true" ]; then exit 0; fi
            npm run migration:test
            npm run binary:source-test

  agent-loop-resilience:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run:
          name: Detect agent-loop impact
          command: |
            set -euo pipefail
            git fetch --no-tags origin main:refs/remotes/origin/main
            changed="$(git diff --name-only origin/main...HEAD || true)"
            if printf '%s\n' "$changed" | grep -Eq '^(js/userscript/dev/|tests/dev-agent/agent-loop-resilience\.mjs$|\.github/workflows/agent-loop-resilience\.yml$|\.circleci/config\.yml$)'; then
              node tests/dev-agent/agent-loop-resilience.mjs
            else
              echo 'No agent-loop inputs changed; skipping.'
            fi

  ai-eval-contract:
    docker:
      - image: cimg/node:20.19
    resource_class: small
    steps:
      - checkout
      - run:
          name: Detect AI evaluation impact and run contract
          command: |
            set -euo pipefail
            git fetch --no-tags origin main:refs/remotes/origin/main
            changed="$(git diff --name-only origin/main...HEAD || true)"
            if ! printf '%s\n' "$changed" | grep -Eq '^(js/(ai/|agent/|query/|gemini\.js$|goalc\.js$|semantic-evidence\.js$)|worker\.js$|tests/ai-eval/|docs/(ai-integration-contract\.md$|ai-quality-gate\.md$)|\.github/workflows/ai-eval-contract\.yml$|\.circleci/config\.yml$)'; then
              echo 'No AI evaluation inputs changed; skipping.'
              exit 0
            fi
            node tests/ai-eval/workflow-trigger.mjs
            node tests/ai-eval/selftest.mjs
            node tests/ai-eval/grade.mjs tests/ai-eval/results.example.jsonl /tmp/ai-eval-report.json
            if node tests/ai-eval/grade.mjs tests/ai-eval/results.example.jsonl /tmp/ai-eval-partial.json --require-all; then
              echo 'Expected --require-all to reject a one-case trace.' >&2
              exit 1
            fi

  issue-2528-canonical-claims:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run:
          name: Detect canonical-claims impact and run regression
          command: |
            set -euo pipefail
            git fetch --no-tags origin main:refs/remotes/origin/main
            changed="$(git diff --name-only origin/main...HEAD || true)"
            if printf '%s\n' "$changed" | grep -Eq '^(js/ui/product-hardened\.js$|js/analysis/query/product-surface\.js$|js/ux\.js$|tests/issue-2528-canonical-claims\.mjs$|\.github/workflows/issue-2528-canonical-claims\.yml$|\.circleci/config\.yml$)'; then
              node tests/issue-2528-canonical-claims.mjs
            else
              echo 'No canonical-claims inputs changed; skipping.'
            fi

workflows:
  ci:
    jobs:
      - migration-guardrails
      - agent-loop-resilience
      - ai-eval-contract
      - issue-2528-canonical-claims
