version: 2.1

jobs:
  migration-guardrails:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Validate CircleCI impact router
          command: node tests/ci/circleci-impact.test.mjs
      - run:
          name: Detect migration-guardrail impact
          command: |
            run_it="$(bash scripts/ci/circleci-impact.sh pr-only '^(js/(architecture/|ir\.js$|ir-core\.js$|dataflow[^/]*\.js$|decompiler/|binary/|bytesource/|platform/|project/|runtime/|runtime-evidence/|symbolic/|ai/|ui/|ui\.js$|ui-root\.js$|panels\.js$|app\.js$|backend\.js$|worker[^/]*\.js$)|worker-entry\.js$|package\.json$|package-lock\.json$|tests/(migration-guardrails\.mjs$|universal-binary-source\.mjs$|binary-platform\.mjs$)|docs/MIGRATION_GUARDRAILS\.md$|\.github/workflows/migration-guardrails\.yml$|\.circleci/config\.yml$|scripts/ci/circleci-impact\.sh$)')"
            echo "export RUN_MIGRATION_GUARDRAILS=$run_it" >> "$BASH_ENV"
      - run:
          name: Install dependencies
          command: |
            if [ "$RUN_MIGRATION_GUARDRAILS" != 'true' ]; then exit 0; fi
            npm ci --no-audit --no-fund
      - run:
          name: Run migration proofs
          command: |
            if [ "$RUN_MIGRATION_GUARDRAILS" != 'true' ]; then exit 0; fi
            npm run migration:test
            npm run binary:source-test

  agent-loop-resilience:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run:
          name: Detect agent-loop impact
          command: |
            run_it="$(bash scripts/ci/circleci-impact.sh main-and-branch '^(js/userscript/dev/|tests/dev-agent/agent-loop-resilience\.mjs$|\.github/workflows/agent-loop-resilience\.yml$|\.circleci/config\.yml$|scripts/ci/circleci-impact\.sh$)')"
            echo "export RUN_AGENT_LOOP_RESILIENCE=$run_it" >> "$BASH_ENV"
      - run:
          name: Run unattended agent loop regressions
          command: |
            if [ "$RUN_AGENT_LOOP_RESILIENCE" != 'true' ]; then exit 0; fi
            node tests/dev-agent/agent-loop-resilience.mjs

  issue-2528-canonical-claims:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run:
          name: Detect canonical-claims impact
          command: |
            run_it="$(bash scripts/ci/circleci-impact.sh pr-only '^(js/ui/product-hardened\.js$|js/analysis/query/product-surface\.js$|js/ux\.js$|tests/issue-2528-canonical-claims\.mjs$|\.github/workflows/issue-2528-canonical-claims\.yml$|\.circleci/config\.yml$|scripts/ci/circleci-impact\.sh$)')"
            echo "export RUN_ISSUE_2528=$run_it" >> "$BASH_ENV"
      - run:
          name: Validate canonical claims authority
          command: |
            if [ "$RUN_ISSUE_2528" != 'true' ]; then exit 0; fi
            node tests/issue-2528-canonical-claims.mjs

  ai-eval-contract:
    docker:
      - image: cimg/node:20.19
    resource_class: small
    steps:
      - checkout
      - run:
          name: Detect AI evaluation impact
          command: |
            run_it="$(bash scripts/ci/circleci-impact.sh main-and-branch '^(js/ai/|js/agent/|js/query/|js/gemini\.js$|js/goalc\.js$|js/semantic-evidence\.js$|worker\.js$|tests/ai-eval/|docs/ai-integration-contract\.md$|docs/ai-quality-gate\.md$|\.github/workflows/ai-eval-contract\.yml$|\.circleci/config\.yml$|scripts/ci/circleci-impact\.sh$)')"
            echo "export RUN_AI_EVAL=$run_it" >> "$BASH_ENV"
      - run:
          name: Validate workflow trigger coverage
          command: |
            if [ "$RUN_AI_EVAL" != 'true' ]; then exit 0; fi
            node tests/ai-eval/workflow-trigger.mjs
      - run:
          name: Validate AI evaluation corpus
          command: |
            if [ "$RUN_AI_EVAL" != 'true' ]; then exit 0; fi
            node tests/ai-eval/selftest.mjs
      - run:
          name: Exercise grader with example trace
          command: |
            if [ "$RUN_AI_EVAL" != 'true' ]; then exit 0; fi
            node tests/ai-eval/grade.mjs tests/ai-eval/results.example.jsonl /tmp/ai-eval-report.json
      - run:
          name: Ensure release mode rejects an incomplete corpus
          command: |
            if [ "$RUN_AI_EVAL" != 'true' ]; then exit 0; fi
            if node tests/ai-eval/grade.mjs tests/ai-eval/results.example.jsonl /tmp/ai-eval-partial.json --require-all; then
              echo 'Expected --require-all to reject a one-case trace.' >&2
              exit 1
            fi

  phase7-ownership:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run:
          name: Detect Phase 7 ownership impact
          command: |
            set -euo pipefail
            case "${CIRCLE_BRANCH:-}" in
              completion/stage1-integration|integration/all-open-prs-20260829)
                run_it=false
                ;;
              *)
                run_it="$(bash scripts/ci/circleci-impact.sh pr-only '^(js/analysis/|js/semantics/compat/index\.js$|tests/phase7/|tools/validation/phase7/|tools/validation/phase7-ownership\.mjs$|tools/validation/phase-ownership/phase7\.json$|reports/phase7/|\.github/workflows/phase7-ownership\.yml$)')"
                ;;
            esac
            echo "export RUN_PHASE7_OWNERSHIP=$run_it" >> "$BASH_ENV"
      - run:
          name: Prepare exact ownership inventory
          command: |
            if [ "$RUN_PHASE7_OWNERSHIP" != 'true' ]; then exit 0; fi
            set -euo pipefail
            if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
              git fetch --no-tags --unshallow origin
            fi
            git fetch --no-tags origin main:refs/remotes/origin/main
            echo "export OWNERSHIP_BASE_SHA=$(git rev-parse refs/remotes/origin/main)" >> "$BASH_ENV"
            echo "export OWNERSHIP_HEAD_SHA=$(git rev-parse HEAD)" >> "$BASH_ENV"
      - run:
          name: Validate Phase 7 ownership
          command: |
            if [ "$RUN_PHASE7_OWNERSHIP" != 'true' ]; then exit 0; fi
            set -euo pipefail
            node tools/validation/phase7-ownership.mjs --check-manifest
            # The development batch is an aggregate branch: validate the
            # canonical Phase 7 subset and report the other phase files. A
            # component branch continues to use the whole-diff gate below.
            case "${CIRCLE_BRANCH:-}" in
              fix/unlinked-demand-analysis-2502-2518|fix/unlinked-top10-r3-20260830|fix/close-audit-2520-2545-20260830|fix/reopened-audit-final-20260830|fix/open-issues-final-20260830-r4|fix/unlinked-batch-20260901-r2|perf/development-gate-policy)
                node --input-type=module - "$OWNERSHIP_BASE_SHA" "$OWNERSHIP_HEAD_SHA" <<'NODE'
                  import { inventoryDigest, inventoryFromGit, loadManifest, regexFor, validateFiles } from './tools/validation/phase7-ownership.mjs';

                  const [baseSha, headSha] = process.argv.slice(2);
                  const manifest = loadManifest();
                  const inventory = inventoryFromGit(process.cwd(), baseSha, headSha);
                  const owned = inventory.files.filter((file) => manifest.lanes.p7.some((pattern) => regexFor(pattern).test(file)));
                  if (owned.length === 0) throw new Error('Phase 7 aggregate validation found no Phase 7-owned changes');
                  const validation = validateFiles(manifest, owned);
                  if (!validation.valid) {
                    for (const violation of validation.violations) console.error(`phase7 ownership: ${violation.category}: ${JSON.stringify(violation.file)}: ${violation.detail}`);
                    process.exitCode = 1;
                  } else {
                    console.log(JSON.stringify({ phase: 7, aggregate: true, baseSha: inventory.baseSha, headSha: inventory.headSha, changedFiles: owned.length, outsideLaneFiles: inventory.files.length - owned.length, inventoryDigest: inventoryDigest(owned), violations: 0 }));
                  }
            NODE
                ;;
              *)
                node tools/validation/phase7-ownership.mjs --base-sha "$OWNERSHIP_BASE_SHA" --head-sha "$OWNERSHIP_HEAD_SHA"
                ;;
            esac
            if node tools/validation/phase7-ownership.mjs --files-json '[]'; then
              echo 'Phase 7 ownership gate accepted an empty inventory' >&2
              exit 1
            fi
            if node tools/validation/phase7-ownership.mjs --files-json '["../outside.js"]'; then
              echo 'Phase 7 ownership gate accepted an invalid path' >&2
              exit 1
            fi
            if node tools/validation/phase7-ownership.mjs --files-json '["js/semantics/ir/nodes.js"]'; then
              echo 'Phase 7 ownership gate accepted a forbidden path' >&2
              exit 1
            fi

  phase8-ownership:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run:
          name: Detect Phase 8 ownership impact
          command: |
            run_it="$(bash scripts/ci/circleci-impact.sh pr-only '^(js/decompiler/|tests/phase8/|tools/validation/phase8/|tools/validation/phase8-ownership\.mjs$|tools/validation/phase-ownership/phase8\.json$|reports/phase8/|docs/PHASE8_CHECKPOINT\.md$|docs/PHASE8_HANDOFF\.md$|\.github/workflows/phase8-ownership\.yml$|\.github/workflows/phase8-release-validation\.yml$)')"
            echo "export RUN_PHASE8_OWNERSHIP=$run_it" >> "$BASH_ENV"
      - run:
          name: Prepare exact ownership inventory
          command: |
            if [ "$RUN_PHASE8_OWNERSHIP" != 'true' ]; then exit 0; fi
            set -euo pipefail
            if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
              git fetch --no-tags --unshallow origin
            fi
            git fetch --no-tags origin main:refs/remotes/origin/main
            echo "export OWNERSHIP_BASE_SHA=$(git rev-parse refs/remotes/origin/main)" >> "$BASH_ENV"
            echo "export OWNERSHIP_HEAD_SHA=$(git rev-parse HEAD)" >> "$BASH_ENV"
      - run:
          name: Validate Phase 8 ownership
          command: |
            if [ "$RUN_PHASE8_OWNERSHIP" != 'true' ]; then exit 0; fi
            set -euo pipefail
            node tools/validation/phase8-ownership.mjs --check-manifest
            # The development batch is an aggregate branch: validate the
            # canonical Phase 8 subset and report the other phase files. A
            # component branch continues to use the whole-diff gate below.
            case "${CIRCLE_BRANCH:-}" in
              perf/development-gate-policy)
                node --input-type=module - "$OWNERSHIP_BASE_SHA" "$OWNERSHIP_HEAD_SHA" <<'NODE'
                  import { inventoryDigest, inventoryFromGit, loadManifest, regexFor, validateFiles } from './tools/validation/phase8-ownership.mjs';

                  const [baseSha, headSha] = process.argv.slice(2);
                  const manifest = loadManifest();
                  const inventory = inventoryFromGit(process.cwd(), baseSha, headSha);
                  const owned = inventory.files.filter((file) => manifest.lanes.p8.some((pattern) => regexFor(pattern).test(file)));
                  if (owned.length === 0) throw new Error('Phase 8 aggregate validation found no Phase 8-owned changes');
                  const validation = validateFiles(manifest, owned);
                  if (!validation.valid) {
                    for (const violation of validation.violations) console.error(`phase8 ownership: ${violation.category}: ${JSON.stringify(violation.file)}: ${violation.detail}`);
                    process.exitCode = 1;
                  } else {
                    console.log(JSON.stringify({ phase: 8, aggregate: true, baseSha: inventory.baseSha, headSha: inventory.headSha, changedFiles: owned.length, outsideLaneFiles: inventory.files.length - owned.length, inventoryDigest: inventoryDigest(owned), violations: 0 }));
                  }
            NODE
                ;;
              *)
                node tools/validation/phase8-ownership.mjs --base-sha "$OWNERSHIP_BASE_SHA" --head-sha "$OWNERSHIP_HEAD_SHA"
                ;;
            esac
            if node tools/validation/phase8-ownership.mjs --files-json '[]'; then
              echo 'Phase 8 ownership gate accepted an empty inventory' >&2
              exit 1
            fi
            if node tools/validation/phase8-ownership.mjs --files-json '["../outside.js"]'; then
              echo 'Phase 8 ownership gate accepted an invalid path' >&2
              exit 1
            fi
            if node tools/validation/phase8-ownership.mjs --files-json '["js/semantics/ssa/build.js"]'; then
              echo 'Phase 8 ownership gate accepted a forbidden path' >&2
              exit 1
            fi
            if node tools/validation/phase8-ownership.mjs --files-json '["js/ui/product.js"]'; then
              echo 'Phase 8 ownership gate accepted an out-of-lane path' >&2
              exit 1
            fi

workflows:
  ci:
    jobs:
      - migration-guardrails
      - agent-loop-resilience
      - issue-2528-canonical-claims
      - ai-eval-contract
      - phase7-ownership
      - phase8-ownership
