version: 2.1

jobs:
  probe-llvm18-install:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install frozen Phase 5 toolchain
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y clang-18 lld-18 llvm-18

  probe-phase4:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm run phase4:test

  probe-phase5:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm run phase5:test

  probe-repo-a:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/invariant-command-probe.mjs repo-a

  probe-repo-b:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/invariant-command-probe.mjs repo-b

  probe-repo-c:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/invariant-command-probe.mjs repo-c

  probe-repo-d:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/invariant-command-probe.mjs repo-d

workflows:
  invariant-shard-diagnostic:
    jobs:
      - probe-llvm18-install
      - probe-phase4
      - probe-phase5
      - probe-repo-a
      - probe-repo-b
      - probe-repo-c
      - probe-repo-d
