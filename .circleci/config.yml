version: 2.1

jobs:
  has-circle-pull-request:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run: test -n "${CIRCLE_PULL_REQUEST:-}"

  has-circle-pull-requests:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run: test -n "${CIRCLE_PULL_REQUESTS:-}"

  fetch-pr-head-ref:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run:
          command: |
            set -euo pipefail
            git fetch --no-tags origin refs/pull/6540/head:refs/remotes/origin/pr-6540-head
            test "$(git rev-parse refs/remotes/origin/pr-6540-head)" = "$(git rev-parse HEAD)"

  fetch-pr-merge-ref:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run:
          command: |
            set -euo pipefail
            git fetch --no-tags origin refs/pull/6540/merge:refs/remotes/origin/pr-6540-merge
            merge_ref=refs/remotes/origin/pr-6540-merge
            test "$(git rev-parse "${merge_ref}^2")" = "$(git rev-parse HEAD)"
            git cat-file -e "$(git rev-parse "${merge_ref}^1")^{commit}"

workflows:
  pr-context-primitives:
    jobs:
      - has-circle-pull-request
      - has-circle-pull-requests
      - fetch-pr-head-ref
      - fetch-pr-merge-ref
