version: 2.1

jobs:
  probe-invariant-baseline-proof:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    environment:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - checkout
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm ci --no-audit --no-fund
      - run: HEX_INVARIANT_BASE_REF=refs/remotes/origin/main node tools/validation/invariant-pr-baseline.mjs

  semantic-v2-shard-0:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    environment:
      SHARD_INDEX: "0"
      SHARD_TOTAL: "4"
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/semantic-v2-circleci-shard.mjs

  semantic-v2-shard-1:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    environment:
      SHARD_INDEX: "1"
      SHARD_TOTAL: "4"
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/semantic-v2-circleci-shard.mjs

  semantic-v2-shard-2:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    environment:
      SHARD_INDEX: "2"
      SHARD_TOTAL: "4"
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/semantic-v2-circleci-shard.mjs

  semantic-v2-shard-3:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    environment:
      SHARD_INDEX: "3"
      SHARD_TOTAL: "4"
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/semantic-v2-circleci-shard.mjs

workflows:
  analysis-proof-diagnostic:
    jobs:
      - probe-invariant-baseline-proof
      - semantic-v2-shard-0
      - semantic-v2-shard-1
      - semantic-v2-shard-2
      - semantic-v2-shard-3
