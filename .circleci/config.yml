version: 2.1

jobs:
  pr-context:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run:
          name: Recover exact GitHub PR base/head without API credentials
          command: |
            set -euo pipefail
            test -n "${CIRCLE_PULL_REQUEST:-}"
            pr="${CIRCLE_PULL_REQUEST##*/}"
            [[ "$pr" =~ ^[0-9]+$ ]]
            git fetch --no-tags origin "refs/pull/${pr}/merge:refs/remotes/origin/pr-${pr}-merge"
            merge_ref="refs/remotes/origin/pr-${pr}-merge"
            base_sha="$(git rev-parse "${merge_ref}^1")"
            head_sha="$(git rev-parse "${merge_ref}^2")"
            checkout_sha="$(git rev-parse HEAD)"
            test "$head_sha" = "$checkout_sha"
            git cat-file -e "${base_sha}^{commit}"
            printf 'PR=%s BASE=%s HEAD=%s\n' "$pr" "$base_sha" "$head_sha"

workflows:
  pr-context-probe:
    jobs:
      - pr-context
