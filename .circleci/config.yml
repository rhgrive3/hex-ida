version: 2.1

jobs:
  invariant-plan-contract:
    docker:
      - image: cimg/node:22.23
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate npm-check shard partition
          command: |
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const parts = String(pkg.scripts?.check || '')
              .split(/\s+&&\s+/)
              .map((command) => command.trim())
              .filter(Boolean);
            if (parts.length < 2) throw new Error('npm check must contain at least two independent top-level commands');
            const required = [
              'npm run invariants:test',
              'npm run semantic-v2:test',
              'npm run phase4:test',
              'npm run phase5:test',
              'npm run phase6:test',
              'npm run phase8:test',
              'npm test',
              'npm run benchmark:baseline',
            ];
            for (const command of required) {
              if (!parts.includes(command)) throw new Error(`npm check layout changed; missing ${command}`);
            }
            const reserved = new Set(required);
            const coreContracts = parts.filter((command) => !reserved.has(command));
            if (!coreContracts.length) throw new Error('npm check must contain core contract commands');
            const lanes = [
              ['npm run phase8:test'],
              ['npm run phase4:test', 'npm run phase5:test'],
              ['npm run invariants:test', 'npm run semantic-v2:test', 'npm run benchmark:baseline'],
              [...coreContracts, 'npm run phase6:test', 'npm test'],
            ];
            const scheduled = lanes.flat();
            const counts = new Map();
            for (const command of scheduled) counts.set(command, (counts.get(command) || 0) + 1);
            if (
              scheduled.length !== parts.length ||
              parts.some((command) => counts.get(command) !== 1) ||
              scheduled.some((command) => !parts.includes(command))
            ) {
              throw new Error(`npm-check shard plan mismatch expected=${JSON.stringify(parts)} actual=${JSON.stringify(scheduled)}`);
            }
            console.log('invariant plan contract: PASS');
            NODE

  invariant-phase8:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Phase 8
          command: npm run phase8:test

  invariant-phase45:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Install frozen Phase 5 toolchain
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y clang-18 lld-18 llvm-18
      - run:
          name: Phase 4 and 5
          command: |
            set +e
            failures=0
            npm run phase4:test || failures=1
            npm run phase5:test || failures=1
            exit "$failures"

  invariant-analysis-proof:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run:
          name: Resolve current main
          command: git fetch --no-tags origin main:refs/remotes/origin/main
      - run:
          name: Install dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Verify invariant baseline classifier contract
          command: node tests/invariant-pr-baseline.mjs
      - run:
          name: Run exact invariant proof with current-main regression isolation
          command: HEX_INVARIANT_BASE_REF=refs/remotes/origin/main node tools/validation/invariant-pr-baseline.mjs
      - run:
          name: Semantic V2 and benchmark baseline
          command: |
            set +e
            failures=0
            npm run semantic-v2:test || failures=1
            npm run benchmark:baseline || failures=1
            exit "$failures"

  invariant-repo-regression:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run:
          name: Resolve current main
          command: git fetch --no-tags origin main:refs/remotes/origin/main
      - run:
          name: Install dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Run packed repository regression lane
          command: |
            node --input-type=module <<'NODE'
            import { spawnSync } from 'node:child_process';
            const commands = [
              'npm run lint',
              'npm run migration:test',
              'npm run module-boundaries:test',
              'npm run evidence-writers:test',
              'npm run phase7:test',
              'npm run phase9:test',
              'npm run phase10:test',
              'npm run phase11:test',
              'npm run phase12:test',
              'npm run phase6:test',
              'npm test',
            ];
            const failures = [];
            for (const command of commands) {
              console.log(`--- ${command}`);
              const result = spawnSync(command, { shell: true, stdio: 'inherit', env: process.env });
              if (result.error || result.status !== 0) failures.push({ command, status: result.status, error: result.error?.message ?? null });
            }
            if (failures.length) {
              console.error(`Invariant diagnostic failures: ${JSON.stringify(failures)}`);
              process.exit(1);
            }
            NODE

workflows:
  invariant-diagnostic:
    jobs:
      - invariant-plan-contract
      - invariant-phase8
      - invariant-phase45
      - invariant-analysis-proof
      - invariant-repo-regression
