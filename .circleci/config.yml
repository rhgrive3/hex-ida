version: 2.1

jobs:
  component-probe:
    parameters:
      component:
        type: string
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run:
          name: Probe << parameters.component >>
          command: node scripts/ci/userscript-build-components-probe.mjs << parameters.component >>

workflows:
  probe:
    jobs:
      - component-probe:
          name: probe-crypto
          component: crypto
      - component-probe:
          name: probe-css
          component: css
      - component-probe:
          name: probe-runtime
          component: runtime
      - component-probe:
          name: probe-loader
          component: loader
      - component-probe:
          name: probe-module-workers
          component: module-workers
      - component-probe:
          name: probe-classic-workers
          component: classic-workers
      - component-probe:
          name: probe-wasm
          component: wasm
      - component-probe:
          name: probe-release-version
          component: release-version
