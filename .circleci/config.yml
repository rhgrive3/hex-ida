version: 2.1

executors:
  node22-medium:
    docker:
      - image: cimg/node:22.23
    resource_class: medium

commands:
  checkout-historical:
    parameters:
      base_sha:
        type: string
      head_sha:
        type: string
    steps:
      - checkout
      - run:
          name: Fetch exact historical base/head
          command: |
            git fetch --no-tags origin << parameters.base_sha >> << parameters.head_sha >>
            git checkout --detach << parameters.head_sha >>

jobs:
  phase7-ownership-replay:
    executor: node22-medium
    steps:
      - checkout-historical:
          base_sha: 58f8410b88ec4759934098e34079c0b9f2bc7ad4
          head_sha: 43a3e990bd3d11c7bc281f03283ca2fe9dbf6f31
      - run: node tools/validation/phase7-ownership.mjs --check-manifest
      - run:
          name: Replay exact changed-file inventory
          command: node tools/validation/phase7-ownership.mjs --base-sha 58f8410b88ec4759934098e34079c0b9f2bc7ad4 --head-sha 43a3e990bd3d11c7bc281f03283ca2fe9dbf6f31
      - run:
          name: Prove forbidden path remains rejected
          command: |
            if node tools/validation/phase7-ownership.mjs --files-json '["js/semantics/ir/nodes.js"]'; then
              echo 'Phase 7 ownership gate accepted a forbidden path' >&2
              exit 1
            fi

  phase8-ownership-replay:
    executor: node22-medium
    steps:
      - checkout-historical:
          base_sha: 3b37b0c957b761139dfa22f973d3c670ad41a24c
          head_sha: 46abdd630b0e130277f2de29801e40bdfbd5349b
      - run: node tools/validation/phase8-ownership.mjs --check-manifest
      - run:
          name: Replay exact changed-file inventory
          command: node tools/validation/phase8-ownership.mjs --base-sha 3b37b0c957b761139dfa22f973d3c670ad41a24c --head-sha 46abdd630b0e130277f2de29801e40bdfbd5349b
      - run:
          name: Prove forbidden paths remain rejected
          command: |
            if node tools/validation/phase8-ownership.mjs --files-json '["js/semantics/ssa/build.js"]'; then
              echo 'Phase 8 ownership gate accepted a forbidden path' >&2
              exit 1
            fi
            if node tools/validation/phase8-ownership.mjs --files-json '["js/ui/product.js"]'; then
              echo 'Phase 8 ownership gate accepted an out-of-lane path' >&2
              exit 1
            fi

workflows:
  ownership-replay:
    jobs:
      - phase7-ownership-replay
      - phase8-ownership-replay
