version: 2.1

jobs:
  universal-benchmark-generate:
    docker:
      - image: cimg/node:22.23
    resource_class: medium
    environment:
      HEX_BENCHMARK_SAMPLES: 1
      HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
      HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
      HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP
    steps:
      - checkout
      - run:
          name: Fetch and verify pinned real fixtures
          command: |
            npm run fixtures:fetch
            npm run fixtures:check
      - run:
          name: Generate universal benchmark report with audit labels
          command: |
            set -o pipefail
            npm --silent run binary:benchmark | tee universal-platform-benchmark.json
      - persist_to_workspace:
          root: .
          paths:
            - universal-platform-benchmark.json

  address-roundtrip-section:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs address-offset-roundtrip section

  address-roundtrip-segment:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs address-offset-roundtrip segment

  offset-roundtrip-section:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs offset-address-roundtrip section

  offset-roundtrip-segment:
    docker: [{ image: cimg/node:22.23 }]
    resource_class: small
    steps:
      - checkout
      - attach_workspace: { at: . }
      - run: node scripts/ci/circleci-audit-code-probe.mjs offset-address-roundtrip segment

workflows:
  probe:
    jobs:
      - universal-benchmark-generate
      - address-roundtrip-section: { requires: [universal-benchmark-generate] }
      - address-roundtrip-segment: { requires: [universal-benchmark-generate] }
      - offset-roundtrip-section: { requires: [universal-benchmark-generate] }
      - offset-roundtrip-segment: { requires: [universal-benchmark-generate] }
