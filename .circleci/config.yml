version: 2.1

jobs:
  build-medium-plus:
    docker:
      - image: cimg/node:22.23
    resource_class: medium+
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm run userscript:build

  build-large:
    docker:
      - image: cimg/node:22.23
    resource_class: large
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm run userscript:build

  build-xlarge:
    docker:
      - image: cimg/node:22.23
    resource_class: xlarge
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm run userscript:build

workflows:
  probe:
    jobs:
      - build-medium-plus
      - build-large
      - build-xlarge
