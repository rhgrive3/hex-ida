name: Phase 6 release validation

# The permanent Phase 6 verifier. It runs on Phase 6-relevant source changes
# and can be dispatched against an exact SHA. Unrelated main pushes must not
# spend the frozen compiler-corpus cost.
on:
  push:
    branches:
      - main
      - 'hex/p6-*'
    paths:
      - 'js/targets/architecture/**'
      - 'js/targets/abi/**'
      - 'js/analysis/semantic-function.js'
      - 'js/semantics/**'
      - 'js/decompiler/**'
      - 'js/binary/elf.js'
      - 'js/platform/capability-maturity.js'
      - 'capstone.js'
      - 'capstone.wasm'
      - 'tests/phase6/**'
      - 'tools/validation/phase6/**'
      - '.github/workflows/phase6-release-validation.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'js/targets/architecture/**'
      - 'js/targets/abi/**'
      - 'js/analysis/semantic-function.js'
      - 'js/semantics/**'
      - 'js/decompiler/**'
      - 'js/binary/elf.js'
      - 'js/platform/capability-maturity.js'
      - 'capstone.js'
      - 'capstone.wasm'
      - 'tests/phase6/**'
      - 'tools/validation/phase6/**'
      - '.github/workflows/phase6-release-validation.yml'
      - 'package.json'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact 40-character commit SHA to verify'
        required: true
        type: string
      shadow:
        description: 'Report the verdict without failing the job'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase6-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The corpus is generated by the exact pinned toolchain. Reuse the hosted
      # image only when every required versioned binary is already present.
      - name: Ensure the frozen Phase 6 toolchain
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang-18 >/dev/null && command -v ld.lld-18 >/dev/null && command -v llvm-objdump-18 >/dev/null; then
            echo "Frozen LLVM 18 toolchain already present; skipping apt."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
      - name: Probe the frozen toolchain identity
        run: node tools/validation/phase6/build-verification-corpus.mjs --probe-only
      - name: Run the Phase 6 verifier against the exact head
        env:
          EXPECT_SHA: ${{ github.event.inputs.sha }}
          SHADOW: ${{ github.event.inputs.shadow }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${EXPECT_SHA:-}" ]; then args+=(--expect-sha "$EXPECT_SHA"); fi
          if [ "${SHADOW:-false}" = "true" ]; then args+=(--shadow); fi
          node tools/validation/phase6/verify.mjs "${args[@]}"
      - name: Publish Phase 6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-release-evidence-${{ github.event.inputs.sha || github.sha }}
          path: |
            reports/phase6/phase6-release-evidence.json
            reports/phase6/phase6-release-evidence.md
          if-no-files-found: error
