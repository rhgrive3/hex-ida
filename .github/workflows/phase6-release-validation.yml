name: Phase 6 release validation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact 40-character commit SHA to verify'
        required: true
        type: string
      shadow:
        description: 'Report the verdict without failing the job'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase6-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the frozen Phase 6 toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
      - name: Probe the frozen toolchain identity
        run: node tools/validation/phase6/build-verification-corpus.mjs --probe-only
      - name: Run the Phase 6 verifier against the exact head
        env:
          EXPECT_SHA: ${{ inputs.sha }}
          SHADOW: ${{ inputs.shadow }}
        run: |
          set -euo pipefail
          args=(--expect-sha "$EXPECT_SHA")
          if [ "${SHADOW:-false}" = "true" ]; then args+=(--shadow); fi
          node tools/validation/phase6/verify.mjs "${args[@]}"
      - name: Publish Phase 6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-release-evidence-${{ inputs.sha }}
          path: |
            reports/phase6/phase6-release-evidence.json
            reports/phase6/phase6-release-evidence.md
          if-no-files-found: error
