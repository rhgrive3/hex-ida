name: Universal binary platform

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/binary/**'
      - 'js/bytesource/**'
      - 'js/architecture/**'
      - 'js/targets/**'
      - 'js/semantics/**'
      - 'js/analysis/**'
      - 'js/decompiler/**'
      - 'js/ir*.js'
      - 'js/dataflow*.js'
      - 'js/controlflow.js'
      - 'js/blocks.js'
      - 'js/analyze.js'
      - 'js/backend.js'
      - 'js/platform/capability-maturity.js'
      - 'js/platform/capstone-disasm-worker.js'
      - 'capstone.js'
      - 'capstone.wasm'
      - 'tests/universal-binary*.mjs'
      - 'tests/binary-platform.mjs'
      - 'tests/capability-maturity.mjs'
      - 'tests/issue-495-elf-relocation-budget.mjs'
      - 'tests/issue-513-elf-symbol-budget.mjs'
      - 'tools/benchmark/**'
      - 'scripts/fetch-real-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/universal-platform.yml'
  push:
    branches: [main]
    paths:
      - 'js/binary/**'
      - 'js/bytesource/**'
      - 'js/architecture/**'
      - 'js/targets/**'
      - 'js/semantics/**'
      - 'js/analysis/**'
      - 'js/decompiler/**'
      - 'js/ir*.js'
      - 'js/dataflow*.js'
      - 'js/controlflow.js'
      - 'js/blocks.js'
      - 'js/analyze.js'
      - 'js/backend.js'
      - 'js/platform/capability-maturity.js'
      - 'js/platform/capstone-disasm-worker.js'
      - 'capstone.js'
      - 'capstone.wasm'
      - 'tests/universal-binary*.mjs'
      - 'tests/binary-platform.mjs'
      - 'tests/capability-maturity.mjs'
      - 'tests/issue-495-elf-relocation-budget.mjs'
      - 'tests/issue-513-elf-symbol-budget.mjs'
      - 'tools/benchmark/**'
      - 'scripts/fetch-real-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/universal-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-shards:
    name: universal-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify capability and relocation contracts
        id: contracts
        continue-on-error: true
        run: node tests/capability-maturity.mjs && node tests/issue-495-elf-relocation-budget.mjs && node tests/issue-513-elf-symbol-budget.mjs
      - name: Verify universal binary behavior
        id: binary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run binary:test
      - name: Verify universal binary gate
        id: binary_gate
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run binary:gate
      - name: Require all universal verification suites
        if: ${{ !cancelled() }}
        env:
          CONTRACTS: ${{ steps.contracts.outcome }}
          BINARY: ${{ steps.binary.outcome }}
          BINARY_GATE: ${{ steps.binary_gate.outcome }}
        shell: bash
        run: |
          if [[ "$CONTRACTS" != "success" || "$BINARY" != "success" || "$BINARY_GATE" != "success" ]]; then
            echo "::error::Universal validation failed (contracts=$CONTRACTS, binary=$BINARY, binary-gate=$BINARY_GATE)."
            exit 1
          fi

  manual-full-check:
    name: universal-manual-full-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  verify:
    name: verify
    if: always()
    needs: [verify-shards, manual-full-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require universal platform coverage
        env:
          SHARD_RESULT: ${{ needs.verify-shards.result }}
          FULL_RESULT: ${{ needs.manual-full-check.result }}
        shell: bash
        run: |
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "::error::Universal platform verification failed ($SHARD_RESULT)."
            exit 1
          fi
          if [[ "$FULL_RESULT" != "success" && "$FULL_RESULT" != "skipped" ]]; then
            echo "::error::Manual full check failed ($FULL_RESULT)."
            exit 1
          fi

  benchmark:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
      HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
      HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and verify pinned real fixtures
        run: |
          npm run fixtures:fetch
          npm run fixtures:check
      - name: Run reproducible binary benchmark
        shell: bash
        run: |
          set -o pipefail
          npm --silent run binary:benchmark | tee universal-platform-benchmark.json
      - name: Deterministic work regression gate
        run: node tools/benchmark/compare.mjs --binary=universal-platform-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: universal-platform-benchmark
          path: universal-platform-benchmark.json
          if-no-files-found: error
