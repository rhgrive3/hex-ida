name: Universal binary platform

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/binary/**'
      - 'js/bytesource/**'
      - 'js/architecture/**'
      - 'js/targets/**'
      - 'js/semantics/**'
      - 'js/analysis/**'
      - 'js/decompiler/**'
      - 'js/ir*.js'
      - 'js/dataflow*.js'
      - 'js/controlflow.js'
      - 'js/blocks.js'
      - 'js/analyze.js'
      - 'js/backend.js'
      - 'js/platform/capability-maturity.js'
      - 'js/platform/capstone-disasm-worker.js'
      - 'capstone.js'
      - 'capstone.wasm'
      - 'tests/universal-binary*.mjs'
      - 'tests/binary-platform.mjs'
      - 'tests/capability-maturity.mjs'
      - 'tests/issue-495-elf-relocation-budget.mjs'
      - 'tests/issue-513-elf-symbol-budget.mjs'
      - 'tools/benchmark/**'
      - 'scripts/fetch-real-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/universal-platform.yml'
  push:
    branches: [main]
    paths:
      - 'js/binary/**'
      - 'js/bytesource/**'
      - 'js/architecture/**'
      - 'js/targets/**'
      - 'js/semantics/**'
      - 'js/analysis/**'
      - 'js/decompiler/**'
      - 'js/ir*.js'
      - 'js/dataflow*.js'
      - 'js/controlflow.js'
      - 'js/blocks.js'
      - 'js/analyze.js'
      - 'js/backend.js'
      - 'js/platform/capability-maturity.js'
      - 'js/platform/capstone-disasm-worker.js'
      - 'capstone.js'
      - 'capstone.wasm'
      - 'tests/universal-binary*.mjs'
      - 'tests/binary-platform.mjs'
      - 'tests/capability-maturity.mjs'
      - 'tests/issue-495-elf-relocation-budget.mjs'
      - 'tests/issue-513-elf-symbol-budget.mjs'
      - 'tools/benchmark/**'
      - 'scripts/fetch-real-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/universal-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
  HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP

jobs:
  universal-platform:
    name: universal-platform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Fetch and verify pinned real fixtures
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          npm run fixtures:fetch
          npm run fixtures:check

      - name: Run independent platform proofs on the same runner
        shell: bash
        run: |
          set -euo pipefail
          npm run binary:test >"$RUNNER_TEMP/binary.log" 2>&1 &
          p_binary=$!
          npm run binary:gate >"$RUNNER_TEMP/binary-gate.log" 2>&1 &
          p_gate=$!
          (
            node tests/capability-maturity.mjs &&
            node tests/issue-495-elf-relocation-budget.mjs &&
            node tests/issue-513-elf-symbol-budget.mjs
          ) >"$RUNNER_TEMP/contracts.log" 2>&1 &
          p_contracts=$!

          p_benchmark=''
          if [[ "${{ github.event_name }}" == pull_request || "${{ github.event_name }}" == workflow_dispatch ]]; then
            npm --silent run binary:benchmark > universal-platform-benchmark.json 2>"$RUNNER_TEMP/benchmark.log" &
            p_benchmark=$!
          fi

          status=0
          wait "$p_binary" || status=1
          wait "$p_gate" || status=1
          wait "$p_contracts" || status=1
          if [[ -n "$p_benchmark" ]]; then wait "$p_benchmark" || status=1; fi

          for name in binary binary-gate contracts benchmark; do
            if [[ -f "$RUNNER_TEMP/${name}.log" ]]; then
              echo "===== ${name} ====="
              cat "$RUNNER_TEMP/${name}.log"
            fi
          done
          exit "$status"

      - name: Deterministic work regression gate
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: node tools/benchmark/compare.mjs --binary=universal-platform-benchmark.json

      - name: Manual full repository check
        if: github.event_name == 'workflow_dispatch'
        env:
          HEX_PHASE_TEST_CONCURRENCY: 3
          HEX_INVARIANT_CONCURRENCY: 3
        run: npm run check

      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && always()
        with:
          name: universal-platform-benchmark
          path: universal-platform-benchmark.json
          if-no-files-found: warn
