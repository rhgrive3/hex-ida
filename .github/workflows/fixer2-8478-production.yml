name: Fixer 2 production 8478

on:
  push:
    branches:
      - fixer2/issue-8478-arm64-packed-frame-size

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixer2/issue-8478-arm64-packed-frame-size
          fetch-depth: 0
      - name: Apply production edit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/binary/pe-loader-core.js')
          s = p.read_text()
          needle = """  return { size:bytes, xdataRva, version, hasHandler, packedEpilog, epilogCount, codeWords };\n}\n\nexport function parseExceptionFunctions"""
          insert = """  return { size:bytes, xdataRva, version, hasHandler, packedEpilog, epilogCount, codeWords };\n}\n\nfunction arm64PackedFrameFields(unwindData) {\n  const regF = (unwindData >>> 13) & 0x7;\n  const regI = (unwindData >>> 16) & 0xf;\n  const home = (unwindData >>> 20) & 0x1;\n  const cr = (unwindData >>> 21) & 0x3;\n  const frameSize = (unwindData >>> 23) & 0x1ff;\n  const integerSaveBytes = regI * 8 + (cr === 1 ? 8 : 0);\n  const fpSaveBytes = regF === 0 ? 0 : (regF + 1) * 8;\n  const mandatoryBytes = integerSaveBytes + fpSaveBytes + (home ? 64 : 0);\n  const saveAreaBytes = Math.ceil(mandatoryBytes / 16) * 16;\n  return { regF, regI, home, cr, frameSize, frameBytes:frameSize * 16, saveAreaBytes };\n}\n\nexport function parseExceptionFunctions"""
          old = """        // Packed unwind encodes RegI as the count of saved nonvolatile integer\n        // registers x19-x28; only 10 such registers exist, so values 11-15\n        // cannot describe a valid function prologue (#5673).\n        const packedRegI=(unwindData>>>16)&0xf;if(packedRegI>10){invalidExceptionRecord(image,'arm64-pdata',budget,'arm64-packed-registers',`Ignored ARM64 packed unwind entry with invalid RegI ${packedRegI} (x19-x28 hold at most 10 registers) at RVA 0x${begin.toString(16)}`);previousBegin=begin;continue;}\n        const bytes=functionLength*4;"""
          new = """        // Decode the packed frame as one structural unit: individual fields can\n        // be representable while their combination is impossible.  Windows'\n        // canonical packed-unwind reconstruction requires FrameSize to cover\n        // the rounded integer/FP save area plus the optional x0-x7 home area.\n        const packed=arm64PackedFrameFields(unwindData);\n        if(packed.regI>10){invalidExceptionRecord(image,'arm64-pdata',budget,'arm64-packed-registers',`Ignored ARM64 packed unwind entry with invalid RegI ${packed.regI} (x19-x28 hold at most 10 registers) at RVA 0x${begin.toString(16)}`);previousBegin=begin;continue;}\n        if(packed.frameBytes<packed.saveAreaBytes){invalidExceptionRecord(image,'arm64-pdata',budget,'arm64-packed-frame-size',`Ignored ARM64 packed unwind entry whose FrameSize ${packed.frameBytes} byte(s) cannot contain the mandatory ${packed.saveAreaBytes}-byte save/home area at RVA 0x${begin.toString(16)}`);previousBegin=begin;continue;}\n        const bytes=functionLength*4;"""
          assert s.count(needle) == 1
          assert s.count(old) == 1
          s = s.replace(needle, insert, 1).replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate production edit
        run: |
          node --check js/binary/pe-loader-core.js
          node tests/phase4/binary/issue-8478-pe-arm64-packed-frame-size.test.mjs
          node tests/phase4/binary/issue-5673-pe-arm64-packed-regi.test.mjs
      - name: Commit production edit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/pe-loader-core.js
          git commit -m "fix(pe): validate ARM64 packed unwind frame size (#8478)"
      - name: Push production edit
        run: git push origin HEAD:fixer2/issue-8478-arm64-packed-frame-size
