name: tmp-review-8521-finalize
on:
  push:
    branches: [fix/review-8521-current-main-r2]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/tmp/pr8521-current-main.patch.b64 > /tmp/pr8521.patch
          echo '22d34511e9b84ac16b68542ef80738b168666aac76060a31f8e1787cd5072b63  /tmp/pr8521.patch' | sha256sum -c -
          git apply --check /tmp/pr8521.patch
          git apply /tmp/pr8521.patch
      - name: Verify production IR dialect
        run: timeout 25s node --test tests/phase9/translate/issue-4132-production-ir-dialect.test.mjs
      - name: Verify proof-tool authority boundary
        run: timeout 25s node --test tests/phase9/integration/issue-4132-tool-plane-verification.test.mjs
      - name: Verify single-tool-call contract
        run: timeout 20s node --test tests/phase9/integration/issue-4079-single-tool-call-per-turn.test.mjs
      - name: Verify current-main runtime verifier bridge preserved
        run: timeout 25s node --test tests/phase12/adversarial/issue-4325-runtime-verifier-authority.test.mjs
      - name: Syntax lint
        run: timeout 35s node tests/check.mjs
      - name: Commit exact repaired head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/tmp/pr8521-current-main.patch.b64
          rm .github/workflows/tmp-review-8521-finalize.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          for p in \
            .github/tmp/pr8521-current-main.patch.b64 \
            .github/workflows/tmp-review-8521-finalize.yml \
            js/ai/tools/registry.js \
            js/symbolic/translate/semantic-ir.js \
            js/symbolic/translate/support-matrix.js \
            tests/phase9/integration/issue-4079-single-tool-call-per-turn.test.mjs \
            tests/phase9/integration/issue-4132-tool-plane-verification.test.mjs \
            tests/phase9/translate/issue-4132-production-ir-dialect.test.mjs; do
            printf '%s\n' "$changed" | grep -qx "$p"
          done
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: source-bind symbolic verifier authority on current main'
          git push origin HEAD:fix/review-8521-current-main-r2
