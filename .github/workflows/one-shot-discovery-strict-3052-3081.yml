name: One-shot discovery strict boundaries 3052 3081
on:
  push:
    branches: [fix/discovery-strict-current-3052-3081]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discovery-strict-current-3052-3081
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tools/one-shot-discovery-strict-3052-3081.py
      - run: node --check js/analysis/discovery/fusion.js && node --check js/analysis/discovery/producers.js
      - run: node tests/phase7/discovery/strict-boundaries-3052-3081.test.mjs
      - run: git diff --check
      - name: Commit clean result
        run: |
          rm .github/workflows/one-shot-discovery-strict-3052-3081.yml tools/one-shot-discovery-strict-3052-3081.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(discovery): harden registry budgets and patterns"
          git push
