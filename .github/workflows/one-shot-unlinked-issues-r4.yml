name: One-shot unlinked issue runner repair r4

on:
  push:
    branches:
      - fix/unlinked-issues-2377-2388-2393-2478
    paths:
      - .github/workflows/one-shot-unlinked-issues-r4.yml

permissions:
  contents: write

jobs:
  repair-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-issues-2377-2388-2393-2478
          fetch-depth: 0
      - name: Patch runner and retrigger source repair
        shell: bash
        run: |
          echo '' | base64 -d | python3
          rm -f .github/workflows/one-shot-unlinked-issues-r2.yml .github/workflows/one-shot-unlinked-issues-r3.yml .github/workflows/one-shot-unlinked-issues-r4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows
          git commit -m 'chore: repair one-shot ABI entry register discovery'
          git push origin HEAD:fix/unlinked-issues-2377-2388-2393-2478