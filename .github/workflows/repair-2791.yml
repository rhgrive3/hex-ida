name: Repair issue 2791

on:
  push:
    branches:
      - fix/notable-functions-limit-2791

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notable-functions-limit-2791
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply strict limit validation and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('js/auto.js')
          text = path.read_text()
          old = "  const result = out.slice(0, Math.max(0, Number(limit)));"
          new = "  const normalizedLimit = (typeof limit === 'number' && Number.isFinite(limit) && Number.isInteger(limit))\n    ? Math.max(0, limit)\n    : 12;\n  const result = out.slice(0, normalizedLimit);"
          if old not in text:
              raise SystemExit('expected notableFunctions limit expression not found')
          if text.count(old) != 1:
              raise SystemExit('expected exactly one notableFunctions limit expression')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/issue-2791-notable-functions-limit.mjs')
          test.write_text(r'''import assert from 'node:assert/strict';
          import { notableFunctions } from '../js/auto.js';

          const funcs = [0x1000n, 0x1010n, 0x1020n];
          const symbols = {
            funcs,
            functionCount: funcs.length,
            functionAt(addr) { return { start:addr, end:addr + 0x10n }; },
            nameAt(addr) { return `fn_${addr.toString(16)}`; },
          };
          const region = { vmAddr:0x1000n, size:0x40n };
          const program = {
            functionRange(addr) { return { start:addr, end:addr + 0x10n }; },
            statsOf() { return { total:10, numeric:0, store:0, load:0, cmp:2 }; },
            callCountOf() { return 2; },
          };

          assert.equal(notableFunctions(program, symbols, region).length, 3);
          assert.equal(notableFunctions(program, symbols, region, 1).length, 1);
          assert.equal(notableFunctions(program, symbols, region, 0).length, 0);
          assert.equal(notableFunctions(program, symbols, region, -1).length, 0);

          for (const malformed of [['1'], [], true, false, '1', NaN, Infinity, 1.5, { valueOf() { return 1; } }]) {
            assert.equal(
              notableFunctions(program, symbols, region, malformed).length,
              3,
              `malformed limit ${String(malformed)} must not be coerced into a coverage-reducing count`,
            );
          }

          console.log('issue #2791 notableFunctions limit validation regression passed');
          ''')
          PY
          node tests/issue-2791-notable-functions-limit.mjs
          rm .github/workflows/repair-2791.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/auto.js tests/issue-2791-notable-functions-limit.mjs .github/workflows/repair-2791.yml
          git commit -m 'fix(auto): validate notableFunctions limit (#2791)'
          git push origin HEAD:fix/notable-functions-limit-2791
