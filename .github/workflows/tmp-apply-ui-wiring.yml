name: Temporary apply UI wiring patch

on:
  push:
    branches:
      - fix/issues-2511-2555-ui-wiring
    paths:
      - .github/workflows/tmp-apply-ui-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged patch and verify
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/remaining.patch.part1 .tmp/remaining.patch.part2 .tmp/remaining.patch.part3 .tmp/remaining.patch.part4 > /tmp/remaining.patch
          git apply --check /tmp/remaining.patch
          git apply /tmp/remaining.patch
          rm -f .tmp/remaining.patch.part1 .tmp/remaining.patch.part2 .tmp/remaining.patch.part3 .tmp/remaining.patch.part4
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/tmp-apply-ui-wiring.yml
          node --check js/tools.js
          node --check js/ui/panels/function-analysis.js
          node --check js/ui/panels/navigation.js
          node --check js/ui/explorer-index.js
          node --check js/emu.js
          node --check js/tools-base.js
          node tests/issues-frontend-wiring-2511-2555.mjs
          node tests/ux.mjs
      - name: Commit applied source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): close ten frontend analysis wiring regressions"
          git push origin HEAD:fix/issues-2511-2555-ui-wiring
