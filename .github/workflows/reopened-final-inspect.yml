name: Reopened final inspection
on:
  push:
    branches: [fix/reopened-audit-final-20260830]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reopened-audit-final-20260830
          fetch-depth: 0
      - name: Collect exact wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          keys = [
            'installDemandDrivenAnalysis','createAppAnalysisQueryAdapter','ensureProgramForFunction','ensureIncomingRefs','ensureOutgoingRefs',
            'async ensureProgram','async ensureFunctions','scanProgram(','ensureRecognition({ maxFunctions: 350000','ensureRecognition(',
            'async ensureObjc','buildObjcRuntimeModel(','async ensureSwift','readAt(addr, len','readAt(addr,len',
            'InvestigationService','prepareGoal','prepare(app','showCandidates','runInvestigation','analysisQueries.investigate',
            'ensureBinaryId','sha256BlobHex','ensureContentHash','background','requestIdleCallback',
            'loadDiffBaseline','loadBaseline(','functionsFromSymbols','renderDiff','baselineSequence',
            'ensureShapes','ensureStrings','awaitCancellableProducer','createSharedAnalysisProducer'
          ]
          roots=[Path('js'),Path('tests'),Path('tools')]
          out=[]
          for key in keys:
            out.append(f'===== {key} =====')
            hits=0
            for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                if not p.is_file() or p.suffix not in {'.js','.mjs','.ts'}: continue
                try: lines=p.read_text(errors='replace').splitlines()
                except Exception: continue
                for i,line in enumerate(lines):
                  if key in line:
                    hits += 1
                    lo=max(0,i-14); hi=min(len(lines),i+28)
                    out.append(f'--- {p}:{i+1} ---')
                    out.extend(f'{j+1:05d}: {lines[j]}' for j in range(lo,hi))
            out.append(f'hits={hits}')
          Path('.github/reopened-final-inspection.txt').write_text('\n'.join(out))
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/reopened-final-inspection.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: capture reopened final wiring'
          git push origin HEAD:fix/reopened-audit-final-20260830
