name: Temporary PR9121 lint diagnosis

on:
  push:
    branches:
      - diag/pr9121-lint-20260917
    paths:
      - '.github/workflows/tmp-pr9121-lint-diag.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture first lint failure only
        id: lint
        shell: bash
        run: |
          set +e
          timeout 240s npm run lint >/tmp/lint.out 2>&1
          rc=$?
          {
            echo "exit_code=$rc"
            head -n 80 /tmp/lint.out
          } > pr9121-lint-first.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr9121-lint-first
          path: pr9121-lint-first.txt
          retention-days: 1
      - name: Preserve failure status
        run: test '${{ steps.lint.outputs.exit_code }}' = '0'
