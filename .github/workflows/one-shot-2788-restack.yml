name: One-shot 2788 restack
on:
  push:
    branches: [fix/2788-restack-final]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate canonical Stage2 inventory
        run: |
          node tools/validation/stage2/build-profile-denominator-inventory.mjs
          if ! git diff --quiet -- tools/validation/stage2/profile-denominator-inventory.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tools/validation/stage2/profile-denominator-inventory.json
            git commit -m "test(stage2): sync canonical denominator inventory"
          fi
      - name: Regenerate canonical Stage2 lock
        run: |
          node tools/validation/stage2/build-profile-denominator-lock.mjs
          if ! git diff --quiet -- tools/validation/stage2/profile-denominators.lock.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tools/validation/stage2/profile-denominators.lock.json
            git commit -m "test(stage2): sync canonical denominator lock"
          fi
      - name: Focused regression
        run: |
          node tests/architecture-id-strict-validation.mjs
          node tests/stage2/run.mjs
      - name: Push canonical result
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/fix/2788-restack-final)" ]; then
            git push origin HEAD:fix/2788-restack-final
          fi
