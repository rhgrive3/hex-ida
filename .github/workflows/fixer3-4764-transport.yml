name: Fixer 3 Issue 4764 transport

on:
  push:
    branches:
      - fixer3/transport-4764-20260912-1805

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout transport ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build, validate, and publish canonical branch
        shell: bash
        env:
          EXPECTED_MAIN: 9d69566df99831ec115bf18fb1e2795017363ad1
          TARGET_BRANCH: fixer3/issue-4764-register-effects
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git checkout -B "$TARGET_BRANCH" origin/main

          test "$(git hash-object js/analysis/summary/interprocedural.js)" = "131185b2b38dd28d0bc9f2e1e9d17e71165476b2"
          test "$(git hash-object js/analysis/summary/local-core.js)" = "caef9f6b7ae6f6b135f7cb2d69effc6a3223fad4"
          test "$(git hash-object js/analysis/summary/local.js)" = "3cdb00e790fc57f339f309133525ca5085802a0b"
          test ! -e tests/phase7/summary/issue-4764-register-effects.test.mjs

          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), got {actual}: {old!r}")
              p.write_text(text.replace(old, new, expected))

          replace_exact(
              'js/analysis/summary/interprocedural.js',
              "export const INTERPROCEDURAL_ANALYZER_VERSION = '1.3.1';",
              "export const INTERPROCEDURAL_ANALYZER_VERSION = '1.3.2';",
          )
          replace_exact(
              'js/analysis/summary/interprocedural.js',
              "  const calleeStatuses = [];\n  const noreturn = [local.noreturn];",
              "  const calleeStatuses = [];\n  const registerEffects = new Set(local.registerEffects);\n  const noreturn = [local.noreturn];",
          )
          replace_exact(
              'js/analysis/summary/interprocedural.js',
              "    escapes.push(...callee.escapes);\n    // Keep provenance-bearing unresolved effects",
              "    escapes.push(...callee.escapes);\n    for (const effect of callee.registerEffects) registerEffects.add(effect);\n    // Keep provenance-bearing unresolved effects",
          )
          replace_exact(
              'js/analysis/summary/interprocedural.js',
              "    registerEffects: local.registerEffects,\n    memoryReadRegions:",
              "    registerEffects: [...registerEffects],\n    memoryReadRegions:",
          )
          replace_exact(
              'js/analysis/summary/local-core.js',
              "export const LOCAL_SUMMARY_ANALYZER_VERSION = '1.2.0';",
              "export const LOCAL_SUMMARY_ANALYZER_VERSION = '1.2.1';",
          )
          replace_exact(
              'js/analysis/summary/local-core.js',
              "      memoryWriteRegions.push(...resolved.memoryWriteRegions.map((effect) => createMemoryEffect({ ...effect })));\n      for (const unknown of resolved.unknownCallEffects) {",
              "      memoryWriteRegions.push(...resolved.memoryWriteRegions.map((effect) => createMemoryEffect({ ...effect })));\n      for (const effect of resolved.registerEffects) registerEffects.add(effect);\n      for (const unknown of resolved.unknownCallEffects) {",
          )
          replace_exact(
              'js/analysis/summary/local.js',
              "export const LOCAL_SUMMARY_ANALYZER_VERSION = '1.2.0';",
              "export const LOCAL_SUMMARY_ANALYZER_VERSION = '1.2.1';",
          )
          PY

          cat > tests/phase7/summary/issue-4764-register-effects.test.mjs <<'TEST_EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';

          import { createAnalysisStatus } from '../../../js/analysis/status.js';
          import { createFunctionSummary } from '../../../js/analysis/summary/contract.js';
          import { solveInterproceduralSummaries } from '../../../js/analysis/summary/interprocedural.js';
          import { buildLocalFunctionSummary } from '../../../js/analysis/summary/local.js';
          import { buildFixture } from '../corpus/fixtures.mjs';

          const SNAPSHOT = 'snapshot-4764';

          function completeStatus() {
            return createAnalysisStatus({
              snapshotId: SNAPSHOT,
              analyzerId: 'phase7.summary.local',
              analyzerVersion: '1.2.0',
              completeness: 'complete',
              stopReason: null,
            });
          }

          function summary(functionId, { registerEffects = [], directCalls = [], indirectCallSets = [] } = {}) {
            return createFunctionSummary({
              functionId,
              registerEffects,
              directCalls,
              indirectCallSets,
              noreturn: false,
              mayThrow: false,
              status: completeStatus(),
            });
          }

          function direct(callSiteId, target) {
            return { callSiteId, targetEntityIds: [target], effectSource: 'proven-summary' };
          }

          test('issue-4764: direct callee register effects propagate to the caller', () => {
            const caller = summary('caller', { directCalls: [direct('call-b', 'callee')] });
            const callee = summary('callee', { registerEffects: ['state:r0'] });
            const solved = solveInterproceduralSummaries({
              roots: ['caller'],
              localSummaries: new Map([['caller', caller], ['callee', callee]]),
              snapshotId: SNAPSHOT,
            });
            assert.deepEqual(solved.summaries.get('caller').registerEffects, ['state:r0']);
          });

          test('issue-4764: register effects propagate transitively through an acyclic chain', () => {
            const a = summary('a', { directCalls: [direct('a-b', 'b')] });
            const b = summary('b', { directCalls: [direct('b-c', 'c')] });
            const c = summary('c', { registerEffects: ['state:r2'] });
            const solved = solveInterproceduralSummaries({
              roots: ['a'],
              localSummaries: new Map([['a', a], ['b', b], ['c', c]]),
              snapshotId: SNAPSHOT,
            });
            assert.deepEqual(solved.summaries.get('b').registerEffects, ['state:r2']);
            assert.deepEqual(solved.summaries.get('a').registerEffects, ['state:r2']);
          });

          test('issue-4764: exhaustive indirect candidates union and canonicalize register effects', () => {
            const caller = summary('dispatch', {
              registerEffects: ['state:r3'],
              indirectCallSets: [{
                callSiteId: 'dispatch.multi',
                candidateEntityIds: ['left', 'right'],
                exhaustive: true,
              }],
            });
            const left = summary('left', { registerEffects: ['state:r1', 'state:r3'] });
            const right = summary('right', { registerEffects: ['state:r0', 'state:r1'] });
            const solved = solveInterproceduralSummaries({
              roots: ['dispatch'],
              localSummaries: new Map([['dispatch', caller], ['left', left], ['right', right]]),
              snapshotId: SNAPSHOT,
            });
            assert.deepEqual(solved.summaries.get('dispatch').registerEffects,
              ['state:r0', 'state:r1', 'state:r3']);
          });

          test('issue-4764: mutual recursion reaches a register-effect fixed point', () => {
            const a = summary('ra', { directCalls: [direct('ra-rb', 'rb')] });
            const b = summary('rb', {
              registerEffects: ['state:r7'],
              directCalls: [direct('rb-ra', 'ra')],
            });
            const solved = solveInterproceduralSummaries({
              roots: ['ra'],
              localSummaries: new Map([['ra', a], ['rb', b]]),
              snapshotId: SNAPSHOT,
            });
            assert.equal(solved.status.completeness, 'complete');
            assert.deepEqual(solved.summaries.get('ra').registerEffects, ['state:r7']);
            assert.deepEqual(solved.summaries.get('rb').registerEffects, ['state:r7']);
          });

          test('issue-4764: local resolved-callee folding includes register effects', () => {
            const built = buildFixture('pure-call-no-barrier');
            const callNode = built.ir.nodes.find((node) => node.kind === 'call');
            assert.ok(callNode);
            const calleeId = callNode.call.targetEntityIds[0];
            const callee = summary(calleeId, { registerEffects: ['state:r9'] });
            const result = buildLocalFunctionSummary(built.ir, built.cfg, built.ssa, built.memorySsa, {
              snapshotId: SNAPSHOT,
              resolveRegion: built.resolveRegion,
              calleeSummaries: new Map([[calleeId, callee]]),
            });
            assert.deepEqual(result.summary.registerEffects, ['state:r9']);
          });


          test('issue-4764: unresolved calls do not make empty registerEffects authoritative', () => {
            const caller = summary('unresolved-caller', {
              directCalls: [direct('call-missing', 'missing-callee')],
            });
            const solved = solveInterproceduralSummaries({
              roots: ['unresolved-caller'],
              localSummaries: new Map([['unresolved-caller', caller]]),
              snapshotId: SNAPSHOT,
            });
            const result = solved.summaries.get('unresolved-caller');
            assert.deepEqual(result.registerEffects, []);
            assert.notEqual(result.status.completeness, 'complete');
            assert.ok(result.unknownCallEffects.some((effect) => effect.callSiteId === 'call-missing'));
            assert.ok(result.memoryWriteRegions.some((effect) => effect.broad));
          });
          TEST_EOF

          test "$(git hash-object js/analysis/summary/interprocedural.js)" = "b76826324341a525762374188d86045c71a3fa72"
          test "$(git hash-object js/analysis/summary/local-core.js)" = "bf0101b3d8362570ff9b526f94bb189f554551c2"
          test "$(git hash-object js/analysis/summary/local.js)" = "05319faf701748962dfdace8df8db64ce773c826"
          test "$(git hash-object tests/phase7/summary/issue-4764-register-effects.test.mjs)" = "825dba944666d8211ff815cd798fbdcd3c007af7"

          node --check js/analysis/summary/interprocedural.js
          node --check js/analysis/summary/local-core.js
          node --check js/analysis/summary/local.js
          node --check tests/phase7/summary/issue-4764-register-effects.test.mjs
          node --test tests/phase7/summary/issue-4764-register-effects.test.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- js/analysis/summary/interprocedural.js js/analysis/summary/local-core.js js/analysis/summary/local.js tests/phase7/summary/issue-4764-register-effects.test.mjs

          expected=$(printf '%s\n' js/analysis/summary/interprocedural.js js/analysis/summary/local-core.js js/analysis/summary/local.js tests/phase7/summary/issue-4764-register-effects.test.mjs | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"

          git diff --cached --check
          git commit -m "fix(summary): propagate callee register effects (#4764)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "published=$(git rev-parse HEAD)"
