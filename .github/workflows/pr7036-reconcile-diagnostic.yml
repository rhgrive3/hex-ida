name: PR7036 staging reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/pr7036-reconcile-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report current-main reconciliation without mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          ours="$(git rev-parse HEAD)"
          theirs="$(git rev-parse origin/main)"
          set +e
          merge_tree="$(git merge-tree --write-tree "$ours" "$theirs" 2>&1)"
          rc=$?
          set -e
          {
            echo '## PR #7036 staging reconciliation report'
            echo
            echo "head=$ours"
            echo "main=$theirs"
            echo "merge_tree_exit=$rc"
            echo
            echo '```text'
            printf '%s\n' "$merge_tree"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            exit 1
          fi
