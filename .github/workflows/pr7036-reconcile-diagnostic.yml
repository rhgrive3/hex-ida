name: PR7036 reconcile diagnostic

on:
  push:
    branches:
      - sync/pr7036-main-20260917
    paths:
      - '.github/workflows/pr7036-reconcile-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conflicts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          mkdir -p reconcile-artifact/{base,ours,theirs,merge}
          git diff --name-only --diff-filter=U | sort -u > reconcile-artifact/conflicts.txt
          count=$(wc -l < reconcile-artifact/conflicts.txt | tr -d ' ')
          {
            echo "## PR #7036 reconciliation"
            echo
            echo "merge_exit=$rc"
            echo "conflict_count=$count"
            echo
            echo '```text'
            cat reconcile-artifact/conflicts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            for stage in 1 2 3; do
              case "$stage" in
                1) out="reconcile-artifact/base/$p" ;;
                2) out="reconcile-artifact/ours/$p" ;;
                3) out="reconcile-artifact/theirs/$p" ;;
              esac
              mkdir -p "$(dirname "$out")"
              if ! git show ":$stage:$p" > "$out" 2>/dev/null; then
                printf '__MISSING__\n' > "$out"
              fi
            done
            out="reconcile-artifact/merge/$p"
            mkdir -p "$(dirname "$out")"
            if [ -f "$p" ]; then cp "$p" "$out"; else printf '__MISSING__\n' > "$out"; fi
          done < reconcile-artifact/conflicts.txt
          git merge --abort >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr7036-reconcile-conflicts
          path: reconcile-artifact
          if-no-files-found: error
          retention-days: 3
