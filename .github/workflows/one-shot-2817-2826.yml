name: One-shot semantic strict 2817 2818 2823 2826
on:
  push:
    branches: [fix/2817-2818-2823-2826-semantic-strict]
    paths: [.github/workflows/one-shot-2817-2826.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2817-2818-2823-2826-semantic-strict
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python3 tools/tmp-2817-2826.py
      - name: Focused regression
        run: |
          node tests/semantic-memoryssa-cfg-strict.mjs
          npm run semantic-v2:test
      - name: Syntax check
        run: |
          node --check js/semantics/memoryssa/build.js
          node --check js/semantics/memoryssa/contract.js
          node --check js/semantics/memoryssa/validate.js
          node --check js/semantics/cfg/index.js
      - name: Commit repair
        shell: bash
        run: |
          rm -f tools/tmp-2817-2826.py .github/workflows/one-shot-2817-2826.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(semantic): reject coerced MemorySSA and CFG identities (#2817 #2818 #2823 #2826)'
          git push origin HEAD:fix/2817-2818-2823-2826-semantic-strict
