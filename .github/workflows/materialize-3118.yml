name: One-shot issue 3118 semantic ABI argument metadata
on:
  push:
    branches: [fix/semantic-abi-argument-metadata-3118]
    paths: [.github/workflows/materialize-3118.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semantic-abi-argument-metadata-3118
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply repair
        run: python3 tools/tmp-3118.py
      - name: Focused regression
        run: |
          node tests/phase7/issue-3118-semantic-abi-argument-metadata.test.mjs
          node tests/phase7/run.mjs
      - name: Syntax check
        run: node --check js/analysis/semantic-function-base.js
      - name: Commit repair
        shell: bash
        run: |
          rm -f tools/tmp-3118.py .github/workflows/materialize-3118.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: reject coerced ABI argument metadata (#3118)'
          git push origin HEAD:fix/semantic-abi-argument-metadata-3118
