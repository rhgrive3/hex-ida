name: pr9085-fix-missing-binding
on:
  push:
    branches:
      - fix/issue-8929-stale-evidence-binding
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-8929-stale-evidence-binding
          fetch-depth: 0
      - name: Apply fail-closed provenance fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/ai/proposals.js')
          s = p.read_text()
          old = "    if (typeof bound !== 'string' || !bound) return true;"
          new = "    if (typeof bound !== 'string' || !bound) return false;"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old_comment = "   * that carry no revision-bound provenance are unaffected."
          new_comment = "   * with missing/invalid provenance fail closed whenever a current-binding resolver is configured."
          assert s.count(old_comment) == 1, s.count(old_comment)
          s = s.replace(old_comment, new_comment, 1)
          p.write_text(s)

          p = Path('tests/issue-8929-stale-verified-evidence-binding.test.mjs')
          s = p.read_text()
          anchor = "  // A configured resolver that cannot prove a current binding fails closed.\n"
          assert s.count(anchor) == 1, s.count(anchor)
          regression = """  // A configured resolver also requires provenance on the verified record itself.\n  // Missing sourceBinding is not an implicit revision-invariant authority class.\n  const missing = new ProposalStore({\n    evidenceStore: { get: (id) => (id === 'ev-1' ? { id, status: 'verified' } : null) },\n    currentEvidenceBinding: () => 'current-binding',\n  });\n  assert.throws(() => missing.create(draft(['ev-1'])), (error) => error?.type === 'invalid_tool_call');\n\n"""
          s = s.replace(anchor, regression + anchor, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Test issue 8929
        shell: bash
        run: timeout 180s node tests/issue-8929-stale-verified-evidence-binding.test.mjs
      - name: Test issue 8923
        shell: bash
        run: timeout 120s node tests/issue-8923-proposal-binding-identity.test.mjs
      - name: Syntax check proposals
        shell: bash
        run: timeout 60s node --check js/ai/proposals.js
      - name: Publish clean fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr9085-fix-missing-binding.yml
          git add js/ai/proposals.js tests/issue-8929-stale-verified-evidence-binding.test.mjs
          git diff --cached --check
          git commit -m 'fix(ai): fail closed on missing evidence binding provenance'
          git push origin HEAD:refs/heads/fix/issue-8929-stale-evidence-binding
