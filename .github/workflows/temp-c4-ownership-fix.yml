name: Temporary C4 ownership fix

on:
  push:
    branches:
      - 'feat/analysis-roadmap-v8-current-main-20260907'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'roadmap ownership gaps') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/analysis-roadmap-v8-current-main-20260907
          fetch-depth: 0
      - name: Patch exact roadmap ownership gaps
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const jsonPath = 'tools/validation/analysis-roadmap/ownership.json';
          const manifest = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
          const additions = {
            phase8: [
              'tests/phase8/structuring/conditional-region-body-authority.test.mjs',
              'tests/phase8/structuring/conditional-region-body-projection.test.mjs',
            ],
            integration: [
              'tests/ci/final-head-admission-6570.test.mjs',
              'tests/ci/final-head-admission-auto-reviewer-identity-6570.test.mjs',
              'tests/userscript-embed-child.mjs',
            ],
          };
          for (const [owner, files] of Object.entries(additions)) {
            for (const file of files) if (!manifest.owners[owner].includes(file)) manifest.owners[owner].push(file);
          }
          fs.writeFileSync(jsonPath, `${JSON.stringify(manifest, null, 2)}\n`);

          const jsPath = 'tools/validation/analysis-roadmap/ownership.mjs';
          let src = fs.readFileSync(jsPath, 'utf8');
          const anchor = "    'tests/userscript-publication.mjs', 'tests/userscript-release-version.mjs',";
          const replacement = `${anchor}\n    'tests/userscript-embed-child.mjs',\n    'tests/ci/final-head-admission-6570.test.mjs', 'tests/ci/final-head-admission-auto-reviewer-identity-6570.test.mjs',`;
          if (!src.includes("'tests/userscript-embed-child.mjs'")) {
            if (!src.includes(anchor)) throw new Error('ownership integration anchor missing');
            src = src.replace(anchor, replacement);
          }
          fs.writeFileSync(jsPath, src);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/validation/analysis-roadmap/ownership.json tools/validation/analysis-roadmap/ownership.mjs
          git commit -m 'ci: register roadmap ownership gaps'
          git push origin HEAD:feat/analysis-roadmap-v8-current-main-20260907
