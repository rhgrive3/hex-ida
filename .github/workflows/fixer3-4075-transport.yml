name: Fixer3 4075 transport

on:
  push:
    branches:
      - fix/analysis-4075-instruction-short-read-fixer3-v2

permissions:
  contents: write

jobs:
  transport:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply verified local candidate
        env:
          OLD_B64: ICAgICAgICAgIGNvbnN0IGNvbXBsZXRlbmVzcyA9IHRydW5jYXRlZCA/ICd0cnVuY2F0ZWQnIDogIXJhbmdlQ29tcGxldGUgPyAncGFydGlhbCcgOiAnY29tcGxldGUnOwogICAgICAgICAgcmV0dXJuIHBhZ2VkKHJvd3MsIHBhZ2UsIGNvbXBsZXRlbmVzcywgeyByZWFzb246dHJ1bmNhdGVkID8gJ2luc3RydWN0aW9uLXJlYWQtYnVkZ2V0JyA6IHJhbmdlUmVhc29uIH0pOwo=
          NEW_B64: 
          TEST_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('js/analysis/query/app-adapter.js')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode()
          new = base64.b64decode(os.environ['NEW_B64']).decode()
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one production hunk, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          test = Path('tests/phase7/integration/issue-4075-instruction-short-read-completeness.test.mjs')
          if test.exists():
              raise SystemExit('regression path already exists')
          test.write_bytes(base64.b64decode(os.environ['TEST_B64']))
          PY
          test "$(git hash-object js/analysis/query/app-adapter.js)" = "d6f66076397a11254a52f1311c119de1d75a4627"
          test "$(git hash-object tests/phase7/integration/issue-4075-instruction-short-read-completeness.test.mjs)" = "75d977320b17d203933ddcc60b96ff57581fc7e0"
          node --check js/analysis/query/app-adapter.js
          node --check tests/phase7/integration/issue-4075-instruction-short-read-completeness.test.mjs
          node --test tests/phase7/integration/issue-4075-instruction-short-read-completeness.test.mjs
      - name: Commit exact candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/analysis/query/app-adapter.js tests/phase7/integration/issue-4075-instruction-short-read-completeness.test.mjs
          git commit -m "fix(query): preserve instruction short-read completeness (#4075) [skip actions]"
          git push origin HEAD:${{ github.ref_name }}
