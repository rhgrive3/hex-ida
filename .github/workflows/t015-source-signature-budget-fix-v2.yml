name: T015 source-backed signature budget fix v2

on:
  push:
    branches:
      - fix/t015-code-signature-source-budget-20260917
    paths:
      - .github/workflows/t015-source-signature-budget-fix-v2.yml

permissions:
  contents: write

env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
  HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Defer only large uncached source-backed signature blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('js/apple/knowledge.js')
          text = p.read_text()
          old_const = 'const MAX_SIGNATURE_BLOBS = 4096;'
          new_const = "const MAX_SIGNATURE_BLOBS = 4096;\nconst MAX_SOURCE_BACKED_SIGNATURE_BYTES = 256 * 1024;"
          old_line = "    if (error?.code === 'BINARY_SOURCE_RANGE_MISSING') throw error;"
          new_block = """    if (error?.code === 'BINARY_SOURCE_RANGE_MISSING'
                && input?.__binaryByteBacking === true
                && dataSize > MAX_SOURCE_BACKED_SIGNATURE_BYTES) {
              return signatureResult('partial', {
                complete: false,
                reasons: ['signature-bytes-deferred'],
                provenance,
              });
            }
            if (error?.code === 'BINARY_SOURCE_RANGE_MISSING') throw error;"""
          if text.count(old_const) != 1:
              raise SystemExit(f'signature threshold boundary mismatch: {text.count(old_const)}')
          if text.count(old_line) != 1:
              raise SystemExit(f'code-signature catch boundary mismatch: {text.count(old_line)}')
          text = text.replace(old_const, new_const, 1).replace(old_line, new_block, 1)
          p.write_text(text)
          PY
          node --check js/apple/knowledge.js
      - name: Focused Apple signature regressions
        shell: bash
        run: |
          set +e
          node --test tests/apple-code-signature-source-budget.test.mjs tests/apple-knowledge-x02.test.mjs > /tmp/t015-focused.out 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/t015-focused.out > /tmp/t015-first-failure.txt
            cat /tmp/t015-first-failure.txt >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          tail -n 40 /tmp/t015-focused.out
      - name: Fetch and verify pinned fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm run fixtures:fetch
          npm run fixtures:check
      - name: Verify universal binary benchmark budget
        shell: bash
        run: |
          set +e
          npm --silent run binary:benchmark > /tmp/t015-benchmark.json 2> /tmp/t015-benchmark.err
          status=$?
          if [ "$status" -eq 0 ]; then
            node tools/benchmark/compare.mjs --binary=/tmp/t015-benchmark.json > /tmp/t015-compare.out 2>&1
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            { tail -n 40 /tmp/t015-benchmark.err; tail -n 100 /tmp/t015-compare.out 2>/dev/null || true; } > /tmp/t015-first-failure.txt
            cat /tmp/t015-first-failure.txt >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          tail -n 40 /tmp/t015-compare.out
      - name: Upload focused first-failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: t015-focused-first-failure
          path: /tmp/t015-first-failure.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Commit verified production fix
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/apple/knowledge.js
          git commit -m 'fix(t015): defer large source-backed signature blobs'
          git push origin HEAD:fix/t015-code-signature-source-budget-20260917
