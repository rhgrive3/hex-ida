name: fixer2 issue 8100 transport

on:
  push:
    branches:
      - fixer2/issue-8100-delay-import-hmod-storage
    paths:
      - .github/workflows/fixer2-8100-transport.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run issue 8100 transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply pre-validated Drive-snapshot patch
        run: |
          set -euo pipefail
          cat .github/fixer2/8100.patch.b64.* | base64 -d > /tmp/issue8100.patch
          git apply --check /tmp/issue8100.patch
          git apply /tmp/issue8100.patch
          git rm .github/workflows/fixer2-8100-transport.yml .github/fixer2/8100.patch.b64.*
          git config user.name 'Fixer 2 Binary'
          git config user.email 'fixer2-binary@users.noreply.github.com'
          git add js/binary/pe-loader-core.js js/binary/pe-loader-string-budget.js tests/issues-97-100-146-147.mjs tests/phase4/issue-3695-pe-import-descriptor-termination.test.mjs tests/phase4/binary/issue-3904-pe-delay-import-malformed-thunk.test.mjs tests/phase4/binary/issue-4746-pe-delay-import-reserved-attrs.test.mjs tests/phase4/binary/issue-8100-pe-delay-import-hmod-span.test.mjs tests/phase4/binary/pe-utf8-cstring-budget-6286.test.mjs
          git commit -m 'fix(pe): validate delay module-handle storage (#8100)'
          git push origin HEAD:${GITHUB_REF_NAME}
