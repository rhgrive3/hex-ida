name: Fixer3 transport 5190
on:
  push:
    branches:
      - fixer3/transport-5190-unknown-struct-size
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c90d8b38833ae664defb512be58538e397967f72
          fetch-depth: 1
      - name: Verify base and materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c90d8b38833ae664defb512be58538e397967f72"
          test "$(git hash-object js/analysis/types/graph.js)" = "105e6e837c96d4539b136f11c741ba9228331744"
          python - <<'PY'
          from pathlib import Path
          p = Path('js/analysis/types/graph.js')
          s = p.read_text()
          old1 = """    let maxAlign = explicitAlign ?? 1n;\n"""
          new1 = """    // Absence of size evidence means unknown, not a zero-byte aggregate.\n    // Keep size nullable until an explicit aggregate fact or at least one\n    // concrete member proves it (#5190).\n    let maxAlign = explicitAlign ?? 1n;\n"""
          old2 = """    let calculatedSize = explicitSize ?? 0n;\n"""
          new2 = """    let calculatedSize = explicitSize;\n"""
          old3 = """    const calculatedSizeWire = structuralIntegerWire(calculatedSize);\n    const maxAlignWire = structuralIntegerWire(maxAlign);\n    const structDescriptor = {\n      kind: 'struct',\n      members: updatedMembers,\n      sizeBytes: calculatedSizeWire,\n      totalSizeBytes: calculatedSizeWire,\n      alignBytes: maxAlignWire,\n"""
          new3 = """    const structDescriptor = {\n      kind: 'struct',\n      members: updatedMembers,\n      ...(calculatedSize == null ? {} : {\n        sizeBytes: structuralIntegerWire(calculatedSize),\n        totalSizeBytes: structuralIntegerWire(calculatedSize),\n      }),\n      alignBytes: structuralIntegerWire(maxAlign),\n"""
          for old, new in ((old1,new1),(old2,new2),(old3,new3)):
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one patch anchor, got {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          mkdir -p tests/phase7/types
          cat <<'B64' | base64 -d > tests/phase7/types/issue-5190-structural-unknown-size.test.mjs
          
          B64
          test "$(git hash-object js/analysis/types/graph.js)" = "b9e1471df612dd24325d8d463a79b5486541f7ca"
          test "$(git hash-object tests/phase7/types/issue-5190-structural-unknown-size.test.mjs)" = "fc7f3cc682f1cf7909ce66a06d41552435a06684"
          node --check js/analysis/types/graph.js
          node --check tests/phase7/types/issue-5190-structural-unknown-size.test.mjs
          node --test tests/phase7/types/issue-5190-structural-unknown-size.test.mjs
      - name: Publish clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fixer 3 Analysis"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b fixer3/issue-5190-unknown-struct-size
          git add js/analysis/types/graph.js tests/phase7/types/issue-5190-structural-unknown-size.test.mjs
          git commit -m "fix(types): preserve unknown aggregate size (#5190)"
          git push origin HEAD:refs/heads/fixer3/issue-5190-unknown-struct-size
