name: issue-5302-pr

on:
  push:
    branches:
      - fix/issue-5302-array-type-core-20260917

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-5302-array-type-core-20260917
      - name: Create PR
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/body.md <<'EOF'
          ## Summary
          - implement DEX array/type core semantics and validation
          - preserve typed array memory/fault/result authority through Semantic IR

          ## Verification
          - #5302 focused: 13/13 PASS
          - module boundaries: PASS
          - lint: 4972 files PASS
          - broader DEX: no new failures vs pristine main

          Closes #5302
          EOF
          set +e
          gh pr create --base main --head fix/issue-5302-array-type-core-20260917 --title 'fix(dex): implement array/type core semantics (#5302)' --body-file /tmp/body.md > /tmp/pr-out.txt 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            head -n 20 /tmp/pr-out.txt > /tmp/pr-error.txt
            exit "$code"
          fi
      - name: Upload minimal failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-5302-pr-error
          path: /tmp/pr-error.txt
          retention-days: 1
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/issue-5302-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: remove temporary #5302 PR workflow'
          git push origin HEAD:fix/issue-5302-array-type-core-20260917
