name: issue-5302-pr

on:
  push:
    branches:
      - fix/issue-5302-array-type-core-20260917

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-5302-array-type-core-20260917
      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr list --head fix/issue-5302-array-type-core-20260917 --base main --state open --json number --jq 'length')" = "0" ]; then
            cat > /tmp/body.md <<'EOF'
          ## Summary
          - implement DEX monitor/check-cast/instance-of/array-length/new-array/filled-new-array(/range)/fill-array-data/aget*/aput* semantics
          - add typed array memory bindings, element widths/extensions, null/bounds/store faults, allocation/result authority
          - extend validator widths/references and implicit move-result producer handling
          - preserve array/type semantics through Semantic IR lowering

          ## Verification
          - focused #5302 regression: 13/13 PASS
          - module boundaries: PASS
          - syntax/source lint: 4972 files PASS
          - broader DEX suite: 118/129 PASS; remaining 11 failures reproduce unchanged on pristine main
          - final PR diff is exactly the five intended files

          Closes #5302
          EOF
            gh pr create --base main --head fix/issue-5302-array-type-core-20260917 --title 'fix(dex): implement array/type core semantics (#5302)' --body-file /tmp/body.md
          fi
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/issue-5302-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: remove temporary #5302 PR workflow'
          git push origin HEAD:fix/issue-5302-array-type-core-20260917
