name: Temporary blocker fix 8985

on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-12-batch-04

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply blocker fix #8985'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-campaign-20260914-lane-12-batch-04
          fetch-depth: 0
      - name: Apply exact source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/emu.js')
          text = path.read_text()
          old = """    const key = page.toString();
    if (this.mem.has(key) || this.loaded.has(key)) return;
    if (page >= STACK_TOP - BigInt(STACK_SIZE) && page < STACK_TOP) {
"""
          new = """    const key = page.toString();
    // #8755 follow-up: an existing range-gated synthetic page may already
    // carry a disjoint mapZero() window. A configured heap range that overlaps
    // the same page adds authority; it must compose with (not replace) that
    // existing window before the loaded-page fast return.
    if (this.loaded.has(key) && this.syntheticRangeGated.has(key)) {
      this._syncHeapBase();
      const existingHeapEnd = this.heapBase + this.heapSize;
      if (page < existingHeapEnd && page + BigInt(PAGE) > this.heapBase) {
        const lo = this.heapBase > page ? Number(this.heapBase - page) : 0;
        const hi = existingHeapEnd - page >= BigInt(PAGE) ? PAGE : Number(existingHeapEnd - page);
        let ranges = this.syntheticRanges.get(key);
        if (!ranges) { ranges = []; this.syntheticRanges.set(key, ranges); }
        if (!ranges.some((r) => r.lo === lo && r.hi === hi)) ranges.push({ lo, hi });
        return;
      }
    }
    if (this.mem.has(key) || this.loaded.has(key)) return;
    if (page >= STACK_TOP - BigInt(STACK_SIZE) && page < STACK_TOP) {
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one source match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          workflow = Path('.github/workflows/temp-fix-8985.yml')
          workflow.unlink()
          PY
      - name: Commit blocker fix
        shell: bash
        run: |
          git config user.name 'chatgpt-blocker-fixer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/emu.js .github/workflows/temp-fix-8985.yml
          git diff --cached --check
          git commit -m 'fix(emu): compose heap authority with existing gated page (#8755)'
          git push origin HEAD:codex/issue-campaign-20260914-lane-12-batch-04
