name: One-shot alias strict boundaries 2924 2965
on:
  push:
    branches: [fix/alias-strict-boundaries-current-2924-2965]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused repairs
        run: python3 tools/one-shot-alias-strict-2924-2965.py
      - name: Focused validation
        run: |
          set -euo pipefail
          node --test tests/phase7/alias/strict-authority-boundaries-2924-2965.test.mjs
          git diff --check
      - name: Commit clean production tree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tools/one-shot-alias-strict-2924-2965.py .github/workflows/one-shot-alias-strict-2924-2965.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(alias): harden proof-bearing metadata boundaries'
          git push
