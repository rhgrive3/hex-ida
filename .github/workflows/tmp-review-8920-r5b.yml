name: tmp-review-8920-r5b

on:
  push:
    branches:
      - fix/review-8599-current-main-r1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply pointer-authority conflict fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('js/analyze.js')
          s = p.read_text()
          old = """  const explicit = [width, bytes, bits].filter((value) => value != null);
          if (explicit.length) {
            if (explicit.some((value) => value !== explicit[0])) return null;
            return explicit[0];
          }

          const rawArchitecture = opts.architecture ?? opts.arch ?? opts.cpu ?? null;
          if (rawArchitecture == null) return null;
          if (typeof rawArchitecture !== 'string') return null;
          const architecture = rawArchitecture.trim().toLowerCase();
          const mapped = ARM64_SEMANTIC_POINTER_WIDTH_BYTES.get(architecture);
          return mapped === undefined ? null : mapped;
          """
          new = """  const rawArchitecture = opts.architecture ?? opts.arch ?? opts.cpu ?? null;
          let architectureWidth = null;
          if (rawArchitecture != null) {
            if (typeof rawArchitecture !== 'string') return null;
            const architecture = rawArchitecture.trim().toLowerCase();
            const mapped = ARM64_SEMANTIC_POINTER_WIDTH_BYTES.get(architecture);
            if (mapped === undefined) return null;
            architectureWidth = mapped;
          }

          const explicit = [width, bytes, bits].filter((value) => value != null);
          if (explicit.length) {
            if (explicit.some((value) => value !== explicit[0])) return null;
            if (architectureWidth != null && explicit[0] !== architectureWidth) return null;
            return explicit[0];
          }

          return architectureWidth;
          """
          if s.count(old) != 1:
              raise SystemExit(f'analyze resolver anchor mismatch: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/phase11/shared/issue-8599-no-context-pointer-authority.test.mjs')
          s = p.read_text()
          anchor = "test('#4973: resolveModelTexts with no ABI evidence performs no second read', async () => {\n"
          extra = """test('#4973: architecture and explicit pointer width must agree', () => {
            assert.equal(resolvePointerBytes({ architecture: 'arm64_32', pointerWidth: 8 }), null);
            assert.equal(resolvePointerBytes({ architecture: 'arm64', pointerBytes: 4 }), null);
            assert.equal(resolvePointerBytes({ architecture: 'arm64e', pointerBits: 32 }), null);
            assert.equal(resolvePointerBytes({ architecture: 'unknown', pointerBytes: 8 }), null);
            assert.equal(resolvePointerBytes({ architecture: 'arm64_32', pointerWidth: 4 }), 4);
            assert.equal(resolvePointerBytes({ architecture: 'arm64', pointerBits: 64 }), 8);
            const adjacentCell = new Uint8Array([0x78, 0x56, 0x34, 0x12, 0x04, 0x20, 0x00, 0x00]);
            assert.equal(pointerAt(adjacentCell, { architecture: 'arm64_32', pointerWidth: 8 }), null);
          });

          test('#4973: mixed opts/model/backend width conflict performs no second read', async () => {
            const model = {
              addressRefs: [{ row: 0, addr: 0x3000n }], semantic: [], calls: [], facts: { stringRefs: [] }, pointerWidth: 8,
            };
            const reads = [];
            const backend = {
              pointerBits: 64,
              async readAt(addr) {
                reads.push(addr);
                if (addr === 0x3000n) return {
                  found: true, terminated: false, text: null,
                  bytes: new Uint8Array([0x78, 0x56, 0x34, 0x12, 0x04, 0x20, 0x00, 0x00]),
                };
                return { found: true, terminated: true, text: 'must not be reached', bytes: new Uint8Array() };
              },
            };
            await resolveModelTexts(backend, model, 96, { architecture: 'arm64_32' });
            assert.deepEqual(reads, [0x3000n]);
          });

          """
          extra = extra.replace(/^          /gm, '')
          if s.count(anchor) != 1:
              raise SystemExit(f'test anchor mismatch: {s.count(anchor)}')
          p.write_text(s.replace(anchor, extra + anchor, 1))
          PY
      - name: Verify focused pointer regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s node --check js/analyze.js
          timeout 30s node --test tests/phase11/shared/issue-8599-no-context-pointer-authority.test.mjs
          timeout 20s node tests/issue-4973-arm64-32-pointer-width.mjs
          if [ -f tests/issue-4973-arm64-32-pointer-deref.test.mjs ]; then timeout 20s node --test tests/issue-4973-arm64-32-pointer-deref.test.mjs; fi
      - name: Commit repaired head and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-review-8920-r5.yml
          rm .github/workflows/tmp-review-8920-r5b.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -qx 'js/analyze.js'
          printf '%s\n' "$changed" | grep -qx 'tests/phase11/shared/issue-8599-no-context-pointer-authority.test.mjs'
          printf '%s\n' "$changed" | grep -qx '.github/workflows/tmp-review-8920-r5.yml'
          printf '%s\n' "$changed" | grep -qx '.github/workflows/tmp-review-8920-r5b.yml'
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(review): reject conflicting pointer-width authority'
          git push origin HEAD:fix/review-8599-current-main-r1
