name: tmp-l13-review-fix-8908
on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-03-batch-03
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-campaign-20260914-lane-03-batch-03
          fetch-depth: 0
      - name: Guard exact reviewed parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d44d0927b17aa20dbc8572bb7f4a37dc986f7438"
          test "$(git rev-parse HEAD^^)" = "63bc4e12d3ab4800421d6647ad69893108556e93"
      - name: Apply retained-row heap budget repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once('js/managed/cil/metadata-layout.js', '''    chargeRow() {
              rows++;
              if (rows > limits.maxRows) fail('cil-metadata-resource-limit-rows');
              checkpoint();
            },''', '''    chargeRow(encodedByteLength = 0) {
              if (!Number.isSafeInteger(encodedByteLength) || encodedByteLength < 0)
                fail('cil-metadata-resource-limit-row-size');
              rows++;
              if (rows > limits.maxRows) fail('cil-metadata-resource-limit-rows');
              // A decoded metadata row is retained as a JS object (plus an array
              // slot and property storage), so encoded bytes alone are not a safe
              // heap estimate. Charge a conservative fixed object floor plus the
              // encoded row width before any row object is materialized (#8699).
              const retainedBytes = 256 + encodedByteLength * 4;
              if (!Number.isSafeInteger(retainedBytes)) fail('cil-metadata-resource-limit-row-size');
              heapBytes += retainedBytes;
              if (heapBytes > limits.maxEstimatedHeapBytes) fail('cil-metadata-resource-limit-heap');
              checkpoint();
            },''')

          replace_once('js/managed/cil/metadata-definitions.js',
              '    if (budget) budget.chargeRow();\n    const rid = i + 1, pos = offsets[table] + i * rowSizes[table];',
              '    if (budget) budget.chargeRow(rowSizes[table]);\n    const rid = i + 1, pos = offsets[table] + i * rowSizes[table];')
          replace_once('js/managed/cil/metadata-definitions.js',
              '  const typeSpecs = counts[0x1b] ? Array.from({ length: counts[0x1b] }, (_, i) => {\n    const rid = i + 1, pos = offsets[0x1b] + i * rowSizes[0x1b];',
              '  const typeSpecs = counts[0x1b] ? Array.from({ length: counts[0x1b] }, (_, i) => {\n    if (budget) budget.chargeRow(rowSizes[0x1b]);\n    const rid = i + 1, pos = offsets[0x1b] + i * rowSizes[0x1b];')
          replace_once('js/managed/cil/metadata-generics.js',
              '    if (budget) budget.chargeRow();\n    const rid = i + 1, pos = offsets[table] + i * rowSizes[table];',
              '    if (budget) budget.chargeRow(rowSizes[table]);\n    const rid = i + 1, pos = offsets[table] + i * rowSizes[table];')
          replace_once('js/managed/cil/metadata-manifest-security.js',
              '    if (budget) budget.chargeRow();\n    const rid = i + 1, pos = offsets[table] + i * rowSizes[table];',
              '    if (budget) budget.chargeRow(rowSizes[table]);\n    const rid = i + 1, pos = offsets[table] + i * rowSizes[table];')

          replace_once('js/managed/cil/parser-overlay.js',
              'export function overlayCilMetadata(bytes,parsed,options={}){\n const u8=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes),view=new DataView(u8.buffer,u8.byteOffset,u8.byteLength),pe=peLayout(u8,view);if(!pe?.cliPresent)return parsed;\n const budget=createCilMetadataBudget(options);',
              'export function overlayCilMetadata(bytes,parsed,options={},internalBudget=null){\n const u8=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes),view=new DataView(u8.buffer,u8.byteOffset,u8.byteLength),pe=peLayout(u8,view);if(!pe?.cliPresent)return parsed;\n const budget=internalBudget??createCilMetadataBudget(options);')
          replace_once('js/managed/cil/metadata-manifest-security.js',
              'export function overlayCilManifestSecurity(bytes, parsed, options = {}) {',
              'export function overlayCilManifestSecurity(bytes, parsed, options = {}, internalBudget = null) {')
          replace_once('js/managed/cil/metadata-manifest-security.js',
              '  const budget = createCilMetadataBudget(options);',
              '  const budget = internalBudget ?? createCilMetadataBudget(options);')

          replace_once('js/managed/cil/parser.js',
              "import { overlayCilManifestSecurity } from './metadata-manifest-security.js';\n",
              "import { overlayCilManifestSecurity } from './metadata-manifest-security.js';\nimport { createCilMetadataBudget } from './metadata-layout.js';\n")
          replace_once('js/managed/cil/parser.js', '''function parseCilValidated(bytes, options = {}) {
            return overlayCilManifestSecurity(
              bytes,
              overlayCilMetadata(bytes, parseCilBase(bytes, options), options),
              options,
            );
          }''', '''function parseCilValidated(bytes, options = {}) {
            // One parser-wide authority: metadata and manifest/security overlays
            // share counters instead of each getting a fresh per-phase budget.
            const budget = createCilMetadataBudget(options);
            return overlayCilManifestSecurity(
              bytes,
              overlayCilMetadata(bytes, parseCilBase(bytes, options), options, budget),
              options,
              budget,
            );
          }''')

          test = Path('tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs')
          test.write_text(dedent(r'''\
          import assert from 'node:assert/strict';
          import { buildCil } from '../fixtures/medium-cil.mjs';
          import { parseCil } from '../../../js/managed/cil/parser.js';
          import { createCilMetadataBudget } from '../../../js/managed/cil/metadata-layout.js';

          console.log('[phase11] running issue #8699 retained-row heap budget tests...');

          {
            const budget = createCilMetadataBudget({ resourceBudget: {
              maxRows: 1000, maxEstimatedHeapBytes: 700, maxWork: 1000, deadlineMs: 10_000,
            } });
            budget.chargeRow(8);
            budget.chargeRow(8);
            assert.throws(() => budget.chargeRow(8), /cil-metadata-resource-limit-heap/);
          }

          function genericParamAliasFixture(n) {
            const name = 'g';
            const pre = buildCil({ leadingStrings: [name] });
            const nameOff = pre.layout.leadingStringIndex[name];
            const rows = new Uint8Array(n * 8);
            const view = new DataView(rows.buffer);
            for (let i = 0; i < n; i++) {
              const p = i * 8;
              view.setUint16(p, i, true);
              view.setUint16(p + 2, 0, true);
              view.setUint16(p + 4, (1 << 1) | 0, true);
              view.setUint16(p + 6, nameOff, true);
            }
            const imageSize = 0x400 + 0x100 + rows.length + 0x1800;
            return buildCil({
              types: [{ name: 'T', namespace: 'N', fieldList: 1, methodList: 1 }],
              leadingStrings: [name],
              extraRows: new Map([[0x2a, { count: n, bytes: rows }]]),
              imageSize,
              metadataSize: imageSize - 0x300,
            }).bytes;
          }

          assert.throws(
            () => parseCil(genericParamAliasFixture(64), {
              binaryId: 'row-heap-tiny',
              resourceBudget: {
                maxRows: 10_000,
                maxStrings: 10_000,
                maxStringBytes: 1024 * 1024,
                maxEstimatedHeapBytes: 2048,
                maxWork: 1_000_000,
                deadlineMs: 10_000,
              },
            }),
            /cil-metadata-resource-limit-heap/,
          );

          const admitted = parseCil(genericParamAliasFixture(32), {
            binaryId: 'row-heap-admit',
            resourceBudget: {
              maxRows: 10_000,
              maxStrings: 10_000,
              maxStringBytes: 1024 * 1024,
              maxEstimatedHeapBytes: 1024 * 1024,
              maxWork: 1_000_000,
              deadlineMs: 10_000,
            },
          });
          assert.equal(admitted.genericParams.length, 32);

          console.log('[phase11] issue #8699 retained-row heap budget tests passed');
          '''))
          PY
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 10s node --check js/managed/cil/metadata-layout.js
          timeout 10s node --check js/managed/cil/metadata-definitions.js
          timeout 10s node --check js/managed/cil/metadata-generics.js
          timeout 10s node --check js/managed/cil/metadata-manifest-security.js
          timeout 10s node --check js/managed/cil/parser-overlay.js
          timeout 10s node --check js/managed/cil/parser.js
          timeout 10s node --check tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs
          timeout 45s node tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs
          timeout 90s node tests/phase11/cil/issue-8699-cil-metadata-string-alias-budget.test.mjs
          timeout 90s node tests/phase11/cil/issue-8699-8797-public-parse-single-pass.test.mjs
          timeout 90s node tests/phase11/cil/issue-8797-cil-exportedtype-resolution-budget.test.mjs
          timeout 90s node tests/phase11/cil/issue-8778-cil-definition-identity.test.mjs
      - name: Commit repair and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-l13-review-fix-8908.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/managed/cil tests/phase11/cil .github/workflows/tmp-l13-review-fix-8908.yml
          git commit -m "fix(cil): charge retained metadata rows against heap budget"
          git push origin HEAD:codex/issue-campaign-20260914-lane-03-batch-03
