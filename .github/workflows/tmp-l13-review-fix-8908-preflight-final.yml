name: tmp-l13-review-fix-8908-preflight-final
on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-03-batch-03
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-campaign-20260914-lane-03-batch-03
          fetch-depth: 0
      - name: Guard exact reviewed ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "759960978b1dacdc3bb3664ce5f5a1118e2eb12d"
          test "$(git rev-parse HEAD^^^)" = "f26f33edb939d89681b6dc9254e239b86be620be"
      - name: Apply exact production repair and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          text = Path('.github/workflows/tmp-l13-review-fix-8908-preflight.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY"
          script = dedent(text.split(start, 1)[1].split(end, 1)[0])
          marker = "\np = Path('tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs')"
          if marker not in script:
              raise SystemExit('production/test split marker missing')
          Path('/tmp/preflight-production.py').write_text(script.split(marker, 1)[0] + '\n')
          PY
          python3 /tmp/preflight-production.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs')
          text = p.read_text()
          anchor = "}\n\nfunction genericParamAliasFixture(n) {"
          insert = "}\n\n{\n  const budget = createCilMetadataBudget({ resourceBudget: {\n    maxRows: 10_000_000, maxEstimatedHeapBytes: 1024, maxWork: 1000, deadlineMs: 10_000,\n  } });\n  assert.throws(() => budget.preflightRows(1_000_000, 8), /cil-metadata-resource-limit-heap/,\n    'table-sized result allocation must be rejected before Array.from materializes it');\n}\n\nfunction genericParamAliasFixture(n) {"
          if text.count(anchor) != 1:
              raise SystemExit(f'retained-row test anchor count={text.count(anchor)}')
          p.write_text(text.replace(anchor, insert, 1))
          PY
      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail
          for f in js/managed/cil/metadata-layout.js js/managed/cil/metadata-definitions.js js/managed/cil/metadata-generics.js js/managed/cil/metadata-manifest-security.js tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs; do timeout 10s node --check "$f"; done
      - name: Retained-row heap regression
        run: timeout 45s node tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs
      - name: String alias and GenericParam regression
        run: timeout 90s node tests/phase11/cil/issue-8699-cil-metadata-string-alias-budget.test.mjs
      - name: Public parse single-pass regression
        run: timeout 90s node tests/phase11/cil/issue-8699-8797-public-parse-single-pass.test.mjs
      - name: ExportedType resolution regression
        run: timeout 90s node tests/phase11/cil/issue-8797-cil-exportedtype-resolution-budget.test.mjs
      - name: Definition identity regression
        run: timeout 90s node tests/phase11/cil/issue-8778-cil-definition-identity.test.mjs
      - name: Commit repair and remove transports
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-l13-review-fix-8908-preflight.yml .github/workflows/tmp-l13-review-fix-8908-preflight-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/managed/cil tests/phase11/cil .github/workflows/tmp-l13-review-fix-8908-preflight.yml .github/workflows/tmp-l13-review-fix-8908-preflight-final.yml
          git commit -m "fix(cil): preflight metadata rows before array allocation"
          git push origin HEAD:codex/issue-campaign-20260914-lane-03-batch-03
