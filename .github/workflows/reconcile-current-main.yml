name: reconcile-current-main
on:
  push:
    branches:
      - fix/reconcile-14-soundness-20260908
permissions:
  contents: write
jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'OpenAI Reconcile Bot'
          git config user.email 'openai-reconcile@users.noreply.github.com'
          if ! git merge --no-commit --no-ff origin/main; then
            printf 'conflicts: ' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U | tr '\n' ' ' >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          rm -f .github/workflows/reconcile-current-main.yml
          git add -A
          git diff --cached --check
          git commit -m 'chore: reconcile current main [main-reconciled]'
          git push origin HEAD:${GITHUB_REF_NAME}
