name: fix7036-phase8-routing
on:
  push:
    branches:
      - fix/7036-phase8-routing-20260917
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare routing patch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diag/fix-7036-phase8-routing.py /tmp/fix7036.py
          git fetch --no-tags origin main 4b805874c7f050cb7a2cace172c567e03b941d08
          git checkout --detach 4b805874c7f050cb7a2cace172c567e03b941d08
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 /tmp/fix7036.py
          git diff --check
          git add .circleci/config.yml
          git commit -m 'fix(ci): restore Phase 8 roadmap ownership routing'
      - name: Validate CircleCI routing contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/ci/circleci-impact.test.mjs
      - name: Validate Phase 8 ownership
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          HEAD_SHA=$(git rev-parse HEAD^)
          node tools/validation/phase8-ownership.mjs --check-manifest
          FILES_JSON=$(node tools/validation/analysis-roadmap/ownership.mjs --branch feat/analysis-roadmap-v8-current-main-20260907 --phase phase8 --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA")
          node tools/validation/phase8-ownership.mjs --files-json "$FILES_JSON"
      - name: Push clean fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          TARGET=feat/analysis-roadmap-v8-current-main-20260907
          EXPECTED=4b805874c7f050cb7a2cace172c567e03b941d08
          REMOTE=$(git ls-remote origin "refs/heads/$TARGET" | awk '{print $1}')
          test "$REMOTE" = "$EXPECTED"
          git push origin "HEAD:$TARGET"
