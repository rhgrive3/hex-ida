name: Temporary issue 5300 SCPA baseline check

on:
  push:
    branches:
      - diag/issue-5300-scpa-baseline-20260917

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Focused demand vertical
        run: timeout 180s node --test tests/scpa/demand-vertical.test.mjs
