name: tmp-apply-issue-5435

on:
  push:
    branches:
      - fix/mod5-3-5435-entry-loop-ssa

permissions:
  contents: write

jobs:
  apply-validated-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mod5-3-5435-entry-loop-ssa
          fetch-depth: 1
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/issue-5435.patch.gz.b64 | gzip -d > /tmp/issue-5435.patch
          git apply --check /tmp/issue-5435.patch
          git apply /tmp/issue-5435.patch
      - name: Stage existing source files
        run: git add -- js/semantics/ssa/build.js js/semantics/ssa/contract.js js/semantics/ssa/validate.js
      - name: Commit source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(ssa): support entry-loop backedges (#5435)'
      - name: Push source files
        run: git push origin HEAD:fix/mod5-3-5435-entry-loop-ssa
