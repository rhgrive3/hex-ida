name: one-shot unlinked issue review hardening
on:
  push:
    branches: [fix/unlinked-issues-20260829]
permissions:
  contents: write
jobs:
  review-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply review hardening
        run: python3 .github/scripts/review-unlinked-issues-20260829.py
      - name: Syntax checks
        run: |
          node --check js/swift-abi-layout.js
          node --check js/swift.js
          node --check js/worker.js
          node --check js/worker-legacy.js
          node --check js/debug/remote-protocol.js
          node --check js/objc-legacy.js
          node --check js/apple/objc-metadata.js
          node --check js/objc.js
          node --check js/binary/macho-core.js
          node --check js/app.js
      - name: Focused regressions
        run: |
          node tests/swift-runtime.mjs
          node tests/objc-metadata.mjs
          node tests/objc-runtime.mjs
          node tests/worker-classic-harness.mjs
          node tests/phase7-new-issues-2369-2370.test.mjs
          node tests/unlinked-swift-runtime.test.mjs
          node tests/unlinked-runtime-hardening.test.mjs
          node tests/unlinked-macho-compact-unwind.test.mjs
      - name: Canonical generated artifact
        run: npm run userscript:build
      - name: Commit reviewed tree
        run: |
          rm .github/workflows/review-unlinked-issues-20260829.yml
          rm .github/scripts/review-unlinked-issues-20260829.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: harden Swift ABI and runtime target proofs'
          git push origin HEAD:fix/unlinked-issues-20260829