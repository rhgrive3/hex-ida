name: Stage2 A2 machine-effects diagnostic
on:
  push:
    branches:
      - integration/stage2-a2-x86-long64-terminal-semantics
    paths:
      - .github/workflows/stage2-a2-machine-effects-diagnostic.yml
      - js/targets/architecture/x86_64/effects/terminal-residual.js
      - js/targets/architecture/x86_64/effects/index.js
      - js/targets/architecture/x86_64/effects/system-register-move.js
permissions:
  contents: read
jobs:
  terminal-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run frozen 1487 closure matrix
        run: node tests/machine-effects/x86-long64-closure-matrix.test.mjs
      - name: Run focused terminal denominator proofs
        run: |
          node tests/machine-effects/x86-long64-fp-denominator.test.mjs
          node tests/machine-effects/x86-long64-simd-denominator.test.mjs
          node tests/machine-effects/x86-long64-system-denominator.test.mjs
          node tests/machine-effects/a2-denominator.test.mjs
