name: Stage2 A2 machine-effects diagnostic
on:
  push:
    branches:
      - integration/stage2-a2-x86-long64-terminal-semantics
    paths:
      - .github/workflows/stage2-a2-machine-effects-diagnostic.yml
permissions:
  contents: read
jobs:
  residual-gaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Enumerate frozen 1487 closure gaps
        run: |
          node --input-type=module <<'NODE'
          import { createCapstoneX86Session } from './tests/phase5/helpers/capstone-session.mjs';
          import { createX86DecodedInstruction } from './js/targets/architecture/x86_64/decoded-instruction.js';
          import { dispatchX86MachineEffects } from './js/targets/architecture/x86_64/effects/index.js';
          import { X86_LONG64_DECODER_WITNESSES } from './tools/validation/machine-effects/fixtures/x86-long64-decoder-witnesses.mjs';
          import { bytesFromX86Long64WitnessHex } from './tools/validation/machine-effects/x86-long64-decoder-denominator.mjs';
          import { evaluateX86Long64ClosureMatrix } from './tools/validation/machine-effects/x86-long64-closure-matrix.mjs';
          const session = await createCapstoneX86Session();
          try {
            const rows = [];
            for (const [id,name,hex] of X86_LONG64_DECODER_WITNESSES) {
              const bytes = bytesFromX86Long64WitnessHex(hex);
              const decoded = session.decode(bytes, 0x100000n + BigInt(id) * 0x20n);
              if (decoded.length !== 1) throw new Error(`decode-count:${name}:${decoded.length}`);
              const instruction = createX86DecodedInstruction({ ...decoded[0], instructionId:`closure-witness:${id}` });
              rows.push({id,name,hex,instruction});
            }
            const matrix = evaluateX86Long64ClosureMatrix(rows, dispatchX86MachineEffects);
            console.log(JSON.stringify({
              totalWitnessCount:matrix.totalWitnessCount,
              partialCount:matrix.partialCount,
              blockingGapCount:matrix.blockingGapCount,
              completenessByOwner:matrix.completenessByOwner,
              blockingGaps:matrix.blockingGaps,
            }, null, 2));
            if (matrix.partialCount !== 0 || matrix.blockingGapCount !== 0) process.exitCode = 1;
          } finally { session.close(); }
          NODE
