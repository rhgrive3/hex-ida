name: Stage2 A2 machine-effects diagnostic
on:
  push:
    branches:
      - integration/stage2-a2-x86-long64-terminal-semantics
    paths:
      - .github/workflows/stage2-a2-machine-effects-diagnostic.yml
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/machine-effects/a2-denominator.test.mjs
          - tests/machine-effects/x86-long64-simd-denominator.test.mjs
          - tests/machine-effects/x86-long64-system-denominator.test.mjs
          - tests/machine-effects/x86-long64-closure-matrix.test.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run focused A2 closure proof
        run: node "${{ matrix.test }}"
