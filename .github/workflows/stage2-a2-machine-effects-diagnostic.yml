name: Stage2 A2 machine-effects diagnostic
on:
  push:
    branches:
      - integration/stage2-a2-x86-long64-terminal-semantics
    paths:
      - .github/workflows/stage2-a2-machine-effects-diagnostic.yml
permissions:
  contents: read
jobs:
  residual-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dump representative frozen-witness surfaces
        run: |
          node --input-type=module <<'NODE'
          import { createCapstoneX86Session } from './tests/phase5/helpers/capstone-session.mjs';
          import { createX86DecodedInstruction } from './js/targets/architecture/x86_64/decoded-instruction.js';
          import { dispatchX86MachineEffects } from './js/targets/architecture/x86_64/effects/index.js';
          import { X86_LONG64_DECODER_WITNESSES } from './tools/validation/machine-effects/fixtures/x86-long64-decoder-witnesses.mjs';
          import { bytesFromX86Long64WitnessHex } from './tools/validation/machine-effects/x86-long64-decoder-denominator.mjs';
          const wanted = new Set(['clc','cli','hlt','mov','nop','insb','prefetchwt1','rstorssp','roundsd','vcvtpd2ps','v4fmaddps','vblendmpd','vbroadcastf32x4','vgatherpf0dpd','vscatterpf0dpd','valignd','vpblendmb','vptestmb','vbroadcasti128','wrssd']);
          const session = await createCapstoneX86Session();
          try {
            for (const [id,name,hex] of X86_LONG64_DECODER_WITNESSES) {
              if (!wanted.has(name)) continue;
              const bytes = bytesFromX86Long64WitnessHex(hex);
              const raw = session.decode(bytes,0x100000n+BigInt(id)*0x20n)[0];
              const decoded = createX86DecodedInstruction(raw);
              const dispatch = dispatchX86MachineEffects(decoded);
              const result = dispatch.result;
              console.log(JSON.stringify({
                id,name,hex,owner:dispatch.ownerId,reason:result?.unknownEffects?.reason,completeness:result?.completeness,
                operands:decoded.detail.operands.map((o)=>({type:o.type,access:o.access,widthBits:o.widthBits,reg:o.register?.id,mem:o.memory?{base:o.memory.base?.id,index:o.memory.index?.id,scale:o.memory.scale,disp:String(o.memory.displacement)}:undefined,imm:o.value!=null?String(o.value):undefined})),
                implicitReads:decoded.detail.implicitReads.map((r)=>r.id),implicitWrites:decoded.detail.implicitWrites.map((r)=>r.id),
                groups:decoded.detail.groups,
                partialOperations:(result?.operations||[]).map((op)=>({kind:op.kind,registerId:op.register?.registerId,writePolicy:op.metadata?.writePolicy,intrinsicId:op.intrinsicId,memory:op.memoryAccess?{space:op.memoryAccess.space,widthBits:op.memoryAccess.widthBits}:undefined})),
                metadata:result?.metadata,
              }));
            }
            const [vx] = session.decode(Uint8Array.of(0xc5,0xf8,0x57,0xc1),0x900000n);
            const vxResult=dispatchX86MachineEffects(createX86DecodedInstruction(vx)).result;
            console.log(JSON.stringify({name:'vxorps-vex128-proof',ops:vxResult.operations.map((op)=>({kind:op.kind,registerId:op.register?.registerId,writePolicy:op.metadata?.writePolicy,opcode:op.opcode,metadata:op.metadata}))}));
          } finally { session.close(); }
          NODE
