name: PR7036 current-main conflict snapshot v4
on:
  push:
    branches: [sync/pr7036-main-20260918-v4]
jobs:
  snapshot:
    if: contains(github.event.head_commit.message, 'snapshot PR7036 current-main conflicts v4')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 900
      - name: Snapshot conflict stages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags --depth=900 origin f5ee21b23fb85ebeeb19115b8c9c9365cfbd2dcf >/dev/null 2>&1
          set +e
          git merge --no-commit --no-ff FETCH_HEAD >/dev/null 2>&1
          rc=$?
          set -e
          git diff --name-only --diff-filter=U | sed '/^$/d' | sort > conflicts.txt
          test "$rc" -eq 1
          test "$(wc -l < conflicts.txt | tr -d ' ')" -eq 7
          while IFS= read -r f; do
            for stage in 1 2 3; do
              case "$stage" in 1) d=base;; 2) d=ours;; 3) d=theirs;; esac
              mkdir -p "$d/$(dirname "$f")"
              git show ":$stage:$f" > "$d/$f"
            done
          done < conflicts.txt
          {
            echo "head=$(git rev-parse HEAD)"
            echo "main=$(git rev-parse FETCH_HEAD)"
            echo "merge_base=$(git merge-base HEAD FETCH_HEAD)"
          } > summary.txt
          git merge --abort
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pr7036-current-main-conflict-snapshot-v4
          path: |
            conflicts.txt
            summary.txt
            base
            ours
            theirs
          retention-days: 2
