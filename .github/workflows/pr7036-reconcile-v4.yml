name: PR7036 live main T016 focused v4b
on:
  push:
    branches:
      - sync/pr7036-main-20260917-v4
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 500
      - name: Resolve conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=500 origin fce9076a8c396953146152435a61bb0d4897261d >/dev/null 2>&1
          set +e
          git merge --no-commit --no-ff FETCH_HEAD >/dev/null 2>&1
          echo $? > /tmp/merge-rc.txt
          set -e
          git diff --name-only --diff-filter=U | sed '/^$/d' | sort > /tmp/conflicts.txt
          test "$(wc -l < /tmp/conflicts.txt | tr -d ' ')" = 5
          for f in js/analysis/discovery/artifact.js js/analysis/discovery/producers.js js/analysis/index.js js/rebuild/transaction-v2.js tests/issue-4135-pe-section-virtual-layout.mjs; do
            grep -Fx "$f" /tmp/conflicts.txt >/dev/null
            git checkout --theirs -- "$f"
            git add -- "$f"
          done
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Focused tests
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/status.txt
          for f in js/analysis/discovery/artifact.js js/analysis/discovery/producers.js js/analysis/index.js js/rebuild/transaction-v2.js; do
            node --check "$f" >/tmp/one.txt 2>&1 || { echo "syntax FAIL $f" >> /tmp/status.txt; tail -n 20 /tmp/one.txt >> /tmp/status.txt; exit 1; }
            echo "syntax PASS $f" >> /tmp/status.txt
          done
          run_one() {
            name="$1"; file="$2"
            set +e
            node --test "$file" >/tmp/one.txt 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then echo "PASS $name" >> /tmp/status.txt; return 0; fi
            echo "FAIL $name" >> /tmp/status.txt
            grep -E 'not ok|error:|Error:|AssertionError|actual:|expected:|ERR_|reason' /tmp/one.txt | head -n 80 >> /tmp/status.txt || true
            return "$rc"
          }
          run_one x03-artifact tests/phase7/discovery/x03-ambiguity-artifact.test.mjs
          run_one x03-rebuild tests/stage2/x03-rebuild-discovery-acceptance.test.mjs
          run_one t016-discovery tests/phase7/discovery/t016-discovery-preservation.test.mjs
          run_one t016-rebuild tests/rebuild/t016-discovery-preservation.test.mjs
          run_one pe4135 tests/issue-4135-pe-section-virtual-layout.mjs
          run_one proof-projection tests/phase8/substrate/proof-projection-origin.test.mjs
          run_one proof-optimizer tests/phase8/integration/proof-optimizer.test.mjs
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7036-v4-focused-result
          path: /tmp/status.txt
          if-no-files-found: ignore
          retention-days: 2
