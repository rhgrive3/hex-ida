name: One-shot Phase7 semantic protocol 2812 2864
on:
  push:
    branches: [fix/2812-2864-semantic-protocol-strings]
    paths: [.github/workflows/one-shot-2812-2864.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2812-2864-semantic-protocol-strings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python3 tools/tmp-2812-2864.py
      - name: Focused regression
        run: |
          node tests/phase7/issues-2812-2864-semantic-protocol.mjs
          npm run phase7:test
      - run: node --check js/analysis/semantic-function-base.js
      - name: Commit repair
        shell: bash
        run: |
          rm -f tools/tmp-2812-2864.py .github/workflows/one-shot-2812-2864.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(analysis): require typed semantic protocol strings (#2812 #2864)'
          git push origin HEAD:fix/2812-2864-semantic-protocol-strings
