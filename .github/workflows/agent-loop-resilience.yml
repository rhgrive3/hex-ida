name: Agent loop resilience (manual fallback)

# Automatic PR/push execution is owned by .circleci/config.yml.
# Keep this workflow as a manual GitHub-hosted rollback/fallback lane.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unattended agent loop regressions
        run: node tests/dev-agent/agent-loop-resilience.mjs
