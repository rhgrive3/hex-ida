name: Agent loop resilience

on:
  pull_request:
    paths:
      - 'js/userscript/dev/**'
      - 'tests/dev-agent/agent-loop-resilience.mjs'
      - '.github/workflows/agent-loop-resilience.yml'
  push:
    branches: [main]
    paths:
      - 'js/userscript/dev/**'
      - 'tests/dev-agent/agent-loop-resilience.mjs'
      - '.github/workflows/agent-loop-resilience.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-loop-resilience-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  resilience:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run unattended agent loop regressions
        run: node tests/dev-agent/agent-loop-resilience.mjs
