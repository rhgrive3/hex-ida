name: One-shot source-only unlinked issue repair

on:
  push:
    branches:
      - fix/unlinked-issues-2377-2388-2393-2478
    paths:
      - .github/workflows/one-shot-unlinked-source-r5.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-issues-2377-2388-2393-2478
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize guarded repair script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/one-shot-unlinked-issues.yml').read_text()
          start="          python3 - <<'PY'\n"
          end="\n          PY\n\n          node --check"
          a=source.index(start)+len(start)
          b=source.index(end,a)
          script=textwrap.dedent(source[a:b])
          script=script.replace("function classifiedArgumentLocations(ctx,opts={}){","function classifiedArgumentLocations(ir,ctx,opts={}){",1)
          needle="  const push=(x)=>{if(!x?.reg)return;const reg=String(x.reg);if(!out.some((y)=>y.reg===reg))out.push({...x,reg});};\n"
          insert=needle+"  if(ctx.plugin&&ir?.args?.keys)for(const reg of ir.args.keys())try{const c=ctx.plugin.classifyEntryRegister?.(reg);if(c?.kind==='argument')push({...c,reg:c.reg||reg});}catch{}\n"
          if needle not in script: raise SystemExit('argument register anchor missing')
          script=script.replace(needle,insert,1)
          script=script.replace("classifiedArgumentLocations(ctx,opts)","classifiedArgumentLocations(ir,ctx,opts)",1)
          script=script.replace("run('riscv-lp64','riscv64','linux'","run('lp64','riscv64','linux'",1)
          Path('/tmp/unlinked-repair.py').write_text(script)
          PY
          python3 /tmp/unlinked-repair.py
      - name: Focused verification
        shell: bash
        run: |
          node --check js/swift.js
          node --check js/binary/macho-core.js
          node --check js/objc-legacy.js
          node --check js/apple/objc-metadata.js
          node --check js/objc.js
          node --check js/apple/objc-runtime.js
          node --check js/decompiler/types/prototype.js
          node tests/issue-2377-swift-vtable-autoproject.mjs
          node tests/issue-2388-compact-unwind-soundness.mjs
          node tests/issue-2393-objc-imp-validation.mjs
          node tests/issue-2478-prototype-abi-recovery.mjs
          git diff --check
      - name: Commit source repair only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js tests
          git commit -m 'fix: resolve remaining unlinked analysis issues'
          git push origin HEAD:fix/unlinked-issues-2377-2388-2393-2478