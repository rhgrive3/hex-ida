name: temporary unlinked ARM64 closure
on:
  push:
    branches: [fix/unlinked-arm64-closure-20260830]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-arm64-closure-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded ARM64 fixes
        run: python3 tools/maintenance/fix-unlinked-arm64-closure.py
      - name: Verify ARM64 closure
        run: |
          set -euo pipefail
          node --check js/targets/architecture/arm64/effects/addressing.js
          node --check js/targets/architecture/arm64/effects/system.js
          node --check js/targets/architecture/arm64e/effects.js
          node --check tools/validation/machine-effects/arm64e-pac-denominator.mjs
          node tests/unlinked-arm64-closure.mjs
          node tests/arm64-presentation-compat.mjs
          node tests/machine-effects/arm64e-pac-denominator.test.mjs
      - name: Commit verified ARM64 changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            js/targets/architecture/arm64/effects/addressing.js \
            js/targets/architecture/arm64/effects/system.js \
            js/targets/architecture/arm64e/effects.js \
            tools/validation/machine-effects/arm64e-pac-denominator.mjs \
            tests/machine-effects/arm64e-pac-denominator.test.mjs \
            tests/arm64-presentation-compat.mjs \
            tests/unlinked-arm64-closure.mjs
          git diff --cached --quiet && { echo 'No ARM64 product changes produced'; exit 1; }
          git commit -m 'fix(arm64): close register identity and authenticated exception-return gaps'
          git push origin HEAD:fix/unlinked-arm64-closure-20260830
