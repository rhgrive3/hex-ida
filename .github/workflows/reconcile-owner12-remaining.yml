name: Reconcile owner12 remaining fixes

on:
  push:
    branches:
      - reconcile/owner12-5096-5146-20260916

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rebuild and apply exact current-main patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/owner12.patch
          for part in .github/l9/reconcile-owner12.part*.b64; do
            base64 --decode "$part" >> /tmp/owner12.patch
          done
          git apply --check /tmp/owner12.patch
          git apply /tmp/owner12.patch

      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/issue-5096-cil-fe-prefix-operand-table.mjs
          node --test tests/issue-5146-import-site-identity-typed-keys.mjs
          npm run binary:test
          node tests/check.mjs

      - name: Publish reconciled branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/reconcile-owner12-remaining.yml
          rm .github/l9/reconcile-owner12.part*.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(owner12): reconcile #5096 and #5146 onto current main'
          git push origin HEAD:reconcile/owner12-5096-5146-20260916
