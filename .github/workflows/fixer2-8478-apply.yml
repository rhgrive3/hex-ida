name: Fixer 2 apply 8478

on:
  push:
    branches:
      - fixer2/issue-8478-arm64-packed-frame-size

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixer2/issue-8478-arm64-packed-frame-size
          fetch-depth: 0
      - name: Apply validated patch
        env:
          PATCH_B64: ""
        run: |
          python3 - <<'PY'
          import base64, os
          open('/tmp/issue-8478.patch', 'wb').write(base64.b64decode(os.environ['PATCH_B64']))
          PY
          git apply --check /tmp/issue-8478.patch
          git apply /tmp/issue-8478.patch
          node --check js/binary/pe-loader-core.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/pe-loader-core.js tests/phase4/binary/issue-5673-pe-arm64-packed-regi.test.mjs tests/phase4/binary/issue-8478-pe-arm64-packed-frame-size.test.mjs
          git commit -m "fix(pe): validate ARM64 packed unwind frame size (#8478)"
          git push origin HEAD:fixer2/issue-8478-arm64-packed-frame-size
