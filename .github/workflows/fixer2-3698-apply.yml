name: Fixer2 issue 3698 remote apply

on:
  push:
    branches:
      - fix/issue-3698-et-dyn-zero-entry-fixer2
    paths:
      - .github/workflows/fixer2-3698-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: trigger Fixer2 #3698 remote apply'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-3698-et-dyn-zero-entry-fixer2
          fetch-depth: 1
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .fixer2-3698.patch
          git apply .fixer2-3698.patch
          rm .fixer2-3698.patch
      - name: Focused and nearby validation
        shell: bash
        run: |
          set -euo pipefail
          node --check js/binary/elf-core.js
          node --check tests/phase4/issue-3698-elf-entrypoint-function-seed.test.mjs
          node --test tests/phase4/issue-3698-elf-entrypoint-function-seed.test.mjs
          node tests/issues-961-971.mjs
          timeout 180s npm run binary:test
          timeout 180s npm run lint
      - name: Commit reviewed result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fixer 2 Binary'
          git config user.email 'actions@users.noreply.github.com'
          git add js/binary/elf-core.js tests/phase4/issue-3698-elf-entrypoint-function-seed.test.mjs .fixer2-3698.patch
          git commit -m 'fix(elf): keep ET_DYN zero entry sentinel (#3698) [skip actions]'
          git push origin HEAD:fix/issue-3698-et-dyn-zero-entry-fixer2
