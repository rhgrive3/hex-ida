name: tmp-review-8895-diagnose
on:
  push:
    branches: [codex/issue-campaign-20260914-lane-15-batch-01]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply identical repair in workspace
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /- name: Apply blocker fixes/ { in_step=1; next }
            in_step && /- name: Verify focused regressions/ { exit }
            in_step && found_run { sub(/^          /, ""); print }
            in_step && /run: \|/ { found_run=1; next }
          ' .github/workflows/tmp-review-8895-repair.yml > /tmp/apply.sh
          bash /tmp/apply.sh
      - name: caller-budget regression
        run: timeout 25s node tests/issue-8789-8816-unwind-caller-bounds.mjs
      - name: issue-8789
        run: timeout 30s node tests/issue-8789-macho-unwind-starts-budget.mjs
      - name: issue-8816
        run: timeout 30s node tests/issue-8816-macho-lsda-budget.mjs
      - name: issue-8800
        run: timeout 25s node tests/issue-8800-macho-stub-symbols-budget.mjs
      - name: issue-5371
        run: timeout 25s node tests/issue-5371-macho-unwind-page-bounds.mjs
      - name: syntax lint
        run: timeout 30s node tests/check.mjs
