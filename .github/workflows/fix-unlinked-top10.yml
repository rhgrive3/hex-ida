# Branch-local marker; execution is owned by main's one-shot runner.
name: Fix unlinked top10 batch

on:
  push:
    branches:
      - fix/unlinked-top10-20260830

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/unlinked-top10-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: python3 tools/.tmp-fix-unlinked-top10.py
