name: Stage2 A2 semantic repair
on:
  push:
    branches:
      - integration/stage2-a2-x86-long64-terminal-semantics
    paths:
      - .github/workflows/stage2-a2-semantic-repair.yml
permissions:
  contents: write
jobs:
  repair-terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/stage2-a2-x86-long64-terminal-semantics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Repair HINT_NOP preservation contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/targets/architecture/x86_64/effects/terminal-residual.js')
          s = p.read_text()
          old = "    statePreservation:{ proven:true, reason:'x86-amd-hint-nop-normal-path-preserves-architectural-state' },\n    possibleFaults:[udFault('nop', '0F19 /0 is an AMD HINT_NOP encoding and may be reserved/unsupported on other implementations')],\n    metadata:{ operation:'nop', hintNopEncoding:'0F19/0', implementationDependentAvailability:true, memoryOperandIsSyntacticOnly:true },"
          new = "    possibleFaults:[udFault('nop', '0F19 /0 is an AMD HINT_NOP encoding and may be reserved/unsupported on other implementations')],\n    metadata:{ operation:'nop', hintNopEncoding:'0F19/0', implementationDependentAvailability:true, memoryOperandIsSyntacticOnly:true, normalPathStatePreserving:true },"
          if old not in s:
              raise SystemExit('expected HINT_NOP preservation block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run frozen closure matrix after HINT_NOP repair
        run: node tests/machine-effects/x86-long64-closure-matrix.test.mjs || true
      - name: Commit production repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/targets/architecture/x86_64/effects/terminal-residual.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(stage2): align HINT_NOP preservation contract"
          git push origin HEAD:integration/stage2-a2-x86-long64-terminal-semantics
