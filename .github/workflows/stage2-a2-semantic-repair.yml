name: Stage2 A2 semantic repair
on:
  push:
    branches:
      - integration/stage2-a2-x86-long64-terminal-semantics
    paths:
      - .github/workflows/stage2-a2-semantic-repair.yml
permissions:
  contents: write
jobs:
  repair-terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/stage2-a2-x86-long64-terminal-semantics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Repair IO memory-access schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/targets/architecture/x86_64/effects/terminal-residual.js')
          s = p.read_text()
          old = "return Object.freeze({ space:'io', addressExpr:Object.freeze({ kind:'x86-io-port-register', register:'dx' }), widthBits, endian:'little', direction });"
          new = "return Object.freeze({ space:'io', addressExpr:Object.freeze({ kind:'x86-io-port-register', register:'dx' }), widthBits, endian:'little' });"
          if old not in s:
              raise SystemExit('expected IO access schema shape not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run frozen closure matrix after IO repair
        run: node tests/machine-effects/x86-long64-closure-matrix.test.mjs || true
      - name: Commit production repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/targets/architecture/x86_64/effects/terminal-residual.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(stage2): align IO residual access schema"
          git push origin HEAD:integration/stage2-a2-x86-long64-terminal-semantics
