name: Temporary strict identity gate fixes

on:
  push:
    branches:
      - fix/strict-identity-gates-3420-3433
    paths:
      - tools/maintenance/fix-strict-identity-gates-3420-3433.mjs
      - .github/workflows/tmp-fix-strict-identity-gates-3420-3433.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-identity-gates-3420-3433
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply guarded source patch
        run: node tools/maintenance/fix-strict-identity-gates-3420-3433.mjs
      - name: Syntax check touched JavaScript
        run: |
          node --check js/analysis/summary/contract.js
          node --check js/analysis/debug/pdb.js
          node --check tests/phase7/summary-identity-strict-3420.test.mjs
          node --check tests/phase7/debug/pdb-identity-strict-3433.test.mjs
      - name: Targeted regressions
        run: node --test tests/phase7/summary-identity-strict-3420.test.mjs tests/phase7/debug/pdb-identity-strict-3433.test.mjs
      - name: Phase 7 regression suite
        run: npm run phase7:test
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/analysis/summary/contract.js js/analysis/debug/pdb.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep analysis identity gates fail-closed (#3420 #3433)"
          git push origin HEAD:fix/strict-identity-gates-3420-3433
