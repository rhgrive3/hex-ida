name: Invariant Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invariant-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: check-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build deduplicated npm-check shard matrix
        id: plan
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const parts = String(pkg.scripts?.check || '')
            .split(/\s+&&\s+/)
            .map((command) => command.trim())
            .filter(Boolean);
          if (parts.length < 2) throw new Error('npm check must contain at least two independent top-level commands');

          const isolated = new Map([
            ['npm run invariants:test', 'invariants'],
            ['npm run semantic-v2:test', 'semantic-v2'],
            ['npm run phase8:test', 'phase8:test'],
            ['npm test', 'test'],
            ['npm run phase6:test', 'phase6:test'],
            ['npm run benchmark:baseline', 'benchmark:baseline'],
          ]);
          const contracts = parts.filter((command) => !isolated.has(command));
          if (!contracts.length) throw new Error('npm check must contain contract commands');

          const phaseCommands = new Set(['npm run phase4:test', 'npm run phase5:test']);
          const coreContracts = contracts.filter((command) => !phaseCommands.has(command));
          if (!coreContracts.length || !parts.includes('npm run phase4:test') || !parts.includes('npm run phase5:test')) {
            throw new Error('npm check contract layout changed; rebalance invariant shards explicitly');
          }

          // Diagnostic split only: isolate the stale A2 PR's failing Phase 4/5 shard.
          const include = [
            { name: 'contracts-core', command: coreContracts.join(' && ') },
            { name: 'contracts-phase4', command: 'npm run phase4:test' },
            { name: 'contracts-phase5', command: 'npm run phase5:test' },
            ...parts
              .filter((command) => isolated.has(command))
              .map((command) => ({ name: isolated.get(command), command })),
          ];

          const scheduled = include.flatMap(({ command }) => command.split(/\s+&&\s+/));
          const scheduledCounts = new Map();
          for (const command of scheduled) scheduledCounts.set(command, (scheduledCounts.get(command) || 0) + 1);
          if (
            scheduled.length !== parts.length ||
            parts.some((command) => scheduledCounts.get(command) !== 1) ||
            scheduled.some((command) => !parts.includes(command))
          ) {
            const expected = JSON.stringify(parts);
            const actual = JSON.stringify(scheduled);
            throw new Error(`npm-check shard plan must execute each top-level command exactly once (expected=${expected}, actual=${actual})`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE

  check-shards:
    name: check-${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current main for ownership proof
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the frozen Phase 5 toolchain
        if: startsWith(matrix.name, 'contracts-phase')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18

      - name: Prepare generated userscript for canonical Phase 5 component semantic check
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'hex/p5-x86-integration' &&
          (matrix.name == 'contracts-core' || matrix.name == 'semantic-v2') &&
          (
            github.head_ref == 'hex/p5-1-x86-int-control' ||
            github.head_ref == 'hex/p5-2-x86-memory-atomic' ||
            github.head_ref == 'hex/p5-3-x86-fp-simd-system' ||
            github.head_ref == 'hex/p5-4-x86-abis' ||
            github.head_ref == 'hex/p5-5-variable-viewer' ||
            github.head_ref == 'hex/p5-6-x86-verification'
          )
        run: npm run userscript:build

      - name: Run exact check shard
        run: ${{ matrix.command }}

  invariant-gates:
    name: invariant-gates
    if: always()
    needs: [plan, check-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete repository check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARD_RESULT: ${{ needs.check-shards.result }}
        shell: bash
        run: |
          if [[ "$PLAN_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "::error::Repository check failed (plan=$PLAN_RESULT, shards=$SHARD_RESULT)."
            exit 1
          fi
