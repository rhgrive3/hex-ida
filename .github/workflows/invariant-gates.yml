name: Invariant Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invariant-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: check-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build slot-efficient npm-check shard matrix
        id: plan
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const parts = String(pkg.scripts?.check || '')
            .split(/\s+&&\s+/)
            .map((command) => command.trim())
            .filter(Boolean);
          if (parts.length < 2) throw new Error('npm check must contain at least two independent top-level commands');

          const required = [
            'npm run invariants:test',
            'npm run semantic-v2:test',
            'npm run phase4:test',
            'npm run phase5:test',
            'npm run phase6:test',
            'npm run phase8:test',
            'npm test',
            'npm run benchmark:baseline',
          ];
          for (const command of required) {
            if (!parts.includes(command)) throw new Error(`npm check layout changed; missing ${command}`);
          }

          const reserved = new Set(required);
          const coreContracts = parts.filter((command) => !reserved.has(command));
          if (!coreContracts.length) throw new Error('npm check must contain core contract commands');

          const lanes = [
            {
              name: 'phase8',
              coverageCommands: ['npm run phase8:test'],
              runCommands: ['npm run phase8:test'],
              frozenToolchain: 'false',
              runsInvariant: 'false',
              prepareGenerated: 'false',
            },
            {
              name: 'phase45',
              coverageCommands: ['npm run phase4:test', 'npm run phase5:test'],
              runCommands: ['npm run phase4:test', 'npm run phase5:test'],
              frozenToolchain: 'true',
              runsInvariant: 'false',
              prepareGenerated: 'false',
            },
            {
              name: 'analysis-proof',
              coverageCommands: ['npm run invariants:test', 'npm run semantic-v2:test', 'npm run benchmark:baseline'],
              runCommands: ['npm run semantic-v2:test', 'npm run benchmark:baseline'],
              frozenToolchain: 'false',
              runsInvariant: 'true',
              prepareGenerated: 'true',
            },
            {
              name: 'repo-regression',
              coverageCommands: [...coreContracts, 'npm run phase6:test', 'npm test'],
              runCommands: [...coreContracts, 'npm run phase6:test', 'npm test'],
              frozenToolchain: 'false',
              runsInvariant: 'false',
              prepareGenerated: 'true',
            },
          ];

          const scheduled = lanes.flatMap(({ coverageCommands }) => coverageCommands);
          const scheduledCounts = new Map();
          for (const command of scheduled) scheduledCounts.set(command, (scheduledCounts.get(command) || 0) + 1);
          if (
            scheduled.length !== parts.length ||
            parts.some((command) => scheduledCounts.get(command) !== 1) ||
            scheduled.some((command) => !parts.includes(command))
          ) {
            const expected = JSON.stringify(parts);
            const actual = JSON.stringify(scheduled);
            throw new Error(`npm-check shard plan must execute each top-level command exactly once (expected=${expected}, actual=${actual})`);
          }

          const include = lanes.map(({ coverageCommands, runCommands, ...lane }) => ({
            ...lane,
            commandsJson: JSON.stringify(runCommands),
          }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE

  check-shards:
    name: check-${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current main for ownership proof
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Install the frozen Phase 5 toolchain
        if: matrix.frozenToolchain == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18

      - name: Prepare generated userscript for canonical Phase 5 component semantic check
        if: >-
          matrix.prepareGenerated == 'true' &&
          github.event_name == 'pull_request' &&
          github.base_ref == 'hex/p5-x86-integration' &&
          (
            github.head_ref == 'hex/p5-1-x86-int-control' ||
            github.head_ref == 'hex/p5-2-x86-memory-atomic' ||
            github.head_ref == 'hex/p5-3-x86-fp-simd-system' ||
            github.head_ref == 'hex/p5-4-x86-abis' ||
            github.head_ref == 'hex/p5-5-variable-viewer' ||
            github.head_ref == 'hex/p5-6-x86-verification'
          )
        run: npm run userscript:build

      - name: Verify invariant baseline classifier contract
        if: matrix.runsInvariant == 'true'
        run: node tests/invariant-pr-baseline.mjs

      - name: Run exact invariant proof with current-main regression isolation
        if: matrix.runsInvariant == 'true'
        env:
          HEX_INVARIANT_BASE_REF: refs/remotes/origin/main
          HEX_CHECK_LANE: ${{ matrix.name }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports/invariant-diagnostic
          log="reports/invariant-diagnostic/${HEX_CHECK_LANE}-proof.log"
          node tools/validation/invariant-pr-baseline.mjs >"$log" 2>&1
          status=$?
          if [[ "$status" -ne 0 ]]; then
            DIAG_LOG="$log" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const log = process.env.DIAG_LOG;
          const lines = fs.readFileSync(log, 'utf8').split(/\r?\n/).filter(Boolean);
          const pattern = /first divergence|\bFAIL\b|Assertion|Error:|ERR_|expected|actual|mismatch|regression/i;
          const selected = lines.filter((line) => pattern.test(line)).slice(0, 24);
          fs.writeFileSync(log.replace(/\.log$/, '.json'), JSON.stringify({
            kind: 'invariant-proof',
            lines: selected.length ? selected : lines.slice(-24),
          }, null, 2) + '\n');
          NODE
          fi
          rm -f "$log"
          exit "$status"

      - name: Run all remaining exact check commands and aggregate failures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          HEX_CHECK_COMMANDS_JSON: ${{ matrix.commandsJson }}
          HEX_CHECK_LANE: ${{ matrix.name }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';

          const commands = JSON.parse(process.env.HEX_CHECK_COMMANDS_JSON || '[]');
          if (!Array.isArray(commands) || commands.length === 0) throw new Error('check-lane-empty');
          const lane = process.env.HEX_CHECK_LANE || 'unknown';
          const dir = 'reports/invariant-diagnostic';
          fs.mkdirSync(dir, { recursive: true });
          const failures = [];
          const extract = (file) => {
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/).filter(Boolean);
            const pattern = /not ok|\bFAIL\b|Assertion|Error:|ERR_|expected|actual|mismatch|first divergence|failed/i;
            const selected = lines.filter((line) => pattern.test(line)).slice(0, 32);
            return selected.length ? selected : lines.slice(-32);
          };

          for (let index = 0; index < commands.length; index += 1) {
            const command = commands[index];
            const log = path.join(dir, `${lane}-${index}.log`);
            const fd = fs.openSync(log, 'w');
            const result = spawnSync(command, {
              shell: true,
              stdio: ['ignore', fd, fd],
              env: process.env,
            });
            fs.closeSync(fd);
            if (result.error || result.status !== 0) {
              failures.push({
                command,
                status: result.status,
                error: result.error?.message ?? null,
                lines: extract(log),
              });
            }
            fs.rmSync(log, { force: true });
          }
          if (failures.length) {
            fs.writeFileSync(path.join(dir, `${lane}-commands.json`), JSON.stringify({ lane, failures }, null, 2) + '\n');
            console.error(`Exact check lane failures: ${failures.map(({ command, status }) => `${command}=${status}`).join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Upload invariant failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: invariant-diagnostic-${{ matrix.name }}
          path: reports/invariant-diagnostic/*.json
          if-no-files-found: warn
          retention-days: 1

      - name: Post diagnostic marker
        if: failure()
        run: echo "Invariant diagnostic captured for ${{ matrix.name }}"

  invariant-gates:
    name: invariant-gates
    if: always()
    needs: [plan, check-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete repository check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARD_RESULT: ${{ needs.check-shards.result }}
        shell: bash
        run: |
          if [[ "$PLAN_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "::error::Repository check failed (plan=$PLAN_RESULT, shards=$SHARD_RESULT)."
            exit 1
          fi
