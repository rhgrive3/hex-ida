name: Invariant Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invariant-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariant-gates:
    name: invariant-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch current main for invariant baseline
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure frozen Phase 4/5 toolchain
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang-18 >/dev/null && command -v lld-18 >/dev/null && command -v llvm-mc-18 >/dev/null; then
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 llvm-18

      - name: Run every npm-check contract exactly once with bounded local parallelism
        env:
          HEX_CHECK_CONCURRENCY: 4
          HEX_PHASE_TEST_CONCURRENCY: 2
          HEX_INVARIANT_CONCURRENCY: 2
        run: node tools/validation/ci-parallel-check.mjs
