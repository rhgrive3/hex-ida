name: Fixer 2 Issue 4261 Production Write

on:
  push:
    branches:
      - fixer2-4261-elf-eh-indirect-span

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply production patch and verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/elf-unwind.js)" = "fb8eec518401a1815330ca20cabb3a33eb1cafb2"
          test "$(git hash-object tests/phase4/binary/issue-4261-elf-eh-indirect-span.test.mjs)" = "48f537e5ed755cd090d6ae2aa1a97bd3355a5d47"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/binary/elf-unwind.js')
          s = p.read_text()
          fn = s.index('function decodeEhValue')
          needle = '  if (indirect) {\n    const off = ctx.image.addressToOffset(value);'
          start = s.index(needle, fn)
          end = s.index('  return { value, raw, next };', start)
          old = s[start:end]
          required = [
              'const off = ctx.image.addressToOffset(value);',
              'off + BigInt(ptrBytes) > BigInt(r.length)',
              'r.u64(Number(off))',
              'BigInt(r.u32(Number(off)))',
          ]
          if not all(item in old for item in required):
              raise SystemExit('unexpected DW_EH_PE_indirect baseline')
          new = (
              '  if (indirect) {\n'
              '    const pointerBytes = ctx.image?.readVirtual?.(value, ptrBytes);\n'
              '    if (!(pointerBytes instanceof Uint8Array) || pointerBytes.length !== ptrBytes) {\n'
              '      throw new Error(`DW_EH_PE_indirect target 0x${value.toString(16)} is not readable`);\n'
              '    }\n'
              '    const pointerView = new DataView(pointerBytes.buffer, pointerBytes.byteOffset, pointerBytes.byteLength);\n'
              "    const littleEndian = typeof r.littleEndian === 'boolean' ? r.littleEndian : ctx.image?.endian !== 'big';\n"
              '    value = ctx.bits === 64\n'
              '      ? pointerView.getBigUint64(0, littleEndian)\n'
              '      : BigInt(pointerView.getUint32(0, littleEndian));\n'
              '  }\n'
          )
          p.write_text(s[:start] + new + s[end:])
          PY
          test "$(git hash-object js/binary/elf-unwind.js)" = "0072e3435f0a88653fd7da599b4ea4a0e589246c"
          node --check js/binary/elf-unwind.js
          node tests/phase4/binary/issue-4261-elf-eh-indirect-span.test.mjs
          git config user.name "hex-ida Fixer 2 Binary"
          git config user.email "actions@users.noreply.github.com"
          git add js/binary/elf-unwind.js
          git rm .github/workflows/fixer2-4261-production-write.yml
          git commit -m "Fix ELF indirect unwind pointer span validation (#4261)"
          git push origin HEAD:fixer2-4261-elf-eh-indirect-span