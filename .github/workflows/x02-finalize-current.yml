name: X-02 finalize current acceptance

on:
  push:
    branches: [feat/analysis-roadmap-v8-current-main-20260907]
    paths: [.github/workflows/x02-finalize-current.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/analysis-roadmap-v8-current-main-20260907
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply X-02 current acceptance overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          # Current overlay: preserve frozen 120-row JSON, promote only G09.
          p=Path('tests/scpa/x02-prior120-apple-version-matrix.test.mjs')
          s=p.read_text()
          old="""const currentDispositions = Object.freeze({
            'X02-A-07':'pass', 'X02-B-01':'pass', 'X02-B-02':'pass',
            'X02-D-13':'pass', 'X02-E-11':'pass', 'X02-G-03':'pass',
          });"""
          new="""const currentDispositions = Object.freeze({
            'X02-A-07':'pass', 'X02-B-01':'pass', 'X02-B-02':'pass',
            'X02-D-13':'pass', 'X02-E-11':'pass', 'X02-G-03':'pass',
            'X02-G-09':'pass',
          });"""
          if old not in s: raise SystemExit('currentDispositions anchor missing')
          s=s.replace(old,new,1)
          old="""    ['X02-D-13','swift-version-gap','product-gap'], ['X02-E-11','objc-classless-gap','product-gap'],
              ['X02-G-03','signature-gap','product-gap'],
            ]);"""
          new="""    ['X02-D-13','swift-version-gap','product-gap'], ['X02-E-11','objc-classless-gap','product-gap'],
              ['X02-G-03','signature-gap','product-gap'],
              ['X02-G-09','evidence-missing','evidence-gap'],
            ]);"""
          if old not in s: raise SystemExit('disposition invariant anchor missing')
          s=s.replace(old,new,1)
          anchor="""  if(row.check==='evidence-missing') {
              const found=localCorpus();assert.deepEqual(found.machos,['tests/phase12/integration/fixtures/issue-8280-arm64_32-objc.o',REAL_MACHO_PATH]);"""
          insert="""  if(row.id==='X02-G-09' && row.check==='evidence-missing') {
              const evidence=JSON.parse(fs.readFileSync(path.join(ROOT,'tests/scpa/fixtures/x02-real-apple-evidence-20260916.json')));
              assert.equal(evidence.schema,'hex-x02-real-apple-evidence-snapshot/v1');
              assert.equal(evidence.source.workflowRunId,35118158460);
              assert.equal(evidence.source.artifactDigest,'sha256:7cb65af30cb10a6368a18c875d21a3883006e8164be91199280c4c4ae2cc6468');
              assert.equal(evidence.appleEnvironment.machine,'arm64');
              assert.equal(evidence.signedMachO.sha256,'501c66a6d1850f8cece66b1c33991969b66f29f003ba91675077672acb15ba5f');
              assert.equal(evidence.signedMachO.codesignStrictVerified,true);
              assert.match(evidence.signedMachO.file,/Mach-O.*arm64e/i);
              assert.ok(evidence.signedMachO.authorityChain.includes('Apple Root CA'));
              assert.equal(evidence.currentAcceptance['X02-G-09'].classification,'pass');
              return passed('trusted-signing-validation',{evidencePath:'tests/scpa/fixtures/x02-real-apple-evidence-20260916.json',signedMachOSha256:evidence.signedMachO.sha256,authorityChain:evidence.signedMachO.authorityChain,workflowRunId:evidence.source.workflowRunId,artifactDigest:evidence.source.artifactDigest});
            }
            if(row.check==='evidence-missing') {
              const found=localCorpus();assert.deepEqual(found.machos,['tests/phase12/integration/fixtures/issue-8280-arm64_32-objc.o',REAL_MACHO_PATH]);"""
          if anchor not in s: raise SystemExit('evidence-missing anchor missing')
          p.write_text(s.replace(anchor,insert,1))

          temp_workflows={
            '.github/workflows/x02-apple-evidence.yml',
            '.github/workflows/x02-collector-fix.yml',
            '.github/workflows/x02-dyld-v5-diagnostic.yml',
            '.github/workflows/x02-dyld-v5-diagnostic2.yml',
            '.github/workflows/x02-evidence-dispatch-once.yml',
            '.github/workflows/x02-evidence-dispatch-once3.yml',
            '.github/workflows/x02-real-runtime-diagnostic.yml',
            '.github/workflows/x02-real-runtime-diagnostic2.yml',
            '.github/workflows/x02-v5-code-patch.yml',
            '.github/workflows/x02-v5-repair.yml',
            '.github/workflows/x02-v5-shared-region-patch.yml',
            '.github/workflows/x02-v5-shared-region-patch2.yml',
            '.github/workflows/x02-finalize-current.yml',
          }

          # Ownership JSON: recursively remove temporary workflow entries and add pinned evidence path near X-02 owned paths.
          op=Path('tools/validation/analysis-roadmap/ownership.json')
          data=json.loads(op.read_text())
          def clean(v):
            if isinstance(v,list):
              out=[]
              for x in v:
                if isinstance(x,str) and x in temp_workflows: continue
                out.append(clean(x))
              return out
            if isinstance(v,dict): return {k:clean(x) for k,x in v.items()}
            return v
          data=clean(data)
          evidence_path='tests/scpa/fixtures/x02-real-apple-evidence-20260916.json'
          def add_near(v):
            if isinstance(v,list) and 'tools/validation/x02-apple-runtime-evidence.mjs' in v and evidence_path not in v:
              v.append(evidence_path); return True
            if isinstance(v,list):
              return any(add_near(x) for x in v if isinstance(x,(list,dict)))
            if isinstance(v,dict):
              return any(add_near(x) for x in v.values() if isinstance(x,(list,dict)))
            return False
          if not add_near(data): raise SystemExit('ownership JSON X-02 anchor missing')
          op.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          # Ownership MJS: remove temporary path lines and add evidence snapshot next to collector ownership.
          op=Path('tools/validation/analysis-roadmap/ownership.mjs')
          t=op.read_text()
          lines=[]
          for line in t.splitlines(True):
            if any(repr(w) in line or ('\''+w+'\'') in line or ('"'+w+'"') in line for w in temp_workflows): continue
            lines.append(line)
          t=''.join(lines)
          anchor="    'tools/validation/x02-apple-runtime-evidence.mjs',\n"
          addition=anchor+"    'tests/scpa/fixtures/x02-real-apple-evidence-20260916.json',\n"
          if evidence_path not in t:
            if anchor not in t: raise SystemExit('ownership MJS X-02 anchor missing')
            t=t.replace(anchor,addition,1)
          op.write_text(t)

          # Canonical X-02 acceptance doc: append authoritative current overlay, retain history.
          p=Path('docs/analysis-x02-acceptance.md')
          s=p.read_text()
          marker='## 2026-09-17 real Apple evidence reconciliation'
          if marker not in s:
            s += """

          ## 2026-09-17 real Apple evidence reconciliation

          The frozen 120-row denominator and historical 108/6/4/2 classification remain unchanged. GitHub Actions run `35118158460` on Apple Silicon/macOS 15.7.9 completed the bounded real-Apple acceptance lane successfully. Its artifact `10457155516` is pinned by digest `sha256:7cb65af30cb10a6368a18c875d21a3883006e8164be91199280c4c4ae2cc6468`, with the normalized snapshot in `tests/scpa/fixtures/x02-real-apple-evidence-20260916.json`.

          Current finite classification when the exact pinned LLVM 18.1.3 oracle is unavailable is **116 pass / 0 product-gap / 2 evidence-gap / 2 environment-excluded**. If X02-H-02 independently reparses with the exact pinned LLVM executable/version/digest/format/architecture checks, the conditional classification is **117 / 0 / 2 / 1**.

          X02-G-09 is now current `pass`: `/usr/bin/true` is SHA-256 pinned as `501c66a6d1850f8cece66b1c33991969b66f29f003ba91675077672acb15ba5f`, is a universal Mach-O containing arm64e, and passed strict trusted `codesign` validation with an Apple trust chain ending in `Apple Root CA`.

          X02-B-06 remains an evidence gap. The pinned real `dyld_shared_cache_arm64e` (`c88d3a9885614d4ee8be36f0e9a50ee09e640311ca0ea843bc67613933e00184`) supplied slide-info v5 and 6,077 bounded sampled rebases that the production decoder accepted with all sampled targets inside the declared shared region, but no observed process runtime load-map or OS-derived runtime slide was captured. X02-A-08 also remains an evidence gap because one pinned macOS/Xcode/clang point is not the required cross-version/cross-toolchain corpus. X02-F-47 remains environment-excluded: the arm64 PAC probe executed successfully and contained PAC/authentication instructions, while the explicit arm64e probe compiled but terminated with `SIGSEGV`, so arm64e runtime authentication is not claimed.

          Whole-roadmap state remains `CHECKPOINT-LOCKED`, `fullRoadmapComplete:false`, and `transformAuthorization:false`.
          """
            p.write_text(s)

          # Human-facing roadmap doc: current facts only; historical sections are retained.
          p=Path('docs/解析ツール改善.md')
          s=p.read_text()
          marker='## X-02 real Apple evidence update (2026-09-17)'
          if marker not in s:
            s += """

          ## X-02 real Apple evidence update (2026-09-17)

          - frozen 120-row denominator / historical classification は不変: `108 pass / 6 product-gap / 4 evidence-gap / 2 environment-excluded`。
          - real Apple acceptance run `35118158460` は全 step success。artifact `10457155516`、digest `sha256:7cb65af30cb10a6368a18c875d21a3883006e8164be91199280c4c4ae2cc6468` を `tests/scpa/fixtures/x02-real-apple-evidence-20260916.json` に正規化して固定した。
          - current finite overlay は、pinned LLVM 18.1.3 oracle が利用不能な通常環境で **116 pass / 0 product-gap / 2 evidence-gap / 2 environment-excluded**。X02-H-02 exact independent reparse が成功する環境のみ **117 / 0 / 2 / 1**。
          - X02-G-09 は current pass。Apple 署名済み universal Mach-O `/usr/bin/true` を SHA-256 固定し、strict `codesign` と `Apple Root CA` までの trust chain を確認した。
          - X02-B-06 は real dyld v5 cache/rebase metadata と production decoder の bounded 6,077-record sample までは確認済み。ただし実 process runtime load-map / OS-derived runtime slide は未取得のため evidence-gap を維持。
          - X02-A-08 は macOS 15.7.9 / Xcode 16.4 / Apple clang 17.0.0 の1点を固定したが、cross-version / cross-toolchain corpus 要件には足りないため evidence-gap を維持。
          - X02-F-47 は arm64 PAC 実行成功まで確認した一方、explicit arm64e probe は `SIGSEGV`。arm64e runtime authentication の成功証拠には昇格しない。
          - whole roadmap は引き続き `CHECKPOINT-LOCKED` / `fullRoadmapComplete:false` / `transformAuthorization:false`。
          """
            p.write_text(s)

          # Audit JSON: semantic current-overlay update only; historical records stay untouched.
          p=Path('docs/analysis-local-acceptance-audit.json')
          data=json.loads(p.read_text())
          finding_seen=task_seen=current_seen=False
          def visit(v):
            nonlocal_holder=None
            global finding_seen,task_seen,current_seen
            if isinstance(v,dict):
              if v.get('id')=='HEX-X-02':
                v['localStatus']='partial-local-matrix'
                v['assessment']='元120行と既存機能case/manifestを保持。current finite overlayはX02-F-48のcompiler-produced arm64e/PAC producer evidenceとX02-G-09のtrusted Apple signing evidenceをpassとして、pinned LLVM 18.1.3 oracleが利用できない通常環境で116 pass/0 product-gap/2 evidence-gap/2 environment-excluded。X02-H-02 exact independent reparse成功環境のみ117/0/2/1。残るevidence-gapはcross-version Apple OS/toolchain/runtime corpusと、real dyld cacheに対応するobserved runtime load-map/OS-derived slide。X02-F-47はarm64 PAC実行成功を得たがexplicit arm64e probeはSIGSEGVのためruntime authentication成功を未証明。全X-02・release受入は未完了。'
                v['originalRequirementAcceptedHere']=False
                finding_seen=True
              if v.get('id')=='FR-X-02A':
                v['localStatus']='partial-local-matrix'
                v['currentAssessment']='元120行をcanonical統合し製品不足6行を修正済み。X02-F-48とX02-G-09をcurrent passへ進め、通常current分類は116/0/2/2。exact pinned LLVM 18.1.3でX02-H-02独立reparse成功時のみ117/0/2/1。残るcross-version Apple corpus、observed runtime load-map/OS-derived slide、explicit arm64e PAC runtime authenticationは未完了。'
                v['originalRequirementAcceptedHere']=False
                task_seen=True
              if 'x02CurrentFiniteClassification' in v:
                v['x02CurrentFiniteClassification']={'pass':116,'product-gap':0,'evidence-gap':2,'environment-excluded':2}
                current_seen=True
              if 'x02AcceptanceReconciliation20260916' in v and 'x02AcceptanceReconciliation20260917' not in v:
                v['x02AcceptanceReconciliation20260917']={
                  'status':'PARTIAL-LOCAL-MATRIX',
                  'denominator':120,
                  'frozenMatrixSha256':'c95ea2ba89d072fe9110565072462d5efca496b72a66ff365d8b8d15a95274ad',
                  'historicalClassification':{'pass':108,'product-gap':6,'evidence-gap':4,'environment-excluded':2},
                  'currentWithoutPinnedLlvmOracle':{'pass':116,'product-gap':0,'evidence-gap':2,'environment-excluded':2},
                  'conditionalWithPinnedLlvmOracle':{'pass':117,'product-gap':0,'evidence-gap':2,'environment-excluded':1,'condition':'X02-H-02 exact independent reparse succeeds with pinned LLVM 18.1.3 executable digest/version/format/architecture checks'},
                  'currentPassAdded':'X02-G-09 trusted Apple signing validation',
                  'realAppleEvidence':{'snapshot':'tests/scpa/fixtures/x02-real-apple-evidence-20260916.json','workflowRunId':35118158460,'artifactId':10457155516,'artifactDigest':'sha256:7cb65af30cb10a6368a18c875d21a3883006e8164be91199280c4c4ae2cc6468'},
                  'remainingEvidenceGaps':['cross-version Apple OS/toolchain/runtime corpus beyond the pinned macOS 15.7.9 / Xcode 16.4 point','observed real runtime load-map plus OS-derived runtime slide mapped against the pinned real dyld cache'],
                  'remainingEnvironmentExcluded':['X02-F-47 explicit arm64e runtime authentication (arm64 succeeds; arm64e probe SIGSEGV)','X02-H-02 exact pinned LLVM oracle when unavailable'],
                  'sourceOfTruth':'docs/analysis-x02-acceptance.md','fullRoadmapComplete':False,'transformAuthorization':False
                }
              for k,x in list(v.items()):
                if k=='localIntegrationLimitations' and isinstance(x,str) and 'real Apple runtime/cache/signing/device evidence remains absent' in x:
                  v[k]='X02 prior120 matrix is integrated; pinned Apple signing and bounded real dyld-v5 evidence are present, while cross-version corpus, observed runtime load-map/slide, and explicit arm64e runtime authentication remain absent'
                visit(x)
            elif isinstance(v,list):
              for x in v: visit(x)
          visit(data)
          if not (finding_seen and task_seen and current_seen): raise SystemExit(f'audit anchors missing finding={finding_seen} task={task_seen} current={current_seen}')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          # Remove all one-off diagnostic/patch workflows; real acceptance remains permanent.
          for w in temp_workflows:
            Path(w).unlink(missing_ok=True)
          PY
          git diff --check
      - name: Validate focused acceptance and metadata
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/phase4/binary/dyld-shared-cache-slide-v5-page-start.test.mjs
          node --test tests/scpa/x02-prior120-apple-version-matrix.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('docs/analysis-local-acceptance-audit.json','utf8'));
          const e=JSON.parse(fs.readFileSync('tests/scpa/fixtures/x02-real-apple-evidence-20260916.json','utf8'));
          if(e.currentAcceptance['X02-G-09'].classification!=='pass') throw new Error('G09 snapshot');
          if(e.currentAcceptance['X02-B-06'].classification!=='evidence-gap') throw new Error('B06 overclaim');
          if(e.currentAcceptance['X02-F-47'].classification!=='environment-excluded') throw new Error('F47 overclaim');
          const text=JSON.stringify(a);
          if(!text.includes('x02AcceptanceReconciliation20260917')||!text.includes('116 pass/0 product-gap/2 evidence-gap/2 environment-excluded')) throw new Error('audit current overlay');
          JSON.parse(fs.readFileSync('tools/validation/analysis-roadmap/ownership.json','utf8'));
          NODE
      - name: Commit final current overlay
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feat/analysis-roadmap-v8-current-main-20260907'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(x02): accept trusted Apple signing evidence'
          git fetch origin "$BRANCH" --depth=1
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/$BRANCH)" ]; then
            git rebase "origin/$BRANCH"
          fi
          git push origin "HEAD:$BRANCH"
