name: Temporary issue 5300 follow-up
on:
  push:
    branches: [fix/issue-5300-current-contract-followup-20260917]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-5300-current-contract-followup-20260917
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply and verify follow-up
        shell: bash
        run: bash .tmp/issue-5300-followup.sh
