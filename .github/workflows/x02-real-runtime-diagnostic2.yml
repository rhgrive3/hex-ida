name: X-02 real runtime diagnostic 2

on:
  push:
    branches: [feat/analysis-roadmap-v8-current-main-20260907]
    paths: [.github/workflows/x02-real-runtime-diagnostic2.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Capture v5 count first divergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct, traceback
          from pathlib import Path
          out={'stage':'init'}
          try:
            roots=[Path('/System/Library/dyld'),Path('/System/Cryptexes/OS/System/Library/dyld'),Path('/System/Volumes/Preboot/Cryptexes/OS/System/Library/dyld')]
            cache=next((r/'dyld_shared_cache_arm64e' for r in roots if (r/'dyld_shared_cache_arm64e').exists()),None)
            if cache is None: raise RuntimeError('no-cache')
            counts=[]; out.update(cachePath=str(cache),stage='count')
            with cache.open('rb') as f:
              h=f.read(0x200); so,sc=struct.unpack_from('<II',h,0x138)
              f.seek(so); slides=[]
              for i in range(sc):
                a,s,fo,sio,sis,flags,mp,ip=struct.unpack('<QQQQQQII',f.read(56)); slides.append((i,a,s,fo,sio,sis))
              for idx,a,size,fo,sio,sis in slides:
                if not sis: counts.append({'mapping':idx,'version':None,'records':0}); continue
                f.seek(sio); info=f.read(sis); ver=struct.unpack_from('<I',info,0)[0]
                if ver != 5: counts.append({'mapping':idx,'version':ver,'records':None}); continue
                ps,n=struct.unpack_from('<II',info,4)
                if 24+2*n > len(info): raise RuntimeError(f'starts-out-of-bounds mapping={idx} n={n} bytes={len(info)}')
                starts=struct.unpack_from('<'+'H'*n,info,24)
                records=0; max_chain=0
                for page,start in enumerate(starts):
                  if start==0xffff: continue
                  within=start*8; chain=0
                  while True:
                    off=page*ps+within
                    if within%8 or off+8>min((page+1)*ps,size): raise RuntimeError(f'chain-out-of-page mapping={idx} page={page} start={start} within={within} off={off} size={size} ps={ps} records={records}')
                    f.seek(fo+off); rawb=f.read(8)
                    if len(rawb)!=8: raise RuntimeError(f'short-read mapping={idx} page={page} fileOff={fo+off} got={len(rawb)} records={records}')
                    raw=struct.unpack('<Q',rawb)[0]
                    records+=1; chain+=1; nxt=(raw>>52)&0x7ff
                    if nxt==0: break
                    within+=nxt*8
                    if chain>ps//8: raise RuntimeError(f'cycle mapping={idx} page={page} records={records}')
                  max_chain=max(max_chain,chain)
                counts.append({'mapping':idx,'version':5,'records':records,'maxChain':max_chain,'pages':n})
            out.update(stage='count-complete',counts=counts,maxRecordsInMapping=max((x['records'] or 0) for x in counts),totalRecords=sum((x['records'] or 0) for x in counts))
          except Exception as e:
            out.update(stage='count-failed',error=type(e).__name__,message=str(e))
          Path('x02-real-runtime-diagnostic2.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({k:out.get(k) for k in ('stage','message','maxRecordsInMapping','totalRecords')},indent=2))
          PY

      - name: Probe arm64e PAC execution exit
        shell: bash
        run: |
          set -euo pipefail
          cat > pac.c <<'C'
          #include <stdint.h>
          __attribute__((noinline)) static uintptr_t leaf(uintptr_t x) { return (x * 33u) ^ 0x5au; }
          __attribute__((noinline)) static uintptr_t caller(uintptr_t x) { return leaf(x) + 1u; }
          int main(int argc, char **argv) { (void)argv; uintptr_t x=(uintptr_t)argc; return caller(x)==(((x*33u)^0x5au)+1u)?0:3; }
          C
          xcrun clang -arch arm64e -O1 -fno-omit-frame-pointer -msign-return-address=all pac.c -o pac-probe
          codesign --force --sign - pac-probe
          otool -tvV pac-probe > pac-disassembly.txt
          set +e
          ./pac-probe > pac-stdout.txt 2> pac-stderr.txt
          RC=$?
          set -e
          python3 - "$RC" <<'PY'
          import json,re,sys,pathlib
          p=pathlib.Path('x02-real-runtime-diagnostic2.json'); out=json.loads(p.read_text())
          dis=pathlib.Path('pac-disassembly.txt').read_text(errors='replace'); err=pathlib.Path('pac-stderr.txt').read_text(errors='replace')
          out['pac']={'runExit':int(sys.argv[1]),'pacObserved':bool(re.search(r'\bpac(?:i|d|ib|ia|da|db|ga)',dis,re.I)),'authObserved':bool(re.search(r'\b(?:auti|autd|retaa|retab)',dis,re.I)),'stderr':err[:1000]}
          p.write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out['pac'],indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x02-real-runtime-diagnostic2-${{ github.sha }}
          path: x02-real-runtime-diagnostic2.json
          retention-days: 7
