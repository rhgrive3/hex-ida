name: Fixer2 Binary carrier apply

on:
  push:
    branches:
      - consolidate/fixer2-binary-20260913-2033
    paths:
      - .github/fixer2-binary-carrier.patch.gz.b64
      - .github/workflows/fixer2-binary-carrier-apply.yml

permissions:
  contents: write

jobs:
  apply-validate-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Guard exact base and apply carrier patch
        shell: bash
        run: |
          set -euo pipefail
          BASE=59dee3793dfc1f4a5d1d5de85f6b24d0a77f46d9
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --quiet "$BASE"...HEAD -- \
            js/binary/macho-core.js \
            js/binary/elf-core.js \
            js/binary/elf-dynamic.js \
            js/binary/model.js \
            tests/phase4/binary/issue-3765-function-starts-invalid-payload.test.mjs \
            tests/phase4/binary/issue-3961-elf-malformed-dynsym-fallback.test.mjs \
            tests/phase4/binary/issue-3973-elf-section-fixed-entry-remainder.test.mjs \
            tests/phase4/binary/issue-4276-elf-dynamic-relocation-identity.test.mjs \
            tests/issue-3987-virtual-read-materialization-budget.mjs
          base64 -d .github/fixer2-binary-carrier.patch.gz.b64 | gzip -d > /tmp/fixer2-binary-carrier.patch
          git apply --check /tmp/fixer2-binary-carrier.patch
          git apply /tmp/fixer2-binary-carrier.patch

      - name: Focused regression and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/binary/macho-core.js
          node --check js/binary/elf-core.js
          node --check js/binary/elf-dynamic.js
          node --check js/binary/model.js
          timeout 90s node --test \
            tests/phase4/binary/issue-3765-function-starts-invalid-payload.test.mjs \
            tests/phase4/binary/issue-3961-elf-malformed-dynsym-fallback.test.mjs \
            tests/phase4/binary/issue-3973-elf-section-fixed-entry-remainder.test.mjs \
            tests/phase4/binary/issue-4276-elf-dynamic-relocation-identity.test.mjs \
            tests/phase4/binary/issue-4089-elf-anonymous-section-symbol.test.mjs \
            tests/phase4/binary/issue-5682-elf-relocation-import-site-identity.test.mjs \
            tests/phase4/binary/issue-8163-elf-riscv-symbol-alignment.test.mjs \
            tests/phase4/binary/issue-8168-elf-arm32-thumb-symbol-state.test.mjs
          timeout 30s node tests/issue-3987-virtual-read-materialization-budget.mjs
          timeout 30s node tests/issue-970-virtual-read-span.mjs

      - name: Binary and lint gates
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s npm run binary:test
          timeout 90s node tests/check.mjs

      - name: Commit clean carrier tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/fixer2-binary-carrier.patch.gz.b64 .github/workflows/fixer2-binary-carrier-apply.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(binary): consolidate Fixer2 authority and resource hardening"
          git push origin HEAD:consolidate/fixer2-binary-20260913-2033
