name: Final head admission

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  status:
  workflow_run:
    workflows:
      - PR fast gate
      - Invariant Gates
      - Agent loop resilience
      - AI evaluation contract
      - Issue 2528 canonical claims authority
      - Phase 7 ownership
      - Phase 8 ownership
      - Phase 4 exact-SHA release validation
      - Phase 6 release validation
      - Phase 7 release validation
      - Phase 8 release validation
      - Phase 9 preflight
      - Phase 10 release validation
      - Phase 11 release validation
      - Phase 12 release validation
      - Stage 1 analysis truth validation
      - Stage 2 authority runtime rebuild validation
      - Stage 2 non-physical closure proof
      - Cross-binary accuracy
      - Ghidra decompiler differential
      - UI regression
      - Universal binary platform
      - ChatGPT userscript host
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true
        type: number

permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: final-head-admission-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.sha || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  admission:
    name: exact-head-admission-controller
    if: ${{ github.event_name != 'status' || github.event.context != 'hex/final-head-admission' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never execute PR-head code in this privileged workflow. The evaluator is
      # loaded only from the repository's default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: tools/validation/final-head-admission.mjs
          sparse-checkout-cone-mode: false

      - name: Evaluate exact-head admission evidence
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const evaluator = await import(pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE, 'tools/validation/final-head-admission.mjs'),
            ).href);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let prNumber = null;
            let triggeringHead = null;

            if (context.eventName === 'pull_request_target' || context.eventName === 'pull_request_review') {
              prNumber = context.payload.pull_request?.number ?? null;
              triggeringHead = context.payload.pull_request?.head?.sha ?? null;
            } else if (context.eventName === 'workflow_run') {
              triggeringHead = context.payload.workflow_run?.head_sha ?? null;
              prNumber = context.payload.workflow_run?.pull_requests?.[0]?.number ?? null;
            } else if (context.eventName === 'status') {
              triggeringHead = context.payload.sha ?? null;
            } else if (context.eventName === 'workflow_dispatch') {
              const parsed = Number(process.env.DISPATCH_PR_NUMBER);
              if (Number.isSafeInteger(parsed) && parsed > 0) prNumber = parsed;
            }

            async function findOpenPrByHeadSha(sha) {
              if (!sha) return null;
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100,
              });
              return pulls.find((candidate) => candidate.head?.sha === sha) ?? null;
            }

            let pr;
            if (prNumber != null) {
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber }));
            } else {
              pr = await findOpenPrByHeadSha(triggeringHead);
            }
            if (!pr || pr.state !== 'open') {
              core.info('No open pull request is bound to this event; nothing to admit.');
              return;
            }

            const headSha = pr.head?.sha;
            if (triggeringHead && triggeringHead !== headSha) {
              core.info(`Ignoring stale event head ${triggeringHead}; PR #${pr.number} is now ${headSha}.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner, repo, ref: headSha, per_page: 100,
            });
            const { data: checkData } = await github.rest.checks.listForRef({
              owner, repo, ref: headSha, per_page: 100, filter: 'latest',
            });
            const checkRuns = checkData.check_runs ?? [];

            let unresolvedReviewThreads = 0;
            let cursor = null;
            for (;;) {
              const page = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        nodes { isResolved }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }
              `, { owner, repo, number: pr.number, cursor });
              const threads = page.repository?.pullRequest?.reviewThreads;
              if (!threads) throw new Error('final-head-admission-review-threads-unavailable');
              unresolvedReviewThreads += threads.nodes.filter((thread) => !thread.isResolved).length;
              if (!threads.pageInfo.hasNextPage) break;
              cursor = threads.pageInfo.endCursor;
            }

            const result = evaluator.evaluateFinalHeadAdmission({
              headSha,
              draft: pr.draft === true,
              reviews,
              statuses,
              checkRuns,
              unresolvedReviewThreads,
            });

            const targetUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: headSha,
              state: result.state,
              context: evaluator.FINAL_HEAD_ADMISSION_CONTEXT,
              description: result.description.slice(0, 140),
              target_url: targetUrl,
            });

            core.summary
              .addHeading(`Final-head admission: ${result.state}`)
              .addRaw(`PR: #${pr.number}\n`)
              .addRaw(`Head: ${headSha}\n`)
              .addRaw(`AUTO approvals on head: ${result.evidence.exactAutoApprovalCount}\n`)
              .addRaw(`Unresolved review threads: ${result.evidence.unresolvedReviewThreads}\n`)
              .addRaw(`CodeRabbit evidence: ${result.evidence.codeRabbitEvidenceCount}\n`)
              .addRaw(`CI statuses/checks: ${result.evidence.ciStatusCount}/${result.evidence.ciCheckCount}\n`)
              .addRaw(`Blockers: ${result.blockers.join(' | ') || '(none)'}\n`)
              .addRaw(`Pending: ${result.pending.join(' | ') || '(none)'}\n`)
              .write();

            if (result.state === 'failure') {
              core.setFailed(result.description);
            } else if (result.state === 'pending') {
              core.notice(result.description);
            }
