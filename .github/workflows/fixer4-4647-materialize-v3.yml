name: Fixer4 issue 4647 materializer v3

on:
  push:
    branches:
      - fixer4/issue-4647-pdb-byte-depth-budget
    paths:
      - .github/workflows/fixer4-4647-materialize-v3.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixer4/issue-4647-pdb-byte-depth-budget
          fetch-depth: 1
      - name: Materialize verified patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/fixer4-4647-materialize.yml').read_text()
          start = "          cat > /tmp/fixer4-4647.patch <<'PATCH'\n"
          end = "          PATCH\n"
          body = text.split(start, 1)[1].split(end, 1)[0]
          lines = []
          for line in body.splitlines(True):
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected embedded-patch indentation: {line!r}')
              lines.append(line[10:])
          Path('/tmp/fixer4-4647.patch').write_text(''.join(lines))
          PY
          git apply --check /tmp/fixer4-4647.patch
          git apply /tmp/fixer4-4647.patch
          test "$(git hash-object js/analysis/debug/pdb.js)" = '611740a9365090c763a0c87a7a294b9d7d0aa897'
          test "$(git hash-object tests/phase7/debug/issue-4647-pdb-byte-depth-budget.test.mjs)" = 'dc48775f1790c76fdc95c07804e0ff02e5db79e7'
          rm .github/workflows/fixer4-4647-materialize.yml .github/workflows/fixer4-4647-materialize-v2.yml .github/workflows/fixer4-4647-materialize-v3.yml
          git config user.name 'Fixer 4 Runtime'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/analysis/debug/pdb.js tests/phase7/debug/issue-4647-pdb-byte-depth-budget.test.mjs .github/workflows/fixer4-4647-materialize.yml .github/workflows/fixer4-4647-materialize-v2.yml .github/workflows/fixer4-4647-materialize-v3.yml
          git diff --cached --check
          git commit -m 'fix(debug): enforce PDB byte and depth budgets (#4647)'
          git push origin HEAD:fixer4/issue-4647-pdb-byte-depth-budget
