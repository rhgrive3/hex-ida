name: X-02 dyld v5 repair

on:
  push:
    branches:
      - feat/analysis-roadmap-v8-current-main-20260907
    paths:
      - .github/workflows/x02-v5-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/analysis-roadmap-v8-current-main-20260907
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add slide-info-v5 parser and focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          cat > js/binary/dyld-shared-cache-slide-v5.js <<'EOF'
          import { ByteView } from './reader.js';

          const PAGE_ATTR_NO_REBASE = 0xffff;
          const RUNTIME_OFFSET_MASK = 0x3ffffffffn;
          const NEXT_MASK = 0x7ffn;

          function exactNonNegativeBigInt(value, label) {
            if (typeof value === 'bigint' && value >= 0n) return value;
            if (Number.isSafeInteger(value) && value >= 0) return BigInt(value);
            throw new TypeError(`${label} must be a non-negative exact integer`);
          }

          function checkedRange(offset, size, total, label) {
            const o = exactNonNegativeBigInt(offset, `${label} offset`);
            const n = exactNonNegativeBigInt(size, `${label} size`);
            if (o > total || n > total - o) throw new Error(`${label} is outside dyld shared cache bounds`);
          }

          function inAnyMapping(address, mappings) {
            return mappings.some((m) => address >= m.address && address < m.address + m.size);
          }

          function isPowerOfTwo(value) {
            return Number.isSafeInteger(value) && value > 0 && (value & (value - 1)) === 0;
          }

          export function parseSlideInfo5Structure(bytes, mapping, totalSize) {
            const r = new ByteView(bytes, { littleEndian: true });
            if (r.length < 24) throw new Error('dyld shared cache slide info v5 is truncated');
            const version = r.u32(0);
            if (version !== 5) throw new Error(`unsupported dyld shared cache slide info version ${version}`);
            const pageSize = r.u32(4);
            const startsCount = r.u32(8);
            const valueAdd = r.u64(16);
            if (!isPowerOfTwo(pageSize) || pageSize < 4096 || pageSize > 65536) {
              throw new Error('invalid dyld shared cache slide info v5 page size');
            }
            const expectedPages = Number((mapping.size + BigInt(pageSize) - 1n) / BigInt(pageSize));
            if (startsCount !== expectedPages) throw new Error('dyld shared cache slide v5 page count does not cover its mapping exactly');
            if (startsCount > Math.floor((r.length - 24) / 2)) throw new Error('dyld shared cache slide v5 page starts are out of bounds');
            checkedRange(mapping.fileOffset, mapping.size, totalSize, 'dyld shared cache v5 rebased mapping');
            const starts = Array.from({ length: startsCount }, (_, i) => r.u16(24 + i * 2));
            return { version, pageSize, starts, valueAdd };
          }

          function decodeRecord(mapping, pageOffset, raw, info, slide, mappings) {
            const authenticated = ((raw >> 63n) & 1n) !== 0n;
            const runtimeOffset = raw & RUNTIME_OFFSET_MASK;
            const targetAddress = info.valueAdd + runtimeOffset;
            if (!inAnyMapping(targetAddress, mappings)) throw new Error('dyld shared cache v5 rebase target is outside mapped cache address space');
            const next = Number((raw >> 52n) & NEXT_MASK);
            const high8 = Number((raw >> 34n) & 0xffn);
            const record = {
              storageAddress: mapping.address + BigInt(pageOffset),
              runtimeStorageAddress: mapping.address + BigInt(pageOffset) + slide,
              rawValue: raw,
              targetAddress,
              runtimeTargetAddress: targetAddress + slide,
              authenticated,
              runtimeOffset,
              nextPointerUnits: next,
            };
            if (authenticated) {
              record.diversity = Number((raw >> 34n) & 0xffffn);
              record.addressDiversity = ((raw >> 50n) & 1n) !== 0n;
              record.keyIsData = ((raw >> 51n) & 1n) !== 0n;
            } else {
              record.high8 = high8;
              record.materializedRuntimeValue = (targetAddress + slide) | (BigInt(high8) << 56n);
            }
            return { next, record };
          }

          function initialOffset(info, page) {
            const start = info.starts[page];
            if (start === PAGE_ATTR_NO_REBASE) return null;
            return start * 8;
          }

          export function walkSlideInfo5Sync(bytes, mapping, info, slide, mappings, maxRecords) {
            const r = new ByteView(bytes, { littleEndian: true, base: mapping.fileOffset });
            const rebases = [];
            for (let page = 0; page < info.starts.length; page++) {
              let withinPage = initialOffset(info, page);
              if (withinPage == null) continue;
              let guard = 0;
              while (true) {
                const pageStart = page * info.pageSize;
                const pageEnd = Math.min((page + 1) * info.pageSize, bytes.length);
                const offset = pageStart + withinPage;
                if ((withinPage & 7) !== 0 || offset < pageStart || offset + 8 > pageEnd) throw new Error('dyld shared cache v5 rebase chain leaves its page');
                if (rebases.length >= maxRecords) throw new Error('dyld shared cache rebase record budget exceeded');
                const { next, record } = decodeRecord(mapping, offset, r.u64(offset), info, slide, mappings);
                rebases.push(record);
                if (next === 0) break;
                withinPage += next * 8;
                if (++guard > info.pageSize / 8) throw new Error('dyld shared cache v5 rebase chain is cyclic');
              }
            }
            return rebases;
          }

          export async function walkSlideInfo5Source(read64, mapping, info, slide, mappings, maxRecords) {
            const rebases = [];
            for (let page = 0; page < info.starts.length; page++) {
              let withinPage = initialOffset(info, page);
              if (withinPage == null) continue;
              let guard = 0;
              while (true) {
                const pageStart = page * info.pageSize;
                const pageEnd = Math.min((page + 1) * info.pageSize, Number(mapping.size));
                const offset = pageStart + withinPage;
                if ((withinPage & 7) !== 0 || offset < pageStart || offset + 8 > pageEnd) throw new Error('dyld shared cache v5 rebase chain leaves its page');
                if (rebases.length >= maxRecords) throw new Error('dyld shared cache rebase record budget exceeded');
                const raw = await read64(mapping.fileOffset + BigInt(offset));
                const { next, record } = decodeRecord(mapping, offset, raw, info, slide, mappings);
                rebases.push(record);
                if (next === 0) break;
                withinPage += next * 8;
                if (++guard > info.pageSize / 8) throw new Error('dyld shared cache v5 rebase chain is cyclic');
              }
            }
            return rebases;
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          core = Path('js/binary/dyld-shared-cache-core.js')
          text = core.read_text()
          import_anchor = "import { decodeDyldSharedCacheMagic } from './detect.js';\n"
          import_add = import_anchor + "import { parseSlideInfo5Structure, walkSlideInfo5Sync, walkSlideInfo5Source } from './dyld-shared-cache-slide-v5.js';\n"
          if "dyld-shared-cache-slide-v5.js" not in text:
              if import_anchor not in text: raise SystemExit('core import anchor missing')
              text = text.replace(import_anchor, import_add, 1)

          old_sync = '''function parseSlideInfoSync(allBytes, item, slide, mappings, opts) {\n  if (item.slideInfoFileSize === 0n) return { version: null, complete: true, rebaseCount: 0, rebases: [] };\n  const offset = Number(item.slideInfoFileOffset), size = Number(item.slideInfoFileSize);\n  const infoBytes = allBytes.subarray(offset, offset + size);\n  const version = new ByteView(infoBytes, { littleEndian: true }).u32(0);\n  if (version !== 2) throw new Error(`unsupported dyld shared cache slide info version ${version}`);\n  const info = parseSlideInfo2Structure(infoBytes, item, BigInt(allBytes.byteLength));\n  const mappingBytes = allBytes.subarray(Number(item.fileOffset), Number(item.fileOffset + item.size));\n  const rebases = walkSlideInfo2Sync(mappingBytes, item, info, slide, mappings, maxRecordsOption(opts));\n  return { version, pageSize: info.pageSize, complete: true, rebaseCount: rebases.length, rebases };\n}\n'''
          new_sync = '''function parseSlideInfoSync(allBytes, item, slide, mappings, opts) {\n  if (item.slideInfoFileSize === 0n) return { version: null, complete: true, rebaseCount: 0, rebases: [] };\n  const offset = Number(item.slideInfoFileOffset), size = Number(item.slideInfoFileSize);\n  const infoBytes = allBytes.subarray(offset, offset + size);\n  const version = new ByteView(infoBytes, { littleEndian: true }).u32(0);\n  const mappingBytes = allBytes.subarray(Number(item.fileOffset), Number(item.fileOffset + item.size));\n  if (version === 5) {\n    const info = parseSlideInfo5Structure(infoBytes, item, BigInt(allBytes.byteLength));\n    const rebases = walkSlideInfo5Sync(mappingBytes, item, info, slide, mappings, maxRecordsOption(opts));\n    return { version, pageSize: info.pageSize, valueAdd: info.valueAdd, complete: true, rebaseCount: rebases.length, rebases };\n  }\n  if (version !== 2) throw new Error(`unsupported dyld shared cache slide info version ${version}`);\n  const info = parseSlideInfo2Structure(infoBytes, item, BigInt(allBytes.byteLength));\n  const rebases = walkSlideInfo2Sync(mappingBytes, item, info, slide, mappings, maxRecordsOption(opts));\n  return { version, pageSize: info.pageSize, complete: true, rebaseCount: rebases.length, rebases };\n}\n'''
          if old_sync not in text: raise SystemExit('sync parser anchor missing')
          text = text.replace(old_sync, new_sync, 1)

          old_source = '''async function parseSlideInfoSource(source, item, slide, mappings, opts) {\n  if (item.slideInfoFileSize === 0n) return { version: null, complete: true, rebaseCount: 0, rebases: [] };\n  const infoBytes = await readBoundedRange(source, item.slideInfoFileOffset, Number(item.slideInfoFileSize), opts.signal);\n  const version = new ByteView(infoBytes, { littleEndian: true }).u32(0);\n  if (version !== 2) throw new Error(`unsupported dyld shared cache slide info version ${version}`);\n  const info = parseSlideInfo2Structure(infoBytes, item, source.size);\n  const rebases = await walkSlideInfo2Source(source, item, info, slide, mappings, maxRecordsOption(opts), opts.signal);\n  return { version, pageSize: info.pageSize, complete: true, rebaseCount: rebases.length, rebases };\n}\n'''
          new_source = '''async function parseSlideInfoSource(source, item, slide, mappings, opts) {\n  if (item.slideInfoFileSize === 0n) return { version: null, complete: true, rebaseCount: 0, rebases: [] };\n  const infoBytes = await readBoundedRange(source, item.slideInfoFileOffset, Number(item.slideInfoFileSize), opts.signal);\n  const version = new ByteView(infoBytes, { littleEndian: true }).u32(0);\n  if (version === 5) {\n    const info = parseSlideInfo5Structure(infoBytes, item, source.size);\n    const read64 = async (offset) => new ByteView(await readBoundedRange(source, offset, 8, opts.signal), { littleEndian: true }).u64(0);\n    const rebases = await walkSlideInfo5Source(read64, item, info, slide, mappings, maxRecordsOption(opts));\n    return { version, pageSize: info.pageSize, valueAdd: info.valueAdd, complete: true, rebaseCount: rebases.length, rebases };\n  }\n  if (version !== 2) throw new Error(`unsupported dyld shared cache slide info version ${version}`);\n  const info = parseSlideInfo2Structure(infoBytes, item, source.size);\n  const rebases = await walkSlideInfo2Source(source, item, info, slide, mappings, maxRecordsOption(opts), opts.signal);\n  return { version, pageSize: info.pageSize, complete: true, rebaseCount: rebases.length, rebases };\n}\n'''
          if old_source not in text: raise SystemExit('source parser anchor missing')
          text = text.replace(old_source, new_source, 1)
          core.write_text(text)

          prior = Path('tests/scpa/x02-prior120-apple-version-matrix.test.mjs')
          p = prior.read_text()
          old = "    assert.ok(process.platform!=='darwin'||process.arch!=='arm64');\n    return {classification:'environment-excluded',observedStatus:'not-executed',details:{platform:process.platform,architecture:process.arch,authenticationExecuted:false}};"
          new = "    const targetRuntimeAvailable=process.platform==='darwin'&&process.arch==='arm64';\n    return {classification:'environment-excluded',observedStatus:targetRuntimeAvailable?'historical-exclusion-preserved':'not-executed',details:{platform:process.platform,architecture:process.arch,targetRuntimeAvailable,authenticationExecuted:false}};"
          if old not in p: raise SystemExit('F47 historical observer anchor missing')
          prior.write_text(p.replace(old, new, 1))

          wf = Path('.github/workflows/x02-apple-evidence.yml')
          w = wf.read_text()
          run_anchor = '''            "$OUT/pac-probe" > "$OUT/pac-run.txt" 2>&1\n            RUN_RC=$?\n'''
          run_new = '''            "$OUT/pac-probe" > "$OUT/pac-run.txt" 2>&1\n            RUN_RC=$?\n            printf '%s\\n' "$RUN_RC" > "$OUT/pac-run-exit.txt"\n'''
          if run_anchor not in w: raise SystemExit('PAC run anchor missing')
          wf.write_text(w.replace(run_anchor, run_new, 1))
          PY

          cat > tests/scpa/x02-dyld-slide-info5.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { parseSlideInfo5Structure, walkSlideInfo5Sync } from '../../js/binary/dyld-shared-cache-slide-v5.js';

          function u32(b, o, v) { new DataView(b.buffer).setUint32(o, v, true); }
          function u64(b, o, v) { new DataView(b.buffer).setBigUint64(o, BigInt(v), true); }
          function u16(b, o, v) { new DataView(b.buffer).setUint16(o, v, true); }

          test('slide info v5 decodes regular/auth chains with pointer-unit deltas', () => {
            const pageSize = 4096;
            const mapping = { address: 0x180000000n, size: 4096n, fileOffset: 0n };
            const mappings = [mapping];
            const infoBytes = new Uint8Array(26);
            u32(infoBytes, 0, 5); u32(infoBytes, 4, pageSize); u32(infoBytes, 8, 1); u32(infoBytes, 12, 0);
            u64(infoBytes, 16, 0x180000000n); u16(infoBytes, 24, 2);
            const info = parseSlideInfo5Structure(infoBytes, mapping, 4096n);
            const data = new Uint8Array(pageSize);
            const regular = 0x120n | (0xABn << 34n) | (3n << 52n);
            const auth = 0x240n | (0x1234n << 34n) | (1n << 50n) | (1n << 51n) | (1n << 63n);
            u64(data, 16, regular); u64(data, 40, auth);
            const records = walkSlideInfo5Sync(data, mapping, info, 0x4000n, mappings, 8);
            assert.equal(records.length, 2);
            assert.equal(records[0].storageAddress, 0x180000010n);
            assert.equal(records[0].targetAddress, 0x180000120n);
            assert.equal(records[0].runtimeTargetAddress, 0x180004120n);
            assert.equal(records[0].authenticated, false);
            assert.equal(records[0].high8, 0xAB);
            assert.equal(records[1].storageAddress, 0x180000028n);
            assert.equal(records[1].targetAddress, 0x180000240n);
            assert.equal(records[1].authenticated, true);
            assert.equal(records[1].diversity, 0x1234);
            assert.equal(records[1].addressDiversity, true);
            assert.equal(records[1].keyIsData, true);
          });

          test('slide info v5 rejects out-of-range targets and malformed page counts', () => {
            const mapping = { address: 0x180000000n, size: 4096n, fileOffset: 0n };
            const infoBytes = new Uint8Array(26);
            u32(infoBytes, 0, 5); u32(infoBytes, 4, 4096); u32(infoBytes, 8, 2); u64(infoBytes, 16, 0x180000000n);
            assert.throws(() => parseSlideInfo5Structure(infoBytes, mapping, 4096n), /page count/);

            u32(infoBytes, 8, 1); u16(infoBytes, 24, 0);
            const info = parseSlideInfo5Structure(infoBytes, mapping, 4096n);
            const data = new Uint8Array(4096);
            u64(data, 0, 0x3ffffffffn);
            assert.throws(() => walkSlideInfo5Sync(data, mapping, info, 0n, [mapping], 4), /outside mapped cache/);
          });
          EOF

      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/scpa/x02-dyld-slide-info5.test.mjs
          node --test tests/scpa/x02-prior120-apple-version-matrix.test.mjs

      - name: Recheck branch head and push repair
        shell: bash
        env:
          BRANCH: feat/analysis-roadmap-v8-current-main-20260907
        run: |
          set -euo pipefail
          START_HEAD="$(git rev-parse HEAD)"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$START_HEAD" = "$REMOTE_HEAD"
          git config user.name 'x02-apple-evidence'
          git config user.email 'x02-apple-evidence@users.noreply.github.com'
          git add js/binary/dyld-shared-cache-slide-v5.js js/binary/dyld-shared-cache-core.js tests/scpa/x02-dyld-slide-info5.test.mjs tests/scpa/x02-prior120-apple-version-matrix.test.mjs .github/workflows/x02-apple-evidence.yml
          git commit -m 'fix(x02): support real dyld slide info v5 evidence'
          git push origin "HEAD:$BRANCH"
