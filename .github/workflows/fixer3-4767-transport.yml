name: Fixer3 issue 4767 transport
on:
  push:
    branches:
      - 'fixer3/transport-4767-partial-page-total'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply verified patch
        shell: bash
        env:
          EXPECTED_BASE: d5e8fb371a640ecb062832692d314c159be98258
          EXPECTED_BEFORE: dc8e70a7097116f69f195a373738c89d7a393b11
          EXPECTED_AFTER: 6b4c33a7baf8f44a8e3411365a6312785499bbec
          EXPECTED_TEST: f5dde25f3d1be2428a68c72b25dd58ba8e6a7598
          PATCH_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git hash-object js/analysis/query/app-adapter.js)" = "$EXPECTED_BEFORE"
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          test "$(git hash-object js/analysis/query/app-adapter.js)" = "$EXPECTED_AFTER"
          test "$(git hash-object tests/phase7/issue-4767-partial-page-total.test.mjs)" = "$EXPECTED_TEST"
          node tests/phase7/issue-4767-partial-page-total.test.mjs
          git config user.name 'Fixer 3 Analysis'
          git config user.email 'actions@users.noreply.github.com'
          git add js/analysis/query/app-adapter.js tests/phase7/issue-4767-partial-page-total.test.mjs
          git rm .github/workflows/fixer3-4767-transport.yml
          git commit -m 'fix(query): hide totals for incomplete pages (#4767)'
          git -c core.hooksPath=/dev/null push origin HEAD:fixer3/transport-4767-partial-page-total
