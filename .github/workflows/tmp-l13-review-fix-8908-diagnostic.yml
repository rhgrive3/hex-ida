name: tmp-l13-review-fix-8908-diagnostic
on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-03-batch-03
permissions:
  contents: write
jobs:
  diagnose-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-campaign-20260914-lane-03-batch-03
          fetch-depth: 0
      - name: Guard exact reviewed ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "64826417dc83e3970b2d6467535e8c1b12b34155"
          test "$(git rev-parse HEAD^^^^)" = "63bc4e12d3ab4800421d6647ad69893108556e93"
      - name: Apply exact repair script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          text = Path('.github/workflows/tmp-l13-review-fix-8908.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY"
          if text.count(start) != 1:
              raise SystemExit('repair script start marker mismatch')
          script = text.split(start, 1)[1].split(end, 1)[0]
          Path('/tmp/l13-apply.py').write_text(dedent(script))
          PY
          python3 /tmp/l13-apply.py
      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 10s node --check js/managed/cil/metadata-layout.js
          timeout 10s node --check js/managed/cil/metadata-definitions.js
          timeout 10s node --check js/managed/cil/metadata-generics.js
          timeout 10s node --check js/managed/cil/metadata-manifest-security.js
          timeout 10s node --check js/managed/cil/parser-overlay.js
          timeout 10s node --check js/managed/cil/parser.js
          timeout 10s node --check tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs
      - name: Retained-row heap regression
        run: timeout 45s node tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs
      - name: String alias and GenericParam regression
        run: timeout 90s node tests/phase11/cil/issue-8699-cil-metadata-string-alias-budget.test.mjs
      - name: Public parse single-pass regression
        run: timeout 90s node tests/phase11/cil/issue-8699-8797-public-parse-single-pass.test.mjs
      - name: ExportedType resolution regression
        run: timeout 90s node tests/phase11/cil/issue-8797-cil-exportedtype-resolution-budget.test.mjs
      - name: Definition identity regression
        run: timeout 90s node tests/phase11/cil/issue-8778-cil-definition-identity.test.mjs
      - name: Commit repair and remove transports
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-l13-review-fix-8908.yml
          rm .github/workflows/tmp-l13-review-fix-8908-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/managed/cil tests/phase11/cil .github/workflows/tmp-l13-review-fix-8908.yml .github/workflows/tmp-l13-review-fix-8908-diagnostic.yml
          git commit -m "fix(cil): charge retained metadata rows against heap budget"
          git push origin HEAD:codex/issue-campaign-20260914-lane-03-batch-03
