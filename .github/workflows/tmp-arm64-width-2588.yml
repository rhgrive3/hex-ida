name: Temporary ARM64 structured width repair
on:
  push:
    branches: [fix/arm64-structured-width-2588]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arm64-structured-width-2588
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply strict structured-width repair
        run: python3 tools/tmp-arm64-width-2588-repair.py
      - name: Focused regression
        run: |
          node tests/machine-effects/arm64-structured-width-validation.test.mjs
          node tests/machine-effects/arm64-memory-register-identity.test.mjs
          node tests/machine-effects/arm64-int-arithmetic.test.mjs
          npm run effects:test
      - name: Commit repair and remove temporary runner
        run: |
          rm -f .github/workflows/tmp-arm64-width-2588.yml tools/tmp-arm64-width-2588-repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(arm64): reject coerced structured register widths'
          git push origin HEAD:fix/arm64-structured-width-2588
