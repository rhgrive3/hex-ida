name: Temporary apply independent final fixes

on:
  push:
    branches:
      - fix/independent-io-pr7036-aware-20260914

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile latest #7036 and apply verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin refs/heads/feat/analysis-roadmap-v8-current-main-20260907:refs/remotes/origin/feat/analysis-roadmap-v8-current-main-20260907
          BASE="$(git rev-parse refs/remotes/origin/feat/analysis-roadmap-v8-current-main-20260907)"
          echo "latest #7036 head: $BASE"
          git merge --no-ff --no-edit "$BASE"
          printf '%s' '' | base64 -d > /tmp/independent-final.patch
          git apply --check /tmp/independent-final.patch
          git apply /tmp/independent-final.patch
          timeout 180s node tests/architecture-abi.mjs
          timeout 180s node --test tests/phase4/architecture-abi-compat-regressions.test.mjs tests/phase4/arm64-memory-presentation-contract.test.mjs tests/phase4/issue-3630-elf-dynamic-section-authority.test.mjs
          rm -f .github/workflows/apply-independent-final-fixes-temp.yml
          git add -A
          git commit -m 'fix(analysis): resolve remaining Phase4 and ABI regressions'
          git push origin HEAD:fix/independent-io-pr7036-aware-20260914
