name: Temporary issue 2412 repair runner

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-2412-repair-runner
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2412-canonical-root-identity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check whether target still needs the guarded repair
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e HEAD:tools/tmp-issue-2412.py 2>/dev/null; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact issue 2412 baseline
        if: steps.target.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/analysis/alias/canonical-address-v2-core.js)" = "e733a43a60ec1a657bc91d71f358e686ce2c1397"
          test "$(git hash-object js/analysis/pointsto/local.js)" = "294b44ae8363a253d51ee52fb9d59fe4c04395f4"
          node --input-type=module <<'JS'
          import { normalizeRootIdentity, defaultRootEntityId } from './js/analysis/alias/canonical-address-v2-core.js';
          const variable = { key: 'x0', kind: 'register', scope: 'function' };
          const a = normalizeRootIdentity(variable, { source: 'A' });
          const b = normalizeRootIdentity(variable, { source: 'B' });
          if (a?.functionId !== '[object Object]' || b?.functionId !== '[object Object]' || defaultRootEntityId(a) !== defaultRootEntityId(b)) {
            throw new Error('issue-2412-precondition-no-longer-reproduces');
          }
          JS
      - name: Apply guarded repair
        if: steps.target.outputs.needed == 'true'
        run: python3 tools/tmp-issue-2412.py
      - name: Install dependencies
        if: steps.target.outputs.needed == 'true'
        run: npm ci
      - name: Validate repair and canonical generated output
        if: steps.target.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check js/analysis/alias/canonical-address-v2-core.js
          node --check js/analysis/pointsto/local.js
          node tests/canonical-address-v2-root-identity.test.mjs
          node tests/semantic-v2/issue-817-canonical-stack-offsets.test.mjs
          node tests/semantic-v2/repair-region-provenance-core.test.mjs
          node tests/phase7/pointsto/a2-local.test.mjs
          npm run userscript:build
          npm run semantic-v2:test
          git diff --check
      - name: Publish repaired PR head
        if: steps.target.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-2412-one-shot.yml tools/tmp-issue-2412.py
          git add -A
          git commit -m 'fix(alias): reject malformed canonical root identities'
          git push origin HEAD:fix/2412-canonical-root-identity
