name: fix-8828-pure-zerofill

on:
  push:
    branches:
      - fix/issue-8828-pure-zerofill-ownership

permissions:
  contents: write

jobs:
  apply-verify-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-8828-pure-zerofill-ownership
          fetch-depth: 0
      - name: Apply pure zero-fill ownership fix and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/macho.js')
          s = p.read_text()
          old = "const backed = (info.segments || []).filter((segment) => segment.validMapping && segment.filesize > 0n);"
          new = "const owned = (info.segments || []).filter((segment) => segment.validMapping && segment.vmsize > 0n);"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old_loop = "for (let i = 0; i < backed.length; i++) {\n      for (let j = i + 1; j < backed.length; j++) {\n        const a = backed[i], b = backed[j];"
          new_loop = "for (let i = 0; i < owned.length; i++) {\n      for (let j = i + 1; j < owned.length; j++) {\n        const a = owned[i], b = owned[j];"
          assert s.count(old_loop) == 1
          p.write_text(s.replace(old_loop, new_loop, 1))

          t = Path('tests/phase4/binary/issue-8828-legacy-macho-segment-vm-overlap.test.mjs')
          ts = t.read_text()
          anchor = "// 6. Identical file mappings for a shared VM range stay byte-unambiguous."
          assert ts.count(anchor) == 1
          case = """// 6. A pure zero-fill segment overlapping file-backed bytes is ambiguous.\n{\n  const zero = { name: '__ZERO', secname: '__bss', vmaddr: 0x1080, vmsize: 0x80, fileoff: 0x0, filesize: 0x0, addr: 0x1080, size: 0x80, offset: 0x0, secflags: 0x1 };\n  const text = { name: '__TEXT', secname: '__text', vmaddr: 0x1000, vmsize: 0x200, fileoff: 0x100, filesize: 0x200, addr: 0x1000, size: 0x200, offset: 0x100 };\n  const bytes = thinMachO64([text, zero]);\n  const info = parseSlice(bytes.buffer, 0, bytes.length);\n  assert.equal(info.segmentOwnershipConflict, true, 'file-backed vs pure zero-fill overlap flagged');\n  assert.equal(info.segments.every((s) => !s.validMapping && s.mappingConflict), true, 'both owners demoted');\n  assert.equal(regionsFrom(info, 0n, BigInt(bytes.length), BigInt(bytes.length)).length, 0, 'ambiguous ownership publishes no region');\n}\n\n// 7. Identical file mappings for a shared VM range stay byte-unambiguous.\n"""
          t.write_text(ts.replace(anchor, case, 1))
          PY
      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          node --check js/macho.js
          timeout 60s node --test tests/phase4/binary/issue-8828-legacy-macho-segment-vm-overlap.test.mjs
          timeout 120s node --test tests/phase4/binary/issue-8840-legacy-macho-fat-slice-overlap.test.mjs tests/phase4/binary/issue-8832-macho-ehframe-fde-containment.test.mjs
      - name: Publish clean branch head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-8828-pure-zerofill.yml
          git add js/macho.js tests/phase4/binary/issue-8828-legacy-macho-segment-vm-overlap.test.mjs
          git commit -m "fix(macho/legacy): include pure zero-fill VM owners (#8828)"
          git push origin HEAD:refs/heads/fix/issue-8828-pure-zerofill-ownership
