name: Fixer 3 4795 transport

on:
  push:
    branches:
      - fixer3/issue-4795-discovery-budget

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixer3/issue-4795-discovery-budget
          fetch-depth: 20
      - name: Finalize verified Fixer 3 change
        shell: bash
        env:
          EXPECTED_BASE: a41489725a3e3954c01c5992c8c8ca7901a26c13
          BRANCH: fixer3/issue-4795-discovery-budget
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[transport-exact]'; then
            exit 0
          fi
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/analysis/discovery/fusion.js')
          text = path.read_text()
          old = "    if (candidateStarts.size > budget.maxCandidates) {\n      return { candidates: [], status: status('truncated', 'budget-exhausted') };\n    }\n  }\n  const byStart = new Map();"
          new = "    if (candidateStarts.size > budget.maxCandidates) {\n      return { candidates: [], status: status('truncated', 'budget-exhausted') };\n    }\n  }\n\n  const byStart = new Map();"
          if text.count(old) != 1:
              raise SystemExit('fusion formatting authority mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/analysis/discovery/fusion.js
          git diff --check
          git config user.name 'Fixer 3 Analysis'
          git config user.email 'actions@users.noreply.github.com'
          git add js/analysis/discovery/fusion.js
          git commit -m '[transport-exact] fix(discovery): finalize #4795 patch'
          git push origin HEAD:"$BRANCH"
