name: reconcile-6-soundness
on:
  push:
    branches:
      - fix/reconcile-6-soundness-20260908
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[reconcile-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate reconciled fixes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/reconcile6/patch.* > /tmp/patch.b64
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/reconcile.patch
          git apply --3way --whitespace=nowarn /tmp/reconcile.patch
          cat .github/reconcile6/contract.* > /tmp/contract.b64
          base64 -d /tmp/contract.b64 | gzip -d > js/analysis/summary/contract.js
          TERM=xterm node --test \
            tests/phase7/foundation/issue-4387-local-summary-identity.test.mjs \
            tests/phase7/summary/issue-4314-4320-summary-consumer-validation.test.mjs \
            tests/phase7/summary/issue-4695-unresolved-target-completeness.test.mjs \
            tests/semantic-v2/issue-4388-stack-region-proof.test.mjs \
            tests/phase8/memory/issue-4697-gvn-semantic-attributes.test.mjs
          npm run lint
          rm -rf .github/reconcile6
          rm -f .github/workflows/reconcile-6-soundness.yml
          git add -A
          git diff --cached --check
          git config user.name 'OpenAI Reconcile Bot'
          git config user.email 'openai-reconcile@users.noreply.github.com'
          git commit -m 'fix(analysis): reconcile remaining verified soundness fixes [reconcile-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
