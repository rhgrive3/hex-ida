name: Sandbox security

on:
  pull_request:
    paths:
      - 'js/sandbox.js'
      - 'js/plugin*.js'
      - 'js/plugins/**'
      - 'js/**/script*.js'
      - 'tests/sandbox.mjs'
      - 'package.json'
      - '.github/workflows/sandbox-security.yml'
  workflow_dispatch:

concurrency:
  group: sandbox-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore pinned Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium-v1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install chromium
      - name: Run sandbox security regression
        env:
          CI: '1'
        run: npm run sandbox
