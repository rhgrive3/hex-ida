name: PR7036 representation SSA compatibility
on:
  push:
    branches: [feat/analysis-roadmap-v8-current-main-20260907]
permissions:
  contents: write
jobs:
  fix-and-validate:
    if: contains(github.event.head_commit.message, 'validate PR7036 representation SSA compatibility')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply compatibility fix and focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 -c 'from pathlib import Path; p=Path("js/decompiler/phase8/representation-candidates.js"); s=p.read_text(); old="    const variables = sourceInputs.map((input,index) => expr.variable(`proof_input_${index}`,input.bits,false));"; new="    const variables = sourceInputs.map((input,index) => {\n      const ssaId = `representation_input_${index}`;\n      return expr.variable(`proof_input_${index}`,input.bits,false,{ssaDefs:[ssaId]},{ssaId});\n    });"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
          node --check js/decompiler/phase8/representation-candidates.js
          node --test tests/phase8/integration/proof-optimizer.test.mjs tests/phase8/substrate/proof-projection-origin.test.mjs
          rm .github/workflows/pr7036-compat-ssa-fix.yml
          git add js/decompiler/phase8/representation-candidates.js
          git add -u .github/workflows/pr7036-compat-ssa-fix.yml
          git commit -m 'fix(phase8): preserve synthetic SSA identity in representation candidates'
          git push origin HEAD:feat/analysis-roadmap-v8-current-main-20260907
