name: Issue 2528 canonical claims authority (manual fallback)

# Automatic PR execution is owned by .circleci/config.yml.
# Keep this workflow as a manual GitHub-hosted rollback/fallback lane.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/issue-2528-canonical-claims.mjs
