name: Issue 2528 canonical claims authority

on:
  pull_request:
    paths:
      - 'js/ui/product-hardened.js'
      - 'js/analysis/query/product-surface.js'
      - 'js/ux.js'
      - 'tests/issue-2528-canonical-claims.mjs'
      - '.github/workflows/issue-2528-canonical-claims.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-2528-canonical-claims-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  canonical-claims:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/issue-2528-canonical-claims.mjs
