name: Temporary stacked ownership route apply v2

on:
  push:
    branches:
      - fix/independent-io-pr7036-aware-20260914

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate stacked ownership route
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stacked-ownership-route-apply.py
          grep -F 'fix/independent-io-pr7036-aware-20260914' .circleci/config.yml >/dev/null
          git diff --check
          timeout 180s node tests/ci/circleci-impact.test.mjs
      - name: Commit route and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/stacked-ownership-route-apply.py
          git rm .github/workflows/stacked-ownership-route-apply-temp.yml
          git add .circleci/config.yml
          git commit -m 'ci: validate stacked ownership against live #7036 parent'
          git push origin HEAD:fix/independent-io-pr7036-aware-20260914
