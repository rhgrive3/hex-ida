name: diag-7036-x02-ledger-sync
on:
  push:
    branches: [fix/7036-x02-ledger-sync-20260917]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize current X-02 ledger and validate
        shell: bash
        run: |
          set -uo pipefail
          STATUS=/tmp/x02-ledger-sync.txt
          : > "$STATUS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fail() { local label="$1" file="$2" rc="$3"; echo "$label rc=$rc" >> "$STATUS"; tail -n 80 "$file" >> "$STATUS"; exit "$rc"; }
          python3 .github/diag-7036-x02-ledger-sync.py >/tmp/patch.out 2>/tmp/patch.err
          rc=$?; [ "$rc" -eq 0 ] || fail patch /tmp/patch.err "$rc"
          echo 'patch rc=0' >> "$STATUS"
          git rm .github/workflows/diag-7036-x02-ledger-sync.yml .github/diag-7036-x02-ledger-sync.py >/tmp/rm.out 2>/tmp/rm.err
          rc=$?; [ "$rc" -eq 0 ] || fail remove_temp /tmp/rm.err "$rc"
          git add docs/analysis-x02-acceptance.md docs/analysis-local-acceptance-audit.json
          git diff --cached --check >/tmp/diffcheck.out 2>&1
          rc=$?; [ "$rc" -eq 0 ] || fail diff_check /tmp/diffcheck.out "$rc"
          echo 'diff_check rc=0' >> "$STATUS"
          timeout 180s node --test tests/scpa/x02-prior120-apple-version-matrix.test.mjs >/tmp/prior120.out 2>&1
          rc=$?; [ "$rc" -eq 0 ] || fail prior120 /tmp/prior120.out "$rc"
          echo 'prior120 rc=0' >> "$STATUS"
          timeout 120s node --test tests/scpa/x02-b06-runtime-dyld-evidence.test.mjs >/tmp/b06.out 2>&1
          rc=$?; [ "$rc" -eq 0 ] || fail b06_test /tmp/b06.out "$rc"
          echo 'b06_test rc=0' >> "$STATUS"
          node -e "JSON.parse(require('fs').readFileSync('docs/analysis-local-acceptance-audit.json','utf8'));" >/tmp/json.out 2>&1
          rc=$?; [ "$rc" -eq 0 ] || fail audit_json /tmp/json.out "$rc"
          echo 'audit_json rc=0' >> "$STATUS"
          git commit -m 'docs(analysis): sync closed X-02 evidence gaps' >/tmp/commit.out 2>&1
          rc=$?; [ "$rc" -eq 0 ] || fail commit /tmp/commit.out "$rc"
          echo "clean_head=$(git rev-parse HEAD)" >> "$STATUS"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$STATUS"
          git push origin HEAD:fix/7036-x02-ledger-sync-20260917 >/tmp/push.out 2>&1
          rc=$?; [ "$rc" -eq 0 ] || fail push /tmp/push.out "$rc"
          echo 'push rc=0' >> "$STATUS"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x02-ledger-sync
          path: /tmp/x02-ledger-sync.txt
          retention-days: 1
