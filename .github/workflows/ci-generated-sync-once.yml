name: CI generated sync once

on:
  push:
    branches:
      - ci/stage2-trigger-fast-path-20260825

permissions:
  contents: write

concurrency:
  group: ci-generated-sync-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild canonical generated userscript projection
        run: npm run userscript:build
      - name: Commit only canonical generated outputs when stale
        shell: bash
        run: |
          set -euo pipefail
          git add userscript/hex.user.template.js userscript/release-version.json js/userscript/deployment-identity.generated.js
          if git diff --cached --quiet; then
            echo "Generated output already synchronized."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: sync generated userscript after Stage2 integration"
          git push origin HEAD:ci/stage2-trigger-fast-path-20260825
