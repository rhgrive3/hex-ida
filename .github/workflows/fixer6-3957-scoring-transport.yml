name: Fixer6 issue 3957 scoring transport

on:
  push:
    branches:
      - fix/issue-3957-expected-call-discovery-20260912-f6

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply and verify issue 3957 scoring fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('js/query/planner.js')
          text = path.read_text()
          old_start = "async function analyzeCandidates(query, pools, tools, b) {\n  const merged = quotaMerge(pools, b.maxFunctions);"
          new_start = "async function analyzeCandidates(query, pools, tools, b) {\n  const expectedCalls = expectedCallHints(query).hints;\n  const merged = quotaMerge(pools, b.maxFunctions);"
          if text.count(old_start) != 1:
              raise SystemExit('planner analyzeCandidates anchor mismatch')
          text = text.replace(old_start, new_start, 1)
          old_score = """    if (query.expect && query.expect.calls && query.expect.calls.length && c.summary) {
              const names = (c.summary.calls || []).map((x) => lower(x.name || x.selector || ''));
              if (query.expect.calls.some((expected) => names.some((n) => n.includes(lower(expected))))) c.score += 20;
            }"""
          new_score = """    if (expectedCalls.length && c.summary) {
              const names = (c.summary.calls || []).map((x) => lower(x.name || x.selector || ''));
              if (expectedCalls.some((expected) => names.some((n) => n.includes(lower(expected))))) c.score += 20;
            }"""
          if text.count(old_score) != 1:
              raise SystemExit('planner expected-call scoring anchor mismatch')
          path.write_text(text.replace(old_score, new_score, 1))
          PY
          printf '%s' '' | base64 -d > tests/phase12/adversarial/issue-3957-query-planner-hostile-scoring.test.mjs
          rm .github/workflows/fixer6-3957-scoring-transport.yml
          node --check js/query/planner.js
          node --check tests/phase12/adversarial/issue-3957-query-planner-hostile-scoring.test.mjs
          TERM=xterm timeout 30s node --test tests/phase12/adversarial/issue-3957-query-planner-hostile-scoring.test.mjs tests/phase12/adversarial/issue-3957-query-planner-expected-call-discovery.test.mjs
          test "$(git hash-object js/query/planner.js)" = "57b86506c6a28b6a228ac86c1aa477f75f37f958"
          test "$(git hash-object tests/phase12/adversarial/issue-3957-query-planner-hostile-scoring.test.mjs)" = "144c5de74a620401111845aaaa7936d227c77112"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(query): validate expected-call hints during scoring (#3957)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
