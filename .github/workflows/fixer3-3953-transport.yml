name: Fixer3 issue 3953 transport

on:
  push:
    branches:
      - fixer3/issue-3953-search-cap-truncated

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply and verify issue 3953 fix
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          rm .github/workflows/fixer3-3953-transport.yml
          node --check js/analysis/query/app-adapter.js
          node --check js/analysis/demand-driven-runtime.js
          node --check tests/phase7/issue-3953-search-cap-completeness.test.mjs
          node --check tests/phase7/issue-4757-demand-search-abort-registration-race.test.mjs
          node --check tests/phase7/issue-5840-search-unsupported.test.mjs
          node --test tests/phase7/issue-3953-search-cap-completeness.test.mjs tests/phase7/issue-5840-search-unsupported.test.mjs tests/phase7/issue-4757-demand-search-abort-registration-race.test.mjs
          test "$(git hash-object js/analysis/query/app-adapter.js)" = "6489e8a182dc70852c54f9bfabdb36b46f4b9329"
          test "$(git hash-object js/analysis/demand-driven-runtime.js)" = "27375fd524554672dabb5414dd5f0d035919b66d"
          test "$(git hash-object tests/phase7/issue-3953-search-cap-completeness.test.mjs)" = "909afe50ebf5ea618b9682b444a589f1ad193d28"
          test "$(git hash-object tests/phase7/issue-4757-demand-search-abort-registration-race.test.mjs)" = "35a7c0c67030f6cbb6f95262a86ffa951d3b13f7"
          test "$(git hash-object tests/phase7/issue-5840-search-unsupported.test.mjs)" = "62390ec7960f756b08325b145e960e4a15e7b528"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(query): mark capped search results truncated (#3953)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
