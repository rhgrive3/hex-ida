name: pr9077-fix-bitblast-syntax
on:
  push:
    branches:
      - recovery/t014-mainline-solver-foundation-20260916
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/t014-mainline-solver-foundation-20260916
          fetch-depth: 0
      - name: Restore complete donor backend and current-main adaptations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout 60s git fetch --depth=1 origin component/final-closure-t014-v3
          git show FETCH_HEAD:js/symbolic/solver/bitblast-backend.js > js/symbolic/solver/bitblast-backend.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/symbolic/solver/bitblast-backend.js')
          s = p.read_text()

          old = "import { collectSymbols } from './exhaustive-backend.js';"
          new = "import { analyzeSolverExpressions } from './query-analysis.js';"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          old = """function deadlineFrom(options) {
  const timeoutMs = Number(options.timeoutMs);
  return Number.isFinite(timeoutMs) && timeoutMs > 0 ? Date.now() + timeoutMs : Infinity;
}
"""
          new = """function monotonicNow() {
  return typeof globalThis.performance?.now === 'function' ? globalThis.performance.now() : Date.now();
}

function deadlineFrom(options) {
  const timeoutMs = options?.timeoutMs;
  return typeof timeoutMs === 'number' && Number.isSafeInteger(timeoutMs) && timeoutMs > 0
    ? monotonicNow() + timeoutMs
    : Infinity;
}
"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          s = s.replace('Date.now()', 'monotonicNow()')
          # Restore the Date.now fallback inside monotonicNow after the global replacement.
          s = s.replace("globalThis.performance.now() : monotonicNow();", "globalThis.performance.now() : Date.now();", 1)

          old = """    for (const literal of literals) {
      if (seen.has(-literal)) return;
"""
          new = """    for (const literal of literals) {
      if (!Number.isSafeInteger(literal) || literal === 0) throw new LimitError('invalid-cnf-literal');
      if (seen.has(-literal)) return;
"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          old = "validateVerificationQuery(query, { maxExprNodes: limits.maxExprNodes })"
          new = "validateVerificationQuery(query, { maxExprNodes: limits.maxExprNodes, maxExprDepth: limits.maxExprDepth })"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          old = "collectSymbols(expressions, { maxExprNodes: limits.maxExprNodes, maxExprDepth: limits.maxExprDepth })"
          new = "analyzeSolverExpressions(expressions, { maxExprNodes: limits.maxExprNodes, maxExprDepth: limits.maxExprDepth })"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Syntax check bit-blast backend
        shell: bash
        run: timeout 60s node --check js/symbolic/solver/bitblast-backend.js
      - name: Hostile structural-hash regressions
        shell: bash
        run: timeout 180s node --test tests/phase9/expr/t014-bounded-structural-hash.test.mjs
      - name: Focused T014 backend tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node --test tests/phase9/solver/t014-bitblast-differential.test.mjs
          timeout 300s node --test tests/phase9/solver/t014-wide-exact.test.mjs
          timeout 300s node --test tests/phase9/solver/t014-foundation-boundaries.test.mjs
      - name: Focused Phase 9 solver suite
        shell: bash
        run: timeout 900s node --test tests/phase9/solver/*.mjs tests/issue-5498-eligibility-result-status-authority.mjs
      - name: Publish clean fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr9077-fix-bitblast-syntax.yml
          git add js/symbolic/solver/bitblast-backend.js
          git diff --cached --check
          git commit -m 'fix(solver): restore complete bounded bit-blast backend'
          git push origin HEAD:refs/heads/recovery/t014-mainline-solver-foundation-20260916
