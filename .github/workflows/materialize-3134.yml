name: One-shot issue 3134 semantic function selectors
on:
  push:
    branches: [fix/semantic-function-selectors-3134]
    paths: [.github/workflows/materialize-3134.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semantic-function-selectors-3134
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply repair
        run: python3 tools/tmp-3134.py
      - name: Focused regression
        run: |
          node tests/phase7/issue-3134-semantic-function-selectors.test.mjs
          node tests/phase7/run.mjs
      - name: Syntax check
        run: node --check js/analysis/semantic-function.js
      - name: Commit repair
        shell: bash
        run: |
          rm -f tools/tmp-3134.py .github/workflows/materialize-3134.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: reject coerced semantic function selectors (#3134)'
          git push origin HEAD:fix/semantic-function-selectors-3134
