name: Fixer4 issue 4647 materializer v2

on:
  push:
    branches:
      - fixer4/issue-4647-pdb-byte-depth-budget
    paths:
      - .github/workflows/fixer4-4647-materialize-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixer4/issue-4647-pdb-byte-depth-budget
          fetch-depth: 1
      - name: Materialize verified patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/fixer4-4647-materialize.yml').read_text()
          start = "          cat > /tmp/fixer4-4647.patch <<'PATCH'\n"
          end = "          PATCH\n"
          body = text.split(start, 1)[1].split(end, 1)[0]
          lines = []
          for line in body.splitlines(True):
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected embedded-patch indentation: {line!r}')
              lines.append(line[10:])
          Path('/tmp/fixer4-4647.patch').write_text(''.join(lines))
          PY
          # The first materializer proved one late aggregate hunk has stale
          # line-context despite an identical base blob. Apply all exact hunks,
          # then repair only that rejected one and verify final blob identities.
          git apply --reject --whitespace=nowarn /tmp/fixer4-4647.patch || true
          test -f js/analysis/debug/pdb.js.rej
          test "$(grep -c '^@@' js/analysis/debug/pdb.js.rej)" -eq 1
          grep -Fq 'type: describeTypeIndex(member.typeIndex, parsed.tpi.types),' js/analysis/debug/pdb.js.rej
          python - <<'PY'
          from pathlib import Path
          path = Path('js/analysis/debug/pdb.js')
          text = path.read_text()
          old = '          type: describeTypeIndex(member.typeIndex, parsed.tpi.types),'
          new = '          type: describeTypeIndex(member.typeIndex, parsed.tpi.types, 0, parsed.maxDepth ?? DEBUG_DEFAULT_BUDGET.maxDepth),'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one aggregate type call, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm js/analysis/debug/pdb.js.rej
          test "$(git hash-object js/analysis/debug/pdb.js)" = '611740a9365090c763a0c87a7a294b9d7d0aa897'
          test "$(git hash-object tests/phase7/debug/issue-4647-pdb-byte-depth-budget.test.mjs)" = 'dc48775f1790c76fdc95c07804e0ff02e5db79e7'
          rm .github/workflows/fixer4-4647-materialize.yml .github/workflows/fixer4-4647-materialize-v2.yml
          git config user.name 'Fixer 4 Runtime'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/analysis/debug/pdb.js tests/phase7/debug/issue-4647-pdb-byte-depth-budget.test.mjs .github/workflows/fixer4-4647-materialize.yml .github/workflows/fixer4-4647-materialize-v2.yml
          git diff --cached --check
          git commit -m 'fix(debug): enforce PDB byte and depth budgets (#4647)'
          git push origin HEAD:fixer4/issue-4647-pdb-byte-depth-budget
