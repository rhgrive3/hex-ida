name: T017 apply current-main extraction

on:
  push:
    branches:
      - recovery/t017-machine-effects-20260917
    paths:
      - .github/workflows/t017-apply-current-main.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded T017 current-main edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact boundary, got {count}')
              return text.replace(old, new, 1)

          def replace_between(text, start, end, new, label):
              if text.count(start) != 1 or text.count(end) < 1:
                  raise SystemExit(f'{label}: boundary missing or ambiguous')
              left, rest = text.split(start, 1)
              middle, right = rest.split(end, 1)
              return left + new + end + right

          # 1. MachineEffects undefined-result authority: strict own-data snapshots.
          path = Path('js/semantics/effects/index.js')
          text = path.read_text()
          marker = """function fail(code) { throw new TypeError(code); }
          function assertAllowedKeys(input, allowed, code) {
            for (const key of Object.keys(input)) if (!allowed.has(key)) fail(`${code}:${key}`);
          }
          // Pre-built field whitelists."""
          helpers = """function fail(code) { throw new TypeError(code); }
          function assertAllowedKeys(input, allowed, code) {
            for (const key of Object.keys(input)) if (!allowed.has(key)) fail(`${code}:${key}`);
          }

          function snapshotOwnEnumerableData(input, allowed, label, unexpectedCode) {
            if (input == null || typeof input !== 'object') fail(`machine-effects-${label}-required`);
            let isArray;
            let prototype;
            let keys;
            try {
              isArray = Array.isArray(input);
              prototype = Object.getPrototypeOf(input);
              keys = Reflect.ownKeys(input);
            } catch {
              fail(`machine-effects-${label}-snapshot-failed`);
            }
            if (isArray) fail(`machine-effects-${label}-required`);
            if (prototype !== Object.prototype && prototype !== null) fail(`machine-effects-${label}-invalid-prototype`);
            const snapshot = Object.create(null);
            for (const key of keys) {
              if (typeof key !== 'string' || !allowed.has(key)) {
                fail(`${unexpectedCode}:${typeof key === 'string' ? key : 'symbol'}`);
              }
              let descriptor;
              try { descriptor = Object.getOwnPropertyDescriptor(input, key); }
              catch { fail(`machine-effects-${label}-snapshot-failed`); }
              if (descriptor == null || descriptor.enumerable !== true || !Object.hasOwn(descriptor, 'value')) {
                fail(`machine-effects-${label}-requires-enumerable-data-property:${key}`);
              }
              snapshot[key] = descriptor.value;
            }
            return snapshot;
          }

          function ownDataProperty(input, key, code) {
            let descriptor;
            try { descriptor = Object.getOwnPropertyDescriptor(input, key); }
            catch { fail(code); }
            if (descriptor == null) return { present:false, value:undefined };
            if (descriptor.enumerable !== true || !Object.hasOwn(descriptor, 'value')) fail(code);
            return { present:true, value:descriptor.value };
          }

          function snapshotSerializableData(value, code, seen = new WeakSet()) {
            if (value == null || typeof value === 'string' || typeof value === 'boolean' || typeof value === 'bigint') return jsonSafe(value);
            if (typeof value === 'number') {
              if (!Number.isFinite(value)) fail(code);
              return value;
            }
            if (typeof value === 'undefined' || typeof value === 'function' || typeof value === 'symbol') fail(code);
            if (typeof value !== 'object' || seen.has(value)) fail(code);
            let prototype;
            let keys;
            let isArray;
            try {
              prototype = Object.getPrototypeOf(value);
              keys = Reflect.ownKeys(value);
              isArray = Array.isArray(value);
            } catch { fail(code); }
            if ((!isArray && prototype !== Object.prototype && prototype !== null)
              || (isArray && prototype !== Array.prototype)) fail(code);
            let arrayLength;
            if (isArray) {
              let lengthDescriptor;
              try { lengthDescriptor = Object.getOwnPropertyDescriptor(value, 'length'); }
              catch { fail(code); }
              if (lengthDescriptor == null || !Object.hasOwn(lengthDescriptor, 'value')
                || !Number.isSafeInteger(lengthDescriptor.value) || lengthDescriptor.value < 0) fail(code);
              arrayLength = lengthDescriptor.value;
              if (keys.length !== arrayLength + 1) fail(code);
            }
            seen.add(value);
            const out = isArray ? [] : {};
            for (const key of keys) {
              if (typeof key !== 'string') fail(code);
              if (isArray && key === 'length') continue;
              if (isArray && (!/^(?:0|[1-9][0-9]*)$/.test(key) || Number(key) >= arrayLength)) fail(code);
              let descriptor;
              try { descriptor = Object.getOwnPropertyDescriptor(value, key); }
              catch { fail(code); }
              if (descriptor == null || descriptor.enumerable !== true || !Object.hasOwn(descriptor, 'value')) fail(code);
              Object.defineProperty(out, key, {
                value:snapshotSerializableData(descriptor.value, code, seen),
                enumerable:true,
                configurable:true,
                writable:true,
              });
            }
            seen.delete(value);
            return out;
          }
          // Pre-built field whitelists."""
          text = replace_once(text, marker, helpers, 'effects-helpers')

          descriptor_start = 'export function createUndefinedResultDescriptor(input) {'
          descriptor_end = '\n\nfunction resultWidthBits(value) {'
          descriptor = """export function createUndefinedResultDescriptor(input) {
            input = snapshotOwnEnumerableData(input, ALLOWED_FIELDS.undefinedResult,
              'undefined-result', 'machine-effects-unexpected-undefined-result-field');
            const schemaVersion = Object.hasOwn(input, 'schemaVersion')
              ? input.schemaVersion : UNDEFINED_RESULT_SCHEMA_VERSION;
            if (schemaVersion !== UNDEFINED_RESULT_SCHEMA_VERSION) fail('machine-effects-unsupported-undefined-result-schema');
            if (typeof input.widthBits !== 'number') fail('machine-effects-invalid-undefined-result-width');
            const widthBits = positiveInteger(input.widthBits, 'machine-effects-invalid-undefined-result-width');
            if (widthBits > MAX_UNDEFINED_RESULT_WIDTH_BITS) fail('machine-effects-invalid-undefined-result-width');
            const resultClass = enumValue(input.class, SETS.undefinedResultClasses, 'machine-effects-invalid-undefined-result-class');
            const mask = undefinedResultMask(input.mask);
            const fullMask = (1n << BigInt(widthBits)) - 1n;
            if (mask <= 0n || mask > fullMask) fail('machine-effects-invalid-undefined-result-mask');
            if (resultClass === 'fully' && mask !== fullMask) fail('machine-effects-fully-undefined-result-mask-incomplete');
            if (resultClass === 'partial' && mask === fullMask) fail('machine-effects-partial-undefined-result-mask-full');
            const conditionRequired = resultClass === 'conditional' || resultClass === 'operand-dependent';
            const conditionPresent = Object.hasOwn(input, 'condition');
            if (conditionRequired !== conditionPresent || (conditionPresent && input.condition == null)) {
              fail(conditionRequired
                ? 'machine-effects-undefined-result-condition-required'
                : 'machine-effects-undefined-result-condition-not-allowed');
            }
            const out = {
              schemaVersion:UNDEFINED_RESULT_SCHEMA_VERSION,
              widthBits,
              mask:`0x${mask.toString(16).padStart(Math.ceil(widthBits / 4), '0')}`,
              class:resultClass,
              reason:nonEmpty(input.reason, 'machine-effects-undefined-result-reason-required'),
            };
            if (conditionRequired) out.condition = snapshotSerializableData(input.condition, 'machine-effects-invalid-undefined-result-condition');
            return deepFreeze(out);
          }"""
          if text.count(descriptor_start) != 1 or text.count(descriptor_end) != 1:
              raise SystemExit('effects-descriptor: boundary missing or ambiguous')
          before, rest = text.split(descriptor_start, 1)
          _, after = rest.split(descriptor_end, 1)
          text = before + descriptor + descriptor_end + after

          operation_marker = """  const allowedFields = OPERATION_FIELDS_BY_KIND[kind];
            if (!allowedFields) fail('machine-effects-invalid-operation-kind');
            assertAllowedKeys(input, allowedFields, 'machine-effects-unexpected-operation-field');
            const out = { kind };"""
          operation_new = """  const allowedFields = OPERATION_FIELDS_BY_KIND[kind];
            if (!allowedFields) fail('machine-effects-invalid-operation-kind');
            assertAllowedKeys(input, allowedFields, 'machine-effects-unexpected-operation-field');
            const undefinedResultProperty = ownDataProperty(input, 'undefinedResult',
              'machine-effects-undefined-result-requires-enumerable-data-property');
            const out = { kind };"""
          text = replace_once(text, operation_marker, operation_new, 'effects-operation-property')

          undefined_start = '  if (input.undefinedResult != null) {'
          metadata_boundary = '  if (input.metadata != null) out.metadata = serializable(input.metadata, \'machine-effects-invalid-operation-metadata\');'
          undefined_new = """  if (undefinedResultProperty.present) {
            const descriptor = createUndefinedResultDescriptor(undefinedResultProperty.value);
            const results = kind === 'value' ? out.outputs
              : kind === 'intrinsic' ? out.effectSummary.outputs
                : kind === 'memory-read' ? [out.value] : [];
            const inputs = kind === 'value' ? out.inputs
              : kind === 'intrinsic' ? out.effectSummary.inputs : [];
            if (results.length !== 1 || resultWidthBits(results[0]) !== descriptor.widthBits) {
              fail('machine-effects-undefined-result-output-width-mismatch');
            }
            if (descriptor.condition != null && Object.hasOwn(descriptor.condition, 'operandIndex')) {
              const operandIndex = descriptor.condition.operandIndex;
              if (!Number.isSafeInteger(operandIndex) || operandIndex < 0) {
                fail('machine-effects-invalid-undefined-result-condition-operand');
              }
              if (operandIndex >= inputs.length) fail('machine-effects-undefined-result-condition-operand-out-of-range');
            }
            out.undefinedResult = descriptor;
          }
          """
          if text.count(undefined_start) != 1 or text.count(metadata_boundary) != 1:
              raise SystemExit('effects-operation-undefined: boundary missing or ambiguous')
          before, rest = text.split(undefined_start, 1)
          _, after = rest.split(metadata_boundary, 1)
          text = before + undefined_new + metadata_boundary + after
          path.write_text(text)

          # 2. Safe v2->v1 undefined-result transport.
          path = Path('js/semantics/compat/semantic-ir-v2-to-v1-nodes.js')
          text = path.read_text()
          insert_marker = "import { SEMANTIC_CONTROL_TARGET_COUNTS, dataArityContract } from '../ir/nodes.js';\n\nconst STRICT_FLOAT_LITERAL"
          insert_new = """import { SEMANTIC_CONTROL_TARGET_COUNTS, dataArityContract } from '../ir/nodes.js';

          const MALFORMED_UNDEFINED_RESULT = Object.freeze({
            class:'malformed', mask:'unknown-mask', reason:'malformed-descriptor',
          });

          function undefinedResultAttribute(attributes) {
            if (attributes == null || typeof attributes !== 'object') return null;
            let machineEffectsProperty;
            try { machineEffectsProperty = Object.getOwnPropertyDescriptor(attributes, 'machineEffects'); }
            catch { return MALFORMED_UNDEFINED_RESULT; }
            if (machineEffectsProperty == null) return null;
            if (!Object.hasOwn(machineEffectsProperty, 'value')) return MALFORMED_UNDEFINED_RESULT;
            const machineEffects = machineEffectsProperty.value;
            if (machineEffects == null || typeof machineEffects !== 'object') return null;
            let descriptor;
            try { descriptor = Object.getOwnPropertyDescriptor(machineEffects, 'undefinedResult'); }
            catch { return MALFORMED_UNDEFINED_RESULT; }
            if (descriptor == null) return null;
            if (!Object.hasOwn(descriptor, 'value') || descriptor.value == null) return MALFORMED_UNDEFINED_RESULT;
            return descriptor.value;
          }

          const STRICT_FLOAT_LITERAL"""
          text = replace_once(text, insert_marker, insert_new, 'compat-helper')
          old_start = "  const undefinedResult = attrs.machineEffects?.undefinedResult ?? null;"
          old_end = "  if (inputArityMismatch(node)) {"
          new_block = """  const undefinedResult = undefinedResultAttribute(attrs);
            if (undefinedResult != null && node.kind !== 'intrinsic') {
              const isMemoryRead = node.kind === 'load';
              const unknown = defaultUnknownInstruction(node, blockIndex, row, options, {
                reason:`architecturally-undefined-result:${undefinedResult.reason ?? 'unspecified'}`,
                unknownCategories:isMemoryRead ? ['memory','value'] : ['value'],
                undefinedResult,
              });
              Object.assign(inst, unknown, {
                semanticNodeId:node.id,
                sourceEntityId:node.id,
                sourceEffectIds:node.sourceEffectIds.slice(),
                instructionId:sourceInstructionIds(node.origin)[0] ?? null,
                sourceInstructionIds:sourceInstructionIds(node.origin),
                origin:node.origin,
              });
              inst.dst = primaryOutput;
              attachArgs(inst, inputValues);
              if (isMemoryRead) {
                inst.memoryAccess = node.memory;
                inst.memoryBarrier = true;
              }
              if (primaryOutput && primaryOutput.def == null) primaryOutput.def = inst;
              return [inst];
            }

          """
          if text.count(old_start) != 1 or text.count(old_end) != 1:
              raise SystemExit('compat-undefined: boundary missing or ambiguous')
          before, rest = text.split(old_start, 1)
          _, after = rest.split(old_end, 1)
          text = before + new_block + old_end + after
          path.write_text(text)

          # 3. Route only BSF/BSR into the new exact bit-scan owner.
          path = Path('js/targets/architecture/x86_64/effects/bit-manipulation.js')
          text = path.read_text()
          import_marker = "import { x86EffectiveAddressExpression } from './addressing.js';"
          text = replace_once(text, import_marker,
              import_marker + "\nimport { liftX86BitScanEffects } from './bit-scan.js';", 'bit-scan-import')
          route_marker = """  // Intel memory BT/BTC/BTR/BTS operands are bit strings:"""
          route_new = """  if (family === 'bsf' || family === 'bsr') return liftX86BitScanEffects(ctx);

            // Intel memory BT/BTC/BTR/BTS operands are bit strings:"""
          text = replace_once(text, route_marker, route_new, 'bit-scan-route')
          path.write_text(text)

          # 4. Validation context cannot upgrade an unproven INT delivery state.
          path = Path('js/targets/architecture/x86_64/effects/index.js')
          text = path.read_text()
          text = replace_once(text,
              "|| (!context?.closureMatrixTerminal && STRUCTURED_FAIL_CLOSED_REASON.test(reason))",
              "|| STRUCTURED_FAIL_CLOSED_REASON.test(reason)", 'x86-terminal-authority')
          path.write_text(text)

          # 5. Closure evaluator observes production authority, not a privileged validation context.
          path = Path('tools/validation/machine-effects/x86-long64-closure-matrix.mjs')
          text = path.read_text()
          text = replace_once(text,
              'const outcome = dispatchFunction(instruction, { closureMatrixTerminal: true });',
              'const outcome = dispatchFunction(instruction);', 'closure-evaluator-context')
          path.write_text(text)

          path = Path('tests/machine-effects/x86-long64-closure-matrix.test.mjs')
          text = path.read_text()
          insertion = """  const interrupt = decodedRows.find((row) => row.id === 238).instruction;
            for (const context of [{}, { closureMatrixTerminal:true }]) {
              const result = dispatchX86MachineEffects(interrupt, context).result;
              assert.equal(result.completeness, 'partial', 'a validation context cannot supply missing INT delivery state');
              assert.equal(result.controlEffect.kind, 'unknown');
              assert.equal(result.unknownEffects.reason, 'x86-int-delivery-state-unmodelled');
              assert.equal(result.metadata.terminalizedBy, undefined);
            }

            const matrix = evaluateX86Long64ClosureMatrix(decodedRows, dispatchX86MachineEffects);"""
          text = replace_once(text,
              '  const matrix = evaluateX86Long64ClosureMatrix(decodedRows, dispatchX86MachineEffects);',
              insertion, 'closure-test-int')
          text = replace_once(text,
              '  assert.equal(matrix.partialCount, 0, `No valid witness may remain partial: ${JSON.stringify(matrix.blockingGaps)}`);\n  assert.equal(matrix.blockingGapCount, 0, `No semantic closure gap may remain: ${JSON.stringify(matrix.blockingGaps)}`);\n  assert.equal(matrix.closed, true, `Long-64 witness matrix must be terminal: ${JSON.stringify(matrix.blockingGaps)}`);',
              """  assert.equal(matrix.partialCount, 1, `Only delivery-state-dependent INT may remain partial: ${JSON.stringify(matrix.blockingGaps)}`);
            assert.equal(matrix.blockingGapCount, 1, `The conservative INT boundary must remain explicit: ${JSON.stringify(matrix.blockingGaps)}`);
            assert.equal(matrix.closed, false, 'a partial architectural-delivery boundary is not terminal semantic closure');
            assert.deepEqual(matrix.blockingGaps, [{
              id:238, name:'int', ownerId:'control', completeness:'partial', reason:'x86-int-delivery-state-unmodelled',
            }]);""", 'closure-test-expectations')
          path.write_text(text)
          PY
      - name: Check edited syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/semantics/effects/index.js
          node --check js/semantics/compat/semantic-ir-v2-to-v1-nodes.js
          node --check js/targets/architecture/x86_64/effects/bit-manipulation.js
          node --check js/targets/architecture/x86_64/effects/bit-scan.js
          node --check js/targets/architecture/x86_64/effects/index.js
          node --check tools/validation/machine-effects/x86-long64-closure-matrix.mjs
          node --check tests/machine-effects/x86-long64-closure-matrix.test.mjs
      - name: Commit T017 extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/semantics/effects/index.js \
            js/semantics/compat/semantic-ir-v2-to-v1-nodes.js \
            js/targets/architecture/x86_64/effects/bit-manipulation.js \
            js/targets/architecture/x86_64/effects/index.js \
            tools/validation/machine-effects/x86-long64-closure-matrix.mjs \
            tests/machine-effects/x86-long64-closure-matrix.test.mjs
          git commit -m 'fix(t017): preserve machine-effect uncertainty boundaries'
          git push origin HEAD:recovery/t017-machine-effects-20260917
