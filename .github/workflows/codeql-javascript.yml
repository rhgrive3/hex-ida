name: CodeQL JavaScript

on:
  push:
    branches: [main]
    paths:
      - 'js/ai/**'
      - 'js/binary/**'
      - 'js/bytesource/**'
      - 'js/collaboration/**'
      - 'js/debug/**'
      - 'js/runtime/**'
      - 'js/runtime-evidence/**'
      - 'js/userscript/**'
      - 'js/sandbox.js'
      - 'js/plugins.js'
      - 'js/script.js'
      - 'worker*.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codeql-javascript.yml'
  schedule:
    - cron: '17 18 * * 0'

permissions:
  contents: read

concurrency:
  group: codeql-javascript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:javascript-typescript
