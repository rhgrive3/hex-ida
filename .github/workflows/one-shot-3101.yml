name: One-shot issue 3101 discovery fusion start boundary
on:
  push:
    branches: [fix/discovery-fusion-start-strict-3101]
    paths: [.github/workflows/one-shot-3101.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discovery-fusion-start-strict-3101
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply repair
        run: python3 tools/tmp-3101.py
      - name: Focused regression
        run: |
          node tests/phase7/discovery/fusion-start-boundary-3101.test.mjs
          node tests/phase7/discovery/fusion.test.mjs
      - name: Syntax check
        run: node --check js/analysis/discovery/fusion.js
      - name: Commit repair
        shell: bash
        run: |
          rm -f tools/tmp-3101.py .github/workflows/one-shot-3101.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(discovery): reject coerced fusion starts (#3101)'
          git push origin HEAD:fix/discovery-fusion-start-strict-3101
