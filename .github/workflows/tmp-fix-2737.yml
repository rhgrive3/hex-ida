name: temporary issue 2737 repair
on:
  push:
    branches:
      - fix/call-target-identity-2737
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/call-target-identity-2737
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal fix and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/analysis/summary/contract.js')
          s = p.read_text()
          old = '\n'.join([
              '  const candidates = [];',
              '  for (const value of call.targetEntityIds ?? []) candidates.push(String(value));',
              '  for (const value of [call.targetEntityId, call.callee, call.target]) {',
              '    if (value != null && String(value).trim()) candidates.push(String(value));',
              '  }',
              '  const candidateEntityIds = [...new Set(candidates.filter(Boolean))].sort();',
              '  const targetValueIds = [...new Set((call.targetValueIds ?? []).map(String).filter(Boolean))].sort();',
              '  const indirect = targetValueIds.length > 0;',
              "  const kind = indirect ? 'indirect' : candidateEntityIds.length ? 'direct' : 'unknown';",
              "  const exhaustive = kind === 'direct'",
              '    ? candidateEntityIds.length === 1',
              "    : kind === 'indirect' && call.completeness === 'complete';",
          ]) + '\n'
          new = '\n'.join([
              '  const candidates = [];',
              '  let malformedIdentity = false;',
              '  const addIdentity = (value, target) => {',
              '    if (value == null) return;',
              "    if (typeof value !== 'string' || !value.trim()) {",
              '      malformedIdentity = true;',
              '      return;',
              '    }',
              '    target.push(value.trim());',
              '  };',
              '  if (call.targetEntityIds != null) {',
              '    if (!Array.isArray(call.targetEntityIds)) malformedIdentity = true;',
              '    else for (const value of call.targetEntityIds) addIdentity(value, candidates);',
              '  }',
              '  for (const value of [call.targetEntityId, call.callee, call.target]) addIdentity(value, candidates);',
              '  const candidateEntityIds = [...new Set(candidates)].sort();',
              '  const targetValueIds = [];',
              '  if (call.targetValueIds != null) {',
              '    if (!Array.isArray(call.targetValueIds)) malformedIdentity = true;',
              '    else for (const value of call.targetValueIds) addIdentity(value, targetValueIds);',
              '  }',
              '  const canonicalTargetValueIds = [...new Set(targetValueIds)].sort();',
              '  const indirect = canonicalTargetValueIds.length > 0;',
              "  const kind = indirect ? 'indirect' : candidateEntityIds.length ? 'direct' : 'unknown';",
              "  const exhaustive = !malformedIdentity && (kind === 'direct'",
              '    ? candidateEntityIds.length === 1',
              "    : kind === 'indirect' && call.completeness === 'complete');",
          ]) + '\n'
          if old not in s:
              raise SystemExit('expected classifyCallTargetProof block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cat > tests/phase7/issue-2737-call-target-identity.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';

          import { classifyCallTargetProof } from '../../js/analysis/summary/contract.js';

          test('issue #2737: valid direct singleton remains exact', () => {
            assert.deepEqual(classifyCallTargetProof({ targetEntityId: 'fn_callee' }), {
              kind: 'direct',
              candidateEntityIds: ['fn_callee'],
              exhaustive: true,
              exactSingletonEntityId: 'fn_callee',
            });
          });

          test('issue #2737: malformed entity identities never mint exact singleton proof', () => {
            for (const targetEntityId of [{ source: 'malformed' }, ['fn_callee'], 1, true, '   ']) {
              const proof = classifyCallTargetProof({ targetEntityId });
              assert.equal(proof.exhaustive, false);
              assert.equal(proof.exactSingletonEntityId, null);
            }
            const mixed = classifyCallTargetProof({ targetEntityIds: ['fn_callee', { bad: true }] });
            assert.deepEqual(mixed.candidateEntityIds, ['fn_callee']);
            assert.equal(mixed.exhaustive, false);
            assert.equal(mixed.exactSingletonEntityId, null);
          });

          test('issue #2737: malformed runtime target identities also prevent exactness', () => {
            const proof = classifyCallTargetProof({
              targetEntityId: 'fn_callee',
              targetValueIds: [{ bad: true }],
              completeness: 'complete',
            });
            assert.equal(proof.exhaustive, false);
            assert.equal(proof.exactSingletonEntityId, null);
          });

          test('issue #2737: incomplete indirect singleton remains non-exhaustive', () => {
            const proof = classifyCallTargetProof({
              targetEntityId: 'fn_callee',
              targetValueIds: ['value_1'],
              completeness: 'partial',
            });
            assert.equal(proof.kind, 'indirect');
            assert.equal(proof.exhaustive, false);
            assert.equal(proof.exactSingletonEntityId, null);
          });
          EOF
          node --test tests/phase7/issue-2737-call-target-identity.test.mjs
          rm .github/workflows/tmp-fix-2737.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/analysis/summary/contract.js tests/phase7/issue-2737-call-target-identity.test.mjs .github/workflows/tmp-fix-2737.yml
          git commit -m 'fix(summary): reject coerced call target identities (#2737)'
          git push origin HEAD:fix/call-target-identity-2737
