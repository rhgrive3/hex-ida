name: One-shot issue 2516 Mach-O slice reuse
on:
  push:
    branches: [fix/2516-macho-selected-slice-reuse]
    paths: [.github/workflows/one-shot-2516.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2516-macho-selected-slice-reuse
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python3 tools/tmp-2516.py
      - name: Focused regression
        run: |
          node tests/phase4/integration/issue-2516-macho-selected-slice-reuse.test.mjs
          node tests/phase4/integration/issues-2502-2522-demand-analysis.test.mjs
          node tests/phase4/integration/issues-2507-2518-resource-contracts.test.mjs
      - name: Syntax check
        run: |
          node --check js/platform/worker.js
          node --check js/backend.js
      - name: Commit repair
        shell: bash
        run: |
          rm -f tools/tmp-2516.py .github/workflows/one-shot-2516.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(macho): reuse selected FAT slice artifact (#2516)'
          git push origin HEAD:fix/2516-macho-selected-slice-reuse
