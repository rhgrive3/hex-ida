name: Fixer3 transport 4705

on:
  push:
    branches:
      - fixer3/transport-4705-soft-evidence-weight

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c90d8b38833ae664defb512be58538e397967f72
          fetch-depth: 1
      - name: Apply and verify Fixer 3 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c90d8b38833ae664defb512be58538e397967f72"
          test "$(git hash-object js/analysis/types/constraints.js)" = "b89f90fdb3410bab02a88f8a6ba683a0597337e8"
          python - <<'PY'
          from pathlib import Path
          p = Path('js/analysis/types/constraints.js')
          s = p.read_text()
          old = "  const weight = Number(input.weight ?? 0.5);\n  if (!Number.isFinite(weight) || weight < 0 || weight > 1) fail('soft-evidence-invalid-weight');\n"
          new = "  const weight = input.weight ?? 0.5;\n  if (typeof weight !== 'number' || !Number.isFinite(weight) || weight < 0 || weight > 1) {\n    fail('soft-evidence-invalid-weight');\n  }\n"
          if s.count(old) != 1:
              raise SystemExit('expected soft-evidence weight anchor exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
          printf '%s' '' | base64 -d > tests/phase7/types/issue-4705-soft-evidence-weight.test.mjs
          test "$(git hash-object js/analysis/types/constraints.js)" = "2cfb7f32d52c9c3f4f7a5a601d7954d42cf45476"
          test "$(git hash-object tests/phase7/types/issue-4705-soft-evidence-weight.test.mjs)" = "6d635943c7f97848dca3f214a4c61790b4335795"
          git diff --check
          node --check js/analysis/types/constraints.js
          node --check tests/phase7/types/issue-4705-soft-evidence-weight.test.mjs
          node --test --test-reporter=spec tests/phase7/types/issue-4705-soft-evidence-weight.test.mjs
          git config user.name 'Fixer 3 Analysis'
          git config user.email 'actions@users.noreply.github.com'
          git switch -c fixer3/issue-4705-soft-evidence-weight
          git add js/analysis/types/constraints.js tests/phase7/types/issue-4705-soft-evidence-weight.test.mjs
          git commit -m 'fix(types): validate soft evidence weights (#4705)'
          git push origin HEAD:refs/heads/fixer3/issue-4705-soft-evidence-weight
