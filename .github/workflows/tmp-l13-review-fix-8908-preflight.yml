name: tmp-l13-review-fix-8908-preflight
on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-03-batch-03
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-campaign-20260914-lane-03-batch-03
          fetch-depth: 0
      - name: Guard exact reviewed parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f141c839f5071e0e781913becdaa56d7bb633c6f"
          test "$(git rev-parse HEAD^^)" = "f26f33edb939d89681b6dc9254e239b86be620be"
      - name: Apply pre-allocation row admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'js/managed/cil/metadata-layout.js',
              "    chargeRow(encodedByteLength = 0) {\n",
              "    preflightRows(count, encodedByteLength = 0) {\n"
              "      if (!Number.isSafeInteger(count) || count < 0\n"
              "          || !Number.isSafeInteger(encodedByteLength) || encodedByteLength < 0)\n"
              "        fail('cil-metadata-resource-limit-row-size');\n"
              "      const nextRows = rows + count;\n"
              "      if (!Number.isSafeInteger(nextRows) || nextRows > limits.maxRows)\n"
              "        fail('cil-metadata-resource-limit-rows');\n"
              "      const retainedBytes = 256 + encodedByteLength * 4;\n"
              "      const addedHeapBytes = retainedBytes * count;\n"
              "      if (!Number.isSafeInteger(retainedBytes) || !Number.isSafeInteger(addedHeapBytes)\n"
              "          || heapBytes + addedHeapBytes > limits.maxEstimatedHeapBytes)\n"
              "        fail('cil-metadata-resource-limit-heap');\n"
              "    },\n"
              "    chargeRow(encodedByteLength = 0) {\n",
          )

          def wrap_read_rows(path, count_expr):
              p = Path(path)
              text = p.read_text()
              old = f"  const readRows = (table, decode) => Array.from({{ length: {count_expr} }}, (_, i) => {{\n"
              new = (
                  "  const readRows = (table, decode) => {\n"
                  f"    const count = {count_expr};\n"
                  "    if (budget) budget.preflightRows(count, rowSizes[table]);\n"
                  "    return Array.from({ length: count }, (_, i) => {\n"
              )
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: readRows start count={text.count(old)}')
              text = text.replace(old, new, 1)
              old_end = "    return { rid, token: cilMetadataToken(table, rid), ...decode(pos) };\n  });"
              new_end = "      return { rid, token: cilMetadataToken(table, rid), ...decode(pos) };\n    });\n  };"
              if text.count(old_end) != 1:
                  raise SystemExit(f'{path}: readRows end count={text.count(old_end)}')
              p.write_text(text.replace(old_end, new_end, 1))

          wrap_read_rows('js/managed/cil/metadata-definitions.js', 'counts[table]')
          wrap_read_rows('js/managed/cil/metadata-generics.js', 'counts[table]')
          wrap_read_rows('js/managed/cil/metadata-manifest-security.js', 'counts[table] || 0')

          replace_once(
              'js/managed/cil/metadata-definitions.js',
              "  const typeSpecs = counts[0x1b] ? Array.from({ length: counts[0x1b] }, (_, i) => {\n",
              "  if (budget && counts[0x1b]) budget.preflightRows(counts[0x1b], rowSizes[0x1b]);\n"
              "  const typeSpecs = counts[0x1b] ? Array.from({ length: counts[0x1b] }, (_, i) => {\n",
          )

          p = Path('tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs')
          text = p.read_text()
          anchor = "  }\n\n  function genericParamAliasFixture(n) {"
          insert = "  }\n\n  {\n    const budget = createCilMetadataBudget({ resourceBudget: {\n      maxRows: 10_000_000, maxEstimatedHeapBytes: 1024, maxWork: 1000, deadlineMs: 10_000,\n    } });\n    assert.throws(() => budget.preflightRows(1_000_000, 8), /cil-metadata-resource-limit-heap/,\n      'table-sized result allocation must be rejected before Array.from materializes it');\n  }\n\n  function genericParamAliasFixture(n) {"
          if text.count(anchor) != 1:
              raise SystemExit('retained-row test anchor mismatch')
          p.write_text(text.replace(anchor, insert, 1))
          PY
      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail
          for f in js/managed/cil/metadata-layout.js js/managed/cil/metadata-definitions.js js/managed/cil/metadata-generics.js js/managed/cil/metadata-manifest-security.js tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs; do timeout 10s node --check "$f"; done
      - name: Focused CIL validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s node tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs
          timeout 90s node tests/phase11/cil/issue-8699-cil-metadata-string-alias-budget.test.mjs
          timeout 90s node tests/phase11/cil/issue-8699-8797-public-parse-single-pass.test.mjs
          timeout 90s node tests/phase11/cil/issue-8797-cil-exportedtype-resolution-budget.test.mjs
          timeout 90s node tests/phase11/cil/issue-8778-cil-definition-identity.test.mjs
      - name: Commit repair and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-l13-review-fix-8908-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/managed/cil tests/phase11/cil .github/workflows/tmp-l13-review-fix-8908-preflight.yml
          git commit -m "fix(cil): preflight metadata rows before array allocation"
          git push origin HEAD:codex/issue-campaign-20260914-lane-03-batch-03
