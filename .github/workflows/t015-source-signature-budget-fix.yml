name: T015 source-backed signature budget fix

on:
  push:
    branches:
      - fix/t015-code-signature-source-budget-20260917
    paths:
      - .github/workflows/t015-source-signature-budget-fix.yml

permissions:
  contents: write

env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
  HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Defer uncached source-backed signature blob
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('js/apple/knowledge.js')
          text = p.read_text()
          old_comment = """  // Request exactly the declared LC_CODE_SIGNATURE range. Sparse source-backed
          // parsing will surface a cache miss for this one bounded range and restart;
          // it never needs to materialize the whole Mach-O slice.
          """
          new_comment = """  // Resident inputs can validate the full declared signature structure. Sparse
          // source-backed parsing must not pull a potentially multi-megabyte optional
          // signing blob merely to open the image; an uncached blob stays explicitly
          // partial until a caller provides those bytes through a dedicated path.
          """
          old_line = "    if (error?.code === 'BINARY_SOURCE_RANGE_MISSING') throw error;"
          new_block = """    if (error?.code === 'BINARY_SOURCE_RANGE_MISSING' && input?.__binaryByteBacking === true) {
              return signatureResult('partial', {
                complete: false,
                reasons: ['signature-bytes-deferred'],
                provenance,
              });
            }
            if (error?.code === 'BINARY_SOURCE_RANGE_MISSING') throw error;"""
          if text.count(old_comment) != 1:
              raise SystemExit(f'code-signature comment boundary mismatch: {text.count(old_comment)}')
          if text.count(old_line) != 1:
              raise SystemExit(f'code-signature catch boundary mismatch: {text.count(old_line)}')
          text = text.replace(old_comment, new_comment, 1).replace(old_line, new_block, 1)
          p.write_text(text)
          PY
          node --check js/apple/knowledge.js
      - name: Focused Apple signature regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/apple-code-signature-source-budget.test.mjs tests/apple-knowledge-x02.test.mjs
      - name: Fetch and verify pinned fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm run fixtures:fetch
          npm run fixtures:check
      - name: Verify universal binary benchmark budget
        shell: bash
        run: |
          set -euo pipefail
          npm --silent run binary:benchmark > /tmp/t015-benchmark.json
          node tools/benchmark/compare.mjs --binary=/tmp/t015-benchmark.json
      - name: Commit verified production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/apple/knowledge.js
          git commit -m 'fix(t015): defer uncached source-backed signature blobs'
          git push origin HEAD:fix/t015-code-signature-source-budget-20260917
