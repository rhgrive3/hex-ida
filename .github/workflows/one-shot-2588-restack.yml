name: One-shot 2588 restack
on:
  push:
    branches: [fix/2588-restack-final]
permissions:
  contents: write
jobs:
  restack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused ARM64 structured-width diff
        run: |
          git fetch origin fix/arm64-structured-width-2588
          git diff origin/main...origin/fix/arm64-structured-width-2588 -- \
            js/targets/architecture/arm64/effects/addressing.js \
            js/targets/architecture/arm64/effects/common.js \
            js/targets/architecture/arm64/effects/control.js \
            js/targets/architecture/arm64/effects/flags.js \
            js/targets/architecture/arm64/effects/fp-core.js \
            js/targets/architecture/arm64/effects/index.js \
            js/targets/architecture/arm64/effects/integer.js \
            js/targets/architecture/arm64/effects/system.js \
            tests/machine-effects/arm64-memory-register-identity.test.mjs \
            tests/machine-effects/arm64-structured-width-validation.test.mjs > /tmp/2588.patch
          git apply --3way /tmp/2588.patch
          node tests/machine-effects/arm64-structured-width-validation.test.mjs
          node tests/machine-effects/arm64-memory-register-identity.test.mjs
          node tests/machine-effects/run.mjs
      - name: Commit restack
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/targets/architecture/arm64/effects tests/machine-effects/arm64-memory-register-identity.test.mjs tests/machine-effects/arm64-structured-width-validation.test.mjs
          git commit -m 'fix(arm64): reject coerced structured register widths'
      - name: Verify Stage2 from clean committed tree
        run: node tests/stage2/run.mjs
      - name: Push restack
        run: git push origin HEAD:fix/2588-restack-final
