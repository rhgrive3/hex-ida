name: Reopened final repair
on:
  push:
    branches: [fix/reopened-audit-final-20260830]
    paths:
      - '.github/workflows/reopened-final-repair-runner.yml'
permissions:
  contents: write
jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reopened-audit-final-20260830
          fetch-depth: 0
      - name: Repair patcher target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/reopened-final-repair.py'); s=p.read_text()
          old="""for kind in ['callers','callees']:
    old=f\"const {{ program, reason }} = await localProgram(id, '{kind}', options);\"
    new=f\"const {{ program, reason, scannedRegionIds, unscannedRegionIds }} = await localProgram(id, '{kind}', options);\"
    if text.count(old)!=1: raise SystemExit(f'{kind} destructure mismatch')
    text=text.replace(old,new,1)
"""
          new="""old=\"const { program, reason } = await localProgram(id, 'callers', options);\"
new=\"const { program, reason, scannedRegionIds, unscannedRegionIds } = await localProgram(id, 'callers', options);\"
if text.count(old)!=1: raise SystemExit('callers destructure mismatch')
text=text.replace(old,new,1)
old=\"const { program, reason } = await localProgram(address, 'callees', options);\"
new=\"const { program, reason, scannedRegionIds, unscannedRegionIds } = await localProgram(address, 'callees', options);\"
if text.count(old)!=1: raise SystemExit('callees destructure mismatch')
text=text.replace(old,new,1)
"""
          if s.count(old)!=1: raise SystemExit('patcher loop target missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply repair
        shell: bash
        run: |
          set +e
          python .github/reopened-final-repair.py > .github/reopened-repair-output.txt 2>&1
          status=$?
          cat .github/reopened-repair-output.txt
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/reopened-repair-output.txt
            git commit -m 'chore: capture reopened repair failure'
            git push origin HEAD:fix/reopened-audit-final-20260830
            exit "$status"
          fi
      - name: Syntax and focused contracts
        shell: bash
        run: |
          node --check js/app.js
          node --check js/analysis/demand-driven-runtime.js
          node --check js/analysis/investigation-service.js
          node tests/reopened-final-seven-contracts.mjs
          node tests/phase4/integration/issues-2502-2522-demand-analysis.test.mjs
          node tests/phase4/integration/issues-2507-2518-resource-contracts.test.mjs
          node tests/reopened-route-diff-contracts.mjs
          node tools/benchmarks/reopened-final-demand-paths.mjs
      - name: Full test suites
        shell: bash
        run: |
          npm test
          npm run ui:test
      - name: Remove temporary automation
        shell: bash
        run: |
          rm -f .github/reopened-final-repair.py
          rm -f .github/reopened-final-inspection.txt
          rm -f .github/reopened-repair-output.txt
          rm -f .github/workflows/reopened-final-repair-runner.yml
      - name: Commit repaired branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No repair diff'; exit 1; }
          git commit -m 'fix(analysis): finish reopened audit contracts'
          git push origin HEAD:fix/reopened-audit-final-20260830
