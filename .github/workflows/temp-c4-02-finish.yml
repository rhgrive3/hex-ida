name: Temporary C4-02 dispatcher refusal repair
on:
  push:
    branches: ['impl/c4-02-finish-20260916']
    paths: ['.github/workflows/temp-c4-02-finish.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HEAD_SHA: 0610dbd0bec3444625bbdc1ceed71610e9a4a928
      TARGET_BRANCH: feat/analysis-roadmap-v8-current-main-20260907
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 400
      - name: Prepare exact PR head
        shell: bash
        run: |
          set -euo pipefail
          cp .tmp/c4-02-patch.py /tmp/c4-02-patch.py
          cp .tmp/c4-02-ownership-patch.py /tmp/c4-02-ownership-patch.py
          git checkout --detach "$HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked build dependencies
        timeout-minutes: 3
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply conservative dispatcher refusal and regressions
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/c4-02-patch.py
          python /tmp/c4-02-ownership-patch.py
          git diff --check
      - name: Test edge accounting denominator
        run: node --test tests/phase8/structuring/edge-accounting.test.mjs
      - name: Test conditional region authority
        run: node --test tests/phase8/structuring/conditional-region-body-authority.test.mjs
      - name: Test conditional region projection
        run: node --test tests/phase8/structuring/conditional-region-body-projection.test.mjs
      - name: Test conditional region erasure
        run: node --test tests/phase8/structuring/conditional-region-erasure.test.mjs
      - name: Test conditional region reachability
        run: node --test tests/phase8/structuring/conditional-region-reachability.test.mjs
      - name: Test conditional region structure
        run: node --test tests/phase8/structuring/conditional-region-structure.test.mjs
      - name: Generate protected userscript
        run: npm run userscript:build
      - name: Validate generated diff
        run: git diff --check
      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/decompiler/phase8/structuring.js tests/phase8/structuring/edge-accounting.test.mjs tools/validation/analysis-roadmap/ownership.json userscript/hex.user.template.js userscript/release-version.json
          git commit -m 'fix(phase8): keep dispatcher loops residual'
      - name: Rebuild protected userscript
        run: npm run userscript:build
      - name: Verify deterministic generated output
        run: git diff --exit-code
      - name: Verify Phase 8 ownership manifest
        run: node tools/validation/phase8-ownership.mjs --check-manifest
      - name: Verify roadmap Phase 8 ownership
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=400 origin main:refs/remotes/origin/main
          BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          node tools/validation/analysis-roadmap/ownership.mjs --branch "$TARGET_BRANCH" --phase phase8 --base-sha "$BASE_SHA" --head-sha "$(git rev-parse HEAD)"
      - name: Publish only if PR head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          REMOTE=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$REMOTE" = "$HEAD_SHA" || { echo "target moved: expected $HEAD_SHA got $REMOTE"; exit 1; }
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
