            vtables.push(x);const owner=types.find((t)=>t.address.toString()===String(v.typeAddress));if(owner){owner.vtable=methods;owner.methods=methods;}
          }
          const implementationProofRequired=autoVtables.seeds.length>0||opts.requireImplementationProof===true;
          const witnessTables=[];'''
          s=sub1(s,old,new,'swift model vtable block',re.S)
          s=sub1(s,r'return\{runtime:\x27swift\x27,types,protocols,conformances,vtables,witnessTables,completeness,complete:completeness\.complete,warnings\};',"return{runtime:'swift',types,protocols,conformances,vtables,witnessTables,completeness,complete:completeness.complete,warnings,implementationProofRequired};",'swift return model')
