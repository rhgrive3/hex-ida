                const boundary=imageBase+BigInt(i+1<page.offsets.length?page.offsets[i+1]:page.upper);
                let end=null;if(boundary>start){const last=boundary-1n;if(image.segmentAt(last)===seg)end=boundary;}
                staged.push({start,end,sizeBytes:end!=null?Number(end-start):null});
