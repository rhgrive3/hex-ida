                if(entryOff<12){partial('compressed-entry-offset-invalid');break;}
                if(encodingsCount&&(encodingsOff<12||encodingsOff>pageBytes||encodingsCount>Math.floor((pageBytes-encodingsOff)/4))){partial('compressed-encodings-out-of-page');break;}
                encodingTotal=commonCount+encodingsCount;
