              const e=fileOff+indexOff+i*12,next=e+12,lower=r.u32(e),upper=r.u32(next),pageOff=r.u32(e+4);
              if(upper<=lower){partial('nonmonotonic-first-level-range');break;}
              if(!pageOff||pageOff>fileSize-8){partial('page-out-of-range');break;}
              const pageAbs=fileOff+pageOff,pageBytes=Math.min(4096,fileSize-pageOff),kind=r.u32(pageAbs),entryOff=r.u16(pageAbs+4),count=r.u16(pageAbs+6);
              let stride=0,encodingTotal=null;
              if(kind===2){stride=8;if(entryOff<8){partial('regular-entry-offset-invalid');break;}}
              else if(kind===3){
                if(pageBytes<12){partial('compressed-header-truncated');break;}
