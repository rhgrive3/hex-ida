          s=sub1(s,r'export async function parseSwiftVTable\(read,address,count,budget=4096\)\{.*?return out;\}',swift_vtable,'swift parseSwiftVTable',re.S)
          old=r'''  const autoVtables=await discoverSwiftClassVTables\(read,types,budget\);warnings\.push\(\.\.\.autoVtables\.warnings\);\n  const vtableSeedMap=new Map\(\);for\(const v of autoVtables\.seeds\)vtableSeedMap\.set\(`\$\{String\(v\.typeAddress\)\}:\$\{String\(v\.address\)\}`,v\);for\(const v of opts\.vtables\|\|\[\]\)vtableSeedMap\.set\(`\$\{String\(v\.typeAddress\)\}:\$\{String\(v\.address\)\}`,v\);\n  const vtables=\[\];let vtablesComplete=autoVtables\.complete;for\(const v of vtableSeedMap\.values\(\)\)\{const methods=await parseSwiftVTable\(read,v\.address,v\.count,budget\),expected=Math\.min\(normalizeBudget\(v\.count,0,100000\),budget\),x=\{\.\.\.v,methods\};if\(methods\.length!==expected\|\|Number\(v\.count\)>budget\)vtablesComplete=false;vtables\.push\(x\);const owner=types\.find\(\(t\)=>t\.address\.toString\(\)===String\(v\.typeAddress\)\);if\(owner\)\{owner\.vtable=methods;owner\.methods=methods;\}\}\n  const witnessTables=\[\];'''
          new='''  const autoVtables=await discoverSwiftClassVTables(read,types,budget);warnings.push(...autoVtables.warnings);
          const validateVTableImplementation=swiftVTableImplementationValidator(opts);
