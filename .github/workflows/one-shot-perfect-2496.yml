          # used by extended metadata before executable proof is evaluated.
          p='js/objc-legacy.js'; s=read(p)
          anchor="function cleanPointer(get, value) { return sanitizePointer(value, get.base, get.pointerFormat); }"
          if anchor not in s: raise SystemExit('objc legacy cleanPointer anchor missing')
          helper=anchor+"""

          async function decodedPointer(get, value, fieldAddress = null) {
            if (value === 0n) return null;
