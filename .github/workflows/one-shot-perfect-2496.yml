name: One-shot perfect PR 2496
on:
  push:
    branches:
      - fix/unlinked-issues-2377-2388-2393-2478
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-issues-2377-2388-2393-2478
          fetch-depth: 0
      - name: Harden production contracts and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def sub1(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return out

          # Swift: automatic class-vtable projection must not publish an exact target
          # until the implementation address is proven executable/aligned.
          p='js/swift.js'; s=read(p)
          swift_vtable = r'''function swiftVTableImplementationValidator(options={}) {
            if (typeof options.validateImplementation === 'function') return options.validateImplementation;
            const ranges=(options.executableRanges||[]).filter((r)=>r?.vmAddr!=null&&r?.size!=null&&BigInt(r.size)>0n);
            if(!ranges.length)return null;
            const arch=String(options.architecture||options.arch||options.binaryImage?.arch||'').toLowerCase();
            const alignment=arch.includes('arm64')?4n:(arch==='arm'||arch.startsWith('armv'))?2n:1n;
            return async(address)=>{
              if(address==null)return{ok:false,reason:'swift-vtable-implementation-missing'};
              const a=BigInt(address);
              if(!ranges.some((r)=>a>=BigInt(r.vmAddr)&&a<BigInt(r.vmAddr)+BigInt(r.size)))return{ok:false,reason:'swift-vtable-implementation-not-executable'};
              if(alignment>1n&&a%alignment!==0n)return{ok:false,reason:'swift-vtable-implementation-misaligned'};
              return{ok:true};
            };
          }

          export async function parseSwiftVTable(read,address,count,budget=4096,options={}) {
            if(budget&&typeof budget==='object'){options=budget;budget=4096;}
            const n=Math.min(normalizeBudget(count,0,100000),normalizeBudget(budget,4096,100000)),out=[];
            const validate=swiftVTableImplementationValidator(options),proofRequired=options.requireImplementationProof===true;
            let at=BigInt(address);
            for(let i=0;i<n;i++,at+=8n){
              const b=await exact(read,at,8);if(!b)break;
              const flags=u32(b,0),rawImpl=rel(at+4n,i32(b,4));
              let implementationProven=!proofRequired,implementationValidationReason=null;
              if(rawImpl==null){implementationProven=false;implementationValidationReason='swift-vtable-implementation-missing';}
              else if(typeof validate==='function'){
                try{const proof=await validate(rawImpl);implementationProven=proof===true||proof?.ok===true;if(!implementationProven)implementationValidationReason=proof?.reason||'swift-vtable-implementation-unproven';}
                catch{implementationProven=false;implementationValidationReason='swift-vtable-implementation-validation-error';}
              }else if(proofRequired){implementationProven=false;implementationValidationReason='swift-vtable-implementation-proof-unavailable';}
              out.push({index:i,flags,impl:implementationProven?rawImpl:null,rawImpl,implementationProven,implementationValidationReason,kind:flags&0x0f,instance:!!(flags&0x10),dynamic:!!(flags&0x20),async:!!(flags&0x40)});
            }
            return out;
