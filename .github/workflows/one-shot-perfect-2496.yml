              }else{partial('unsupported-second-level-kind');break;}
              if(entryOff>pageBytes||count>Math.floor((pageBytes-entryOff)/stride)){partial('entry-array-out-of-page');break;}
              const offsets=[];
              for(let k=0;k<count;k++){
                if(!budget.take({inputBytes:stride,records:1,objects:1,operations:2,estimatedHeapBytes:64},'compact-unwind-entry')){complete=false;break outer;}
                const at=pageAbs+entryOff+k*stride;let functionOffset;
                if(kind===2)functionOffset=r.u32(at);
                else{const entry=r.u32(at),encodingIndex=(entry>>>24)&0xff;if(encodingIndex>=encodingTotal){partial('compressed-encoding-index-out-of-range');break outer;}functionOffset=lower+(entry&0x00ffffff);}
                if(functionOffset<lower||functionOffset>=upper){partial('entry-outside-first-level-range');break outer;}
                offsets.push(functionOffset);
              }
              offsets.sort((a,b)=>a-b);for(let k=1;k<offsets.length;k++)if(offsets[k]===offsets[k-1]){partial('duplicate-function-offset');break outer;}
              pages.push({lower,upper,offsets});
            }
            if(!complete)return;
