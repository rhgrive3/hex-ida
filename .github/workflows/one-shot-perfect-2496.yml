          const baseRead=async(a,n)=>{const x=Number(a);return x>=0&&x+n<=mem.length?mem.subarray(x,x+n):null;};
          const SEC=0x1000n,T=0x2000n,N=0x3000n,IMPL=0x5000n;put(SEC,rel(SEC,T));put(T,new Uint8Array(64));put(T,u32(0x80000010));put(T+8n,rel(T+8n,N));put(N,str('C'));put(T+44n,u32(0));put(T+48n,u32(1));put(T+52n,u32(0x10));put(T+56n,rel(T+56n,IMPL));
