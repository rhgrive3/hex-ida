          function fixture({kind=2,offsets=[0x1000],lower=0x1000,upper=0x2000,encodingIndices=null,pageOff=80,size=512}={}){const b=new Uint8Array(size),v=new DataView(b.buffer),w=(o,x)=>v.setUint32(o,x>>>0,true),h=(o,x)=>v.setUint16(o,x,true);w(0,1);w(4,28);w(8,1);w(28,0);w(20,32);w(24,2);w(32,lower);w(36,pageOff);w(44,upper);w(pageOff,kind);if(kind===2){h(pageOff+4,8);h(pageOff+6,offsets.length);offsets.forEach((x,i)=>{w(pageOff+8+i*8,x);w(pageOff+12+i*8,0);});}else{h(pageOff+4,12);h(pageOff+6,offsets.length);h(pageOff+8,12+offsets.length*4);h(pageOff+10,0);offsets.forEach((x,i)=>w(pageOff+12+i*4,(((encodingIndices?.[i]??0)&255)<<24)|((x-lower)&0xffffff)));}return b;}
          let b=fixture(),im=image(b);parseCompactUnwind(new ByteView(b),im);assert.equal(im.functions.length,1);assert.equal(im.unwindEntries[0].end,0x100002000n);
          b=fixture({offsets:[0x3000]});im=image(b);parseCompactUnwind(new ByteView(b),im);assert.equal(im.functions.length,0);assert.equal(im.metadata.machoMetadata.complete,false);
          b=fixture({kind:3,offsets:[0x1100]});im=image(b);parseCompactUnwind(new ByteView(b),im);assert.equal(im.functions[0]?.address,0x100001100n);
