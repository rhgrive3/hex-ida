            }
            return cleanPointer(get, value);
          }"""
          s=s.replace(anchor,helper,1)
          old="""    } else {
              nameAddr = cleanPointer(get, u64(b, 0));
              imp = cleanPointer(get, u64(b, 16));
            }"""
          new="""    } else {
              nameAddr = await decodedPointer(get, u64(b, 0), entry);
              imp = await decodedPointer(get, u64(b, 16), entry + 16n);
            }"""
          if old not in s: raise SystemExit('objc legacy absolute method anchor missing')
          s=s.replace(old,new,1)
          anchor="  get.requireImplementationProof = options.requireImplementationProof === true;"
          if anchor not in s: raise SystemExit('objc legacy options anchor missing')
          s=s.replace(anchor,anchor+"\n  get.resolvePointer = typeof options.resolvePointer === 'function' ? options.resolvePointer : null;",1)
          write(p,s)

          p='js/objc.js'; s=read(p)
          base_line="  const base = await buildLegacyObjcModel(read, classList, onProgress, imageBase, effectivePointerFormat, { validateImplementation, requireImplementationProof:true });\n"
          if base_line not in s: raise SystemExit('objc base line missing')
          s=s.replace(base_line,'',1)
          anchor="  const extra = await parseObjcExtendedMetadata(read, runtimeSections, {"
          if anchor not in s: raise SystemExit('objc extra anchor missing')
          base="  const base = await buildLegacyObjcModel(read, classList, onProgress, imageBase, effectivePointerFormat, { validateImplementation, requireImplementationProof:true, resolvePointer });\n"
          s=s.replace(anchor,base+anchor,1);write(p,s)

