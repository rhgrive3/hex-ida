          b=fixture({kind:3,offsets:[0x1100],encodingIndices:[2]});im=image(b);parseCompactUnwind(new ByteView(b),im);assert.equal(im.functions.length,0);assert.ok(im.metadata.machoMetadata.reasons.some((r)=>r.includes('encoding-index')));
          b=fixture({offsets:[0x1000,0x3000]});im=image(b);parseCompactUnwind(new ByteView(b),im);assert.equal(im.functions.length,0);assert.equal(im.unwindEntries.length,0);
          b=fixture();im=image(b);let budget=createMachOMetadataBudget(im,{limits:{inputBytes:1e6,records:1,objects:1e6,stringBytes:1e6,operations:1e6,warnings:100,estimatedHeapBytes:1e6,wallClockMs:5000}});parseCompactUnwind(new ByteView(b),im,budget);assert.equal(im.functions.length,0);assert.equal(im.metadata.machoMetadata.complete,false);
