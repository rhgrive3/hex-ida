          old="""        const model=await buildSwiftMetadataModel(read,regions,{\n          budget:20000,\n          resolvePointer:(raw,context)=>this.backend.resolvePointer(raw,{...context,sliceIndex:slice}),\n        });"""
          new="""        const executableRanges=regions.filter((r)=>r?.exec===true&&r.size>0n).map((r)=>({vmAddr:r.vmAddr,size:r.size}));
          const architecture=this.store.get('architecture')||null;
          const model=await buildSwiftMetadataModel(read,regions,{
            budget:20000,
            resolvePointer:(raw,context)=>this.backend.resolvePointer(raw,{...context,sliceIndex:slice}),
            executableRanges,architecture,requireImplementationProof:true,
          });"""
          if old not in s: raise SystemExit('app swift anchor missing')
          s=s.replace(old,new,1);write(p,s)

