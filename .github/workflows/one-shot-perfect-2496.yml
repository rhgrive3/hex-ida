          const truncated=async(a,n)=>BigInt(a)>=T+60n?null:baseRead(a,n);model=await buildSwiftMetadataModel(truncated,sections,proof);assert.equal(model.complete,false);d=resolveSwiftDispatch(buildSwiftRuntimeIndex(model),{kind:'vtable',typeAddress:T,slot:1});assert.equal(d.resolved,null);
