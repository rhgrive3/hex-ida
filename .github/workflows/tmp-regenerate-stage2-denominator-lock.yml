name: Temporary Stage2 denominator regeneration

on:
  push:
    branches:
      - fix/managed-issues-1112-1134
    paths:
      - '.github/workflows/tmp-regenerate-stage2-denominator-lock.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate canonical Stage2 denominator artifacts
        run: |
          node tools/validation/stage2/build-profile-denominator-inventory.mjs
          node tools/validation/stage2/build-profile-denominator-lock.mjs
          node tests/stage2/profile-denominator-inventory.test.mjs
      - name: Commit canonical artifacts
        run: |
          if git diff --quiet -- tools/validation/stage2/profile-denominator-inventory.json tools/validation/stage2/profile-denominators.lock.json; then
            echo 'No denominator artifact changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validation/stage2/profile-denominator-inventory.json tools/validation/stage2/profile-denominators.lock.json
          git commit -m 'chore(stage2): regenerate managed denominator lock'
          git push origin HEAD:fix/managed-issues-1112-1134
