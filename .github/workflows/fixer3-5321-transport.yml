name: Fixer 3 issue 5321 transport
on:
  push:
    branches:
      - fixer3/issue-5321-width-preserving-casts
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixer3/issue-5321-width-preserving-casts
          fetch-depth: 1
      - name: Verify validated base and apply focused patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/analysis/alias/canonical-address-v2-core.js)" = bc341bea9baa9ba50c2cd84e76fa39b0483a90be
          test "$(git hash-object js/analysis/pointsto/local.js)" = 89273250b0266f91bbf5694e43ead9fd4e7a2670
          test "$(git hash-object tests/phase7/pointsto/loaded-pointer-recovery.test.mjs)" = a8e34bd08022b04551901f34f3442b3417d35f0d
          echo '' | base64 -d > /tmp/issue5321.patch
          git apply --check /tmp/issue5321.patch
          git apply /tmp/issue5321.patch
          test "$(git hash-object js/analysis/alias/canonical-address-v2-core.js)" = a7d46c9af130444e720be93967bc815909f5e508
          test "$(git hash-object js/analysis/pointsto/local.js)" = fee907c420649ced03d76b9c8d344532c3429935
          test "$(git hash-object tests/phase7/pointsto/loaded-pointer-recovery.test.mjs)" = 04ca6b28716ca90d7be0bf35caad91bddea0a161
          test "$(git hash-object tests/phase7/pointsto/issue-5321-width-preserving-casts.test.mjs)" = 333a4074d991402cf1d122be67be07d076d16404
          node --check js/analysis/alias/canonical-address-v2-core.js
          node --check js/analysis/pointsto/local.js
          node --check tests/phase7/pointsto/issue-5321-width-preserving-casts.test.mjs
          node --test tests/phase7/pointsto/issue-5321-width-preserving-casts.test.mjs tests/phase7/pointsto/loaded-pointer-recovery.test.mjs
          git diff --check
          git rm .github/workflows/fixer3-5321-transport.yml
          git add js/analysis/alias/canonical-address-v2-core.js js/analysis/pointsto/local.js tests/phase7/pointsto/loaded-pointer-recovery.test.mjs tests/phase7/pointsto/issue-5321-width-preserving-casts.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(pointsto): require width-preserving casts (#5321)'
          git push origin HEAD:fixer3/issue-5321-width-preserving-casts
