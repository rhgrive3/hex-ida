name: Temporary PR9122 T014 focused verification

on:
  push:
    branches:
      - diag-pr9122-t014
    paths:
      - '.github/workflows/tmp-pr9122-t014-focused.yml'
      - '.github/pr9122-rebuild.py'

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fetch reviewed donor only
        run: timeout 60s git fetch --depth=1 origin component/final-closure-t014-v3:refs/remotes/origin/component/final-closure-t014-v3
      - name: Reconstruct current-contract backend
        run: |
          python .github/pr9122-rebuild.py
          cp js/symbolic/solver/bitblast-backend.js /tmp/bitblast-backend.js
      - name: Syntax
        run: timeout 120s node tests/check.mjs
      - name: T014 structural hash
        run: timeout 120s node --test --test-concurrency=1 tests/phase9/expr/t014-bounded-structural-hash.test.mjs
      - name: T014 bitblast differential
        run: timeout 120s node --test --test-concurrency=1 tests/phase9/solver/t014-bitblast-differential.test.mjs
      - name: T014 foundation boundaries
        run: timeout 120s node --test --test-concurrency=1 tests/phase9/solver/t014-foundation-boundaries.test.mjs
      - name: T014 wide exact
        run: timeout 120s node --test --test-concurrency=1 tests/phase9/solver/t014-wide-exact.test.mjs
      - name: T014 registry authority
        run: timeout 120s node --test --test-concurrency=1 tests/phase9/solver/issue-5391-solver-registry-exact-default-authority.test.mjs
      - name: T014 eligibility authority
        run: timeout 120s node --test --test-concurrency=1 tests/issue-5498-eligibility-result-status-authority.mjs
      - name: Push clean one-file fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s git fetch --depth=1 origin fix-bitblast-main-syntax-20260917:refs/remotes/origin/fix-bitblast-main-syntax-20260917
          test "$(git rev-parse origin/fix-bitblast-main-syntax-20260917)" = "1b7818d00dec177a24aad1aa75289406c34bcb7a"
          git checkout --detach origin/fix-bitblast-main-syntax-20260917
          cp /tmp/bitblast-backend.js js/symbolic/solver/bitblast-backend.js
          git add js/symbolic/solver/bitblast-backend.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(symbolic): restore current-contract bitblast backend'
          timeout 60s git push origin HEAD:fix-bitblast-main-syntax-20260917
