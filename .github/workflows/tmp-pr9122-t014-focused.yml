name: Temporary PR9122 T014 focused verification

on:
  push:
    branches:
      - diag-pr9122-t014
    paths:
      - '.github/workflows/tmp-pr9122-t014-focused.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture differential first failure
        id: diff
        shell: bash
        run: |
          set +e
          timeout 120s node --test --test-concurrency=1 tests/phase9/solver/t014-bitblast-differential.test.mjs >/tmp/diff.out 2>&1
          rc=$?
          {
            echo "exit_code=$rc"
            tail -n 120 /tmp/diff.out
          } > t014-differential-first.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: t014-differential-first
          path: t014-differential-first.txt
          retention-days: 1
      - name: Preserve failure status
        run: test '${{ steps.diff.outputs.exit_code }}' = '0'
