name: PR7036 conflict snapshot v2

on:
  push:
    branches:
      - sync/pr7036-main-20260917
    paths:
      - '.github/workflows/pr7036-conflict-snapshot-v2.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot exact conflict stages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p conflict-snapshot/{base,ours,theirs}
          git checkout --detach "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          ours=$(git rev-parse HEAD)
          theirs=$(git rev-parse refs/remotes/origin/main)
          {
            echo "ours=$ours"
            echo "main=$theirs"
          } > conflict-snapshot/result.txt
          set +e
          git merge --no-commit --no-ff refs/remotes/origin/main >/dev/null 2>conflict-snapshot/merge-stderr.txt
          rc=$?
          set -e
          echo "merge_rc=$rc" >> conflict-snapshot/result.txt
          git diff --name-only --diff-filter=U | sort -u > conflict-snapshot/conflicts.txt
          count=$(wc -l < conflict-snapshot/conflicts.txt | tr -d ' ')
          echo "conflict_count=$count" >> conflict-snapshot/result.txt
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            for stage in 1 2 3; do
              case "$stage" in
                1) out="conflict-snapshot/base/$p" ;;
                2) out="conflict-snapshot/ours/$p" ;;
                3) out="conflict-snapshot/theirs/$p" ;;
              esac
              mkdir -p "$(dirname "$out")"
              if ! git show ":$stage:$p" > "$out" 2>/dev/null; then
                printf '__MISSING__\n' > "$out"
              fi
            done
          done < conflict-snapshot/conflicts.txt
          git merge --abort >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr7036-conflict-snapshot-v2
          path: conflict-snapshot
          if-no-files-found: error
          retention-days: 3
