name: Reopened AI project repair

on:
  push:
    branches:
      - fix/reopened-ai-project-contracts
    paths:
      - '.github/workflows/reopened-ai-project-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reopened-ai-project-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bridge conversation release to runtime-only engines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/ai/ui/session.js')
          s = p.read_text()
          old = "  _releaseConversation(conversation, reason) {\n    if (!conversation?.id) return;\n    if (typeof this.engine?.deleteSession === 'function') {\n      Promise.resolve(this.engine.deleteSession(conversation.id, { reason })).catch(() => {});\n    } else if (typeof this.engine?.forgetAIConversation === 'function') {\n      try { this.engine.forgetAIConversation(conversation.id); } catch { /* best effort */ }\n    }\n  }\n"
          new = "  _releaseConversation(conversation, reason) {\n    if (!conversation?.id) return;\n    const id = String(conversation.id);\n    const deletePersisted = reason === 'user-delete';\n    if (typeof this.engine?.deleteSession === 'function') {\n      Promise.resolve(this.engine.deleteSession(id, { reason })).catch(() => {});\n      return;\n    }\n\n    // Embedding/tests may inject AIRuntime (or just its sessionStore) directly\n    // instead of the full UI bridge. Preserve the same retention-vs-explicit\n    // deletion contract in that shape as well.\n    const runtime = this.engine?.runtime;\n    if (runtime && typeof runtime !== 'function') {\n      if (typeof runtime.releaseSession === 'function') {\n        Promise.resolve(runtime.releaseSession(id, { deletePersisted })).catch(() => {});\n        return;\n      }\n      const store = runtime.sessionStore;\n      if (store) {\n        if (deletePersisted && typeof store.delete === 'function') {\n          Promise.resolve(store.delete(id)).catch(() => {});\n        } else {\n          store.sessions?.delete?.(id);\n        }\n        return;\n      }\n    }\n\n    if (typeof this.engine?.forgetAIConversation === 'function') {\n      try { this.engine.forgetAIConversation(id); } catch { /* best effort */ }\n    }\n  }\n"
          if s.count(old) != 1:
              raise SystemExit(f'_releaseConversation source drifted: {s.count(old)} matches')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/reopened-ai-project-repair.yml').unlink()
          PY
          node tests/issues-2613-2612-2609-ai-sessions-broker.mjs
          node tests/reopened-ai-project-contracts.mjs
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ai): release runtime-only core sessions on chat deletion'
          git push origin HEAD:fix/reopened-ai-project-contracts
