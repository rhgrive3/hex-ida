name: Fixer2 issue 3765 remote write

on:
  push:
    branches:
      - fixer2/issue-3765-function-starts-invalid-payload

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard baseline and apply production fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/macho-core.js)" = "b236a39510b8a333922a93343d3f485d1826f141"
          test "$(git hash-object tests/phase4/binary/issue-3765-function-starts-invalid-payload.test.mjs)" = "fa2ac46182cf37a66e38bf4d2ea65eb45ab10779"
          python - <<'PY'
          from pathlib import Path
          p = Path('js/binary/macho-core.js')
          s = p.read_text()
          old = """function parseFunctionStarts(r, dc, image, sharedBudget = null) {\n  const budget = ensureMachOMetadataBudget(image, sharedBudget);\n  if (!dc.size || dc.offset > r.length || dc.size > r.length - dc.offset) return;\n  let p = dc.offset;\n  const end = dc.offset + dc.size;\n  let addr = image.imageBase;\n  const maxAddress = image.bits === 32 ? 0xffffffffn : 0xffffffffffffffffn;\n  const alignment = (image.arch === 'arm64' || image.arch === 'arm64e' || image.arch === 'arm64_32') ? 4n : image.arch === 'arm' ? 2n : 1n;\n  const status = image.metadata.functionStarts = { complete: true, recovered: 0, partialReason: null };\n"""
          new = """function parseFunctionStarts(r, dc, image, sharedBudget = null) {\n  const budget = ensureMachOMetadataBudget(image, sharedBudget);\n  const status = image.metadata.functionStarts = { complete: true, recovered: 0, partialReason: null };\n  if (!dc.size || dc.offset > r.length || dc.size > r.length - dc.offset) {\n    status.complete = false;\n    status.partialReason = 'invalid-or-truncated-payload';\n    markMachOMetadataPartial(image, 'function-starts-invalid-payload');\n    return;\n  }\n  let p = dc.offset;\n  const end = dc.offset + dc.size;\n  let addr = image.imageBase;\n  const maxAddress = image.bits === 32 ? 0xffffffffn : 0xffffffffffffffffn;\n  const alignment = (image.arch === 'arm64' || image.arch === 'arm64e' || image.arch === 'arm64_32') ? 4n : image.arch === 'arm' ? 2n : 1n;\n"""
          if s.count(old) != 1:
              raise SystemExit('production patch baseline mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          test "$(git hash-object js/binary/macho-core.js)" = "5866650eadc380ee12d8c6986071cedeef3f7f47"
      - name: Focused and nearby validation
        shell: bash
        run: |
          set -euo pipefail
          node --check js/binary/macho-core.js
          node --check tests/phase4/binary/issue-3765-function-starts-invalid-payload.test.mjs
          node --test tests/phase4/binary/issue-3765-function-starts-invalid-payload.test.mjs
          node --test tests/phase4/binary/issue-5275-function-starts-closed-world.test.mjs
          node tests/issue-2389-function-starts-soundness.mjs
          node --test tests/phase4/binary/issue-5551-5555-5559-zero-fill-seeds.test.mjs
          npm run binary:test
          npm run lint
      - name: Commit production change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rhgrive3"
          git config user.email "rhgrive@gmail.com"
          git add js/binary/macho-core.js
          git rm .github/workflows/fixer2-3765-remote-write.yml
          git commit -m "fix(macho): mark invalid function-start payload partial (#3765)"
          git push origin HEAD:fixer2/issue-3765-function-starts-invalid-payload
