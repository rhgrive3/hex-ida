name: tmp-validate-issue-8299

on:
  push:
    branches:
      - fix/mod5-3-8299-machine-effects-prereqs

permissions:
  contents: read

jobs:
  exact-eleven:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mod5-3-8299-machine-effects-prereqs
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install LLVM 18 native oracle
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
      - name: Run prerequisite proof and exact eleven checks
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/issue-8299
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const tests = [
            'arm64-a64-control-denominator.test.mjs',
            'arm64-a64-flags-denominator.test.mjs',
            'arm64-a64-fp-denominator.test.mjs',
            'arm64-a64-integer-denominator.test.mjs',
            'arm64-a64-memory-denominator.test.mjs',
            'arm64-a64-simd-denominator.test.mjs',
            'arm64-a64-system-denominator.test.mjs',
            'arm64e-pac-denominator.test.mjs',
            'a2-denominator.test.mjs',
            'independent-oracle-denominator-preservation.test.mjs',
            'independent-oracle-report.test.mjs',
          ];

          function spawn(command, args, timeout = 180000) {
            return spawnSync(command, args, {
              encoding: 'utf8',
              timeout,
              maxBuffer: 2 * 1024 * 1024,
              env: process.env,
            });
          }
          function compact(result) {
            const text = `${result.stderr || ''}\n${result.stdout || ''}`
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter(Boolean)
              .slice(0, 12)
              .join('\n');
            return text.slice(0, 4000);
          }
          function git(...args) {
            const result = spawn('git', args, 30000);
            if (result.status !== 0) throw new Error(`git ${args.join(' ')} failed`);
            return String(result.stdout || '').trim();
          }

          const evidence = {
            schemaVersion: 'issue-8299-evidence/v1',
            commitSha: git('rev-parse', 'HEAD'),
            treeSha: git('rev-parse', 'HEAD^{tree}'),
            prerequisite: null,
            tests: [],
          };

          const preflight = spawn(process.execPath, ['tools/validation/machine-effects/prerequisites.mjs'], 60000);
          evidence.prerequisite = {
            status: preflight.status,
            error: preflight.error?.message || null,
            output: compact(preflight),
          };
          if (preflight.status === 0) {
            try {
              evidence.prerequisite.identity = JSON.parse(preflight.stdout);
            } catch {
              evidence.prerequisite.identity = null;
            }
          }

          let failed = preflight.status !== 0;
          if (!failed) {
            for (const file of tests) {
              const started = Date.now();
              const result = spawn(process.execPath, [`tests/machine-effects/${file}`]);
              const entry = {
                file,
                status: result.status,
                durationMs: Date.now() - started,
                error: result.error?.message || null,
                output: compact(result),
              };
              evidence.tests.push(entry);
              if (result.status !== 0 || result.error) failed = true;
            }
          }

          evidence.verdict = failed ? 'FAIL' : 'PASS';
          fs.writeFileSync('reports/issue-8299/evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify({
            verdict: evidence.verdict,
            prerequisiteStatus: evidence.prerequisite.status,
            tests: evidence.tests.map(({ file, status }) => ({ file, status })),
          }));
          if (failed) process.exit(1);
          NODE
      - name: Publish compact evidence summary
        if: always()
        shell: bash
        run: |
          if [[ -f reports/issue-8299/evidence.json ]]; then
            cat reports/issue-8299/evidence.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-8299-exact-eleven-evidence
          path: reports/issue-8299/evidence.json
          if-no-files-found: warn
          retention-days: 1
