name: Final closure preflight

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Batch feedback or final product checks (no historical checkpoint replay)
        required: true
        type: choice
        options: [integration, release]
        default: integration
      script:
        description: Existing npm subsystem script for integration mode
        required: true
        type: string
        default: phase12:test

permissions:
  contents: read

concurrency:
  group: final-closure-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  development:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && (startsWith(github.head_ref, 'component/final-closure-') || startsWith(github.head_ref, 'recovery/final-closure-') || startsWith(github.head_ref, 'analysis/final-closure-') || github.head_ref == 'perf/development-gate-policy' || startsWith(github.base_ref, 'recovery/final-closure-') || startsWith(github.base_ref, 'analysis/final-closure-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # PRs test GitHub's combined merge candidate, including the base changes.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Focused checks on the combined development candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check:dev -- --base "$BASE_SHA"

  batch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Check selected subsystem
        if: inputs.mode == 'integration'
        env:
          SUBSYSTEM: ${{ inputs.script }}
        run: node scripts/run-development-check.mjs --script "$SUBSYSTEM"
      - name: Run canonical final product checks once
        if: inputs.mode == 'release'
        run: node scripts/run-quiet-command.mjs --label release-check -- npm run check
      # This job is product-test evidence, not automatic deployment or final signoff.
      # Generated, independent verifier and applicable target/runtime proof remain
      # final release requirements in the development-speed policy.
