name: PR7036 producer IR binding fix
on:
  push:
    branches: [feat/analysis-roadmap-v8-current-main-20260907]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'validate PR 7036 producer IR binding fix')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch and focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          BASE_HEAD="$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/decompiler/pipeline.js')
          s=p.read_text()
          old_import="import { captureProjectionData, captureProjectionIrData } from './phase8/projection-origin.js';"
          new_import="import { captureProjectionData, captureProjectionIrData, captureRecoveryIrData } from './phase8/projection-origin.js';"
          old_obs='const irObservation = captureProjectionIrData(irRoots,options.shouldAbort);'
          new_obs='const irObservation = captureRecoveryIrData(result.ir,irRoots,options.shouldAbort);'
          if s.count(old_import) != 1 or s.count(old_obs) != 1:
              raise SystemExit(f'pipeline replacement counts import={s.count(old_import)} observation={s.count(old_obs)}')
          p.write_text(s.replace(old_import,new_import).replace(old_obs,new_obs))

          t=Path('tests/phase8/substrate/proof-projection-origin.test.mjs')
          s=t.read_text()
          marker="v8 producer observation rejects in-place whole-IR mutation"
          if marker not in s:
              s += r'''\n\ntest('v8 producer observation rejects in-place whole-IR mutation',async()=>{\n const f=projectionFixture();assert.equal(isProducerProjection(f.result),true);\n const last=f.result.ir.instructions.at(-1);\n f.result.ir.instructions.push({...last,id:'ir_post_producer_injected',row:Number(last?.row ?? 0)+1});\n assert.equal(isProducerProjection(f.result),false);\n const r=await optimizeSemanticDecompilation(f.result,f.options);\n assert.equal(r.proofOptimization.status,'partial');assert.equal(r.proofOptimization.adopted,0);\n assert.equal(r.proofOptimization.reason,'unissued-or-stale-projection');\n});\n\ntest('v8 producer observation rejects cross-result IR association',()=>{\n const left=projectionFixture(),right=projectionFixture();\n const mixed={...left.result,ir:right.result.ir};\n assert.equal(isProducerProjection(mixed),false);\n});\n'''.replace('\\n','\n')
              t.write_text(s)
          PY
          set +e
          node --test tests/phase8/substrate/proof-projection-origin.test.mjs > /tmp/projection.txt 2>&1
          RC1=$?
          node --test tests/phase8/integration/proof-optimizer.test.mjs > /tmp/integration.txt 2>&1
          RC2=$?
          set -e
          {
            echo "base_head=$BASE_HEAD"
            echo "projection_rc=$RC1"
            echo "integration_rc=$RC2"
            echo '--- projection tail ---'
            tail -n 100 /tmp/projection.txt
            echo '--- integration tail ---'
            tail -n 100 /tmp/integration.txt
          } > pr7036-projection-result.txt
          if [ "$RC1" -ne 0 ] || [ "$RC2" -ne 0 ]; then exit 1; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin feat/analysis-roadmap-v8-current-main-20260907 --quiet
          if [ "$(git rev-parse origin/feat/analysis-roadmap-v8-current-main-20260907)" != "$BASE_HEAD" ]; then
            echo 'branch moved during focused acceptance' >> pr7036-projection-result.txt
            exit 2
          fi
          rm .github/workflows/pr7036-projection-ir-binding-fix.yml
          git add js/decompiler/pipeline.js tests/phase8/substrate/proof-projection-origin.test.mjs .github/workflows/pr7036-projection-ir-binding-fix.yml
          git commit -m 'fix(decompiler): bind proof projection to canonical producer IR'
          git push origin HEAD:feat/analysis-roadmap-v8-current-main-20260907
      - name: Upload focused result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7036-projection-ir-binding-result-v2
          path: pr7036-projection-result.txt
          if-no-files-found: ignore
          retention-days: 2
