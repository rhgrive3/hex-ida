name: One-shot pointsto strict boundaries 3018 3020
on:
  push:
    branches: [fix/pointsto-strict-boundaries-3018-3020]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused repairs
        run: python3 tools/one-shot-pointsto-3018-3020.py
      - name: Focused validation
        run: |
          set -euo pipefail
          node --test tests/phase7/pointsto/strict-boundaries.test.mjs
          git diff --check
      - name: Commit clean production tree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tools/one-shot-pointsto-3018-3020.py .github/workflows/one-shot-pointsto-3018-3020.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(pointsto): harden exact range and separation authority'
          git push
