name: PR7097 universal diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  universal-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/development-gate-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: capability-maturity
        run: node tests/capability-maturity.mjs
      - name: elf-relocation-budget
        run: node tests/issue-495-elf-relocation-budget.mjs
      - name: elf-symbol-budget
        run: node tests/issue-513-elf-symbol-budget.mjs
      - name: bytesource-contract
        run: node tests/bytesource-contract.mjs
      - name: issue-970-virtual-read-span
        run: node tests/issue-970-virtual-read-span.mjs
      - name: issues-461-463-binary
        run: node tests/issues-461-463-binary.mjs
      - name: universal-binary
        run: node tests/universal-binary.mjs
      - name: universal-binary-sectionless
        run: node tests/universal-binary-sectionless.mjs
      - name: universal-binary-source
        run: node tests/universal-binary-source.mjs
      - name: issue-5889-5832-lazy-bind-opcode-and-ordinal
        run: node tests/issue-5889-5832-lazy-bind-opcode-and-ordinal.mjs
      - name: issue-5896-loader-bounded-probe
        run: node tests/issue-5896-loader-bounded-probe.mjs
      - name: issue-6129-fat-table-bounded-read
        run: node tests/issue-6129-fat-table-bounded-read.mjs
      - name: binary-platform
        run: node tests/binary-platform.mjs
      - name: issue-6159-fingerprint-short-read
        run: node tests/issue-6159-fingerprint-short-read-fail-closed.mjs
      - name: issue-6230-audit-owner-resolution
        run: node tests/issue-6230-audit-executable-owner-resolution.mjs
      - name: issue-6234-fingerprint-uncovered-segments
        run: node tests/issue-6234-fingerprint-uncovered-segments.mjs
      - name: binary-gate
        run: node tests/universal-binary-gate.mjs
