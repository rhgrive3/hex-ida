name: tmp-review-8893-r2

on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-02

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair
        run: |
          set -euo pipefail
          test "$(git hash-object js/analysis/debug/dwarf.js)" = "fe4457e169efffcf3283a192813571cb07410bfc"
          test "$(git hash-object tests/phase7/debug/issue-8733-dwarf-strp-alias-budget.test.mjs)" = "a80cf476ffaa054d191a9fbd42c5702aee73c2ef"
          node .github/tmp-review-8893-r2.mjs
      - name: Verify
        run: |
          set -euo pipefail
          timeout 20s node --check js/analysis/debug/dwarf.js
          timeout 90s node --test tests/phase7/debug/issue-8733-dwarf-strp-alias-budget.test.mjs
          timeout 60s node tests/check.mjs
          echo '### #8893 R2: focused regressions and syntax PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          set -euo pipefail
          rm .github/tmp-review-8893-r2.mjs .github/workflows/tmp-review-8893-r2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(review): reserve DWARF string output before decode'
          git push origin HEAD:codex/issue-campaign-20260914-lane-02
