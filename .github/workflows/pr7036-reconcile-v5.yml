name: PR7036 live-main reconcile v5d
on:
  push:
    branches:
      - sync/pr7036-main-20260917-v5
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1000
      - name: Reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          BASE=012cacc48ec2cd9bde8a5b8a98b77f4a89f9a736
          MAIN=f9806dc4653df9163e278dae1336407d8a87b6d6
          git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1
          git fetch --no-tags --depth=1000 origin "$MAIN" >/dev/null 2>&1
          git merge --no-commit --no-ff "$MAIN" >/dev/null 2>&1 || true
          git diff --name-only --diff-filter=U | sed '/^$/d' | sort > /tmp/conflicts.txt
          : > /tmp/result.txt
          echo "conflict_count=$(wc -l < /tmp/conflicts.txt | tr -d ' ')" >> /tmp/result.txt
          cat /tmp/conflicts.txt | sed 's/^/conflict /' >> /tmp/result.txt
          for f in js/analysis/discovery/artifact.js js/analysis/discovery/producers.js js/analysis/index.js js/rebuild/transaction-v2.js tests/issue-4135-pe-section-virtual-layout.mjs; do
            grep -Fx "$f" /tmp/conflicts.txt >/dev/null
            git checkout --theirs -- "$f"
            git add -- "$f"
            echo "resolved-main $f" >> /tmp/result.txt
          done
          # macho-core auto-merged two independent LC_CODE_SIGNATURE implementations.
          # Keep current-main's newer signature authority and reapply only #7036's
          # unique LC_BUILD_VERSION tool provenance extension.
          git checkout "$MAIN" -- js/binary/macho-core.js
          python - <<'PY'
          from pathlib import Path
          p = Path('js/binary/macho-core.js')
          s = p.read_text()
          old_call = "      else if (cmd === LC_BUILD_VERSION && cmdsize >= 24) parseBuildVersion(r, p, cmdsize, image);"
          new_call = """      else if (cmd === LC_BUILD_VERSION) {
                if (cmdsize < 24) throw new Error(`invalid LC_BUILD_VERSION size ${cmdsize}`);
                parseBuildVersion(r, p, cmdsize, image, metadataBudget);
              }"""
          if s.count(old_call) != 1:
              raise SystemExit(f'build-version-call-match={s.count(old_call)}')
          s = s.replace(old_call, new_call)
          old_fn = """function parseBuildVersion(r, p, cmdsize, image) {
            const ntools = r.u32(p + 20);
            const required = 24 + ntools * 8;
            if (!Number.isSafeInteger(required) || required > cmdsize) {
              throw new Error(`invalid LC_BUILD_VERSION ntools ${ntools}; requires at least ${required} bytes, got ${cmdsize}`);
            }
            const platform = r.u32(p + 8);
            const minos = r.u32(p + 12);
            const sdk = r.u32(p + 16);
            image.metadata.buildVersion = { platform, platformName: platformName(platform), minos: version32(minos), sdk: version32(sdk), source: 'LC_BUILD_VERSION' };
            image.platform = platformName(platform) || image.platform;
          }"""
          new_fn = """function parseBuildVersion(r, p, cmdsize, image, budget) {
            const ntools = r.u32(p + 20);
            const required = 24 + ntools * 8;
            if (!Number.isSafeInteger(required) || required > cmdsize) {
              throw new Error(`invalid LC_BUILD_VERSION ntools ${ntools}; requires at least ${required} bytes, got ${cmdsize}`);
            }
            const platform = r.u32(p + 8);
            const minos = r.u32(p + 12);
            const sdk = r.u32(p + 16);
            const tools = [];
            for (let i = 0; i < ntools; i++) {
              if (!budget.take({ records: 1, objects: 1, operations: 2, estimatedHeapBytes: 128 }, 'build-tool-version')) break;
              const q = p + 24 + i * 8, rawVersion = r.u32(q + 4);
              tools.push({ tool: r.u32(q), version: version32(rawVersion), rawVersion });
            }
            image.metadata.buildVersion = {
              platform, platformName: platformName(platform), minos: version32(minos), sdk: version32(sdk), source: 'LC_BUILD_VERSION',
              ntools, tools, toolsComplete: tools.length === ntools, provenanceVerified: false,
            };
            image.platform = platformName(platform) || image.platform;
          }"""
          if s.count(old_fn) != 1:
              raise SystemExit(f'build-version-fn-match={s.count(old_fn)}')
          s = s.replace(old_fn, new_fn)
          p.write_text(s)
          PY
          git add js/binary/macho-core.js
          echo "resolved-composed js/binary/macho-core.js" >> /tmp/result.txt
          unresolved=$(git diff --name-only --diff-filter=U | sed '/^$/d' | wc -l | tr -d ' ')
          echo "unresolved=$unresolved" >> /tmp/result.txt
          test "$unresolved" = 0
      - name: Focused acceptance
        shell: bash
        run: |
          set -euo pipefail
          for f in js/analysis/discovery/artifact.js js/analysis/discovery/producers.js js/analysis/index.js js/rebuild/transaction-v2.js js/binary/macho-core.js; do
            node --check "$f" >/tmp/one.txt 2>&1 || { echo "syntax FAIL $f" >> /tmp/result.txt; head -n 40 /tmp/one.txt >> /tmp/result.txt; exit 1; }
            echo "syntax PASS $f" >> /tmp/result.txt
          done
          run_one() {
            name="$1"; file="$2"
            set +e
            node --test "$file" >/tmp/one.txt 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then echo "PASS $name" >> /tmp/result.txt; return 0; fi
            echo "FAIL $name" >> /tmp/result.txt
            head -n 60 /tmp/one.txt >> /tmp/result.txt
            return "$rc"
          }
          run_one x03-artifact tests/phase7/discovery/x03-ambiguity-artifact.test.mjs
          run_one x03-rebuild tests/stage2/x03-rebuild-discovery-acceptance.test.mjs
          run_one t016-discovery tests/phase7/discovery/t016-discovery-preservation.test.mjs
          run_one t016-rebuild tests/rebuild/t016-discovery-preservation.test.mjs
          run_one pe4135 tests/issue-4135-pe-section-virtual-layout.mjs
          run_one apple-signature tests/apple-code-signature-source-budget.test.mjs
          run_one x02-a08 tests/scpa/x02-prior120-apple-version-matrix.test.mjs
          run_one proof-projection tests/phase8/substrate/proof-projection-origin.test.mjs
          run_one proof-optimizer tests/phase8/integration/proof-optimizer.test.mjs
      - name: Produce clean merge object
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/pr7036-reconcile-v5.yml >/dev/null
          git add -A
          tree=$(git write-tree)
          git commit -m "merge: reconcile PR 7036 with main f9806dc4" >/dev/null
          commit=$(git rev-parse HEAD)
          echo "tree=$tree" >> /tmp/result.txt
          echo "local_commit=$commit" >> /tmp/result.txt
          set +e
          git push origin HEAD:refs/heads/sync/pr7036-main-20260917-v5-result >/tmp/push.out 2>/tmp/push.err
          push_rc=$?
          set -e
          echo "push_rc=$push_rc" >> /tmp/result.txt
          if [ "$push_rc" -ne 0 ]; then tail -n 12 /tmp/push.err >> /tmp/result.txt; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7036-v5d-result
          path: /tmp/result.txt
          if-no-files-found: ignore
          retention-days: 2
