name: Temporary unlinked final repair
on:
  push:
    branches: [dev-agent-hardening/integration/unlinked-final-20260831]
    paths: [tools/tmp-unlinked-final-repair.py]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-agent-hardening/integration/unlinked-final-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 tools/tmp-unlinked-final-repair.py
      - name: Focused validation
        run: |
          node tests/unlinked-final-strict-evidence-macho.mjs
          node tests/machine-effects/arm64-memory-register-identity.test.mjs
          node tests/machine-effects/arm64-int-arithmetic.test.mjs
          node tests/phase4/integration/issues-2502-2522-demand-analysis.test.mjs
          node tests/universal-binary-source.mjs
          node tests/ui/integration-hardening.mjs
          npm run ui:test
      - name: Commit repair and remove temporary runner
        run: |
          rm -f .github/workflows/tmp-unlinked-final-repair.yml tools/tmp-unlinked-final-repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: close strict evidence and Mach-O gaps'
          git push origin HEAD:dev-agent-hardening/integration/unlinked-final-20260831
