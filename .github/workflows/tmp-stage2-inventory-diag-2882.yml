name: tmp stage2 inventory diag 2882
on:
  push:
    branches:
      - fix/2588-restack-final
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture exact Stage2 profile inventory drift
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/stage2-diag
          set +e
          node tests/stage2/profile-denominator-inventory.test.mjs > /tmp/stage2-diag/test.stdout 2> /tmp/stage2-diag/test.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/stage2-diag/test.rc
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildStage2ProfileDenominatorInventory } from './tools/validation/stage2/build-profile-denominator-inventory.mjs';
          import { STAGE2_PROFILE_EVIDENCE_IDS } from './js/platform/stage2-profile-evidence.js';
          const tracked = JSON.parse(fs.readFileSync('./tools/validation/stage2/profile-denominator-inventory.json', 'utf8'));
          const generated = buildStage2ProfileDenominatorInventory();
          fs.writeFileSync('/tmp/stage2-diag/tracked.json', JSON.stringify(tracked, null, 2) + '\n');
          fs.writeFileSync('/tmp/stage2-diag/generated.json', JSON.stringify(generated, null, 2) + '\n');
          const lines = [];
          lines.push(`TRACKED_IDS=${JSON.stringify(Object.keys(tracked.items || {}).sort())}`);
          lines.push(`GENERATED_IDS=${JSON.stringify(Object.keys(generated.items || {}).sort())}`);
          lines.push(`CONTRACT_IDS=${JSON.stringify([...STAGE2_PROFILE_EVIDENCE_IDS].sort())}`);
          lines.push(`TOPLEVEL_EQUAL=${JSON.stringify(tracked) === JSON.stringify(generated)}`);
          const keys = [...new Set([...Object.keys(tracked.items || {}), ...Object.keys(generated.items || {})])].sort();
          for (const id of keys) {
            const a = JSON.stringify(tracked.items?.[id]);
            const b = JSON.stringify(generated.items?.[id]);
            if (a !== b) {
              lines.push(`DIFF_ITEM=${id}`);
              lines.push(`TRACKED=${a}`);
              lines.push(`GENERATED=${b}`);
            }
          }
          fs.writeFileSync('/tmp/stage2-diag/diff.txt', lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE
      - name: Upload Stage2 diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-inventory-diag-2882
          path: /tmp/stage2-diag
          if-no-files-found: error
