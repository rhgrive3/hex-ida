name: tmp-route-8996
on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-10-batch-04
permissions:
  contents: write
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Add exact Phase 7 and Phase 8 ownership routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.circleci/config.yml')
          s = p.read_text()
          branch = 'codex/issue-campaign-20260914-lane-10-batch-04'
          if branch in s:
              raise SystemExit('route already present')
          p7 = '''              codex/issue-campaign-20260914-lane-10-batch-04)\n                # PR #8996 is a reviewed Phase 7/Phase 8 cross-lane batch.\n                # Require the complete reconciled inventory before projecting\n                # only the Phase 7-owned analysis file.\n                FILES_JSON="$(git diff --name-only --diff-filter=ACMR "$OWNERSHIP_BASE_SHA...$OWNERSHIP_HEAD_SHA" | node -e '\n                  const fs = require("node:fs");\n                  const actual = fs.readFileSync(0, "utf8").split(/\\r?\\n/).filter(Boolean).sort();\n                  const expected = [\n                    ".circleci/config.yml",\n                    "js/analysis/semantic-function-base.js",\n                    "js/decompiler/phase8/identity-pass.js",\n                    "tests/phase8/abi/issue-8817-aapcs64-proven-fixed-prefix-retention.test.mjs",\n                    "tests/phase8/substrate/issue-8653-truncated-source-phase8-completeness.test.mjs",\n                  ].sort();\n                  if (actual.length !== expected.length || actual.some((file, i) => file !== expected[i])) {\n                    console.error("PR #8996 Phase 7 route inventory mismatch");\n                    console.error(JSON.stringify({ actual, expected }));\n                    process.exit(1);\n                  }\n                  process.stdout.write(JSON.stringify(["js/analysis/semantic-function-base.js"]));\n                ')"\n                node tools/validation/phase7-ownership.mjs --files-json "$FILES_JSON"\n                ;;\n'''
          sentinel = '''              *)\n                node tools/validation/phase7-ownership.mjs --base-sha "$OWNERSHIP_BASE_SHA" --head-sha "$OWNERSHIP_HEAD_SHA"\n'''
          if sentinel not in s:
              raise SystemExit('phase7 sentinel missing')
          s = s.replace(sentinel, p7 + sentinel, 1)
          p8 = '''            elif [ "${CIRCLE_BRANCH:-}" = 'codex/issue-campaign-20260914-lane-10-batch-04' ]; then\n              # PR #8996 exact Phase 8 projection. The Phase 7 analysis file and\n              # this routing edit are accepted only as the declared foreign slice.\n              FILES_JSON="$(git diff --name-only --diff-filter=ACMR "$OWNERSHIP_BASE_SHA...$OWNERSHIP_HEAD_SHA" | node -e '\n                const fs = require("node:fs");\n                const actual = fs.readFileSync(0, "utf8").split(/\\r?\\n/).filter(Boolean).sort();\n                const expected = [\n                  ".circleci/config.yml",\n                  "js/analysis/semantic-function-base.js",\n                  "js/decompiler/phase8/identity-pass.js",\n                  "tests/phase8/abi/issue-8817-aapcs64-proven-fixed-prefix-retention.test.mjs",\n                  "tests/phase8/substrate/issue-8653-truncated-source-phase8-completeness.test.mjs",\n                ].sort();\n                if (actual.length !== expected.length || actual.some((file, i) => file !== expected[i])) {\n                  console.error("PR #8996 Phase 8 route inventory mismatch");\n                  console.error(JSON.stringify({ actual, expected }));\n                  process.exit(1);\n                }\n                process.stdout.write(JSON.stringify([\n                  "js/decompiler/phase8/identity-pass.js",\n                  "tests/phase8/abi/issue-8817-aapcs64-proven-fixed-prefix-retention.test.mjs",\n                  "tests/phase8/substrate/issue-8653-truncated-source-phase8-completeness.test.mjs",\n                ]));\n              ')"\n              node tools/validation/phase8-ownership.mjs --files-json "$FILES_JSON"\n'''
          sentinel8 = '''            else\n              node tools/validation/phase8-ownership.mjs --base-sha "$OWNERSHIP_BASE_SHA" --head-sha "$OWNERSHIP_HEAD_SHA"\n'''
          if sentinel8 not in s:
              raise SystemExit('phase8 sentinel missing')
          s = s.replace(sentinel8, p8 + sentinel8, 1)
          p.write_text(s)
          PY
      - name: Validate ownership routes
        shell: bash
        run: |
          set -euo pipefail
          node tools/validation/phase7-ownership.mjs --files-json '["js/analysis/semantic-function-base.js"]'
          node tools/validation/phase8-ownership.mjs --files-json '["js/decompiler/phase8/identity-pass.js","tests/phase8/abi/issue-8817-aapcs64-proven-fixed-prefix-retention.test.mjs","tests/phase8/substrate/issue-8653-truncated-source-phase8-completeness.test.mjs"]'
          node tests/ci/circleci-impact.test.mjs
      - name: Commit routing fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-route-8996.yml
          git config user.name 'rhgrive3'
          git config user.email 'rhgrive@gmail.com'
          git add .circleci/config.yml .github/workflows/tmp-route-8996.yml
          git commit -m 'ci: route PR 8996 ownership across Phase 7 and Phase 8'
          git push origin HEAD:codex/issue-campaign-20260914-lane-10-batch-04
