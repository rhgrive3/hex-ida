name: issue-2541-ci-prereq

on:
  push:
    branches:
      - fix/2541-address-owned-analysis

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .github/issue-2541-ci-prereq.py
      - run: node --check js/ai/ui/local-engine-base.js
      - run: npm install --no-save --save-exact playwright@1.55.0
      - run: npx --no-install playwright install chromium
      - run: node tests/ai-ui-fallback.mjs
      - run: |
          rm .github/workflows/issue-2541-ci-prereq.yml .github/issue-2541-ci-prereq.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ai): restore offline agent anchor progress"
          git push origin HEAD:fix/2541-address-owned-analysis
