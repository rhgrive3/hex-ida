name: One-shot issue 2891 semantic SSA budget
on:
  push:
    branches: [fix/2891-semantic-ssa-budget-types]
    paths: [.github/workflows/one-shot-2891.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2891-semantic-ssa-budget-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply repair
        run: python3 tools/tmp-2891.py
      - name: Focused regression
        run: |
          node tests/semantic-ssa-budget-strict.mjs
          npm run semantic-v2:test
      - name: Syntax check
        run: |
          node --check js/semantics/ssa/contract.js
          node --check js/semantics/ssa/validate.js
      - name: Commit repair
        shell: bash
        run: |
          rm -f tools/tmp-2891.py .github/workflows/one-shot-2891.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(ssa): reject coerced resource budgets (#2891)'
          git push origin HEAD:fix/2891-semantic-ssa-budget-types
