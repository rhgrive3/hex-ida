name: Fixer6 7502 reconcile verification

on:
  push:
    branches:
      - fix/issue-4513-memoryssa-provider-authority-luna

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact proof authority on current main
        shell: bash
        run: |
          set -euo pipefail
          node --check js/semantics/memoryssa/build.js
          node --check js/semantics/memoryssa/proof-core.js
          node --check js/semantics/memoryssa/proof.js
          TERM=xterm timeout 90s node --test \
            tests/semantic-v2/issue-4513-memoryssa-access-provider-authority.test.mjs \
            tests/semantic-v2/issue-4513-memoryssa-access-provider-completeness.test.mjs \
            tests/semantic-v2/memoryssa-core.test.mjs \
            tests/semantic-v2/contract-ssa-memoryssa.test.mjs \
            tests/semantic-v2/issue-c2-01-byte-exact-forwarding.test.mjs \
            tests/semantic-v2/integration-memory.test.mjs \
            tests/phase7/issue-4072-analysis-surface-memoryssa-binding.test.mjs
          test "$(git hash-object js/semantics/memoryssa/build.js)" = "3359be16460eb8b48f2a829f51e5bf3bb1082270"
          test "$(git hash-object js/semantics/memoryssa/proof-core.js)" = "27bf831d96bef270192363123de5772a919b8ab8"
          test "$(git hash-object js/semantics/memoryssa/proof.js)" = "68b6db8436d41d5d0d8b15f34d02c46db001c71a"
          test "$(git hash-object tests/semantic-v2/issue-4513-memoryssa-access-provider-authority.test.mjs)" = "8feb62bf320e51cb928ff0b21f7578b7ae60f08c"
          test "$(git hash-object tests/semantic-v2/issue-4513-memoryssa-access-provider-completeness.test.mjs)" = "1614154a157ca57919b57b193e028235e6ea6eab"
          rm .github/workflows/fixer6-7502-reconcile-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record #7502 current-main verification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
