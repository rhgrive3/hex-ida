name: One-shot issue 2378 repair

on:
  push:
    branches:
      - fix/2378-swift-witness-autoproject

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2378-swift-witness-autoproject
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded repair
        run: python3 tools/tmp-issue-2378.py
      - name: Validate focused regression
        run: |
          node --check js/swift.js
          node tests/issue-2378-swift-witness-autoproject.mjs
          git diff --check
      - name: Publish repaired branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-issue-2378.yml tools/tmp-issue-2378.py
          git add js/swift.js tests/issue-2378-swift-witness-autoproject.mjs
          git commit -m 'fix(swift): project proof-safe witness tables from conformances'
          git push origin HEAD:fix/2378-swift-witness-autoproject
