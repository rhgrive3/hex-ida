name: fixer2-4090-one-shot

on:
  push:
    branches:
      - fix/issue-4090-pt-load-alignment-fixer2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact production patch and self-remove
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/elf-core.js)" = "9647068c1701d8a8dcf63fe16656375b3ac9fd12"
          python -c "import os,base64,pathlib; p=pathlib.Path('js/binary/elf-core.js'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); assert s.count(old)==1; p.write_text(s.replace(old,new))"
          test "$(git hash-object js/binary/elf-core.js)" = "b24b32440abb8a245a7de149fa987c327b491178"
          node --check js/binary/elf-core.js
          rm .github/workflows/fixer2-4090-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/elf-core.js .github/workflows/fixer2-4090-one-shot.yml
          git commit -m "fix(elf): validate PT_LOAD alignment contract (#4090)"
          git push origin HEAD:fix/issue-4090-pt-load-alignment-fixer2
