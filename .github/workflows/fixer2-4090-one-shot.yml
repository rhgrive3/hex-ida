name: fixer2-4090-one-shot

on:
  push:
    branches:
      - fix/issue-4090-pt-load-alignment-fixer2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact production patch and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/elf-core.js)" = "9647068c1701d8a8dcf63fe16656375b3ac9fd12"
          python - <<'PY'
          from pathlib import Path
          path = Path('js/binary/elf-core.js')
          text = path.read_text()
          old = """      const invalidRange = ph.offset > fileLength || ph.filesz > fileLength - ph.offset;
      if (invalidSize || invalidRange) {
        image.warnings.push(`invalid ELF PT_LOAD ${i}: ${invalidSize ? 'p_filesz > p_memsz' : 'file range exceeds input'}`);
        continue;
      }
"""
          new = """      const invalidRange = ph.offset > fileLength || ph.filesz > fileLength - ph.offset;
      const invalidAlignPower = ph.align > 1n && (ph.align & (ph.align - 1n)) !== 0n;
      const invalidAlignCongruence = ph.align > 1n && !invalidAlignPower && (ph.vaddr % ph.align) !== (ph.offset % ph.align);
      if (invalidSize || invalidRange || invalidAlignPower || invalidAlignCongruence) {
        const reason = invalidSize ? 'p_filesz > p_memsz'
          : invalidRange ? 'file range exceeds input'
            : invalidAlignPower ? 'p_align is not a power of two'
              : 'p_vaddr/p_offset are not congruent modulo p_align';
        image.warnings.push(`invalid ELF PT_LOAD ${i}: ${reason}`);
        continue;
      }
"""
          assert text.count(old) == 1, 'expected PT_LOAD guard baseline not found exactly once'
          path.write_text(text.replace(old, new))
          PY
          test "$(git hash-object js/binary/elf-core.js)" = "b24b32440abb8a245a7de149fa987c327b491178"
          node --check js/binary/elf-core.js
          rm .github/workflows/fixer2-4090-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/elf-core.js .github/workflows/fixer2-4090-one-shot.yml
          git commit -m "fix(elf): validate PT_LOAD alignment contract (#4090)"
          git push origin HEAD:fix/issue-4090-pt-load-alignment-fixer2
