name: fixer2-4090-one-shot

on:
  push:
    branches:
      - fix/issue-4090-pt-load-alignment-fixer2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify baseline, apply exact patch, test, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/elf-core.js)" = "9647068c1701d8a8dcf63fe16656375b3ac9fd12"
          test "$(git hash-object tests/phase4/binary/issue-7610-elf-ptload-overlap.test.mjs)" = "2021b696eb7e404c211bab013c4f77ba5612589b"
          test "$(git hash-object tests/phase4/binary/issue-5888-elf-section-file-span-mapping.test.mjs)" = "86f76615341737d57872d1723bc9a887ef70882a"
          test "$(git hash-object tests/phase4/binary/issue-4472-elf-xindex-entsize.test.mjs)" = "cd588bda93045c740362653264c85d5215ca2070"
          test "$(git hash-object tests/phase4/binary/issue-5584-elf-signal-dynamic.test.mjs)" = "e77e89dc31d17f11c2e112f8fa3eec5c9216d387"
          test ! -e tests/phase4/binary/issue-4090-elf-ptload-alignment.test.mjs
          cat > /tmp/fix.patch.b64 <<'PATCH64'
          
          PATCH64
          base64 -d /tmp/fix.patch.b64 > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          test "$(git hash-object js/binary/elf-core.js)" = "b24b32440abb8a245a7de149fa987c327b491178"
          test "$(git hash-object tests/phase4/binary/issue-4090-elf-ptload-alignment.test.mjs)" = "b5aa1cc863c851176d19785764162c1aa4f9e721"
          test "$(git hash-object tests/phase4/binary/issue-7610-elf-ptload-overlap.test.mjs)" = "270b3c9918008e6861415457e7b3ce89b521e164"
          test "$(git hash-object tests/phase4/binary/issue-5888-elf-section-file-span-mapping.test.mjs)" = "77b672ae8dab7d6b9125fddb517d5705e57fc9dc"
          test "$(git hash-object tests/phase4/binary/issue-4472-elf-xindex-entsize.test.mjs)" = "adc03136140c22d4e2635a45fb7ada39f6792386"
          test "$(git hash-object tests/phase4/binary/issue-5584-elf-signal-dynamic.test.mjs)" = "72d923b46bbac2397190cbb5429906852c6c6285"
          node --check js/binary/elf-core.js
          node --test tests/phase4/binary/issue-4090-elf-ptload-alignment.test.mjs tests/phase4/binary/issue-7610-elf-ptload-overlap.test.mjs tests/phase4/binary/issue-5888-elf-section-file-span-mapping.test.mjs tests/phase4/binary/issue-4472-elf-xindex-entsize.test.mjs
          rm .github/workflows/fixer2-4090-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/elf-core.js tests/phase4/binary/issue-4090-elf-ptload-alignment.test.mjs tests/phase4/binary/issue-7610-elf-ptload-overlap.test.mjs tests/phase4/binary/issue-5888-elf-section-file-span-mapping.test.mjs tests/phase4/binary/issue-4472-elf-xindex-entsize.test.mjs tests/phase4/binary/issue-5584-elf-signal-dynamic.test.mjs .github/workflows/fixer2-4090-one-shot.yml
          git commit -m "fix(elf): validate PT_LOAD alignment contract (#4090)"
          git push origin HEAD:fix/issue-4090-pt-load-alignment-fixer2
