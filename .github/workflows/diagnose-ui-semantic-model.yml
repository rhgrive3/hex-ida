name: Diagnose UI semantic model
on:
  push:
    branches: [integration/all-open-prs-20260829]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-save --save-exact playwright@1.55.0
      - run: npx --no-install playwright install chromium
      - name: Dump function-bound evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { openApp, serve } from './tests/ai-ui-support.mjs';
          const server = await serve();
          global.__hexBaseUrl = `http://127.0.0.1:${server.address().port}/index.html`;
          const browser = await chromium.launch({ headless:true, args:['--no-sandbox'] });
          try {
            const { context, page } = await openApp(browser, { width:1440, height:900, sample:true });
            const state = await page.evaluate(async () => {
              const app = window.__app;
              if (app.symbolsReady) { try { await app.symbolsReady; } catch {} }
              await app.ensureFunctions(app.codeRegion());
              const sym = app.symbols;
              const region = app.codeRegion();
              const list = sym?.functionList?.(region, 12) || [];
              const rows = list.map((entry) => ({
                addr: '0x' + entry.addr.toString(16),
                size: entry.size == null ? null : '0x' + entry.size.toString(16),
                evidence: sym.functionEvidence?.(entry.addr) || null,
                exactStart: sym.isFunctionStart?.(entry.addr) === true,
              }));
              return {
                region: { start:'0x'+region.vmAddr.toString(16), end:'0x'+(region.vmAddr+region.size).toString(16) },
                allSeedsExact: sym.allSeedsExact,
                functionStartsComplete: sym.functionStartsComplete,
                functionStartsExact: sym.functionStartsExact,
                rows,
              };
            });
            console.log('BOUND_DIAG=' + JSON.stringify(state, (_k,v)=>typeof v==='bigint'?'0x'+v.toString(16):v));
            await context.close();
          } finally {
            await browser.close();
            await new Promise((resolve) => server.close(resolve));
          }
          NODE
