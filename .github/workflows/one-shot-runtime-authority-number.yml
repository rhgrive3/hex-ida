name: One-shot runtime authority number boundary
on:
  push:
    branches: [fix/runtime-authority-number-boundary-3003]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-authority-number-boundary-3003
          fetch-depth: 0
      - run: python3 tools/one-shot-runtime-authority-number.py
      - run: node --check js/runtime/authority.js
      - run: node tests/phase10/runtime-authority-strict-number.test.mjs
      - run: node tests/phase10/run.mjs
      - name: Commit clean result
        run: |
          rm .github/workflows/one-shot-runtime-authority-number.yml tools/one-shot-runtime-authority-number.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(runtime): require numeric authority identities"
          git push
