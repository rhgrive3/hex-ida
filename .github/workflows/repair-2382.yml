name: repair-2382
on:
  push:
    branches:
      - fix/2382-swift-completeness
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2382-swift-completeness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal completeness contract repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/swift.js')
          s = path.read_text()

          old_scan = "async function relativePointerSection(read,range,budget,parser){const out=[];if(!range)return out;const count=Math.min(Number(range.size/4n),budget);for(let i=0;i<count;i++){const field=range.addr+BigInt(i*4),b=await exact(read,field,4);if(!b)break;const target=rel(field,i32(b,0));if(target==null)continue;try{const value=await parser(read,target);if(value)out.push(value);}catch{}}return out;}"
          new_scan = "async function relativePointerSection(read,range,budget,parser){const items=[];if(!range)return{items,completeness:{present:false,declared:0,scanned:0,parsed:0,capped:false,unreadableEntries:0,invalidEntries:0,misalignedBytes:0,complete:true}};const size=range.size,misalignedBytes=Number(size%4n),declared=Number(size/4n),count=Math.min(declared,budget);let scanned=0,unreadableEntries=0,invalidEntries=0;for(let i=0;i<count;i++){const field=range.addr+BigInt(i*4),b=await exact(read,field,4);if(!b){unreadableEntries++;break;}scanned++;const target=rel(field,i32(b,0));if(target==null){invalidEntries++;continue;}try{const value=await parser(read,target);if(value)items.push(value);else invalidEntries++;}catch{invalidEntries++;}}const capped=declared>budget,complete=misalignedBytes===0&&!capped&&unreadableEntries===0&&invalidEntries===0&&scanned===declared&&items.length===declared;return{items,completeness:{present:true,declared,scanned,parsed:items.length,capped,unreadableEntries,invalidEntries,misalignedBytes,complete}};}"
          if old_scan not in s:
              raise SystemExit('relativePointerSection source changed')
          s = s.replace(old_scan, new_scan, 1)

          old_build = "export async function buildSwiftMetadataModel(read,sections,opts={}){\n  const budget=normalizeBudget(opts.budget,DEFAULT_BUDGET,100000), typeSec=sectionRange(sections,['__swift5_types']), protoSec=sectionRange(sections,['__swift5_protos']), confSec=sectionRange(sections,['__swift5_proto']);\n  const types=await relativePointerSection(read,typeSec,budget,parseSwiftNominalDescriptor), protocols=await relativePointerSection(read,protoSec,budget,parseSwiftProtocolDescriptor), conformances=await relativePointerSection(read,confSec,budget,(r,a)=>parseSwiftConformanceDescriptor(r,a,opts));\n  for(const t of types)if(t.fieldDescriptor!=null){try{t.fields=await parseSwiftFieldDescriptor(read,t.fieldDescriptor,Math.min(budget,4096));}catch{t.fields=[];}}\n  const vtables=[];for(const v of opts.vtables||[]){const methods=await parseSwiftVTable(read,v.address,v.count,budget),x={...v,methods};vtables.push(x);const owner=types.find((t)=>t.address.toString()===String(v.typeAddress));if(owner){owner.vtable=methods;owner.methods=methods;}}\n  const witnessTables=[];for(const w of opts.witnessTables||[])witnessTables.push({...w,entries:await parseSwiftWitnessTable(read,w.address,w.count,budget,opts)});\n  return{runtime:'swift',types,protocols,conformances,vtables,witnessTables,warnings:[]};\n}"
          new_build = "export async function buildSwiftMetadataModel(read,sections,opts={}){\n  const budget=normalizeBudget(opts.budget,DEFAULT_BUDGET,100000), typeSec=sectionRange(sections,['__swift5_types']), protoSec=sectionRange(sections,['__swift5_protos']), confSec=sectionRange(sections,['__swift5_proto']);\n  const typeScan=await relativePointerSection(read,typeSec,budget,parseSwiftNominalDescriptor), protoScan=await relativePointerSection(read,protoSec,budget,parseSwiftProtocolDescriptor), confScan=await relativePointerSection(read,confSec,budget,(r,a)=>parseSwiftConformanceDescriptor(r,a,opts));\n  const types=typeScan.items,protocols=protoScan.items,conformances=confScan.items;\n  for(const t of types)if(t.fieldDescriptor!=null){try{t.fields=await parseSwiftFieldDescriptor(read,t.fieldDescriptor,Math.min(budget,4096));}catch{t.fields=[];typeScan.completeness.complete=false;typeScan.completeness.invalidEntries++;}}\n  const vtables=[];let vtablesComplete=true;for(const v of opts.vtables||[]){const methods=await parseSwiftVTable(read,v.address,v.count,budget),expected=Math.min(normalizeBudget(v.count,0,100000),budget),x={...v,methods};if(methods.length!==expected||Number(v.count)>budget)vtablesComplete=false;vtables.push(x);const owner=types.find((t)=>t.address.toString()===String(v.typeAddress));if(owner){owner.vtable=methods;owner.methods=methods;}}\n  const witnessTables=[];let witnessTablesComplete=true;for(const w of opts.witnessTables||[]){const entries=await parseSwiftWitnessTable(read,w.address,w.count,budget,opts),expected=Math.min(normalizeBudget(w.count,0,100000),budget);if(entries.length!==expected||Number(w.count)>budget||entries.some((x)=>x.resolved!==true))witnessTablesComplete=false;witnessTables.push({...w,entries});}\n  const completeness={types:typeScan.completeness,protocols:protoScan.completeness,conformances:confScan.completeness,vtables:{complete:vtablesComplete},witnessTables:{complete:witnessTablesComplete}};\n  completeness.complete=Object.values(completeness).every((x)=>x?.complete===true);\n  return{runtime:'swift',types,protocols,conformances,vtables,witnessTables,completeness,complete:completeness.complete,warnings:[]};\n}"
          if old_build not in s:
              raise SystemExit('buildSwiftMetadataModel source changed')
          s = s.replace(old_build, new_build, 1)

          pat = re.compile(r"export function resolveSwiftDispatch\(index,call=\{\}\)\{.*?\n\}\n\nexport function swiftCallingConvention", re.S)
          m = pat.search(s)
          if not m:
              raise SystemExit('resolveSwiftDispatch source changed')
          new_resolve = """export function resolveSwiftDispatch(index,call={}){
  if(!call)return{resolved:null,candidates:[],confidence:0,complete:false};
  if(call.target!=null)return{kind:'direct',resolved:{target:call.target,name:call.name||null},candidates:[],confidence:call.name?0.99:0.9,complete:true};
  if(!index)return{kind:call.kind||'indirect',resolved:null,candidates:[],confidence:0,complete:false};
  const universeComplete=index.model?.complete===true;
  if(call.kind==='vtable'&&call.typeName!=null&&call.slot!=null){const methods=index.vtablesByType.get(call.typeName)||[],m=methods.find((x)=>x.index===Number(call.slot));return m?{kind:'vtable',resolved:m,candidates:[m],confidence:0.9,complete:true}:{kind:'vtable',resolved:null,candidates:[],confidence:0.2,complete:universeComplete};}
  if((call.kind==='witness'||call.kind==='existential')&&call.typeName&&call.protocolName&&call.slot!=null){const conf=index.witnessesByPair.get(`${call.typeName}:${call.protocolName}`),table=(index.model.witnessTables||[]).find((w)=>(conf?.witnessTable!=null&&String(w.address)===conf.witnessTable.toString())||(w.typeName===call.typeName&&w.protocolName===call.protocolName)),entry=table?.entries?.find((x)=>x.index===Number(call.slot));if(entry)return{kind:call.kind,resolved:entry,candidates:[entry],confidence:0.86,conformance:conf||null,complete:true};return{kind:call.kind,resolved:null,candidates:[],confidence:conf?0.55:0.2,conformance:conf||null,complete:universeComplete};}
  return{kind:call.kind||'indirect',resolved:null,candidates:[],confidence:0.15,complete:universeComplete};
}

export function swiftCallingConvention"""
          s = s[:m.start()] + new_resolve + s[m.end():]
          path.write_text(s)

          hits=[]
          for p in Path('js').rglob('*.js'):
              text=p.read_text()
              if "result?.complete !== false &&\n        app.swiftModel?.complete !== false" in text:
                  text=text.replace("result?.complete !== false &&\n        app.swiftModel?.complete !== false", "result?.complete === true &&\n        app.swiftModel?.complete === true")
                  p.write_text(text); hits.append(str(p))
              elif "result?.complete !== false && app.swiftModel?.complete !== false" in text:
                  text=text.replace("result?.complete !== false && app.swiftModel?.complete !== false", "result?.complete === true && app.swiftModel?.complete === true")
                  p.write_text(text); hits.append(str(p))
          if not hits:
              raise SystemExit('AI Swift completeness adapter not found')
          print('patched adapter:', ', '.join(hits))
          PY

          cat > tests/issue-2382-swift-completeness.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { buildSwiftMetadataModel, buildSwiftRuntimeIndex, resolveSwiftDispatch } from '../js/swift.js';

          const BASE=0x1000n;
          function fixture(){
            const mem=new Uint8Array(0x3000);
            const off=(a)=>Number(BigInt(a)-BASE);
            const u32=(a,v)=>{const o=off(a),n=Number(BigInt.asUintN(32,BigInt(v)));mem[o]=n&255;mem[o+1]=(n>>>8)&255;mem[o+2]=(n>>>16)&255;mem[o+3]=(n>>>24)&255;};
            const rel32=(field,target)=>u32(field,BigInt(target)-BigInt(field));
            const str=(a,s)=>{const b=new TextEncoder().encode(s);mem.set(b,off(a));mem[off(a)+b.length]=0;};
            const desc=(a,nameAddr)=>{u32(a,17);u32(a+4n,0);rel32(a+8n,nameAddr);u32(a+12n,0);u32(a+16n,0);u32(a+20n,0);u32(a+24n,0);};
            rel32(0x1000n,0x2000n); rel32(0x1004n,0x2100n);
            desc(0x2000n,0x3000n); desc(0x2100n,0x3010n); str(0x3000n,'First'); str(0x3010n,'LastType');
            const read=async(a,len)=>{const o=off(a);return o<0||o+len>mem.length?null:mem.subarray(o,o+len);};
            return {mem,read,off};
          }
          const sections=(size)=>[{section:'__swift5_types',vmAddr:0x1000n,size:BigInt(size)}];

          {
            const {read}=fixture();
            const model=await buildSwiftMetadataModel(read,sections(4),{budget:20});
            assert.equal(model.types.length,1);
            assert.equal(model.completeness.types.complete,true);
            assert.equal(model.complete,true);
          }
          {
            const {read}=fixture();
            const model=await buildSwiftMetadataModel(read,sections(8),{budget:1});
            assert.equal(model.types.length,1);
            assert.equal(model.completeness.types.capped,true);
            assert.equal(model.completeness.types.complete,false);
            assert.equal(model.complete,false);
            const result=resolveSwiftDispatch(buildSwiftRuntimeIndex(model),{kind:'vtable',typeName:'Missing',slot:0});
            assert.equal(result.resolved,null);
            assert.equal(result.complete,false);
          }
          {
            const f=fixture();
            const read=async(a,len)=>BigInt(a)===0x1004n&&len===4?null:f.read(a,len);
            const model=await buildSwiftMetadataModel(read,sections(8),{budget:20});
            assert.equal(model.completeness.types.unreadableEntries,1);
            assert.equal(model.completeness.types.complete,false);
            assert.equal(model.complete,false);
          }
          {
            const f=fixture();
            f.mem.fill(0,f.off(0x2100n),f.off(0x2100n)+28);
            const model=await buildSwiftMetadataModel(f.read,sections(8),{budget:20});
            assert.equal(model.completeness.types.invalidEntries,1);
            assert.equal(model.completeness.types.complete,false);
            assert.equal(model.complete,false);
          }
          {
            const direct=resolveSwiftDispatch(null,{target:0x1234n,name:'known'});
            assert.equal(direct.complete,true);
          }
          console.log('issue-2382 swift completeness: ok');
          EOF

          node --check js/swift.js
          node tests/issue-2382-swift-completeness.mjs
          git diff --check

          rm .github/workflows/repair-2382.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(swift): preserve metadata completeness status (#2382)'
          git push origin HEAD:fix/2382-swift-completeness
