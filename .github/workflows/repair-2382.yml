name: repair-2382
on:
  push:
    branches:
      - fix/2382-swift-completeness
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2382-swift-completeness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .github/repair-2382.py
      - run: node --check js/swift.js
      - run: node tests/issue-2382-swift-completeness.mjs
      - run: git diff --check
      - name: Commit repair
        run: |
          rm .github/workflows/repair-2382.yml .github/repair-2382.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(swift): preserve metadata completeness status (#2382)'
          git push origin HEAD:fix/2382-swift-completeness
