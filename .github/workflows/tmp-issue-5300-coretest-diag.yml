name: Temporary issue 5300 core:test diagnostic

on:
  push:
    branches:
      - diag/issue-5300-coretest-20260917

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Pre-SCPA core contracts
        shell: bash
        run: |
          set +e
          timeout 180s bash -lc '
            node tests/issue-6168-support-scope.mjs &&
            node tests/issue-6154-confirm-scope.mjs &&
            node tests/issue-4466-missing-contradiction-verdict.test.mjs &&
            node tests/core-identity-contracts.mjs &&
            node tests/issue-1942-determinism-input-ids.mjs &&
            node tests/issue-3786-slice-source-range-type-witness.test.mjs &&
            node tests/issue-4251-core-identity-slice-index.test.mjs &&
            node tests/issue-3915-core-identity-special-numbers.test.mjs &&
            node tests/core-evidence-contracts.mjs &&
            node tests/core-budget-scopes.mjs &&
            node tests/evidence-canonical-roundtrip.mjs &&
            node tests/issue-3590-5780-paged-artifact-dead-inflight.mjs &&
            node tests/issue-5852-shl-fold-range.mjs &&
            node tests/issue-5853-invalid-date-identity.mjs &&
            node tests/issue-5855-cyclic-vector-element-type.mjs
          ' > /tmp/pre-scpa.out 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then tail -n 80 /tmp/pre-scpa.out > /tmp/issue-5300-first-failure.txt; fi
          exit "$code"

      - name: Upload pre-SCPA failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-5300-coretest-first-failure
          path: /tmp/issue-5300-first-failure.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: SCPA contracts
        shell: bash
        run: |
          set +e
          timeout 300s npm run scpa:test > /tmp/scpa.out 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then tail -n 80 /tmp/scpa.out > /tmp/issue-5300-first-failure.txt; fi
          exit "$code"

      - name: Upload SCPA failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-5300-coretest-first-failure
          path: /tmp/issue-5300-first-failure.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Issue 4637 regression
        shell: bash
        run: |
          set +e
          timeout 120s node tests/issue-4637-parse-goal-avoid-preset.mjs > /tmp/issue4637.out 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then tail -n 80 /tmp/issue4637.out > /tmp/issue-5300-first-failure.txt; fi
          exit "$code"

      - name: Upload issue 4637 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-5300-coretest-first-failure
          path: /tmp/issue-5300-first-failure.txt
          if-no-files-found: ignore
          retention-days: 1
