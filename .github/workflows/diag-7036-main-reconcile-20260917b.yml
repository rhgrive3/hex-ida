name: diag-7036-main-reconcile-20260917b
on:
  push:
    branches:
      - diag/7036-main-reconcile-20260917b
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify merge conflicts only
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/diag-7036-main.txt
          : > "$STATUS"
          PR_HEAD=837d0ce34668f65defac5f3517a802f366336158
          timeout 90s git fetch --no-tags origin main "$PR_HEAD" >/tmp/fetch.log 2>&1
          rc=$?
          echo "fetch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/fetch.log >> "$STATUS"; exit "$rc"; fi
          MAIN=$(git rev-parse refs/remotes/origin/main)
          echo "pr_head=$PR_HEAD" >> "$STATUS"
          echo "main=$MAIN" >> "$STATUS"
          git merge-tree --write-tree "$PR_HEAD" "$MAIN" >/tmp/merge-tree.out 2>&1
          rc=$?
          echo "merge_tree rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then
            echo '--- merge-tree summary ---' >> "$STATUS"
            tail -n 80 /tmp/merge-tree.out >> "$STATUS"
            exit "$rc"
          fi
          echo 'merge tree clean' >> "$STATUS"
          sed -n '1,5p' /tmp/merge-tree.out >> "$STATUS"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-main-reconcile-20260917b
          path: /tmp/diag-7036-main.txt
          retention-days: 1
