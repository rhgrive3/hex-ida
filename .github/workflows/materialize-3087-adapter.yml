name: Materialize PR 3087 adapter repair
on:
  push:
    branches:
      - fix/cancellation-races-current-2848-2963-v2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cancellation-races-current-2848-2963-v2
          fetch-depth: 0
      - name: Apply exact adapter fixes and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('js/adapters/index.js')
          s = p.read_text()
          old = "function isRegisterName(reg) { return /^(x([0-9]|[12][0-9]|30)|w([0-9]|[12][0-9]|30)|sp|pc)$/.test(reg); }\nfunction initialMemorySize(value) {"
          new = """function isRegisterName(reg) { return /^(x([0-9]|[12][0-9]|30)|w([0-9]|[12][0-9]|30)|sp|pc)$/.test(reg); }
function breakpointRemovalId(id) {
  const value = id && typeof id === 'object' && !Array.isArray(id) ? id.id : id;
  if (typeof value !== 'string' || !value) throw new DebugAdapterError('invalid-breakpoint', 'breakpoint id must be a non-empty string');
  return value;
}
function registerSelector(reg) {
  if (typeof reg !== 'string' || !isRegisterName(reg)) throw new DebugAdapterError('invalid-register', 'unsupported register selector');
  return reg;
}
function memoryReadSize(size, fallback) {
  const value = size == null ? fallback : size;
  if (typeof value !== 'number' || !Number.isSafeInteger(value) || value < 1) throw new DebugAdapterError('invalid-size','memory read size must be a positive safe integer');
  return value;
}
function initialMemorySize(value) {"""
          assert old in s, 'helper insertion anchor missing'
          s = s.replace(old, new, 1)

          old = """    if (options.signal && !options.signal.aborted) {
      options.signal.addEventListener('abort', onAbort, { once:true });
      if (options.signal.aborted) onAbort();
    }
"""
          new = """    if (options.signal) {
      if (options.signal.aborted) onAbort();
      else {
        options.signal.addEventListener('abort', onAbort, { once:true });
        if (options.signal.aborted) onAbort();
      }
    }
"""
          assert old in s, 'resume abort block missing'
          s = s.replace(old, new, 1)

          replacements = [
            ("const key = typeof id === 'object' ? id.id : String(id); const bp = this.breakpoints.get(key); if (!bp) return false;",
             "const key = breakpointRemovalId(id); const bp = this.breakpoints.get(key); if (!bp) return false;"),
            ("const name = String(reg);\n    if (!isRegisterName(name)) throw new DebugAdapterError('invalid-register', `unsupported register: ${name}`);",
             "const name = registerSelector(reg);"),
            ("const sandbox = this.ensureSandbox(); const epoch = this.epoch; const memoryMap = this.memoryMap; const n = Number(size == null ? 8 : size);\n    if (!Number.isSafeInteger(n) || n < 1) throw new DebugAdapterError('invalid-size','memory read size must be a positive safe integer');",
             "const sandbox = this.ensureSandbox(); const epoch = this.epoch; const memoryMap = this.memoryMap; const n = memoryReadSize(size, 8);"),
            ("removeBreakpoint(id){const key=typeof id==='object'?id.id:id;return this.call('removeBreakpoint',{id:String(key)})}",
             "removeBreakpoint(id){return this.call('removeBreakpoint',{id:breakpointRemovalId(id)})}"),
            ("writeRegister(reg,value,threadId){return this.call('writeRegister',{reg:String(reg),value:String(value),threadId})}",
             "writeRegister(reg,value,threadId){return this.call('writeRegister',{reg:registerSelector(reg),value:String(value),threadId})}"),
            ("async readMemory(address,size){const n=Number(size==null?1:size); if(!Number.isSafeInteger(n)||n<1) throw new DebugAdapterError('invalid-size','memory read size must be a positive safe integer'); if(n>256*1024) throw new DebugAdapterError('too-large','remote memory read exceeds 256 KiB'); return remoteBytes(await this.call('readMemory',{address:String(asAddress(address)),size:n}),n)}",
             "async readMemory(address,size){const n=memoryReadSize(size,1); if(n>256*1024) throw new DebugAdapterError('too-large','remote memory read exceeds 256 KiB'); return remoteBytes(await this.call('readMemory',{address:String(asAddress(address)),size:n}),n)}"),
          ]
          for old, new in replacements:
            assert old in s, f'replacement anchor missing: {old[:50]}'
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          cat > tests/phase10/adapter-strict-boundaries.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { LocalFunctionSandboxAdapter, RemoteDebugAdapter } from '../../js/adapters/index.js';
          function expectCode(error, code) { assert.equal(error?.code, code); return true; }
          const local = new LocalFunctionSandboxAdapter({});
          local.sandbox = { emulator: { dump: async (_address, size) => new Uint8Array(size) } };
          local.memoryMap = { assert() {} };
          for (const bad of ['8', ['8'], true, { valueOf: () => 8 }]) await assert.rejects(local.readMemory(0n, bad), (e) => expectCode(e,'invalid-size'));
          assert.equal((await local.readMemory(0n,8)).length,8);
          assert.equal((await local.readMemory(0n,null)).length,8);
          local.breakpoints.set('1',{id:'1',kind:'address',address:0n,enabled:false});
          await assert.rejects(local.removeBreakpoint(1),(e)=>expectCode(e,'invalid-breakpoint'));
          assert.equal(local.breakpoints.has('1'),true);
          local.sandbox.setRegister=()=>{throw new Error('must not mutate')}; local.sandbox.getRegister=()=>0n;
          await assert.rejects(local.writeRegister(['x0'],1n),(e)=>expectCode(e,'invalid-register'));
          const sent=[];
          const remote=new RemoteDebugAdapter({send:async(packet)=>{sent.push(packet)}},{capabilities:{removeBreakpoint:true,writeRegister:true,readMemory:true},protocol:{timeoutMs:10000}});
          for (const bad of ['16',[16],true,{valueOf:()=>16}]) await assert.rejects(remote.readMemory(0n,bad),(e)=>expectCode(e,'invalid-size'));
          assert.throws(()=>remote.removeBreakpoint(1),(e)=>expectCode(e,'invalid-breakpoint'));
          assert.throws(()=>remote.writeRegister(['x0'],1n),(e)=>expectCode(e,'invalid-register'));
          assert.equal(sent.length,0);
          remote.protocol.close();
          console.log('adapter strict boundaries: ok');
          EOF

          cat > tests/cancellation-races-2848-2962-2963.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { LocalFunctionSandboxAdapter } from '../js/adapters/index.js';
          import { RemoteProtocolClient } from '../js/debug/remote-protocol.js';
          const investigation=fs.readFileSync(new URL('../js/analysis/investigation-service.js',import.meta.url),'utf8');
          assert.ok((investigation.match(/if \(signal\?\.aborted\) onAbort\(\);/g)||[]).length>=3);
          let reads=0;
          const raceSignal={reason:'cancelled-between-checks',get aborted(){reads+=1;return reads>=2},addEventListener(){throw new Error('listener must not be needed')},removeEventListener(){}};
          const local=new LocalFunctionSandboxAdapter({});
          const emu={stopped:null,trace:[],callStack:[],sp:0n,pc:0n,get(){return 0n}};
          local.sandbox={emulator:emu,async run(){assert.equal(emu.stopped,'cancelled');return{trace:[],takenBranches:[],touchedFields:[],before:[],after:[],modifiedObjectRanges:[],steps:0,stopped:'cancelled'}}};
          local.initialRegisters={};
          const localResult=await local.resume({signal:raceSignal});
          assert.equal(localResult.stop.kind,'cancelled');
          const sent=[]; const transport={send:async(packet)=>{sent.push(packet)}}; const client=new RemoteProtocolClient(transport,{timeoutMs:1000});
          let aborted=false;
          const remoteSignal={get aborted(){return aborted},get reason(){return'cancelled-in-registration-window'},addEventListener(type,listener){assert.equal(type,'abort');aborted=true;listener()},removeEventListener(){}};
          await assert.rejects(client.request('readMemory',{}, {signal:remoteSignal}),/cancelled/);
          await Promise.resolve();
          assert.equal(sent.some((p)=>p?.type==='request'),false); assert.equal(client.pending.size,0); client.close();
          console.log('cancellation races 2848/2962/2963: PASS');
          EOF
          rm .github/workflows/materialize-3087-adapter.yml
          node tests/cancellation-races-2848-2962-2963.mjs
          node tests/phase10/adapter-strict-boundaries.test.mjs
          git diff --check
      - name: Commit materialized repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(adapters): close cancellation and strict-boundary gaps'
          git push origin HEAD:fix/cancellation-races-current-2848-2963-v2
