name: One-shot unlinked issue repair

on:
  push:
    branches:
      - fix/unlinked-issues-2377-2388-2393-2478
    paths:
      - .github/workflows/one-shot-unlinked-issues.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-issues-2377-2388-2393-2478
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'anchor not found: {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          # #2377 — automatically project only proof-safe simple Swift class vtables.
          p=Path('js/swift.js'); s=p.read_text()
          anchor="export async function parseSwiftVTable(read,address,count,budget=4096){"
          if anchor not in s: raise SystemExit('swift vtable anchor not found')
          helper=r'''const SWIFT_CLASS_HAS_VTABLE = 1 << 15;
          const SWIFT_CLASS_RESILIENT_SUPERCLASS = 1 << 13;
          async function discoverSwiftClassVTables(read,types,budget){
            const seeds=[],warnings=[];let complete=true;
            for(const type of types||[]){
              if(type?.kind!=='class')continue;
              const specific=(Number(type.flags)>>>16)&0xffff;
              if(!(specific&SWIFT_CLASS_HAS_VTABLE))continue;
              const metadataInit=specific&0x3,resilient=!!(specific&SWIFT_CLASS_RESILIENT_SUPERCLASS);
              if(type.generic||resilient||metadataInit!==0){complete=false;warnings.push(`Swift class ${type.name||type.address}: vtable layout is not proof-safe for automatic projection.`);continue;}
              const headerAddress=BigInt(type.address)+44n,h=await exact(read,headerAddress,8);
              if(!h){complete=false;warnings.push(`Swift class ${type.name||type.address}: vtable header is unreadable.`);continue;}
              const vtableOffset=u32(h,0),count=u32(h,4);
              if(count>4096||count>budget){complete=false;warnings.push(`Swift class ${type.name||type.address}: vtable count exceeds analysis budget.`);continue;}
              if(!count){type.vtable=[];type.methods=[];continue;}
              seeds.push({address:headerAddress+8n,count,vtableOffset,typeAddress:type.address,typeName:type.name,source:'class-descriptor'});
            }
            return{seeds,complete,warnings};
          }

          '''
          s=s.replace(anchor,helper+anchor,1)
          old="  const vtables=[];let vtablesComplete=true;for(const v of opts.vtables||[]){const methods=await parseSwiftVTable(read,v.address,v.count,budget),expected=Math.min(normalizeBudget(v.count,0,100000),budget),x={...v,methods};if(methods.length!==expected||Number(v.count)>budget)vtablesComplete=false;vtables.push(x);const owner=types.find((t)=>t.address.toString()===String(v.typeAddress));if(owner){owner.vtable=methods;owner.methods=methods;}}"
          new="""  const autoVtables=await discoverSwiftClassVTables(read,types,budget);warnings.push(...autoVtables.warnings);
            const vtableSeedMap=new Map();for(const v of autoVtables.seeds)vtableSeedMap.set(`${String(v.typeAddress)}:${String(v.address)}`,v);for(const v of opts.vtables||[])vtableSeedMap.set(`${String(v.typeAddress)}:${String(v.address)}`,v);
            const vtables=[];let vtablesComplete=autoVtables.complete;for(const v of vtableSeedMap.values()){const methods=await parseSwiftVTable(read,v.address,v.count,budget),expected=Math.min(normalizeBudget(v.count,0,100000),budget),x={...v,methods};if(methods.length!==expected||Number(v.count)>budget)vtablesComplete=false;vtables.push(x);const owner=types.find((t)=>t.address.toString()===String(v.typeAddress));if(owner){owner.vtable=methods;owner.methods=methods;}}"""
          if old not in s: raise SystemExit('swift vtable model anchor not found')
          p.write_text(s.replace(old,new,1))

          # #2388 — bounded/range-checked compact-unwind parsing with atomic publication.
          p=Path('js/binary/macho-core.js'); s=p.read_text(); start=s.find('function parseCompactUnwind(')
          if start < 0: raise SystemExit('compact unwind function not found')
          compact=r'''export function parseCompactUnwind(r, image, metadataBudget = null) {
            const sec=image.sections.find((s)=>s.name==='__unwind_info'||s.name==='__TEXT,__unwind_info');
            if(!sec)return;
            const budget=ensureMachOMetadataBudget(image,metadataBudget);let complete=true;
            const partial=(reason)=>{complete=false;budget.partial(`compact-unwind:${reason}`);};
            if(sec.fileOffset==null||sec.fileSize==null||sec.fileSize<28n){partial('section-too-small');return;}
            const fileOff=Number(sec.fileOffset),fileSize=Number(sec.fileSize);
            if(!Number.isSafeInteger(fileOff)||!Number.isSafeInteger(fileSize)||fileOff<0||fileSize<28||fileOff+fileSize>r.length){partial('section-out-of-range');return;}
            if(!budget.take({inputBytes:28,records:1,objects:1,operations:1,estimatedHeapBytes:64},'compact-unwind-header'))return;
            const version=r.u32(fileOff);if(version!==1){partial('unsupported-version');return;}
            const indexOff=r.u32(fileOff+20),indexCount=r.u32(fileOff+24);
            if(indexCount<2||indexOff>fileSize||indexCount>(fileSize-indexOff)/12){partial('index-out-of-range');return;}
            const textSeg=image.segments.find((s)=>s.name==='__TEXT');
            const imageBase=textSeg?textSeg.address:(image.segments[0]?image.segments[0].address:0n);
            const alignment=(image.arch==='arm64'||image.arch==='arm64e'||image.arch==='arm64_32')?4n:image.arch==='arm'?2n:1n;
            const functionAddresses=new Set();
            outer: for(let i=0;i<indexCount-1;i++){
              if(!budget.take({inputBytes:12,records:1,objects:1,operations:1,estimatedHeapBytes:48},'compact-unwind-index')){complete=false;break;}
              const e=fileOff+indexOff+i*12,next=e+12,lower=r.u32(e),upper=r.u32(next),pageOff=r.u32(e+4);
              if(upper<=lower){partial('nonmonotonic-first-level-range');continue;}
              if(!pageOff||pageOff+8>fileSize){partial('page-out-of-range');continue;}
              const pageAbs=fileOff+pageOff,pageBytes=Math.min(4096,fileSize-pageOff),kind=r.u32(pageAbs),entryOff=r.u16(pageAbs+4),count=r.u16(pageAbs+6);
              const stride=kind===2?8:kind===3?4:0;
              if(!stride){partial('unsupported-second-level-kind');continue;}
              if(entryOff<8||entryOff>pageBytes||count>(pageBytes-entryOff)/stride){partial('entry-array-out-of-page');continue;}
              for(let k=0;k<count;k++){
                if(!budget.take({inputBytes:stride,records:1,objects:1,operations:2,estimatedHeapBytes:48},'compact-unwind-entry')){complete=false;break outer;}
                const at=pageAbs+entryOff+k*stride;
                let functionOffset;
                if(kind===2)functionOffset=r.u32(at);
                else functionOffset=lower+(r.u32(at)&0x00ffffff);
                if(functionOffset<lower||functionOffset>=upper){partial('entry-outside-first-level-range');continue;}
                functionAddresses.add(imageBase+BigInt(functionOffset));
              }
            }
            if(!complete)return;
            const sortedAddresses=[...functionAddresses].sort((a,b)=>a<b?-1:a>b?1:0);
            for(const addr of sortedAddresses){const seg=image.segmentAt(addr);if(!seg||seg.perms?.execute!==true||(alignment>1n&&addr%alignment!==0n)){partial('entry-not-executable-or-aligned');break;}}
            if(!complete)return;
            for(let i=0;i<sortedAddresses.length;i++){
              const start=sortedAddresses[i],end=sortedAddresses[i+1]??null,sizeBytes=end!=null?Number(end-start):null;
              image.unwindEntries.push({start,end,sizeBytes,primary:true,source:'compact-unwind'});
              image.functions.push(functionSeed(start,{source:'unwind',confidence:0.95}));
            }
          }
          '''
          p.write_text(s[:start]+compact)

          # #2393 — mark concrete ObjC IMPs with executable/alignment proof and require it in the runtime index.
          replace_once('js/objc-legacy.js',
            "export async function buildObjcModel(read, classList, onProgress, imageBase, pointerFormat) {",
            "export async function buildObjcModel(read, classList, onProgress, imageBase, pointerFormat, options = {}) {")
          replace_once('js/objc-legacy.js',
            "  get.pointerFormat = pointerFormat ?? classList.pointerFormat ?? classList.pointer_format ?? null;\n  const total = Math.min(declared, MAX_CLASSES);",
            "  get.pointerFormat = pointerFormat ?? classList.pointerFormat ?? classList.pointer_format ?? null;\n  get.validateImplementation = typeof options.validateImplementation === 'function' ? options.validateImplementation : null;\n  get.requireImplementationProof = options.requireImplementationProof === true;\n  const total = Math.min(declared, MAX_CLASSES);")
          replace_once('js/objc-legacy.js',
            "    if (imp == null) { markLegacyPartial(completeness, 'method-imp-unresolved', 'incompleteMethodLists'); continue; }\n    const sel = await cstring(get, nameAddr);\n    if (!sel) { markLegacyPartial(completeness, 'method-selector-invalid', 'incompleteMethodLists'); continue; }\n    out.push({\n      addr: imp,\n      name: prefix + '[' + className + ' ' + sel + ']',\n      sel, kind: prefix, className,\n    });",
            """    if (imp == null) { markLegacyPartial(completeness, 'method-imp-unresolved', 'incompleteMethodLists'); continue; }
              let implementationProven=!get.requireImplementationProof,implementationValidationReason=null;
              if(typeof get.validateImplementation==='function'){try{const proof=await get.validateImplementation(imp);implementationProven=proof===true||proof?.ok===true;if(!implementationProven)implementationValidationReason=proof?.reason||'method-imp-not-executable';}catch{implementationProven=false;implementationValidationReason='method-imp-validation-error';}}
              if(get.requireImplementationProof&&!implementationProven)markLegacyPartial(completeness,implementationValidationReason||'method-imp-unproven','incompleteMethodLists');
              const sel = await cstring(get, nameAddr);
              if (!sel) { markLegacyPartial(completeness, 'method-selector-invalid', 'incompleteMethodLists'); continue; }
              out.push({
                addr: imp,
                name: prefix + '[' + className + ' ' + sel + ']',
                sel, kind: prefix, className, implementationProven, implementationValidationReason,
              });""")

          replace_once('js/apple/objc-metadata.js',
            "  get.resolvePointer = opts.resolvePointer || opts.binaryImage?.resolvePointer || opts.binaryImage?.decodePointer || null;\n  const classByAddress",
            "  get.resolvePointer = opts.resolvePointer || opts.binaryImage?.resolvePointer || opts.binaryImage?.decodePointer || null;\n  get.validateImplementation = typeof opts.validateImplementation === 'function' ? opts.validateImplementation : null;\n  get.requireImplementationProof = opts.requireImplementationProof === true;\n  const classByAddress")
          replace_once('js/apple/objc-metadata.js',
            "    const sel = await cstring(get, nameAddr);\n    if (!sel) { invalidEntries++; continue; }\n    items.push({ sel, selector: sel, types: await cstring(get, typeAddr), addr: imp, imp, className: owner || null, classMethod: !!classMethod, source, kind: classMethod ? '+' : '-', name: owner ? `${classMethod ? '+' : '-'}[${owner} ${sel}]` : sel });",
            """    const sel = await cstring(get, nameAddr);
              if (!sel) { invalidEntries++; continue; }
              const concrete=source!=='protocol'&&source!=='protocol-optional';let implementationProven=false,implementationValidationReason=null;
              if(concrete){if(imp!=null&&typeof get.validateImplementation==='function'){try{const proof=await get.validateImplementation(imp);implementationProven=proof===true||proof?.ok===true;if(!implementationProven)implementationValidationReason=proof?.reason||'method-imp-not-executable';}catch{implementationValidationReason='method-imp-validation-error';}}else if(imp!=null&&!get.requireImplementationProof)implementationProven=true;if(get.requireImplementationProof&&!implementationProven)invalidEntries++;}
              items.push({ sel, selector: sel, types: await cstring(get, typeAddr), addr: imp, imp, className: owner || null, classMethod: !!classMethod, source, kind: classMethod ? '+' : '-', name: owner ? `${classMethod ? '+' : '-'}[${owner} ${sel}]` : sel, implementationProven, implementationValidationReason });""")

          p=Path('js/objc.js'); s=p.read_text()
          marker="function categorySymbol(category, method, classMethod) {"
          helper=r'''function createImplementationValidator(runtimeSections={},binaryImage=null){
            const ranges=(runtimeSections.executableRanges||[]).filter((r)=>r?.vmAddr!=null&&r?.size!=null&&r.size>0n);
            const arch=String(runtimeSections.architecture||binaryImage?.arch||'').toLowerCase();
            const alignment=arch.includes('arm64')?4n:(arch==='arm'||arch.startsWith('armv'))?2n:1n;
            return (address)=>{
              if(address==null)return{ok:false,reason:'method-imp-missing'};const a=BigInt(address);let executable=false;
              if(binaryImage&&typeof binaryImage.segmentAt==='function'){try{executable=binaryImage.segmentAt(a)?.perms?.execute===true;}catch{executable=false;}}
              if(!executable)executable=ranges.some((r)=>a>=BigInt(r.vmAddr)&&a<BigInt(r.vmAddr)+BigInt(r.size));
              if(!executable)return{ok:false,reason:'method-imp-not-executable'};
              if(alignment>1n&&a%alignment!==0n)return{ok:false,reason:'method-imp-misaligned'};
              return{ok:true};
            };
          }

          '''
          if marker not in s: raise SystemExit('objc helper anchor not found')
          s=s.replace(marker,helper+marker,1)
          s=s.replace("  if (!method || method.imp == null || !method.selector) return null;","  if (!method || method.imp == null || !method.selector || method.implementationProven !== true) return null;",1)
          old="""  const effectivePointerFormat = pointerFormat ?? classList?.pointerFormat ?? classList?.pointer_format ?? null;
            const base = await buildLegacyObjcModel(read, classList, onProgress, imageBase, effectivePointerFormat);
            const binaryImage = runtimeSections?.binaryImage || null;"""
          new="""  const effectivePointerFormat = pointerFormat ?? classList?.pointerFormat ?? classList?.pointer_format ?? null;
            const binaryImage = runtimeSections?.binaryImage || null;
            const validateImplementation=createImplementationValidator(runtimeSections,binaryImage);
            const base = await buildLegacyObjcModel(read, classList, onProgress, imageBase, effectivePointerFormat, { validateImplementation, requireImplementationProof:true });"""
          if old not in s: raise SystemExit('objc runtime base anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("    classes: base.classes || [],\n    resolvePointer,\n  });","    classes: base.classes || [],\n    resolvePointer, validateImplementation, requireImplementationProof:true,\n  });",1)
          s=s.replace("  const names = (base.names || []).slice();","  const names = (base.names || []).filter((entry)=>entry?.implementationProven===true);",1)
          s=s.replace("    runtime: 'objc',\n  };","    runtime: 'objc',\n    implementationProofRequired:true,\n  };",1)
          p.write_text(s)

          p=Path('js/apple/objc-runtime.js'); s=p.read_text()
          s=s.replace("function normalizeMethod(m, owner, classMethod, source = 'class') {","function normalizeMethod(m, owner, classMethod, source = 'class', proofRequired = false) {",1)
          s=s.replace("    imp: m.addr != null ? m.addr : (m.imp != null ? m.imp : null),","    imp: proofRequired && source !== 'protocol' && source !== 'protocol-optional' && m?.implementationProven !== true ? null : (m.addr != null ? m.addr : (m.imp != null ? m.imp : null)),",1)
          s=s.replace("  const protocols = new Map();","  const protocols = new Map();\n  const proofRequired = objcModel.implementationProofRequired === true;",1)
          for old,new in [
            ("normalizeMethod(m, info.name, false)","normalizeMethod(m, info.name, false, 'class', proofRequired)"),
            ("normalizeMethod(m, info.name, true)","normalizeMethod(m, info.name, true, 'class', proofRequired)"),
            ("normalizeMethod({ ...m, optional: false }, name, false, 'protocol')","normalizeMethod({ ...m, optional: false }, name, false, 'protocol', proofRequired)"),
            ("normalizeMethod({ ...m, optional: false }, name, true, 'protocol')","normalizeMethod({ ...m, optional: false }, name, true, 'protocol', proofRequired)"),
            ("normalizeMethod({ ...m, optional: true }, name, false, 'protocol')","normalizeMethod({ ...m, optional: true }, name, false, 'protocol', proofRequired)"),
            ("normalizeMethod({ ...m, optional: true }, name, true, 'protocol')","normalizeMethod({ ...m, optional: true }, name, true, 'protocol', proofRequired)"),
            ("normalizeMethod(m, targetClass, false, 'category')","normalizeMethod(m, targetClass, false, 'category', proofRequired)"),
            ("normalizeMethod(m, targetClass, true, 'category')","normalizeMethod(m, targetClass, true, 'category', proofRequired)"),
          ]:
              if old not in s: raise SystemExit(f'objc runtime normalize anchor not found: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)

          replace_once('js/app.js',
            "        const model = await buildObjcRuntimeModel(read, list, { protocolList, categoryList }, null, imageBase);",
            "        const executableRanges=regions.filter((r)=>r?.exec===true&&r.size>0n).map((r)=>({vmAddr:r.vmAddr,size:r.size}));\n        const architecture=sl?.name||sl?.info?.arch||sl?.info?.architecture||null;\n        const model = await buildObjcRuntimeModel(read, list, { protocolList, categoryList, executableRanges, architecture }, null, imageBase);")

          # #2478 — prototype recovery consumes the ABI adapter/plugin instead of AAPCS64 constants.
          for path, old, new in [
            ('js/targets/abi/aapcs64-core.js',"stackRules:()=>Object.freeze({ alignment:16, stackGrows:'down', argumentSlotBytes:8, variadicRegisterSaveAreas:true })","stackRules:()=>Object.freeze({ stackPointer:'sp', stackPointerAliases:Object.freeze(['sp']), entryArgumentOffset:0, alignment:16, stackGrows:'down', argumentSlotBytes:8, variadicRegisterSaveAreas:true })"),
            ('js/targets/abi/darwin-arm64.js',"  stackRules:()=>Object.freeze({\n    alignment:16,","  stackRules:()=>Object.freeze({\n    stackPointer:'sp', stackPointerAliases:Object.freeze(['sp']), entryArgumentOffset:0,\n    alignment:16,"),
            ('js/targets/abi/sysv-amd64.js',"  stackRules:()=>Object.freeze({\n    alignment:16,","  stackRules:()=>Object.freeze({\n    stackPointer:'rsp', stackPointerAliases:Object.freeze(['rsp']), entryArgumentOffset:8,\n    alignment:16,"),
            ('js/targets/abi/microsoft-x64.js',"  stackRules:()=>Object.freeze({\n    alignment:16,","  stackRules:()=>Object.freeze({\n    stackPointer:'rsp', stackPointerAliases:Object.freeze(['rsp']), entryArgumentOffset:40,\n    alignment:16,"),
            ('js/targets/abi/riscv-lp64.js',"    stackRules:()=>Object.freeze({\n      alignment:16,","    stackRules:()=>Object.freeze({\n      stackPointer:'x2', stackPointerAliases:Object.freeze(['x2','sp']), entryArgumentOffset:0,\n      alignment:16,"),
          ]:
              replace_once(path,old,new)

          Path('js/decompiler/types/prototype.js').write_text(r'''/* Architecture-neutral prototype recovery driven by SSA use + ABI contracts. */
          import { resolveABIPlugin } from '../../targets/abi/index.js';

          function tname(t,fallback='unknown'){return t?.name||t?.type||fallback;}
          function used(v){return(v?.uses||[]).some((u)=>u&&!u.clobbered);}
          function bitsOf(t){return Number(t?.bits||(t?.size?Number(t.size)*8:0)||0);}
          function kindOf(t){return String(t?.kind||t?.class||t?.abiClass||'').toLowerCase();}
          function targetContext(ir,opts={}){
            const adapter=opts.abiAdapter||ir?.abiAdapter||null;
            let plugin=opts.abiPlugin&&typeof opts.abiPlugin==='object'?opts.abiPlugin:null;
            if(!plugin){plugin=resolveABIPlugin({abiId:opts.abiId||ir?.abiId,architecture:opts.architecture||opts.arch||ir?.architecture||ir?.arch,platform:opts.platform||ir?.platform,callingConvention:opts.callingConvention||opts.convention||opts.cc},{legacyDefault:false});}
            if(!plugin?.supported||plugin.id==='unknown')plugin=null;
            return{adapter,plugin,supported:!!adapter||!!plugin};
          }
          function classifiedArgumentLocations(ctx,opts={}){
            const out=[];
            const push=(x)=>{if(!x?.reg)return;const reg=String(x.reg);if(!out.some((y)=>y.reg===reg))out.push({...x,reg});};
            try{const locs=ctx.adapter?.argumentLocations?.({functionPrototype:opts.functionPrototype||opts.prototype||null});if(Array.isArray(locs))for(const x of locs)push(x);}catch{}
            if(!out.length)try{const regs=ctx.adapter?.argumentRegisters?.({functionPrototype:opts.functionPrototype||opts.prototype||null});if(Array.isArray(regs))regs.forEach((reg,index)=>push({reg,index,abiClass:null}));}catch{}
            if(!out.length&&ctx.plugin)try{const c=ctx.plugin.classifyArguments?.({callPrototype:null},{callingConvention:opts.callingConvention||opts.convention||opts.cc});for(const a of c?.arguments||[]){if(a?.location==='register'&&a.reg)push(a);else if(Array.isArray(a?.regs))for(const reg of a.regs)push({...a,reg});else for(const reg of a?.candidateRegisters||[])push({...a,reg,possible:true});}}catch{}
            return out;
          }
          function registerArguments(ir,types,opts,ctx){
            const out=[];
            for(const loc of classifiedArgumentLocations(ctx,opts)){
              const v=ir?.args?.get?.(loc.reg)||null;if(!v||!used(v))continue;
              const recovered=types?.values?.get?.(v.id)||null,index=Number.isInteger(Number(loc.index))?Number(loc.index):null;
              out.push({index,bankIndex:index,reg:loc.reg,abiClass:loc.abiClass||'register',name:opts.argNames?.[loc.reg]||(index!=null?opts.argNames?.[index]:null)||`arg${index!=null?index+1:out.length+1}`,type:tname(recovered),confidence:recovered?.confidence||0.45,valueId:v.id,used:true,sourceOrderKnown:index!=null,evidence:'ABI-declared entry register with SSA use'});
            }
            return out;
          }
          function stackRules(ctx){try{return ctx.adapter?.stackRules?.()||ctx.plugin?.stackRules?.()||{};}catch{return{};}}
          function entryStackArguments(ir,types,ctx){
            const rules=stackRules(ctx),bases=[rules.stackPointer,...(rules.stackPointerAliases||[])].filter(Boolean).map(String),unique=[...new Set(bases)];if(!unique.length)return[];
            const entryValues=unique.map((name)=>ir?.args?.get?.(name)).filter(Boolean);if(!entryValues.length)return[];
            const min=BigInt(rules.entryArgumentOffset??0),byKey=new Map();
            for(const inst of ir?.instructions||[]){if(inst?.op!=='load'||inst.loc?.kind!=='stack'||inst.memUse?.kind!=='entry')continue;const base=String(inst.loc.baseReg||inst.addr?.baseReg||'');if(!unique.includes(base))continue;if(!entryValues.some((v)=>inst.loc.frameEpoch===v.id))continue;const disp=BigInt(inst.loc.disp??0);if(disp<min)continue;const key=inst.loc.key||`${base}:${disp}`,recovered=inst.dst?types?.values?.get?.(inst.dst.id):null;if(!byKey.has(key))byKey.set(key,{index:null,reg:null,abiClass:'stack',stackOffset:disp,name:`stackArg_${disp.toString(16)}`,type:tname(recovered),confidence:recovered?.confidence||0.5,valueId:inst.dst?.id??null,used:true,sourceOrderKnown:false,evidence:`entry-${base} load after ABI stack-argument frontier`});}
            return[...byKey.values()].sort((a,b)=>a.stackOffset<b.stackOffset?-1:a.stackOffset>b.stackOffset?1:0);
          }
          function functionReturnDecision(ctx,ret,opts={}){
            const request={...opts,functionPrototype:opts.functionPrototype||opts.prototype||null,returnType:tname(ret,opts.returnType||''),returnClass:kindOf(ret)||opts.returnClass,returnBits:bitsOf(ret)||opts.returnBits,returnsValue:ret?true:opts.returnsValue};
            try{const d=ctx.adapter?.classifyFunctionReturn?.(request);if(d!=null)return d;}catch{}
            try{return ctx.plugin?.classifyFunctionReturn?.(request)??null;}catch{return null;}
          }
          function returnInfo(ctx,ret,opts){
            const d=functionReturnDecision(ctx,ret,opts);if(!d)return{decision:null,locations:[],indirect:false,indirectRegister:null};
            const indirect=d.indirect===true||d.kind==='indirect';if(indirect)return{decision:d,locations:[],indirect:true,indirectRegister:d.hiddenResultPointer||d.hiddenResultRegister||null};
            const regs=Array.isArray(d.regs)&&d.regs.length?d.regs:(d.reg?[d.reg]:[]),locations=regs.map((reg)=>({kind:'register',reg,abiClass:/^(?:v|f|xmm|ymm|zmm)/i.test(String(reg))?'fp':'integer'}));
            return{decision:d,locations,indirect:false,indirectRegister:null};
          }
