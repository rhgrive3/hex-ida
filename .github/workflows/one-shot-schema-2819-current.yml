name: One-shot schema recovery current 2819
on:
  push:
    branches: [fix/schema-recovery-current-2819-v2]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply schema-only reviewed diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/2811-2814-2819-cache-current
          base=$(git merge-base HEAD origin/fix/2811-2814-2819-cache-current)
          git diff "$base"..origin/fix/2811-2814-2819-cache-current -- js/analysis/schema-recovery-task.js | git apply --3way
      - run: node tests/issue-2819-schema-budget-cache.mjs
      - name: Commit production result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/analysis/schema-recovery-task.js
          git diff --cached --quiet || git commit -m 'fix(schema): separate cache entries by recovery budget'
          git push
