name: fixer2 issue 4227 finalize
on:
  push:
    branches:
      - fixer2/issue-4227-et-rel-addralign
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply verified local patch
        run: node .tmp/fixer2-4227-finalize.mjs
      - name: Validate exact blobs and focused regression
        run: |
          test "$(git hash-object js/binary/elf-core.js)" = bd8c29a6ff7d37b72c189450fd5b9f5e334bdb1f
          test "$(git hash-object tests/phase4/binary/issue-4227-elf-et-rel-addralign.test.mjs)" = 724967f6f55caf2bd0317e325f61e72bb1b70a2a
          node --check js/binary/elf-core.js
          node --check tests/phase4/binary/issue-4227-elf-et-rel-addralign.test.mjs
          node tests/phase4/binary/issue-4227-elf-et-rel-addralign.test.mjs
          node tests/phase4/binary/issue-5682-elf-relocation-import-site-identity.test.mjs
      - name: Remove temporary remote-write files
        run: rm -f .tmp/fixer2-4227-finalize.mjs .github/workflows/fixer2-4227-finalize.yml
      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(elf): validate zero-size ET_REL section alignment"
          git push origin HEAD:fixer2/issue-4227-et-rel-addralign
