name: fixer2-4244-exact-write
on:
  push:
    branches:
      - fixer2/issue-4244-elf-vm-range-overflow
permissions:
  contents: write
jobs:
  exact-write:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply verified patch
        env:
          PATCH_B64: ''
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/elf-core.js)" = '9647068c1701d8a8dcf63fe16656375b3ac9fd12'
          test ! -e tests/phase4/binary/issue-4244-elf-vm-range-overflow.test.mjs
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/issue-4244.patch
          git apply --check /tmp/issue-4244.patch
          git apply /tmp/issue-4244.patch
          test "$(git hash-object js/binary/elf-core.js)" = 'a7a8b805c43419f25532ea96cad422bddb92b404'
          test "$(git hash-object tests/phase4/binary/issue-4244-elf-vm-range-overflow.test.mjs)" = 'aeda0bcf19640a5abe1bc763a7e1e82758ca2309'
          node --check js/binary/elf-core.js
          node --test tests/phase4/binary/issue-4244-elf-vm-range-overflow.test.mjs
          rm .github/workflows/fixer2-4244-exact-write.yml
          git config user.name 'hex-ida Fixer 2 Binary'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(elf): bound runtime mappings to address width (#4244)'
          git push origin HEAD:"$GITHUB_REF_NAME"
