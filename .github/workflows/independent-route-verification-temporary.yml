name: Temporary independent completion source export
on:
  push:
    branches: [diagnostic/independent-source-20260914]
    paths: [.github/workflows/independent-route-verification-temporary.yml]
permissions:
  contents: read
jobs:
  source-export:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: 02f95f4c53338a72281b6ecde5feff31b9b6de30
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact upstream source without deployment
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 02f95f4c53338a72281b6ecde5feff31b9b6de30
          test "$(git rev-parse HEAD^{tree})" = fca76e7720842df91c0a1a4ac6a767f2aee5ed23
          mkdir -p "$RUNNER_TEMP/independent-completion-source"
          timeout --kill-after=3s 40s git archive --format=zip --output="$RUNNER_TEMP/independent-completion-source/source.zip.tmp" HEAD
          test -s "$RUNNER_TEMP/independent-completion-source/source.zip.tmp"
          mv "$RUNNER_TEMP/independent-completion-source/source.zip.tmp" "$RUNNER_TEMP/independent-completion-source/source.zip"
          cd "$RUNNER_TEMP/independent-completion-source"
          sha256sum source.zip > SHA256SUMS
          printf '%s\n' 'Source commit: 02f95f4c53338a72281b6ecde5feff31b9b6de30' 'Source tree: fca76e7720842df91c0a1a4ac6a767f2aee5ed23' > SOURCE.txt
          cat SOURCE.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        timeout-minutes: 1
        with:
          name: independent-completion-source-02f95f4c
          path: ${{ runner.temp }}/independent-completion-source/
          if-no-files-found: error
          retention-days: 1
