name: Temporary independent completion verification
on:
  push:
    branches: [diagnostic/independent-source-20260914]
    paths: [.github/workflows/independent-route-verification-temporary.yml]
permissions:
  contents: read
jobs:
  component-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: 8d6c91824eee2fb81fdf1fcc71df2d5a0b133d3a
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 1
        with:
          node-version: '22'
      - name: Install pinned dependencies without deployment
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8d6c91824eee2fb81fdf1fcc71df2d5a0b133d3a
          test "$(git rev-parse HEAD^{tree})" = 28a7eb4b30bf9b7cc685fd357e95d65633502f93
          timeout --kill-after=3s 150s npm ci --no-audit --no-fund
      - name: Verify canonical builds and complete userscript test chain
        timeout-minutes: 8
        shell: bash
        env:
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/independent-completion-evidence"
          timeout --kill-after=3s 450s node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { spawnSync, execFileSync } from 'node:child_process';
          const sourceCommit = '8d6c91824eee2fb81fdf1fcc71df2d5a0b133d3a';
          const sourceTree = '28a7eb4b30bf9b7cc685fd357e95d65633502f93';
          const results = [];
          const paths = ['userscript/hex.user.template.js', 'userscript/release-version.json', 'js/userscript/deployment-identity.generated.js'];
          const hashOutputs = () => Object.fromEntries(paths.map(p => [p, createHash('sha256').update(fs.readFileSync(p)).digest('hex')]));
          const run = (name, args, seconds) => {
            const start = Date.now();
            const child = spawnSync('timeout', ['--kill-after=3s', `${seconds}s`, 'npm', ...args], { encoding: 'utf8', timeout: (seconds + 5) * 1000, maxBuffer: 4 * 1024 * 1024 });
            const text = (child.stdout || '') + '\n' + (child.stderr || '');
            const firstFailure = child.status === 0 && !child.error ? [] : text.split('\n').filter(line => /not ok|FAIL|AssertionError|^Error:|actual:|expected:|operator:|^\s+at .*tests\//.test(line)).slice(0, 16).map(line => line.slice(0, 500));
            const row = { name, command: ['npm', ...args], exitCode: child.status, signal: child.signal, error: child.error?.code ?? null, elapsedMs: Date.now() - start, passed: child.status === 0 && !child.error, outputSha256: createHash('sha256').update(text).digest('hex'), firstFailure };
            results.push(row);
            return row.passed;
          };
          const actualCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8', timeout: 10000 }).trim();
          const actualTree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8', timeout: 10000 }).trim();
          if (actualCommit !== sourceCommit || actualTree !== sourceTree) throw new Error('source identity mismatch');
          let firstBuild = null, secondBuild = null;
          if (run('build-first', ['run', 'userscript:build'], 55)) {
            firstBuild = hashOutputs();
            if (run('build-second', ['run', 'userscript:build'], 55)) secondBuild = hashOutputs();
          }
          const deterministicTrackedOutputs = firstBuild !== null && secondBuild !== null && JSON.stringify(firstBuild) === JSON.stringify(secondBuild);
          if (deterministicTrackedOutputs) run('canonical-userscript-test', ['run', 'userscript:test'], 320);
          const evidence = { sourceCommit, sourceTree, node: process.version, esbuild: execFileSync('node', ['-p', "require('esbuild/package.json').version"], { encoding: 'utf8', timeout: 10000 }).trim(), scope: 'Exact source; canonical ephemeral builds and npm run userscript:test including Wrangler local routes. No deployment, browser/device acceptance, or release.', firstBuild, secondBuild, deterministicTrackedOutputs, results };
          const output = path.join(process.env.RUNNER_TEMP, 'independent-completion-evidence', 'results.json');
          fs.writeFileSync(output + '.tmp', JSON.stringify(evidence, null, 2) + '\n');
          JSON.parse(fs.readFileSync(output + '.tmp', 'utf8'));
          fs.renameSync(output + '.tmp', output);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [`source ${sourceCommit}`, `tree ${sourceTree}`, `tracked generated hashes equal: ${deterministicTrackedOutputs}`, ...results.map(r => `${r.passed ? 'PASS' : 'FAIL'} ${r.name} (${r.exitCode})`)].join('\n') + '\n');
          if (!deterministicTrackedOutputs || results.length !== 3 || results.some(r => !r.passed)) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 1
        with:
          name: independent-final-8d6c9182
          path: ${{ runner.temp }}/independent-completion-evidence/results.json
          if-no-files-found: warn
          retention-days: 7
