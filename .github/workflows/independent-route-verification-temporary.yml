name: Temporary independent local routes
on:
  push:
    branches: [diagnostic/independent-source-20260914]
    paths: [.github/workflows/independent-route-verification-temporary.yml]
permissions:
  contents: read
jobs:
  local-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: b87d18c188c04371460b74b1c1aa36f7ef037306
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 1
        with:
          node-version: '22'
      - name: Install pinned dependencies and build without deployment
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b87d18c188c04371460b74b1c1aa36f7ef037306
          test "$(git rev-parse HEAD^{tree})" = 88207454ffeb4bd50787fe6a29344032b455fe9b
          timeout --kill-after=3s 120s npm ci --no-audit --no-fund
          timeout --kill-after=3s 50s npm run userscript:build
      - name: Verify only local routes and emit minimum evidence
        timeout-minutes: 3
        shell: bash
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/independent-route-evidence"
          timeout --kill-after=3s 165s node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const results = [];
          for (const file of ['tests/userscript-routes.mjs', 'tests/userscript-embed-route.mjs']) {
            const started = Date.now();
            const child = spawnSync('timeout', ['--kill-after=3s', '75s', process.execPath, file], { encoding: 'utf8', timeout: 80000, maxBuffer: 1024 * 1024 });
            const output = (child.stdout || '') + '\n' + (child.stderr || '');
            const firstFailure = output.split('\n').filter(line => /AssertionError|^Error:|actual:|expected:|operator:|^\s+at .*tests\//.test(line)).slice(0, 8).map(line => line.slice(0, 400));
            results.push({ file, exitCode: child.status, signal: child.signal, error: child.error?.code ?? null, elapsedMs: Date.now() - started, passed: child.status === 0 && !child.error, firstFailure });
          }
          const evidence = { sourceCommit: 'b87d18c188c04371460b74b1c1aa36f7ef037306', sourceTree: '88207454ffeb4bd50787fe6a29344032b455fe9b', node: process.version, scope: 'Wrangler dev --local; no deployment and no browser/device acceptance', results };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'independent-route-evidence', 'results.json'), JSON.stringify(evidence, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, results.map(row => `${row.passed ? 'PASS' : 'FAIL'} ${row.file} (${row.exitCode})`).join('\n') + '\n');
          if (results.some(row => !row.passed)) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 1
        with:
          name: independent-local-routes-b87d18c1
          path: ${{ runner.temp }}/independent-route-evidence/results.json
          if-no-files-found: warn
          retention-days: 7
