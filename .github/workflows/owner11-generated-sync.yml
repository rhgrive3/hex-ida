name: Owner11 generated userscript sync

on:
  push:
    branches:
      - consolidate/owner11-20260913-2058
    paths:
      - .github/workflows/owner11-generated-sync.yml

permissions:
  contents: write

jobs:
  sync-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Provision only pinned esbuild package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').devDependencies.esbuild")"
          test "$version" = "0.28.2"
          mkdir -p /tmp/hex-esbuild node_modules/esbuild node_modules/@esbuild/linux-x64
          core="$(cd /tmp/hex-esbuild && timeout 30s npm pack --silent "esbuild@$version" | tail -n 1)"
          platform="$(cd /tmp/hex-esbuild && timeout 30s npm pack --silent "@esbuild/linux-x64@$version" | tail -n 1)"
          tar -xzf "/tmp/hex-esbuild/$core" --strip-components=1 -C node_modules/esbuild
          tar -xzf "/tmp/hex-esbuild/$platform" --strip-components=1 -C node_modules/@esbuild/linux-x64
          test "$(node -e "import('esbuild').then(m=>process.stdout.write(m.version))")" = "$version"

      - name: Regenerate canonical userscript projection
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node scripts/build-userscript.mjs >/tmp/owner11-build.out 2>&1
          python - <<'PY'
          import subprocess
          allowed = {'userscript/hex.user.template.js', 'userscript/release-version.json'}
          changed = {p for p in subprocess.check_output(['git','diff','--name-only'], text=True).splitlines() if p}
          extra = changed - allowed
          if extra:
              raise SystemExit('unexpected generated tracked paths: ' + ', '.join(sorted(extra)))
          PY
          timeout 30s node --check userscript/hex.user.template.js
          timeout 45s node tests/userscript-release-version.mjs
          timeout 45s node tests/userscript-embed-protocol.mjs
          timeout 60s node tests/userscript-chatgpt-sandbox-host.mjs

      - name: Commit clean generated projection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/owner11-generated-sync.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(userscript): regenerate owner11 carrier projection"
          git push origin HEAD:consolidate/owner11-20260913-2058
