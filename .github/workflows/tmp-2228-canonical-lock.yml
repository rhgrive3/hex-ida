name: tmp-2228-canonical-lock
on:
  push:
    branches: [tmp/2228-canonical-lock]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate canonical lock
        run: node tools/validation/stage2/build-profile-denominator-lock.mjs
      - name: Commit generated lock and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-2228-canonical-lock.yml
          git add tools/validation/stage2/profile-denominators.lock.json
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'chore(stage2): regenerate canonical denominator lock'
          git push origin HEAD:tmp/2228-canonical-lock
