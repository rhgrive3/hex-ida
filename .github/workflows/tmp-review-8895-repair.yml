name: tmp-review-8895-repair
on:
  push:
    branches: [codex/issue-campaign-20260914-lane-15-batch-01]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply blocker fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected one match, got {n}')
              p.write_text(s.replace(old,new,1))
          rep('js/macho.js', "  function attachTruncatedFlag(out) {\n    Object.defineProperty(out, 'truncated', { value: false, writable: true, enumerable: false, configurable: true });\n    return out;\n  }\n", "  function attachTruncatedFlag(out) {\n    Object.defineProperty(out, 'truncated', { value: false, writable: true, enumerable: false, configurable: true });\n    Object.defineProperty(out, 'truncationReason', { value: null, writable: true, enumerable: false, configurable: true });\n    return out;\n  }\n\n  function markTruncated(out, reason) {\n    out.truncated = true;\n    if (!out.truncationReason) out.truncationReason = reason || 'budget';\n    return out;\n  }\n\n  function boundedExpansionBudget(value, fallback, maximum) {\n    if (value == null) return fallback;\n    if (typeof value !== 'number' || !Number.isSafeInteger(value) || value < 0) return 0;\n    return Math.min(value, maximum);\n  }\n")
          rep('js/macho.js', "  function parseUnwindStarts(buf, imageBase) {\n    const out = attachTruncatedFlag([]);\n    if (!buf || buf.length < 28) return out;\n    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);\n    if (dv.getUint32(0, true) !== 1) return out;               // 知らない版は読まない\n    const indexOff = dv.getUint32(20, true);\n    const indexCount = dv.getUint32(24, true);\n    if (!indexCount || indexOff + indexCount * 12 > buf.length) return out;\n", "  function parseUnwindStarts(buf, imageBase, options = {}) {\n    const out = attachTruncatedFlag([]);\n    if (!buf || buf.length < 28) return out;\n    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);\n    if (dv.getUint32(0, true) !== 1) return out;               // 知らない版は読まない\n    const indexOff = dv.getUint32(20, true);\n    const indexCount = dv.getUint32(24, true);\n    if (!indexCount || indexOff + indexCount * 12 > buf.length) return out;\n    const resultLimit = boundedExpansionBudget(options.maxResults, UNWIND_STARTS_MAX, UNWIND_STARTS_MAX);\n    const workLimit = boundedExpansionBudget(options.maxWork, UNWIND_STARTS_MAX, UNWIND_STARTS_MAX);\n    const shouldCancel = typeof options.shouldCancel === 'function' ? options.shouldCancel : null;\n    let work = 0;\n    const chargeWork = () => {\n      if (work >= workLimit) { markTruncated(out, 'work-limit'); return false; }\n      work++;\n      if (shouldCancel && ((work & 63) === 1) && shouldCancel()) { markTruncated(out, 'cancelled'); return false; }\n      return true;\n    };\n    if (resultLimit === 0) return markTruncated(out, 'result-limit');\n    if (workLimit === 0) return markTruncated(out, 'work-limit');\n")
          rep('js/macho.js', "      for (const rel of rec.rel) {\n        if (out.length >= UNWIND_STARTS_MAX) { out.truncated = true; break; }\n        const value = imageBase + base + rel;\n        if (seen.has(value)) continue;                         // 関数先頭は一意\n        seen.add(value);\n        out.push(value);\n      }\n      if (out.truncated) break;\n", "      for (const rel of rec.rel) {\n        if (out.length >= resultLimit) { markTruncated(out, 'result-limit'); break; }\n        if (!chargeWork()) break;\n        const value = imageBase + base + rel;\n        if (seen.has(value)) continue;                         // 関数先頭は一意\n        seen.add(value);\n        out.push(value);\n      }\n      if (out.truncated) break;\n")
          rep('js/macho.js', "  function parseUnwindLsdaEntries(buf, imageBase) {\n    const out = attachTruncatedFlag([]);\n    if (!buf || buf.length < 28 || imageBase == null) return out;\n    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);\n    if (dv.getUint32(0, true) !== 1) return out;\n    const indexOff = dv.getUint32(20, true);\n    const indexCount = dv.getUint32(24, true);\n    if (indexCount < 2 || indexOff + indexCount * 12 > buf.length) return out;\n    const base = BigInt(imageBase);\n", "  function parseUnwindLsdaEntries(buf, imageBase, options = {}) {\n    const out = attachTruncatedFlag([]);\n    if (!buf || buf.length < 28 || imageBase == null) return out;\n    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);\n    if (dv.getUint32(0, true) !== 1) return out;\n    const indexOff = dv.getUint32(20, true);\n    const indexCount = dv.getUint32(24, true);\n    if (indexCount < 2 || indexOff + indexCount * 12 > buf.length) return out;\n    const base = BigInt(imageBase);\n    const resultLimit = boundedExpansionBudget(options.maxResults, UNWIND_LSDA_MAX, UNWIND_LSDA_MAX);\n    const workLimit = boundedExpansionBudget(options.maxWork, UNWIND_LSDA_MAX, UNWIND_LSDA_MAX);\n    const shouldCancel = typeof options.shouldCancel === 'function' ? options.shouldCancel : null;\n    let work = 0;\n    const chargeWork = () => {\n      if (work >= workLimit) { markTruncated(out, 'work-limit'); return false; }\n      work++;\n      if (shouldCancel && ((work & 63) === 1) && shouldCancel()) { markTruncated(out, 'cancelled'); return false; }\n      return true;\n    };\n    if (resultLimit === 0) return markTruncated(out, 'result-limit');\n    if (workLimit === 0) return markTruncated(out, 'work-limit');\n")
          rep('js/macho.js', "      for (let x = lsdaOff; x + 8 <= nextLsdaOff; x += 8) {\n        if (out.length >= UNWIND_LSDA_MAX) { out.truncated = true; break; }\n        const fnOff = dv.getUint32(x, true);\n", "      for (let x = lsdaOff; x + 8 <= nextLsdaOff; x += 8) {\n        if (out.length >= resultLimit) { markTruncated(out, 'result-limit'); break; }\n        if (!chargeWork()) break;\n        const fnOff = dv.getUint32(x, true);\n")
          rep('js/macho.js', "    const uniq = attachTruncatedFlag([]);\n    uniq.truncated = out.truncated;\n", "    const uniq = attachTruncatedFlag([]);\n    uniq.truncated = out.truncated;\n    uniq.truncationReason = out.truncationReason;\n")
          rep('js/worker-legacy.js', "  const unwind = slice ? (slice.regions || []).find((r) => r.section === '__unwind_info' && r.size > 0n) : null;\n  if (unwind && imageBase != null && unwind.size < BigInt(16 * 1024 * 1024)) {\n    try {\n      const buf = await readRange(unwind.fileOffset, Number(unwind.size));\n      for (const a of MachO.parseUnwindStarts(buf, imageBase)) {\n        if (a >= lo && a < hi && found.size < cap) found.add(a);\n      }\n    } catch { /* 読めなければ推測だけで進む */ }\n  }\n", "  const unwind = slice ? (slice.regions || []).find((r) => r.section === '__unwind_info' && r.size > 0n) : null;\n  let unwindMetadataTruncated = false;\n  let unwindMetadataReason = null;\n  if (unwind && imageBase != null && unwind.size < BigInt(16 * 1024 * 1024)) {\n    try {\n      const buf = await readRange(unwind.fileOffset, Number(unwind.size));\n      const remaining = Math.max(0, cap - found.size);\n      if (remaining > 0) {\n        const unwindStarts = MachO.parseUnwindStarts(buf, imageBase, { maxResults: remaining, maxWork: remaining, shouldCancel: () => cancelled(requestId) });\n        for (const a of unwindStarts) if (a >= lo && a < hi && found.size < cap) found.add(a);\n        if (unwindStarts.truncated) { unwindMetadataTruncated = true; unwindMetadataReason = 'unwind-starts-' + (unwindStarts.truncationReason || 'truncated'); }\n      }\n      await yieldToQueue();\n      if (cancelled(requestId)) return { starts: new BigUint64Array(0), cancelled: true };\n    } catch { /* 読めなければ推測だけで進む */ }\n  }\n")
          rep('js/worker-legacy.js', "  const startCapHit = found.size >= cap;\n  const capped = startCapHit || candidateBudgetHit;\n  const truncationReason = candidateBudgetHit ? 'candidate-memory-budget' : startCapHit ? 'function-start-cap-reached' : null;\n", "  const startCapHit = found.size >= cap;\n  const capped = startCapHit || candidateBudgetHit || unwindMetadataTruncated;\n  const truncationReason = candidateBudgetHit ? 'candidate-memory-budget' : startCapHit ? 'function-start-cap-reached' : unwindMetadataReason;\n")
          rep('js/worker-fixes.js', "  const tailAddSpTargets = new Set(), tailFrameTargets = new Set();\n  let ehFrameRanges = [];\n", "  const tailAddSpTargets = new Set(), tailFrameTargets = new Set();\n  let ehFrameRanges = [];\n  let metadataIncomplete = false;\n  let metadataTruncationReason = null;\n")
          rep('js/worker-fixes.js', "        const buf = await readRange(unwindRegion.fileOffset, Number(unwindRegion.size));\n        for (const a of MachO.parseUnwindStarts(buf, imageBase)) if (a >= lo && a < hi) unwind.add(a);\n        unwindLsdaEntries = MachO.parseUnwindLsdaEntries(buf, imageBase);\n      } catch { /* malformed unwind metadata is not evidence */ }\n", "        const buf = await readRange(unwindRegion.fileOffset, Number(unwindRegion.size));\n        const unwindStarts = MachO.parseUnwindStarts(buf, imageBase, { maxResults: 200_000, maxWork: 200_000, shouldCancel: () => cancelled(requestId) });\n        for (const a of unwindStarts) if (a >= lo && a < hi) unwind.add(a);\n        if (unwindStarts.truncated) { metadataIncomplete = true; metadataTruncationReason ||= 'unwind-starts-' + (unwindStarts.truncationReason || 'truncated'); }\n        unwindLsdaEntries = MachO.parseUnwindLsdaEntries(buf, imageBase, { maxResults: 200_000, maxWork: 200_000, shouldCancel: () => cancelled(requestId) });\n        if (unwindLsdaEntries.truncated) { metadataIncomplete = true; metadataTruncationReason ||= 'unwind-lsda-' + (unwindLsdaEntries.truncationReason || 'truncated'); }\n        await yieldToQueue();\n        if (cancelled(requestId)) return { cancelled: true, incomplete: true, truncationReason: 'cancelled' };\n      } catch { /* malformed unwind metadata is not evidence */ }\n")
          rep('js/worker-fixes.js', "  return { data, structured, exactMetadata, directBranches, trapPeriodicGroups, trapStrideGroups, adrpReturnGroups, ehFrameRanges, exceptionLandingPads, interiorFrameSetups, denseAddressLeafStarts, unwind, directCalls, prologues, terminalStarts, indirectTerminalStarts, conditionalTargets, tailCalls, indirectThunkStarts, repeatedThunkStarts, repeatedDirectTailStarts };\n", "  return { data, structured, exactMetadata, directBranches, trapPeriodicGroups, trapStrideGroups, adrpReturnGroups, ehFrameRanges, exceptionLandingPads, interiorFrameSetups, denseAddressLeafStarts, unwind, directCalls, prologues, terminalStarts, indirectTerminalStarts, conditionalTargets, tailCalls, indirectThunkStarts, repeatedThunkStarts, repeatedDirectTailStarts, incomplete: metadataIncomplete, truncationReason: metadataTruncationReason };\n")
          rep('js/worker-fixes.js', "  const ev = await __functionEvidence(region, slice, args.requestId);\n  if (cancelled(args.requestId)) return { starts: new BigUint64Array(0), cancelled: true };\n", "  const ev = await __functionEvidence(region, slice, args.requestId);\n  if (!ev || ev.cancelled || cancelled(args.requestId)) return { starts: new BigUint64Array(0), cancelled: true };\n")
          rep('js/worker-fixes.js', "  const starts = new BigUint64Array(ordered.length);\n  for (let i = 0; i < ordered.length; i++) starts[i] = ordered[i];\n  return {\n    ...result,\n    starts,\n    filteredDataCandidates,\n    dataPointerRequiresConfirmation: true,\n    __transfer: [starts.buffer],\n  };\n", "  const starts = new BigUint64Array(ordered.length);\n  for (let i = 0; i < ordered.length; i++) starts[i] = ordered[i];\n  const evidenceIncomplete = ev.incomplete === true;\n  const capped = !!result.capped || evidenceIncomplete;\n  const truncationReason = result.truncationReason || (evidenceIncomplete ? (ev.truncationReason || 'function-evidence-truncated') : null);\n  const completeness = { ...(result.completeness || {}), complete: !capped, reason: truncationReason };\n  if (completeness.addressRange) completeness.addressRange = { ...completeness.addressRange, complete: !capped };\n  return {\n    ...result,\n    starts,\n    filteredDataCandidates,\n    dataPointerRequiresConfirmation: true,\n    capped, truncated: capped, complete: !capped, truncationReason, completeness,\n    __transfer: [starts.buffer],\n  };\n")
          PY
          cat > tests/issue-8789-8816-unwind-caller-bounds.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const root=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'..');
          const src=fs.readFileSync(path.join(root,'js/macho.js'),'utf8'); new Function('root',src)(globalThis);
          const {parseUnwindStarts,parseUnwindLsdaEntries}=globalThis.MachO;
          const BASE=0x100000000n,H=28,R=12,P=0x1000;
          function alias(rows=1500,count=1022){const po=H+rows*R,b=new Uint8Array(po+P+8),d=new DataView(b.buffer);d.setUint32(0,1,true);d.setUint32(20,H,true);d.setUint32(24,rows,true);d.setUint32(po,3,true);d.setUint16(po+4,8,true);d.setUint16(po+6,count,true);for(let k=0;k<count;k++)d.setUint32(po+8+k*4,k,true);for(let i=0;i<rows;i++){const e=H+i*R;d.setUint32(e,i*P,true);d.setUint32(e+4,po,true);}return b;}
          function lsda(n=32){const s=64,e=s+n*8,b=new Uint8Array(e+8),d=new DataView(b.buffer);d.setUint32(0,1,true);d.setUint32(20,H,true);d.setUint32(24,2,true);d.setUint32(H+8,s,true);d.setUint32(H+R+8,e,true);for(let k=0;k<n;k++){const x=s+k*8;d.setUint32(x,k*4+1,true);d.setUint32(x+4,k*8+1024,true);}return b;}
          const one=parseUnwindStarts(alias(),BASE,{maxResults:1,maxWork:1}); assert.equal(one.length,1); assert.equal(one.truncated,true); assert.equal(one.truncationReason,'result-limit');
          const stop=parseUnwindStarts(alias(4,64),BASE,{maxResults:64,maxWork:64,shouldCancel:()=>true}); assert.equal(stop.length,0); assert.equal(stop.truncated,true); assert.equal(stop.truncationReason,'cancelled');
          const le=parseUnwindLsdaEntries(lsda(),BASE,{maxResults:1,maxWork:1}); assert.equal(le.length,1); assert.equal(le.truncated,true); assert.equal(le.truncationReason,'result-limit');
          const legacy=fs.readFileSync(path.join(root,'js/worker-legacy.js'),'utf8'); assert.match(legacy,/maxResults: remaining, maxWork: remaining, shouldCancel:/); assert.match(legacy,/candidateBudgetHit \|\| unwindMetadataTruncated/);
          const fixes=fs.readFileSync(path.join(root,'js/worker-fixes.js'),'utf8'); assert.match(fixes,/unwindStarts\.truncated[\s\S]*unwindLsdaEntries\.truncated/); assert.match(fixes,/const evidenceIncomplete = ev\.incomplete === true[\s\S]*complete: !capped/);
          console.log('issues #8789/#8816 caller bounds and incomplete authority: PASS');
          EOF
      - name: Verify focused regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 25s node tests/issue-8789-8816-unwind-caller-bounds.mjs
          timeout 30s node tests/issue-8789-macho-unwind-starts-budget.mjs
          timeout 30s node tests/issue-8816-macho-lsda-budget.mjs
          timeout 25s node tests/issue-8800-macho-stub-symbols-budget.mjs
          timeout 25s node tests/issue-5371-macho-unwind-page-bounds.mjs
          timeout 30s node tests/check.mjs
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-review-8895-repair.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          for p in .github/workflows/tmp-review-8895-repair.yml js/macho.js js/worker-fixes.js js/worker-legacy.js tests/issue-8789-8816-unwind-caller-bounds.mjs; do printf '%s\n' "$changed" | grep -qx "$p"; done
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: propagate Mach-O unwind truncation and caller budgets'
          git push origin HEAD:codex/issue-campaign-20260914-lane-15-batch-01
