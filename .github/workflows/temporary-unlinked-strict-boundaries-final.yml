name: temporary unlinked strict boundaries final
on:
  push:
    branches: [fix/unlinked-strict-boundaries-final-20260830]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-strict-boundaries-final-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'guard failed: {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          rep('js/arm64.js',
              "sys eret clrex paciasp",
              "sys eret eretaa eretab clrex paciasp")

          rep('js/runtime/authority.js', '''function capabilityList(value) {
            if (!Array.isArray(value)) return [];
            const out = [...new Set(value.map(String).filter(Boolean))].sort();
            for (const capability of out) if (!DEBUG_CAPABILITY_SET.has(capability)) throw new TypeError(`runtime-capability-unknown:${capability}`);
            return out;
          }''', '''function capabilityList(value) {
            if (!Array.isArray(value)) return [];
            const normalized = value.map((capability) => {
              if (typeof capability !== 'string' || !capability.trim()) throw new TypeError('runtime-capability-invalid');
              return capability.trim();
            });
            const out = [...new Set(normalized)].sort();
            for (const capability of out) if (!DEBUG_CAPABILITY_SET.has(capability)) throw new TypeError(`runtime-capability-unknown:${capability}`);
            return out;
          }''')
          rep('js/runtime/authority.js', '''function profileAllowed(value) {
            const text = String(value ?? '').trim();
            return PROVIDER_PROFILE_PATTERNS.some((pattern) => pattern.test(text));
          }

          function targetProfileAllowed(value) {
            const text = String(value ?? '').trim();
            return NATIVE_TARGET_PROFILES.has(text) || MANAGED_TARGET_PROFILE.test(text);
          }''', '''function profileAllowed(value) {
            if (typeof value !== 'string') return false;
            const text = value.trim();
            return !!text && PROVIDER_PROFILE_PATTERNS.some((pattern) => pattern.test(text));
          }

          function targetProfileAllowed(value) {
            if (typeof value !== 'string') return false;
            const text = value.trim();
            return !!text && (NATIVE_TARGET_PROFILES.has(text) || MANAGED_TARGET_PROFILE.test(text));
          }

          function authorityText(value) {
            if (value == null) return null;
            if (typeof value !== 'string') return false;
            const text = value.trim();
            return text || false;
          }

          function authoritySha(value) {
            const text = authorityText(value);
            if (text == null || text === false) return text;
            const normalized = text.toLowerCase();
            return /^[0-9a-f]{40}$/.test(normalized) ? normalized : false;
          }''')
          rep('js/runtime/authority.js', '''  const proofProviderProfileId = proof.providerProfileId == null ? null : String(proof.providerProfileId).trim();
            const proofTargetProfileId = proof.targetProfileId == null ? null : String(proof.targetProfileId).trim();
            const proofProviderIdentity = proof.providerIdentity == null ? null : String(proof.providerIdentity).trim();
            const proofBuildIdentity = proof.buildIdentity ?? proof.runtimeBuildIdentity ?? null;''', '''  const proofProviderProfileId = authorityText(proof.providerProfileId);
            const proofTargetProfileId = authorityText(proof.targetProfileId);
            const proofProviderIdentity = authorityText(proof.providerIdentity);
            const proofBuildIdentity = authorityText(proof.buildIdentity ?? proof.runtimeBuildIdentity ?? null);
            if (proofProviderProfileId === false || proofTargetProfileId === false || proofProviderIdentity === false || proofBuildIdentity === false) return 'runtime-proof-identity-invalid';
            const expectedBuild = authorityText(expectedBuildIdentity);
            if (expectedBuild === false) return 'runtime-build-identity-invalid';''')
          rep('js/runtime/authority.js', '''  if (expectedBuildIdentity != null && binding.buildIdentity !== String(expectedBuildIdentity)) return 'runtime-build-identity-mismatch';
            if (proofBuildIdentity != null && String(proofBuildIdentity) !== binding.buildIdentity) return 'runtime-proof-build-identity-mismatch';''', '''  if (expectedBuild != null && binding.buildIdentity !== expectedBuild) return 'runtime-build-identity-mismatch';
            if (proofBuildIdentity != null && proofBuildIdentity !== binding.buildIdentity) return 'runtime-proof-build-identity-mismatch';''')
          rep('js/runtime/authority.js', '''  const normalizedProviderProfileId = providerProfileId == null ? null : String(providerProfileId).trim();
            const normalizedTargetProfileId = targetProfileId == null ? null : String(targetProfileId).trim();''', '''  const normalizedProviderProfileId = authorityText(providerProfileId);
            const normalizedTargetProfileId = authorityText(targetProfileId);''')
          rep('js/runtime/authority.js', '''  if (!hasBinding) reason = 'runtime-binding-identity-invalid';
            else if (!normalizedProviderProfileId || !normalizedTargetProfileId) reason = 'runtime-profile-identity-required';''', '''  if (!hasBinding) reason = 'runtime-binding-identity-invalid';
            else if (normalizedProviderProfileId === false || normalizedTargetProfileId === false) reason = 'runtime-profile-identity-invalid';
            else if (!normalizedProviderProfileId || !normalizedTargetProfileId) reason = 'runtime-profile-identity-required';''')
          rep('js/runtime/authority.js', '''    const proofHeadSha = proof.headSha ?? proof.commitSha ?? null;
              const proofTreeSha = proof.treeSha ?? null;
              const expectedHead = expectedHeadSha ?? proof.expectedHeadSha ?? null;
              const expectedTree = expectedTreeSha ?? proof.expectedTreeSha ?? null;
              if (canonical.commitSha == null || canonical.treeSha == null || proofHeadSha == null || proofTreeSha == null) reason = 'runtime-proof-exact-identity-required';
              else if (String(proofHeadSha).toLowerCase() !== canonical.commitSha) reason = 'runtime-proof-stale-head';
              else if (String(proofTreeSha).toLowerCase() !== canonical.treeSha) reason = 'runtime-proof-stale-tree';
              else if (expectedHead != null && (canonical.commitSha !== String(expectedHead).toLowerCase() || String(proofHeadSha).toLowerCase() !== String(expectedHead).toLowerCase())) reason = 'runtime-proof-stale-head';
              else if (expectedTree != null && (canonical.treeSha !== String(expectedTree).toLowerCase() || String(proofTreeSha).toLowerCase() !== String(expectedTree).toLowerCase())) reason = 'runtime-proof-stale-tree';''', '''    const proofHeadSha = authoritySha(proof.headSha ?? proof.commitSha ?? null);
              const proofTreeSha = authoritySha(proof.treeSha ?? null);
              const expectedHead = authoritySha(expectedHeadSha ?? proof.expectedHeadSha ?? null);
              const expectedTree = authoritySha(expectedTreeSha ?? proof.expectedTreeSha ?? null);
              if ([proofHeadSha, proofTreeSha, expectedHead, expectedTree].includes(false)) reason = 'runtime-proof-exact-identity-invalid';
              else if (canonical.commitSha == null || canonical.treeSha == null || proofHeadSha == null || proofTreeSha == null) reason = 'runtime-proof-exact-identity-required';
              else if (proofHeadSha !== canonical.commitSha) reason = 'runtime-proof-stale-head';
              else if (proofTreeSha !== canonical.treeSha) reason = 'runtime-proof-stale-tree';
              else if (expectedHead != null && (canonical.commitSha !== expectedHead || proofHeadSha !== expectedHead)) reason = 'runtime-proof-stale-head';
              else if (expectedTree != null && (canonical.treeSha !== expectedTree || proofTreeSha !== expectedTree)) reason = 'runtime-proof-stale-tree';''')

          rep('js/adapters/index.js', "function isRegisterName(reg) { return /^(x([0-9]|[12][0-9]|30)|w([0-9]|[12][0-9]|30)|sp|pc)$/.test(reg); }", """function isRegisterName(reg) { return /^(x([0-9]|[12][0-9]|30)|w([0-9]|[12][0-9]|30)|sp|pc)$/.test(reg); }
          function initialMemorySize(value) {
            if (value == null) return 8;
            if (typeof value !== 'number' || !Number.isSafeInteger(value) || ![1,2,4,8].includes(value)) throw new DebugAdapterError('invalid-argument', 'initial memory size must be 1, 2, 4, or 8 bytes');
            return value;
          }
          function initialMemoryValue(value) {
            if (value == null) return 0n;
            if (typeof value === 'bigint') return value;
            if (typeof value === 'number' && Number.isSafeInteger(value)) return BigInt(value);
            if (typeof value === 'string' && /^-?(?:0x[0-9a-f]+|[0-9]+)$/i.test(value)) return BigInt(value);
            throw new DebugAdapterError('invalid-argument', 'initial memory value must be an integer scalar');
          }""")
          rep('js/adapters/index.js', '''    for (const item of spec.heap || []) await emu.store(asAddress(item.address), Number(item.size ?? 8), BigInt(item.value || 0));
              for (const item of spec.globalValues || []) await emu.store(asAddress(item.address), Number(item.size ?? 8), BigInt(item.value || 0));''', '''    for (const item of spec.heap || []) await emu.store(asAddress(item.address), initialMemorySize(item.size), initialMemoryValue(item.value));
              for (const item of spec.globalValues || []) await emu.store(asAddress(item.address), initialMemorySize(item.size), initialMemoryValue(item.value));''')

          rep('js/apple/objc-metadata.js', '''async function pointerTable(get, range, budget, parse, opts = {}) {
            const items = [];
            if (!range || range.vmAddr == null || range.size == null || Number(range.size) === 0) {
              return { items, completeness: { present: false, declared: 0, scanned: 0, parsed: 0, capped: false, unreadableSlots: 0, invalidEntries: 0, incompleteItems: 0, misalignedBytes: 0, sizeValid: true, complete: true } };
            }
            const size = Number(range.size);
            const sizeValid = Number.isSafeInteger(size) && size >= 0;''', '''function pointerTableSize(value) {
            if (typeof value === 'number' && Number.isSafeInteger(value) && value >= 0) return value;
            if (typeof value === 'bigint' && value >= 0n && value <= BigInt(Number.MAX_SAFE_INTEGER)) return Number(value);
            return null;
          }
          function pointerTableAddress(value) {
            if (typeof value === 'bigint' && value >= 0n) return value;
            if (typeof value === 'number' && Number.isSafeInteger(value) && value >= 0) return BigInt(value);
            if (typeof value === 'string' && /^(?:0x[0-9a-f]+|[0-9]+)$/i.test(value.trim())) return BigInt(value.trim());
            return null;
          }
          async function pointerTable(get, range, budget, parse, opts = {}) {
            const items = [];
            if (!range) {
              return { items, completeness: { present: false, declared: 0, scanned: 0, parsed: 0, capped: false, unreadableSlots: 0, invalidEntries: 0, incompleteItems: 0, misalignedBytes: 0, sizeValid: true, complete: true } };
            }
            const size = pointerTableSize(range.size);
            const base = pointerTableAddress(range.vmAddr);
            if (size == null || base == null) {
              return { items, completeness: { present: true, declared: 0, scanned: 0, parsed: 0, capped: false, unreadableSlots: 0, invalidEntries: 1, incompleteItems: 0, misalignedBytes: null, sizeValid: false, complete: false } };
            }
            if (size === 0) {
              return { items, completeness: { present: false, declared: 0, scanned: 0, parsed: 0, capped: false, unreadableSlots: 0, invalidEntries: 0, incompleteItems: 0, misalignedBytes: 0, sizeValid: true, complete: true } };
            }
            const sizeValid = true;''')
          rep('js/apple/objc-metadata.js', '    const slot = BigInt(range.vmAddr) + BigInt(i * PTR);', '    const slot = base + BigInt(i * PTR);')

          rep('js/apple/objc-runtime.js', '''function cleanClassName(name) {
            if (!name) return null;
            return String(name).replace(/^class\\s+/, '').replace(/\\s*\\*+\\s*$/, '').replace(/^@?"|"$/g, '').trim() || null;
          }''', '''function cleanClassName(name) {
            if (name == null || typeof name !== 'string') return null;
            return name.replace(/^class\\s+/, '').replace(/\\s*\\*+\\s*$/, '').replace(/^@?"|"$/g, '').trim() || null;
          }''')
          rep('js/apple/objc-runtime.js', '''  for (const c of objcModel.classes || []) {
              if (!c || !c.name) continue;
              const info = {
                ...c,
                name: cleanClassName(c.name),''', '''  for (const c of objcModel.classes || []) {
              if (!c) continue;
              const className = cleanClassName(c.name);
              if (!className) continue;
              const info = {
                ...c,
                name: className,''')
          rep('js/apple/objc-runtime.js', '''  for (const p of objcModel.protocols || []) {
              if (!p || !p.name) continue;
              const name = cleanClassName(p.name);
              const copy = { ...p, name };''', '''  for (const p of objcModel.protocols || []) {
              if (!p) continue;
              const name = cleanClassName(p.name);
              if (!name) continue;
              const copy = { ...p, name };''')

          rep('js/targets/architecture/arm64/effects/memory.js', '''  if (printed) {
              const named = PREFETCH_NAMED_RE.exec(printed);
              if (!named) return null;
              const [, type, level, policy] = named;
              const code = (({ ld:0, li:1, st:2 })[type] << 3) | ((Number(level) - 1) << 1) | (policy === 'strm' ? 1 : 0);
              return Object.freeze({''', '''  if (printed) {
              const named = PREFETCH_NAMED_RE.exec(printed);
              if (!named) return null;
              const [, type, level, policy] = named;
              const code = (({ ld:0, li:1, st:2 })[type] << 3) | ((Number(level) - 1) << 1) | (policy === 'strm' ? 1 : 0);
              const hasEncodingEvidence = decoded?.word != null || decoded?.encodingWord != null || decoded?.rawBytes != null || decoded?.bytes != null;
              const word = arm64DecodedEncodingWord(decoded);
              if (hasEncodingEvidence && word == null) return null;
              if (word != null && (word & 0x1f) !== code) return null;
              return Object.freeze({''')
          PY
      - name: Add focused regression
        run: |
          cat > tests/unlinked-strict-boundaries-final.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { categoryOf } from '../js/arm64.js';
          import { runtimeProfileSupport } from '../js/runtime/authority.js';
          import { parseObjcExtendedMetadata } from '../js/apple/objc-metadata.js';
          import { buildObjcRuntimeIndex, resolveObjcDispatch } from '../js/apple/objc-runtime.js';
          import { liftArm64MachineEffects } from '../js/targets/architecture/arm64/effects/index.js';

          assert.equal(categoryOf('eretaa'), 'system');
          assert.equal(categoryOf('ERETAB'), 'system');
          assert.notEqual(categoryOf('eretax'), 'system');
          assert.throws(() => runtimeProfileSupport({ binding:{}, requiredCapabilities:[['readMemory']] }), /runtime-capability-invalid/);
          assert.equal(runtimeProfileSupport({ binding:{}, providerProfileId:['native:remote-debug-v1:qemu-lldb'], targetProfileId:['arm64:a64'] }).status, 'unavailable');

          const malformedMeta = await parseObjcExtendedMetadata(async () => null, { protocolList:{ vmAddr:0x1000n, size:[] } });
          assert.equal(malformedMeta.completeness.protocols.complete, false);
          assert.equal(malformedMeta.completeness.protocols.sizeValid, false);

          const objc = buildObjcRuntimeIndex({ classes:[{ name:'MyClass', methods:[{ selector:'foo', imp:0x2000n }] }], runtimeCompleteness:{ categories:{ complete:true } } });
          const spoofed = { toString(){ return 'MyClass'; } };
          const dispatch = resolveObjcDispatch(objc, { receiverType:spoofed, selector:'foo' });
          assert.equal(dispatch.receiverType, null);
          assert.equal(dispatch.resolved, null);

          const x = (n) => ({ k:'reg', text:`x${n}`, cls:'gp', bits:64, num:n });
          const imm = (value) => ({ k:'imm', text:`#${value}`, value:BigInt(value) });
          const mem = (base) => ({ k:'mem', text:'[...]', base, index:null, shift:null, mode:'offset', disp:imm(0), addressDisp:imm(0), writebackDisp:null });
          const id='arm64-prefetch-contradictory-evidence';
          const mismatch = liftArm64MachineEffects({ instructionId:id, mnemonic:'prfm', word:1, ops:[{k:'other',text:'pldl1keep'},mem(x(1))], mode:'a64', origin:{instructionIds:[id]} });
          assert.equal(mismatch.completeness, 'partial');
          assert.equal(mismatch.operations.length, 0);
          const matching = liftArm64MachineEffects({ instructionId:id+'-ok', mnemonic:'prfm', word:0, ops:[{k:'other',text:'pldl1keep'},mem(x(1))], mode:'a64', origin:{instructionIds:[id+'-ok']} });
          assert.equal(matching.completeness, 'exact-with-intrinsic');
          console.log('unlinked strict boundaries final: PASS');
          EOF
      - name: Verify
        run: |
          set -euo pipefail
          node --check js/arm64.js
          node --check js/runtime/authority.js
          node --check js/adapters/index.js
          node --check js/apple/objc-metadata.js
          node --check js/apple/objc-runtime.js
          node --check js/targets/architecture/arm64/effects/memory.js
          node tests/unlinked-strict-boundaries-final.mjs
          node tests/arm64-presentation-compat.mjs
          node tests/stage2/runtime-authority.test.mjs
          node tests/stage2/runtime-adapter-launch-atomic.test.mjs
          node tests/objc-metadata.mjs
          node tests/objc-runtime.mjs
          node tests/machine-effects/arm64-prefetch-operand-shape.test.mjs
          node tests/machine-effects/arm64-prefetch-immediate-validation.test.mjs
      - name: Commit verified changes
        run: |
          rm -f .github/workflows/temporary-unlinked-strict-boundaries-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: close strict unlinked boundary regressions'
          git push origin HEAD:fix/unlinked-strict-boundaries-final-20260830
