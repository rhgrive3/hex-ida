name: temporary bootstrap strict boundaries final
on:
  push:
    branches: [fix/unlinked-strict-boundaries-final-20260830]
permissions:
  contents: write
jobs:
  patch-runner:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-strict-boundaries-final-20260830
      - name: Patch one-shot runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/workflows/temporary-unlinked-strict-boundaries-final.yml')
          s=p.read_text()
          s2,n=re.subn(r'(?m)^    if: .*\n','',s,count=1)
          if n != 1: raise SystemExit('actor guard not found')
          s=s2
          needle="          rep('js/runtime/authority.js', '''  if (!hasBinding) reason = 'runtime-binding-identity-invalid';\n            else if (!normalizedProviderProfileId || !normalizedTargetProfileId) reason = 'runtime-profile-identity-required';''', '''  if (!hasBinding) reason = 'runtime-binding-identity-invalid';\n            else if (normalizedProviderProfileId === false || normalizedTargetProfileId === false) reason = 'runtime-profile-identity-invalid';\n            else if (!normalizedProviderProfileId || !normalizedTargetProfileId) reason = 'runtime-profile-identity-required';''')\n"
          insert=needle+"          rep('js/runtime/authority.js', \"  const managedMatch = normalizedTargetProfileId?.match(/^managed:(wasm|dex|cil|jvm):m6$/) || null;\", \"  const managedMatch = typeof normalizedTargetProfileId === 'string' ? normalizedTargetProfileId.match(/^managed:(wasm|dex|cil|jvm):m6$/) : null;\")\n"
          if needle not in s: raise SystemExit('managed insertion guard not found')
          p.write_text(s.replace(needle,insert,1))
          PY
          rm -f .github/workflows/temporary-bootstrap-strict-boundaries-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: repair strict boundary one-shot runner'
          git push origin HEAD:fix/unlinked-strict-boundaries-final-20260830
