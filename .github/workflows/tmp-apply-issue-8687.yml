name: tmp-apply-issue-8687

on:
  push:
    branches:
      - fix/mod5-3-8687-session-seal-authority

permissions:
  contents: write

jobs:
  apply-validated-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mod5-3-8687-session-seal-authority
          fetch-depth: 1
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/issue-8687.patch
          git apply .github/patches/issue-8687.patch
          git rm .github/patches/issue-8687.patch
      - name: Commit patch result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/ai/control/turn-executor.js js/ai/session-core/index.js \
            tests/issues-2613-2612-2609-ai-sessions-broker.mjs \
            tests/phase12/adversarial/issue-5159-ai-explicit-missing-evidence-fail-closed.test.mjs \
            tests/phase12/adversarial/issue-8864-planner-evidence-fallback-binding.test.mjs \
            tests/phase12/integration/issue-8687-session-seal-authority.test.mjs
          git commit -m 'fix(ai): preserve persisted evidence authority provenance (#8687)'
          git push origin HEAD:fix/mod5-3-8687-session-seal-authority
