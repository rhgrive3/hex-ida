name: Diagnose PR7036 effective tree diff

on:
  push:
    branches:
      - diag/pr7036-tree-20260917
    paths:
      - '.github/workflows/diag-pr7036-tree.yml'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8e044df4a6b0c1b2db973d43d49f5b7c17c13ae8"
      - name: Fetch PR7036 head
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s git fetch --no-tags origin pull/7036/head:refs/remotes/origin/pr7036
          test "$(git rev-parse refs/remotes/origin/pr7036)" = "837d0ce34668f65defac5f3517a802f366336158"
      - name: Compute exact tree diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status HEAD^ refs/remotes/origin/pr7036 > /tmp/effective.txt
          count=$(wc -l < /tmp/effective.txt | tr -d ' ')
          {
            echo "base=$(git rev-parse HEAD^)"
            echo "pr=$(git rev-parse refs/remotes/origin/pr7036)"
            echo "effective_diff_count=$count"
            echo "--- effective diff ---"
            cat /tmp/effective.txt
          } > diag-pr7036-tree-summary.txt
      - name: Publish small summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diag-pr7036-tree-summary.txt
          git commit -m 'diag: publish PR7036 effective tree summary [skip actions]'
          timeout 60s git push origin HEAD:diag/pr7036-tree-20260917
