name: Diagnose PR7036 merge conflicts

on:
  push:
    branches:
      - diag/pr7036-tree-20260917
    paths:
      - '.github/workflows/diag-pr7036-tree.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ac36cc16b42fb10fbd54b5bd3f1e1a6474ca902b
          fetch-depth: 1
      - name: Verify current-main snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ac36cc16b42fb10fbd54b5bd3f1e1a6474ca902b"
      - name: Fetch PR7036 merge inputs
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s git fetch --no-tags --depth=1 origin 178d386afc63c494d091fb3500c49361ab0a7dc7:refs/remotes/origin/pr7036-base
          timeout 90s git fetch --no-tags origin pull/7036/head:refs/remotes/origin/pr7036
          test "$(git rev-parse refs/remotes/origin/pr7036-base)" = "178d386afc63c494d091fb3500c49361ab0a7dc7"
          test "$(git rev-parse refs/remotes/origin/pr7036)" = "837d0ce34668f65defac5f3517a802f366336158"
      - name: Compute three-way conflict summary
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 120s git -c core.quotePath=false merge-tree --write-tree --name-only --messages --merge-base=refs/remotes/origin/pr7036-base HEAD refs/remotes/origin/pr7036 > /tmp/merge-tree.txt 2>&1
          rc=$?
          set -e
          {
            echo "current_main=$(git rev-parse HEAD)"
            echo "pr_base=$(git rev-parse refs/remotes/origin/pr7036-base)"
            echo "pr_head=$(git rev-parse refs/remotes/origin/pr7036)"
            echo "merge_tree_rc=$rc"
            echo "--- merge-tree output ---"
            cat /tmp/merge-tree.txt
          } > diag-pr7036-conflicts.txt
      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: diag-pr7036-conflicts
          path: diag-pr7036-conflicts.txt
          retention-days: 1
