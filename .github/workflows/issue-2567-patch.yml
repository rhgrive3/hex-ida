name: issue-2567-focused-patch
on:
  push:
    branches: [fix/2567-ai-search-abort-signal]
    paths: [.github/workflows/issue-2567-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2567-ai-search-abort-signal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify cancellation wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/ai/tools/registry-base.js')
          s=p.read_text()
          pairs=[
          ("async ({ query, limit = 40, cursor }) => {\n    const params = { query };\n    const offset = pageOffset('search_functions', params, cursor);\n    return searchPage(context, legacy, 'search_functions', query, limit, offset, (next) => pageCursor('search_functions', params, next));",
           "async ({ query, limit = 40, cursor }, callOptions = {}) => {\n    const params = { query };\n    const offset = pageOffset('search_functions', params, cursor);\n    return searchPage(context, legacy, 'search_functions', query, limit, offset, (next) => pageCursor('search_functions', params, next), { signal: callOptions.signal || null });"),
          ("async ({ query, limit = 50, cursor }) => {\n    const params = { query };\n    const offset = pageOffset('search_strings', params, cursor);\n    return searchPage(context, legacy, 'search_strings', query, limit, offset, (next) => pageCursor('search_strings', params, next));",
           "async ({ query, limit = 50, cursor }, callOptions = {}) => {\n    const params = { query };\n    const offset = pageOffset('search_strings', params, cursor);\n    return searchPage(context, legacy, 'search_strings', query, limit, offset, (next) => pageCursor('search_strings', params, next), { signal: callOptions.signal || null });"),
          ("async function searchPage(context, legacy, tool, query, limit, offset, cursorFor) {\n  const ctxFn = tool === 'search_functions' ? context.searchFunctions : context.searchStrings;",
           "async function searchPage(context, legacy, tool, query, limit, offset, cursorFor, options = {}) {\n  const ctxFn = tool === 'search_functions' ? context.searchFunctions : context.searchStrings;\n  const signal = options?.signal || null;"),
          ("const direct = await ctxFn(query, { limit: limit + 1, offset });","const direct = await ctxFn(query, { limit: limit + 1, offset, signal });"),
          ("value = await ctxFn(query, { limit: prefixLimit, offset: 0 });","value = await ctxFn(query, { limit: prefixLimit, offset: 0, signal });"),
          ("value = await legacy[tool](query, { limit: Math.min(1000, Math.max(limit + 1, offset + limit + 1)), offset });","value = await legacy[tool](query, { limit: Math.min(1000, Math.max(limit + 1, offset + limit + 1)), offset, signal });")]
          for a,b in pairs:
            if s.count(a)!=1: raise SystemExit('source drift: '+a[:80])
            s=s.replace(a,b,1)
          p.write_text(s)
          required=['callOptions = {}','{ signal: callOptions.signal || null }','const signal = options?.signal || null','offset, signal });','offset: 0, signal });','offset, signal });']
          for x in required:
            if x not in s: raise SystemExit('missing expected result: '+x)
          t=Path('tests/phase9/integration/ai-search-cancellation-contract.test.mjs')
          t.write_text("""import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport test from 'node:test';\nconst url=new URL('../../../js/ai/tools/registry-base.js',import.meta.url);\ntest('AI search producer paths receive execution signal',async()=>{const s=await readFile(url,'utf8');assert.equal((s.match(/callOptions = \\{\\}/g)||[]).length>=2,true);assert.match(s,/async function searchPage\\([^)]*options = \\{\\}\\)/);assert.match(s,/const signal = options\\?\\.signal \\|\\| null/);assert.match(s,/limit: limit \\+ 1, offset, signal/);assert.match(s,/limit: prefixLimit, offset: 0, signal/);assert.match(s,/legacy\\[tool\\]\\(query, \\{ limit: .*offset, signal \\}\\)/);});\n""")
          Path('.github/workflows/issue-2567-patch.yml').unlink()
          PY
          node --test tests/phase9/integration/ai-search-cancellation-contract.test.mjs
          git diff --check
      - name: Commit focused fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ai): propagate search cancellation to producers (#2567)"
          git push origin HEAD:fix/2567-ai-search-abort-signal
