name: diag-7036-ownership-latest
on:
  push:
    branches:
      - diag/7036-ownership-latest-20260917
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enumerate undeclared roadmap paths
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/diag-7036.txt
          : > "$STATUS"
          TARGET_BRANCH=feat/analysis-roadmap-v8-current-main-20260907
          timeout 90s git fetch --no-tags origin main "$TARGET_BRANCH" >/tmp/fetch.log 2>&1
          rc=$?; echo "fetch rc=$rc" >> "$STATUS"; [ $rc -eq 0 ] || { tail -n 60 /tmp/fetch.log >> "$STATUS"; exit $rc; }
          BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          START_SHA=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
          echo "base=$BASE_SHA" >> "$STATUS"
          echo "start_head=$START_SHA" >> "$STATUS"
          git checkout --detach "$START_SHA" >/tmp/checkout.log 2>&1
          rc=$?; echo "checkout rc=$rc" >> "$STATUS"; [ $rc -eq 0 ] || { tail -n 60 /tmp/checkout.log >> "$STATUS"; exit $rc; }
          git diff --name-only --diff-filter=ACMR "$BASE_SHA...$START_SHA" >/tmp/changed.txt
          python3 - <<'PY' >> "$STATUS" 2>&1
          import json
          from pathlib import Path
          changed=[x for x in Path('/tmp/changed.txt').read_text().splitlines() if x]
          manifest=json.loads(Path('tools/validation/analysis-roadmap/ownership.json').read_text())
          assigned={p for files in manifest['owners'].values() for p in files}
          missing=[p for p in changed if p not in assigned]
          print(f'changed_count={len(changed)}')
          print(f'assigned_count={len(assigned)}')
          print(f'missing_count={len(missing)}')
          for p in missing:
              print(f'missing={p}')
          PY
          rc=$?; echo "audit rc=$rc" >> "$STATUS"; exit "$rc"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-ownership-latest
          path: /tmp/diag-7036.txt
          retention-days: 1
