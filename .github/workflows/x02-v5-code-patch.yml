name: X-02 dyld v5 code patch

on:
  push:
    branches: [feat/analysis-roadmap-v8-current-main-20260907]
    paths: [.github/workflows/x02-v5-code-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/analysis-roadmap-v8-current-main-20260907
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch core dispatch and historical F47 observer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          core=Path('js/binary/dyld-shared-cache-core.js')
          s=core.read_text()
          anchor="import { decodeDyldSharedCacheMagic } from './detect.js';\n"
          add=anchor+"import { parseSlideInfo5Structure, walkSlideInfo5Sync, walkSlideInfo5Source } from './dyld-shared-cache-slide-v5.js';\n"
          if 'dyld-shared-cache-slide-v5.js' not in s:
              if anchor not in s: raise SystemExit('import-anchor-missing')
              s=s.replace(anchor,add,1)
          old='''function parseSlideInfoSync(allBytes, item, slide, mappings, opts) {\n  if (item.slideInfoFileSize === 0n) return { version: null, complete: true, rebaseCount: 0, rebases: [] };\n  const offset = Number(item.slideInfoFileOffset), size = Number(item.slideInfoFileSize);\n  const infoBytes = allBytes.subarray(offset, offset + size);\n  const version = new ByteView(infoBytes, { littleEndian: true }).u32(0);\n  if (version !== 2) throw new Error(`unsupported dyld shared cache slide info version ${version}`);\n  const info = parseSlideInfo2Structure(infoBytes, item, BigInt(allBytes.byteLength));\n  const mappingBytes = allBytes.subarray(Number(item.fileOffset), Number(item.fileOffset + item.size));\n  const rebases = walkSlideInfo2Sync(mappingBytes, item, info, slide, mappings, maxRecordsOption(opts));\n  return { version, pageSize: info.pageSize, complete: true, rebaseCount: rebases.length, rebases };\n}\n'''
          new='''function parseSlideInfoSync(allBytes, item, slide, mappings, opts) {\n  if (item.slideInfoFileSize === 0n) return { version: null, complete: true, rebaseCount: 0, rebases: [] };\n  const offset = Number(item.slideInfoFileOffset), size = Number(item.slideInfoFileSize);\n  const infoBytes = allBytes.subarray(offset, offset + size);\n  const version = new ByteView(infoBytes, { littleEndian: true }).u32(0);\n  const mappingBytes = allBytes.subarray(Number(item.fileOffset), Number(item.fileOffset + item.size));\n  if (version === 5) {\n    const info = parseSlideInfo5Structure(infoBytes, item, BigInt(allBytes.byteLength));\n    const rebases = walkSlideInfo5Sync(mappingBytes, item, info, slide, mappings, maxRecordsOption(opts));\n    return { version, pageSize: info.pageSize, valueAdd: info.valueAdd, complete: true, rebaseCount: rebases.length, rebases };\n  }\n  if (version !== 2) throw new Error(`unsupported dyld shared cache slide info version ${version}`);\n  const info = parseSlideInfo2Structure(infoBytes, item, BigInt(allBytes.byteLength));\n  const rebases = walkSlideInfo2Sync(mappingBytes, item, info, slide, mappings, maxRecordsOption(opts));\n  return { version, pageSize: info.pageSize, complete: true, rebaseCount: rebases.length, rebases };\n}\n'''
          if old not in s: raise SystemExit('sync-anchor-missing')
          s=s.replace(old,new,1)
          old='''async function parseSlideInfoSource(source, item, slide, mappings, opts) {\n  if (item.slideInfoFileSize === 0n) return { version: null, complete: true, rebaseCount: 0, rebases: [] };\n  const infoBytes = await readBoundedRange(source, item.slideInfoFileOffset, Number(item.slideInfoFileSize), opts.signal);\n  const version = new ByteView(infoBytes, { littleEndian: true }).u32(0);\n  if (version !== 2) throw new Error(`unsupported dyld shared cache slide info version ${version}`);\n  const info = parseSlideInfo2Structure(infoBytes, item, source.size);\n  const rebases = await walkSlideInfo2Source(source, item, info, slide, mappings, maxRecordsOption(opts), opts.signal);\n  return { version, pageSize: info.pageSize, complete: true, rebaseCount: rebases.length, rebases };\n}\n'''
          new='''async function parseSlideInfoSource(source, item, slide, mappings, opts) {\n  if (item.slideInfoFileSize === 0n) return { version: null, complete: true, rebaseCount: 0, rebases: [] };\n  const infoBytes = await readBoundedRange(source, item.slideInfoFileOffset, Number(item.slideInfoFileSize), opts.signal);\n  const version = new ByteView(infoBytes, { littleEndian: true }).u32(0);\n  if (version === 5) {\n    const info = parseSlideInfo5Structure(infoBytes, item, source.size);\n    const read64 = async (offset) => new ByteView(await readBoundedRange(source, offset, 8, opts.signal), { littleEndian: true }).u64(0);\n    const rebases = await walkSlideInfo5Source(read64, item, info, slide, mappings, maxRecordsOption(opts));\n    return { version, pageSize: info.pageSize, valueAdd: info.valueAdd, complete: true, rebaseCount: rebases.length, rebases };\n  }\n  if (version !== 2) throw new Error(`unsupported dyld shared cache slide info version ${version}`);\n  const info = parseSlideInfo2Structure(infoBytes, item, source.size);\n  const rebases = await walkSlideInfo2Source(source, item, info, slide, mappings, maxRecordsOption(opts), opts.signal);\n  return { version, pageSize: info.pageSize, complete: true, rebaseCount: rebases.length, rebases };\n}\n'''
          if old not in s: raise SystemExit('source-anchor-missing')
          s=s.replace(old,new,1)
          core.write_text(s)

          prior=Path('tests/scpa/x02-prior120-apple-version-matrix.test.mjs')
          p=prior.read_text()
          old="    assert.ok(process.platform!=='darwin'||process.arch!=='arm64');\n    return {classification:'environment-excluded',observedStatus:'not-executed',details:{platform:process.platform,architecture:process.arch,authenticationExecuted:false}};"
          new="    const targetRuntimeAvailable=process.platform==='darwin'&&process.arch==='arm64';\n    return {classification:'environment-excluded',observedStatus:targetRuntimeAvailable?'historical-exclusion-preserved':'not-executed',details:{platform:process.platform,architecture:process.arch,targetRuntimeAvailable,authenticationExecuted:false}};"
          if old not in p: raise SystemExit('f47-anchor-missing')
          prior.write_text(p.replace(old,new,1))
          PY
      - name: Focused tests
        run: |
          node --test tests/scpa/x02-dyld-slide-info5.test.mjs
          node --test tests/scpa/x02-prior120-apple-version-matrix.test.mjs
      - name: Push code only
        shell: bash
        env:
          BRANCH: feat/analysis-roadmap-v8-current-main-20260907
        run: |
          set -euo pipefail
          START=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test "$START" = "$REMOTE"
          git config user.name x02-repair
          git config user.email x02-repair@users.noreply.github.com
          git add js/binary/dyld-shared-cache-core.js tests/scpa/x02-prior120-apple-version-matrix.test.mjs
          git commit -m 'fix(x02): parse dyld slide info v5'
          git push origin "HEAD:$BRANCH"
