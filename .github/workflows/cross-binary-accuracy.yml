name: Cross-binary accuracy

on:
  workflow_dispatch:
    inputs:
      pr_exact_head:
        description: 'Set only by the exact-head PR dispatcher'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'js/**'
      - '!js/ai/**'
      - '!js/ui/**'
      - '!js/managed/**'
      - '!js/userscript/**'
      - 'tests/accuracy*.mjs'
      - 'tests/harness.mjs'
      - 'tests/fixtures/real-binaries.json'
      - 'tests/oracle.py'
      - 'tests/oracle-cfg-normalize.py'
      - 'tests/oracle-requirements.txt'
      - 'tests/issue-497-cross-binary-workflow.mjs'
      - 'tests/issue-3123-cross-binary-partitions.mjs'
      - 'tests/issue-500-matcher-budget.mjs'
      - 'tools/benchmark/**'
      - 'scripts/fetch-real-fixtures.mjs'
      - 'scripts/accuracy-partition-cache-key.mjs'
      - 'tests/accuracy-partitions.json'
      - 'package.json'
      - '.github/workflows/cross-binary-accuracy.yml'

concurrency:
  group: cross-binary-accuracy-${{ github.ref }}
  cancel-in-progress: true

env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
  HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP
  ORACLE_PYTHON_VERSION: '3.12.13'

jobs:
  prepare:
    name: prepare-${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target:
          - name: BattleCats
            fixture: battlecats
            file: battlecats
            oracle: tests/oracle.battlecats.ci.json.gz
          - name: YWP
            fixture: YWP
            file: YWP
            oracle: tests/oracle.YWP.ci.json.gz
          - name: TsumTsum
            fixture: TsumTsum
            file: TsumTsum
            oracle: tests/oracle.TsumTsum.ci.json.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require all real fixture URLs
        shell: bash
        run: |
          if [[ -z "$HEX_FIXTURE_BATTLECATS_URL" || -z "$HEX_FIXTURE_TSUMTSUM_URL" || -z "$HEX_FIXTURE_YWP_URL" ]]; then
            echo "::error::Cross-binary accuracy requires all three pinned real-fixture URLs."
            exit 1
          fi
      - name: Fetch and verify pinned real fixture
        run: |
          node scripts/fetch-real-fixtures.mjs "${{ matrix.target.fixture }}"
          node scripts/fetch-real-fixtures.mjs "${{ matrix.target.fixture }}" --check
          file "tests/.real-fixtures/${{ matrix.target.file }}"
      - name: Build exact oracle cache key
        id: oracle-key
        shell: bash
        env:
          ORACLE_INPUT_HASH: ${{ hashFiles('tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt') }}
        run: |
          echo "key=cross-binary-oracle-v3-${{ runner.os }}-${{ runner.arch }}-py${ORACLE_PYTHON_VERSION}-${{ matrix.target.fixture }}-${ORACLE_INPUT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore exact oracle cache
        id: oracle-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.target.oracle }}
          key: ${{ steps.oracle-key.outputs.key }}
      - uses: actions/setup-python@v7
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          python-version: ${{ env.ORACLE_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/oracle-requirements.txt
      - name: Install pinned oracle dependencies
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check -r tests/oracle-requirements.txt
      - name: Generate oracle on cache miss
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: |
          python tests/oracle.py "tests/.real-fixtures/${{ matrix.target.file }}" "${{ matrix.target.oracle }}"
          python tests/oracle-cfg-normalize.py "tests/.real-fixtures/${{ matrix.target.file }}" "${{ matrix.target.oracle }}"
      - name: Validate oracle
        run: |
          test -s "${{ matrix.target.oracle }}"
          gzip -t "${{ matrix.target.oracle }}"
      - name: Save exact oracle cache
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.target.oracle }}
          key: ${{ steps.oracle-key.outputs.key }}
      - name: Publish prepared target inputs
        uses: actions/upload-artifact@v7
        with:
          name: cross-binary-input-${{ matrix.target.name }}
          path: |
            tests/.real-fixtures/${{ matrix.target.file }}
            ${{ matrix.target.oracle }}
          if-no-files-found: error
          retention-days: 1

  measure:
    name: accuracy-${{ matrix.target.name }}-${{ matrix.partition }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        target:
          - name: BattleCats
            fixture: battlecats
            file: battlecats
            oracle: tests/oracle.battlecats.ci.json.gz
          - name: YWP
            fixture: YWP
            file: YWP
            oracle: tests/oracle.YWP.ci.json.gz
          - name: TsumTsum
            fixture: TsumTsum
            file: TsumTsum
            oracle: tests/oracle.TsumTsum.ci.json.gz
        partition: [core, pinpoint, pseudoc-0, pseudoc-1, pseudoc-2, pseudoc-3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download prepared target inputs
        uses: actions/download-artifact@v8
        with:
          name: cross-binary-input-${{ matrix.target.name }}
          path: tests
      - name: Validate prepared target inputs
        run: |
          test -s "${{ matrix.target.oracle }}"
          gzip -t "${{ matrix.target.oracle }}"
          test -s "tests/.real-fixtures/${{ matrix.target.file }}"
      - name: Resolve partition contract
        id: partition
        shell: bash
        run: |
          features=$(node -e 'const p=require("./tests/accuracy-partitions.json");const x=p[process.argv[1]];if(!Array.isArray(x)||!x.length)process.exit(2);process.stdout.write(x.join(","));' "${{ matrix.partition }}")
          echo "features=$features" >> "$GITHUB_OUTPUT"
          case "${{ matrix.partition }}" in
            pseudoc-*) echo "kind=pseudoc" >> "$GITHUB_OUTPUT"; echo "shard=${{ matrix.partition }}" | sed 's/.*pseudoc-/shard-index=/' >> "$GITHUB_OUTPUT" ;;
            *) echo "kind=nonpseudoc" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build partition-specific exact result key
        id: result-key
        shell: bash
        run: |
          digest=$(node scripts/accuracy-partition-cache-key.mjs "${{ matrix.partition }}")
          echo "key=accuracy-result-v8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.name }}-${{ matrix.partition }}-${digest}" >> "$GITHUB_OUTPUT"
      - name: Restore exact partition result cache
        id: result-cache
        uses: actions/cache/restore@v6
        with:
          path: accuracy-part-${{ matrix.target.name }}-${{ matrix.partition }}.json
          key: ${{ steps.result-key.outputs.key }}
      - name: Validate restored partition result
        if: steps.result-cache.outputs.cache-hit == 'true'
        run: node tests/accuracy-result-validate.mjs "accuracy-part-${{ matrix.target.name }}-${{ matrix.partition }}.json" --expect="${{ steps.partition.outputs.features }}"
      - name: Measure missing partition
        if: steps.result-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="accuracy-part-${{ matrix.target.name }}-${{ matrix.partition }}.json"
          tmp="${output}.tmp"
          log="${output}.log"
          rm -f "$tmp" "$log"
          if [[ "${{ steps.partition.outputs.kind }}" == "pseudoc" ]]; then
            shard="${{ matrix.partition }}"; shard="${shard#pseudoc-}"
            if ! node tests/accuracy-pseudoc-parallel.mjs \
              --target="tests/.real-fixtures/${{ matrix.target.file }}" \
              --oracle="${{ matrix.target.oracle }}" --workers=2 --shard-index="$shard" --shard-count=4 --json > "$tmp" 2> "$log"; then
              cat "$log"; exit 1
            fi
          else
            if ! node --max-old-space-size=4096 tests/accuracy.mjs \
              --target="tests/.real-fixtures/${{ matrix.target.file }}" \
              --oracle="${{ matrix.target.oracle }}" \
              --only="${{ steps.partition.outputs.features }}" --json > "$tmp" 2> "$log"; then
              cat "$log"; exit 1
            fi
          fi
          cat "$log"
          node tests/accuracy-result-validate.mjs "$tmp" --expect="${{ steps.partition.outputs.features }}"
          mv "$tmp" "$output"
      - name: Save exact partition result cache
        if: success() && steps.result-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: accuracy-part-${{ matrix.target.name }}-${{ matrix.partition }}.json
          key: ${{ steps.result-key.outputs.key }}
      - name: Publish raw partition result
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: accuracy-part-${{ matrix.target.name }}-${{ matrix.partition }}
          path: accuracy-part-${{ matrix.target.name }}-${{ matrix.partition }}.json
          if-no-files-found: error
          retention-days: 1

  accuracy:
    name: accuracy
    if: always()
    needs: [prepare, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require complete prepare and 18-job measurement matrices
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
        shell: bash
        run: |
          if [[ "$PREPARE_RESULT" != "success" || "$MEASURE_RESULT" != "success" ]]; then
            echo "::error::Cross-binary matrix incomplete (prepare=$PREPARE_RESULT measure=$MEASURE_RESULT)."
            exit 1
          fi
      - name: Workflow contract regression
        run: node tests/issue-497-cross-binary-workflow.mjs
      - name: Accuracy merge regressions
        run: |
          node tests/accuracy-merge.mjs --self-test
          node tests/accuracy-pseudoc-shard-merge.mjs --self-test
          node tests/accuracy-pseudoc-shard.test.mjs
          node tests/accuracy-result-validate.mjs --self-test
      - name: Syntax lint
        run: npm run lint
      - name: Matcher scaling regression
        run: node tests/issue-500-matcher-budget.mjs
      - name: Core tests for standalone manual validation
        if: github.event_name == 'workflow_dispatch' && inputs.pr_exact_head != true
        run: npm test
      - name: Download all 18 raw partition artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: accuracy-part-*
          merge-multiple: true
      - name: Validate all 18 raw partition results
        shell: bash
        run: |
          set -euo pipefail
          core='sections,funcs,funcs-guess,disasm,kinds,calls,refs,imports,objc,selstub,strings,xrefs,funcname,selffield,role,apimeaning,summary,expr,formula'
          pinpoint='pinpoint,pinpoint-partial'
          for target in BattleCats YWP TsumTsum; do
            node tests/accuracy-result-validate.mjs "accuracy-part-${target}-core.json" --expect="$core"
            node tests/accuracy-result-validate.mjs "accuracy-part-${target}-pinpoint.json" --expect="$pinpoint"
            for shard in 0 1 2 3; do
              node tests/accuracy-result-validate.mjs "accuracy-part-${target}-pseudoc-${shard}.json" --expect='pseudoc'
            done
          done
      - name: Recombine canonical pseudoc samples and merge targets
        shell: bash
        run: |
          set -euo pipefail
          for target in BattleCats YWP TsumTsum; do
            node tests/accuracy-pseudoc-shard-merge.mjs "accuracy-part-${target}-pseudoc.json" \
              "accuracy-part-${target}-pseudoc-0.json" "accuracy-part-${target}-pseudoc-1.json" \
              "accuracy-part-${target}-pseudoc-2.json" "accuracy-part-${target}-pseudoc-3.json"
            node tests/accuracy-merge.mjs "accuracy-${target}.json" \
              "accuracy-part-${target}-core.json" "accuracy-part-${target}-pinpoint.json" \
              "accuracy-part-${target}-pseudoc.json"
          done
      - name: Accuracy regression gate
        run: node tests/accuracy-gate.mjs
      - name: Structured baseline report
        run: node tools/benchmark/accuracy-report.mjs --output=accuracy-baseline-report.json
      - name: Current-main baseline regression gate
        run: node tools/benchmark/compare.mjs --accuracy=accuracy-baseline-report.json
      - name: Upload combined results
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: accuracy-results
          path: |
            accuracy-BattleCats.json
            accuracy-YWP.json
            accuracy-TsumTsum.json
            accuracy-baseline-report.json
          if-no-files-found: error
