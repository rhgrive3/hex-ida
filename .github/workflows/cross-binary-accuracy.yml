name: Cross-binary accuracy

# Exact real-binary proof, sharded at process-isolation boundaries. Every pinned
# fixture, feature and canonical pseudocode sample is still evaluated; no
# denominator or score floor is reduced. Heavy parser/decompiler heaps never
# share a runner, avoiding the OOM/serialization trade-off of the old layout.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/**'
      - '!js/ai/**'
      - '!js/ui/**'
      - '!js/managed/**'
      - '!js/userscript/**'
      - 'tests/accuracy*.mjs'
      - 'tests/harness.mjs'
      - 'tests/fixtures/real-binaries.json'
      - 'tests/oracle.py'
      - 'tests/oracle-cfg-normalize.py'
      - 'tests/oracle-requirements.txt'
      - 'tests/issue-497-cross-binary-workflow.mjs'
      - 'tests/issue-500-matcher-budget.mjs'
      - 'tools/benchmark/**'
      - 'scripts/fetch-real-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/cross-binary-accuracy.yml'
  push:
    branches: [main]
    paths:
      - 'js/**'
      - '!js/ai/**'
      - '!js/ui/**'
      - '!js/managed/**'
      - '!js/userscript/**'
      - 'tests/accuracy*.mjs'
      - 'tests/harness.mjs'
      - 'tests/fixtures/real-binaries.json'
      - 'tests/oracle.py'
      - 'tests/oracle-cfg-normalize.py'
      - 'tests/oracle-requirements.txt'
      - 'tests/issue-497-cross-binary-workflow.mjs'
      - 'tests/issue-500-matcher-budget.mjs'
      - 'tools/benchmark/**'
      - 'scripts/fetch-real-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/cross-binary-accuracy.yml'

permissions:
  contents: read

concurrency:
  group: cross-binary-accuracy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
  HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP
  ORACLE_PYTHON_VERSION: '3.12.13'
  LOCAL_PSEUDOC_WORKERS: 2

jobs:
  preflight:
    name: accuracy-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workflow and merge contracts
        run: |
          node tests/issue-497-cross-binary-workflow.mjs
          node tests/accuracy-merge.mjs --self-test
          node tests/accuracy-pseudoc-shard-merge.mjs --self-test
          node tests/accuracy-pseudoc-shard.test.mjs
          node tests/accuracy-result-validate.mjs --self-test
          node tests/issue-500-matcher-budget.mjs
      - name: Syntax lint
        run: npm run lint
      - name: Require all real fixture URLs
        shell: bash
        run: |
          test -n "$HEX_FIXTURE_BATTLECATS_URL"
          test -n "$HEX_FIXTURE_TSUMTSUM_URL"
          test -n "$HEX_FIXTURE_YWP_URL"

  measure:
    name: accuracy-${{ matrix.target.name }}-${{ matrix.lane.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        target:
          - name: BattleCats
            fixture: battlecats
            file: battlecats
            oracle: tests/oracle.battlecats.ci.json.gz
          - name: YWP
            fixture: YWP
            file: YWP
            oracle: tests/oracle.YWP.ci.json.gz
          - name: TsumTsum
            fixture: TsumTsum
            file: TsumTsum
            oracle: tests/oracle.TsumTsum.ci.json.gz
        lane:
          - name: core-a
            kind: feature
            only: sections,funcs,funcs-guess,disasm,kinds,calls,refs,imports,objc,selstub,pinpoint
          - name: core-b
            kind: feature
            only: strings,xrefs,funcname,selffield,role,apimeaning,summary,expr,formula,pinpoint-partial
          - name: pseudoc-0
            kind: pseudoc
            shard: 0
          - name: pseudoc-1
            kind: pseudoc
            shard: 1
          - name: pseudoc-2
            kind: pseudoc
            shard: 2
          - name: pseudoc-3
            kind: pseudoc
            shard: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact result cache key
        id: result-key
        shell: bash
        env:
          INPUT_HASH: ${{ hashFiles('js/**', 'tests/accuracy*.mjs', 'tests/harness.mjs', 'tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt', '.github/workflows/cross-binary-accuracy.yml', '!js/ai/**', '!js/ui/**', '!js/managed/**', '!js/userscript/**') }}
        run: echo "key=accuracy-result-v8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.name }}-${{ matrix.lane.name }}-${INPUT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore exact lane result
        id: result-cache
        uses: actions/cache/restore@v4
        with:
          path: accuracy-lane-${{ matrix.target.name }}-${{ matrix.lane.name }}.json
          key: ${{ steps.result-key.outputs.key }}
      - name: Validate restored lane result
        if: steps.result-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          if [[ "${{ matrix.lane.kind }}" == "pseudoc" ]]; then expect='pseudoc'; else expect='${{ matrix.lane.only }}'; fi
          node tests/accuracy-result-validate.mjs "accuracy-lane-${{ matrix.target.name }}-${{ matrix.lane.name }}.json" --expect="$expect"

      - name: Build exact oracle cache key
        if: steps.result-cache.outputs.cache-hit != 'true'
        id: oracle-key
        shell: bash
        env:
          ORACLE_INPUT_HASH: ${{ hashFiles('tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt') }}
        run: echo "key=cross-binary-oracle-v3-${{ runner.os }}-${{ runner.arch }}-py${ORACLE_PYTHON_VERSION}-${{ matrix.target.fixture }}-${ORACLE_INPUT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore exact oracle cache
        if: steps.result-cache.outputs.cache-hit != 'true'
        id: oracle-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.target.oracle }}
          key: ${{ steps.oracle-key.outputs.key }}
      - name: Fetch and verify pinned real fixture
        if: steps.result-cache.outputs.cache-hit != 'true'
        run: |
          node scripts/fetch-real-fixtures.mjs "${{ matrix.target.fixture }}"
          node scripts/fetch-real-fixtures.mjs "${{ matrix.target.fixture }}" --check
      - uses: actions/setup-python@v5
        if: steps.result-cache.outputs.cache-hit != 'true' && steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          python-version: ${{ env.ORACLE_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/oracle-requirements.txt
      - name: Install pinned oracle dependencies
        if: steps.result-cache.outputs.cache-hit != 'true' && steps.oracle-cache.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check -r tests/oracle-requirements.txt
      - name: Generate oracle on exact cache miss
        if: steps.result-cache.outputs.cache-hit != 'true' && steps.oracle-cache.outputs.cache-hit != 'true'
        run: |
          python tests/oracle.py "tests/.real-fixtures/${{ matrix.target.file }}" "${{ matrix.target.oracle }}"
          python tests/oracle-cfg-normalize.py "tests/.real-fixtures/${{ matrix.target.file }}" "${{ matrix.target.oracle }}"
      - name: Validate required oracle
        if: steps.result-cache.outputs.cache-hit != 'true'
        run: |
          test -s "${{ matrix.target.oracle }}"
          gzip -t "${{ matrix.target.oracle }}"
      - name: Seed exact oracle cache without write races
        if: >-
          steps.result-cache.outputs.cache-hit != 'true' &&
          steps.oracle-cache.outputs.cache-hit != 'true' &&
          matrix.lane.name == 'core-a'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.target.oracle }}
          key: ${{ steps.oracle-key.outputs.key }}

      - name: Measure exact lane
        if: steps.result-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="tests/.real-fixtures/${{ matrix.target.file }}"
          oracle="${{ matrix.target.oracle }}"
          output="accuracy-lane-${{ matrix.target.name }}-${{ matrix.lane.name }}.json"
          temporary="${output}.tmp"
          if [[ "${{ matrix.lane.kind }}" == "pseudoc" ]]; then
            node tests/accuracy-pseudoc-parallel.mjs \
              --target="$target" --oracle="$oracle" \
              --workers="$LOCAL_PSEUDOC_WORKERS" \
              --shard-index="${{ matrix.lane.shard }}" --shard-count=4 \
              --json > "$temporary"
            expect='pseudoc'
          else
            node --max-old-space-size=4096 tests/accuracy.mjs \
              --target="$target" --oracle="$oracle" \
              --only='${{ matrix.lane.only }}' --json > "$temporary"
            expect='${{ matrix.lane.only }}'
          fi
          node tests/accuracy-result-validate.mjs "$temporary" --expect="$expect"
          mv "$temporary" "$output"
      - name: Save exact lane result
        if: success() && steps.result-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: accuracy-lane-${{ matrix.target.name }}-${{ matrix.lane.name }}.json
          key: ${{ steps.result-key.outputs.key }}
      - name: Upload validated lane result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-lane-${{ matrix.target.name }}-${{ matrix.lane.name }}
          path: accuracy-lane-${{ matrix.target.name }}-${{ matrix.lane.name }}.json
          if-no-files-found: error
          retention-days: 1

  accuracy:
    name: accuracy
    if: always()
    needs: [preflight, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require complete proof matrix
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
        shell: bash
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$MEASURE_RESULT" = success
      - name: Download validated lanes
        uses: actions/download-artifact@v4
        with:
          pattern: accuracy-lane-*
          merge-multiple: true
      - name: Reassemble exact target results
        shell: bash
        run: |
          set -euo pipefail
          for target in BattleCats YWP TsumTsum; do
            node tests/accuracy-pseudoc-shard-merge.mjs \
              "accuracy-part-${target}-pseudoc.json" \
              "accuracy-lane-${target}-pseudoc-0.json" \
              "accuracy-lane-${target}-pseudoc-1.json" \
              "accuracy-lane-${target}-pseudoc-2.json" \
              "accuracy-lane-${target}-pseudoc-3.json"
            node tests/accuracy-merge.mjs \
              "accuracy-${target}.json" \
              "accuracy-lane-${target}-core-a.json" \
              "accuracy-lane-${target}-core-b.json" \
              "accuracy-part-${target}-pseudoc.json"
          done
      - name: Accuracy regression gate
        run: node tests/accuracy-gate.mjs
      - name: Structured baseline report and current-main comparison
        run: |
          node tools/benchmark/accuracy-report.mjs --output=accuracy-baseline-report.json
          node tools/benchmark/compare.mjs --accuracy=accuracy-baseline-report.json
      - name: Core tests for standalone manual validation
        if: github.event_name == 'workflow_dispatch'
        run: npm test
      - name: Upload combined results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: |
            accuracy-BattleCats.json
            accuracy-YWP.json
            accuracy-TsumTsum.json
            accuracy-baseline-report.json
          if-no-files-found: error
