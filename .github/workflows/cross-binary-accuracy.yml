name: Cross-binary accuracy

# Required real-binary accuracy gate. Precision is unchanged: every pinned
# fixture and every accuracy feature still runs. The three real fixtures are
# the only GitHub-job fanout. Within each fixture, all cache-missing accuracy
# features share one analysis world so the binary/index state is built once.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - '!js/ai/**'
      - '!js/ui/**'
      - '!js/managed/**'
      - '!js/userscript/**'
      - 'tests/accuracy*.mjs'
      - 'tests/harness.mjs'
      - 'tests/fixtures/real-binaries.json'
      - 'tests/oracle.py'
      - 'tests/oracle-cfg-normalize.py'
      - 'tests/oracle-requirements.txt'
      - 'tests/issue-497-cross-binary-workflow.mjs'
      - 'tests/issue-500-matcher-budget.mjs'
      - 'tools/benchmark/**'
      - 'scripts/fetch-real-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/cross-binary-accuracy.yml'

concurrency:
  group: cross-binary-accuracy-${{ github.ref }}
  cancel-in-progress: true

env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
  HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP
  ORACLE_PYTHON_VERSION: '3.12.13'

jobs:
  measure:
    name: accuracy-${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target:
          - name: BattleCats
            fixture: battlecats
            file: battlecats
            oracle: tests/oracle.battlecats.ci.json.gz
          - name: YWP
            fixture: YWP
            file: YWP
            oracle: tests/oracle.YWP.ci.json.gz
          - name: TsumTsum
            fixture: TsumTsum
            file: TsumTsum
            oracle: tests/oracle.TsumTsum.ci.json.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect real fixture configuration
        id: fixtures
        shell: bash
        run: |
          if [[ -n "$HEX_FIXTURE_BATTLECATS_URL" && -n "$HEX_FIXTURE_TSUMTSUM_URL" && -n "$HEX_FIXTURE_YWP_URL" ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Require all real fixture URLs
        if: steps.fixtures.outputs.enabled != 'true'
        run: exit 1
      - name: Build exact oracle cache key
        id: oracle-key
        shell: bash
        env:
          ORACLE_INPUT_HASH: ${{ hashFiles('tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt') }}
        run: echo "key=cross-binary-oracle-v3-${{ runner.os }}-${{ runner.arch }}-py${ORACLE_PYTHON_VERSION}-${{ matrix.target.fixture }}-${ORACLE_INPUT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore exact oracle cache
        id: oracle-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.target.oracle }}
          key: ${{ steps.oracle-key.outputs.key }}
      - name: Validate cached oracle
        if: steps.oracle-cache.outputs.cache-hit == 'true'
        run: test -s "${{ matrix.target.oracle }}" && gzip -t "${{ matrix.target.oracle }}"
      - name: Restore exact core result cache
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: accuracy-part-${{ matrix.target.name }}-core.json
          key: accuracy-result-v8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.name }}-core-${{ hashFiles('js/**', 'tests/accuracy*.mjs', 'tests/harness.mjs', 'tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt', '.github/workflows/cross-binary-accuracy.yml', '!js/ai/**', '!js/ui/**', '!js/managed/**', '!js/userscript/**') }}
      - name: Restore exact pinpoint result cache
        id: pinpoint-cache
        uses: actions/cache/restore@v4
        with:
          path: accuracy-part-${{ matrix.target.name }}-pinpoint.json
          key: accuracy-result-v8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.name }}-pinpoint-${{ hashFiles('js/**', 'tests/accuracy*.mjs', 'tests/harness.mjs', 'tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt', '.github/workflows/cross-binary-accuracy.yml', '!js/ai/**', '!js/ui/**', '!js/managed/**', '!js/userscript/**') }}
      - name: Restore exact pseudoc result cache
        id: pseudoc-cache
        uses: actions/cache/restore@v4
        with:
          path: accuracy-part-${{ matrix.target.name }}-pseudoc.json
          key: accuracy-result-v8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.name }}-pseudoc-${{ hashFiles('js/**', 'tests/accuracy*.mjs', 'tests/harness.mjs', 'tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt', '.github/workflows/cross-binary-accuracy.yml', '!js/ai/**', '!js/ui/**', '!js/managed/**', '!js/userscript/**') }}
      - name: Validate restored core result
        if: steps.core-cache.outputs.cache-hit == 'true'
        run: node tests/accuracy-result-validate.mjs "accuracy-part-${{ matrix.target.name }}-core.json" --expect='sections,funcs,funcs-guess,disasm,kinds,calls,refs,imports,objc,selstub,strings,xrefs,funcname,selffield,role,apimeaning,summary,expr,formula'
      - name: Validate restored pinpoint result
        if: steps.pinpoint-cache.outputs.cache-hit == 'true'
        run: node tests/accuracy-result-validate.mjs "accuracy-part-${{ matrix.target.name }}-pinpoint.json" --expect='pinpoint,pinpoint-partial'
      - name: Validate restored pseudoc result
        if: steps.pseudoc-cache.outputs.cache-hit == 'true'
        run: node tests/accuracy-result-validate.mjs "accuracy-part-${{ matrix.target.name }}-pseudoc.json" --expect='pseudoc'
      - name: Fetch and verify pinned real fixture
        if: steps.oracle-cache.outputs.cache-hit != 'true' || steps.core-cache.outputs.cache-hit != 'true' || steps.pinpoint-cache.outputs.cache-hit != 'true' || steps.pseudoc-cache.outputs.cache-hit != 'true'
        run: |
          node scripts/fetch-real-fixtures.mjs "${{ matrix.target.fixture }}"
          node scripts/fetch-real-fixtures.mjs "${{ matrix.target.fixture }}" --check
          file "tests/.real-fixtures/${{ matrix.target.file }}"
      - uses: actions/setup-python@v5
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          python-version: ${{ env.ORACLE_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/oracle-requirements.txt
      - name: Install pinned oracle dependencies
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check -r tests/oracle-requirements.txt
      - name: Generate oracle on cache miss
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: |
          python tests/oracle.py "tests/.real-fixtures/${{ matrix.target.file }}" "${{ matrix.target.oracle }}"
          python tests/oracle-cfg-normalize.py "tests/.real-fixtures/${{ matrix.target.file }}" "${{ matrix.target.oracle }}"
          gzip -t "${{ matrix.target.oracle }}"
      - name: Save exact oracle cache
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.target.oracle }}
          key: ${{ steps.oracle-key.outputs.key }}
      - name: Publish oracle for this run
        uses: actions/upload-artifact@v4
        with:
          name: cross-binary-oracle-${{ matrix.target.name }}
          path: ${{ matrix.target.oracle }}
          if-no-files-found: error
          retention-days: 1
      - name: Validate required oracle
        run: test -s "${{ matrix.target.oracle }}" && gzip -t "${{ matrix.target.oracle }}"
      - name: Measure missing accuracy partitions in one analysis world
        if: steps.core-cache.outputs.cache-hit != 'true' || steps.pinpoint-cache.outputs.cache-hit != 'true' || steps.pseudoc-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CORE_CACHE_HIT: ${{ steps.core-cache.outputs.cache-hit }}
          PINPOINT_CACHE_HIT: ${{ steps.pinpoint-cache.outputs.cache-hit }}
          PSEUDOC_CACHE_HIT: ${{ steps.pseudoc-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          target="tests/.real-fixtures/${{ matrix.target.file }}"; oracle="${{ matrix.target.oracle }}"; core_output="accuracy-part-${{ matrix.target.name }}-core.json"; pinpoint_output="accuracy-part-${{ matrix.target.name }}-pinpoint.json"; pseudoc_output="accuracy-part-${{ matrix.target.name }}-pseudoc.json"; combined_output="accuracy-local-missing.json"; combined_log="accuracy-local-missing.log"
          rm -f "${core_output}.tmp" "${pinpoint_output}.tmp" "${pseudoc_output}.tmp" "$combined_output" "$combined_log"
          core_ids='sections,funcs,funcs-guess,disasm,kinds,calls,refs,imports,objc,selstub,strings,xrefs,funcname,selffield,role,apimeaning,summary,expr,formula'; pinpoint_ids='pinpoint,pinpoint-partial'; pseudoc_ids='pseudoc'; features=''
          append_features(){ if [[ -n "$features" ]]; then features+=','; fi; features+="$1"; }
          if [[ "$CORE_CACHE_HIT" != "true" ]]; then append_features "$core_ids"; fi
          if [[ "$PINPOINT_CACHE_HIT" != "true" ]]; then append_features "$pinpoint_ids"; fi
          if [[ "$PSEUDOC_CACHE_HIT" != "true" ]]; then append_features "$pseudoc_ids"; fi
          if ! node --max-old-space-size=4096 tests/accuracy.mjs --target="$target" --oracle="$oracle" --only="$features" --json > "$combined_output" 2> "$combined_log"; then cat "$combined_log"; exit 1; fi
          cat "$combined_log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=JSON.parse(fs.readFileSync('accuracy-local-missing.json','utf8'));
          const coreIds=new Set(['sections','funcs','funcs-guess','disasm','kinds','calls','refs','imports','objc','selstub','strings','xrefs','funcname','selffield','role','apimeaning','summary','expr','formula']); const pinpointIds=new Set(['pinpoint','pinpoint-partial']); const pseudocIds=new Set(['pseudoc']);
          const write=(path,ids)=>fs.writeFileSync(path+'.tmp',JSON.stringify(rows.filter((row)=>ids.has(row.id)),null,2)+'\n');
          if(process.env.CORE_CACHE_HIT!=='true')write('accuracy-part-${{ matrix.target.name }}-core.json',coreIds); if(process.env.PINPOINT_CACHE_HIT!=='true')write('accuracy-part-${{ matrix.target.name }}-pinpoint.json',pinpointIds); if(process.env.PSEUDOC_CACHE_HIT!=='true')write('accuracy-part-${{ matrix.target.name }}-pseudoc.json',pseudocIds);
          NODE
          if [[ "$CORE_CACHE_HIT" != "true" ]]; then node tests/accuracy-result-validate.mjs "${core_output}.tmp" --expect="$core_ids"; mv "${core_output}.tmp" "$core_output"; fi
          if [[ "$PINPOINT_CACHE_HIT" != "true" ]]; then node tests/accuracy-result-validate.mjs "${pinpoint_output}.tmp" --expect="$pinpoint_ids"; mv "${pinpoint_output}.tmp" "$pinpoint_output"; fi
          if [[ "$PSEUDOC_CACHE_HIT" != "true" ]]; then node tests/accuracy-result-validate.mjs "${pseudoc_output}.tmp" --expect="$pseudoc_ids"; mv "${pseudoc_output}.tmp" "$pseudoc_output"; fi
      - name: Save exact core result cache
        if: success() && steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: accuracy-part-${{ matrix.target.name }}-core.json
          key: accuracy-result-v8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.name }}-core-${{ hashFiles('js/**', 'tests/accuracy*.mjs', 'tests/harness.mjs', 'tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt', '.github/workflows/cross-binary-accuracy.yml', '!js/ai/**', '!js/ui/**', '!js/managed/**', '!js/userscript/**') }}
      - name: Save exact pinpoint result cache
        if: success() && steps.pinpoint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: accuracy-part-${{ matrix.target.name }}-pinpoint.json
          key: accuracy-result-v8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.name }}-pinpoint-${{ hashFiles('js/**', 'tests/accuracy*.mjs', 'tests/harness.mjs', 'tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt', '.github/workflows/cross-binary-accuracy.yml', '!js/ai/**', '!js/ui/**', '!js/managed/**', '!js/userscript/**') }}
      - name: Save exact pseudoc result cache
        if: success() && steps.pseudoc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: accuracy-part-${{ matrix.target.name }}-pseudoc.json
          key: accuracy-result-v8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.name }}-pseudoc-${{ hashFiles('js/**', 'tests/accuracy*.mjs', 'tests/harness.mjs', 'tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt', '.github/workflows/cross-binary-accuracy.yml', '!js/ai/**', '!js/ui/**', '!js/managed/**', '!js/userscript/**') }}
      - name: Upload target accuracy partitions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-part-${{ matrix.target.name }}
          path: accuracy-part-${{ matrix.target.name }}-*.json
          if-no-files-found: error

  accuracy:
    name: accuracy
    if: always()
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require complete measurement matrix
        env:
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: if [[ "$MEASURE_RESULT" != "success" ]]; then exit 1; fi
      - name: Workflow contract regression
        run: node tests/issue-497-cross-binary-workflow.mjs
      - name: Accuracy merge regression
        run: |
          node tests/accuracy-merge.mjs --self-test
          node tests/accuracy-pseudoc-shard-merge.mjs --self-test
          node tests/accuracy-pseudoc-shard.test.mjs
          node tests/accuracy-result-validate.mjs --self-test
      - name: Syntax lint
        run: npm run lint
      - name: Matcher scaling regression
        run: node tests/issue-500-matcher-budget.mjs
      - name: Core tests for standalone manual validation
        if: github.event_name == 'workflow_dispatch'
        run: npm test
      - name: Download accuracy partitions
        uses: actions/download-artifact@v4
        with:
          pattern: accuracy-part-*
          merge-multiple: true
      - name: Validate downloaded accuracy partitions
        shell: bash
        run: |
          set -euo pipefail
          core='sections,funcs,funcs-guess,disasm,kinds,calls,refs,imports,objc,selstub,strings,xrefs,funcname,selffield,role,apimeaning,summary,expr,formula'
          for target in BattleCats YWP TsumTsum; do
            node tests/accuracy-result-validate.mjs "accuracy-part-${target}-core.json" --expect="$core"
            node tests/accuracy-result-validate.mjs "accuracy-part-${target}-pinpoint.json" --expect='pinpoint,pinpoint-partial'
            node tests/accuracy-result-validate.mjs "accuracy-part-${target}-pseudoc.json" --expect='pseudoc'
          done
      - name: Merge complete target results
        run: |
          node tests/accuracy-merge.mjs accuracy-BattleCats.json accuracy-part-BattleCats-*.json
          node tests/accuracy-merge.mjs accuracy-YWP.json accuracy-part-YWP-*.json
          node tests/accuracy-merge.mjs accuracy-TsumTsum.json accuracy-part-TsumTsum-*.json
      - name: Accuracy regression gate
        run: node tests/accuracy-gate.mjs
      - name: Structured baseline report
        run: node tools/benchmark/accuracy-report.mjs --output=accuracy-baseline-report.json
      - name: Current-main baseline regression gate
        run: node tools/benchmark/compare.mjs --accuracy=accuracy-baseline-report.json
      - name: Upload combined results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: |
            accuracy-BattleCats.json
            accuracy-YWP.json
            accuracy-TsumTsum.json
            accuracy-baseline-report.json
          if-no-files-found: error
