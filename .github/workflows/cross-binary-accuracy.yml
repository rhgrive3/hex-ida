name: Cross-binary accuracy

# Required real-binary accuracy gate.
# Every pinned fixture and every accuracy feature still runs. Heavy work is
# split by the existing measurement boundaries so independent partitions can
# use independent hosted runners without overlapping 4 GiB Node heaps.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/**'
      - '!js/ai/**'
      - '!js/ui/**'
      - '!js/managed/**'
      - '!js/userscript/**'
      - 'tests/accuracy*.mjs'
      - 'tests/harness.mjs'
      - 'tests/fixtures/real-binaries.json'
      - 'tests/oracle.py'
      - 'tests/oracle-cfg-normalize.py'
      - 'tests/oracle-requirements.txt'
      - 'tests/issue-497-cross-binary-workflow.mjs'
      - 'tests/issue-500-matcher-budget.mjs'
      - 'tools/benchmark/**'
      - 'scripts/fetch-real-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/cross-binary-accuracy.yml'
  push:
    branches: [main]
    paths:
      - 'js/**'
      - '!js/ai/**'
      - '!js/ui/**'
      - '!js/managed/**'
      - '!js/userscript/**'
      - 'tests/accuracy*.mjs'
      - 'tests/harness.mjs'
      - 'tests/fixtures/real-binaries.json'
      - 'tests/oracle.py'
      - 'tests/oracle-cfg-normalize.py'
      - 'tests/oracle-requirements.txt'
      - 'tests/issue-497-cross-binary-workflow.mjs'
      - 'tests/issue-500-matcher-budget.mjs'
      - 'tools/benchmark/**'
      - 'scripts/fetch-real-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/cross-binary-accuracy.yml'

concurrency:
  group: cross-binary-accuracy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
  HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP
  FIXTURE_SOURCE_REV: bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9
  ORACLE_PYTHON_VERSION: '3.12.13'
  LOCAL_PSEUDOC_WORKERS: 2
  PSEUDOC_SHARD_COUNT: 4

jobs:
  preflight:
    name: accuracy-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workflow contract regression
        run: node tests/issue-497-cross-binary-workflow.mjs
      - name: Accuracy merge regression
        run: |
          node tests/accuracy-merge.mjs --self-test
          node tests/accuracy-pseudoc-shard-merge.mjs --self-test
          node tests/accuracy-pseudoc-shard.test.mjs
          node tests/accuracy-result-validate.mjs --self-test
      - name: Syntax lint
        run: npm run lint
      - name: Matcher scaling regression
        run: node tests/issue-500-matcher-budget.mjs
      - name: Require all real fixture URLs
        shell: bash
        run: |
          test -n "$HEX_FIXTURE_BATTLECATS_URL"
          test -n "$HEX_FIXTURE_TSUMTSUM_URL"
          test -n "$HEX_FIXTURE_YWP_URL"

  prepare:
    name: prepare-${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target:
          - name: BattleCats
            fixture: battlecats
            file: battlecats
            oracle: tests/oracle.battlecats.ci.json.gz
          - name: YWP
            fixture: YWP
            file: YWP
            oracle: tests/oracle.YWP.ci.json.gz
          - name: TsumTsum
            fixture: TsumTsum
            file: TsumTsum
            oracle: tests/oracle.TsumTsum.ci.json.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact fixture cache key
        id: fixture-key
        shell: bash
        env:
          FIXTURE_INPUT_HASH: ${{ hashFiles('tests/fixtures/real-binaries.json', 'scripts/fetch-real-fixtures.mjs') }}
        run: |
          echo "key=cross-binary-fixture-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.fixture }}-${FIXTURE_SOURCE_REV}-${FIXTURE_INPUT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore pinned fixture cache
        id: fixture-cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.real-fixtures/${{ matrix.target.file }}
          key: ${{ steps.fixture-key.outputs.key }}
      - name: Fetch pinned real fixture on cache miss
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-real-fixtures.mjs "${{ matrix.target.fixture }}"
      - name: Validate pinned real fixture
        run: |
          node scripts/fetch-real-fixtures.mjs "${{ matrix.target.fixture }}" --check
          file "tests/.real-fixtures/${{ matrix.target.file }}"
      - name: Save pinned fixture cache
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/.real-fixtures/${{ matrix.target.file }}
          key: ${{ steps.fixture-key.outputs.key }}

      - name: Build exact oracle cache key
        id: oracle-key
        shell: bash
        env:
          ORACLE_INPUT_HASH: ${{ hashFiles('tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt') }}
        run: |
          echo "key=cross-binary-oracle-v3-${{ runner.os }}-${{ runner.arch }}-py${ORACLE_PYTHON_VERSION}-${{ matrix.target.fixture }}-${ORACLE_INPUT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore exact oracle cache
        id: oracle-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.target.oracle }}
          key: ${{ steps.oracle-key.outputs.key }}
      - name: Validate cached oracle
        if: steps.oracle-cache.outputs.cache-hit == 'true'
        run: |
          test -s "${{ matrix.target.oracle }}"
          gzip -t "${{ matrix.target.oracle }}"
      - uses: actions/setup-python@v5
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          python-version: ${{ env.ORACLE_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/oracle-requirements.txt
      - name: Install pinned oracle dependencies
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check -r tests/oracle-requirements.txt
      - name: Generate oracle on cache miss
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: |
          python tests/oracle.py "tests/.real-fixtures/${{ matrix.target.file }}" "${{ matrix.target.oracle }}"
          python tests/oracle-cfg-normalize.py "tests/.real-fixtures/${{ matrix.target.file }}" "${{ matrix.target.oracle }}"
          gzip -t "${{ matrix.target.oracle }}"
      - name: Save exact oracle cache
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.target.oracle }}
          key: ${{ steps.oracle-key.outputs.key }}
      - name: Publish exact oracle for this run
        uses: actions/upload-artifact@v4
        with:
          name: cross-binary-oracle-${{ matrix.target.name }}
          path: ${{ matrix.target.oracle }}
          if-no-files-found: error
          retention-days: 1

  measure:
    name: accuracy-${{ matrix.target.name }}-${{ matrix.partition.name }}
    needs: [preflight, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        target:
          - name: BattleCats
            fixture: battlecats
            file: battlecats
            oracle: tests/oracle.battlecats.ci.json.gz
          - name: YWP
            fixture: YWP
            file: YWP
            oracle: tests/oracle.YWP.ci.json.gz
          - name: TsumTsum
            fixture: TsumTsum
            file: TsumTsum
            oracle: tests/oracle.TsumTsum.ci.json.gz
        partition:
          - name: nonpseudoc-0
            kind: accuracy
            only: sections,funcs,funcs-guess,disasm,kinds,calls,refs,imports,objc,selstub,pinpoint
            expect: sections,funcs,funcs-guess,disasm,kinds,calls,refs,imports,objc,selstub,pinpoint
          - name: nonpseudoc-1
            kind: accuracy
            only: strings,xrefs,funcname,selffield,role,apimeaning,summary,expr,formula,pinpoint-partial
            expect: strings,xrefs,funcname,selffield,role,apimeaning,summary,expr,formula,pinpoint-partial
          - name: pseudoc-0
            kind: pseudoc
            shardIndex: 0
            shardCount: 4
            expect: pseudoc
          - name: pseudoc-1
            kind: pseudoc
            shardIndex: 1
            shardCount: 4
            expect: pseudoc
          - name: pseudoc-2
            kind: pseudoc
            shardIndex: 2
            shardCount: 4
            expect: pseudoc
          - name: pseudoc-3
            kind: pseudoc
            shardIndex: 3
            shardCount: 4
            expect: pseudoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact result cache key
        id: result-key
        shell: bash
        env:
          COMMON_HASH: ${{ hashFiles('js/**', 'tests/harness.mjs', 'tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt', 'scripts/fetch-real-fixtures.mjs', 'package.json', '!js/ai/**', '!js/ui/**', '!js/managed/**', '!js/userscript/**') }}
          NONPSEUDOC_HASH: ${{ hashFiles('tests/accuracy.mjs', 'tests/accuracy-base.mjs', 'tests/accuracy-short-selector.mjs') }}
          PSEUDOC_HASH: ${{ hashFiles('tests/accuracy-pseudoc-parallel.mjs', 'tests/accuracy-pseudoc-worker.mjs', 'tests/accuracy-pseudoc-eval.mjs', 'tests/accuracy-pseudoc-shard-oracle.mjs', 'tests/accuracy-pseudoc-shard-merge.mjs') }}
          PARTITION_KIND: ${{ matrix.partition.kind }}
          PARTITION_ONLY: ${{ matrix.partition.only }}
          SHARD_INDEX: ${{ matrix.partition.shardIndex }}
          SHARD_COUNT: ${{ matrix.partition.shardCount }}
        run: |
          set -euo pipefail
          if [[ "$PARTITION_KIND" == "pseudoc" ]]; then
            KIND_HASH="$PSEUDOC_HASH"
            CONTRACT="${PARTITION_KIND}:${SHARD_INDEX}:${SHARD_COUNT}:workers=${LOCAL_PSEUDOC_WORKERS}"
          else
            KIND_HASH="$NONPSEUDOC_HASH"
            CONTRACT="${PARTITION_KIND}:${PARTITION_ONLY}:heap=4096"
          fi
          DIGEST="$(printf '%s\n' "${COMMON_HASH}:${KIND_HASH}:${CONTRACT}" | sha256sum | cut -d' ' -f1)"
          echo "key=accuracy-result-v8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.name }}-${{ matrix.partition.name }}-${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Restore exact partition result cache
        id: result-cache
        uses: actions/cache/restore@v4
        with:
          path: accuracy-part-${{ matrix.target.name }}-${{ matrix.partition.name }}.json
          key: ${{ steps.result-key.outputs.key }}
      - name: Validate restored partition result
        if: steps.result-cache.outputs.cache-hit == 'true'
        run: |
          node tests/accuracy-result-validate.mjs \
            "accuracy-part-${{ matrix.target.name }}-${{ matrix.partition.name }}.json" \
            --expect='${{ matrix.partition.expect }}'

      - name: Build exact fixture cache key
        if: steps.result-cache.outputs.cache-hit != 'true'
        id: fixture-key
        shell: bash
        env:
          FIXTURE_INPUT_HASH: ${{ hashFiles('tests/fixtures/real-binaries.json', 'scripts/fetch-real-fixtures.mjs') }}
        run: |
          echo "key=cross-binary-fixture-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.fixture }}-${FIXTURE_SOURCE_REV}-${FIXTURE_INPUT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore prepared fixture cache
        if: steps.result-cache.outputs.cache-hit != 'true'
        id: fixture-cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.real-fixtures/${{ matrix.target.file }}
          key: ${{ steps.fixture-key.outputs.key }}
      - name: Fetch pinned fixture if prepared cache is unavailable
        if: steps.result-cache.outputs.cache-hit != 'true' && steps.fixture-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-real-fixtures.mjs "${{ matrix.target.fixture }}"
      - name: Validate required fixture
        if: steps.result-cache.outputs.cache-hit != 'true'
        run: |
          node scripts/fetch-real-fixtures.mjs "${{ matrix.target.fixture }}" --check
          file "tests/.real-fixtures/${{ matrix.target.file }}"
      - name: Download exact oracle
        if: steps.result-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: cross-binary-oracle-${{ matrix.target.name }}
          path: tests
      - name: Validate required oracle
        if: steps.result-cache.outputs.cache-hit != 'true'
        run: |
          test -s "${{ matrix.target.oracle }}"
          gzip -t "${{ matrix.target.oracle }}"

      - name: Measure non-pseudocode partition
        if: steps.result-cache.outputs.cache-hit != 'true' && matrix.partition.kind == 'accuracy'
        shell: bash
        run: |
          set -euo pipefail
          output="accuracy-part-${{ matrix.target.name }}-${{ matrix.partition.name }}.json"
          tmp="${output}.tmp"
          log="${output}.log"
          rm -f "$tmp" "$log"
          if ! node --max-old-space-size=4096 tests/accuracy.mjs \
            --target="tests/.real-fixtures/${{ matrix.target.file }}" \
            --oracle="${{ matrix.target.oracle }}" \
            --only='${{ matrix.partition.only }}' \
            --json > "$tmp" 2> "$log"; then
            cat "$log"
            exit 1
          fi
          cat "$log"
          node tests/accuracy-result-validate.mjs "$tmp" --expect='${{ matrix.partition.expect }}'
          mv "$tmp" "$output"

      - name: Measure pseudocode shard
        if: steps.result-cache.outputs.cache-hit != 'true' && matrix.partition.kind == 'pseudoc'
        shell: bash
        run: |
          set -euo pipefail
          output="accuracy-part-${{ matrix.target.name }}-${{ matrix.partition.name }}.json"
          tmp="${output}.tmp"
          log="${output}.log"
          rm -f "$tmp" "$log"
          if ! node tests/accuracy-pseudoc-parallel.mjs \
            --target="tests/.real-fixtures/${{ matrix.target.file }}" \
            --oracle="${{ matrix.target.oracle }}" \
            --workers="$LOCAL_PSEUDOC_WORKERS" \
            --shard-index="${{ matrix.partition.shardIndex }}" \
            --shard-count="${{ matrix.partition.shardCount }}" \
            --json > "$tmp" 2> "$log"; then
            cat "$log"
            exit 1
          fi
          cat "$log"
          node tests/accuracy-result-validate.mjs "$tmp" --expect='pseudoc'
          mv "$tmp" "$output"

      - name: Save exact partition result cache
        if: success() && steps.result-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: accuracy-part-${{ matrix.target.name }}-${{ matrix.partition.name }}.json
          key: ${{ steps.result-key.outputs.key }}
      - name: Upload validated partition result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-part-${{ matrix.target.name }}-${{ matrix.partition.name }}
          path: accuracy-part-${{ matrix.target.name }}-${{ matrix.partition.name }}.json
          if-no-files-found: error
          retention-days: 1

  accuracy:
    name: accuracy
    if: always()
    needs: [preflight, prepare, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require complete measurement topology
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
        shell: bash
        run: |
          if [[ "$PREFLIGHT_RESULT" != "success" || "$PREPARE_RESULT" != "success" || "$MEASURE_RESULT" != "success" ]]; then
            echo "::error::Cross-binary prerequisites failed (preflight=$PREFLIGHT_RESULT prepare=$PREPARE_RESULT measure=$MEASURE_RESULT)."
            exit 1
          fi
      - name: Core tests for standalone manual validation
        if: github.event_name == 'workflow_dispatch'
        run: npm test
      - name: Download accuracy partitions
        uses: actions/download-artifact@v4
        with:
          pattern: accuracy-part-*
          merge-multiple: true
      - name: Validate complete partition matrix
        shell: bash
        run: |
          set -euo pipefail
          np0='sections,funcs,funcs-guess,disasm,kinds,calls,refs,imports,objc,selstub,pinpoint'
          np1='strings,xrefs,funcname,selffield,role,apimeaning,summary,expr,formula,pinpoint-partial'
          for target in BattleCats YWP TsumTsum; do
            node tests/accuracy-result-validate.mjs "accuracy-part-${target}-nonpseudoc-0.json" --expect="$np0"
            node tests/accuracy-result-validate.mjs "accuracy-part-${target}-nonpseudoc-1.json" --expect="$np1"
            for shard in 0 1 2 3; do
              node tests/accuracy-result-validate.mjs "accuracy-part-${target}-pseudoc-${shard}.json" --expect='pseudoc'
            done
          done
      - name: Merge pseudocode shards
        run: |
          node tests/accuracy-pseudoc-shard-merge.mjs accuracy-part-BattleCats-pseudoc.json accuracy-part-BattleCats-pseudoc-0.json accuracy-part-BattleCats-pseudoc-1.json accuracy-part-BattleCats-pseudoc-2.json accuracy-part-BattleCats-pseudoc-3.json
          node tests/accuracy-pseudoc-shard-merge.mjs accuracy-part-YWP-pseudoc.json accuracy-part-YWP-pseudoc-0.json accuracy-part-YWP-pseudoc-1.json accuracy-part-YWP-pseudoc-2.json accuracy-part-YWP-pseudoc-3.json
          node tests/accuracy-pseudoc-shard-merge.mjs accuracy-part-TsumTsum-pseudoc.json accuracy-part-TsumTsum-pseudoc-0.json accuracy-part-TsumTsum-pseudoc-1.json accuracy-part-TsumTsum-pseudoc-2.json accuracy-part-TsumTsum-pseudoc-3.json
      - name: Merge complete target results
        run: |
          node tests/accuracy-merge.mjs accuracy-BattleCats.json accuracy-part-BattleCats-nonpseudoc-0.json accuracy-part-BattleCats-nonpseudoc-1.json accuracy-part-BattleCats-pseudoc.json
          node tests/accuracy-merge.mjs accuracy-YWP.json accuracy-part-YWP-nonpseudoc-0.json accuracy-part-YWP-nonpseudoc-1.json accuracy-part-YWP-pseudoc.json
          node tests/accuracy-merge.mjs accuracy-TsumTsum.json accuracy-part-TsumTsum-nonpseudoc-0.json accuracy-part-TsumTsum-nonpseudoc-1.json accuracy-part-TsumTsum-pseudoc.json
      - name: Accuracy regression gate
        run: node tests/accuracy-gate.mjs
      - name: Structured baseline report
        run: node tools/benchmark/accuracy-report.mjs --output=accuracy-baseline-report.json
      - name: Current-main baseline regression gate
        run: node tools/benchmark/compare.mjs --accuracy=accuracy-baseline-report.json
      - name: Upload combined results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: |
            accuracy-BattleCats.json
            accuracy-YWP.json
            accuracy-TsumTsum.json
            accuracy-baseline-report.json
          if-no-files-found: error
