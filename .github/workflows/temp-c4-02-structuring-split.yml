name: Temporary C4-02 structuring split
on:
  push:
    branches: ['impl/c4-02-finish-20260916']
    paths: ['.github/workflows/temp-c4-02-structuring-split.yml']
permissions:
  contents: read
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ACCEPT_HEAD: a64e8d8c91a4c38a9b8b9410bba7a0ade64556e3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.ACCEPT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run structuring files individually
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/status.txt
          failed=0
          for f in tests/phase8/structuring/*.test.mjs; do
            if node --test "$f" >/dev/null 2>&1; then
              echo "PASS $f" >> /tmp/status.txt
            else
              echo "FAIL $f" >> /tmp/status.txt
              failed=1
            fi
          done
          cat /tmp/status.txt
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4-02-structuring-split
          path: /tmp/status.txt
          retention-days: 1
