name: Stage A competitive twin feasibility

on:
  push:
    branches: [diag/stage-a-competitive-twin-20260918]
    paths: [.github/workflows/stage-a-competitive-twin-diag.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e66b7b7d896cf8a084423cf804254e70fbd16038
          fetch-depth: 1
          persist-credentials: false
      - name: Probe real same-binary toolchains
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/t.c" <<'C'
          __attribute__((noinline)) long twin(long a,long b){ return (a*3)+(b^7); }
          C
          clang=$(command -v clang)
          strip=$(command -v llvm-strip || command -v strip)
          {
            echo "clang=$($clang --version | head -n1)"
            echo "strip=$($strip --version | head -n1)"
          } > /tmp/twin-probe.txt

          "$clang" -g -O0 -fno-omit-frame-pointer "$tmp/t.c" -o "$tmp/x86-debug.elf"
          cp "$tmp/x86-debug.elf" "$tmp/x86-stripped.elf"
          "$strip" --strip-debug -- "$tmp/x86-stripped.elf"
          echo "x86=PASS $(sha256sum "$tmp/x86-debug.elf" "$tmp/x86-stripped.elf" | tr '\n' ' ')" >> /tmp/twin-probe.txt

          "$clang" --target=riscv64-unknown-linux-gnu -g -O0 -c "$tmp/t.c" -o "$tmp/rv-debug.o"
          cp "$tmp/rv-debug.o" "$tmp/rv-stripped.o"
          "$strip" --strip-debug -- "$tmp/rv-stripped.o"
          echo "riscv=PASS $(sha256sum "$tmp/rv-debug.o" "$tmp/rv-stripped.o" | tr '\n' ' ')" >> /tmp/twin-probe.txt

          "$clang" --target=x86_64-apple-macos11 -g -O0 -c "$tmp/t.c" -o "$tmp/mx.o"
          "$clang" --target=arm64-apple-macos11 -g -O0 -c "$tmp/t.c" -o "$tmp/ma.o"
          python3 - "$tmp/mx.o" "$tmp/ma.o" "$tmp/fat-debug.macho" <<'PY'
          import os,struct,sys
          x,a,out=sys.argv[1:]
          blobs=[(0x01000007,3,open(x,'rb').read()),(0x0100000c,0,open(a,'rb').read())]
          align=12; header=8+20*len(blobs); pos=(header+(1<<align)-1)&~((1<<align)-1); rows=[]; parts=[]
          for cpu,sub,b in blobs:
              off=pos; rows.append((cpu,sub,off,len(b),align)); parts.append((off,b)); pos=(off+len(b)+(1<<align)-1)&~((1<<align)-1)
          data=bytearray(pos); struct.pack_into('>II',data,0,0xcafebabe,len(rows))
          for i,row in enumerate(rows): struct.pack_into('>IIIII',data,8+i*20,*row)
          for off,b in parts: data[off:off+len(b)]=b
          open(out,'wb').write(data)
          PY
          cp "$tmp/fat-debug.macho" "$tmp/fat-stripped.macho"
          set +e
          "$strip" --strip-debug -- "$tmp/fat-stripped.macho" >/tmp/fat-strip.out 2>&1
          st=$?
          set -e
          if [ "$st" -eq 0 ]; then
            echo "universal=PASS $(sha256sum "$tmp/fat-debug.macho" "$tmp/fat-stripped.macho" | tr '\n' ' ')" >> /tmp/twin-probe.txt
          else
            echo "universal=FAIL status=$st $(tail -n 5 /tmp/fat-strip.out | tr '\n' ' ')" >> /tmp/twin-probe.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: competitive-twin-probe
          path: /tmp/twin-probe.txt
          retention-days: 1
