name: diag-7036-main-conflicts
on:
  push:
    branches:
      - diag/7036-main-conflicts-d7d
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture merge conflicts only
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/diag-7036-main-conflicts.txt
          : > "$STATUS"
          HEAD_SHA=d7d79ee29ef92e33d1007c62a4304f45b18916c0
          MAIN_SHA=012cacc48ec2cd9bde8a5b8a98b77f4a89f9a736
          timeout 90s git fetch --no-tags origin main "$HEAD_SHA" >/tmp/fetch.log 2>&1
          rc=$?
          echo "fetch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/fetch.log >> "$STATUS"; exit "$rc"; fi
          git checkout --detach "$HEAD_SHA" >/tmp/checkout.log 2>&1
          rc=$?
          echo "checkout rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/checkout.log >> "$STATUS"; exit "$rc"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          timeout 120s git merge --no-commit --no-ff "$MAIN_SHA" >/tmp/merge.log 2>&1
          rc=$?
          echo "merge rc=$rc" >> "$STATUS"
          echo "head=$HEAD_SHA" >> "$STATUS"
          echo "main=$MAIN_SHA" >> "$STATUS"
          if [ "$rc" -eq 0 ]; then
            echo 'conflicts=0' >> "$STATUS"
            git merge --abort >/dev/null 2>&1 || true
            exit 0
          fi
          git diff --name-only --diff-filter=U | sort -u >/tmp/conflicts.txt
          count=$(wc -l < /tmp/conflicts.txt | tr -d ' ')
          echo "conflicts=$count" >> "$STATUS"
          cat /tmp/conflicts.txt >> "$STATUS"
          git merge --abort >/dev/null 2>&1 || true
          exit 1
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-main-conflicts
          path: /tmp/diag-7036-main-conflicts.txt
          retention-days: 1
