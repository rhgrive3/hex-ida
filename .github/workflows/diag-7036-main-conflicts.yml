name: diag-7036-main-conflicts
on:
  push:
    branches:
      - diag/7036-main-conflicts-f8c8
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture merge conflicts only
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/diag-7036-conflicts.txt
          : > "$STATUS"
          PR_HEAD=f8c8e281d940ab9d5f1b20d15398095f64cb50f7
          MAIN_HEAD=4d68cb6bf67622f7f3887e821388a2788cbd34fc
          timeout 90s git fetch --no-tags origin "$PR_HEAD" "$MAIN_HEAD" >/tmp/fetch.log 2>&1
          rc=$?
          echo "fetch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/fetch.log >> "$STATUS"; exit "$rc"; fi
          git checkout --detach "$PR_HEAD" >/tmp/checkout.log 2>&1
          rc=$?
          echo "checkout rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/checkout.log >> "$STATUS"; exit "$rc"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          timeout 120s git merge --no-commit --no-ff "$MAIN_HEAD" >/tmp/merge.log 2>&1
          rc=$?
          echo "merge rc=$rc" >> "$STATUS"
          echo 'conflicts:' >> "$STATUS"
          git diff --name-only --diff-filter=U >> "$STATUS"
          echo "conflict_count=$(git diff --name-only --diff-filter=U | wc -l)" >> "$STATUS"
          if [ "$rc" -eq 0 ]; then git merge --abort >/dev/null 2>&1 || true; fi
          exit 0
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-main-conflicts
          path: /tmp/diag-7036-conflicts.txt
          retention-days: 1
