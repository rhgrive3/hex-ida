name: Apply review fix 9088

on:
  push:
    branches:
      - fix/issue-9009-final-authority-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-9009-final-authority-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply staged review fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .review-staging/part-000 | gzip -d > /tmp/review-fix.patch
          git apply --check /tmp/review-fix.patch
          git apply /tmp/review-fix.patch
          rm .review-staging/part-000
          rm .github/workflows/apply-review-fix-9088.yml
      - name: Validate focused regression
        run: node --test tests/phase12/adversarial/issue-9009-verified-record-cannot-authorize-unrelated-final-claim.test.mjs tests/phase12/adversarial/issue-8864-planner-evidence-authority.test.mjs tests/phase12/adversarial/issue-4047-ai-confirmed-facts-authority.test.mjs
      - name: Validate syntax lint
        run: node tests/check.mjs
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ai): require explicit deterministic final provenance (#9009)'
          git push origin HEAD:fix/issue-9009-final-authority-v2
