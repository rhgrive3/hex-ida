name: Temporary pinpoint current-main reconciliation 2

on:
  push:
    branches:
      - fix/pinpoint-ui-cancellation-stall
    paths:
      - .github/workflows/tmp-pinpoint-reconcile2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pinpoint-ui-cancellation-stall
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge exact fetched main and rebuild generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          echo "Reconciling main $main_sha"
          set +e
          git merge --no-commit --no-ff FETCH_HEAD
          merge_rc=$?
          set -e
          if [[ $merge_rc -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(userscript/hex\.user\.template\.js|userscript/release-version\.json)$' || true)"
            if [[ -n "$unexpected" ]]; then
              echo 'Unexpected non-generated merge conflicts:' >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              git checkout --theirs -- "$file"
              git add -- "$file"
            done <<< "$conflicts"
          fi

          npm ci
          npm run userscript:build
          git restore --source=HEAD --worktree -- js/userscript/deployment-identity.generated.js

          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(userscript/hex\.user\.template\.js|userscript/release-version\.json|\.github/workflows/tmp-pinpoint-reconcile2\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Canonical build changed unexpected files:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          node tests/pinpoint-ui-runtime.mjs
          node --check js/ui/pinpoint-runtime.js
          node --check js/panels-base.js
          node tests/panels-compat-surface-base.mjs
          node tests/ir-pinpoint-location.mjs
          node tests/ai-analysis-boundary-base.mjs

      - name: Commit exact-main reconciliation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-pinpoint-reconcile2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "merge: reconcile pinpoint fix with exact current main"
          git push origin HEAD:fix/pinpoint-ui-cancellation-stall
