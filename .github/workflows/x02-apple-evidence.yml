name: X-02 Apple evidence

on:
  workflow_dispatch:
  push:
    branches:
      - feat/analysis-roadmap-v8-current-main-20260907
    paths:
      - .github/workflows/x02-apple-evidence.yml

permissions:
  contents: read

concurrency:
  group: x02-apple-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-evidence:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record Apple environment provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/x02-apple
          {
            echo "github_sha=${GITHUB_SHA}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "runner_os=${RUNNER_OS}"
            echo "uname=$(uname -a)"
            echo "machine=$(uname -m)"
            echo "sw_vers_begin"
            sw_vers
            echo "sw_vers_end"
            echo "xcode_begin"
            xcodebuild -version
            echo "xcode_end"
            echo "sdk_path=$(xcrun --sdk macosx --show-sdk-path)"
            echo "sdk_version=$(xcrun --sdk macosx --show-sdk-version)"
            echo "clang_path=$(xcrun --find clang)"
            echo "clang_version_begin"
            xcrun clang --version
            echo "clang_version_end"
            CLANG_PATH="$(xcrun --find clang)"
            echo "clang_sha256=$(shasum -a 256 "$CLANG_PATH" | awk '{print $1}')"
            echo "pauth=$(sysctl -n hw.optional.arm.FEAT_PAuth 2>/dev/null || true)"
            echo "armv8_3=$(sysctl -n hw.optional.armv8_3 2>/dev/null || true)"
          } | tee evidence/x02-apple/environment.txt

      - name: Verify genuine Apple-signed Mach-O
        shell: bash
        run: |
          set -euo pipefail
          BIN=/usr/bin/true
          {
            echo "binary=$BIN"
            file "$BIN"
            shasum -a 256 "$BIN"
            echo "codesign_verify_begin"
            codesign --verify --strict --verbose=4 "$BIN"
            echo "codesign_verify_end"
            echo "codesign_display_begin"
            codesign --display --verbose=4 "$BIN" 2>&1
            echo "codesign_display_end"
            set +e
            spctl --assess --type execute -vv "$BIN" 2>&1
            echo "spctl_exit=$?"
            set -e
          } | tee evidence/x02-apple/signed-macho.txt

      - name: Locate real dyld shared cache
        id: dyld
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          roots = [
              Path('/System/Library/dyld'),
              Path('/System/Cryptexes/OS/System/Library/dyld'),
              Path('/System/Volumes/Preboot/Cryptexes/OS/System/Library/dyld'),
          ]
          wanted = {'dyld_shared_cache_arm64e': 0, 'dyld_shared_cache_arm64': 1}
          candidates = []
          inspected = []
          for root in roots:
              if not root.exists():
                  continue
              inspected.append(str(root))
              for current, dirs, files in os.walk(root):
                  rel_depth = len(Path(current).relative_to(root).parts)
                  if rel_depth >= 3:
                      dirs[:] = []
                  for name in files:
                      if name in wanted:
                          p = Path(current) / name
                          try:
                              st = p.stat()
                          except OSError:
                              continue
                          candidates.append((wanted[name], -st.st_size, str(p), st.st_size))
          candidates.sort()
          selected = candidates[0] if candidates else None
          out = Path('evidence/x02-apple')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'dyld-scan.txt').write_text(
              'inspected=' + ','.join(inspected) + '\n' +
              '\n'.join(f'candidate={p} size={size}' for _, _, p, size in candidates) + '\n',
              encoding='utf-8'
          )
          path = selected[2] if selected else ''
          (out / 'dyld-path.txt').write_text(path + '\n', encoding='utf-8')
          print(path)
          PY
          CACHE="$(cat evidence/x02-apple/dyld-path.txt | tr -d '\r\n')"
          if [ -n "$CACHE" ]; then
            echo "cache_found=true" >> "$GITHUB_OUTPUT"
            echo "cache_path=$CACHE" >> "$GITHUB_OUTPUT"
          else
            echo "cache_found=false" >> "$GITHUB_OUTPUT"
          fi
          cat evidence/x02-apple/dyld-scan.txt

      - name: Parse real dyld cache with Hex and record slide/rebase provenance
        if: steps.dyld.outputs.cache_found == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import fsp from 'node:fs/promises';
          import crypto from 'node:crypto';
          import { parseDyldSharedCacheSource } from './js/binary/dyld-shared-cache.js';

          const outDir = 'evidence/x02-apple';
          const cachePath = fs.readFileSync(`${outDir}/dyld-path.txt`, 'utf8').trim();
          const stat = await fsp.stat(cachePath, { bigint: true });
          const hash = crypto.createHash('sha256');
          for await (const chunk of fs.createReadStream(cachePath, { highWaterMark: 8 * 1024 * 1024 })) hash.update(chunk);
          const sha256 = hash.digest('hex');
          const handle = await fsp.open(cachePath, 'r');
          const source = {
            size: stat.size,
            maxReadLength: 16 * 1024 * 1024,
            async read(offset, length) {
              const position = Number(offset);
              if (!Number.isSafeInteger(position)) throw new Error('dyld read offset exceeds safe integer');
              const buffer = Buffer.alloc(length);
              const { bytesRead } = await handle.read(buffer, 0, length, position);
              return buffer.subarray(0, bytesRead);
            },
          };

          function compact(value, depth = 0, seen = new WeakSet()) {
            if (typeof value === 'bigint') return `0x${value.toString(16)}`;
            if (value == null || typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return value;
            if (depth >= 4) return Array.isArray(value) ? { arrayLength: value.length } : { objectKeys: Object.keys(value).slice(0, 40) };
            if (typeof value !== 'object') return String(value);
            if (seen.has(value)) return '[circular]';
            seen.add(value);
            if (Array.isArray(value)) return { arrayLength: value.length, sample: value.slice(0, 3).map((v) => compact(v, depth + 1, seen)) };
            const out = {};
            for (const key of Object.keys(value).slice(0, 80)) out[key] = compact(value[key], depth + 1, seen);
            return out;
          }

          const evidence = {
            schemaVersion: 'hex-x02-real-dyld-evidence/v1',
            githubSha: process.env.GITHUB_SHA,
            cachePath,
            cacheBytes: stat.size.toString(),
            cacheSha256: sha256,
            parserStatus: 'unknown',
          };
          try {
            const parsed = await parseDyldSharedCacheSource(source, { slide: 0n });
            evidence.parserStatus = 'pass';
            evidence.parsed = compact(parsed);
          } catch (error) {
            evidence.parserStatus = 'fail';
            evidence.error = { name: error?.name ?? 'Error', message: String(error?.message ?? error) };
            process.exitCode = 1;
          } finally {
            await handle.close();
            fs.writeFileSync(`${outDir}/real-dyld.json`, JSON.stringify(evidence, null, 2) + '\n');
            console.log(JSON.stringify(evidence, null, 2));
          }
          NODE

      - name: Compile and execute arm64e PAC probe
        continue-on-error: true
        shell: bash
        run: |
          set -u
          OUT=evidence/x02-apple
          cat > "$OUT/pac-probe.c" <<'C'
          #include <stdint.h>
          __attribute__((noinline)) static uintptr_t leaf(uintptr_t x) { return (x * 33u) ^ 0x5au; }
          __attribute__((noinline)) static uintptr_t caller(uintptr_t x) { return leaf(x) + 1u; }
          int main(int argc, char **argv) {
            (void)argv;
            uintptr_t x = (uintptr_t)argc;
            return caller(x) == (((x * 33u) ^ 0x5au) + 1u) ? 0 : 3;
          }
          C
          xcrun clang -arch arm64e -O1 -fno-omit-frame-pointer -msign-return-address=all "$OUT/pac-probe.c" -o "$OUT/pac-probe" >"$OUT/pac-compile.txt" 2>&1
          COMPILE_RC=$?
          if [ "$COMPILE_RC" -eq 0 ]; then
            codesign --force --sign - "$OUT/pac-probe" >>"$OUT/pac-compile.txt" 2>&1
            CODESIGN_RC=$?
            file "$OUT/pac-probe" > "$OUT/pac-file.txt" 2>&1
            otool -hv "$OUT/pac-probe" > "$OUT/pac-header.txt" 2>&1
            otool -tvV "$OUT/pac-probe" > "$OUT/pac-disassembly.txt" 2>&1
            "$OUT/pac-probe" > "$OUT/pac-run.txt" 2>&1
            RUN_RC=$?
          else
            CODESIGN_RC=99
            RUN_RC=99
          fi
          python3 - "$COMPILE_RC" "$CODESIGN_RC" "$RUN_RC" <<'PY'
          import json, pathlib, re, sys
          out = pathlib.Path('evidence/x02-apple')
          compile_rc, codesign_rc, run_rc = map(int, sys.argv[1:4])
          dis = (out / 'pac-disassembly.txt').read_text(errors='replace') if (out / 'pac-disassembly.txt').exists() else ''
          header = (out / 'pac-header.txt').read_text(errors='replace') if (out / 'pac-header.txt').exists() else ''
          f = (out / 'pac-file.txt').read_text(errors='replace') if (out / 'pac-file.txt').exists() else ''
          pac = bool(re.search(r'\bpac(?:i|d|ib|ia|da|db|ga)', dis, re.I))
          auth = bool(re.search(r'\b(?:auti|autd|retaa|retab)', dis, re.I))
          evidence = {
              'schemaVersion': 'hex-x02-arm64e-runtime-evidence/v1',
              'githubSha': __import__('os').environ.get('GITHUB_SHA'),
              'compileExit': compile_rc,
              'codesignExit': codesign_rc,
              'runExit': run_rc,
              'pacInstructionObserved': pac,
              'authOrAuthenticatedReturnObserved': auth,
              'file': f.strip(),
              'header': header[:12000],
              'status': 'pass' if compile_rc == 0 and codesign_rc == 0 and run_rc == 0 and pac and auth else 'environment-excluded-or-fail'
          }
          (out / 'pac-runtime.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY
          exit 0

      - name: Re-run finite X-02 acceptance lanes
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/scpa/x02-prior120-apple-version-matrix.test.mjs | tee evidence/x02-apple/prior120.txt
          node --test tests/scpa/x02-apple-version-matrix.test.mjs | tee evidence/x02-apple/public-matrix.txt
          node --test tests/scpa/x02-declared-metadata-boundaries.test.mjs | tee evidence/x02-apple/declared-boundaries.txt

      - name: Write evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "# X-02 Apple evidence"
            echo
            echo "- Head: \`${GITHUB_SHA}\`"
            echo "- Runner: \`${RUNNER_OS}/${RUNNER_ARCH}\`"
            echo "- Real dyld cache found: \`${{ steps.dyld.outputs.cache_found || 'false' }}\`"
            if [ -f evidence/x02-apple/real-dyld.json ]; then
              echo "- dyld evidence: \`real-dyld.json\`"
            fi
            if [ -f evidence/x02-apple/pac-runtime.json ]; then
              echo "- PAC runtime evidence: \`pac-runtime.json\`"
            fi
            echo "- Signed system Mach-O: \`signed-macho.txt\`"
            echo "- Apple environment provenance: \`environment.txt\`"
          } | tee evidence/x02-apple/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload minimal evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x02-apple-evidence-${{ github.sha }}
          path: evidence/x02-apple
          if-no-files-found: error
          retention-days: 14
