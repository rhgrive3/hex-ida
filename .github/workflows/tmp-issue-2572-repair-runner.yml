name: Temporary issue 2572 repair runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-issue-2572-repair-runner.yml'

permissions:
  contents: write

concurrency:
  group: issue-2572-repair-runner
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: fix/2572-legacy-notes-soundness
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restack sound fix and update the legacy contract regression
        shell: bash
        run: |
          set -euo pipefail
          expected_head=72368cdd2f8e191687be830ebfc087b942a3de20
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git hash-object js/names.js)" = 7c0eddc1bf7ad8d8db747391c56a107c9d7c3fa1
          test "$(git hash-object tests/phase9/integration/legacy-note-identity-soundness.test.mjs)" = 1628813e6fb7ef6e23c7a4fda4a16d985fe77b05
          cp js/names.js /tmp/issue-2572-names.js
          cp tests/phase9/integration/legacy-note-identity-soundness.test.mjs /tmp/issue-2572-regression.mjs

          git fetch origin main
          git reset --hard origin/main
          cp /tmp/issue-2572-names.js js/names.js
          mkdir -p tests/phase9/integration
          cp /tmp/issue-2572-regression.mjs tests/phase9/integration/legacy-note-identity-soundness.test.mjs

          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/run.js')
          s = p.read_text()
          old = """    const store = new NoteStore('v2|new-fingerprint', [old]);
    eq(store.nameOf(4096n), 'hpUpdate');
    eq(store.comment(4100n), 'old note');
    eq(store.migratedFrom, old);
    ok(mem.has('hex.notes.v2|new-fingerprint'), '新形式へコピーされていない');
    ok(mem.has('hex.notes.' + old), '移行時に旧データを消している');
"""
          new = """    const store = new NoteStore('v2|new-fingerprint', [old]);
    eq(store.nameOf(4096n), null);
    eq(store.comment(4100n), null);
    eq(store.migratedFrom, null);
    eq(store.legacyCandidate?.sourceId, old);
    ok(!mem.has('hex.notes.v2|new-fingerprint'), '未確認のlegacyメモを自動昇格している');
    ok(mem.has('hex.notes.' + old), '確認前に旧データを消している');

    ok(store.importLegacyCandidate(), '明示importに失敗した');
    eq(store.nameOf(4096n), 'hpUpdate');
    eq(store.comment(4100n), 'old note');
    eq(store.migratedFrom, old);
    ok(mem.has('hex.notes.v2|new-fingerprint'), '明示import後も新形式へコピーされていない');
    ok(mem.has('hex.notes.' + old), '移行時に旧データを消している');
"""
          if s.count(old) != 1:
              raise SystemExit(f'legacy regression source drifted: {s.count(old)} matches')
          p.write_text(s.replace(old, new, 1))
          PY

          git add js/names.js tests/run.js tests/phase9/integration/legacy-note-identity-soundness.test.mjs
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' js/names.js tests/phase9/integration/legacy-note-identity-soundness.test.mjs tests/run.js | sort)"
          test "$actual" = "$expected"
          node tests/run.js
          node --test tests/phase9/integration/legacy-note-identity-soundness.test.mjs

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(notes): quarantine weak legacy identity matches (#2572)'
          git push --force-with-lease=refs/heads/fix/2572-legacy-notes-soundness:$expected_head origin HEAD:fix/2572-legacy-notes-soundness

      - name: Remove this temporary runner from main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo 'main advanced; leave runner for explicit cleanup rather than overwrite newer work'
            exit 0
          fi
          git switch --detach origin/main
          git rm .github/workflows/tmp-issue-2572-repair-runner.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(ci): remove temporary issue 2572 repair runner'
          git push origin HEAD:main
