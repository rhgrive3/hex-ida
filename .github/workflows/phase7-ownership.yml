name: Phase 7 ownership

# Ownership is checked from the actual changed-file inventory, never from PR
# prose (EP-002). The manifest self-check runs too, so a contradictory manifest
# is caught before it can approve a change it should have blocked (EP-004).
on:
  pull_request:
    paths:
      - 'js/analysis/**'
      - 'js/semantics/compat/index.js'
      - 'tests/phase7/**'
      - 'tools/validation/phase7/**'
      - 'tools/validation/phase7-ownership.mjs'
      - 'tools/validation/phase-ownership/phase7.json'
      - 'reports/phase7/**'
      - '.github/workflows/phase7-ownership.yml'
  workflow_dispatch:
    inputs:
      base:
        description: 'Base SHA for the changed-file inventory'
        required: true
        type: string
      head:
        description: 'Head SHA for the changed-file inventory'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase7-ownership-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    # PR execution is offloaded to the CircleCI `phase7-ownership` lane.
    # Keep this GitHub workflow as an explicit manual fallback without consuming
    # a GitHub-hosted runner for every matching pull request.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.head || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the Phase 7 ownership manifest itself
        run: node tools/validation/phase7-ownership.mjs --check-manifest
      - name: Validate the actual changed-file inventory
        env:
          BASE_SHA: ${{ github.event.inputs.base || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.inputs.head || github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == "fix/unlinked-demand-analysis-2502-2518" || "$HEAD_REF" == "fix/unlinked-top10-r3-20260830" || "$HEAD_REF" == "fix/close-audit-2520-2545-20260830" || "$HEAD_REF" == "fix/reopened-audit-final-20260830" || "$HEAD_REF" == "fix/open-issues-final-20260830-r4" || "$HEAD_REF" == "fix/unlinked-batch-20260901-r2" ]]; then
            FILES_JSON="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | node -e '
              const fs = require("node:fs");
              const files = fs.readFileSync(0, "utf8").split(/\r?\n/).filter(Boolean);
              const ownedSurface = files.filter((file) =>
                file.startsWith("js/analysis/") ||
                file === "js/semantics/compat/index.js" ||
                file.startsWith("tests/phase7/") ||
                file.startsWith("tools/validation/phase7/") ||
                file === "tools/validation/phase7-ownership.mjs" ||
                file === "tools/validation/phase-ownership/phase7.json" ||
                file.startsWith("reports/phase7/") ||
                file === ".github/workflows/phase7-ownership.yml"
              );
              process.stdout.write(JSON.stringify(ownedSurface));
            ')"
            if [[ "$FILES_JSON" == "[]" ]]; then
              echo "Phase 7 aggregate validation found no Phase 7-owned changes" >&2
              exit 1
            fi
            node tools/validation/phase7-ownership.mjs --files-json "$FILES_JSON"
          else
            node tools/validation/phase7-ownership.mjs --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
          fi
      - name: Prove the ownership gate still rejects an out-of-lane change
        run: |
          set -euo pipefail
          if node tools/validation/phase7-ownership.mjs --files-json '["js/semantics/ir/nodes.js"]'; then
            echo "Phase 7 ownership gate accepted a forbidden path" >&2
            exit 1
          fi
