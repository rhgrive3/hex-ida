name: One-shot pointsto local strict boundaries
on:
  push:
    branches: [fix/pointsto-local-strict-boundaries-3031-3032]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tools/tmp-pointsto-local-strict.py
      - name: Validate
        run: |
          node --check js/analysis/pointsto/local.js
          node tests/phase7/pointsto-local-strict-boundaries-3031-3032.test.mjs
      - name: Commit clean materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-pointsto-local-strict.yml tools/tmp-pointsto-local-strict.py
          git add js/analysis/pointsto/local.js tests/phase7/pointsto-local-strict-boundaries-3031-3032.test.mjs
          git commit -m 'fix(pointsto): harden local evidence boundaries'
          git push
