name: One-shot agent tool boundaries
on:
  push:
    branches: [fix/agent-tool-boundaries-current-2956-2957]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-tool-boundaries-current-2956-2957
          fetch-depth: 0
      - run: python3 tools/one-shot-agent-tool-boundaries.py
      - run: node --check js/agent/tools.js
      - run: node tests/agent-capability-plane.mjs
      - name: Commit clean result
        run: |
          rm .github/workflows/one-shot-agent-tool-boundaries.yml tools/one-shot-agent-tool-boundaries.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(agent): reject coerced tool selection metadata"
          git push
