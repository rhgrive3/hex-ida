name: T016 focused verification

# Temporary focused verification for current-main T016 extraction.
on:
  push:
    branches:
      - recovery/t016-discovery-artifact-20260916
    paths:
      - .github/workflows/t016-focused.yml
      - js/analysis/index.js
      - js/analysis/discovery/artifact.js
      - js/analysis/discovery/canonical-value.js
      - js/rebuild/transaction-v2.js
      - tests/phase7/discovery/t016-discovery-preservation.test.mjs
      - tests/rebuild/t016-discovery-preservation.test.mjs

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run T016 discovery preservation
        shell: bash
        run: |
          set +e
          node --test tests/phase7/discovery/t016-discovery-preservation.test.mjs > /tmp/t016-discovery.out 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 100 /tmp/t016-discovery.out > /tmp/t016-first-failure.txt
            cat /tmp/t016-first-failure.txt >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          tail -n 30 /tmp/t016-discovery.out
      - name: Run T016 rebuild preservation
        shell: bash
        run: |
          set +e
          node --test tests/rebuild/t016-discovery-preservation.test.mjs > /tmp/t016-rebuild.out 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/t016-rebuild.out > /tmp/t016-first-failure.txt
            cat /tmp/t016-first-failure.txt >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          tail -n 40 /tmp/t016-rebuild.out
      - name: Run Phase 7 discovery subsystem
        shell: bash
        run: |
          set +e
          node --test tests/phase7/discovery/*.test.mjs > /tmp/t016-phase7.out 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/t016-phase7.out > /tmp/t016-first-failure.txt
            cat /tmp/t016-first-failure.txt >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          tail -n 40 /tmp/t016-phase7.out
      - name: Upload minimal first-failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: t016-first-failure
          path: /tmp/t016-first-failure.txt
          if-no-files-found: error
          retention-days: 1
