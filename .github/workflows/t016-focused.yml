name: T016 focused verification

# discovery + rebuild preservation after current-main wiring
on:
  push:
    branches:
      - recovery/t016-discovery-artifact-20260916
    paths:
      - .github/workflows/t016-focused.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Phase 7 discovery and T016 rebuild preservation
        shell: bash
        run: |
          set +e
          node --test tests/phase7/discovery/*.test.mjs tests/rebuild/t016-discovery-preservation.test.mjs > /tmp/t016.out 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/t016.out > /tmp/t016-first-failure.txt
            cat /tmp/t016-first-failure.txt >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          tail -n 50 /tmp/t016.out
      - name: Upload minimal first-failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: t016-first-failure
          path: /tmp/t016-first-failure.txt
          if-no-files-found: error
          retention-days: 1
