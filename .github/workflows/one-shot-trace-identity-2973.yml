name: One-shot trace identity evidence 2973
on:
  push:
    branches: [fix/trace-identity-evidence-current-2973]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply focused identity-evidence repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/runtime/trace-provider.js'); s=p.read_text()
          old="""      const identityEvidenceIds = Array.isArray(module.identityEvidenceIds) ? module.identityEvidenceIds : [];
                const hasProvenStaticIdentity = module.binaryId != null && (module.identityState === 'exact' || module.identityState === 'resolved' || identityEvidenceIds.length > 0);"""
          if old not in s:
              old="""      const identityEvidenceIds = Array.isArray(module.identityEvidenceIds) ? module.identityEvidenceIds : [];
                const hasProvenStaticIdentity = module.binaryId != null && (
                  module.identityState === 'exact' ||
                  module.identityState === 'resolved' ||
                  identityEvidenceIds.length > 0
                );"""
          new="""      const identityEvidenceIds = Array.isArray(module.identityEvidenceIds) ? module.identityEvidenceIds : [];
                const hasValidIdentityEvidence = identityEvidenceIds.length > 0
                  && identityEvidenceIds.every((id) => typeof id === 'string' && id.trim().length > 0);
                const hasProvenStaticIdentity = module.binaryId != null && (
                  module.identityState === 'exact' ||
                  module.identityState === 'resolved' ||
                  hasValidIdentityEvidence
                );"""
          if old not in s: raise SystemExit('trace identity evidence anchor drift')
          p.write_text(s.replace(old,new,1))
          Path('tests/phase10/trace-identity-evidence-2973.test.mjs').write_text(r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const source=fs.readFileSync(new URL('../../js/runtime/trace-provider.js',import.meta.url),'utf8');
          assert.ok(source.includes("identityEvidenceIds.every((id) => typeof id === 'string' && id.trim().length > 0)"));
          assert.ok(source.includes('||\n                  hasValidIdentityEvidence'));
          assert.ok(!source.includes('|| identityEvidenceIds.length > 0'));
          console.log('trace identity evidence 2973: PASS');
          ''')
          PY
      - run: node --check js/runtime/trace-provider.js
      - run: node tests/phase10/trace-identity-evidence-2973.test.mjs
      - run: npm run phase10:test
      - run: git diff --check
      - name: Commit production result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-trace-identity-2973.yml
          git add js/runtime/trace-provider.js tests/phase10/trace-identity-evidence-2973.test.mjs
          git commit -m 'fix(runtime): validate trace identity evidence ids'
          git push
