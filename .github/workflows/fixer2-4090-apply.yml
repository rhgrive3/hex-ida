name: Fixer 2 issue 4090 exact apply
on:
  push:
    branches:
      - fixer2/issue-4090-ptload-align
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/elf-core.js)" = "9647068c1701d8a8dcf63fe16656375b3ac9fd12"
          test "$(git hash-object tests/phase4/binary/issue-5888-elf-section-file-span-mapping.test.mjs)" = "86f76615341737d57872d1723bc9a887ef70882a"
          test "$(git hash-object tests/phase4/binary/issue-7610-elf-ptload-overlap.test.mjs)" = "2021b696eb7e404c211bab013c4f77ba5612589b"
          test ! -e tests/issue-4090-elf-pt-load-alignment.mjs
          printf '%s' '' | base64 -d > /tmp/issue-4090.patch
          test "$(sha256sum /tmp/issue-4090.patch | awk '{print $1}')" = "c621ffdb6b4732972edf69d15831395446f3c00f6f5f4a7e902550aa12fc1b4e"
          git apply --check /tmp/issue-4090.patch
          git apply /tmp/issue-4090.patch
          test "$(git hash-object js/binary/elf-core.js)" = "7633e9bfaf4e44a197272cc71648380b7ca4c3b0"
          test "$(git hash-object tests/issue-4090-elf-pt-load-alignment.mjs)" = "fdca08953303fa85c08bf998dc190200c8c5e82a"
          test "$(git hash-object tests/phase4/binary/issue-5888-elf-section-file-span-mapping.test.mjs)" = "7337bbc828f58db89a4495000be57185535a4f5d"
          test "$(git hash-object tests/phase4/binary/issue-7610-elf-ptload-overlap.test.mjs)" = "7f72a5caa272a5c3328edf02f8e14787ceb76c0e"
          node --check js/binary/elf-core.js
          node --test tests/issue-4090-elf-pt-load-alignment.mjs tests/phase4/binary/issue-5888-elf-section-file-span-mapping.test.mjs tests/phase4/binary/issue-7610-elf-ptload-overlap.test.mjs
      - name: Commit exact change and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fixer2-4090-apply.yml
          git config user.name 'Fixer 2 Binary'
          git config user.email 'fixer2@users.noreply.github.com'
          git add -A
          git commit -m 'fix(elf): validate PT_LOAD alignment (#4090)'
          git push origin HEAD:${GITHUB_REF_NAME}
