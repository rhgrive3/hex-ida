name: publish-arm64-dt-init-fini-window
on:
  push:
    branches:
      - tmp-arm64-dt-init-fini-window-stage

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout staging payload
        uses: actions/checkout@v4
        with:
          ref: tmp-arm64-dt-init-fini-window-stage
          fetch-depth: 1
          path: stage
      - name: Checkout exact PR 9203 head
        uses: actions/checkout@v4
        with:
          ref: 1122837fd0644ff2c0996b3dbfc9fa021303d2c8
          fetch-depth: 1
          path: work
      - name: Apply verified production fix and publish branch
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc stage/tmp/arm64-dt-window/fix.patch.gz > /tmp/fix.patch
          cd work
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git am /tmp/fix.patch
          test "$(git rev-parse HEAD^)" = "1122837fd0644ff2c0996b3dbfc9fa021303d2c8"
          test "$(git rev-parse HEAD^{tree})" = "f6f65ef10e63512207b1ed112fc49ddece2bc9c8"
          git push origin HEAD:refs/heads/fix/arm64-dt-init-fini-analysis-window
