name: publish-arm64-dt-init-fini-window
on:
  push:
    branches:
      - tmp-arm64-dt-init-fini-window-stage

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout staging payload
        uses: actions/checkout@v4
        with:
          ref: tmp-arm64-dt-init-fini-window-stage
          fetch-depth: 1
          path: stage
      - name: Checkout target PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/arm64-dt-init-fini-analysis-window
          fetch-depth: 2
          path: work
      - name: Verify target head
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4f19c0b8106503487475af15e95fd87b6420ecd1"
      - name: Expand review fix
        shell: bash
        run: |
          set -euo pipefail
          gzip -t stage/tmp/arm64-dt-window/coderabbit-fix.patch.gz
          gzip -dc stage/tmp/arm64-dt-window/coderabbit-fix.patch.gz > /tmp/coderabbit-fix.patch
          test -s /tmp/coderabbit-fix.patch
      - name: Apply review fix
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git am /tmp/coderabbit-fix.patch
          git diff --check HEAD^ HEAD
      - name: Run focused regression
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s node --test tests/issue-9203-elf-loader-entry-analysis-window.mjs tests/issue-2409-function-extent-boundary.mjs
      - name: Run ownership and query focused checks
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s npm run phase7:ownership
          timeout 180s node --test tests/phase7/analysis-query/analysis-query-decompiler-dto.test.mjs tests/phase7/analysis-query/analysis-query-decompiler-projection.test.mjs
      - name: Publish target branch
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git push --no-verify origin HEAD:refs/heads/fix/arm64-dt-init-fini-analysis-window
