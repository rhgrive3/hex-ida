name: publish-arm64-dt-init-fini-window
on:
  push:
    branches:
      - tmp-arm64-dt-init-fini-window-stage

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch review patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 60 \
            -o /tmp/coderabbit-second-fix.patch.gz \
            https://raw.githubusercontent.com/rhgrive3/hex-ida/tmp-arm64-dt-init-fini-window-stage/tmp/arm64-dt-window/coderabbit-second-fix.patch.gz
          gzip -t /tmp/coderabbit-second-fix.patch.gz
          gzip -dc /tmp/coderabbit-second-fix.patch.gz > /tmp/coderabbit-second-fix.patch
          test -s /tmp/coderabbit-second-fix.patch
      - name: Checkout target PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/arm64-dt-init-fini-analysis-window
          fetch-depth: 2
      - name: Verify target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3bcc3ecf62b979a087f0138a8506747ef979fad6"
      - name: Apply review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git am /tmp/coderabbit-second-fix.patch
          git diff --check HEAD^ HEAD
      - name: Run focused regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s node --test tests/issue-9203-elf-loader-entry-analysis-window.mjs tests/issue-2409-function-extent-boundary.mjs tests/phase4/binary/issue-7611-overlapping-ptload-authority.test.mjs tests/phase4/binary/issue-7611-elf-section-ptload-relation.test.mjs
      - name: Run ownership and query focused checks
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s npm run phase7:ownership
          timeout 180s node --test tests/phase7/analysis-query/analysis-query-decompiler-dto.test.mjs tests/phase7/analysis-query/analysis-query-decompiler-projection.test.mjs
      - name: Publish target branch
        shell: bash
        run: |
          set -euo pipefail
          git push --no-verify origin HEAD:refs/heads/fix/arm64-dt-init-fini-analysis-window
