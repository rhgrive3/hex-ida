name: T015 focused verification

on:
  push:
    branches:
      - recovery/t015-apple-knowledge-20260916
    paths:
      - .github/workflows/t015-focused.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run T015 Apple knowledge regression
        shell: bash
        run: |
          set +e
          node tests/apple-knowledge-x02.test.mjs > /tmp/t015.out 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '### T015 first failure tail'
              echo '```text'
              tail -n 80 /tmp/t015.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          cat /tmp/t015.out
