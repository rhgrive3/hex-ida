name: PR2372 prerequisite canonical sync

on:
  push:
    branches:
      - fix/pr2372-inherited-gates

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify binary regression repair
        run: npm run binary:test
      - name: Canonically regenerate Stage2 denominator artifacts
        run: |
          node tools/validation/stage2/build-profile-denominator-inventory.mjs
          node tools/validation/stage2/build-profile-denominator-lock.mjs
          node tests/stage2/profile-denominator-inventory.test.mjs
      - name: Commit canonical artifact and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr2372-prereq-sync.yml
          git add tools/validation/stage2/profile-denominator-inventory.json tools/validation/stage2/profile-denominators.lock.json tests/universal-binary.mjs
          git diff --cached --check
          git commit -m "fix(validation): sync inherited PR2372 release gates"
          git push origin HEAD:fix/pr2372-inherited-gates
