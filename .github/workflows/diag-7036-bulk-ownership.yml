name: diag-7036-main-merge
on:
  push:
    branches:
      - diag/7036-bulk-ownership-f8c8
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile #7036 with current main
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/diag-7036-merge.txt
          : > "$STATUS"
          HEAD_SHA=f8c8e281d940ab9d5f1b20d15398095f64cb50f7
          timeout 90s git fetch --no-tags origin main "$HEAD_SHA" >/tmp/fetch.log 2>&1
          rc=$?
          echo "fetch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/fetch.log >> "$STATUS"; exit "$rc"; fi
          git checkout --detach "$HEAD_SHA" >/tmp/checkout.log 2>&1
          rc=$?
          echo "checkout rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/checkout.log >> "$STATUS"; exit "$rc"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          echo "main=$BASE_SHA" >> "$STATUS"
          echo "head=$HEAD_SHA" >> "$STATUS"
          git merge --no-commit --no-ff refs/remotes/origin/main >/tmp/merge.log 2>&1
          rc=$?
          echo "merge rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then
            echo 'conflicts:' >> "$STATUS"
            git -c core.quotePath=false diff --name-only --diff-filter=U >> "$STATUS"
            echo "conflict_count=$(git diff --name-only --diff-filter=U | wc -l)" >> "$STATUS"
            exit "$rc"
          fi
          git commit -m 'Merge current main into #7036 candidate' >/tmp/commit.log 2>&1
          rc=$?
          echo "commit rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/commit.log >> "$STATUS"; exit "$rc"; fi
          CLEAN_HEAD=$(git rev-parse HEAD)
          echo "clean_head=$CLEAN_HEAD" >> "$STATUS"
          git push --force origin HEAD:refs/heads/fix/7036-main-reconcile-f8c8 >/tmp/push.log 2>&1
          rc=$?
          echo "push rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/push.log >> "$STATUS"; exit "$rc"; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-main-merge
          path: /tmp/diag-7036-merge.txt
          retention-days: 1
