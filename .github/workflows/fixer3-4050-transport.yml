name: fixer3 issue 4050 transport

on:
  push:
    branches:
      - fixer3-transport-4050

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixer3-transport-4050
          fetch-depth: 0
      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .github/fixer3-4050.patch | awk '{print $1}')" = "1e3b2372eed6246cd445537c04573fac1c2e4fc6177ed4948c2e85b21a8ac168"
          git apply --check .github/fixer3-4050.patch
          git apply .github/fixer3-4050.patch
      - name: Verify exact candidate blobs and focused regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/analysis/discovery/candidates.js)" = "1c8219c00a0e2a06e8438a5ec80d788cb783b2e4"
          test "$(git hash-object js/analysis/discovery/producers.js)" = "7c61f05d9d9e8e95a0d4ccca72ecf417b5400811"
          test "$(git hash-object tests/phase7/discovery/issue-4050-debug-authority-laundering.test.mjs)" = "ba325e4865d33b09d0309f7e81a912afec0495ee"
          node --check js/analysis/discovery/candidates.js
          node --check js/analysis/discovery/producers.js
          node --check tests/phase7/discovery/issue-4050-debug-authority-laundering.test.mjs
          node --test tests/phase7/discovery/issue-4050-debug-authority-laundering.test.mjs
      - name: Commit transport result without transport artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/fixer3-4050.patch .github/workflows/fixer3-4050-transport.yml
          git add -A
          git config user.name "Fixer 3 Analysis"
          git config user.email "actions@github.com"
          git commit -m "fix(discovery): preserve weak debug authority (#4050)"
          git push origin HEAD:fixer3-transport-4050
