name: T017 adapt closure matrix

on:
  push:
    branches:
      - recovery/t017-machine-effects-20260917
    paths:
      - .github/workflows/t017-fix-matrix-current-main.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore current-main receiver validation context
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tools/validation/machine-effects/x86-long64-closure-matrix.mjs')
          text = p.read_text()
          old = 'const outcome = dispatchFunction(instruction);'
          new = 'const outcome = dispatchFunction(instruction, { closureMatrixTerminal: true });'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one current T017 evaluator call, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          node --check tools/validation/machine-effects/x86-long64-closure-matrix.mjs
      - name: Commit current-main matrix adaptation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/validation/machine-effects/x86-long64-closure-matrix.mjs
          git commit -m 'fix(t017): preserve receiver validation in closure matrix'
          git push origin HEAD:recovery/t017-machine-effects-20260917
