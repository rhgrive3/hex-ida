name: Stage 2 non-physical closure proof

on:
  pull_request:
    paths:
      - 'js/**'
      - 'tests/**'
      - 'tools/**'
      - 'userscript/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/stage2-nonphysical-closure.yml'
  workflow_dispatch:
    inputs:
      expect_sha:
        description: Exact candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stage2-nonphysical-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  exact-nonphysical-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expect_sha }}
          fetch-depth: 0

      - name: Detect Stage 2 proof impact
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expect_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          required=false
          while IFS= read -r changed; do
            case "$changed" in
              js/targets/architecture/*|\
              js/runtime/*|\
              js/managed/*|\
              js/rebuild/*|\
              js/phase12/*|\
              js/platform/stage2-*|\
              js/platform/physical-ipad-evidence.js|\
              js/knowledge/*|\
              js/signature/*|\
              js/pattern/*|\
              js/collaboration/*|\
              tests/machine-effects/*|\
              tests/stage2/*|\
              tests/phase12/*|\
              tools/validation/machine-effects/*|\
              tools/validation/stage2/*|\
              tools/validation/phase6/*|\
              tools/validation/phase10/*|\
              tools/validation/phase11/*|\
              tools/validation/phase12/*|\
              tools/validation/rebuild-independent-oracle.mjs|\
              package.json|package-lock.json)
                required=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [[ "$required" == "false" ]]; then
            echo "Stage 2 semantic/profile inputs are unchanged; skipping native proof providers and full closure validation."
          fi

      - name: Set up Node
        if: steps.impact.outputs.required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install active native proof providers
        if: steps.impact.outputs.required == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 lldb-18 qemu-user

      - name: Install dependencies
        if: steps.impact.outputs.required == 'true'
        run: npm ci --no-audit --no-fund

      - name: Assert exact candidate identity
        if: steps.impact.outputs.required == 'true'
        id: identity
        shell: bash
        env:
          EXPECT_SHA: ${{ github.event.pull_request.head.sha || inputs.expect_sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          test "$sha" = "$EXPECT_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Resolve generated-output ownership policy
        if: steps.impact.outputs.required == 'true'
        id: generated-policy
        shell: bash
        run: |
          set -euo pipefail
          mode="$(node tools/validation/generated-output-policy.mjs)"
          case "$mode" in
            enforce|ephemeral) ;;
            *) echo "unknown generated-output policy mode: $mode" >&2; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Validate canonical generated artifacts under ownership policy
        if: steps.impact.outputs.required == 'true'
        id: generated-artifacts
        shell: bash
        env:
          GENERATED_MODE: ${{ steps.generated-policy.outputs.mode }}
        run: |
          set -euo pipefail
          npm run userscript:build

          build_identity="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('userscript/release-version.json', 'utf8'));
          if (typeof release.releaseIdentity !== 'string' || !/^[0-9a-f]{64}$/.test(release.releaseIdentity)) throw new TypeError('stage2-release-identity-invalid');
          if (typeof release.buildId !== 'string' || !/^[0-9a-f]{24}$/.test(release.buildId)) throw new TypeError('stage2-build-id-invalid');
          if (!Number.isSafeInteger(release.serial) || release.serial < 1) throw new TypeError('stage2-release-serial-invalid');
          process.stdout.write(`userscript-release:${release.releaseIdentity}:build:${release.buildId}:serial:${release.serial}`);
          NODE
          )"
          echo "build_identity=$build_identity" >> "$GITHUB_OUTPUT"

          git restore --source=HEAD --worktree -- js/userscript/deployment-identity.generated.js
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(userscript/hex\.user\.template\.js|userscript/release-version\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'userscript:build changed files outside the generated-output allowlist:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          case "$GENERATED_MODE" in
            enforce)
              git diff --exit-code -- userscript/hex.user.template.js userscript/release-version.json
              test -z "$(git status --porcelain --untracked-files=no)"
              ;;
            ephemeral)
              git restore --source=HEAD --worktree -- userscript/hex.user.template.js userscript/release-version.json
              test -z "$(git status --porcelain --untracked-files=no)"
              ;;
            *)
              echo "unknown generated-output policy mode: $GENERATED_MODE" >&2
              exit 1
              ;;
          esac

      - name: Run canonical A2 machine-effects proof with visible diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stage2
          node tests/machine-effects/run.mjs 2>&1 | tee reports/stage2/machine-effects.log

      - name: Collect exact non-physical Stage 2 profile evidence
        if: steps.impact.outputs.required == 'true'
        id: profile
        shell: bash
        env:
          SHA: ${{ steps.identity.outputs.sha }}
          TREE: ${{ steps.identity.outputs.tree }}
        run: |
          set -euo pipefail
          run_id="exact-${SHA:0:16}"
          node tools/validation/stage2/profile-evidence-collector.mjs \
            --commit "$SHA" \
            --tree "$TREE" \
            --run-id "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "profile_path=reports/stage2/profile-evidence-runs/$run_id/profile-evidence.json" >> "$GITHUB_OUTPUT"

      - name: Run exact-head Stage 2 verifier and full repository validation
        if: steps.impact.outputs.required == 'true'
        shell: bash
        env:
          SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          node tests/stage2/stage2-release-identity-strict.mjs
          node tools/validation/stage2/verify.mjs --expect-sha "$SHA" --full

      - name: Record non-physical candidate identity
        if: steps.impact.outputs.required == 'true'
        shell: bash
        env:
          SHA: ${{ steps.identity.outputs.sha }}
          TREE: ${{ steps.identity.outputs.tree }}
          PROFILE_PATH: ${{ steps.profile.outputs.profile_path }}
          GENERATED_BUILD_IDENTITY: ${{ steps.generated-artifacts.outputs.build_identity }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const profile = JSON.parse(fs.readFileSync(process.env.PROFILE_PATH, 'utf8'));
          const generatedBuildIdentity = String(process.env.GENERATED_BUILD_IDENTITY || '');
          if (!/^userscript-release:[0-9a-f]{64}:build:[0-9a-f]{24}:serial:[1-9][0-9]*$/.test(generatedBuildIdentity)) {
            throw new TypeError('stage2-generated-build-identity-invalid');
          }
          const record = {
            schemaVersion: 'hex-stage2-nonphysical-candidate/v1',
            verdict: 'BLOCKED_ONLY_ON_PHYSICAL_IPAD_EVIDENCE',
            candidateCommitSha: process.env.SHA,
            candidateTreeSha: process.env.TREE,
            profileEvidenceId: profile.evidenceId,
            generatedBuildIdentity,
            remainingBlockers: ['S2-IPAD-PHYSICAL'],
          };
          fs.mkdirSync('reports/stage2', { recursive: true });
          fs.writeFileSync('reports/stage2/nonphysical-candidate.json', `${JSON.stringify(record, null, 2)}\n`);
          console.log(JSON.stringify(record));
          NODE

      - name: Upload exact proof artifacts
        if: always() && steps.impact.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage2-nonphysical-${{ steps.identity.outputs.sha || github.run_id }}
          path: reports/stage2/
          if-no-files-found: warn
          retention-days: 14
