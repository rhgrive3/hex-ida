name: One-shot unlinked strict boundary repair
on:
  push:
    branches: [fix/unlinked-strict-batch-20260831]
    paths: [.github/workflows/one-shot-repair-2784.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-strict-batch-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply strict boundary fixes
        shell: bash
        run: |
          python3 tools/tmp-unlinked-strict-batch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/unlinked-strict-boundaries-20260831.mjs')
          s=p.read_text()
          s=s.replace("import { liftArm64MachineEffects } from '../js/targets/architecture/arm64/effects/index.js';", "import { liftArm64MachineEffects } from '../js/targets/architecture/arm64/effects/index.js';\nimport { parseOperands } from '../js/arm64.js';")
          s=s.replace("for (const text of [{toString(){return 'ish';}}, ['ish']]) {\n  failClosed(lift('dmb',[{k:'barrier',text}]), 'barrier selector must be string');\n}", "const barrierOperand = parseOperands('ish')[0];\nfor (const text of [{toString(){return 'ish';}}, ['ish']]) {\n  failClosed(lift('dmb',[{...barrierOperand,text}]), 'barrier selector must be string');\n}")
          p.write_text(s)
          PY
      - name: Focused regression
        run: |
          node tests/unlinked-strict-boundaries-20260831.mjs
          node tests/machine-effects/arm64-int-arithmetic.test.mjs
          npm run effects:test
          npm run semantic-v2:test
      - name: Syntax check
        run: |
          node --check js/analysis/semantic-function-base.js
          node --check js/analysis/investigation-service.js
          node --check js/analysis/query/app-adapter.js
          node --check js/analysis/query/product-adapter.js
          node --check js/analysis/query/product-surface.js
          node --check js/semantics/memoryssa/build.js
          node --check js/semantics/memoryssa/contract.js
          node --check js/semantics/memoryssa/validate.js
          node --check js/semantics/cfg/index.js
          node --check js/analyze.js
      - name: Commit focused repair
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/one-shot-repair-2784.yml
          rm -f tools/tmp-unlinked-strict-batch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: close unlinked strict-boundary issues'
          git push origin HEAD:fix/unlinked-strict-batch-20260831
