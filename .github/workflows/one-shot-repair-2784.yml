name: One-shot unlinked cache completeness repair
on:
  push:
    branches: [fix/unlinked-cache-completeness-20260831]
    paths: [.github/workflows/one-shot-repair-2784.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-cache-completeness-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply cache/completeness fixes
        run: python3 tools/tmp-unlinked-cache-completeness.py
      - name: Focused regression
        run: |
          node tests/unlinked-cache-completeness-20260831.mjs
          node tests/reopened-final-seven-contracts.mjs
          node tests/phase4/integration/issues-2507-2518-resource-contracts.test.mjs
      - name: Syntax check
        run: |
          node --check js/schema.js
          node --check js/analysis/investigation-service.js
          node --check js/analysis/demand-driven-runtime.js
          node --check js/analysis/schema-recovery-task.js
      - name: Commit focused repair
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/one-shot-repair-2784.yml
          rm -f tools/tmp-unlinked-cache-completeness.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make cache budgets and completeness sound'
          git push origin HEAD:fix/unlinked-cache-completeness-20260831
