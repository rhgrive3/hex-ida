name: reconcile-14-soundness
on:
  push:
    branches:
      - fix/reconcile-14-soundness-20260908
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[reconcile-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reconciled local fixes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/reconcile/patch.* > /tmp/patch.b64
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/reconcile.patch
          git apply --3way --whitespace=nowarn /tmp/reconcile.patch
          cat .github/reconcile/contract.* > /tmp/contract.b64
          base64 -d /tmp/contract.b64 | gzip -d > js/analysis/summary/contract.js
          rm -rf .github/reconcile
          rm -f .github/workflows/reconcile-14-soundness.yml
          git add -A
          git diff --cached --check
          git config user.name 'OpenAI Reconcile Bot'
          git config user.email 'openai-reconcile@users.noreply.github.com'
          git commit -m 'fix(analysis): reconcile verified soundness fixes [reconcile-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
