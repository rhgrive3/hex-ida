name: Generated exact-head recovery

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open same-repository PR number to verify on demand'
        required: true
        type: number
      full_check:
        description: 'Also dispatch the full Invariant Gates proof'
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: generated-exact-head-recovery-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-head development checks
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = Number(context.payload.inputs?.pr_number);
            if (!Number.isInteger(number) || number <= 0) throw new Error('invalid pr_number');

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open') throw new Error(`#${number} is not open`);
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) throw new Error(`#${number} is a fork PR`);

            const workflows = ['pr-fast-gate.yml'];
            if (String(context.payload.inputs?.full_check ?? 'true') === 'true') workflows.push('invariant-gates.yml');

            for (const workflow_id of workflows) {
              core.info(`#${number}: dispatch ${workflow_id} at ${pr.head.sha}`);
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id,
                ref: pr.head.ref,
              });
            }
