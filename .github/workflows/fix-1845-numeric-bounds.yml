name: fix-1845-numeric-bounds
on:
  push:
    branches:
      - fix/1845-pdb-numeric-record-bounds
    paths:
      - .github/workflows/fix-1845-numeric-bounds.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1845-pdb-numeric-record-bounds
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify record-local bounds
        run: |
          node tools/fix-1845-record-bounds.mjs
          git diff --check
          node --test tests/phase7/debug/pdb-numeric-record-bounds-1845.test.mjs
          rm .github/workflows/fix-1845-numeric-bounds.yml tools/fix-1845-record-bounds.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pdb): bound numeric leaves to CodeView records (#1845)'
          git push origin HEAD:fix/1845-pdb-numeric-record-bounds
