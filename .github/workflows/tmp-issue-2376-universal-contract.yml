name: Temporary issue 2376 universal contract repair

on:
  push:
    branches: [fix/issue-2376-swift-pointer-resolver]
    paths:
      - '.github/workflows/tmp-issue-2376-universal-contract.yml'

permissions:
  contents: write

concurrency:
  group: issue-2376-universal-contract-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin fix/issue-2376-swift-pointer-resolver
          test "$(git rev-parse origin/fix/issue-2376-swift-pointer-resolver)" = "${GITHUB_SHA}"
      - name: Preserve unsupported-format metadata before ownership rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/binary/macho-dyld.js')
          s = p.read_text()
          old = """    const pointerFormat = r.u16(p + 6);\n    const segmentOffset = r.u64(p + 8);\n"""
          new = """    const pointerFormat = r.u16(p + 6);\n    const width = chainedPointerWidth(pointerFormat);\n    if (!width) markUnsupportedChainedFormat(image, pointerFormat);\n    const segmentOffset = r.u64(p + 8);\n"""
          if s.count(old) != 1:
              raise SystemExit('unexpected pointer-format declaration seam')
          s = s.replace(old, new, 1)
          old2 = """    const width = chainedPointerWidth(pointerFormat);\n    if (!width) { markUnsupportedChainedFormat(image, pointerFormat); fail(`segment ${segIndex} uses unsupported pointer format ${pointerFormat}`); continue; }\n"""
          new2 = """    if (!width) { fail(`segment ${segIndex} uses unsupported pointer format ${pointerFormat}`); continue; }\n"""
          if s.count(old2) != 1:
              raise SystemExit('unexpected delayed pointer-format seam')
          p.write_text(s.replace(old2, new2, 1))
          PY
      - name: Focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check js/binary/macho-dyld.js
          node tests/universal-binary.mjs
          node tests/issue-2376-swift-pointer-resolver.mjs
          node tests/issue-2376-chained-incomplete-coverage.mjs
          node tests/issue-840-rtti-pointer-formats.mjs
          node tests/swift-runtime.mjs
          node tests/runtime-intelligence-imports.mjs
      - name: Publish repair and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-issue-2376-universal-contract.yml
          git config user.name rhgrive3
          git config user.email rhgrive@gmail.com
          git add js/binary/macho-dyld.js
          git diff --cached --check
          git commit -m 'fix(swift): preserve unsupported chained format evidence'
          git fetch origin fix/issue-2376-swift-pointer-resolver
          test "$(git rev-parse origin/fix/issue-2376-swift-pointer-resolver)" = "${GITHUB_SHA}"
          git push origin HEAD:fix/issue-2376-swift-pointer-resolver
