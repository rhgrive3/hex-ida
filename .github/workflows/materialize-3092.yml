name: Materialize 3092 repair
on:
  push:
    branches:
      - fix/discovery-region-size-strict-3092
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply strict region size boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/analysis/discovery/fusion.js')
          text = p.read_text()
          old = """export function regionFromSize(start, sizeBytes, ownership = 'exclusive') {\n  const begin = BigInt(start);\n  const size = BigInt(sizeBytes);\n  if (size <= 0n) return null;\n  return createRegion({ start: begin, end: begin + size, ownership });\n}\n"""
          new = """export function regionFromSize(start, sizeBytes, ownership = 'exclusive') {\n  const canonicalInteger = (value) => {\n    if (typeof value === 'bigint') return value;\n    if (typeof value === 'number' && Number.isSafeInteger(value)) return BigInt(value);\n    if (typeof value === 'string' && /^[+-]?\\d+$/.test(value.trim())) return BigInt(value.trim());\n    return null;\n  };\n  const begin = canonicalInteger(start);\n  const size = canonicalInteger(sizeBytes);\n  if (begin == null || size == null || size <= 0n) return null;\n  return createRegion({ start: begin, end: begin + size, ownership });\n}\n"""
          if old not in text:
              raise SystemExit('regionFromSize target not found or already changed')
          p.write_text(text.replace(old, new, 1))
          PY
          cat > tests/phase7/discovery-region-size-strict.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { regionFromSize } from '../../js/analysis/discovery/fusion.js';

          const valid = [
            [4096n, 32n],
            [4096, 32],
            ['4096', '32'],
            [' 4096 ', '+32'],
          ];
          for (const [start, size] of valid) {
            const region = regionFromSize(start, size);
            assert.equal(region?.start, '4096');
            assert.equal(region?.end, '4128');
            assert.equal(region?.ownership, 'exclusive');
          }

          assert.equal(regionFromSize(4096n, 0n), null);
          assert.equal(regionFromSize(4096n, -1n), null);

          const malformed = [
            [['4096'], 32n],
            [4096n, ['32']],
            [4096n, true],
            [4096n, false],
            [4096n, { valueOf() { return 32; } }],
            [4096n, 1.5],
            [4096n, Number.NaN],
            [4096n, Number.POSITIVE_INFINITY],
            [4096n, '32.0'],
            [4096n, ''],
          ];
          for (const [start, size] of malformed) {
            assert.equal(regionFromSize(start, size), null, `malformed ${String(size)} must fail closed`);
          }

          console.log('discovery region size strict boundary: ok');
          EOF
      - name: Focused validation
        run: |
          node --check js/analysis/discovery/fusion.js
          node tests/phase7/discovery-region-size-strict.test.mjs
          git diff --check
      - name: Commit materialized repair
        shell: bash
        run: |
          rm .github/workflows/materialize-3092.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/analysis/discovery/fusion.js tests/phase7/discovery-region-size-strict.test.mjs .github/workflows/materialize-3092.yml
          git commit -m 'fix(discovery): reject coerced region extents (#3092)'
          git push origin HEAD:fix/discovery-region-size-strict-3092
