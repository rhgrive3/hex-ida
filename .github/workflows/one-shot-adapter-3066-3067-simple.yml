name: materialize adapter strict boundaries
on:
  push:
    branches:
      - fix/adapter-strict-boundaries-3066-3067
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adapter-strict-boundaries-3066-3067
          fetch-depth: 0
      - run: python3 .github/scripts/apply-adapter-3066-3067.py
      - run: node --check js/adapters/index.js
      - run: node tests/phase10/adapter-strict-boundaries.test.mjs
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(adapters): reject coerced debug selectors and read sizes (#3066 #3067)'
          git push origin HEAD:fix/adapter-strict-boundaries-3066-3067
