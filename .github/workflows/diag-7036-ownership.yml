name: diag-7036-main-reconcile
on:
  push:
    branches:
      - diag/7036-ownership-first-failure
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve T014 overlap only
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/diag-7036.txt
          : > "$STATUS"
          ORIGINAL_HEAD=e544f3a9a45d618e573565d39e1a49223040af06
          timeout 90s git fetch --no-tags origin main "$ORIGINAL_HEAD" >/tmp/fetch.log 2>&1
          rc=$?
          echo "fetch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/fetch.log >> "$STATUS"; exit "$rc"; fi
          git checkout --detach "$ORIGINAL_HEAD" >/tmp/checkout.log 2>&1
          rc=$?
          echo "checkout rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/checkout.log >> "$STATUS"; exit "$rc"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          echo "main=$BASE_SHA" >> "$STATUS"
          git merge --no-edit --no-ff refs/remotes/origin/main >/tmp/merge.log 2>&1
          merge_rc=$?
          echo "initial_merge_rc=$merge_rc" >> "$STATUS"
          if [ "$merge_rc" -eq 0 ]; then echo "merge_clean=true" >> "$STATUS"; exit 1; fi

          T014=(
            js/symbolic/expr/hash.js
            js/symbolic/solver/backend.js
            js/symbolic/solver/bitblast-backend.js
            js/symbolic/solver/registry.js
            js/symbolic/solver/tiered-backend.js
            js/symbolic/solver/worker-backend.js
            js/symbolic/solver/worker-entry.js
            js/symbolic/verify/query.js
            tests/issue-5498-eligibility-result-status-authority.mjs
            tests/phase9/solver/issue-5391-solver-registry-exact-default-authority.test.mjs
          )
          for f in "${T014[@]}"; do
            if git diff --name-only --diff-filter=U -- "$f" | grep -q .; then
              git checkout --theirs -- "$f" >/tmp/resolve.log 2>&1 && git add "$f"
              rc=$?
              echo "resolve_main $f rc=$rc" >> "$STATUS"
              if [ "$rc" -ne 0 ]; then tail -n 20 /tmp/resolve.log >> "$STATUS"; exit "$rc"; fi
            fi
          done
          echo "remaining_conflicts:" >> "$STATUS"
          git diff --name-only --diff-filter=U >> "$STATUS"
          count=$(git diff --name-only --diff-filter=U | wc -l)
          echo "remaining_count=$count" >> "$STATUS"
          exit 1
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-main-reconcile
          path: /tmp/diag-7036.txt
          retention-days: 1
