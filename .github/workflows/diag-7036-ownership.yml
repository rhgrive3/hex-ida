name: diag-7036-ownership
on:
  push:
    branches:
      - diag/7036-ownership-first-failure
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enumerate undeclared roadmap paths
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/diag-7036.txt
          : > "$STATUS"
          HEAD_SHA=8beac18cf4b9ac8604dd75be093fd0acf7904f27
          timeout 90s git fetch --no-tags origin main "$HEAD_SHA" >/tmp/fetch.log 2>&1
          rc=$?
          echo "fetch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/fetch.log >> "$STATUS"; exit "$rc"; fi
          git checkout --detach "$HEAD_SHA" >/tmp/checkout.log 2>&1
          rc=$?
          echo "checkout rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/checkout.log >> "$STATUS"; exit "$rc"; fi
          BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          echo "base=$BASE_SHA" >> "$STATUS"
          echo "head=$HEAD_SHA" >> "$STATUS"
          python3 - "$BASE_SHA" "$HEAD_SHA" >> "$STATUS" 2>&1 <<'PY'
          import json, subprocess, sys
          base, head = sys.argv[1:]
          manifest = json.load(open('tools/validation/analysis-roadmap/ownership.json'))
          declared = {p for paths in manifest['owners'].values() for p in paths}
          changed = subprocess.check_output(
              ['git','diff','--name-only','--diff-filter=ACMR',f'{base}...{head}'], text=True
          ).splitlines()
          missing = sorted(p for p in changed if p not in declared)
          print(f'changed_count={len(changed)}')
          print(f'undeclared_count={len(missing)}')
          for p in missing:
              print(f'undeclared={p}')
          if missing:
              raise SystemExit(1)
          PY
          exit $?
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-ownership
          path: /tmp/diag-7036.txt
          retention-days: 1
