name: diag-7036-main-reconcile
on:
  push:
    branches:
      - diag/7036-ownership-first-failure
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture merge precondition failure
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/diag-7036.txt
          : > "$STATUS"
          ORIGINAL_HEAD=e544f3a9a45d618e573565d39e1a49223040af06
          timeout 90s git fetch --no-tags origin main "$ORIGINAL_HEAD" >/tmp/fetch.log 2>&1
          rc=$?
          echo "fetch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/fetch.log >> "$STATUS"; exit "$rc"; fi
          git checkout --detach "$ORIGINAL_HEAD" >/tmp/checkout.log 2>&1
          rc=$?
          echo "checkout rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/checkout.log >> "$STATUS"; exit "$rc"; fi
          BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          echo "main=$BASE_SHA" >> "$STATUS"
          git merge-base "$ORIGINAL_HEAD" "$BASE_SHA" >/tmp/mb.txt 2>/tmp/mb.err
          mb_rc=$?
          echo "merge_base_rc=$mb_rc" >> "$STATUS"
          if [ "$mb_rc" -eq 0 ]; then echo "merge_base=$(cat /tmp/mb.txt)" >> "$STATUS"; else tail -n 20 /tmp/mb.err >> "$STATUS"; fi
          git merge --no-edit --no-ff refs/remotes/origin/main >/tmp/merge.log 2>&1
          rc=$?
          echo "merge rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then
            echo "--- merge failure tail ---" >> "$STATUS"
            tail -n 40 /tmp/merge.log >> "$STATUS"
            echo "unmerged_count=$(git diff --name-only --diff-filter=U | wc -l)" >> "$STATUS"
            git diff --name-only --diff-filter=U | head -n 40 >> "$STATUS"
            exit "$rc"
          fi
          echo "merge unexpectedly succeeded" >> "$STATUS"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-main-reconcile
          path: /tmp/diag-7036.txt
          retention-days: 1
