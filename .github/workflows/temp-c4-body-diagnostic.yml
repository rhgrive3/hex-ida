name: Temporary C4-04 body diagnostic
on:
  push:
    branches: ['impl/c4-04-finish-20260916']
    paths: ['.github/workflows/temp-c4-body-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: impl/c4-04-finish-20260916
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate no-PHI positive and PHI refusal
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/phase8/structuring/conditional-region-body-authority.test.mjs \
            tests/phase8/structuring/conditional-region-body-projection.test.mjs 2>&1 | tee /tmp/c4-body-diagnostic.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4-body-diagnostic
          path: /tmp/c4-body-diagnostic.txt
          retention-days: 1
