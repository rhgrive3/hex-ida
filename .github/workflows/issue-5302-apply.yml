name: issue-5302-apply

on:
  push:
    branches:
      - fix/issue-5302-array-type-core-20260917
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-5302-array-type-core-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply validated patch
        run: |
          cat .github/hex-ida-tmp/issue-5302.patch.b64.* | base64 -d > /tmp/issue-5302.patch
          git apply --check /tmp/issue-5302.patch
          git apply /tmp/issue-5302.patch
      - name: Focused regression
        run: node --test tests/phase11/dex/issue-5302-array-type-core.test.mjs
      - name: Module boundaries
        run: node scripts/check-module-boundaries.mjs
      - name: Syntax lint
        run: npm run lint
      - name: Commit clean result
        run: |
          rm -rf .github/hex-ida-tmp
          rm -f .github/workflows/issue-5302-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(dex): implement array/type core semantics (#5302)"
          git push origin HEAD:fix/issue-5302-array-type-core-20260917
