name: patch-7036-macho-duplicate
on:
  push:
    branches:
      - reconcile/7036-main-75eb8e78
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove pre-main duplicate declaration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/binary/macho-core.js')
          s = p.read_text()
          line = 'const LC_CODE_SIGNATURE = 0x1d;\n'
          if s.count(line) != 1:
              raise SystemExit(f'expected one branch declaration, got {s.count(line)}')
          p.write_text(s.replace(line, '', 1))
          PY
          git add js/binary/macho-core.js
          git diff --cached --check
          git commit -m 'chore(reconcile): defer LC_CODE_SIGNATURE declaration to current main'
          git push origin HEAD:reconcile/7036-main-75eb8e78
