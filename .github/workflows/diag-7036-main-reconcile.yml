name: diag-7036-main-reconcile
on:
  push:
    branches:
      - fix/7036-main-reconcile-20260917
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Summarize conflict-side history
        shell: bash
        run: |
          set -euo pipefail
          STATUS=/tmp/diag-7036-reconcile.txt
          : > "$STATUS"
          HEAD_SHA=d7d79ee29ef92e33d1007c62a4304f45b18916c0
          MAIN_SHA=012cacc48ec2cd9bde8a5b8a98b77f4a89f9a736
          timeout 90s git fetch --no-tags origin main "$HEAD_SHA" >/tmp/fetch.log 2>&1
          FILES=(
            .circleci/config.yml
            js/analysis/discovery/producers.js
            js/analysis/query/app-adapter.js
            js/analysis/summary/local-core.js
            js/rebuild/transaction-v2.js
            js/semantics/compat/semantic-ir-v2-to-v1-memory.js
            js/semantics/compat/semantic-ir-v2-to-v1.js
            js/semantics/memoryssa/proof-core.js
            js/symbolic/expr/serialize.js
            js/symbolic/solver/result.js
            js/symbolic/solver/session.js
            js/targets/architecture/riscv64/decoded-instruction.js
            scripts/build-userscript.mjs
            tests/phase4/binary/issue-4358-elf-dynamic-xindex-common.test.mjs
            userscript/hex.user.template.js
            userscript/release-version.json
          )
          echo "head=$HEAD_SHA" >> "$STATUS"
          echo "main=$MAIN_SHA" >> "$STATUS"
          for f in "${FILES[@]}"; do
            echo "=== $f ===" >> "$STATUS"
            echo '-- main-only --' >> "$STATUS"
            git log --format='%h %s' -n 3 "$HEAD_SHA..$MAIN_SHA" -- "$f" >> "$STATUS" || true
            echo '-- pr-only --' >> "$STATUS"
            git log --format='%h %s' -n 3 "$MAIN_SHA..$HEAD_SHA" -- "$f" >> "$STATUS" || true
          done
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-main-reconcile
          path: /tmp/diag-7036-reconcile.txt
          retention-days: 1
