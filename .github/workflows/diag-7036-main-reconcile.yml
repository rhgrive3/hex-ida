name: diag-7036-main-reconcile
on:
  push:
    branches:
      - fix/7036-main-reconcile-20260917
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture only unresolved semantic hunks
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/diag-7036-reconcile.txt
          : > "$STATUS"
          HEAD_SHA=d7d79ee29ef92e33d1007c62a4304f45b18916c0
          MAIN_SHA=012cacc48ec2cd9bde8a5b8a98b77f4a89f9a736
          timeout 90s git fetch --no-tags origin main "$HEAD_SHA" >/tmp/fetch.log 2>&1
          rc=$?; echo "fetch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/fetch.log >> "$STATUS"; exit "$rc"; fi
          git checkout --detach "$HEAD_SHA" >/tmp/checkout.log 2>&1
          rc=$?; echo "checkout rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/checkout.log >> "$STATUS"; exit "$rc"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$MAIN_SHA" >/tmp/merge.log 2>&1
          merge_rc=$?
          echo "merge rc=$merge_rc" >> "$STATUS"
          if [ "$merge_rc" -eq 0 ]; then echo 'unexpected_clean_merge=true' >> "$STATUS"; exit 1; fi
          MAIN_WINS=(
            .circleci/config.yml
            js/rebuild/transaction-v2.js
            js/symbolic/expr/hash.js
            js/symbolic/expr/serialize.js
            js/symbolic/solver/backend.js
            js/symbolic/solver/bitblast-backend.js
            js/symbolic/solver/registry.js
            js/symbolic/solver/result.js
            js/symbolic/solver/session.js
            js/symbolic/solver/tiered-backend.js
            js/symbolic/solver/worker-backend.js
            js/symbolic/solver/worker-entry.js
            js/symbolic/verify/query.js
            js/targets/architecture/riscv64/decoded-instruction.js
            scripts/build-userscript.mjs
            tests/issue-5498-eligibility-result-status-authority.mjs
            tests/phase4/binary/issue-4358-elf-dynamic-xindex-common.test.mjs
            tests/phase9/solver/issue-5391-solver-registry-exact-default-authority.test.mjs
            userscript/hex.user.template.js
            userscript/release-version.json
          )
          for f in "${MAIN_WINS[@]}"; do
            if git diff --name-only --diff-filter=U -- "$f" | grep -q .; then
              git checkout --theirs -- "$f" && git add "$f"
              rc=$?
              echo "main_wins $f rc=$rc" >> "$STATUS"
              [ "$rc" -eq 0 ] || exit "$rc"
            fi
          done
          git diff --name-only --diff-filter=U | sort -u >/tmp/remain.txt
          echo "remaining=$(wc -l < /tmp/remain.txt | tr -d ' ')" >> "$STATUS"
          cat /tmp/remain.txt >> "$STATUS"
          python3 - <<'PY' >> "$STATUS"
          from pathlib import Path
          files = [x.strip() for x in Path('/tmp/remain.txt').read_text().splitlines() if x.strip()]
          for name in files:
              print(f'\n=== HUNKS {name} ===')
              lines = Path(name).read_text(errors='replace').splitlines()
              starts = [i for i,l in enumerate(lines) if l.startswith('<<<<<<< ')]
              for n,start in enumerate(starts,1):
                  end = start
                  while end < len(lines) and not lines[end].startswith('>>>>>>> '):
                      end += 1
                  end = min(end, len(lines)-1)
                  lo = max(0, start-8); hi = min(len(lines), end+9)
                  print(f'--- hunk {n} lines {lo+1}-{hi} ---')
                  for i in range(lo, hi):
                      print(f'{i+1:5d}: {lines[i]}')
          PY
          exit 1
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-main-reconcile
          path: /tmp/diag-7036-reconcile.txt
          retention-days: 1
