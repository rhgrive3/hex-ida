name: Temporary PR7036 current-main merge diagnosis

on:
  push:
    branches:
      - diag/pr7036-current-main-merge-20260917
    paths:
      - '.github/workflows/tmp-pr7036-current-main-merge.yml'

permissions:
  contents: read

jobs:
  merge-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 650
      - name: Reproduce merge and capture conflict list only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hex-ida diagnostic'
          git config user.email 'diag@localhost'
          git fetch --no-tags --depth=650 origin ac36cc16b42fb10fbd54b5bd3f1e1a6474ca902b
          set +e
          base=$(git merge-base HEAD^ ac36cc16b42fb10fbd54b5bd3f1e1a6474ca902b 2>/tmp/merge-base.err)
          base_rc=$?
          git merge --no-commit --no-ff ac36cc16b42fb10fbd54b5bd3f1e1a6474ca902b >/dev/null 2>/tmp/merge.err
          rc=$?
          set -e
          {
            echo "merge_base_rc=$base_rc"
            echo "merge_base=${base:-none}"
            head -n 5 /tmp/merge-base.err | sed 's/^/merge_base_error=/'
            echo "merge_rc=$rc"
            head -n 8 /tmp/merge.err | sed 's/^/merge_error=/'
            echo "conflict_count=$(git diff --name-only --diff-filter=U | wc -l | tr -d ' ')"
            git diff --name-only --diff-filter=U | sed 's/^/conflict=/'
          } > pr7036-merge-summary.txt
          git merge --abort >/dev/null 2>&1 || true
          git reset --hard HEAD >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr7036-merge-summary
          path: pr7036-merge-summary.txt
          retention-days: 1
