name: One-shot issue 2866 ARM64 barrier selector
on:
  push:
    branches: [fix/2866-arm64-barrier-selector-current]
    paths: [.github/workflows/one-shot-2866.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2866-arm64-barrier-selector-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python3 tools/tmp-2866.py
      - name: Focused regression
        run: |
          node tests/machine-effects/arm64-barrier-selector-strict.test.mjs
          npm run effects:test
      - run: node --check js/targets/architecture/arm64/effects/system.js
      - name: Commit repair
        shell: bash
        run: |
          rm -f tools/tmp-2866.py .github/workflows/one-shot-2866.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(arm64): reject coerced barrier selectors (#2866)'
          git push origin HEAD:fix/2866-arm64-barrier-selector-current
