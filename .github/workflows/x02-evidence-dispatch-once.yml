name: X-02 evidence dispatch once

on:
  push:
    branches: [feat/analysis-roadmap-v8-current-main-20260907]
    paths: [.github/workflows/x02-evidence-dispatch-once.yml]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Apple evidence on exact branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run x02-apple-evidence.yml --repo "$GH_REPO" --ref feat/analysis-roadmap-v8-current-main-20260907
