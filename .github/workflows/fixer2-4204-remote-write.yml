name: Fixer2 Issue 4204 Remote Write

on:
  push:
    branches:
      - fix/issue-4204-elf-symtab-shndx-capacity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify baseline and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/elf-dynamic.js)" = "a38d7727a99d8e141a721e4be17e281ae575bbc3"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/binary/elf-dynamic.js')
          text = path.read_text()
          old = "const pointerTags=[4n,5n,7n,17n,23n,36n,0x6000000fn,0x60000011n,0x6ffffef5n,0x6ffffff0n,0x6ffffffcn,0x6ffffffen];"
          new = "const pointerTags=[4n,5n,7n,17n,23n,DT_SYMTAB_SHNDX,36n,0x6000000fn,0x60000011n,0x6ffffef5n,0x6ffffff0n,0x6ffffffcn,0x6ffffffen];"
          assert text.count(old) == 1, 'expected exactly one canonical pointerTags declaration'
          path.write_text(text.replace(old, new))
          PY
          test "$(git hash-object js/binary/elf-dynamic.js)" = "ffbfb58b6b057d2e0956e3639a45a37f6f63bbdb"
      - name: Validate focused regression
        shell: bash
        run: |
          set -euo pipefail
          node --check js/binary/elf-dynamic.js
          node --check tests/phase4/binary/issue-4204-elf-dynamic-symtab-shndx-capacity.test.mjs
          node --test tests/phase4/binary/issue-4204-elf-dynamic-symtab-shndx-capacity.test.mjs
      - name: Commit source patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/binary/elf-dynamic.js
          git rm .github/workflows/fixer2-4204-remote-write.yml
          git commit -m "fix(elf): bound dynsym at DT_SYMTAB_SHNDX"
          git push origin HEAD:fix/issue-4204-elf-symtab-shndx-capacity
