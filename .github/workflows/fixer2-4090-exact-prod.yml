name: Fixer 2 issue 4090 exact production edit
on:
  push:
    branches:
      - fixer2/issue-4090-ptload-align
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify split writes and edit production exactly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/elf-core.js)" = "9647068c1701d8a8dcf63fe16656375b3ac9fd12"
          test "$(git hash-object tests/issue-4090-elf-pt-load-alignment.mjs)" = "fdca08953303fa85c08bf998dc190200c8c5e82a"
          test "$(git hash-object tests/phase4/binary/issue-5888-elf-section-file-span-mapping.test.mjs)" = "7337bbc828f58db89a4495000be57185535a4f5d"
          test "$(git hash-object tests/phase4/binary/issue-7610-elf-ptload-overlap.test.mjs)" = "7f72a5caa272a5c3328edf02f8e14787ceb76c0e"
          python - <<'PY'
          from pathlib import Path
          path = Path('js/binary/elf-core.js')
          old = """      const fileLength = BigInt(r.length);
                const invalidSize = ph.filesz > ph.memsz;
                const invalidRange = ph.offset > fileLength || ph.filesz > fileLength - ph.offset;
                if (invalidSize || invalidRange) {
                  image.warnings.push(`invalid ELF PT_LOAD ${i}: ${invalidSize ? 'p_filesz > p_memsz' : 'file range exceeds input'}`);
                  continue;
                }
          """
          new = """      const fileLength = BigInt(r.length);
                const invalidSize = ph.filesz > ph.memsz;
                const invalidRange = ph.offset > fileLength || ph.filesz > fileLength - ph.offset;
                const invalidAlign = ph.align > 1n && (ph.align & (ph.align - 1n)) !== 0n;
                const invalidCongruence = !invalidAlign && ph.align > 1n && ph.vaddr % ph.align !== ph.offset % ph.align;
                if (invalidSize || invalidRange || invalidAlign || invalidCongruence) {
                  const reason = invalidSize ? 'p_filesz > p_memsz'
                    : invalidRange ? 'file range exceeds input'
                      : invalidAlign ? 'p_align is not a power of two'
                        : 'p_vaddr/p_offset are not congruent modulo p_align';
                  image.warnings.push(`invalid ELF PT_LOAD ${i}: ${reason}`);
                  continue;
                }
          """
          text = path.read_text()
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact PT_LOAD validation block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(git hash-object js/binary/elf-core.js)" = "7633e9bfaf4e44a197272cc71648380b7ca4c3b0"
          node --check js/binary/elf-core.js
          node --test tests/issue-4090-elf-pt-load-alignment.mjs tests/phase4/binary/issue-5888-elf-section-file-span-mapping.test.mjs tests/phase4/binary/issue-7610-elf-ptload-overlap.test.mjs
      - name: Commit exact production edit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fixer2-4090-exact-prod.yml
          git config user.name 'Fixer 2 Binary'
          git config user.email 'fixer2@users.noreply.github.com'
          git add -A
          git commit -m 'fix(elf): validate PT_LOAD alignment (#4090)'
          git push origin HEAD:${GITHUB_REF_NAME}
