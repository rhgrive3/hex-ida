name: Apply reviewed issue 9009 patch

on:
  push:
    branches:
      - fix/issue-9009-final-authority-v2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/issue-9009-final-authority-v2
          fetch-depth: 0
      - name: Reassemble and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patch-staging/part-* | base64 -d | gzip -d > /tmp/issue9009.patch
          echo "a9dd9b7d34e7ac5f5883b57405d425e6ffce7ac105e954853483ad4804c1b236  /tmp/issue9009.patch" | sha256sum -c -
          git apply --check /tmp/issue9009.patch
          git apply /tmp/issue9009.patch
      - name: Validate focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/phase12/adversarial/issue-9009-verified-record-cannot-authorize-unrelated-final-claim.test.mjs \
            tests/phase12/adversarial/issue-8864-planner-evidence-authority.test.mjs \
            tests/phase12/adversarial/issue-4047-ai-confirmed-facts-authority.test.mjs
          node tests/check.mjs
      - name: Commit reviewed fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .patch-staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ai): bind address-free provider claims to proven authority (#9009)"
          git push origin HEAD:fix/issue-9009-final-authority-v2
