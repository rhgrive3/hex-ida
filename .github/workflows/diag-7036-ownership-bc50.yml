name: diag-7036-ownership-bc50
on:
  push:
    branches:
      - diag/7036-ownership-bc50
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact candidate
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/diag-7036-bc50.txt
          : > "$STATUS"
          CANDIDATE=bc50c62af8bd50b7f18c41f114475ff143d1a015
          LOGICAL_BRANCH=feat/analysis-roadmap-v8-current-main-20260907
          timeout 90s git fetch --no-tags origin main "$CANDIDATE" >/tmp/fetch.log 2>&1
          rc=$?
          echo "fetch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/fetch.log >> "$STATUS"; exit "$rc"; fi
          git checkout --detach "$CANDIDATE" >/tmp/checkout.log 2>&1
          rc=$?
          echo "checkout rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/checkout.log >> "$STATUS"; exit "$rc"; fi
          BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          echo "base=$BASE_SHA" >> "$STATUS"
          echo "candidate=$CANDIDATE" >> "$STATUS"
          fail_tail() {
            label="$1"; file="$2"; rc="$3"
            echo "$label rc=$rc" >> "$STATUS"
            echo '--- first failure ---' >> "$STATUS"
            tail -n 80 "$file" >> "$STATUS"
            exit "$rc"
          }
          timeout 120s node tools/validation/phase7-ownership.mjs --check-manifest >/tmp/p7m.log 2>&1
          rc=$?; [ "$rc" -eq 0 ] || fail_tail phase7_manifest /tmp/p7m.log "$rc"
          echo 'phase7_manifest=pass' >> "$STATUS"
          timeout 120s node tools/validation/analysis-roadmap/ownership.mjs --branch "$LOGICAL_BRANCH" --phase phase7 --base-sha "$BASE_SHA" --head-sha "$CANDIDATE" >/tmp/p7.json 2>/tmp/p7g.log
          rc=$?; [ "$rc" -eq 0 ] || fail_tail phase7_inventory /tmp/p7g.log "$rc"
          timeout 120s node tools/validation/phase7-ownership.mjs --files-json "$(cat /tmp/p7.json)" >/tmp/p7v.log 2>&1
          rc=$?; [ "$rc" -eq 0 ] || fail_tail phase7_validate /tmp/p7v.log "$rc"
          echo 'phase7=pass' >> "$STATUS"
          timeout 120s node tools/validation/phase8-ownership.mjs --check-manifest >/tmp/p8m.log 2>&1
          rc=$?; [ "$rc" -eq 0 ] || fail_tail phase8_manifest /tmp/p8m.log "$rc"
          echo 'phase8_manifest=pass' >> "$STATUS"
          timeout 120s node tools/validation/analysis-roadmap/ownership.mjs --branch "$LOGICAL_BRANCH" --phase phase8 --base-sha "$BASE_SHA" --head-sha "$CANDIDATE" >/tmp/p8.json 2>/tmp/p8g.log
          rc=$?; [ "$rc" -eq 0 ] || fail_tail phase8_inventory /tmp/p8g.log "$rc"
          timeout 120s node tools/validation/phase8-ownership.mjs --files-json "$(cat /tmp/p8.json)" >/tmp/p8v.log 2>&1
          rc=$?; [ "$rc" -eq 0 ] || fail_tail phase8_validate /tmp/p8v.log "$rc"
          echo 'phase8=pass' >> "$STATUS"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-ownership-bc50
          path: /tmp/diag-7036-bc50.txt
          retention-days: 1
