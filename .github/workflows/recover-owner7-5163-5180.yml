name: recover-owner7-5180
on:
  push:
    branches:
      - fix/recover-owner7-5163-5180-20260916
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recover-owner7-5163-5180-20260916
          fetch-depth: 0
      - name: Port production #5180
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/rebuild/transaction-v2.js')
          s = p.read_text()
          assert 'function loaderReparseResultFailure' not in s
          anchor = 'function independentOracleResultFailure(result, context) {'
          assert s.count(anchor) == 1, s.count(anchor)
          helper = '''function loaderReparseResultFailure(result) {
            if (!result || typeof result !== 'object' || Array.isArray(result)) return 'validator-loader-result-invalid';
            const image = result.image;
            for (const [fields, imageField, reason] of [
              [['format'], 'format', 'validator-format-identity-required'],
              [['architecture', 'arch'], 'arch', 'validator-architecture-identity-required'],
              [['loaderVersion', 'parserVersion'], 'loaderVersion', 'validator-loader-identity-required'],
              [['outputHash', 'bytesHash'], 'outputHash', 'validator-output-identity-required'],
            ]) {
              const values = validatorIdentityValues(result, image, fields, imageField);
              if (values.length === 0 || values.some((value) => typeof value === 'string' && value.trim() === '')) return reason;
            }
            return null;
          }

          '''
          s = s.replace(anchor, helper + anchor, 1)
          hook = "    const identityFailure = formatIdentityMismatch(result, context.transaction, context.expectedOutputHash);"
          assert s.count(hook) == 1, s.count(hook)
          s = s.replace(hook, "    if (name === 'loader-reparse') {\n      const contractFailure = loaderReparseResultFailure(result);\n      if (contractFailure) return validatorResult(name, true, false, contractFailure, result);\n    }\n" + hook, 1)
          p.write_text(s)
          PY
      - name: Add #5180 regression
        shell: bash
        run: git show 215654e62017614271358ca8046c422ca80aeecc:tests/issue-5180-loader-reparse-identity.mjs > tests/issue-5180-loader-reparse-identity.mjs
      - name: Update #5785 fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/issue-5785-validator-contradiction.test.mjs')
          s = p.read_text()
          old = """  const materialized = await materializeRebuildTransaction(transaction, source, { maxOutputBytes: 1024 });
          assert.equal(materialized.status, 'materialized');
          const validation = await validateRebuildTransaction(transaction, materialized, {
            original: source,
            loaderReparse: validatorFn,
          """
          new = """  const materialized = await materializeRebuildTransaction(transaction, source, { maxOutputBytes: 1024 });
          assert.equal(materialized.status, 'materialized');
          const loaderIdentity = {
            format: transaction.format,
            architecture: transaction.architecture,
            loaderVersion: transaction.loaderVersion,
            sourceHash: transaction.sourceHash,
            outputHash: materialized.outputHash,
          };
          const validation = await validateRebuildTransaction(transaction, materialized, {
            original: source,
            loaderReparse: async (context) => ({ ...loaderIdentity, ...await validatorFn(context) }),
          """
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Update rebuild proof fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/stage2/helpers/rebuild-proof-fixture.mjs')
          s = p.read_text()
          old = "    loaderReparse: () => ({ ok: true }),"
          new = "    loaderReparse: () => ({ ok: true, status: 'passed', format: transaction.format, architecture: transaction.architecture, loaderVersion: transaction.loaderVersion, sourceHash: transaction.sourceHash, outputHash: materialized.outputHash }),"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Update rebuild transaction fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/stage2/rebuild-transaction.test.mjs')
          s = p.read_text()
          replacements = [
            ("  loaderReparse: ({ output }) => ({ ok: output.length === 5 }),", "  loaderReparse: ({ output }) => ({ ok: output.length === 5, format: transaction.format, architecture: transaction.architecture, loaderVersion: transaction.loaderVersion, sourceHash: transaction.sourceHash, outputHash: materialized.outputHash }),"),
            ("  loaderReparse: () => ({ ok: true }),\n  independentOracle: ({ output }) => { independentCalls += 1; return independentEvidence(output); },", "  loaderReparse: () => ({ ok: true, format: transaction.format, architecture: transaction.architecture, loaderVersion: transaction.loaderVersion, sourceHash: transaction.sourceHash, outputHash: materialized.outputHash }),\n  independentOracle: ({ output }) => { independentCalls += 1; return independentEvidence(output); },"),
            ("  original: source, loaderReparse: () => ({ ok: true }), independentOracle: ({ output }) => independentEvidence(output, true, { format: 'elf' }), validators: boundExternal,", "  original: source, loaderReparse: () => ({ ok: true, format: boundTransaction.format, architecture: boundTransaction.architecture, loaderVersion: boundTransaction.loaderVersion, sourceHash: boundTransaction.sourceHash, outputHash: boundMaterialized.outputHash }), independentOracle: ({ output }) => independentEvidence(output, true, { format: 'elf' }), validators: boundExternal,"),
          ]
          for old, new in replacements:
            assert s.count(old) == 1, (old, s.count(old))
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Diff check
        shell: bash
        run: git diff --check
      - name: Focused #5180
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s node tests/issue-5180-loader-reparse-identity.mjs
          timeout 180s node tests/issue-5785-validator-contradiction.test.mjs
          timeout 180s node tests/stage2/rebuild-transaction.test.mjs
      - name: Syntax
        shell: bash
        run: timeout 60s node --check js/rebuild/transaction-v2.js
      - name: Publish clean branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/recover-owner7-5163-5180.yml
          git add js/rebuild/transaction-v2.js tests/issue-5180-loader-reparse-identity.mjs tests/issue-5785-validator-contradiction.test.mjs tests/stage2/helpers/rebuild-proof-fixture.mjs tests/stage2/rebuild-transaction.test.mjs
          git diff --cached --check
          git commit -m 'fix(rebuild): require loader-reparse identity binding (#5180)'
          git push origin HEAD:refs/heads/fix/recover-owner7-5163-5180-20260916
