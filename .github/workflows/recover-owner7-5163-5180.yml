name: recover-owner7-5180
on:
  push:
    branches:
      - fix/recover-owner7-5163-5180-20260916
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recover-owner7-5163-5180-20260916
          fetch-depth: 0
      - name: Apply recovery patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/pr5180-fix.py
          git show 215654e62017614271358ca8046c422ca80aeecc:tests/issue-5180-loader-reparse-identity.mjs > tests/issue-5180-loader-reparse-identity.mjs
          git diff --check
      - name: Test loader identity
        shell: bash
        run: timeout 180s node tests/issue-5180-loader-reparse-identity.mjs
      - name: Test validator contradiction
        shell: bash
        run: timeout 180s node tests/issue-5785-validator-contradiction.test.mjs
      - name: Test rebuild transaction
        shell: bash
        run: timeout 180s node tests/stage2/rebuild-transaction.test.mjs
      - name: Syntax check
        shell: bash
        run: timeout 60s node --check js/rebuild/transaction-v2.js
      - name: Publish clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/recover-owner7-5163-5180.yml .github/workflows/recover-owner7-5180-v2.yml .github/pr5180-fix.py
          git add js/rebuild/transaction-v2.js tests/issue-5180-loader-reparse-identity.mjs tests/issue-5785-validator-contradiction.test.mjs tests/stage2/helpers/rebuild-proof-fixture.mjs tests/stage2/rebuild-transaction.test.mjs
          git diff --cached --check
          git commit -m 'fix(rebuild): require loader-reparse identity binding (#5180)'
          git push origin HEAD:refs/heads/fix/recover-owner7-5163-5180-20260916
