name: recover-owner7-5180
on:
  push:
    branches:
      - fix/recover-owner7-5163-5180-20260916
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recover-owner7-5163-5180-20260916
          fetch-depth: 0
      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply #5180 donor
        shell: bash
        run: timeout 60s git cherry-pick 215654e62017614271358ca8046c422ca80aeecc
      - name: Focused #5180
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD~1..HEAD
          timeout 180s node tests/issue-5180-loader-reparse-identity.mjs
          timeout 180s node tests/issue-5785-validator-contradiction.test.mjs
          timeout 180s node tests/stage2/rebuild-transaction.test.mjs
      - name: Syntax
        shell: bash
        run: timeout 60s node --check js/rebuild/transaction-v2.js
      - name: Publish clean branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/recover-owner7-5163-5180.yml
          git commit -m 'ci: remove temporary recovery workflow'
          git push origin HEAD:refs/heads/fix/recover-owner7-5163-5180-20260916
