name: recover-owner7-5163-5180
on:
  push:
    branches:
      - fix/recover-owner7-5163-5180-20260916
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recover-owner7-5163-5180-20260916
          fetch-depth: 0
      - name: Apply donor fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          timeout 60s git cherry-pick fa056f2890a5ab333c28908819d9a3e16b7c1e93
          timeout 60s git cherry-pick 215654e62017614271358ca8046c422ca80aeecc
          git diff --check HEAD~2..HEAD
      - name: Focused #5163
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s node tests/issue-5163-expression-node-budget-admission.mjs
          timeout 180s node tests/phase9/solver/issue-5163-expression-node-budget-admission.test.mjs
      - name: Focused #5180
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s node tests/issue-5180-loader-reparse-identity.mjs
          timeout 180s node tests/issue-5785-validator-contradiction.test.mjs
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s node --check js/symbolic/solver/exhaustive-backend.js
          timeout 60s node --check js/rebuild/transaction-v2.js
      - name: Publish clean branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/recover-owner7-5163-5180.yml
          git commit -m 'ci: remove temporary recovery workflow'
          git push origin HEAD:refs/heads/fix/recover-owner7-5163-5180-20260916
