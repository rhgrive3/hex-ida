name: Temporary conditional projection subtest
on:
  push:
    branches: ['impl/c4-02-finish-20260916']
    paths: ['.github/workflows/temp-c4-condition-subtest.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACCEPT_HEAD: a64e8d8c91a4c38a9b8b9410bba7a0ade64556e3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.ACCEPT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run one failing subtest
        shell: bash
        run: |
          set +e
          node --test --test-name-pattern='committed region projection repairs the actual C precedence counterexample' tests/phase8/structuring/conditional-region-condition.test.mjs > /tmp/subtest.txt 2>&1
          echo "exit=$?" >> /tmp/subtest.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: conditional-projection-subtest
          path: /tmp/subtest.txt
          retention-days: 1
