name: Phase 7 release validation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact 40-character commit SHA to verify'
        required: true
        type: string
      shadow:
        description: 'Report the verdict without failing the job'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase7-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Canonical Phase 7 suite
        run: npm run phase7:test
      - name: Required regression gates on the exact head
        run: |
          set -euo pipefail
          npm run migration:test
          npm run semantic-v2:test
          npm run semantic:test
          npm run decompiler:test
      - name: Resolve generated-output ownership policy
        id: generated-policy
        shell: bash
        run: |
          set -euo pipefail
          mode="$(node tools/validation/generated-output-policy.mjs)"
          case "$mode" in
            enforce|ephemeral) printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown generated-output policy mode: $mode" >&2; exit 1 ;;
          esac
      - name: Generated-output synchronization
        if: steps.generated-policy.outputs.mode == 'enforce'
        run: |
          set -euo pipefail
          npm run userscript:build
          if ! git diff --quiet -- userscript/hex.user.template.js userscript/release-version.json; then
            echo "generated userscript output is out of sync with source" >&2
            git --no-pager diff --stat -- userscript/hex.user.template.js userscript/release-version.json >&2
            exit 1
          fi
      - name: Run the Phase 7 verifier against the exact head
        env:
          EXPECT_SHA: ${{ inputs.sha }}
          SHADOW: ${{ inputs.shadow }}
        run: |
          set -euo pipefail
          args=(--expect-sha "$EXPECT_SHA")
          if [ "${SHADOW:-false}" = "true" ]; then args+=(--shadow); fi
          node tools/validation/phase7/verify.mjs "${args[@]}"
      - name: Publish Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-release-evidence-${{ inputs.sha }}
          path: |
            reports/phase7/phase7-release-evidence.json
            reports/phase7/phase7-release-evidence.md
            reports/phase7/checkpoints.json
            reports/phase7/baseline-metrics.json
          if-no-files-found: error
