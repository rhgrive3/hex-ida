name: T015 apply targeted fix

on:
  push:
    branches:
      - recovery/t015-apple-knowledge-20260916
    paths:
      - .github/workflows/t015-apply-core-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply omitted chained-page ownership fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/t015-dyld-fix3.patch
          git apply .github/t015-dyld-fix3.patch
          node --check js/binary/macho-dyld.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/macho-dyld.js
          git commit -m 'fix(t015): retain ownership for omitted chained pages'
          git push origin HEAD:recovery/t015-apple-knowledge-20260916
