name: T015 apply targeted fix

on:
  push:
    branches:
      - recovery/t015-apple-knowledge-20260916
    paths:
      - .github/workflows/t015-apply-core-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply current-main Swift fixture provenance fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/t015-test-fixture-fix.patch
          git apply .github/t015-test-fixture-fix.patch
          node --check tests/apple-knowledge-x02.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/apple-knowledge-x02.test.mjs
          git commit -m 'test(t015): align Swift metadata fixture provenance with current parser'
          git push origin HEAD:recovery/t015-apple-knowledge-20260916
