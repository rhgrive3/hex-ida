# trigger-2
name: fix-2661-extent-ownership
on:
  push:
    branches: [fix/2661-extent-ownership]
    paths: [.github/workflows/fix-2661-extent-ownership.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2661-extent-ownership
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ownership-aware fusion fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/analysis/discovery/fusion.js')
          s=p.read_text()
          old1="for (const region of item.regions) merged.set(`${region.start}-${region.end}`, region);"
          new1="for (const region of item.regions) merged.set(`${region.start}-${region.end}-${region.ownership ?? ''}`, region);"
          old2="const signature = item.regions.map((region) => `${region.start}-${region.end}`).join(',');"
          new2="const signature = item.regions.map((region) => `${region.start}-${region.end}-${region.ownership ?? ''}`).join(',');"
          if s.count(old1)!=1 or s.count(old2)!=1:
            raise SystemExit(f'fusion source drifted: partial={s.count(old1)} complete={s.count(old2)}')
          p.write_text(s.replace(old1,new1,1).replace(old2,new2,1))
          t=Path('tests/phase7/integration/extent-ownership-fusion.test.mjs')
          t.parent.mkdir(parents=True, exist_ok=True)
          t.write_text("""import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport { fuseFunctionCandidates } from '../../../js/analysis/discovery/fusion.js';\nconst ev=(producerId, ownership, extentRole='complete')=>({kind:'debug-symbol',extentRole,producerId,start:'4096',regions:[{start:'4096',end:'4112',ownership}]});\ntest('complete extent ownership disagreement never becomes exact',()=>{const {candidates}=fuseFunctionCandidates([ev('a','exclusive'),ev('b','shared')]);assert.equal(candidates.length,1);assert.equal(candidates[0].extentState,'unknown');assert.deepEqual(candidates[0].regions,[]);assert.ok(candidates[0].conflicts.some(x=>x.kind==='extent'));});\ntest('partial extent ownership mismatch is preserved without silent overwrite',()=>{const {candidates}=fuseFunctionCandidates([ev('a','exclusive','partial'),ev('b','shared','partial')]);assert.equal(candidates.length,1);assert.deepEqual(candidates[0].regions.map(r=>r.ownership).sort(),['exclusive','shared']);});\ntest('ownership-aware fusion is input-order deterministic',()=>{const a=fuseFunctionCandidates([ev('a','exclusive'),ev('b','shared')]).candidates[0];const b=fuseFunctionCandidates([ev('b','shared'),ev('a','exclusive')]).candidates[0];assert.equal(a.extentState,b.extentState);assert.deepEqual(a.regions,b.regions);assert.deepEqual(a.conflicts,b.conflicts);});\n""")
          Path('.github/workflows/fix-2661-extent-ownership.yml').unlink()
          PY
          git diff --check
          node --test tests/phase7/integration/extent-ownership-fusion.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(discovery): preserve region ownership in extent fusion (#2661)"
          git push origin HEAD:fix/2661-extent-ownership
