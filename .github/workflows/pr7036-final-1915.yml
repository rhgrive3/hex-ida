name: PR7036 final conflict inventory 1915b
on:
  push:
    branches: [sync/pr7036-final-20260917-1915]
jobs:
  inventory:
    if: contains(github.event.head_commit.message, 'inventory PR7036 final conflicts 1915b')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 900
      - name: Inventory conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags --depth=900 origin 4d68cb6bf67622f7f3887e821388a2788cbd34fc >/dev/null 2>&1
          set +e
          git merge --no-commit --no-ff FETCH_HEAD >/dev/null 2>/tmp/merge.err
          merge_rc=$?
          set -e
          git diff --name-only --diff-filter=U | sed '/^$/d' | sort > pr7036-final-conflicts.txt
          {
            echo "merge_rc=$merge_rc"
            echo "merge_base=$(git merge-base HEAD FETCH_HEAD)"
            echo "count=$(wc -l < pr7036-final-conflicts.txt | tr -d ' ')"
            cat pr7036-final-conflicts.txt
            if [ "$merge_rc" -gt 1 ]; then head -n 5 /tmp/merge.err; fi
          } > pr7036-final-inventory.txt
          git merge --abort >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr7036-final-inventory-1915b
          path: pr7036-final-inventory.txt
          retention-days: 2
