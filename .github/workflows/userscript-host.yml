name: ChatGPT userscript host

on:
  pull_request:
    paths:
      - 'js/userscript/**'
      - 'js/ai/dev/**'
      - 'js/ai/provider/**'
      - 'js/ai/ui/bridge.js'
      - 'scripts/build-userscript.mjs'
      - 'userscript/**'
      - 'worker-entry.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'css/**'
      - 'tests/dev-agent/**'
      - 'tests/userscript-*.mjs'
      - 'tests/chatgpt-*.mjs'
      - '.github/workflows/userscript-host.yml'
  push:
    branches: [main]
    paths:
      - 'js/userscript/**'
      - 'js/ai/dev/**'
      - 'js/ai/provider/**'
      - 'js/ai/ui/bridge.js'
      - 'scripts/build-userscript.mjs'
      - 'userscript/**'
      - 'worker-entry.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'css/**'
      - 'tests/dev-agent/**'
      - 'tests/userscript-*.mjs'
      - 'tests/chatgpt-*.mjs'
      - '.github/workflows/userscript-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: userscript-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  userscript:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve generated-output ownership policy
        id: generated-policy
        shell: bash
        run: echo "mode=$(node tools/validation/generated-output-policy.mjs)" >> "$GITHUB_OUTPUT"
      - name: Opaque sandbox storage contract
        run: node tests/userscript-sandbox-storage.mjs
      - name: Embed mode security boundary
        run: node tests/userscript-embed-mode-security.mjs
      - name: Conversation routing storage boundary
        run: node tests/chatgpt-conversation-storage-security.mjs
      - name: Dynamic Task Graph focused regression
        run: node tests/dev-agent/dynamic-task-graph.mjs
      - name: Diagnostic userscript group 1 - dev agent
        run: npm run dev-agent:test
      - name: Diagnostic userscript group 2 - pre-build contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/userscript-importscripts-literals.mjs
          node tests/issue-5034-worker-blob-url-cleanup.mjs
          node tests/issue-4940-onready-callback-isolation.mjs
          node tests/issue-5017-protected-worker-cleanup-ownership.mjs
          node tests/issue-4968-array-key-precision.mjs
          node tests/issue-5016-protected-workers-origin-guard.mjs
      - name: Diagnostic userscript group 3a - build
        run: npm run userscript:build
      - name: Diagnostic userscript group 3b - template syntax
        run: node --check userscript/hex.user.template.js
      - name: Diagnostic userscript group 3c - worker syntax
        run: node --check worker-entry.js
      - name: Diagnostic userscript group 3d - release version
        shell: bash
        run: |
          set +e
          node tests/userscript-release-version.mjs >/tmp/release-version-focused.out 2>&1
          status=$?
          {
            echo '### userscript-release-version focused failure'
            echo '~~~'
            tail -n 24 /tmp/release-version-focused.out
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload focused release-version diagnostic
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-version-focused
          path: /tmp/release-version-focused.out
          if-no-files-found: error
          retention-days: 1
      - name: Diagnostic embed protocol
        run: node tests/userscript-embed-protocol.mjs
      - name: Diagnostic sanitize shared refs
        run: node tests/issue-5020-sanitize-details-shared-refs.mjs
      - name: Diagnostic embed bootstrap
        run: node tests/userscript-embed-bootstrap.mjs
      - name: Diagnostic ChatGPT web bridge contract
        run: node tests/chatgpt-web-bridge-contract.mjs
      - name: Diagnostic ChatGPT send control resolution
        run: node tests/chatgpt-send-control-resolution.mjs
      - name: Diagnostic ChatGPT disabled stop settlement
        run: node tests/chatgpt-disabled-stop-settlement.mjs
      - name: Diagnostic ChatGPT parent RPC
        run: node tests/userscript-chatgpt-parent-rpc.mjs
      - name: Diagnostic ChatGPT iframe host
        run: node tests/userscript-chatgpt-iframe-host.mjs
      - name: Diagnostic ChatGPT sandbox host
        run: node tests/userscript-chatgpt-sandbox-host.mjs
      - name: Diagnostic embed child
        run: node tests/userscript-embed-child.mjs
      - name: Diagnostic dev worker runtime
        run: node tests/userscript-dev-worker-runtime.mjs
      - name: Diagnostic userscript group 5 - host network runtime
        shell: bash
        run: |
          set -euo pipefail
          node tests/userscript-host.mjs
          node tests/userscript-decompress.mjs
          node tests/issue-5013-gzip-unhandled-rejection.mjs
          node tests/userscript-worker-arraybuffer.mjs
          node tests/userscript-network.mjs
          node tests/chatgpt-web-runtime.mjs
          node tests/ai-chatgpt-web-provider.mjs
          node tests/userscript-routes.mjs
          node tests/userscript-embed-route.mjs
      - name: Round 4 production bootstrap contract
        run: node tests/dev-agent/round4-production-bootstrap.mjs
      - name: Verify tiny committed loader is current
        if: steps.generated-policy.outputs.mode == 'enforce'
        run: git diff --exit-code -- userscript/hex.user.template.js

  # Both embed-browser suites intentionally exercise Chromium and WebKit. Run
  # them in Playwright's pinned image so every PR does not spend minutes
  # downloading 100+ MB of WebKit OS packages onto a fresh hosted runner.
  embed-browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build secure userscript runtime
        run: npm run userscript:build
      - name: Install matching Playwright package
        run: npm install --no-save --save-exact playwright@1.55.0
      - name: Verify pinned Chromium and WebKit image
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium, webkit } from 'playwright';
          for (const browserType of [chromium, webkit]) {
            const browser = await browserType.launch({ headless: true });
            await browser.close();
          }
          NODE
      - name: Verify opaque srcdoc module and storage execution
        run: node tests/userscript-srcdoc-probe.mjs
      - name: Run full secure sandbox startup
        run: node tests/userscript-sandbox-browser-e2e.mjs
      - name: Capture a ChatGPT turn against the production DOM
        run: node tests/chatgpt-web-production-dom.mjs
