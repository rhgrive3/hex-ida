name: Temporary local profile bundle

on:
  push:
    branches:
      - perf/cross-binary-under-10m-20260904

permissions:
  contents: read

concurrency:
  group: temporary-local-profile-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned BattleCats fixture
        env:
          HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
        run: |
          node scripts/fetch-real-fixtures.mjs battlecats
          node scripts/fetch-real-fixtures.mjs battlecats --check
          file tests/.real-fixtures/battlecats
      - name: Package complete source tree and fixture
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=local-profile-bundle.tgz \
            -czf local-profile-bundle.tgz .
      - name: Upload profile bundle
        uses: actions/upload-artifact@v4
        with:
          name: local-profile-bundle
          path: local-profile-bundle.tgz
          if-no-files-found: error
          retention-days: 1
