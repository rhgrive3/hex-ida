name: Phase 12 release validation

on:
  workflow_dispatch:
    inputs:
      expect_sha:
        description: Exact candidate commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase12-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expect_sha }}
          fetch-depth: 0
      - name: Resolve current main for ownership proof
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact candidate
        env:
          VERIFY_SHA: ${{ inputs.expect_sha }}
        run: npm run phase12:verify -- --expect-sha "$VERIFY_SHA"
