name: Fixer2 issue 4218 remote write

on:
  push:
    branches:
      - fix/issue-4218-gnu-hash-bloom-size

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-4218-gnu-hash-bloom-size
          fetch-depth: 0
      - name: Apply validated Drive-snapshot patch
        shell: bash
        env:
          TEST_B64: 
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/elf-dynamic.js)" = "a38d7727a99d8e141a721e4be17e281ae575bbc3"
          python - <<'PY'
          from pathlib import Path
          p = Path('js/binary/elf-dynamic.js')
          s = p.read_text()
          old = "  const nbuckets=r.u32(off),symOffset=r.u32(off+4),bloomSize=r.u32(off+8);if(!nbuckets||nbuckets>10_000_000||bloomSize>10_000_000)return 0;const word=bits===64?8:4;\n"
          new = "  const nbuckets=r.u32(off),symOffset=r.u32(off+4),bloomSize=r.u32(off+8);\n  const bloomSizeBig=BigInt(bloomSize);\n  if(!bloomSize||(bloomSizeBig&(bloomSizeBig-1n))!==0n){markDynamicPartial(image,`DT_GNU_HASH bloom_size ${bloomSize} is not a non-zero power of two`);onMalformed?.();return 0;}\n  if(!nbuckets||nbuckets>10_000_000||bloomSize>10_000_000)return 0;const word=bits===64?8:4;\n"
          if s.count(old) != 1:
              raise SystemExit('expected source anchor not found exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
          mkdir -p tests/phase4/binary
          printf '%s' "$TEST_B64" | base64 -d > tests/phase4/binary/issue-4218-elf-gnu-hash-bloom-size.test.mjs
          test "$(git hash-object js/binary/elf-dynamic.js)" = "e4ad9b724131a4aad339c48199c0ffc494711363"
          test "$(git hash-object tests/phase4/binary/issue-4218-elf-gnu-hash-bloom-size.test.mjs)" = "b6b3e7f39cec1acb0cc48b3c028d775cf9441bac"
          node --check js/binary/elf-dynamic.js
          node --test tests/phase4/binary/issue-4218-elf-gnu-hash-bloom-size.test.mjs tests/phase4/issue-3651-elf-gnu-hash-empty-buckets.test.mjs tests/phase4/binary/issue-5520-gnu-hash-bucket-below-symoffset.test.mjs
          git diff --check
          git rm .github/workflows/fixer2-4218-remote-write.yml
          git add js/binary/elf-dynamic.js tests/phase4/binary/issue-4218-elf-gnu-hash-bloom-size.test.mjs
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/fixer2-4218-remote-write.yml js/binary/elf-dynamic.js tests/phase4/binary/issue-4218-elf-gnu-hash-bloom-size.test.mjs "
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(elf): validate GNU hash bloom size"
          git push origin HEAD:fix/issue-4218-gnu-hash-bloom-size
