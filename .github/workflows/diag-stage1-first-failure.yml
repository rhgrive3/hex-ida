name: DIAG Stage1 first failure

on:
  pull_request:
    paths:
      - '.github/workflows/diag-stage1-first-failure.yml'
      - 'tests/machine-effects/**'
      - 'tests/stage1/**'
      - 'tools/validation/stage1/**'

permissions:
  contents: read

jobs:
  first-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: verify
        continue-on-error: true
        env:
          VERIFY_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/validation/stage1/verify.mjs --expect-sha "$VERIFY_SHA"
      - if: ${{ steps.verify.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: diag-stage1-first-failure-${{ github.run_id }}
          path: reports/stage1/stage1-verdict.json
          if-no-files-found: error
          retention-days: 1
      - if: ${{ steps.verify.outcome != 'success' }}
        run: exit 1
