name: Stage A exact-main final validation

on:
  push:
    branches:
      - validation/stage-a-final-20260917
    paths:
      - .github/workflows/stage-a-final-validation.yml

permissions:
  contents: read

env:
  CANDIDATE_SHA: 07957e1e74797643c7643595a33bfa4c89c1ead2

jobs:
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: 07957e1e74797643c7643595a33bfa4c89c1ead2, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --silent --no-audit --no-fund
      - name: Build twice with zero tracked drift
        shell: bash
        run: |
          set -euo pipefail
          npm run userscript:build --silent
          git diff --exit-code
          npm run userscript:build --silent
          git diff --exit-code
          npm run userscript:test --silent
          printf 'candidate=%s\nfirst-pass-clean=true\nsecond-pass-clean=true\nuserscript-test=PASS\n' "$CANDIDATE_SHA" > /tmp/generated.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: stage-a-generated-v2, path: /tmp/generated.txt, if-no-files-found: ignore, retention-days: 1 }

  repository-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: 07957e1e74797643c7643595a33bfa4c89c1ead2, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --silent --no-audit --no-fund
      - name: Repository check
        shell: bash
        run: |
          set +e
          npm run check --silent > /tmp/check.out 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then tail -n 120 /tmp/check.out > /tmp/check-first-failure.txt; fi
          exit "$rc"
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: stage-a-check-first-failure, path: /tmp/check-first-failure.txt, if-no-files-found: ignore, retention-days: 1 }

  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: 07957e1e74797643c7643595a33bfa4c89c1ead2, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --silent --no-audit --no-fund
      - name: Full test suite
        shell: bash
        run: |
          set +e
          npm test --silent > /tmp/full.out 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then tail -n 120 /tmp/full.out > /tmp/full-first-failure.txt; fi
          exit "$rc"
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: stage-a-full-first-failure, path: /tmp/full-first-failure.txt, if-no-files-found: ignore, retention-days: 1 }

  recovery-subsystems:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: 07957e1e74797643c7643595a33bfa4c89c1ead2, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --silent --no-audit --no-fund
      - name: Semantic, decompiler, effects, runtime, and phase gates
        shell: bash
        run: |
          set -u
          rc_all=0
          first=''
          run_gate() {
            name="$1"; shift
            set +e
            "$@" > "/tmp/${name}.out" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              rc_all=1
              if [ -z "$first" ]; then
                first="$name"
                { echo "first-failure=$name"; tail -n 120 "/tmp/${name}.out"; } > /tmp/subsystem-first-failure.txt
              fi
            fi
          }
          set -e
          run_gate semantic npm run semantic:test --silent
          run_gate semantic_v2 npm run semantic-v2:test --silent
          run_gate decompiler npm run decompiler:test --silent
          run_gate effects npm run effects:test --silent
          run_gate runtime npm run runtime:test --silent
          run_gate phase4 npm run phase4:test --silent
          run_gate phase7 npm run phase7:test --silent
          run_gate phase8 npm run phase8:test --silent
          run_gate phase9 npm run phase9:test --silent
          run_gate phase11 npm run phase11:test --silent
          run_gate phase12 npm run phase12:test --silent
          exit "$rc_all"
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: stage-a-subsystem-first-failure, path: /tmp/subsystem-first-failure.txt, if-no-files-found: ignore, retention-days: 1 }

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: 07957e1e74797643c7643595a33bfa4c89c1ead2, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --silent --no-audit --no-fund
      - name: Browser gate
        shell: bash
        run: |
          set +e
          npm run browser --silent > /tmp/browser.out 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then tail -n 120 /tmp/browser.out > /tmp/browser-first-failure.txt; fi
          exit "$rc"
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: stage-a-browser-first-failure, path: /tmp/browser-first-failure.txt, if-no-files-found: ignore, retention-days: 1 }
