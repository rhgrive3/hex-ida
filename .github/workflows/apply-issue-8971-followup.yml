name: Apply reviewed issue 8971 follow-up

on:
  push:
    branches:
      - fix/issue-8971-runtime-observation-complete

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/issue-8971-runtime-observation-complete
          fetch-depth: 0

      - name: Reassemble and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patch-staging-8971/part-* | base64 -d | gzip -d > /tmp/issue-8971.patch
          echo "e945ec6e02ebc06a34d23da86badf7f84d45b8350da6bcfaa5817c09865e12ac  /tmp/issue-8971.patch" | sha256sum -c -
          git apply --check /tmp/issue-8971.patch
          git apply /tmp/issue-8971.patch
          git diff --check

      - name: Validate focused runtime authority regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/issue-6214-authority-binary-freeze.mjs tests/issue-7108-observation-type-sensitive-identity.mjs tests/phase10/runtime/runtime-authority-owned-observation-4408.test.mjs tests/phase10/runtime/runtime-authority-falsy-boundaries.test.mjs tests/stage2/runtime-authority.test.mjs tests/stage2/managed-runtime.test.mjs tests/phase11/shared/issues-4361-4362-runtime-boundaries.test.mjs tests/phase10/runtime/issue-8971-runtime-observation-payload-admission.test.mjs
          node tests/phase10/run.mjs --group runtime
          node tests/check.mjs

      - name: Commit reviewed follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/runtime/authority.js tests/phase10/runtime/issue-8971-runtime-observation-payload-admission.test.mjs
          git diff --cached --check
          git commit -m "fix(runtime): complete observation resource authority (#8971)"
          git push origin HEAD:fix/issue-8971-runtime-observation-complete
