name: One-shot issue 2833 stack access family
on:
  push:
    branches: [fix/2833-stack-access-family]
    paths: [.github/workflows/one-shot-2833.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2833-stack-access-family
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python3 tools/tmp-2833.py
      - name: Focused regression
        run: node tests/issue-2833-stack-access-family.mjs
      - run: node --check js/analyze.js
      - name: Commit repair
        shell: bash
        run: |
          rm -f tools/tmp-2833.py .github/workflows/one-shot-2833.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(analyze): count all classified SP memory accesses (#2833)'
          git push origin HEAD:fix/2833-stack-access-family
