name: Temporary PR2677 CI repair
on:
  push:
    branches:
      - fix/reopened-ai-project-contracts
    paths:
      - .github/workflows/tmp-pr2677-ci-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reopened-ai-project-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update migration compatibility guardrail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/migration-guardrails.mjs')
          s = p.read_text()
          old_current = "assert.equal(projectApi.HEX_PROJECT_VERSION, 1, '.hexproj v1 import/export compatibility is required');"
          new_current = "assert.equal(projectApi.HEX_PROJECT_VERSION, 2, '.hexproj current version contract drifted');"
          if s.count(old_current) != 1:
              raise SystemExit(f'current version assertion drifted: {s.count(old_current)}')
          s = s.replace(old_current, new_current, 1)
          old_roundtrip = 'assert.equal(roundtrip.version, 1);'
          if s.count(old_roundtrip) < 1:
              raise SystemExit('roundtrip version assertion missing')
          s = s.replace(old_roundtrip, 'assert.equal(roundtrip.version, 2);', 1)
          marker = "  assert.equal(roundtrip.user.names[0].addr, 0x1000n);\n}"
          legacy = "\n".join([
              "  assert.equal(roundtrip.user.names[0].addr, 0x1000n);",
              "",
              "  const legacyV1 = JSON.parse(projectApi.serializeHexProject(project));",
              "  legacyV1.version = 1;",
              "  delete legacyV1.user.vars;",
              "  delete legacyV1.user.varsPresent;",
              "  const migrated = projectApi.parseHexProject(JSON.stringify(legacyV1));",
              "  assert.equal(migrated.version, 2);",
              "  assert.equal(migrated.user.varsPresent, false);",
              "  assert.deepEqual(migrated.user.vars, []);",
              "}",
          ])
          if s.count(marker) != 1:
              raise SystemExit(f'guardrail insertion marker drifted: {s.count(marker)}')
          p.write_text(s.replace(marker, legacy, 1))
          PY
          rm .github/workflows/tmp-pr2677-ci-repair.yml
          node tests/migration-guardrails.mjs
          node tests/reopened-ai-project-contracts.mjs
          git add tests/migration-guardrails.mjs .github/workflows/tmp-pr2677-ci-repair.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(project): preserve v1 migration guardrail under v2'
          git push origin HEAD:fix/reopened-ai-project-contracts
