name: X-02 real Apple acceptance

on:
  push:
    branches: [feat/analysis-roadmap-v8-current-main-20260907]
    paths:
      - .github/workflows/x02-real-acceptance.yml
      - tools/validation/x02-apple-runtime-evidence.mjs
      - tools/validation/x02-a08-provenance.mjs
      - js/binary/dyld-runtime.js
      - js/ui/dyld-runtime-navigation.js
      - js/ui/dyld-runtime-worker.js
      - js/ux.js
      - tests/scpa/x02-b06-browser-runtime-navigation.test.mjs
      - tests/scpa/fixtures/x02-a08-versioned-apple-corpus-20260917.json
      - tests/scpa/x02-prior120-apple-version-matrix.test.mjs
      - tests/scpa/x02-b06-runtime-dyld-evidence.test.mjs
      - tests/scpa/fixtures/x02-b06-runtime-dyld-evidence-20260916.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-apple-evidence:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v5 byte-offset regression
        run: node --test tests/phase4/binary/dyld-shared-cache-slide-v5-page-start.test.mjs
      - name: Verify finite X-02 lanes and browser runtime navigation
        run: |
          node --test tests/scpa/x02-prior120-apple-version-matrix.test.mjs
          node --test tests/scpa/x02-apple-version-matrix.test.mjs
          node --test tests/scpa/x02-declared-metadata-boundaries.test.mjs
          node --test tests/scpa/x02-b06-runtime-dyld-evidence.test.mjs
          node --test tests/scpa/x02-b06-browser-runtime-navigation.test.mjs
      - name: Collect real Apple evidence
        shell: bash
        run: |
          set +e
          node tools/validation/x02-apple-runtime-evidence.mjs x02-apple-runtime-evidence.json > collector-stdout.txt 2> collector-error.txt
          RC=$?
          printf '%s\n' "$RC" > collector-exit.txt
          exit "$RC"
      - name: Validate real Apple evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const e = JSON.parse(fs.readFileSync('x02-apple-runtime-evidence.json', 'utf8'));
          if (e.schema !== 'hex-x02-apple-runtime-evidence/v1') throw new Error('schema');
          if (e.appleEnvironment.machine !== 'arm64') throw new Error('machine');
          if (e.appleEnvironment.pointerAuthenticationFeature !== '1') throw new Error('pauth');
          if (!e.signedMachO.codesignStrictVerified || !/Mach-O/i.test(e.signedMachO.file)) throw new Error('signed-macho');
          const d = e.realDyldCache;
          if (d.slideInfoVersion !== 5 || d.sampledRebaseCount < 1 || !d.allSampleTargetsInDeclaredSharedRegion) throw new Error('dyld');
          if (!d.runtimeLoadMapObserved || !d.runtimeSlideObserved) throw new Error('dyld-runtime-observation');
          if (!/^[0-9a-f]{32}$/.test(d.cacheUuid) || d.runtimeCacheUuid !== d.cacheUuid) throw new Error('dyld-runtime-uuid');
          const sharedRegionStart = BigInt(d.sharedRegionStart);
          const sharedRegionSize = BigInt(d.sharedRegionSize);
          const runtimeCacheStart = BigInt(d.runtimeCacheStart);
          const runtimeCacheSize = BigInt(d.runtimeCacheSize);
          const runtimeSlide = BigInt(d.runtimeSlide);
          if (runtimeCacheStart !== sharedRegionStart + runtimeSlide || runtimeCacheSize < sharedRegionSize) throw new Error('dyld-runtime-range');
          if (d.runtimeImageCount < d.runtimeCacheImageCount || d.runtimeCacheImageCount < 1 || !Array.isArray(d.runtimeSampleImages) || d.runtimeSampleImages.length < 1) throw new Error('dyld-runtime-images');
          if (!d.runtimeSampleImages.every(image => BigInt(image.slide) === runtimeSlide) || !d.runtimeImagesAllUseObservedSlide) throw new Error('dyld-runtime-image-slide');
          if (d.runtimeDecodedRebaseCount !== d.sampledRebaseCount || !d.runtimeAddressDerivationVerified || !d.allRuntimeSampleTargetsInRuntimeSharedRegion) throw new Error('dyld-runtime-rebase');
          const p = e.pacRuntime.arm64;
          if (p.compileExit !== 0 || p.runExit !== 0 || !p.pacInstructionObserved || !p.authenticationInstructionObserved) throw new Error('pac-arm64-runtime');
          console.log(JSON.stringify({dyld:d.sampledRebaseCount, runtimeSlide:d.runtimeSlide, runtimeCacheImages:d.runtimeCacheImageCount, arm64Pac:p.runExit, arm64e:e.pacRuntime.arm64e.runExit ?? null}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x02-real-apple-acceptance-${{ github.sha }}
          path: |
            x02-apple-runtime-evidence.json
            collector-stdout.txt
            collector-error.txt
            collector-exit.txt
          if-no-files-found: ignore
          retention-days: 14

  a08-version-corpus:
    name: A08 provenance (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect versioned Apple provenance point
        env:
          X02_RUNNER_LABEL: ${{ matrix.runner }}
        run: node tools/validation/x02-a08-provenance.mjs x02-a08-${{ matrix.runner }}.json
      - name: Validate and print provenance point
        env:
          EVIDENCE_PATH: x02-a08-${{ matrix.runner }}.json
          EXPECTED_RUNNER: ${{ matrix.runner }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const e = JSON.parse(fs.readFileSync(process.env.EVIDENCE_PATH, 'utf8'));
          if (e.schema !== 'hex-x02-a08-provenance-point/v1') throw new Error('schema');
          if (e.runner.requestedLabel !== process.env.EXPECTED_RUNNER) throw new Error('runner-label');
          if (e.appleEnvironment.machine !== 'arm64') throw new Error('machine');
          if (e.runtimeObservation.executedOnCapturedOs !== true || e.runtimeObservation.exitStatus !== 0) throw new Error('runtime');
          for (const key of ['osProductVersion','osBuildVersion','darwinRelease','xcodeVersion','clangVersion','sdkVersion']) {
            if (!e.appleEnvironment[key]) throw new Error(`missing-${key}`);
          }
          for (const artifact of ['object','executable']) {
            const a = e.compilerProducedArtifacts[artifact];
            if (!/^[0-9a-f]{64}$/.test(a.sha256) || !/Mach-O/i.test(a.file) || !/arm64/i.test(a.file)) throw new Error(`artifact-${artifact}`);
          }
          console.log('A08_EVIDENCE_JSON=' + JSON.stringify(e));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: x02-a08-${{ matrix.runner }}-${{ github.sha }}
          path: x02-a08-${{ matrix.runner }}.json
          if-no-files-found: error
          retention-days: 30