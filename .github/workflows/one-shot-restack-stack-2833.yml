name: One-shot stack access restack 2833
on:
  push:
    branches: [fix/stack-access-current-2833-v2]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed focused diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/2833-stack-access-family
          base=$(git merge-base HEAD origin/fix/2833-stack-access-family)
          git diff "$base"..origin/fix/2833-stack-access-family -- js/analyze.js tests/issue-2833-stack-access-family.mjs | git apply --3way
          node tests/issue-2833-stack-access-family.mjs
          node tests/run.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/analyze.js tests/issue-2833-stack-access-family.mjs
          git diff --cached --quiet || git commit -m 'fix(analyze): count all SP load store families'
          git push
