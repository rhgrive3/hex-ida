name: PR2372 diagnostics

on:
  push:
    branches:
      - research/hex-me-01-independent-oracle

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: A2 effects diagnostics
        shell: bash
        run: |
          set +e
          npm run effects:test
          rc=$?
          echo "A2_EFFECTS_RC=$rc"
          exit 0
      - name: A2 coverage diagnostics
        shell: bash
        run: |
          set +e
          node tests/stage1/a2-machine-effects-coverage.test.mjs
          rc=$?
          echo "A2_COVERAGE_RC=$rc"
          exit 0
      - name: A9 binary diagnostics
        shell: bash
        run: |
          set +e
          npm run binary:test
          rc=$?
          echo "A9_BINARY_RC=$rc"
          exit 0
      - name: A9 benchmark diagnostics
        shell: bash
        run: |
          set +e
          npm run benchmark:baseline
          rc=$?
          echo "A9_BENCHMARK_RC=$rc"
          exit 0
      - name: Regenerate Stage2 denominator artifacts
        shell: bash
        run: |
          node tools/validation/stage2/build-profile-denominator-inventory.mjs
          node tools/validation/stage2/build-profile-denominator-lock.mjs
          git diff -- tools/validation/stage2/profile-denominator-inventory.json tools/validation/stage2/profile-denominators.lock.json
          node tests/stage2/profile-denominator-inventory.test.mjs
      - name: Upload regenerated denominator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr2372-generated-denominators
          path: |
            tools/validation/stage2/profile-denominator-inventory.json
            tools/validation/stage2/profile-denominators.lock.json
          if-no-files-found: error
