name: Apply issue 3681 fix

on:
  push:
    branches:
      - fix/issue-3681-ldpsw-width

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-3681-ldpsw-width
          fetch-depth: 1

      - name: Apply exact patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('js/arm64.js')
          text = source.read_text()
          replacements = [
            ('function pairLoadStore(isLoad) {\n', 'function pairLoadStore(isLoad, { elementSize = null, signedExtendToBits = null } = {}) {\n'),
            ('    const size = sizeOfReg(a);\n', '    const size = elementSize ?? sizeOfReg(a);\n'),
            ("    const isFpLr = a && b && a.k === 'reg' && b.k === 'reg'\n", "    const isFpLr = signedExtendToBits == null && a && b && a.k === 'reg' && b.k === 'reg'\n"),
            ("    } else if (onStack && mem.mode === 'post' && dispVal > 0n && isLoad) {\n", "    } else if (signedExtendToBits == null && onStack && mem.mode === 'post' && dispVal > 0n && isLoad) {\n"),
            ("    } else if (a && a.k === 'reg' && a.cls === 'gp' && a.num >= 19 && a.num <= 28) {\n", "    } else if (signedExtendToBits == null && a && a.k === 'reg' && a.cls === 'gp' && a.num >= 19 && a.num <= 28) {\n"),
            ('HANDLERS.ldpsw = pairLoadStore(true);', 'HANDLERS.ldpsw = pairLoadStore(true, { elementSize: 4, signedExtendToBits: 64 });'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          old_summary = """    o.summary = isLoad
              ? J(memText(mem) + 'から ' + sizeWord(size) + ' ずつ 2 個読み、' + opShort(a) + ' と ' + opShort(b) + ' に入れる。',
                  'Read two values into ' + opShort(a) + ' and ' + opShort(b) + '.')
              : J(opShort(a) + ' と ' + opShort(b) + ' を、' + memText(mem) + 'から順に 2 個ぶん書き込む。',
                  'Write ' + opShort(a) + ' and ' + opShort(b) + ' side by side.');
            o.detail.push(J(
              '2 本を 1 命令で扱えるので、関数の入口と出口でレジスタを退避／復元するときの定番です。',
              'Two registers in one instruction — the standard way to save and restore around a function.'));
          """
          new_summary = """    if (isLoad && signedExtendToBits != null) {
              o.title = J('符号付き値を 2 本まとめて読む', 'Load and sign-extend a pair');
              o.summary = J(
                memText(mem) + 'から ' + sizeWord(size) + ' の符号付き値を 2 個（合計 ' + sizeWord(size * 2) + '）読み、それぞれ ' + signedExtendToBits + ' ビットへ符号拡張して ' + opShort(a) + ' と ' + opShort(b) + ' に入れる。',
                'Read two signed ' + (size * 8) + '-bit values (' + sizeWord(size * 2) + ' total) from ' + memText(mem) + ', sign-extend each to ' + signedExtendToBits + ' bits, and place them in ' + opShort(a) + ' and ' + opShort(b) + '.');
              o.detail.push(J(
                'メモリ上では各要素は ' + sizeWord(size) + ' だけを読み、レジスタへ入れるときに符号を保ったまま幅を広げます。',
                'Each memory element is only ' + sizeWord(size) + '; widening happens after the load while preserving the sign.'));
              o.terms.push('signedness');
            } else {
              o.summary = isLoad
                ? J(memText(mem) + 'から ' + sizeWord(size) + ' ずつ 2 個読み、' + opShort(a) + ' と ' + opShort(b) + ' に入れる。',
                    'Read two values into ' + opShort(a) + ' and ' + opShort(b) + '.')
                : J(opShort(a) + ' と ' + opShort(b) + ' を、' + memText(mem) + 'から順に 2 個ぶん書き込む。',
                    'Write ' + opShort(a) + ' and ' + opShort(b) + ' side by side.');
              o.detail.push(J(
                '2 本を 1 命令で扱えるので、関数の入口と出口でレジスタを退避／復元するときの定番です。',
                'Two registers in one instruction — the standard way to save and restore around a function.'));
            }
          """
          if text.count(old_summary) != 1:
              raise SystemExit(f'expected one pair summary block, got {text.count(old_summary)}')
          source.write_text(text.replace(old_summary, new_summary, 1))

          test = Path('tests/phase4/issue-3681-ldpsw-explanation.test.mjs')
          if test.exists():
              raise SystemExit('issue 3681 test already exists unexpectedly')
          test.write_text("""import assert from 'node:assert/strict';
          import { explain } from '../../js/arm64.js';
          import { lang, setLang } from '../../js/i18n.js';

          const previousLanguage = lang();
          try {
            setLang('en');

            for (const operands of [
              'x0, x1, [x2]',
              'x0, x1, [x2, #8]!',
              'x0, x1, [x2], #8',
            ]) {
              const result = explain('ldpsw', operands, 0n, {});
              assert.match(result.summary, /two signed 32-bit values/i, `${operands} must describe 32-bit memory elements`);
              assert.match(result.summary, /8 bytes total/i, `${operands} must describe the pair's total memory span`);
              assert.match(result.summary, /sign-extend each to 64 bits/i, `${operands} must describe sign extension`);
              assert.equal(result.title, 'Load and sign-extend a pair');
            }

            assert.equal(explain('ldp', 'w0, w1, [x2]', 0n, {}).summary, 'Read two values into w0 and w1.');
            assert.equal(explain('ldp', 'x0, x1, [x2]', 0n, {}).summary, 'Read two values into x0 and x1.');
            assert.equal(explain('ldnp', 'x0, x1, [x2]', 0n, {}).summary, 'Read two values into x0 and x1.');
            assert.equal(explain('stp', 'x0, x1, [x2]', 0n, {}).summary, 'Write x0 and x1 side by side.');
            assert.equal(explain('stnp', 'x0, x1, [x2]', 0n, {}).summary, 'Write x0 and x1 side by side.');

            const stackPost = explain('ldpsw', 'x29, x30, [sp], #8', 0n, {});
            assert.equal(stackPost.title, 'Load and sign-extend a pair');
            assert.match(stackPost.summary, /signed 32-bit values/i);
            assert.doesNotMatch(stackPost.summary, /Take .* back off the stack/i);

            setLang('ja');
            const japanese = explain('ldpsw', 'x0, x1, [x2]', 0n, {});
            assert.match(japanese.summary, /4 バイト（32 ビット）/);
            assert.match(japanese.summary, /合計 8 バイト（64 ビット）/);
            assert.match(japanese.summary, /64 ビットへ符号拡張/);
          } finally {
            setLang(previousLanguage);
          }

          console.log('issue-3681-ldpsw-explanation: PASS');
          """.replace(/^          /gm, ''))
          PY

      - name: Focused validation
        shell: bash
        run: |
          node --check js/arm64.js
          node --check tests/phase4/issue-3681-ldpsw-explanation.test.mjs
          node tests/phase4/issue-3681-ldpsw-explanation.test.mjs
          node tests/arm64-presentation-compat.mjs
          node tests/arm64-explainer-semantics.mjs
          git diff --check

      - name: Commit final diff and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-3681-apply.yml
          git add js/arm64.js tests/phase4/issue-3681-ldpsw-explanation.test.mjs
          git diff --cached --check
          git commit -m "fix(arm64): explain LDPSW word loads correctly"
          git push origin HEAD:fix/issue-3681-ldpsw-width
