name: ARM64 PAuth presentation semantics one-shot

on:
  push:
    branches:
      - fix/2259-arm64-pauth-presentation-semantics

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/2259-arm64-pauth-presentation-semantics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify PAuth presentation patch
        run: |
          set -euo pipefail
          node tools/arm64-pauth-presentation-semantics-one-shot.mjs
          node tests/arm64-pauth-presentation-semantics.test.mjs
      - name: Commit patch and remove temporary runner
        env:
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workflow='.github/workflows/arm64-pauth-presentation-semantics-one-shot.yml'
          helper='tools/arm64-pauth-presentation-semantics-one-shot.mjs'
          git rm -- "$workflow" "$helper"
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(js/arm64\.js|tests/arm64-pauth-presentation-semantics\.test\.mjs|\.github/workflows/arm64-pauth-presentation-semantics-one-shot\.yml|tools/arm64-pauth-presentation-semantics-one-shot\.mjs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected files changed:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git fetch origin fix/2259-arm64-pauth-presentation-semantics
          if [[ "$(git rev-parse FETCH_HEAD)" != "$START_SHA" ]]; then
            echo 'Branch moved; refusing stale push.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js/arm64.js tests/arm64-pauth-presentation-semantics.test.mjs
          git commit -m 'fix(arm64): make PAuth presentation operand-aware'
          git push origin HEAD:fix/2259-arm64-pauth-presentation-semantics
