name: restack-2436
on:
  push:
    branches: [restack/2436-current-main]
permissions:
  contents: write
jobs:
  restack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Apply SIMD register modifier guard
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'); const p='js/targets/architecture/arm64/effects/simd.js'; let s=fs.readFileSync(p,'utf8');
          let a=`function validRegisterNumber(op) {\n  return Number.isInteger(op?.num) && op.num >= 0 && op.num < 32;\n}`;
          let b=a+`\nfunction hasForbiddenSimdRegisterModifier(op) {\n  if (!op) return false;\n  if (op.k === 'list') return (op.regs || []).some(hasForbiddenSimdRegisterModifier);\n  const simdRegister = op.k === 'elem' || (op.k === 'reg' && (op.cls === 'vec' || op.cls === 'fp'));\n  return simdRegister && (op.shift != null || op.extend != null);\n}`;
          if(!s.includes(a)) throw new Error('SIMD helper checkpoint missing'); s=s.replace(a,b);
          a=`  if (mnemonic === 'addp' && ops[0]?.k === 'reg' && ops[0].cls === 'fp') return scalarSimdEffects(instruction, context, mnemonic, ops);`;
          b=`  if (ops.some(hasForbiddenSimdRegisterModifier)) {\n    return partial(instruction, context, 'arm64-simd-register-modifier-unencodable', ['registers','flags','other']);\n  }\n`+a;
          if(!s.includes(a)) throw new Error('SIMD dispatch checkpoint missing'); fs.writeFileSync(p,s.replace(a,b));
          NODE
          cat > tests/machine-effects/arm64-simd-register-modifier-encoding.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { parseOperands } from '../../js/arm64.js';
          import { liftArm64SimdEffects } from '../../js/targets/architecture/arm64/effects/simd.js';
          let sequence=0;
          function lift(mnemonic,operands){const instructionId=`arm64-simd-register-modifier-${++sequence}`;return liftArm64SimdEffects({instructionId,mnemonic,operands,ops:parseOperands(operands),mode:'a64',origin:{instructionIds:[instructionId]}});}
          for(const [m,o] of [['add','v0.4s, v1.4s, v2.4s'],['and','v0.16b, v1.16b, v2.16b'],['cmeq','v0.4s, v1.4s, v2.4s'],['fadd','v0.4s, v1.4s, v2.4s'],['shl','v0.4s, v1.4s, #3'],['movi','v0.4s, #3, lsl #8']]){const e=lift(m,o);assert.ok(e&&['exact','exact-with-intrinsic'].includes(e.completeness),`${m} ${o}: legal SIMD form`);}
          for(const [m,o] of [['add','v0.4s, v1.4s, v2.4s, lsl #1'],['and','v0.16b, v1.16b, v2.16b, lsl #1'],['cmeq','v0.4s, v1.4s, v2.4s, lsl #1'],['fadd','v0.4s, v1.4s, v2.4s, lsl #1'],['fmul','v0.4s, v1.4s, v2.s[1], lsl #1']]){const e=lift(m,o);assert.ok(e);assert.equal(e.completeness,'partial');assert.equal(e.operations.some(x=>['register-read','register-write','intrinsic'].includes(x.kind)),false);}
          console.log('arm64 SIMD register modifier encoding: PASS');
          EOF
      - run: node tests/machine-effects/arm64-simd-register-modifier-encoding.test.mjs
      - name: Commit functional restack only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/zz-restack-2436.yml
          git add js/targets/architecture/arm64/effects/simd.js tests/machine-effects/arm64-simd-register-modifier-encoding.test.mjs .github/workflows/zz-restack-2436.yml
          git commit -m 'fix(arm64): reject register modifiers in SIMD forms'
          git push origin HEAD:restack/2436-current-main