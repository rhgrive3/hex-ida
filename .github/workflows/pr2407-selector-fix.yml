name: PR2407 selector fix

on:
  push:
    branches:
      - fix/2392-objc-indirect-selector-fail-closed

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2392-objc-indirect-selector-fail-closed
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact fail-closed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          legacy = Path('js/objc-legacy.js')
          text = legacy.read_text()

          old_header = '''export function decodeMethodListHeader(rawEntsize) {
            const raw=Number(rawEntsize)>>>0;
            return { relative:!!(raw&REL_FLAG), directSelector:!!(raw&DIRECT_SEL_FLAG), stride:raw&ENTSIZE_MASK };
          }
          '''
          new_header = '''export function decodeMethodListHeader(rawEntsize) {
            const raw=Number(rawEntsize)>>>0;
            return { relative:!!(raw&REL_FLAG), directSelector:!!(raw&DIRECT_SEL_FLAG), stride:raw&ENTSIZE_MASK };
          }

          /**
           * Resolve the selector-address representation declared by a relative
           * method-list header. Indirect entries are never reinterpreted as
           * direct C strings when pointer resolution fails (#2392).
           */
          export async function resolveRelativeMethodSelectorAddress(directSelector, nameTarget, dereference) {
            if (directSelector) return nameTarget;
            if (typeof dereference !== 'function') return null;
            try {
              const resolved = await dereference(nameTarget);
              return resolved == null ? null : BigInt(resolved);
            } catch {
              return null;
            }
          }
          '''
          if text.count(old_header) != 1:
              raise SystemExit('legacy header anchor mismatch')
          text = text.replace(old_header, new_header, 1)

          old_doc = ''' * 相対型の「名前」は、名前そのものではなく名前を指すポインタを指していることがある
           * ので、1 段たどってみて、だめなら直接読む。
          '''
          new_doc = ''' * 相対型の selector 表現は method-list header の directSelector flag が決める。
           * indirect form は selector-reference を 1 段たどれた場合だけ採用し、解決失敗時に
           * storage 自身を direct C string として読み替えない。
          '''
          if text.count(old_doc) != 1:
              raise SystemExit('legacy doc anchor mismatch')
          text = text.replace(old_doc, new_doc, 1)

          old_block = '''      if (directSelector) nameAddr = nameTarget;
                else {
                  nameAddr = await pointer(get, nameTarget);
                  if (nameAddr == null || await cstring(get, nameAddr) == null) nameAddr = nameTarget;
                }
          '''
          new_block = '''      nameAddr = await resolveRelativeMethodSelectorAddress(
                  directSelector,
                  nameTarget,
                  (addr) => pointer(get, addr),
                );
                if (nameAddr == null) {
                  markLegacyPartial(completeness, 'method-selector-unresolved', 'incompleteMethodLists');
                  continue;
                }
          '''
          if text.count(old_block) != 1:
              raise SystemExit('legacy selector anchor mismatch')
          text = text.replace(old_block, new_block, 1)
          legacy.write_text(text)

          extended = Path('js/apple/objc-metadata.js')
          text = extended.read_text()
          old_import = "import { pagedReader, sanitizePointer, decodeMethodListHeader } from '../objc-legacy.js';"
          new_import = "import { pagedReader, sanitizePointer, decodeMethodListHeader, resolveRelativeMethodSelectorAddress } from '../objc-legacy.js';"
          if text.count(old_import) != 1:
              raise SystemExit('extended import anchor mismatch')
          text = text.replace(old_import, new_import, 1)

          old_ext = '''      if (directSelector) nameAddr = nameTarget;
                else {
                  nameAddr = await ptr(get, nameTarget);
                  if (nameAddr == null) { invalidEntries++; continue; }
                }
          '''
          new_ext = '''      nameAddr = await resolveRelativeMethodSelectorAddress(
                  directSelector,
                  nameTarget,
                  (addr) => ptr(get, addr),
                );
                if (nameAddr == null) { invalidEntries++; continue; }
          '''
          if text.count(old_ext) != 1:
              raise SystemExit('extended selector anchor mismatch')
          text = text.replace(old_ext, new_ext, 1)
          extended.write_text(text)
          PY
      - name: Focused regressions
        run: |
          node tests/objc-issue-2392-indirect-selector.mjs
          node tests/objc-issue-2392-legacy-indirect-selector.mjs
      - name: Commit code fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/objc-legacy.js js/apple/objc-metadata.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(objc): close legacy indirect selector fallback"
          git push origin HEAD:fix/2392-objc-indirect-selector-fail-closed
