name: Temporary #9121 syntax compare

on:
  push:
    branches:
      - diag/9121-syntax-compare-20260917
    paths:
      - '.github/workflows/tmp9121-syntax-compare.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 02488387ac993a7ec6e2507e69fda7ab4ea5dc23
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Candidate syntax
        id: candidate
        shell: bash
        run: |
          set +e
          timeout 120s node tests/check.mjs > /tmp/candidate.out 2>&1
          rc=$?
          printf 'candidate_rc=%s\n' "$rc" > syntax-compare.txt
          head -n 40 /tmp/candidate.out >> syntax-compare.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/checkout@v7
        with:
          ref: 34629f7a44b5a4aafb4654848b88c6054a746d4b
          fetch-depth: 1
      - name: Base syntax
        id: base
        shell: bash
        run: |
          set +e
          timeout 120s node tests/check.mjs > /tmp/base.out 2>&1
          rc=$?
          printf '\nbase_rc=%s\n' "$rc" >> syntax-compare.txt
          head -n 40 /tmp/base.out >> syntax-compare.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: syntax-compare
          path: syntax-compare.txt
          retention-days: 1
      - name: Record comparison
        shell: bash
        run: |
          echo "candidate=${{ steps.candidate.outputs.rc }} base=${{ steps.base.outputs.rc }}" >> "$GITHUB_STEP_SUMMARY"
