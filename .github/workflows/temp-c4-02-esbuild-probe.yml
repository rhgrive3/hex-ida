name: Temporary C4-02 esbuild probe
on:
  push:
    branches: ['impl/c4-02-finish-20260916']
    paths: ['.github/workflows/temp-c4-02-esbuild-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0610dbd0bec3444625bbdc1ceed71610e9a4a928
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe esbuild import only
        run: node --input-type=module -e "await import('esbuild')"
