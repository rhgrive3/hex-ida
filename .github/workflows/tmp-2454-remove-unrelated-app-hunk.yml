name: Temporary PR 2454 app cleanup

on:
  push:
    branches:
      - fix/issue-2376-swift-pointer-resolver

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove unrelated validatedFunctionRange change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          old = """    const region=this.executableRegionFor(fn.start); if(!region) return {ok:false,reason:'function-start-not-executable',function:fn};
              const regionEnd=region.vmAddr+region.size;
              let end=fn.end!=null?BigInt(fn.end):regionEnd;
              let complete=true,reason=null;
              if(end<=fn.start){return {ok:false,reason:'invalid-function-range',function:fn,region};}
              if(end>regionEnd){end=regionEnd;complete=false;reason='symbol-range-crosses-executable-region';}
              return {ok:true,start:fn.start,end,region,function:fn,complete,reason,provenance:'executable-region+symbol-boundary'};"""
          new = """    const region=this.executableRegionFor(fn.start); if(!region) return {ok:false,reason:'function-start-not-executable',function:fn};
              if(fn.end==null)return {ok:false,reason:'function-end-unproven',function:fn,region};
              const regionEnd=region.vmAddr+region.size;
              let end=BigInt(fn.end);
              let complete=true,reason=null;
              if(end<=fn.start){return {ok:false,reason:'invalid-function-range',function:fn,region};}
              if(end>regionEnd){end=regionEnd;complete=false;reason='symbol-range-crosses-executable-region';}
              return {ok:true,start:fn.start,end,region,function:fn,complete,reason,provenance:'executable-region+proven-function-extent'};"""
          if old not in text:
              raise SystemExit('expected PR #2454 validatedFunctionRange hunk not found exactly; refusing broad edit')
          if text.count(old) != 1:
              raise SystemExit('expected hunk is not unique; refusing broad edit')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- js/app.js
      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-2454-remove-unrelated-app-hunk.yml
          git add js/app.js
          git commit -m 'fix: remove unrelated function-range change from #2454'
          git push origin HEAD:${GITHUB_REF_NAME}
