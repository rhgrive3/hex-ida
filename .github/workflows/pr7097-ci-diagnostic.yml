name: PR7097 CI diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'perf/development-gate-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Migration guardrails
        run: node tests/migration-guardrails.mjs
      - name: Reusable release validation
        run: node tests/reusable-release-validation.mjs
      - name: Universal source
        run: node tests/universal-binary-source.mjs
      - name: Binary platform
        run: node tests/binary-platform.mjs
      - name: Universal binary
        run: node tests/universal-binary.mjs
      - name: Binary gate
        run: node tests/universal-binary-gate.mjs
