name: Cancel stale PR workflow runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-pr-runs.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: cancel-stale-pr-workflow-runs
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel queued/in-progress runs for closed PR branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sameRepo = `${owner}/${repo}`;

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const keepBranches = new Set(['main']);
            const keepPrNumbers = new Set();
            for (const pr of openPrs) {
              keepPrNumbers.add(pr.number);
              if (pr.head.repo?.full_name === sameRepo && pr.head.ref) {
                keepBranches.add(pr.head.ref);
              }
            }

            core.info(`Open PRs: ${[...keepPrNumbers].join(', ') || '(none)'}`);
            core.info(`Protected branches: ${[...keepBranches].join(', ')}`);

            const candidates = [];
            for (const status of ['queued', 'in_progress', 'waiting', 'pending']) {
              try {
                const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner,
                  repo,
                  event: 'pull_request',
                  status,
                  per_page: 100,
                });
                candidates.push(...runs);
              } catch (error) {
                core.info(`Status ${status} is not available on this API path: ${error.message}`);
              }
            }

            const byId = new Map(candidates.map((run) => [run.id, run]));
            let cancelled = 0;
            let preserved = 0;
            let alreadyTerminal = 0;

            for (const run of byId.values()) {
              if (run.id === context.runId) {
                preserved++;
                continue;
              }

              const branch = run.head_branch || '';
              const linkedOpenPr = (run.pull_requests || []).some((pr) => keepPrNumbers.has(pr.number));
              if (keepBranches.has(branch) || linkedOpenPr) {
                core.info(`KEEP ${run.id} ${branch} ${run.name}`);
                preserved++;
                continue;
              }

              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`CANCEL ${run.id} ${branch} ${run.name}`);
                cancelled++;
              } catch (error) {
                if (error.status === 409) {
                  alreadyTerminal++;
                  core.info(`SKIP terminal ${run.id} ${branch} ${run.name}`);
                  continue;
                }
                throw error;
              }
            }

            core.summary
              .addHeading('Stale PR workflow cleanup')
              .addRaw(`Cancelled: ${cancelled}\n`)
              .addRaw(`Preserved: ${preserved}\n`)
              .addRaw(`Already terminal: ${alreadyTerminal}\n`)
              .addRaw(`Open PRs preserved: ${[...keepPrNumbers].join(', ') || '(none)'}\n`)
              .write();