name: Cancel stale PR workflow runs

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-pr-runs.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: cancel-stale-pr-workflow-runs
  cancel-in-progress: true

jobs:
  cancel-stale:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel closed-PR and obsolete-head runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sameRepo = `${owner}/${repo}`;

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const openByNumber = new Map();
            const openByBranch = new Map();
            for (const pr of openPrs) {
              openByNumber.set(pr.number, pr);
              if (pr.head.repo?.full_name === sameRepo && pr.head.ref) {
                openByBranch.set(pr.head.ref, pr);
              }
            }

            core.info(`Open PRs: ${[...openByNumber.keys()].join(', ') || '(none)'}`);

            const candidates = [];
            for (const status of ['queued', 'in_progress', 'waiting', 'pending']) {
              try {
                const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner,
                  repo,
                  event: 'pull_request',
                  status,
                  per_page: 100,
                });
                candidates.push(...runs);
              } catch (error) {
                core.info(`Status ${status} is not available on this API path: ${error.message}`);
              }
            }

            const byId = new Map(candidates.map((run) => [run.id, run]));
            let cancelledClosed = 0;
            let cancelledObsolete = 0;
            let preserved = 0;
            let alreadyTerminal = 0;

            for (const run of byId.values()) {
              if (run.id === context.runId) {
                preserved++;
                continue;
              }

              const branch = run.head_branch || '';
              let currentPr = null;
              for (const link of run.pull_requests || []) {
                const candidate = openByNumber.get(link.number);
                if (candidate) {
                  currentPr = candidate;
                  break;
                }
              }
              if (!currentPr) currentPr = openByBranch.get(branch) || null;

              const currentHead = currentPr?.head?.sha || null;
              if (currentHead && run.head_sha === currentHead) {
                core.info(`KEEP current ${run.id} #${currentPr.number} ${branch} ${run.name}`);
                preserved++;
                continue;
              }

              const reason = currentHead
                ? `obsolete head ${run.head_sha} != ${currentHead}`
                : 'no open PR owns this run';
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`CANCEL ${run.id} ${branch} ${run.name}: ${reason}`);
                if (currentHead) cancelledObsolete++;
                else cancelledClosed++;
              } catch (error) {
                if (error.status === 409) {
                  alreadyTerminal++;
                  core.info(`SKIP terminal ${run.id} ${branch} ${run.name}`);
                  continue;
                }
                throw error;
              }
            }

            core.summary
              .addHeading('Stale PR workflow cleanup')
              .addRaw(`Cancelled closed/unlinked PR runs: ${cancelledClosed}\n`)
              .addRaw(`Cancelled obsolete-head runs: ${cancelledObsolete}\n`)
              .addRaw(`Preserved current-head runs: ${preserved}\n`)
              .addRaw(`Already terminal: ${alreadyTerminal}\n`)
              .write();