name: Temporary independent source export
on:
  push:
    branches: [diagnostic/independent-source-20260914]
    paths: [.github/workflows/independent-source-export-temporary.yml]
permissions:
  contents: read
jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: 962678eee50d23d225d37948d4803fbbbf575aee
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 1
        with:
          node-version: '22'
      - name: Export pinned source
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 962678eee50d23d225d37948d4803fbbbf575aee
          test "$(git rev-parse HEAD^{tree})" = e4fab47ed453a23d7fac037a4d5f53c6a3fba1f0
          mkdir -p "$RUNNER_TEMP/independent-source-export"
          timeout --kill-after=3s 30s git archive --format=zip --output="$RUNNER_TEMP/independent-source-export/hex-ida-pr7036-962678ee.zip" HEAD
          printf '%s\n' 'Source commit: 962678eee50d23d225d37948d4803fbbbf575aee' 'Source tree: e4fab47ed453a23d7fac037a4d5f53c6a3fba1f0' > "$RUNNER_TEMP/independent-source-export/SOURCE.txt"
      - name: Export only the lockfile-installed build compiler
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=3s 140s npm ci --no-audit --no-fund
          node --input-type=module -e "import esbuild from 'esbuild'; if(esbuild.version !== '0.28.2') throw Error('unexpected compiler version'); console.log(esbuild.version)"
          timeout --kill-after=3s 30s tar -czf "$RUNNER_TEMP/independent-source-export/esbuild-0.28.2-linux-x64.tar.gz" node_modules/esbuild node_modules/@esbuild/linux-x64
          node --version >> "$RUNNER_TEMP/independent-source-export/SOURCE.txt"
          sha256sum package-lock.json >> "$RUNNER_TEMP/independent-source-export/SOURCE.txt"
      - name: Record artifact identities
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/independent-source-export"
          sha256sum ./*.zip > SHA256SUMS
          if test -f esbuild-0.28.2-linux-x64.tar.gz; then sha256sum esbuild-0.28.2-linux-x64.tar.gz >> SHA256SUMS; fi
          cat SOURCE.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 2
        with:
          name: independent-source-962678ee
          path: ${{ runner.temp }}/independent-source-export/
          if-no-files-found: error
          retention-days: 1
