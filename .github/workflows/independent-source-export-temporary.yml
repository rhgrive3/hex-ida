name: Temporary independent source export
on:
  push:
    branches: [diagnostic/independent-source-20260914]
    paths: [.github/workflows/independent-source-export-temporary.yml]
permissions:
  contents: read
jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: bdb22111d040d8c7549b159211405e32e64bdd56
          fetch-depth: 1
          persist-credentials: false
      - name: Export pinned source without changing the source branch
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bdb22111d040d8c7549b159211405e32e64bdd56
          test "$(git rev-parse HEAD^{tree})" = 1618b17f9137d56bb614cc5960aa39eba6d3ae12
          mkdir -p "$RUNNER_TEMP/independent-source-export"
          timeout --kill-after=3s 30s git archive --format=zip --output="$RUNNER_TEMP/independent-source-export/hex-ida-pr7036-bdb22111.zip" HEAD
          cd "$RUNNER_TEMP/independent-source-export"
          sha256sum ./*.zip > SHA256SUMS
          printf '%s\n' 'Source commit: bdb22111d040d8c7549b159211405e32e64bdd56' 'Source tree: 1618b17f9137d56bb614cc5960aa39eba6d3ae12' > SOURCE.txt
          cat SOURCE.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        timeout-minutes: 2
        with:
          name: independent-source-bdb22111
          path: ${{ runner.temp }}/independent-source-export/
          if-no-files-found: error
          retention-days: 1
