name: Generated userscript main sync

on:
  push:
    branches: [main]
    paths:
      - 'js/userscript/**'
      - 'scripts/build-userscript.mjs'
      - 'scripts/userscript-release-version.mjs'
      - 'scripts/sync-generated-userscript.mjs'
      - 'tools/validation/generated-output-policy.mjs'
      - 'tests/dev-agent/sync-generated-userscript.mjs'
      - 'userscript/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generated-sync.yml'
      - '.github/workflows/generated-userscript-autofix.yml'
      - '.github/workflows/generated-userscript-main-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-userscript-main-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact main push
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prove protected-main generated-output boundaries
        run: node tests/dev-agent/sync-generated-userscript.mjs
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Restore deployment-only build identity
        run: git restore --source=HEAD --worktree -- js/userscript/deployment-identity.generated.js
      - name: Require canonical generated outputs to remain tracked
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- \
            userscript/hex.user.template.js \
            userscript/release-version.json >/dev/null
      - name: Require main generated outputs to be canonical
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(userscript/hex\.user\.template\.js|userscript/release-version\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'userscript:build changed files outside the generated-output allowlist:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --exit-code -- userscript/hex.user.template.js userscript/release-version.json
