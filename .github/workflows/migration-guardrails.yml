name: Migration guardrails

on:
  pull_request:
    paths:
      - 'js/architecture/**'
      - 'js/ir.js'
      - 'js/ir-core.js'
      - 'js/dataflow*.js'
      - 'js/decompiler/**'
      - 'js/binary/**'
      - 'js/bytesource/**'
      - 'js/platform/**'
      - 'js/project/**'
      - 'js/runtime/**'
      - 'js/runtime-evidence/**'
      - 'js/symbolic/**'
      - 'js/ai/**'
      - 'js/ui/**'
      - 'js/ui.js'
      - 'js/ui-root.js'
      - 'js/panels.js'
      - 'js/app.js'
      - 'js/backend.js'
      - 'js/worker*.js'
      - 'worker-entry.js'
      - 'package.json'
      - 'tests/migration-guardrails.mjs'
      - 'docs/MIGRATION_GUARDRAILS.md'
      - '.github/workflows/migration-guardrails.yml'
  workflow_dispatch:

concurrency:
  group: migration-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run all migration proofs and aggregate failures
        env:
          RUN_FULL_CHECK: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';

          const commands = [
            'npm run migration:test',
            'npm run binary:source-test',
          ];
          if (process.env.RUN_FULL_CHECK === 'true') commands.push('npm run check');

          const failures = [];
          for (const command of commands) {
            console.log(`::group::${command}`);
            const result = spawnSync(command, {
              shell: true,
              stdio: 'inherit',
              env: process.env,
            });
            console.log('::endgroup::');
            if (result.error || result.status !== 0) {
              failures.push({ command, status: result.status, error: result.error?.message ?? null });
            }
          }
          if (failures.length) {
            console.error(`Migration guardrail failures: ${JSON.stringify(failures)}`);
            process.exit(1);
          }
          NODE
