name: Temporary cross-binary serial repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-cross-binary-serial-repair.yml'

permissions:
  contents: write

concurrency:
  group: tmp-cross-binary-serial-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard and serialize exact parser lanes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/cross-binary-accuracy.yml)" = "bf88f66b3ce97a2cec76c1820f33e1c5537f6aa7"
          test "$(git hash-object tests/issue-497-cross-binary-workflow.mjs)" = "2a7cc796fc52767eb6d4d3d0445618a62e048e17"
          echo '' | base64 -d > /tmp/repair.py
          echo '97954e83fe1e1dd4b321a716668da1e7f10b4e33d1248b0b29f7488e8c1d2bf1  /tmp/repair.py' | shasum -a 256 -c -
          python3 /tmp/repair.py
          git diff --check
          node tests/issue-497-cross-binary-workflow.mjs
          test "$(grep -c -- '--max-old-space-size=4096' .github/workflows/cross-binary-accuracy.yml)" -eq 2
          ! grep -q 'accuracy-local-nonpseudoc-0.log &' .github/workflows/cross-binary-accuracy.yml
          ! grep -q 'accuracy-local-nonpseudoc-1.log &' .github/workflows/cross-binary-accuracy.yml
      - name: Publish serialized CI repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-cross-binary-serial-repair.yml
          git add .github/workflows/cross-binary-accuracy.yml tests/issue-497-cross-binary-workflow.mjs
          git commit -m 'fix(ci): serialize cross-binary parser lanes'
          git push origin HEAD:main
