name: diag-fix-7036-ownership
on:
  push:
    branches:
      - fix/7036-ownership-x02-collector-20260917
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch ownership and validate
        shell: bash
        run: |
          set -euo pipefail
          STATUS=/tmp/fix-7036.txt
          : > "$STATUS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          timeout 90s git fetch --no-tags origin main >/tmp/fetch.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/validation/analysis-roadmap/ownership.mjs')
          s = p.read_text()
          target = "    '.github/workflows/ghidra-differential.yml',\n"
          add = "    '.github/workflows/x02-collector-fix.yml',\n"
          if add not in s:
              if target not in s:
                  raise SystemExit('ownership.mjs anchor missing')
              s = s.replace(target, target + add, 1)
              p.write_text(s)
          p = Path('tools/validation/analysis-roadmap/ownership.json')
          s = p.read_text()
          target = '      ".github/workflows/ghidra-differential.yml",\n'
          add = '      ".github/workflows/x02-collector-fix.yml",\n'
          if add not in s:
              if target not in s:
                  raise SystemExit('ownership.json anchor missing')
              s = s.replace(target, target + add, 1)
              p.write_text(s)
          PY
          git rm .github/workflows/diag-fix-7036-ownership.yml >/dev/null
          git add tools/validation/analysis-roadmap/ownership.mjs tools/validation/analysis-roadmap/ownership.json
          git diff --cached --check
          git commit -m 'fix(analysis): register X-02 collector ownership' >/tmp/commit.log 2>&1
          CLEAN_HEAD=$(git rev-parse HEAD)
          BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          echo "base=$BASE_SHA" >> "$STATUS"
          echo "clean_head=$CLEAN_HEAD" >> "$STATUS"
          LOGICAL_BRANCH=feat/analysis-roadmap-v8-current-main-20260907
          set +e
          fail_tail() { label="$1"; file="$2"; rc="$3"; echo "$label rc=$rc" >> "$STATUS"; echo '--- first failure ---' >> "$STATUS"; tail -n 80 "$file" >> "$STATUS"; exit "$rc"; }
          timeout 120s node tools/validation/phase7-ownership.mjs --check-manifest >/tmp/p7m.log 2>&1; rc=$?; [ "$rc" -eq 0 ] || fail_tail phase7_manifest /tmp/p7m.log "$rc"
          echo 'phase7_manifest=pass' >> "$STATUS"
          timeout 120s node tools/validation/analysis-roadmap/ownership.mjs --branch "$LOGICAL_BRANCH" --phase phase7 --base-sha "$BASE_SHA" --head-sha "$CLEAN_HEAD" >/tmp/p7.json 2>/tmp/p7g.log; rc=$?; [ "$rc" -eq 0 ] || fail_tail phase7_inventory /tmp/p7g.log "$rc"
          timeout 120s node tools/validation/phase7-ownership.mjs --files-json "$(cat /tmp/p7.json)" >/tmp/p7v.log 2>&1; rc=$?; [ "$rc" -eq 0 ] || fail_tail phase7_validate /tmp/p7v.log "$rc"
          echo 'phase7=pass' >> "$STATUS"
          timeout 120s node tools/validation/phase8-ownership.mjs --check-manifest >/tmp/p8m.log 2>&1; rc=$?; [ "$rc" -eq 0 ] || fail_tail phase8_manifest /tmp/p8m.log "$rc"
          echo 'phase8_manifest=pass' >> "$STATUS"
          timeout 120s node tools/validation/analysis-roadmap/ownership.mjs --branch "$LOGICAL_BRANCH" --phase phase8 --base-sha "$BASE_SHA" --head-sha "$CLEAN_HEAD" >/tmp/p8.json 2>/tmp/p8g.log; rc=$?; [ "$rc" -eq 0 ] || fail_tail phase8_inventory /tmp/p8g.log "$rc"
          timeout 120s node tools/validation/phase8-ownership.mjs --files-json "$(cat /tmp/p8.json)" >/tmp/p8v.log 2>&1; rc=$?; [ "$rc" -eq 0 ] || fail_tail phase8_validate /tmp/p8v.log "$rc"
          echo 'phase8=pass' >> "$STATUS"
          git push origin HEAD:fix/7036-ownership-x02-collector-20260917 >/tmp/push.log 2>&1; rc=$?; [ "$rc" -eq 0 ] || fail_tail push /tmp/push.log "$rc"
          echo 'push=pass' >> "$STATUS"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-7036-ownership
          path: /tmp/fix-7036.txt
          retention-days: 1
