name: diag-fix-7036-ownership
on:
  push:
    branches:
      - fix/7036-ownership-x02-collector-20260917
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch ownership and capture first failure
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/fix-7036.txt
          : > "$STATUS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          timeout 90s git fetch --no-tags origin main >/tmp/fetch.log 2>&1
          rc=$?
          echo "fetch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/fetch.log >> "$STATUS"; exit "$rc"; fi

          python3 - <<'PY' >/tmp/patch.log 2>&1
          from pathlib import Path
          p = Path('tools/validation/analysis-roadmap/ownership.mjs')
          s = p.read_text()
          target = "    '.github/workflows/ghidra-differential.yml',\n"
          add = "    '.github/workflows/x02-collector-fix.yml',\n"
          if add not in s:
              if target not in s: raise SystemExit('ownership.mjs anchor missing')
              s = s.replace(target, target + add, 1)
              p.write_text(s)
          p = Path('tools/validation/analysis-roadmap/ownership.json')
          s = p.read_text()
          target = '      ".github/workflows/ghidra-differential.yml",\n'
          add = '      ".github/workflows/x02-collector-fix.yml",\n'
          if add not in s:
              if target not in s: raise SystemExit('ownership.json anchor missing')
              s = s.replace(target, target + add, 1)
              p.write_text(s)
          PY
          rc=$?
          echo "patch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/patch.log >> "$STATUS"; exit "$rc"; fi

          git rm .github/workflows/diag-fix-7036-ownership.yml >/tmp/rm.log 2>&1
          rc=$?
          echo "remove_diag rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 20 /tmp/rm.log >> "$STATUS"; exit "$rc"; fi
          git add tools/validation/analysis-roadmap/ownership.mjs tools/validation/analysis-roadmap/ownership.json
          git diff --cached --check >/tmp/diffcheck.log 2>&1
          rc=$?
          echo "diff_check rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/diffcheck.log >> "$STATUS"; exit "$rc"; fi
          git commit -m 'fix(analysis): register X-02 collector ownership' >/tmp/commit.log 2>&1
          rc=$?
          echo "commit rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/commit.log >> "$STATUS"; exit "$rc"; fi

          CLEAN_HEAD=$(git rev-parse HEAD)
          BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          echo "base=$BASE_SHA" >> "$STATUS"
          echo "clean_head=$CLEAN_HEAD" >> "$STATUS"
          LOGICAL_BRANCH=feat/analysis-roadmap-v8-current-main-20260907

          check() {
            label="$1"; shift
            "$@" >/tmp/check.out 2>&1
            rc=$?
            echo "$label rc=$rc" >> "$STATUS"
            if [ "$rc" -ne 0 ]; then
              echo "--- $label first failure ---" >> "$STATUS"
              tail -n 80 /tmp/check.out >> "$STATUS"
              exit "$rc"
            fi
          }

          check p7_manifest timeout 120s node tools/validation/phase7-ownership.mjs --check-manifest
          timeout 120s node tools/validation/analysis-roadmap/ownership.mjs --branch "$LOGICAL_BRANCH" --phase phase7 --base-sha "$BASE_SHA" --head-sha "$CLEAN_HEAD" >/tmp/p7.json 2>/tmp/p7.err
          rc=$?
          echo "p7_inventory rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then echo '--- p7_inventory first failure ---' >> "$STATUS"; tail -n 80 /tmp/p7.err >> "$STATUS"; exit "$rc"; fi
          P7=$(cat /tmp/p7.json)
          check p7_validate timeout 120s node tools/validation/phase7-ownership.mjs --files-json "$P7"
          check p8_manifest timeout 120s node tools/validation/phase8-ownership.mjs --check-manifest
          timeout 120s node tools/validation/analysis-roadmap/ownership.mjs --branch "$LOGICAL_BRANCH" --phase phase8 --base-sha "$BASE_SHA" --head-sha "$CLEAN_HEAD" >/tmp/p8.json 2>/tmp/p8.err
          rc=$?
          echo "p8_inventory rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then echo '--- p8_inventory first failure ---' >> "$STATUS"; tail -n 80 /tmp/p8.err >> "$STATUS"; exit "$rc"; fi
          P8=$(cat /tmp/p8.json)
          check p8_validate timeout 120s node tools/validation/phase8-ownership.mjs --files-json "$P8"
          echo 'ownership=pass' >> "$STATUS"
          git push origin HEAD:fix/7036-ownership-x02-collector-20260917 >/tmp/push.log 2>&1
          rc=$?
          echo "push rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/push.log >> "$STATUS"; exit "$rc"; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-7036-ownership
          path: /tmp/fix-7036.txt
          retention-days: 1
