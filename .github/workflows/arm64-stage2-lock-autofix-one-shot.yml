name: ARM64 Stage2 denominator lock one-shot

on:
  push:
    branches:
      - fix/2213-arm64-btype-general-reset

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/2213-arm64-btype-general-reset
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild canonical Stage2 denominator lock
        shell: bash
        run: |
          set -euo pipefail
          node tools/validation/stage2/build-profile-denominator-lock.mjs
          node tests/stage2/profile-denominator-inventory.test.mjs

      - name: Commit only canonical lock and remove one-shot runner
        shell: bash
        env:
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workflow='.github/workflows/arm64-stage2-lock-autofix-one-shot.yml'
          lock='tools/validation/stage2/profile-denominators.lock.json'

          git rm -- "$workflow"
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(tools/validation/stage2/profile-denominators\.lock\.json|\.github/workflows/arm64-stage2-lock-autofix-one-shot\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Canonical lock build changed unexpected files:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git fetch origin fix/2213-arm64-btype-general-reset
          if [[ "$(git rev-parse FETCH_HEAD)" != "$START_SHA" ]]; then
            echo 'Branch moved during canonical lock build; refusing stale push.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$lock"
          git diff --cached --quiet && exit 0
          git commit -m 'chore(stage2): refresh canonical denominator lock'
          git push origin HEAD:fix/2213-arm64-btype-general-reset
