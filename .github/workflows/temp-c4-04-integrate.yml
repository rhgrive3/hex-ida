name: Temporary C4-04 latest-head integration
on:
  push:
    branches: ['impl/c4-04-integrate-20260916']
    paths: ['.github/workflows/temp-c4-04-integrate.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: impl/c4-04-integrate-20260916
          fetch-depth: 0
      - name: Identify first cherry-pick conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin impl/c4-04-finish-20260916
          : > /tmp/c4-integration-conflict.txt
          for sha in \
            89f2467ea66c80f43d8e70fa6a0cf8742adde89b \
            a4148d277444f694a46057e80926c6bbeb8034e2 \
            45fe53634ee6cdaf3c3d3a2b7551743416800b7c \
            99db96607313d3435c841ca1f6783491d4bb97bb \
            6c648bf306b9a8df27523249358d7d4ce1e90d47 \
            bd5ff13372b780e2d45e2d35c01791479b4681d4 \
            86254222fe1fe3ff1b63f995f6fbb762c64209a3 \
            1a4eddfe46584401dab337d15923f50998de7fc1 \
            a97a9ee7cfa88f014cae7188d4581be4ecf68f33 \
            15f946e8af6d33f3d874cfe2961e0ef551888f60 \
            76eac24b69860b4f34e106eee1363f0fb30e788f \
            f963ee4e316eaf1bcbb2b4a33122c0d00a60b2b2 \
            c1d616710990db7dbb6664a4ea49b8608d556055
          do
            if ! git cherry-pick "$sha" >/dev/null 2>&1; then
              echo "FAILED_SHA=$sha" | tee -a /tmp/c4-integration-conflict.txt
              git diff --name-only --diff-filter=U | sed 's/^/CONFLICT_PATH=/' | tee -a /tmp/c4-integration-conflict.txt
              git status --short | awk '$1 ~ /U/ || $2 ~ /U/ {print "STATUS=" $0}' | tee -a /tmp/c4-integration-conflict.txt
              git cherry-pick --abort
              exit 0
            fi
          done
          echo 'FAILED_SHA=none' | tee -a /tmp/c4-integration-conflict.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c4-integration-conflict
          path: /tmp/c4-integration-conflict.txt
          retention-days: 1
