name: Temporary C4 ownership first-failure diagnostic
on:
  push:
    branches: ['impl/c4-04-integrate-20260916']
    paths: ['.github/workflows/temp-c4-04-integrate.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: 4b810a3b3e3bfd1a1b7ed8de9751edece783e2d6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
      - name: Reconstruct C4 code and ownership only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --depth=40 origin impl/c4-04-finish-20260916
          for sha in 89f2467ea66c80f43d8e70fa6a0cf8742adde89b a4148d277444f694a46057e80926c6bbeb8034e2 45fe53634ee6cdaf3c3d3a2b7551743416800b7c 99db96607313d3435c841ca1f6783491d4bb97bb b439a53a642d486ab0161ed5f464608cd6f2ce9d 6c648bf306b9a8df27523249358d7d4ce1e90d47 bd5ff13372b780e2d45e2d35c01791479b4681d4 1a4eddfe46584401dab337d15923f50998de7fc1 a97a9ee7cfa88f014cae7188d4581be4ecf68f33 15f946e8af6d33f3d874cfe2961e0ef551888f60 76eac24b69860b4f34e106eee1363f0fb30e788f f963ee4e316eaf1bcbb2b4a33122c0d00a60b2b2 c1d616710990db7dbb6664a4ea49b8608d556055; do git cherry-pick "$sha" >/dev/null; done
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('js/symbolic/verify/equivalence.js'); s=p.read_text(); anchor="import { createSymbolicEvidence } from '../evidence/symbolic-evidence.js';\n"
          if "ownDataEntries" not in s: s=s.replace(anchor,anchor+"import { ownDataEntries } from '../expr/data-boundary.js';\n")
          marker='export async function verifyBoundedEquivalence({'
          helper="""function memoryRegionIdentitySnapshot(memoryRegions) {\n  if (!Array.isArray(memoryRegions)) return memoryRegions;\n  ownDataEntries(memoryRegions, 4096);\n  return Object.freeze(memoryRegions.map(region => {\n    if (region == null || typeof region !== 'object' || Array.isArray(region)) return region;\n    const normalized = Object.create(null);\n    for (const [key, value] of ownDataEntries(region, 64)) normalized[key] = typeof value === 'bigint' ? Object.freeze({ scalarType:'bigint', decimal:value.toString() }) : value;\n    return Object.freeze(normalized);\n  }));\n}\n\n"""
          if 'function memoryRegionIdentitySnapshot(' not in s: s=s.replace(marker,helper+marker)
          if 'const queryMemoryRegions = memoryRegionIdentitySnapshot(memoryRegions);' not in s: s=s.replace('  const query = createVerificationQuery({\n','  const queryMemoryRegions = memoryRegionIdentitySnapshot(memoryRegions);\n  const query = createVerificationQuery({\n')
          s=s.replace('      memoryRegions,\n    },\n    constraints,','      memoryRegions:queryMemoryRegions,\n    },\n    constraints,').replace("      kind: VERIFICATION_QUERY_KIND.BOUNDED_EQUIVALENCE,\n      memoryRegions,\n    },\n  });", "      kind: VERIFICATION_QUERY_KIND.BOUNDED_EQUIVALENCE,\n      memoryRegions:queryMemoryRegions,\n    },\n  });")
          p.write_text(s)
          p=Path('js/decompiler/phase8/conditional-region-erasure.js'); s=p.read_text()
          old="""    // Join PHIs are retained by this render-only deletion and therefore do not\n    // make an otherwise flat arm unsafe. Only PHIs (including MemoryPHIs) whose\n    // owning block is inside the removed arm keep the body at `required`.\n    const erasedBlocks = new Set(erased.emittedBlocks ?? []);\n    const erasedHasPhi = structure.phis.some(item => erasedBlocks.has(item.block));\n    const erasedHasMemoryPhi = structure.memoryPhis.some(item => erasedBlocks.has(item.block));\n    const flatStores = condition && !erasedHasPhi && !erasedHasMemoryPhi\n"""
          new="""    // No PHI correspondence is issued for render-only arm deletion.\n    const flatStores = condition && !structure.phis.length && !structure.memoryPhis.length\n"""
          if old not in s: raise SystemExit('PHI block missing')
          p.write_text(s.replace(old,new))
          p=Path('tools/validation/analysis-roadmap/ownership.json'); data=json.loads(p.read_text())
          additions={'phase8':['js/decompiler/phase8/c4-equivalence-registry.js','tests/phase8/substrate/c4-equivalence-registry.test.mjs','tests/phase8/substrate/c4-memory-rewrite-adoption.test.mjs','tests/phase8/substrate/pass-validation-owned-snapshot.test.mjs'],'symbolic':['js/symbolic/verify/equivalence.js','js/symbolic/query/terminal-effect-equivalence.js','tests/phase9/memory/terminal-effect-equivalence.test.mjs','tests/phase9/memory/c4-cfg-loop-equivalence.test.mjs']}
          for owner,paths in additions.items():
            for path in paths:
              if path not in data['owners'][owner]: data['owners'][owner].append(path)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Emit ownership first failure only
        shell: bash
        run: |
          set +e
          node --input-type=module <<'NODE' > /tmp/ownership.txt 2>&1
          import {execFileSync} from 'node:child_process'; import {BRANCH,validateRoadmapInventory} from './tools/validation/analysis-roadmap/ownership.mjs';
          const files=execFileSync('git',['diff','--name-only',process.env.BASE_SHA],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          try { const selected=validateRoadmapInventory(BRANCH,'phase8',files); console.log(JSON.stringify({ok:true,changed:files.length,phase8:selected.length})); }
          catch(error) { console.log(JSON.stringify({ok:false,error:error.message,changed:files.length,files})); }
          NODE
          cat /tmp/ownership.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c4-ownership-first-failure
          path: /tmp/ownership.txt
          retention-days: 1
