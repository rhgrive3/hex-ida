name: Temporary exact ownership gap inventory
on:
  push:
    branches: ['impl/c4-04-integrate-20260916']
    paths: ['.github/workflows/temp-c4-04-integrate.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_SHA: 006a6f0617b2c4f699bf341a6525c5061891fcc1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 400
      - name: Fetch exact main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=300 origin main:refs/remotes/origin/main
          git rev-parse refs/remotes/origin/main >/tmp/main-sha.txt
      - name: Enumerate undeclared roadmap paths only
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=$(cat /tmp/main-sha.txt)
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" >/tmp/files.z
          node --input-type=module <<'NODE' > /tmp/roadmap-gaps.json
          import fs from 'node:fs';
          import {loadRoadmapManifest,validateRoadmapManifest} from './tools/validation/analysis-roadmap/ownership.mjs';
          const assignment=validateRoadmapManifest(loadRoadmapManifest());
          const files=fs.readFileSync('/tmp/files.z').toString('utf8').split('\0').filter(Boolean);
          const missing=files.filter(file=>!assignment.has(file));
          console.log(JSON.stringify({changed:files.length,missingCount:missing.length,missing},null,2));
          NODE
          cat /tmp/roadmap-gaps.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-roadmap-ownership-gaps
          path: /tmp/roadmap-gaps.json
          retention-days: 1
