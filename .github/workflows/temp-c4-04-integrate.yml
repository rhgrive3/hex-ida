name: Temporary C4-04 join-PHI projection diagnostic
on:
  push:
    branches: ['impl/c4-04-integrate-20260916']
    paths: ['.github/workflows/temp-c4-04-integrate.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE_SHA: 4b810a3b3e3bfd1a1b7ed8de9751edece783e2d6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply exact validated C4 set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --depth=40 origin impl/c4-04-finish-20260916
          for sha in 89f2467ea66c80f43d8e70fa6a0cf8742adde89b a4148d277444f694a46057e80926c6bbeb8034e2 45fe53634ee6cdaf3c3d3a2b7551743416800b7c 99db96607313d3435c841ca1f6783491d4bb97bb b439a53a642d486ab0161ed5f464608cd6f2ce9d 6c648bf306b9a8df27523249358d7d4ce1e90d47 bd5ff13372b780e2d45e2d35c01791479b4681d4 1a4eddfe46584401dab337d15923f50998de7fc1 a97a9ee7cfa88f014cae7188d4581be4ecf68f33 15f946e8af6d33f3d874cfe2961e0ef551888f60 76eac24b69860b4f34e106eee1363f0fb30e788f f963ee4e316eaf1bcbb2b4a33122c0d00a60b2b2 c1d616710990db7dbb6664a4ea49b8608d556055; do git cherry-pick "$sha" >/dev/null; done
      - run: npm ci --ignore-scripts
      - name: Render join-PHI case only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/join-phi-projection.json
          import { conditionalRegionFixture } from './tests/phase8/helpers/conditional-region-fixture.mjs';
          import { identity } from './tests/phase8/helpers/proof-fixtures.mjs';
          import { enhanceSemanticDecompilation } from './js/decompiler/pipeline.js';
          import { prepareConditionalRegionCondition } from './js/decompiler/phase8/conditional-region-condition.js';
          import { prepareConditionalRegionErasure, readRegionErasureBody } from './js/decompiler/phase8/conditional-region-erasure.js';
          import { runPhase8Vertical } from './js/decompiler/phase8/index.js';
          import { applyPhase8Projection, readProjectedConditionalRegions } from './js/decompiler/phase8/projection.js';
          function storeArm(builder,value){const store=builder.store(value,{locKind:'global',locKey:'g',bits:8});Object.assign(store.loc,{address:16n,addressSpace:'data'});store.extra={completeness:'complete',addressPrecise:true,memoryAccess:{addressSpace:'data',widthBits:8,volatility:false,atomic:false,ordering:'unknown',endian:'little',faults:[]}};}
          const f=conditionalRegionFixture({armEffect:storeArm});
          const canonical=structuredClone(f.ir);
          const projection=enhanceSemanticDecompilation(f.seed,{name:'reachability',calls:[]},{phase8PrepareProof:true,phase8PrepareRegionProof:true,deterministicTransforms:true,renderProvenance:true});
          const proofOptions={identity,addressBits:8,backendTier:'exhaustive',timeoutMs:5000};
          const conditionPlan=await prepareConditionalRegionCondition(f.structure,projection,proofOptions);
          const reachability=await f.run();
          const plan=prepareConditionalRegionErasure(f.structure,reachability,f.ir,{identity,timeoutMs:5000,projection,conditionPlan});
          const body=readRegionErasureBody(plan,projection,f.ir,identity);
          const opts={phase8ProofIdentity:identity,phase8RegionErasurePlan:plan};
          const stage=runPhase8Vertical({ir:f.ir,opts,enabledStages:['rendering']},{timeBudgetMs:1000});
          const result=applyPhase8Projection(projection,stage.analysis,opts);
          const carrier=readProjectedConditionalRegions(result.cAst,f.ir);
          const projected=carrier?.regions.find(r=>r.original===f.structure.region);
          const phi=f.structure.phis[0]?.phi;
          const phiId=phi?.dst?.id ?? phi?.id ?? null;
          console.log(JSON.stringify({
            bodyValidation:plan.bodyValidation,
            bodyIssued:!!body,
            stagePublished:stage.ledger.published,
            changed:result!==projection,
            irUnchanged:JSON.stringify(structuredClone(f.ir))===JSON.stringify(canonical),
            originalBody:projection.cAst.body.map(n=>n.text),
            resultBody:result.cAst.body.map(n=>n.text),
            returnTexts:result.cAst.body.filter(n=>n.semantic?.op==='return'||/^return\b/.test(n.text??'')).map(n=>n.text),
            phiId,
            phiMentions:result.cAst.body.filter(n=>phiId&&String(n.text??'').includes(phiId)).map(n=>n.text),
            removals:result.rewriteProof.filter(r=>r.rule==='erase-proved-unreachable-arm-store').length,
            removedArmNodes:projected?.arms.find(a=>a.role===plan.removedRole)?.nodes.length??null,
            liveArmNodes:projected?.arms.find(a=>a.role===plan.liveRole)?.nodes.length??null,
            provenance:result.renderProvenance?.completeness??null
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: c4-join-phi-projection
          path: /tmp/join-phi-projection.json
          retention-days: 1
