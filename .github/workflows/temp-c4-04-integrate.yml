name: Temporary exact roadmap ownership repair
on:
  push:
    branches: ['impl/c4-04-integrate-20260916']
    paths: ['.github/workflows/temp-c4-04-integrate.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_SHA: 006a6f0617b2c4f699bf341a6525c5061891fcc1
      TARGET_BRANCH: feat/analysis-roadmap-v8-current-main-20260907
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 400
      - name: Fetch exact main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=300 origin main:refs/remotes/origin/main
          git rev-parse refs/remotes/origin/main >/tmp/main-sha.txt
      - name: Register the three exact integration paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          import json
          from pathlib import Path
          additions=['js/expr.js','tests/semantic-v2/lowering-memory-control.test.mjs','tests/semantic-v2/phase3-hard-timeout.test.mjs']
          p=Path('tools/validation/analysis-roadmap/ownership.json'); data=json.loads(p.read_text())
          for path in additions:
            if path not in data['owners']['integration']: data['owners']['integration'].append(path)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=Path('tools/validation/analysis-roadmap/ownership.mjs'); s=p.read_text()
          anchor="    \"tests/semantic-v2/repair-v1-add-with-carry-def-use.test.mjs\",\n"
          block="""    'js/expr.js',\n    'tests/semantic-v2/lowering-memory-control.test.mjs',\n    'tests/semantic-v2/phase3-hard-timeout.test.mjs',\n"""
          if not all(path in s for path in additions):
            if anchor not in s: raise SystemExit('integration anchor missing')
            s=s.replace(anchor,block+anchor)
          p.write_text(s)
          PY
          git diff --check
      - name: Validate exact Phase 7 and Phase 8 ownership routes
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=$(cat /tmp/main-sha.txt)
          node tools/validation/phase7-ownership.mjs --check-manifest
          node tools/validation/phase8-ownership.mjs --check-manifest
          node tools/validation/analysis-roadmap/ownership.mjs --branch "$TARGET_BRANCH" --phase phase7 --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
          node tools/validation/analysis-roadmap/ownership.mjs --branch "$TARGET_BRANCH" --phase phase8 --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
      - name: Commit and publish if PR head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git add tools/validation/analysis-roadmap/ownership.json tools/validation/analysis-roadmap/ownership.mjs
          git commit -m 'ci: register exact roadmap ownership gaps'
          REMOTE=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$REMOTE" = "$HEAD_SHA" || { echo "target moved: expected $HEAD_SHA got $REMOTE"; exit 1; }
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >/tmp/ownership-repair.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-roadmap-ownership-repair
          path: /tmp/ownership-repair.txt
          if-no-files-found: ignore
          retention-days: 1
