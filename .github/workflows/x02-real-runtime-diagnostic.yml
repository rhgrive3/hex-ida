name: X-02 real runtime diagnostic

on:
  push:
    branches: [feat/analysis-roadmap-v8-current-main-20260907]
    paths: [.github/workflows/x02-real-runtime-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Count real v5 rebase chains without retaining records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          roots=[Path('/System/Library/dyld'),Path('/System/Cryptexes/OS/System/Library/dyld'),Path('/System/Volumes/Preboot/Cryptexes/OS/System/Library/dyld')]
          cache=next((r/'dyld_shared_cache_arm64e' for r in roots if (r/'dyld_shared_cache_arm64e').exists()),None)
          if cache is None: raise SystemExit('no-cache')
          counts=[]
          with cache.open('rb') as f:
            h=f.read(0x200); so,sc=struct.unpack_from('<II',h,0x138)
            f.seek(so); slides=[]
            for i in range(sc):
              a,s,fo,sio,sis,flags,mp,ip=struct.unpack('<QQQQQQII',f.read(56)); slides.append((i,a,s,fo,sio,sis))
            for idx,a,size,fo,sio,sis in slides:
              if not sis: counts.append({'mapping':idx,'version':None,'records':0}); continue
              f.seek(sio); info=f.read(sis); ver=struct.unpack_from('<I',info,0)[0]
              if ver != 5: counts.append({'mapping':idx,'version':ver,'records':None}); continue
              ps,n=struct.unpack_from('<II',info,4); starts=struct.unpack_from('<'+'H'*n,info,24)
              records=0; max_chain=0
              for page,start in enumerate(starts):
                if start==0xffff: continue
                within=start*8; chain=0
                while True:
                  off=page*ps+within
                  if within%8 or off+8>min((page+1)*ps,size): raise RuntimeError(f'chain-out-of-page mapping={idx} page={page}')
                  f.seek(fo+off); raw=struct.unpack('<Q',f.read(8))[0]
                  records+=1; chain+=1; nxt=(raw>>52)&0x7ff
                  if nxt==0: break
                  within+=nxt*8
                  if chain>ps//8: raise RuntimeError(f'cycle mapping={idx} page={page}')
                max_chain=max(max_chain,chain)
              counts.append({'mapping':idx,'version':5,'records':records,'maxChain':max_chain,'pages':n})
          out={'cachePath':str(cache),'counts':counts,'maxRecordsInMapping':max((x['records'] or 0) for x in counts),'totalRecords':sum((x['records'] or 0) for x in counts)}
          Path('x02-real-runtime-diagnostic.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Probe arm64e PAC execution exit
        shell: bash
        run: |
          set -euo pipefail
          cat > pac.c <<'C'
          #include <stdint.h>
          __attribute__((noinline)) static uintptr_t leaf(uintptr_t x) { return (x * 33u) ^ 0x5au; }
          __attribute__((noinline)) static uintptr_t caller(uintptr_t x) { return leaf(x) + 1u; }
          int main(int argc, char **argv) { (void)argv; uintptr_t x=(uintptr_t)argc; return caller(x)==(((x*33u)^0x5au)+1u)?0:3; }
          C
          xcrun clang -arch arm64e -O1 -fno-omit-frame-pointer -msign-return-address=all pac.c -o pac-probe
          codesign --force --sign - pac-probe
          otool -tvV pac-probe > pac-disassembly.txt
          set +e
          ./pac-probe > pac-stdout.txt 2> pac-stderr.txt
          RC=$?
          set -e
          python3 - "$RC" <<'PY'
          import json,re,sys,pathlib
          dis=pathlib.Path('pac-disassembly.txt').read_text(errors='replace')
          stderr=pathlib.Path('pac-stderr.txt').read_text(errors='replace')
          p=pathlib.Path('x02-real-runtime-diagnostic.json')
          out=json.loads(p.read_text())
          out['pac']={'runExit':int(sys.argv[1]),'pacObserved':bool(re.search(r'\bpac(?:i|d|ib|ia|da|db|ga)',dis,re.I)),'authObserved':bool(re.search(r'\b(?:auti|autd|retaa|retab)',dis,re.I)),'stderr':stderr[:2000]}
          p.write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out['pac'],indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: x02-real-runtime-diagnostic-${{ github.sha }}
          path: x02-real-runtime-diagnostic.json
          retention-days: 7
