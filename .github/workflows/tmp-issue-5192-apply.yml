name: Temporary issue 5192 patch
on:
  push:
    branches: [fix/issue-5192-main-20260917]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-5192-main-20260917
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply conservative impact patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'js/rebuild/transaction-v2.js';
          let s = fs.readFileSync(path, 'utf8');
          const summary = process.env.GITHUB_STEP_SUMMARY;
          const fail = (message, facts = {}) => {
            if (summary) fs.appendFileSync(summary, `# #5192 patch failure\n${message}\n\n${JSON.stringify(facts)}\n`);
            throw new Error(message);
          };
          const validatorMarker = 'function requiredValidators(impact, additional = [], requireIndependentOracle = false) {';
          const createMarker = 'export function createRebuildTransaction(input = {}) {';
          const impactMarker = '  const impact = {';
          const afterImpactMarker = '\n  const requireIndependentOracle = input.requireIndependentOracle === true;';
          const trustMarker = '  const preservationRequiresTrustedProvider = ';
          const positions = {
            validator: s.indexOf(validatorMarker),
            create: s.indexOf(createMarker),
            impact: s.indexOf(impactMarker, s.indexOf(createMarker)),
            afterImpact: s.indexOf(afterImpactMarker, s.indexOf(createMarker)),
            trust: s.indexOf(trustMarker),
          };
          if (s.includes('function hasFormatSafeImpactProof(')) fail('helper already present', positions);
          if (Object.values(positions).some((value) => value < 0)) fail('required marker missing', positions);
          const helper = `function hasFormatSafeImpactProof(input, operations, expectedOriginalState) {
            const additional = Array.isArray(input.additionalValidators) ? input.additionalValidators : [];
            const safeState = expectedOriginalState?.formatSafe;
            if (input.requireIndependentOracle !== true
                || !additional.includes('format-invariants')
                || !safeState || typeof safeState !== 'object' || Array.isArray(safeState)
                || safeState.schema !== FORMAT_SAFE_REBUILD_SCHEMA
                || typeof safeState.kind !== 'string' || !safeState.kind) return false;
            return operations.length > 0 && operations.every((operation) => {
              const provenance = operation?.provenance;
              return provenance && typeof provenance === 'object' && !Array.isArray(provenance)
                && provenance.source === 'format-safe-rebuild-adapter'
                && provenance.schema === FORMAT_SAFE_REBUILD_SCHEMA
                && provenance.mutationKind === safeState.kind;
            });
          }

          `;
          s = s.slice(0, positions.validator) + helper + s.slice(positions.validator);
          const create = s.indexOf(createMarker);
          const impact = s.indexOf(impactMarker, create);
          const afterImpact = s.indexOf(afterImpactMarker, create);
          if (impact < 0 || afterImpact <= impact) fail('impact boundaries invalid', { create, impact, afterImpact });
          const newImpact = `  // #5192: arbitrary generic byte patches have no loader-derived range
          // authority. Caller \`false\` declarations cannot prove a same-size edit
          // misses relocation, branch, unwind, import/export, or signature data.
          // Only the format-safe path may retain narrow impact, and only when it
          // carries its invariant validator plus the independent-oracle gate.
          const conservativeGenericImpact = !hasFormatSafeImpactProof(input, operations, expectedOriginalState);
          const impact = {
            layoutMoving: sizeDelta !== 0 || declaredImpact.layoutMoving === true,
            relocations: conservativeGenericImpact || declaredImpact.relocations === true || relocationBindings.length > 0,
            branchRanges: conservativeGenericImpact || declaredImpact.branchRanges === true,
            unwind: conservativeGenericImpact || declaredImpact.unwind === true,
            importsExports: conservativeGenericImpact || declaredImpact.importsExports === true,
            signature: conservativeGenericImpact || declaredImpact.signature === true,
            sections: clone(sections),
            relocationBindings: clone(relocationBindings),
          };`;
          s = s.slice(0, impact) + newImpact + s.slice(afterImpact);
          const trust = s.indexOf(trustMarker);
          const trustEnd = s.indexOf('\n', trust);
          if (trust < 0 || trustEnd <= trust) fail('trust boundary invalid', { trust, trustEnd });
          s = s.slice(0, trust)
            + "  const preservationRequiresTrustedProvider = transaction.expectedOriginalState?.formatSafe?.schema === FORMAT_SAFE_REBUILD_SCHEMA;"
            + s.slice(trustEnd);
          fs.writeFileSync(path, s);
          NODE
      - name: Focused verification
        shell: bash
        run: |
          timeout 30s node --test tests/phase12/rebuild/issue-5192-impact-underdeclaration.test.mjs
          timeout 30s node tests/issue-5180-loader-reparse-identity.mjs
          timeout 30s node tests/stage2/issue-4970-phase12-rebuild-format-denominator.test.mjs
          timeout 180s npm run lint
      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-issue-5192-apply.yml
          git config user.name 'rhgrive3'
          git config user.email 'rhgrive@gmail.com'
          git add js/rebuild/transaction-v2.js tests/issue-5180-loader-reparse-identity.mjs tests/phase12/rebuild/issue-5192-impact-underdeclaration.test.mjs .github/workflows/tmp-issue-5192-apply.yml
          git diff --cached --check
          git commit -m 'fix(rebuild): fail closed on generic impact underdeclaration (#5192)'
          git push origin HEAD:fix/issue-5192-main-20260917
