name: reconcile-7036-main-focused
on:
  push:
    branches:
      - reconcile/7036-main-4d68-focused
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and resolve six conflicts
        shell: bash
        run: |
          set -euo pipefail
          cp .github/diag/reconcile-7036-main.py /tmp/reconcile.py
          git fetch --no-tags origin 4d68cb6bf67622f7f3887e821388a2788cbd34fc
          git checkout --detach f8c8e281d940ab9d5f1b20d15398095f64cb50f7
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff 4d68cb6bf67622f7f3887e821388a2788cbd34fc >/tmp/merge.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          test "$(git diff --name-only --diff-filter=U | wc -l)" -eq 6
          git checkout --theirs -- js/analysis/discovery/artifact.js
          python3 /tmp/reconcile.py
          git add .circleci/config.yml js/analysis/discovery/artifact.js js/analysis/discovery/producers.js js/analysis/index.js js/rebuild/transaction-v2.js tests/issue-4135-pe-section-virtual-layout.mjs
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
      - name: Run focused tests with first-failure capture
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/reconcile-first-failure.txt
          : > "$STATUS"
          run_one() {
            label="$1"; shift
            "$@" >/tmp/test.out 2>&1
            rc=$?
            echo "$label rc=$rc" >> "$STATUS"
            if [ "$rc" -ne 0 ]; then
              echo "--- $label first failure tail ---" >> "$STATUS"
              tail -n 100 /tmp/test.out >> "$STATUS"
              exit "$rc"
            fi
          }
          run_one t016_phase7 timeout 120s node tests/phase7/discovery/t016-discovery-preservation.test.mjs
          run_one t016_rebuild timeout 120s node tests/rebuild/t016-discovery-preservation.test.mjs
          run_one x03_phase7 timeout 120s node tests/phase7/discovery/x03-ambiguity-artifact.test.mjs
          run_one x03_acceptance timeout 180s node tests/stage2/x03-rebuild-discovery-acceptance.test.mjs
          run_one x03_rebuild timeout 120s node tests/stage2/x03-rebuild-discovery.test.mjs
          run_one pe_4135 timeout 120s node tests/issue-4135-pe-section-virtual-layout.mjs
          echo 'focused=green' >> "$STATUS"
      - name: Capture resolved tree
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/diag/reconcile-7036-main.py .github/workflows/reconcile-7036-main-focused.yml 2>/dev/null || true
          git add -A
          git diff --cached --check
          git commit -m 'merge: reconcile #7036 with current main'
          printf 'head=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > /tmp/reconcile-result.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-7036-main-focused
          path: |
            /tmp/reconcile-first-failure.txt
            /tmp/reconcile-result.txt
          if-no-files-found: ignore
          retention-days: 1
