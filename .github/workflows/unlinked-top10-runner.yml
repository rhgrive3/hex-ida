name: Unlinked Top10 Runner

on:
  push:
    branches:
      - fix/unlinked-top10-r2-20260830
    paths:
      - tools/maintenance/fix-unlinked-top10.mjs
      - tools/maintenance/fix-unlinked-top10-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/unlinked-top10-r2-20260830
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply guarded fixes
        run: node tools/maintenance/fix-unlinked-top10.mjs
      - name: Syntax check touched JavaScript
        run: |
          node --check js/agent/tools.js
          node --check js/script.js
          node --check js/ai/context/index.js
          node --check js/ai/control/turn-executor.js
      - name: Targeted regression tests
        run: node --test tests/unlinked-top10-regression.test.mjs tests/ai-evidence-status-index.test.mjs
      - name: Full test suite
        run: npm test
      - name: Commit generated patch
        id: generated-commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'push=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "fix: resolve unlinked analysis wiring issues"
          echo 'push=true' >> "$GITHUB_OUTPUT"
      - name: Push generated patch
        if: steps.generated-commit.outputs.push == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/unlinked-top10-r2-20260830
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "HEAD:${TARGET_BRANCH}"
