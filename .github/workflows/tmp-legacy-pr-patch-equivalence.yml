name: Temporary legacy PR patch equivalence

on:
  push:
    branches:
      - diag/legacy-pr-patch-equivalence-20260917
    paths:
      - '.github/workflows/tmp-legacy-pr-patch-equivalence.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fetch bounded histories
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --deepen=7500 origin main
          git fetch --no-tags --depth=150 origin recovery/final-closure-v3-20260904:refs/remotes/origin/pr6611
          git fetch --no-tags --depth=500 origin feat/analysis-roadmap-v8-current-main-20260907:refs/remotes/origin/pr7036
          git fetch --no-tags --depth=450 origin perf/development-gate-policy:refs/remotes/origin/pr7097
      - name: Emit compact patch-equivalence summary
        shell: bash
        run: |
          set -euo pipefail
          BASE=ac36cc16b42fb10fbd54b5bd3f1e1a6474ca902b
          : > legacy-pr-patch-equivalence.txt
          for item in '6611 origin/pr6611' '7036 origin/pr7036' '7097 origin/pr7097'; do
            set -- $item
            n=$1; ref=$2
            total=$(git rev-list --right-only --no-merges --count "$BASE...$ref")
            unique=$(git rev-list --right-only --cherry-pick --no-merges --count "$BASE...$ref")
            echo "PR=$n total_nonmerge=$total patch_unique=$unique" >> legacy-pr-patch-equivalence.txt
            git log --right-only --cherry-pick --no-merges --format='%H%x09%s' "$BASE...$ref" | head -n 100 >> legacy-pr-patch-equivalence.txt || true
            echo '---' >> legacy-pr-patch-equivalence.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-pr-patch-equivalence
          path: legacy-pr-patch-equivalence.txt
          retention-days: 1
