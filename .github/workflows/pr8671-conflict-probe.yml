name: PR 8671 conflict resolver

on:
  push:
    branches: [integration-candidate/benchmark-auth-20260914]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main and resolve exact conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictstyle diff3
          git fetch --no-tags origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            printf 'main-already-ancestor\n' > pr8671-resolver-result.txt
            exit 0
          fi
          set +e
          git merge --no-commit --no-ff origin/main >/dev/null 2>&1
          merge_status=$?
          set -e
          if [ "$merge_status" -eq 1 ]; then
            git diff --name-only --diff-filter=U | sort > /tmp/conflicts.txt
            printf '%s\n' package.json tools/validation/phase7/cross-lane-inventory.mjs | sort > /tmp/expected.txt
            diff -u /tmp/expected.txt /tmp/conflicts.txt
            python <<'PY'
          from pathlib import Path
          import json, subprocess

          MISSING = object()
          conflicts = []
          def stage_json(n, path):
              return json.loads(subprocess.check_output(['git','show',f':{n}:{path}'], text=True))
          def merge3(base, ours, theirs, path=''):
              if ours == theirs: return ours
              if ours == base: return theirs
              if theirs == base: return ours
              if isinstance(base, dict) and isinstance(ours, dict) and isinstance(theirs, dict):
                  out = {}
                  for key in dict.fromkeys([*base, *ours, *theirs]):
                      b, o, t = base.get(key, MISSING), ours.get(key, MISSING), theirs.get(key, MISSING)
                      p = f'{path}/{key}'
                      if b is MISSING:
                          if o is MISSING: out[key] = t
                          elif t is MISSING: out[key] = o
                          elif o == t: out[key] = o
                          else: conflicts.append(p); out[key] = o
                      elif o is MISSING or t is MISSING:
                          if o is MISSING and t == b: continue
                          if t is MISSING and o == b: continue
                          conflicts.append(p); out[key] = o if o is not MISSING else t
                      else:
                          out[key] = merge3(b, o, t, p)
                  return out
              conflicts.append(path)
              return ours

          base, ours, theirs = stage_json(1,'package.json'), stage_json(2,'package.json'), stage_json(3,'package.json')
          merged = merge3(base, ours, theirs)
          if conflicts:
              raise RuntimeError(f'unexpected semantic package conflicts: {conflicts}')
          Path('package.json').write_text(json.dumps(merged, separators=(',',':')) + '\n')

          p = Path('tools/validation/phase7/cross-lane-inventory.mjs')
          lines = p.read_text().splitlines(True)
          out=[]; i=0; blocks=0
          while i < len(lines):
              if not lines[i].startswith('<<<<<<<'):
                  out.append(lines[i]); i += 1; continue
              blocks += 1; i += 1; ours_block=[]; base_block=[]; theirs_block=[]
              while i < len(lines) and not lines[i].startswith('|||||||'):
                  ours_block.append(lines[i]); i += 1
              if i >= len(lines): raise RuntimeError('missing diff3 base marker')
              i += 1
              while i < len(lines) and not lines[i].startswith('======='):
                  base_block.append(lines[i]); i += 1
              if i >= len(lines): raise RuntimeError('missing conflict separator')
              i += 1
              while i < len(lines) and not lines[i].startswith('>>>>>>>'):
                  theirs_block.append(lines[i]); i += 1
              if i >= len(lines): raise RuntimeError('missing conflict end marker')
              i += 1
              out.extend(ours_block); out.extend(theirs_block)
          if blocks != 1: raise RuntimeError(f'expected one cross-lane conflict block, got {blocks}')
          p.write_text(''.join(out))
          PY
            git add package.json tools/validation/phase7/cross-lane-inventory.mjs
          elif [ "$merge_status" -ne 0 ]; then
            echo "unexpected merge status $merge_status" >&2
            exit "$merge_status"
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node --check tools/validation/phase7/cross-lane-inventory.mjs
          timeout 120s node tests/phase7/ownership/cross-lane-routing.test.mjs
          printf 'main=%s\nconflicts=resolved\nphase7-cross-lane=pass\n' "$(git rev-parse origin/main)" > pr8671-resolver-result.txt
          git add -A
          git commit -m "Merge latest main into PR #8671"
          git push origin HEAD:integration-candidate/benchmark-auth-20260914
      - name: Upload compact resolver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8671-resolver-result
          path: pr8671-resolver-result.txt
          if-no-files-found: ignore
          retention-days: 1
