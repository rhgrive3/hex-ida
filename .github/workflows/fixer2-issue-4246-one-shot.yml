name: Fixer 2 one-shot issue 4246 core patch

on:
  push:
    branches:
      - fix/issue-4246-macho-x86_64h

permissions:
  contents: write

jobs:
  apply-core-patch:
    if: github.repository == 'rhgrive3/hex-ida'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact macho-core patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/macho-core.js)" = "5d284bcb8d821d44545b5c57ce52591df72bc4c1"
          test "$(git hash-object js/binary/macho-fat.js)" = "9c55ebd6e7f5c65fa4fac021829fce000ae11715"
          test "$(git hash-object tests/issue-4246-macho-x86_64h.mjs)" = "09aef0b6128dac0c02306faee7d8dae8ba0a33e3"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/binary/macho-core.js')
          s = p.read_text()
          old = "import { validateFatSlice, validateFatContainer, probePastEndArm64SliceSync, parseInnerMachOHeader } from './macho-fat.js';"
          new = "import { cpuName, subtypeBase, cpuArchName, sliceArchName, validateFatSlice, validateFatContainer, probePastEndArm64SliceSync, parseInnerMachOHeader } from './macho-fat.js';"
          if s.count(old) != 1:
              raise SystemExit(f'import anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = "      subtypeName: arch === 'arm64e' ? 'arm64e' : String(subtypeBase(subtype)),"
          new = "      subtypeName: arch === cpuName(cpu) ? String(subtypeBase(subtype)) : arch,"
          if s.count(old) != 1:
              raise SystemExit(f'subtype anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = """function cpuName(cpu) {
            const u = cpu >>> 0;
            return ({ 7: 'x86', 12: 'arm', 18: 'ppc', 0x01000007: 'x86_64', 0x0100000c: 'arm64', 0x0200000c: 'arm64_32' })[u] || `cpu-${u}`;
          }
          function subtypeBase(subtype) { return (subtype >>> 0) & 0x00ffffff; }
          function cpuArchName(cpu, subtype) { return cpuName(cpu) === 'arm64' && subtypeBase(subtype) === 2 ? 'arm64e' : cpuName(cpu); }
          function sliceArchName(slice) { return cpuArchName(slice.cpu, slice.subtype); }
          """
          if s.count(old) != 1:
              raise SystemExit(f'helper anchor count={s.count(old)}')
          s = s.replace(old, '', 1)
          p.write_text(s)
          PY
          test "$(git hash-object js/binary/macho-core.js)" = "4bde972047fcf981dd040ba60db8a5b0626c0bb9"
          node --check js/binary/macho-core.js
          node --test tests/issue-4246-macho-x86_64h.mjs
      - name: Commit final source-only diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fixer2-issue-4246-one-shot.yml
          git add js/binary/macho-core.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(macho): preserve x86_64h subtype identity (#4246)'
          git push origin HEAD:fix/issue-4246-macho-x86_64h
