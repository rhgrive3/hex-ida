name: Apply issue 3716 fix

on:
  push:
    branches:
      - fix/issue-3716-emulator-variable-shift

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-3716-emulator-variable-shift
          fetch-depth: 1

      - name: Apply exact patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('js/emu.js')
          text = source.read_text()
          old = "      lsl: (a, b) => a << (b & 63n), lsr: null, asr: null, ror: null,"
          new = "      lsl: null, lsr: null, asr: null, ror: null,"
          if text.count(old) != 1:
              raise SystemExit(f'expected one arithmetic LSL entry, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """      let r;\n      if (mn === 'lsr') r = (wide ? a : a & MASK32) >> (b & 63n);\n      else if (mn === 'asr') r = BigInt.asIntN(wide ? 64 : 32, a) >> (b & 63n);\n      else if (mn === 'ror') { const w = wide ? 64n : 32n; const s = b % w; r = (a >> s) | (a << (w - s)); }\n"""
          new = """      const shiftAmount = b & (wide ? 63n : 31n);\n      let r;\n      if (mn === 'lsl') r = a << shiftAmount;\n      else if (mn === 'lsr') r = (wide ? a : a & MASK32) >> shiftAmount;\n      else if (mn === 'asr') r = BigInt.asIntN(wide ? 64 : 32, a) >> shiftAmount;\n      else if (mn === 'ror') { const w = wide ? 64n : 32n; const s = b % w; r = (a >> s) | (a << (w - s)); }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one shift dispatch block, found {text.count(old)}')
          source.write_text(text.replace(old, new, 1))

          test = Path('tests/phase4/issue-3716-emulator-variable-shift.test.mjs')
          if test.exists():
              raise SystemExit('issue 3716 test already exists unexpectedly')
          test.write_text(dedent("""\
              import assert from 'node:assert/strict';
              import { Emulator } from '../../js/emu.js';

              const MASK32 = 0xffffffffn;

              function expectedShift(mnemonic, value, amount, bits) {
                const wide = bits === 64;
                const shift = amount & (wide ? 63n : 31n);
                if (mnemonic === 'lsl') return BigInt.asUintN(bits, value << shift);
                if (mnemonic === 'lsr') return BigInt.asUintN(bits, value) >> shift;
                if (mnemonic === 'asr') return BigInt.asUintN(bits, BigInt.asIntN(bits, value) >> shift);
                throw new Error(`unsupported mnemonic: ${mnemonic}`);
              }

              for (const mnemonic of ['lsl', 'lsr', 'asr']) {
                for (const amount of [0n, 31n, 32n, 33n, 63n]) {
                  const emu = new Emulator({});
                  const input = 0x80000001n;
                  emu.set('w0', input);
                  emu.set('w1', amount);
                  await emu.execute(mnemonic, 'w2, w0, w1', 0n);
                  assert.equal(
                    emu.get('w2'),
                    expectedShift(mnemonic, input & MASK32, amount, 32),
                    `${mnemonic} W amount=${amount} must use amount modulo 32`,
                  );
                }

                for (const amount of [0n, 63n, 64n, 65n]) {
                  const emu = new Emulator({});
                  const input = 0x8000000000000001n;
                  emu.set('x0', input);
                  emu.set('x1', amount);
                  await emu.execute(mnemonic, 'x2, x0, x1', 0n);
                  assert.equal(
                    emu.get('x2'),
                    expectedShift(mnemonic, input, amount, 64),
                    `${mnemonic} X amount=${amount} must use amount modulo 64`,
                  );
                }
              }

              for (const [dst, src, count, input] of [
                ['w2', 'w0', 'w1', 0x81234567n],
                ['x2', 'x0', 'x1', 0x8123456789abcdefn],
              ]) {
                const bits = dst.startsWith('w') ? 32 : 64;
                const amount = BigInt(bits);
                const emu = new Emulator({});
                emu.set(src, input);
                emu.set(count, amount);
                await emu.execute('ror', `${dst}, ${src}, ${count}`, 0n);
                assert.equal(emu.get(dst), BigInt.asUintN(bits, input), `ror ${bits}-bit full-width rotation remains identity`);
              }

              console.log('issue-3716-emulator-variable-shift: PASS');
          """))
          PY

      - name: Focused validation
        shell: bash
        run: |
          node --check js/emu.js
          node --check tests/phase4/issue-3716-emulator-variable-shift.test.mjs
          node tests/phase4/issue-3716-emulator-variable-shift.test.mjs
          node tests/issues-802-805-810-835-840.mjs
          node tests/issues-350-399.mjs
          node tests/issues-814-816-arm64-memory.mjs
          git diff --check

      - name: Commit final diff and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-3716-apply.yml
          git add js/emu.js tests/phase4/issue-3716-emulator-variable-shift.test.mjs
          git diff --cached --check
          git commit -m "fix(emu): mask variable shifts by register width"
          git push origin HEAD:fix/issue-3716-emulator-variable-shift
