name: Temporary ARM64 audit sync

on:
  push:
    branches:
      - integration/non-stage2-issue-fixes-20260826

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/non-stage2-issue-fixes-20260826
          fetch-depth: 0
      - name: Apply exact audit evidence refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          edits = {
              Path('tests/machine-effects/arm64-a64-decoder-denominator.test.mjs'): [
                  ("'dependency-pending':65,", "'dependency-pending':68,"),
                  ("'out-of-profile-unenumerated':32_838,", "'out-of-profile-unenumerated':32_835,"),
              ],
              Path('tests/machine-effects/a2-denominator-inventory.json'): [
                  ('"decoderAuditSha256": "de6882fa5b13b7f31480fb4089f76d537415e18262de81d5f306a62f72061d4d"',
                   '"decoderAuditSha256": "c39f28439939b171994064176137437f8a965243e56199437174959dc39e0332"'),
              ],
          }

          changed = False
          for path, replacements in edits.items():
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count == 1:
                      text = text.replace(old, new)
                      changed = True
                  elif count == 0 and text.count(new) == 1:
                      pass
                  else:
                      raise SystemExit(f'{path}: expected exactly one old or one new occurrence for {old!r}; old={count}, new={text.count(new)}')
              path.write_text(text)

          if not changed:
              print('ARM64 audit evidence already synchronized')
          PY
          git diff --check
      - name: Commit synchronized evidence when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/machine-effects/arm64-a64-decoder-denominator.test.mjs tests/machine-effects/a2-denominator-inventory.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/machine-effects/arm64-a64-decoder-denominator.test.mjs tests/machine-effects/a2-denominator-inventory.json
          git commit -m 'fix(arm64): sync decoder audit proof evidence'
          git push origin HEAD:integration/non-stage2-issue-fixes-20260826
