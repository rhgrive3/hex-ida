name: tmp-reconcile-9031
on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-07-batch-09
permissions:
  contents: write
concurrency:
  group: tmp-reconcile-9031
  cancel-in-progress: true
jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect and constrain merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin main
          BASE="$(git merge-base HEAD origin/main)"
          git diff --binary "$BASE"..HEAD -- js/worker-fixes.js > /tmp/worker.patch
          set +e
          git merge --no-ff --no-commit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for f in "${conflicts[@]}"; do
              case "$f" in js/macho.js|js/worker-fixes.js) ;; *) echo "unexpected conflict: $f"; exit 1 ;; esac
            done
            git checkout --theirs -- js/macho.js js/worker-fixes.js
            git add js/macho.js js/worker-fixes.js
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Apply current-main Mach-O reconciliation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/macho-current.patch
          git apply /tmp/macho-current.patch
      - name: Reapply worker fixes delta
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way /tmp/worker.patch
      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          node --check js/macho.js
          node --check js/worker-fixes.js
          node --test \
            tests/phase4/binary/issue-8828-legacy-macho-segment-vm-overlap.test.mjs \
            tests/phase4/binary/issue-8832-macho-ehframe-fde-containment.test.mjs \
            tests/phase4/binary/issue-8840-legacy-macho-fat-slice-overlap.test.mjs
      - name: Finalize merge commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-reconcile-9031.yml
          git add -A
          git commit -m 'fix: reconcile PR #9031 with current main'
          git push origin HEAD:${GITHUB_REF_NAME}
