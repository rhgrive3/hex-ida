name: one-shot-2324-gp
"on": push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/targets/architecture/arm64/effects/simd.js')
          s = p.read_text()
          a = "const simdRegister = op.k === 'elem' || (op.k === 'reg' && (op.cls === 'vec' || op.cls === 'fp'));"
          b = "const simdRegister = op.k === 'elem' || (op.k === 'reg' && ['vec','fp','gp','zr'].includes(op.cls));"
          if s.count(a) != 1:
              raise SystemExit(f'predicate anchor count={s.count(a)}')
          p.write_text(s.replace(a, b, 1))
          t = Path('tests/machine-effects/arm64-simd-gp-register-modifier-encoding.test.mjs')
          t.write_text(r'''import assert from 'node:assert/strict';
import { parseOperands } from '../../js/arm64.js';
import { liftArm64SimdEffects } from '../../js/targets/architecture/arm64/effects/simd.js';

let sequence = 0;
function lift(mnemonic, operands) {
  const instructionId = `arm64-simd-gp-modifier-${++sequence}`;
  return liftArm64SimdEffects({
    instructionId,
    mnemonic,
    operands,
    ops: parseOperands(operands),
    mode:'a64',
    origin:{ instructionIds:[instructionId] },
  });
}

for (const [mnemonic, operands] of [
  ['dup', 'v0.4s, w1'],
  ['ins', 'v0.s[0], w1'],
  ['umov', 'w0, v1.s[0]'],
  ['smov', 'x0, v1.s[0]'],
]) {
  const effect = lift(mnemonic, operands);
  assert.ok(effect && ['exact','exact-with-intrinsic'].includes(effect.completeness), `${mnemonic} ${operands}: legal lane GP form`);
}

for (const [mnemonic, operands] of [
  ['dup', 'v0.4s, w1, lsl #1'],
  ['dup', 'v0.4s, w1, uxtw #0'],
  ['ins', 'v0.s[0], w1, lsl #1'],
  ['ins', 'v0.s[0], w1, uxtw #0'],
]) {
  const effect = lift(mnemonic, operands);
  assert.ok(effect, `${mnemonic} ${operands}: fail-closed effect required`);
  assert.equal(effect.completeness, 'partial', `${mnemonic} ${operands}: GP modifier must be partial`);
  assert.equal(
    effect.operations.some((operation) => ['register-read','register-write','intrinsic'].includes(operation.kind)),
    false,
    `${mnemonic} ${operands}: invalid form must not emit definite effects`,
  );
}

console.log('arm64 SIMD GP register modifier encoding: PASS');
''')
          PY
          git diff --check
          git rm .github/workflows/one-shot-2324-gp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/targets/architecture/arm64/effects/simd.js tests/machine-effects/arm64-simd-gp-register-modifier-encoding.test.mjs
          git commit -m 'fix(arm64): reject GP modifiers in SIMD lane forms'
          git push
