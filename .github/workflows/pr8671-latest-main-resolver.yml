name: PR 8671 latest-main resolver

on:
  push:
    branches:
      - integration-candidate/benchmark-auth-20260914

permissions:
  contents: write

concurrency:
  group: pr8671-latest-main-resolver
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Resolve latest main losslessly
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='integration-candidate/benchmark-auth-20260914'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --depth=100
          MAIN_SHA="$(git rev-parse origin/main)"
          HEAD_BEFORE="$(git rev-parse HEAD)"
          {
            echo "main=$MAIN_SHA"
            echo "head_before=$HEAD_BEFORE"
          } > /tmp/pr8671-result.txt

          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'status=already-current' >> /tmp/pr8671-result.txt
            exit 0
          fi

          MERGE_BASE="$(git merge-base HEAD origin/main)"
          export MERGE_BASE
          set +e
          git merge --no-commit --no-ff origin/main
          MERGE_RC=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          unexpected=()
          for f in "${conflicts[@]}"; do
            case "$f" in
              package.json|tests/userscript-embed-child.mjs) ;;
              *) unexpected+=("$f") ;;
            esac
          done
          if (( ${#unexpected[@]} > 0 )); then
            printf 'status=unexpected-conflicts\n' >> /tmp/pr8671-result.txt
            printf 'conflict=%s\n' "${unexpected[@]}" >> /tmp/pr8671-result.txt
            exit 41
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const path = 'package.json';
          const mb = process.env.MERGE_BASE;
          const show = (ref) => JSON.parse(execFileSync('git', ['show', `${ref}:${path}`], { encoding: 'utf8' }));
          const base = show(mb);
          const ours = show('HEAD');
          const theirs = show('origin/main');
          const ABSENT = Symbol('absent');
          const eq = (a, b) => a === ABSENT || b === ABSENT ? a === b : JSON.stringify(a) === JSON.stringify(b);
          const mergeScalar = (key, b, o, t) => {
            if (eq(o, b)) return t;
            if (eq(t, b)) return o;
            if (eq(o, t)) return o;
            if (key === 'test' && typeof b === 'string' && typeof o === 'string' && typeof t === 'string' && o.endsWith(b) && t.endsWith(b)) {
              const op = o.slice(0, o.length - b.length);
              const tp = t.slice(0, t.length - b.length);
              return `${tp}${op}${b}`;
            }
            throw new Error(`package.json three-way conflict at ${key}`);
          };
          const mergeObject = (b = {}, o = {}, t = {}, prefix = '') => {
            const out = {};
            const keys = new Set([...Object.keys(b || {}), ...Object.keys(o || {}), ...Object.keys(t || {})]);
            for (const key of keys) {
              const bv = Object.hasOwn(b || {}, key) ? b[key] : ABSENT;
              const ov = Object.hasOwn(o || {}, key) ? o[key] : ABSENT;
              const tv = Object.hasOwn(t || {}, key) ? t[key] : ABSENT;
              const mv = mergeScalar(prefix ? `${prefix}.${key}` : key, bv, ov, tv);
              if (mv !== ABSENT) out[key] = mv;
            }
            return out;
          };
          const merged = {};
          const keys = new Set([...Object.keys(base), ...Object.keys(ours), ...Object.keys(theirs)]);
          for (const key of keys) {
            if (key === 'scripts' || key === 'devDependencies' || key === 'dependencies') {
              merged[key] = mergeObject(base[key], ours[key], theirs[key], key === 'scripts' ? '' : key);
              continue;
            }
            const bv = Object.hasOwn(base, key) ? base[key] : ABSENT;
            const ov = Object.hasOwn(ours, key) ? ours[key] : ABSENT;
            const tv = Object.hasOwn(theirs, key) ? theirs[key] : ABSENT;
            const mv = mergeScalar(key, bv, ov, tv);
            if (mv !== ABSENT) merged[key] = mv;
          }
          fs.writeFileSync(path, JSON.stringify(merged));
          NODE

          if git cat-file -e "$MERGE_BASE:tests/userscript-embed-child.mjs" 2>/dev/null \
             && git cat-file -e "HEAD:tests/userscript-embed-child.mjs" 2>/dev/null \
             && git cat-file -e "origin/main:tests/userscript-embed-child.mjs" 2>/dev/null; then
            git show HEAD:tests/userscript-embed-child.mjs > /tmp/ours.mjs
            git show "$MERGE_BASE":tests/userscript-embed-child.mjs > /tmp/base.mjs
            git show origin/main:tests/userscript-embed-child.mjs > /tmp/theirs.mjs
            if ! git merge-file -p /tmp/ours.mjs /tmp/base.mjs /tmp/theirs.mjs > tests/userscript-embed-child.mjs; then
              echo 'status=userscript-test-conflict' >> /tmp/pr8671-result.txt
              exit 42
            fi
          fi

          git add -A
          if git diff --cached --check; then :; else
            echo 'status=diff-check-failed' >> /tmp/pr8671-result.txt
            exit 43
          fi
          git commit -m "Merge main into PR #8671 after latest drift"
          MERGE_COMMIT="$(git rev-parse HEAD)"
          echo "merge_commit=$MERGE_COMMIT" >> /tmp/pr8671-result.txt
          echo 'status=merged' >> /tmp/pr8671-result.txt
          git push origin "HEAD:$BRANCH"

      - name: Upload minimal resolver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8671-latest-main-result
          path: /tmp/pr8671-result.txt
          if-no-files-found: warn
          retention-days: 1
