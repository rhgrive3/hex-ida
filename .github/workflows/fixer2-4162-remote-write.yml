name: fixer2-4162-remote-write

on:
  push:
    branches:
      - fix/issue-4162-fixer2-binary

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-4162-fixer2-binary
          fetch-depth: 1
      - name: Apply exact root-cause patch and validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/pe-loader-core.js)" = "e77c52abae2b1a9d319427d131a698c15d674b2b"
          test "$(git hash-object tests/phase4/binary/issue-4162-pe-arm64-xdata-handler-rva.test.mjs)" = "2e172271784adc3f50fff324cbb670d46a029458"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/binary/pe-loader-core.js')
          s = p.read_text()
          old = """  const recordBytes = headerBytes + (packedEpilog ? 0 : epilogCount * 4) + codeWords * 4 + (hasHandler ? 4 : 0);\n  if (!Number.isSafeInteger(recordBytes) || !mappedFileSpanForRva(image, xdataRva, recordBytes)) return invalidExceptionRecord(image, kind, budget, 'arm64-xdata-span', `Ignored ARM64 .xdata record that crosses its file-backed mapping at RVA 0x${xdataRva.toString(16)}`);\n  const bytes = functionLength * 4;\n  if (!executableRvaRange(image, begin, bytes)) return invalidExceptionRecord(image, kind, budget, 'arm64-xdata-range', `Ignored ARM64 .xdata range outside executable mapping at RVA 0x${begin.toString(16)}`);\n  return { size:bytes, xdataRva, version, hasHandler, packedEpilog, epilogCount, codeWords };\n"""
          new = """  const recordBytes = headerBytes + (packedEpilog ? 0 : epilogCount * 4) + codeWords * 4 + (hasHandler ? 4 : 0);\n  const recordSpan = Number.isSafeInteger(recordBytes) ? mappedFileSpanForRva(image, xdataRva, recordBytes) : null;\n  if (!recordSpan) return invalidExceptionRecord(image, kind, budget, 'arm64-xdata-span', `Ignored ARM64 .xdata record that crosses its file-backed mapping at RVA 0x${xdataRva.toString(16)}`);\n  let handlerRva = null;\n  if (hasHandler) {\n    const handlerOffset = recordSpan.spanEnd - 4;\n    if (handlerOffset < 0 || handlerOffset + 4 > r.length) return invalidExceptionRecord(image, kind, budget, 'arm64-handler-tail', `Ignored truncated ARM64 exception handler RVA at .xdata RVA 0x${xdataRva.toString(16)}`);\n    if (!budget.take({ inputBytes:4, operations:1 }, 'arm64-xdata-handler')) return null;\n    handlerRva = r.u32(handlerOffset);\n    if (!handlerRva || !mappedFileRangeForRva(image, handlerRva) || !executableRvaRange(image, handlerRva, 1)) {\n      return invalidExceptionRecord(image, kind, budget, 'arm64-handler-not-executable', `Ignored ARM64 .xdata whose exception handler RVA 0x${handlerRva.toString(16)} is not an executable file-backed routine`);\n    }\n  }\n  const bytes = functionLength * 4;\n  if (!executableRvaRange(image, begin, bytes)) return invalidExceptionRecord(image, kind, budget, 'arm64-xdata-range', `Ignored ARM64 .xdata range outside executable mapping at RVA 0x${begin.toString(16)}`);\n  return { size:bytes, xdataRva, version, hasHandler, handlerRva, packedEpilog, epilogCount, codeWords };\n"""
          if s.count(old) != 1:
              raise SystemExit(f'expected exact source block once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          test "$(git hash-object js/binary/pe-loader-core.js)" = "52a48218e55eef860bfe033de1a7420055e61c24"
          node --check js/binary/pe-loader-core.js
          node tests/phase4/binary/issue-4162-pe-arm64-xdata-handler-rva.test.mjs
      - name: Commit source patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/binary/pe-loader-core.js tests/phase4/binary/issue-4162-pe-arm64-xdata-handler-rva.test.mjs
          git rm .github/workflows/fixer2-4162-remote-write.yml
          git commit -m 'fix(pe): validate ARM64 xdata handler RVA (#4162)'
          git push origin HEAD:fix/issue-4162-fixer2-binary
