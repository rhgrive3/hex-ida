name: Temporary cross-binary OOM repair

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cross-binary-oom-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard and patch runner-local memory scheduling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/cross-binary-accuracy.yml)" = "bbaba6c05e7aaaf98d1a69d197d67c260f4f2540"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/cross-binary-accuracy.yml')
          text = path.read_text()
          text = text.replace(
              "  # Two non-pseudocode processes + two persistent pseudocode workers fit the\n  # four CPUs of the public ubuntu runner without creating another Actions job.\n  LOCAL_PSEUDOC_WORKERS: 2",
              "  # Keep two persistent pseudocode workers, but run their memory-heavy phase\n  # after the two non-pseudocode lanes so the runner never hosts both pools at once.\n  LOCAL_PSEUDOC_WORKERS: 2",
          )
          old = '''          if [[ "$PSEUDOC_CACHE_HIT" != "true" ]]; then
            node tests/accuracy-pseudoc-parallel.mjs \\
              --target="$target" \\
              --oracle="$oracle" \\
              --workers="$LOCAL_PSEUDOC_WORKERS" \\
              --json > "${pseudoc_output}.tmp" \\
              2> accuracy-local-pseudoc.log &
            pids+=("$!")
            labels+=("pseudoc")
          fi

          status=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then status=1; fi
            log="accuracy-local-${labels[$i]}.log"
            if [[ -f "$log" ]]; then cat "$log"; fi
          done
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
'''
          new = '''          # Join both non-pseudocode lanes before starting pseudocode. The
          # feature sets and worker counts are unchanged; only their memory-heavy
          # phases no longer overlap on the same hosted runner.
          status=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then status=1; fi
            log="accuracy-local-${labels[$i]}.log"
            if [[ -f "$log" ]]; then cat "$log"; fi
          done
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi

          if [[ "$PSEUDOC_CACHE_HIT" != "true" ]]; then
            if ! node tests/accuracy-pseudoc-parallel.mjs \\
              --target="$target" \\
              --oracle="$oracle" \\
              --workers="$LOCAL_PSEUDOC_WORKERS" \\
              --json > "${pseudoc_output}.tmp" \\
              2> accuracy-local-pseudoc.log; then
              cat accuracy-local-pseudoc.log
              exit 1
            fi
            cat accuracy-local-pseudoc.log
          fi
'''
          if old not in text:
              raise SystemExit('expected cross-binary scheduling block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          node tests/issue-497-cross-binary-workflow.mjs
      - name: Publish guarded CI repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-cross-binary-oom-repair.yml
          git add .github/workflows/cross-binary-accuracy.yml
          git commit -m 'fix(ci): bound cross-binary accuracy peak memory'
          git push origin HEAD:main
