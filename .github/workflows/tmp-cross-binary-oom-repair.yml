name: Temporary cross-binary OOM repair

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cross-binary-oom-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard and patch runner-local memory scheduling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/cross-binary-accuracy.yml)" = "bbaba6c05e7aaaf98d1a69d197d67c260f4f2540"
          python3 tools/tmp-cross-binary-oom-repair.py
          git diff --check
          node tests/issue-497-cross-binary-workflow.mjs
      - name: Publish guarded CI repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-cross-binary-oom-repair.yml tools/tmp-cross-binary-oom-repair.py
          git add .github/workflows/cross-binary-accuracy.yml
          git commit -m 'fix(ci): bound cross-binary accuracy peak memory'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
