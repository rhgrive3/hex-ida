name: Temporary patch 1569 1570
on:
  push:
    branches: [fix/identity-evidence-slice-clean]
    paths: [.github/workflows/tmp-patch-1569-1570.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/identity-evidence-slice-clean
          fetch-depth: 0
      - run: |
          python3 tools/tmp-patch-1569-1570.py
          node --check js/core/identity/index.js
      - run: |
          rm .github/workflows/tmp-patch-1569-1570.yml tools/tmp-patch-1569-1570.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/identity/index.js .github/workflows/tmp-patch-1569-1570.yml tools/tmp-patch-1569-1570.py
          git diff --cached --check
          git commit -m "fix(identity): preserve evidence type identity and strict slice index (#1569 #1570)"
          git push origin HEAD:fix/identity-evidence-slice-clean
