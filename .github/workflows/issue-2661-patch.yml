name: issue-2661-focused-patch
on:
  push:
    branches:
      - fix/2661-discovery-ownership-fusion
    paths:
      - .github/workflows/issue-2661-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2661-discovery-ownership-fusion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ownership-aware extent fusion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/analysis/discovery/fusion.js'); s=p.read_text()
          old="  if (complete.length === 0 && partial.length > 0) {\n    const merged = new Map();\n    for (const item of partial) {\n      for (const region of item.regions) merged.set(`${region.start}-${region.end}`, region);\n    }\n    const regions = [...merged.values()].sort((left, right) => (BigInt(left.start) < BigInt(right.start) ? -1 : 1));\n    return {\n      regions,\n      state: authoritative.length > 0 ? 'exact' : 'heuristic',\n      conflicts: [],\n    };\n  }\n"
          new="  if (complete.length === 0 && partial.length > 0) {\n    const merged = new Map();\n    const ownershipByRange = new Map();\n    for (const item of partial) {\n      for (const region of item.regions) {\n        const rangeKey = `${region.start}-${region.end}`;\n        const priorOwnership = ownershipByRange.get(rangeKey);\n        if (priorOwnership != null && priorOwnership !== region.ownership) {\n          return {\n            regions: [],\n            state: 'unknown',\n            conflicts: [{ kind: 'extent', detail: 'partial extent ownership evidence disagrees', alternatives: [...new Set([priorOwnership, region.ownership])].sort() }],\n          };\n        }\n        ownershipByRange.set(rangeKey, region.ownership);\n        merged.set(`${rangeKey}-${region.ownership}`, region);\n      }\n    }\n    const regions = [...merged.values()].sort((left, right) => {\n      const byStart = BigInt(left.start) < BigInt(right.start) ? -1 : BigInt(left.start) > BigInt(right.start) ? 1 : 0;\n      if (byStart !== 0) return byStart;\n      const byEnd = BigInt(left.end) < BigInt(right.end) ? -1 : BigInt(left.end) > BigInt(right.end) ? 1 : 0;\n      return byEnd || left.ownership.localeCompare(right.ownership);\n    });\n    return { regions, state: authoritative.length > 0 ? 'exact' : 'heuristic', conflicts: [] };\n  }\n"
          if s.count(old)!=1: raise SystemExit('partial fusion source drifted')
          s=s.replace(old,new,1)
          old="const signature = item.regions.map((region) => `${region.start}-${region.end}`).join(',');"
          if s.count(old)!=1: raise SystemExit('complete signature source drifted')
          s=s.replace(old,"const signature = regionSignature(item);",1); p.write_text(s)
          t=Path('tests/phase7/discovery/ownership-fusion-2661.test.mjs')
          t.write_text("import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport {fuseFunctionCandidates} from '../../../js/analysis/discovery/fusion.js';\nconst e=(producerId,ownership,extentRole='complete')=>({kind:'loader-function-start',authority:'authoritative',producerId,start:'4096',extentRole,regions:[{start:'4096',end:'4112',ownership}]});\ntest('same ownership agrees exactly',()=>{const c=fuseFunctionCandidates([e('a','exclusive'),e('b','exclusive')]).candidates[0];assert.equal(c.extentState,'exact');assert.equal(c.regions[0].ownership,'exclusive');});\ntest('complete ownership disagreement fails closed independent of order',()=>{const x=[e('a','exclusive'),e('b','shared')];for(const v of [x,[...x].reverse()]){const c=fuseFunctionCandidates(v).candidates[0];assert.equal(c.extentState,'unknown');assert.deepEqual(c.regions,[]);assert.ok(c.conflicts.some(z=>z.kind==='extent'));}});\ntest('partial ownership disagreement is never silently overwritten',()=>{const x=[e('a','exclusive','partial'),e('b','shared','partial')];for(const v of [x,[...x].reverse()]){const c=fuseFunctionCandidates(v).candidates[0];assert.equal(c.extentState,'unknown');assert.deepEqual(c.regions,[]);assert.ok(c.conflicts.some(z=>/ownership/.test(z.detail)));}});\n")
          Path('.github/workflows/issue-2661-patch.yml').unlink()
          PY
          node --test tests/phase7/discovery/ownership-fusion-2661.test.mjs
          git diff --check
      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(discovery): preserve extent ownership in fusion (#2661)"
          git push origin HEAD:fix/2661-discovery-ownership-fusion
