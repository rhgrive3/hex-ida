name: Fixer2 issue 8495 remote write
on:
  push:
    branches:
      - fixer2/issue-8495-arm64_32-classic-bind-width
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixer2/issue-8495-arm64_32-classic-bind-width
          fetch-depth: 0
      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/macho-dyld.js)" = "86eea0481d41411edae96185941ddacf28a3ed45"
          test ! -e tests/phase4/binary/issue-8495-macho-arm64_32-classic-bind-pointer-width.test.mjs
      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/issue-8495.patch
          git apply --check /tmp/issue-8495.patch
          git apply /tmp/issue-8495.patch
          mkdir -p tests/phase4/binary
          printf '%s' '' | base64 -d > tests/phase4/binary/issue-8495-macho-arm64_32-classic-bind-pointer-width.test.mjs
          test "$(git hash-object js/binary/macho-dyld.js)" = "14e642e0a702ac8ab8de0353ef9166c60a0fd5e4"
          test "$(git hash-object tests/phase4/binary/issue-8495-macho-arm64_32-classic-bind-pointer-width.test.mjs)" = "8e36bf763bb76be8e47643c9325ab6b06f8164d2"
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          node --check js/binary/macho-dyld.js
          node --check tests/phase4/binary/issue-8495-macho-arm64_32-classic-bind-pointer-width.test.mjs
          node tests/phase4/binary/issue-8495-macho-arm64_32-classic-bind-pointer-width.test.mjs
          node tests/issue-5889-5832-lazy-bind-opcode-and-ordinal.mjs
          node tests/issue-5835-classic-bind-location-state.mjs
      - name: Commit exact result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fixer2-issue-8495-remote.yml
          git config user.name 'Fixer 2 Binary'
          git config user.email 'actions@users.noreply.github.com'
          git add js/binary/macho-dyld.js tests/phase4/binary/issue-8495-macho-arm64_32-classic-bind-pointer-width.test.mjs .github/workflows/fixer2-issue-8495-remote.yml
          git diff --cached --check
          git commit -m 'fix(binary): use ARM64_32 native width for classic binds (#8495) [skip actions]'
          git push origin HEAD:fixer2/issue-8495-arm64_32-classic-bind-width
