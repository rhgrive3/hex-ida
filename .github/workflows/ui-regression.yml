name: UI regression

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/app.js'
      - 'js/ui.js'
      - 'js/ux.js'
      - 'js/ui/**'
      - 'js/panels.js'
      - 'js/tools.js'
      - 'js/viewer.js'
      - 'js/graphview.js'
      - 'tests/browser.mjs'
      - 'tests/ui/**'
      - 'tests/ux.mjs'
      - 'package.json'
      - '.github/workflows/ui-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: chromium-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify playwright@1.55.0 dependency
        run: node -e "const v=require('./node_modules/playwright/package.json').version; if(v!=='1.55.0'){console.error('unexpected Playwright '+v);process.exit(1)}"
      - name: Restore pinned Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium-v1
      - name: Ensure pinned Playwright Chromium is runnable
        shell: bash
        run: |
          npx --no-install playwright install chromium
          if ! node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          await browser.close();
          NODE
          then
            npx --no-install playwright install-deps chromium
          fi
      - name: Run architecture and Chromium suites with complete diagnostics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const suites=[['architecture','npm run ui:test'],['browser-regression','npm run browser'],['analysis-navigation','node tests/ui/analysis-navigation.mjs'],['accessibility','node tests/ui/accessibility.mjs'],['ai-browser','npm run ai:browser']];
          const failures=[];
          for (const [name,command] of suites) {
            const shots=`tests/ui-shots/chromium/${name}`; fs.mkdirSync(shots,{recursive:true});
            const env={...process.env,CI:'1',UI_SHOTS:shots}; const legacyShots=path.join('tests','.shots');
            if(name==='browser-regression'){env.KEEP='1';fs.rmSync(legacyShots,{recursive:true,force:true});}
            const result=spawnSync(command,{shell:true,stdio:'inherit',env});
            if(name==='browser-regression'&&fs.existsSync(legacyShots)){for(const entry of fs.readdirSync(legacyShots))fs.cpSync(path.join(legacyShots,entry),path.join(shots,entry),{recursive:true});}
            if(result.error||result.status!==0)failures.push({name,command,status:result.status,error:result.error?.message??null});
          }
          if(failures.length){console.error(JSON.stringify(failures));process.exit(1);}
          NODE
      - name: Upload Chromium screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit-chromium
          path: tests/ui-shots/chromium
          if-no-files-found: ignore
          retention-days: 7

  webkit:
    name: webkit-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify pinned Chromium and WebKit image
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium, webkit } from 'playwright';
          for(const browserType of [chromium,webkit]){const browser=await browserType.launch({headless:true});await browser.close();}
          NODE
      - name: Run all WebKit-required suites with complete diagnostics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import { spawnSync } from 'node:child_process';
          const suites=[['browser','node tests/ui/browser.mjs'],['mobile-state','node tests/ui/mobile-state.mjs']]; const failures=[];
          for(const [name,command] of suites){const shots=`tests/ui-shots/webkit/${name}`;fs.mkdirSync(shots,{recursive:true});const result=spawnSync(command,{shell:true,stdio:'inherit',env:{...process.env,CI:'1',UI_SHOTS:shots}});if(result.error||result.status!==0)failures.push({name,command,status:result.status,error:result.error?.message??null});}
          if(failures.length){console.error(JSON.stringify(failures));process.exit(1);}
          NODE
      - name: Upload WebKit screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit-webkit
          path: tests/ui-shots/webkit
          if-no-files-found: ignore
          retention-days: 7

  browser-matrix:
    name: browser-matrix
    if: always()
    needs: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download screenshot audit shards
        uses: actions/download-artifact@v4
        with:
          pattern: ui-screenshot-audit-*
          path: tests/ui-shots-shards
      - name: Verify screenshot audit
        shell: bash
        run: |
          test -d tests/ui-shots-shards
          test "$(find tests/ui-shots-shards -type f -name '*.png' | wc -l)" -ge 30
      - name: Upload combined screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit
          path: tests/ui-shots-shards
          if-no-files-found: error
          retention-days: 7
      - name: Require both browser projections
        env:
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
        shell: bash
        run: |
          if [[ "$CHROMIUM_RESULT" != "success" || "$WEBKIT_RESULT" != "success" ]]; then exit 1; fi
