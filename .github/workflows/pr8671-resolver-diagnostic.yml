name: PR 8671 resolver diagnostic

on:
  push:
    branches:
      - integration-candidate/benchmark-auth-20260914

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose resolver phases
        shell: bash
        run: |
          set -u
          : > pr8671-diagnostic.txt
          record() { printf '%s\n' "$1" >> pr8671-diagnostic.txt; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictstyle diff3
          if git fetch --no-tags origin main >/dev/null 2>&1; then record 'fetch-main: PASS'; else record 'fetch-main: FAIL'; exit 0; fi
          set +e
          git merge --no-commit --no-ff origin/main >/dev/null 2>&1
          ms=$?
          set -e
          [ "$ms" -eq 1 ] && record 'merge-conflict-status: PASS' || record "merge-conflict-status: UNEXPECTED-$ms"
          git diff --name-only --diff-filter=U | sort > /tmp/conflicts.txt
          cat > /tmp/expected.txt <<'EOF'
          js/ai/dev/ui/settings.js
          js/ai/ui/assistant.js
          js/userscript/loader.js
          package.json
          scripts/build-userscript.mjs
          tests/phase7/ownership/cross-lane-routing.test.mjs
          tools/validation/phase7/cross-lane-inventory.mjs
          userscript/hex.user.template.js
          userscript/release-version.json
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          if diff -q /tmp/expected.txt /tmp/conflicts.txt >/dev/null; then record 'conflict-set: PASS'; else record 'conflict-set: FAIL'; sed 's/^/conflict: /' /tmp/conflicts.txt >> pr8671-diagnostic.txt; fi
          marker_fail=0
          for p in js/ai/dev/ui/settings.js js/ai/ui/assistant.js js/userscript/loader.js package.json scripts/build-userscript.mjs tests/phase7/ownership/cross-lane-routing.test.mjs tools/validation/phase7/cross-lane-inventory.mjs userscript/hex.user.template.js userscript/release-version.json; do
            grep -q '^|||||||' "$p" || { record "diff3-marker: FAIL $p"; marker_fail=1; }
          done
          [ "$marker_fail" -eq 0 ] && record 'diff3-markers: PASS'
          python <<'PY' >> pr8671-diagnostic.txt 2>&1
          import json, subprocess, re
          def stage(n,p): return json.loads(subprocess.check_output(['git','show',f':{n}:{p}'], text=True))
          try:
              b,o,t=stage(1,'package.json'),stage(2,'package.json'),stage(3,'package.json')
              conflicts=[]
              def m3(b,o,t,path=''):
                  if o==t:return o
                  if o==b:return t
                  if t==b:return o
                  if isinstance(b,dict) and isinstance(o,dict) and isinstance(t,dict):
                      d={}; missing=object()
                      for k in dict.fromkeys([*b,*o,*t]):
                          bv,ov,tv=b.get(k,missing),o.get(k,missing),t.get(k,missing)
                          if bv is missing:
                              if ov is missing:d[k]=tv
                              elif tv is missing:d[k]=ov
                              elif ov==tv:d[k]=ov
                              else:conflicts.append(path+'/'+k);d[k]=ov
                          elif ov is missing or tv is missing:
                              if ov is missing and tv==bv:continue
                              if tv is missing and ov==bv:continue
                              conflicts.append(path+'/'+k);d[k]=ov if ov is not missing else tv
                          else:d[k]=m3(bv,ov,tv,path+'/'+k)
                      return d
                  conflicts.append(path);return o
              m3(b,o,t)
              print('package-conflicts:', conflicts)
          except Exception as e: print('package-stage: FAIL',repr(e))
          try:
              text=open('scripts/build-userscript.mjs').read()
              print('build-conflict-blocks:', len(re.findall(r'^<<<<<<< ',text,re.M)))
          except Exception as e: print('build-stage: FAIL',repr(e))
          PY
          git merge --abort >/dev/null 2>&1 || true
          git commit --allow-empty -m 'pr8671 write permission dry-run probe' >/dev/null 2>&1
          set +e
          git push --dry-run origin HEAD:integration-candidate/benchmark-auth-20260914 >/dev/null 2>&1
          ps=$?
          set -e
          [ "$ps" -eq 0 ] && record 'branch-write-dry-run: PASS' || record "branch-write-dry-run: FAIL-$ps"
          cat pr8671-diagnostic.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pr8671-resolver-diagnostic
          path: pr8671-diagnostic.txt
          retention-days: 1
