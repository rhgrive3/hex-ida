name: PR 8671 focused isolation after cloneability fix

on:
  push:
    branches: [integration-candidate/benchmark-auth-20260914]

permissions:
  contents: read

jobs:
  focused-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate query projection fix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p=Path('js/analysis/query/app-adapter.js')
          text=p.read_text()
          old="""function cloneableDecompilerProjection(value) {
            if (!value || typeof value !== 'object'
              || !value.ir || typeof value.ir !== 'object'
              || typeof value.ir.defUse !== 'function') return value;
            const ir = { ...value.ir };
            delete ir.defUse;
            return { ...value, ir };
          }
          """
          new="""function cloneableDecompilerProjection(value) {
            if (!value || typeof value !== 'object') return value;
            let changed = false;
            const projection = { ...value };
            if (value.ir && typeof value.ir === 'object' && typeof value.ir.defUse === 'function') {
              const ir = { ...value.ir };
              delete ir.defUse;
              projection.ir = ir;
              changed = true;
            }
            if (value.ctx && typeof value.ctx === 'object') {
              const ctx = { ...value.ctx };
              let ctxChanged = false;
              if (value.ctx.values && typeof value.ctx.values === 'object') {
                const values = { ...value.ctx.values };
                let valuesChanged = false;
                for (const key of ['at', 'defAt']) {
                  if (typeof values[key] === 'function') { delete values[key]; valuesChanged = true; }
                }
                if (valuesChanged) { ctx.values = values; ctxChanged = true; }
              }
              for (const key of ['rowOfAddress', 'addrOfRow', 'symbolFor', 'rawSymbolFor', 'fieldFor']) {
                if (typeof ctx[key] === 'function') { delete ctx[key]; ctxChanged = true; }
              }
              if (ctxChanged) { projection.ctx = ctx; changed = true; }
            }
            return changed ? projection : value;
          }
          """
          if old in text: p.write_text(text.replace(old,new,1))
          elif new not in text: raise SystemExit('cloneableDecompilerProjection shape changed unexpectedly')
          PY
          node --check js/analysis/query/app-adapter.js
      - name: Install pinned dependencies
        shell: bash
        run: timeout 300s npm ci
      - name: Run focused checks independently
        shell: bash
        run: |
          set -u
          : > pr8671-focused-isolation.txt
          run_check() {
            name="$1"; limit="$2"; shift 2
            out="/tmp/${name}.out"
            set +e
            timeout "$limit" "$@" >"$out" 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              printf '%s: PASS\n' "$name" >> pr8671-focused-isolation.txt
              return 0
            fi
            printf '%s: FAIL exit=%s\n' "$name" "$code" >> pr8671-focused-isolation.txt
            python - "$out" >> pr8671-focused-isolation.txt <<'PY'
          import sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          idx=next((i for i,l in enumerate(lines) if l.startswith('not ok ') or 'AssertionError' in l or 'Error:' in l), None)
          part=lines[-24:] if idx is None else lines[max(0,idx-4):min(len(lines),idx+24)]
          print('\n'.join(part))
          PY
            return 1
          }
          set -e
          run_check public-benchmark 180s npm run benchmark:public:test || exit 0
          run_check auth-test 240s npm run auth:test || exit 0
          run_check ai-ui-dev-profile 120s node tests/ai-ui-dev-profile.mjs || exit 0
          run_check phase7-cross-lane 120s node tests/phase7/ownership/cross-lane-routing.test.mjs || exit 0
          printf 'focused-all: PASS\n' >> pr8671-focused-isolation.txt
          cat pr8671-focused-isolation.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload focused isolation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8671-focused-isolation
          path: pr8671-focused-isolation.txt
          retention-days: 1
