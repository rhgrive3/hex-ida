name: PR 8671 auth failure diagnostic

on:
  push:
    branches: [integration-candidate/benchmark-auth-20260914]

permissions:
  contents: read

jobs:
  auth-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependencies
        shell: bash
        run: timeout 300s npm ci
      - name: Capture first auth failure only
        shell: bash
        run: |
          set -u
          set +e
          timeout 240s npm run auth:test > /tmp/auth.out 2>&1
          code=$?
          set -e
          printf 'auth-test-exit: %s\n' "$code" > pr8671-auth-failure.txt
          if [ "$code" -eq 0 ]; then
            printf 'auth-test: PASS\n' >> pr8671-auth-failure.txt
          else
            python <<'PY'
          from pathlib import Path
          lines=Path('/tmp/auth.out').read_text(errors='replace').splitlines()
          idx=next((i for i,l in enumerate(lines) if l.startswith('not ok ')), None)
          out=Path('pr8671-auth-failure.txt')
          with out.open('a') as f:
              if idx is None:
                  f.write('first-failure: not-ok marker not found\n')
                  for line in lines[-35:]: f.write(line+'\n')
              else:
                  f.write('first-failure-context:\n')
                  for line in lines[max(0,idx-3):min(len(lines),idx+28)]: f.write(line+'\n')
          PY
          fi
          cat pr8671-auth-failure.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload auth failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8671-auth-failure
          path: pr8671-auth-failure.txt
          retention-days: 1
