name: PR 8671 generated artifact clean check

on:
  push:
    branches: [integration-candidate/benchmark-auth-20260914]

permissions:
  contents: read

jobs:
  clean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify latest main remains integrated
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD
          printf 'main=%s\nhead=%s\n' "$(git rev-parse origin/main)" "$(git rev-parse HEAD)" > pr8671-generated-clean.txt
      - name: Install pinned dependencies
        shell: bash
        run: timeout 300s npm ci
      - name: Rebuild canonical auth artifacts and require zero diff
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s npm run auth:build-test
          if [ -n "$(git status --porcelain -- userscript/hex.user.template.js userscript/release-version.json)" ]; then
            git status --porcelain -- userscript/hex.user.template.js userscript/release-version.json >> pr8671-generated-clean.txt
            echo 'generated_artifacts=DIRTY' >> pr8671-generated-clean.txt
            exit 1
          fi
          echo 'generated_artifacts=clean' >> pr8671-generated-clean.txt
          cat pr8671-generated-clean.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload clean-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8671-generated-clean
          path: pr8671-generated-clean.txt
          if-no-files-found: ignore
          retention-days: 1
