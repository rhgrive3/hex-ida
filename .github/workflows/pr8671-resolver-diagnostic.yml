name: PR 8671 query cloneability diagnostic

on:
  push:
    branches: [integration-candidate/benchmark-auth-20260914]

permissions:
  contents: read

jobs:
  query-cloneability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependencies
        shell: bash
        run: timeout 300s npm ci
      - name: Locate first unclonable decompile value
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { openProduct } from './tools/validation/public-benchmark/product-host.mjs';
          import { createAppAnalysisQueryAdapter } from './js/analysis/query/index.js';
          const d=fs.mkdtempSync(path.join(os.tmpdir(),'hex-pb-clone-diag-'));
          const c=path.join(d,'a.c'), b=path.join(d,'a');
          fs.writeFileSync(c,'__attribute__((noinline)) int f(int x){return x+1;} int _start(){return f(2);}\n');
          const cc=spawnSync('clang',['--target=aarch64-linux-gnu','-fuse-ld=lld','-nostdlib','-O1','-Wl,-e,_start','-o',b,c],{encoding:'utf8'});
          const lines=[`clang-status: ${cc.status}`];
          if (cc.status===0) {
            const product=await openProduct(b);
            try {
              const snap=await product.query.snapshot();
              const funcs=await product.query.functions(snap,{}, {offset:0,limit:1000});
              const target=funcs.value.find(x=>x.name==='_start');
              lines.push(`target: ${target?.address ?? 'missing'}`);
              const adapter=createAppAnalysisQueryAdapter(product.app);
              const raw=await adapter.decompile(null,target.address,{});
              const value=raw?.value ?? raw;
              try { structuredClone(value); lines.push('structuredClone: PASS'); }
              catch(e) { lines.push(`structuredClone: FAIL ${e?.name||''} ${e?.message||e}`); }
              const bad=[]; const seen=new Set();
              function walk(v,p,depth=0){
                if (bad.length>=40 || depth>12) return;
                const t=typeof v;
                if (t==='function' || t==='symbol') { bad.push(`${p}: ${t}${t==='function' ? ` ${v.name||'<anonymous>'}` : ''}`); return; }
                if (!v || t!=='object' || seen.has(v)) return;
                seen.add(v);
                if (typeof SharedArrayBuffer!=='undefined' && v instanceof SharedArrayBuffer) { bad.push(`${p}: SharedArrayBuffer`); return; }
                let keys=[]; try { keys=Reflect.ownKeys(v); } catch(e) { bad.push(`${p}: ownKeys throws ${e}`); return; }
                for (const k of keys) {
                  if (typeof k==='symbol') { bad.push(`${p}: symbol-key ${String(k)}`); continue; }
                  let child; try { child=v[k]; } catch(e) { bad.push(`${p}.${k}: getter throws ${e}`); continue; }
                  walk(child,`${p}.${k}`,depth+1);
                }
              }
              walk(value,'value');
              lines.push('unclonable-paths:'); lines.push(...(bad.length?bad:['<none-detected>']));
            } finally { await product.close(); }
          } else lines.push(String(cc.stderr||''));
          fs.writeFileSync('pr8671-query-cloneability.txt',lines.join('\n')+'\n');
          NODE
          cat pr8671-query-cloneability.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cloneability evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr8671-query-cloneability
          path: pr8671-query-cloneability.txt
          retention-days: 1
