name: PR 8671 public benchmark failure diagnostic

on:
  push:
    branches: [integration-candidate/benchmark-auth-20260914]

permissions:
  contents: read

jobs:
  product-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependencies
        shell: bash
        run: timeout 300s npm ci
      - name: Reproduce product CLI child failure
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const d=fs.mkdtempSync(path.join(os.tmpdir(),'hex-pb-cli-diag-'));
          const c=path.join(d,'a.c'), b=path.join(d,'a');
          fs.writeFileSync(c,'__attribute__((noinline)) int f(int x){return x+1;} int _start(){return f(2);}\n');
          const cc=spawnSync('clang',['--target=aarch64-linux-gnu','-fuse-ld=lld','-nostdlib','-O1','-Wl,-e,_start','-o',b,c],{encoding:'utf8'});
          const r=cc.status===0 ? spawnSync(process.execPath,['tools/validation/public-benchmark/subject.mjs',b],{encoding:'utf8',timeout:30000}) : null;
          const lines=[];
          lines.push(`clang-status: ${cc.status}`);
          if (cc.status!==0) {
            lines.push('clang-stderr:'); lines.push(...String(cc.stderr||'').split(/\r?\n/).slice(-20));
          } else {
            lines.push(`subject-status: ${r.status}`);
            lines.push(`subject-signal: ${r.signal||''}`);
            lines.push(`subject-error: ${r.error ? String(r.error) : ''}`);
            lines.push('subject-stderr:'); lines.push(...String(r.stderr||'').split(/\r?\n/).slice(-30));
            lines.push('subject-stdout-tail:'); lines.push(...String(r.stdout||'').split(/\r?\n/).slice(-20));
          }
          fs.writeFileSync('pr8671-product-cli-failure.txt',lines.join('\n')+'\n');
          NODE
          cat pr8671-product-cli-failure.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload product CLI evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr8671-product-cli-failure
          path: pr8671-product-cli-failure.txt
          retention-days: 1
