name: PR 8671 focused diagnostic

on:
  push:
    branches: [integration-candidate/benchmark-auth-20260914]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependencies
        shell: bash
        run: timeout 300s npm ci
      - name: Run focused checks independently
        shell: bash
        run: |
          set -u
          : > pr8671-focused-diagnostic.txt
          run_check() {
            name="$1"; limit="$2"; shift 2
            out="/tmp/${name}.out"
            set +e
            timeout "$limit" "$@" >"$out" 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              printf '%s: PASS\n' "$name" >> pr8671-focused-diagnostic.txt
              return 0
            fi
            printf '%s: FAIL exit=%s\n' "$name" "$code" >> pr8671-focused-diagnostic.txt
            printf '%s\n' "--- ${name} minimal tail ---" >> pr8671-focused-diagnostic.txt
            tail -n 25 "$out" >> pr8671-focused-diagnostic.txt
            return 1
          }
          set -e
          run_check auth-test 240s npm run auth:test || exit 0
          run_check public-benchmark 180s npm run benchmark:public:test || exit 0
          run_check ai-ui-dev-profile 120s node tests/ai-ui-dev-profile.mjs || exit 0
          run_check phase7-cross-lane 120s node tests/phase7/ownership/cross-lane-routing.test.mjs || exit 0
          printf 'focused-all: PASS\n' >> pr8671-focused-diagnostic.txt
          cat pr8671-focused-diagnostic.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload focused diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8671-focused-diagnostic
          path: pr8671-focused-diagnostic.txt
          retention-days: 1
