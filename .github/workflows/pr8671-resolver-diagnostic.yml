name: PR 8671 latest-main conflict inventory

on:
  push:
    branches: [integration-candidate/benchmark-auth-20260914]

permissions:
  contents: read

jobs:
  conflicts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture latest-main merge conflict inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictstyle diff3
          git fetch --no-tags origin main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          set +e
          git merge --no-commit --no-ff origin/main >/dev/null 2>&1
          status=$?
          set -e
          {
            printf 'head=%s\n' "$head_sha"
            printf 'main=%s\n' "$main_sha"
            printf 'merge_status=%s\n' "$status"
            printf '%s\n' 'conflicts:'
            git diff --name-only --diff-filter=U | sort
          } > pr8671-latest-main-conflicts.txt
          cat pr8671-latest-main-conflicts.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload conflict inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8671-latest-main-conflicts
          path: pr8671-latest-main-conflicts.txt
          retention-days: 1
