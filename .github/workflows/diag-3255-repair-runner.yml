name: Repair PR 3255 exact legacy return
on:
  push:
    branches:
      - diag/3255-repair-runner-20260902
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and verify repaired stacked heads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/3120-semantic-oracle-split fix/3120-phase8-legacy-oracle-split

          OLD_SEMANTIC=5b0ac2ad12ebb8a682c35ff8c8a3f579d415daa5
          OLD_PHASE8=38a2810cfd682be8f3354f3e74dcefa83d619de3
          test "$(git rev-parse origin/fix/3120-semantic-oracle-split)" = "$OLD_SEMANTIC"
          test "$(git rev-parse origin/fix/3120-phase8-legacy-oracle-split)" = "$OLD_PHASE8"
          test "$(git rev-parse "$OLD_PHASE8^")" = "$OLD_SEMANTIC"

          git checkout -B phase8-work "$OLD_PHASE8"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/decompiler/passes/stack-return-recovery.js')
          s = p.read_text()

          old_store = '''function storeValue(inst, key, values) {
            if (inst?.op !== 'store' || inst.loc?.key !== key) return null;
            let node = expressionOf(valueOf(inst.args?.[0]), values);
            if (!node) return null;
            const bytes = Number(inst.size || inst.loc?.size || inst.addr?.size || 0);
            const bits = bytes > 0 ? bytes * 8 : 0;
            if (bits) node = fitWidth(node, bits, {
              address:inst.address,
              row:inst.row,
              ir:inst.id,
              evidence:[{ reason:`exact ${bits}-bit stack-store boundary` }],
            });
            return node;
          }
          '''
          new_store = '''function exactStackLoadSource(ir, value, expression) {
            if (expression?.kind !== 'load' || expression.location?.kind !== 'stack' || !expression.location?.key) return null;
            const direct = value?.def;
            if (direct?.op === 'load' && direct.loc?.kind === 'stack' && direct.loc.key === expression.location.key) return direct;

            const ids = new Set((expression.source?.ir || []).map(String));
            const candidates = (ir?.instructions || []).filter((inst) =>
              ids.has(String(inst.id)) && inst?.op === 'load' && inst.loc?.kind === 'stack'
                && inst.loc.key === expression.location.key);
            return candidates.length === 1 ? candidates[0] : null;
          }

          function storeValue(inst, key, values, ir, opts, engine, active, depth) {
            if (inst?.op !== 'store' || inst.loc?.key !== key) return null;
            const value = valueOf(inst.args?.[0]);
            let node = expressionOf(value, values);
            if (!node) return null;

            // Clang -O0 commonly copies an argument spill into a branch-local
            // return slot. Resolve that inner stack load only through this same
            // bounded CFG/barrier proof; ambiguity remains explicit.
            if (node.kind === 'load' && node.location?.kind === 'stack') {
              const sourceLoad = exactStackLoadSource(ir, value, node);
              if (!sourceLoad) return null;
              node = resolve(ir, sourceLoad.block, sourceLoad.row, sourceLoad.loc.key,
                values, opts, engine, active, depth + 1);
              if (!node) return null;
            }

            const bytes = Number(inst.size || inst.loc?.size || inst.addr?.size || 0);
            const bits = bytes > 0 ? bytes * 8 : 0;
            if (bits) node = fitWidth(node, bits, {
              address:inst.address,
              row:inst.row,
              ir:inst.id,
              evidence:[{ reason:`exact ${bits}-bit stack-store boundary` }],
            });
            return node;
          }
          '''
          old_store = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_store.split('\n'))
          new_store = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_store.split('\n'))
          if s.count(old_store) != 1:
              raise SystemExit(f'storeValue exact match count={s.count(old_store)}')
          s = s.replace(old_store, new_store, 1)

          old_call = '      const stored = storeValue(inst, key, values);'
          new_call = '      const stored = storeValue(inst, key, values, ir, opts, engine, active, depth);'
          if s.count(old_call) != 1:
              raise SystemExit(f'storeValue call exact match count={s.count(old_call)}')
          s = s.replace(old_call, new_call, 1)

          old_committed = '\n'.join([
              '  return expr.load(location, root.bits || 64, root.source, {',
              '    signed: root.signed ?? null,',
              "    proof: 'all SSA phi predecessors committed the exact spilled value to one lvalue',",
              '  });',
          ])
          new_committed = '\n'.join([
              '  return {',
              '    expression: expr.load(location, root.bits || 64, root.source, {',
              '      signed: root.signed ?? null,',
              "      proof: 'all SSA phi predecessors committed the exact spilled value to one lvalue',",
              '    }),',
              '    stackStore,',
              '  };',
          ])
          if s.count(old_committed) != 1:
              raise SystemExit(f'committed return exact match count={s.count(old_committed)}')
          s = s.replace(old_committed, new_committed, 1)

          old_recover = '\n'.join([
              '  let committed = committedReturnValue(result, root, ret, opts);',
              '  let committedSpill = null;',
              '  if (!committed) {',
          ])
          new_recover = '\n'.join([
              '  const committedProof = committedReturnValue(result, root, ret, opts);',
              '  let committed = committedProof?.expression ?? null;',
              '  let committedSpill = committedProof?.stackStore ?? null;',
              '  if (!committed) {',
          ])
          if s.count(old_recover) != 1:
              raise SystemExit(f'recover committed exact match count={s.count(old_recover)}')
          s = s.replace(old_recover, new_recover, 1)

          p.write_text(s)
          PY

          node tests/decompiler-semantic.mjs
          node --input-type=module -e "import {setSemanticMigrationMode} from './js/ir.js'; setSemanticMigrationMode('legacy-v1'); await import('./tests/decompiler-semantic.mjs');"
          node tests/compiler-truth/run.mjs
          node --input-type=module -e "import {setSemanticMigrationMode} from './js/ir.js'; setSemanticMigrationMode('legacy-v1'); await import('./tests/compiler-truth/run.mjs');"
          npm run semantic-v2:test
          node tests/phase8/run.mjs

          git add js/decompiler/passes/stack-return-recovery.js
          git commit -m "fix(decompiler): prove nested legacy return spills"
          NEW_PHASE8=$(git rev-parse HEAD)
          git push --force-with-lease=refs/heads/fix/3120-phase8-legacy-oracle-split:$OLD_PHASE8 origin "$NEW_PHASE8:refs/heads/fix/3120-phase8-legacy-oracle-split"
          echo "NEW_PHASE8=$NEW_PHASE8"
