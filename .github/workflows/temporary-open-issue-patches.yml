name: Temporary open issue patches

on:
  push:
    branches: [fix/all-open-issues-20260823]
    paths: [.github/workflows/temporary-open-issue-patches.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/all-open-issues-20260823
          fetch-depth: 0
      - name: Apply exact source patches
        run: |
          python3 tools/tmp-open-issue-patches.py
          node --check js/evidence.js
          node --check js/schema.js
          node --check js/program.js
          node --check js/binary/model.js
          node --check js/core/scheduler/analysis-scheduler.js
      - name: Commit and self-remove
        run: |
          rm .github/workflows/temporary-open-issue-patches.yml tools/tmp-open-issue-patches.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/evidence.js js/schema.js js/program.js js/binary/model.js js/core/scheduler/analysis-scheduler.js .github/workflows/temporary-open-issue-patches.yml tools/tmp-open-issue-patches.py
          git diff --cached --check
          git commit -m "fix: apply remaining large-file issue patches"
          git push origin HEAD:fix/all-open-issues-20260823
