name: Owner11 fresh carrier repair

on:
  push:
    branches:
      - consolidate/owner11-20260913-2058
    paths:
      - .github/workflows/owner11-fresh-carrier.yml

permissions:
  contents: write

jobs:
  repair-current-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Align stale #4590 assertion with current evidence authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/phase12/integration/issue-4590-session-proposal-hydration.test.mjs')
          s = p.read_text()
          old = "  assert.equal(stores.evidenceStore.get(evidenceId).status, 'verified');"
          new = "  // Raw persisted confirmedFindings carry no deterministic authority envelope; current main fails closed to supported.\n  assert.equal(stores.evidenceStore.get(evidenceId).status, 'supported');"
          if s.count(old) != 1:
              raise SystemExit('expected exactly one stale #4590 verified assertion')
          p.write_text(s.replace(old, new))
          PY

      - name: Test 4590 proposal hydration
        run: timeout 45s node --test tests/phase12/integration/issue-4590-session-proposal-hydration.test.mjs
      - name: Test 4590 execution authority
        run: timeout 45s node --test tests/phase12/integration/issue-4590-session-proposal-execution-authority.test.mjs
      - name: Test 5085 status ownership
        run: timeout 45s node tests/issue-5085-sandbox-host-status-id-collision.mjs
      - name: Test sandbox host siblings
        run: timeout 60s node tests/userscript-chatgpt-sandbox-host.mjs
      - name: Test 4666 structural identity
        run: timeout 45s node --test tests/phase12/integration/issue-4666-unknown-semantic-detail-deep-freeze.test.mjs
      - name: Syntax lint
        run: timeout 90s node tests/check.mjs

      - name: Commit clean semantic carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/owner11-fresh-carrier.yml .github/owner11-rebase-diagnostic.txt .github/owner11-4590-diagnostic.txt
          git add -A
          git diff --cached --check
          git commit -m "fix(consolidated): refresh owner11 semantics on current main (#5085, #4590, #4666)"
          git push origin HEAD:consolidate/owner11-20260913-2058
