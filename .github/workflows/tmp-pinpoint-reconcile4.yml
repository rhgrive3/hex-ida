name: Temporary pinpoint exact-main reconciliation 4

on:
  push:
    branches:
      - fix/pinpoint-ui-cancellation-stall
    paths:
      - .github/workflows/tmp-pinpoint-reconcile4.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pinpoint-ui-cancellation-stall
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile exact main, regenerate, test, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          echo "Reconciling exact main $main_sha"

          set +e
          git merge --no-commit --no-ff FETCH_HEAD
          merge_rc=$?
          set -e
          if [[ $merge_rc -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ -z "$conflicts" ]]; then
              echo "git merge failed without merge conflicts" >&2
              exit "$merge_rc"
            fi
            unexpected_conflicts="$(printf '%s\n' "$conflicts" | grep -Ev '^(userscript/hex\.user\.template\.js|userscript/release-version\.json)$' || true)"
            if [[ -n "$unexpected_conflicts" ]]; then
              echo 'Unexpected non-generated merge conflicts:' >&2
              printf '%s\n' "$unexpected_conflicts" >&2
              exit 1
            fi
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              git checkout --theirs -- "$file"
              git add -- "$file"
            done <<< "$conflicts"
          fi
          test "$(git rev-parse MERGE_HEAD)" = "$main_sha"

          npm ci
          npm run userscript:build
          git restore --source=HEAD --worktree -- js/userscript/deployment-identity.generated.js

          unexpected_build="$(git diff --name-only | grep -Ev '^(userscript/hex\.user\.template\.js|userscript/release-version\.json)$' || true)"
          if [[ -n "$unexpected_build" ]]; then
            echo 'Canonical build modified unexpected unstaged files:' >&2
            printf '%s\n' "$unexpected_build" >&2
            exit 1
          fi

          node tests/pinpoint-ui-runtime.mjs
          node --check js/ui/pinpoint-runtime.js
          node --check js/panels-base.js
          node tests/panels-compat-surface-base.mjs
          node tests/ir-pinpoint-location.mjs
          node tests/ai-analysis-boundary-base.mjs

          rm -f .github/workflows/tmp-pinpoint-reconcile3.yml .github/workflows/tmp-pinpoint-reconcile4.yml
          git add -A
          git diff --cached --check
          git commit -m "merge: reconcile pinpoint fix with exact current main"
          git merge-base --is-ancestor "$main_sha" HEAD
          echo "Verified main ancestry: $main_sha"
          git push origin HEAD:fix/pinpoint-ui-cancellation-stall
