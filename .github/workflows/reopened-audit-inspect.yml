name: Reopened audit inspection
on:
  push:
    branches: [fix/reopened-audit-contracts-20260830]
    paths:
      - '.github/reopened-audit-inspect.trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reopened-audit-contracts-20260830
          fetch-depth: 0
      - name: Collect target wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          keys = [
            'fieldAccessAcrossExecutableRegions','ensureSchemas','recoverSchemas','globalReferenceStats',
            'ensureObjc','ensureSwift','prepare(app','autoReport','claimRows','loadBaseline',
            'functionsFromSymbols','ensureRecognition','ensureBinaryId','sha256BlobHex','InvestigationService'
          ]
          roots=[Path('js'),Path('tools'),Path('tests')]
          out=[]
          for key in keys:
            out.append(f'===== {key} =====')
            for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                if not p.is_file() or p.suffix not in {'.js','.mjs','.ts'}: continue
                try: lines=p.read_text(errors='replace').splitlines()
                except Exception: continue
                for i,line in enumerate(lines):
                  if key in line:
                    lo=max(0,i-8); hi=min(len(lines),i+16)
                    out.append(f'--- {p}:{i+1} ---')
                    out.extend(f'{j+1:05d}: {lines[j]}' for j in range(lo,hi))
          Path('.github/reopened-audit-inspection.txt').write_text('\n'.join(out))
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/reopened-audit-inspection.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record reopened audit wiring'
          git push origin HEAD:fix/reopened-audit-contracts-20260830
