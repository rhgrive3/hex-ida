name: Stage A SCPA fix verification

on:
  push:
    branches: [diag/stage-a-core-scpa-20260918]
    paths: [.github/workflows/stage-a-core-scpa-diag.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage-a-scpa-balanced-native-flow-20260918
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent --no-audit --no-fund
      - name: Focused SCPA regression
        run: node --test tests/scpa/balanced-native-flow.test.mjs
      - name: Core contract regression
        run: npm run core:test
