name: tmp-review-8908-r5

on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-03-batch-03

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair MethodAccess and blob-content identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('js/managed/cil/metadata-definitions.js')
          s = p.read_text()

          old = "  const METHOD_COMPILER_CONTROLLED = flags => (flags & 0x0080) !== 0;"
          new = "  const METHOD_COMPILER_CONTROLLED = flags => (flags & 0x0007) === 0x0000;"
          if s.count(old) != 1:
              raise SystemExit(f'MethodAccess anchor mismatch: {s.count(old)}')
          s = s.replace(old, new, 1)

          helper_anchor = "  const assertUniqueKeys = (rows, keyOf, code) => {"
          helper = textwrap.dedent("""\
            const sameDefinitionBlob = (left, right) => {
              if (left.length !== right.length) return false;
              for (let i = 0; i < left.length; i++) if (left[i] !== right[i]) return false;
              return true;
            };
            const signatureIdentityBuckets = new Map();
            const assertUniqueSignatureRows = (rows, prefixOf, blobIndexOf, code, blobCode) => {
              for (const row of rows) {
                const prefix = prefixOf(row);
                if (prefix === null) continue;
                if (!blobHeap) fail(blobCode);
                const raw = readCilMetadataBlob(blobHeap, blobIndexOf(row), blobCode);
                // Hash only narrows the exact-byte candidates. A collision never
                // becomes duplicate authority without the byte-for-byte check.
                let hash = 0x811c9dc5;
                for (const byte of raw) hash = Math.imul(hash ^ byte, 0x01000193) >>> 0;
                const bucketKey = `${prefix}\\u0000${raw.length}\\u0000${hash}`;
                const bucket = signatureIdentityBuckets.get(bucketKey);
                if (bucket?.some(previous => sameDefinitionBlob(previous, raw))) fail(code);
                if (bucket) bucket.push(raw);
                else signatureIdentityBuckets.set(bucketKey, [raw]);
              }
            };
          """)
          if s.count(helper_anchor) != 1:
              raise SystemExit(f'identity helper anchor mismatch: {s.count(helper_anchor)}')
          s = s.replace(helper_anchor, helper + helper_anchor, 1)

          start = s.find("  assertUniqueKeys(fields, field =>")
          end = s.find("\n  assertUniqueKeys(events, event =>", start)
          if start < 0 or end < 0:
              raise SystemExit(f'signature identity block anchors missing: start={start} end={end}')
          signature_calls = textwrap.dedent("""\
            assertUniqueSignatureRows(fields,
              field => FIELD_COMPILER_CONTROLLED(field.accessFlags) ? null
                : `F\\u0000${field.declaringTypeToken ?? ''}\\u0000${field.name ?? ''}`,
              field => field.signatureBlobIndex,
              'cil-field-identity-duplicate', 'cil-field-signature-blob-invalid');
            assertUniqueSignatureRows(methods,
              method => METHOD_COMPILER_CONTROLLED(method.accessFlags) ? null
                : `M\\u0000${method.declaringTypeToken ?? ''}\\u0000${method.name ?? ''}`,
              method => method.signatureBlobIndex,
              'cil-methoddef-identity-duplicate', 'cil-method-signature-blob-invalid');
            assertUniqueSignatureRows(properties,
              property => `P\\u0000${property.ownerToken ?? ''}\\u0000${property.name ?? ''}`,
              property => property.typeBlobIndex,
              'cil-property-identity-duplicate', 'cil-property-signature-blob-invalid');
          """)
          # textwrap removes the source's two-space function indentation; restore it.
          signature_calls = ''.join(('  ' + line if line.strip() else line) for line in signature_calls.splitlines(True))
          s = s[:start] + signature_calls.rstrip('\n') + s[end:]
          p.write_text(s)

          p = Path('tests/phase11/cil/issue-8778-cil-definition-identity.test.mjs')
          s = p.read_text()
          marker = "console.log('[phase11] issue #8778 CIL ECMA-335 duplicate-definition identity tests passed');\n"
          extra = textwrap.dedent("""\
          // MethodAccess CompilerControlled is the access-mask value 0 only.
          // Public|HideBySig (0x0086) and Private (0x0001) are ordinary methods.
          for (const flags of [0x0086, 0x0001]) {
            const b = buildCil({
              methods: [
                { name: 'DupMethod', flags, signature: [0x00, 0x00, 0x01], body: [0x2a] },
                { name: 'DupMethod', flags, signature: [0x00, 0x00, 0x01], body: [0x2a] },
              ],
              types: [{ name: 'T', namespace: 'N', fieldList: 1, methodList: 1 }],
              imageSize: 0x6000, metadataSize: 0x5000,
            }).bytes;
            assert.throws(() => rawParse(b, { binaryId: `dupmethod-${flags}` }), /cil-methoddef-identity-duplicate/,
              `duplicate MethodDef identity must fail for access flags 0x${flags.toString(16)}`);
          }

          // Actual CompilerControlled methods (access mask 0) are the exemption.
          {
            const b = buildCil({
              methods: [
                { name: 'CC', flags: 0x0000, signature: [0x00, 0x00, 0x01], body: [0x2a] },
                { name: 'CC', flags: 0x0000, signature: [0x00, 0x00, 0x01], body: [0x2a] },
              ],
              types: [{ name: 'T', namespace: 'N', fieldList: 1, methodList: 1 }],
              imageSize: 0x6000, metadataSize: 0x5000,
            }).bytes;
            assert.doesNotThrow(() => parseCil(b, { binaryId: 'ccmethod' }));
          }

          // Two distinct #Blob offsets with identical MethodDef signature bytes
          // are still the same semantic signature.
          {
            const b = buildCil({
              methods: [
                { name: 'SameSig', flags: 0x0006, signature: [0x00, 0x00, 0x01], body: [0x2a] },
                { name: 'SameSig', flags: 0x0006, signature: [0x00, 0x00, 0x01], body: [0x2a] },
              ],
              types: [{ name: 'T', namespace: 'N', fieldList: 1, methodList: 1 }],
              imageSize: 0x6000, metadataSize: 0x5000,
            }).bytes;
            assert.throws(() => rawParse(b, { binaryId: 'dup-method-content' }), /cil-methoddef-identity-duplicate/);
          }

          // The same content rule applies to fields.
          {
            const b = buildCil({
              methods: [],
              types: [{ name: 'T', namespace: 'N', fieldList: 1, methodList: 1 }],
              fields: [
                { name: 'dupBlobField', flags: 6, signature: [0x06, 0x08] },
                { name: 'dupBlobField', flags: 6, signature: [0x06, 0x08] },
              ],
              imageSize: 0x6000, metadataSize: 0x5000,
            }).bytes;
            assert.throws(() => rawParse(b, { binaryId: 'dup-field-content' }), /cil-field-identity-duplicate/);
          }

          // Property signatures use the same exact-content rule. Each one-byte
          // payload occupies a different #Blob heap entry (offsets 8 and 10).
          {
            const properties = new Uint8Array(12);
            const pv = new DataView(properties.buffer);
            for (const [i, blobIndex] of [8, 10].entries()) {
              pv.setUint16(i * 6, 0, true);
              pv.setUint16(i * 6 + 2, 1, true);
              pv.setUint16(i * 6 + 4, blobIndex, true);
            }
            const propertyMap = new Uint8Array(4);
            const pmv = new DataView(propertyMap.buffer);
            pmv.setUint16(0, 1, true);
            pmv.setUint16(2, 1, true);
            const b = buildCil({
              methods: [], fields: [],
              types: [{ name: 'T', namespace: 'N', fieldList: 1, methodList: 1 }],
              leadingStrings: ['DupProperty'],
              blobs: [[0x08], [0x08]],
              extraRows: new Map([
                [0x15, { count: 1, bytes: propertyMap }],
                [0x17, { count: 2, bytes: properties }],
              ]),
              imageSize: 0x6000, metadataSize: 0x5000,
            }).bytes;
            assert.throws(() => rawParse(b, { binaryId: 'dup-property-content' }), /cil-property-identity-duplicate/);
          }

          """)
          if s.count(marker) != 1:
              raise SystemExit(f'test marker mismatch: {s.count(marker)}')
          p.write_text(s.replace(marker, extra + marker, 1))
          PY

      - name: Verify focused CIL identity regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s node --check js/managed/cil/metadata-definitions.js
          timeout 40s node tests/phase11/cil/issue-8778-cil-definition-identity.test.mjs
          {
            echo '### #8908 R5 repair'
            echo '- MethodAccess access-mask regression: PASS'
            echo '- exact #Blob content identity regression: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit repaired head and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-review-8908-r5.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(review): enforce CIL semantic duplicate identity'
          git push origin HEAD:codex/issue-campaign-20260914-lane-03-batch-03
