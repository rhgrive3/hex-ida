name: One-shot scheduler restack 2947 2948
on:
  push:
    branches: [fix/scheduler-strict-current-2947-2948-v2]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed focused diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/scheduler-strict-boundaries-current-2947-2948
          base=$(git merge-base HEAD origin/fix/scheduler-strict-boundaries-current-2947-2948)
          git diff "$base"..origin/fix/scheduler-strict-boundaries-current-2947-2948 -- js/core/scheduler/analysis-scheduler.js tests/phase4/scheduler/strict-authority-boundaries.test.mjs | git apply --3way
          node tests/phase4/scheduler/strict-authority-boundaries.test.mjs
          node tests/phase4/run.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/core/scheduler/analysis-scheduler.js tests/phase4/scheduler/strict-authority-boundaries.test.mjs
          git diff --cached --quiet || git commit -m 'fix(scheduler): harden identity and abort boundaries'
          git push
