name: Integrator B reconcile #8512

on:
  push:
    branches:
      - fixer2/issue-3961-dynsym-fallback
    paths:
      - .github/workflows/integrator-b-8512-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fixer2/issue-3961-dynsym-fallback
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact tuple, reconcile, and validate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_H0=50a6c430340de5bc606b35bbfa3591827b667006
          EXPECTED_B0=fe8c10cce2cd0de6860daf7792f22acd3316d338
          WORKFLOW=.github/workflows/integrator-b-8512-reconcile.yml
          git merge-base --is-ancestor "$EXPECTED_H0" HEAD
          test "$(git diff --name-only "$EXPECTED_H0" HEAD)" = "$WORKFLOW"
          git fetch --no-tags origin "main:refs/remotes/origin/main"
          test "$(git rev-parse origin/main)" = "$EXPECTED_B0"
          git merge --no-commit --no-ff "$EXPECTED_B0"
          rm "$WORKFLOW"
          git add -A
          test "$(git diff --cached --name-only "$EXPECTED_B0" | sort)" = $'js/binary/elf-core.js\ntests/phase4/binary/issue-3961-elf-malformed-dynsym-fallback.test.mjs'
          test "$(git hash-object tests/phase4/binary/issue-3961-elf-malformed-dynsym-fallback.test.mjs)" = "3c347ed1e9bb42fda2ace6f5f2f45eaa388146a6"
          read -r add del path < <(git diff --cached --numstat "$EXPECTED_B0" -- js/binary/elf-core.js)
          test "$add" = 87 && test "$del" = 16 && test "$path" = js/binary/elf-core.js
          read -r add del path < <(git diff --cached --numstat "$EXPECTED_B0" -- tests/phase4/binary/issue-3961-elf-malformed-dynsym-fallback.test.mjs)
          test "$add" = 164 && test "$del" = 0 && test "$path" = tests/phase4/binary/issue-3961-elf-malformed-dynsym-fallback.test.mjs
          git diff --cached --check
          node --check js/binary/elf-core.js
          node --check tests/phase4/binary/issue-3961-elf-malformed-dynsym-fallback.test.mjs
          node tests/phase4/binary/issue-3961-elf-malformed-dynsym-fallback.test.mjs
          node tests/phase4/binary/issue-3835-elf-dynamic-string-table.test.mjs
          node tests/phase4/binary/issue-3845-elf-dynamic-hash-mapping.test.mjs
          node tests/universal-binary-sectionless.mjs
          node tests/binary-platform.mjs
          node tests/issue-4096-elf-header-table-presence.mjs
          npm run binary:test
          npm run binary:gate
          npm run lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(integrator-b): reconcile #8512 with current main"
      - name: Push reconciled branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "HEAD:fixer2/issue-3961-dynsym-fallback"
