name: diag-7036-reconcile-main
on:
  push:
    branches:
      - reconcile/7036-main-75eb8e78
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile and validate current main
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/reconcile-7036.txt
          : > "$STATUS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          fail_tail() {
            label="$1"; file="$2"; rc="$3"
            echo "$label rc=$rc" >> "$STATUS"
            echo "--- $label first failure ---" >> "$STATUS"
            tail -n 80 "$file" >> "$STATUS"
            exit "$rc"
          }

          timeout 90s git fetch --no-tags origin main >/tmp/fetch.log 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || fail_tail fetch /tmp/fetch.log "$rc"
          echo 'fetch rc=0' >> "$STATUS"
          MAIN=$(git rev-parse refs/remotes/origin/main)
          echo "main=$MAIN" >> "$STATUS"
          echo "head_before=$(git rev-parse HEAD)" >> "$STATUS"

          git merge --no-edit --no-ff refs/remotes/origin/main >/tmp/merge.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "merge rc=$rc" >> "$STATUS"
            echo 'conflicts:' >> "$STATUS"
            git diff --name-only --diff-filter=U >> "$STATUS"
            echo "conflict_count=$(git diff --name-only --diff-filter=U | wc -l)" >> "$STATUS"
            tail -n 40 /tmp/merge.log >> "$STATUS"
            exit "$rc"
          fi
          echo 'merge rc=0' >> "$STATUS"

          git rm .github/workflows/diag-7036-reconcile-main.yml >/tmp/rm.log 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || fail_tail remove_diag /tmp/rm.log "$rc"
          git commit --amend --no-edit >/tmp/amend.log 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || fail_tail amend /tmp/amend.log "$rc"
          CLEAN=$(git rev-parse HEAD)
          echo "clean_head=$CLEAN" >> "$STATUS"

          git diff --check "$MAIN...$CLEAN" >/tmp/diffcheck.log 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || fail_tail diff_check /tmp/diffcheck.log "$rc"
          echo 'diff_check rc=0' >> "$STATUS"

          LOGICAL_BRANCH=feat/analysis-roadmap-v8-current-main-20260907
          timeout 120s node tools/validation/phase7-ownership.mjs --check-manifest >/tmp/p7m.log 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || fail_tail p7_manifest /tmp/p7m.log "$rc"
          timeout 120s node tools/validation/analysis-roadmap/ownership.mjs --branch "$LOGICAL_BRANCH" --phase phase7 --base-sha "$MAIN" --head-sha "$CLEAN" >/tmp/p7.json 2>/tmp/p7i.log
          rc=$?
          [ "$rc" -eq 0 ] || fail_tail p7_inventory /tmp/p7i.log "$rc"
          P7=$(cat /tmp/p7.json)
          timeout 120s node tools/validation/phase7-ownership.mjs --files-json "$P7" >/tmp/p7v.log 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || fail_tail p7_validate /tmp/p7v.log "$rc"
          echo 'phase7=pass' >> "$STATUS"

          timeout 120s node tools/validation/phase8-ownership.mjs --check-manifest >/tmp/p8m.log 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || fail_tail p8_manifest /tmp/p8m.log "$rc"
          timeout 120s node tools/validation/analysis-roadmap/ownership.mjs --branch "$LOGICAL_BRANCH" --phase phase8 --base-sha "$MAIN" --head-sha "$CLEAN" >/tmp/p8.json 2>/tmp/p8i.log
          rc=$?
          [ "$rc" -eq 0 ] || fail_tail p8_inventory /tmp/p8i.log "$rc"
          P8=$(cat /tmp/p8.json)
          timeout 120s node tools/validation/phase8-ownership.mjs --files-json "$P8" >/tmp/p8v.log 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || fail_tail p8_validate /tmp/p8v.log "$rc"
          echo 'phase8=pass' >> "$STATUS"

          git push origin HEAD:reconcile/7036-main-75eb8e78 >/tmp/push.log 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || fail_tail push /tmp/push.log "$rc"
          echo 'push=pass' >> "$STATUS"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-reconcile-main
          path: /tmp/reconcile-7036.txt
          retention-days: 1
