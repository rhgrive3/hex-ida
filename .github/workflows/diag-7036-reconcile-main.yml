name: diag-7036-reconcile-main
on:
  push:
    branches:
      - reconcile/7036-main-75eb8e78
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact conflict hunks
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/reconcile-7036.txt
          PATCH=/tmp/reconcile-7036-conflicts.patch
          : > "$STATUS"
          : > "$PATCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          timeout 90s git fetch --no-tags origin main >/tmp/fetch.log 2>&1
          rc=$?
          echo "fetch rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/fetch.log >> "$STATUS"; exit "$rc"; fi
          MAIN=$(git rev-parse refs/remotes/origin/main)
          echo "main=$MAIN" >> "$STATUS"
          echo "head_before=$(git rev-parse HEAD)" >> "$STATUS"
          git merge --no-edit --no-ff refs/remotes/origin/main >/tmp/merge.log 2>&1
          rc=$?
          echo "merge rc=$rc" >> "$STATUS"
          mapfile -t files < <(git diff --name-only --diff-filter=U)
          echo "conflict_count=${#files[@]}" >> "$STATUS"
          printf '%s\n' "${files[@]}" >> "$STATUS"
          if [ "$rc" -eq 0 ]; then echo 'unexpected_clean_merge=true' >> "$STATUS"; exit 1; fi
          for f in "${files[@]}"; do
            echo "===== $f =====" >> "$PATCH"
            git diff --cc --unified=8 -- "$f" >> "$PATCH"
          done
          head -n 1600 "$PATCH" > /tmp/reconcile-7036-conflicts.bounded.patch
          exit 1
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-7036-reconcile-main
          path: |
            /tmp/reconcile-7036.txt
            /tmp/reconcile-7036-conflicts.bounded.patch
          retention-days: 1
