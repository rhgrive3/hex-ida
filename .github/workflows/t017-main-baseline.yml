name: T017 current-main closure baseline

on:
  push:
    branches:
      - recovery/t017-machine-effects-20260917
    paths:
      - .github/workflows/t017-main-baseline.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Run current-main closure matrix only
        shell: bash
        run: |
          set +e
          node --test tests/machine-effects/x86-long64-closure-matrix.test.mjs > /tmp/t017-main-baseline.out 2>&1
          status=$?
          tail -n 100 /tmp/t017-main-baseline.out > /tmp/t017-main-baseline-summary.txt
          cat /tmp/t017-main-baseline-summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload minimal baseline evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: t017-main-baseline-first-failure
          path: /tmp/t017-main-baseline-summary.txt
          if-no-files-found: error
          retention-days: 1
