name: CF credential presence diagnostic
on:
  push:
    branches: [diag/cf-credential-presence]
    paths:
      - .github/workflows/cf-credential-presence-diagnostic.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record presence only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          set -euo pipefail
          : > credential-presence.txt
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_API_TOKEN CF_ACCOUNT_ID CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL; do
            if [[ -n "${!name:-}" ]]; then echo "${name}=present"; else echo "${name}=absent"; fi
          done > credential-presence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cf-credential-presence-diagnostic
          path: credential-presence.txt
          retention-days: 1
