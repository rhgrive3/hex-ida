        run: |
          set -euo pipefail
          git fetch origin fix/issue-4884-owner7 --depth=1
          git show FETCH_HEAD:tests/issue-4884-managed-bridge-multi-call-effects.mjs > tests/issue-4884-managed-bridge-multi-call-effects.mjs
          mkdir -p tests/phase11/shared
          printf "import '../../issue-4884-managed-bridge-multi-call-effects.mjs';\n" > tests/phase11/shared/issue-4884-managed-bridge-multi-call-effects.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/managed/shared/bridge-lowering-v2.js')
          s=p.read_text()
          assert 'B(t.startOffset),B(t.endOffset),B(t.handlerOffset)' in s, 'owner7 EH split missing before reconcile'
          if 'const ht=(e,a,z,x)=>' not in s:
              needle='const le=(t,r)=>{let o=t?.effectSummary||null;return!o&&typeof p.callSummaryResolver==="function"&&(o=p.callSummaryResolver(t,r,f)||null),!o&&p.callSummaries&&t?.target!=null&&(o=p.callSummaries instanceof Map?p.callSummaries.get(String(t.target)):p.callSummaries[String(t.target)]),!o||o.completeness!=="complete"?null:o};'
