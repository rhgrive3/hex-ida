              ht='const ht=(e,a,z,x)=>a?se({targetEntityIds:e?.target?[String(e.target)]:[],arguments:z,returns:x,memoryRead:a.memoryRead??{scope:"none"},memoryWrite:a.memoryWrite??{scope:"none"},stateReads:a.stateReads??[],stateWrites:a.stateWrites??[],controlEffects:a.controlEffects??[],determinism:a.determinism??"input-dependent",noreturn:a.noreturn??!1,mayThrow:a.mayThrow??!1,summarySource:a.summarySource??`managed-call-summary:${y}`,completeness:"complete"}):se({targetEntityIds:e?.target?[String(e.target)]:[],arguments:z,returns:x,memoryRead:{scope:"all",addressSpaces:["memory"]},memoryWrite:{scope:"all",addressSpaces:["memory"]},determinism:"unknown",noreturn:"unknown",mayThrow:"unknown",summarySource:`vm-effect-${y}`,completeness:"partial",unknownEffects:{reason:`managed-call-effects-unresolved:${e?.dispatchKind||"unknown"}`,categories:["calls","memory"]}});'
              s=s.replace(needle, needle+ht, 1)
              start=s.index('if(d==="call"&&n.callEffects?.[0]){')
              end=s.index('if((d==="load"||d==="store")&&n.memoryEffects?.[0]){', start)
              replacement='let Ct=null;if(d==="call"&&n.callEffects?.[0]){Ct=n.callEffects.map((e)=>[e,le(e,n)]),O.call=ht(Ct[0][0],Ct[0][1],z,x);for(const[e,a]of Ct)a||(V="partial",O.completeness="partial",O.unknown={reason:"managed-call-effects-unresolved",categories:["calls","memory"]},w.add("managed-call-effects-unresolved"))}'
              s=s[:start]+replacement+s[end:]
              marker='const ee=D(O);C.push(ee),o.push(ee.id);'
              assert marker in s
              extra='if(Ct&&Ct.length>1)for(let e=1;e<Ct.length;e++){const[a,sm]=Ct[e],rv=sm&&V==="complete",N=D({id:`node_${++A}`,blockId:t,kind:"call",inputs:z,outputs:[],call:ht(a,sm,z,[]),origin:s,sourceEffectIds:[n.operationId],completeness:rv?"complete":"partial",unknown:rv?null:(O.unknown??{reason:"managed-call-effects-unresolved",categories:["calls","memory"]}),metadata:Object.assign({},O.metadata,{callEffectIndex:e,callEffectCount:Ct.length,dispatchKind:a?.dispatchKind??null,targetUnresolved:a?.unresolved===!0})});C.push(N),o.push(N.id)}'
              s=s.replace(marker, marker+extra, 1)
              p.write_text(s)
          PY
          node --check js/managed/shared/bridge-lowering-v2.js
          node tests/issue-4884-managed-bridge-multi-call-effects.mjs
          node tests/issue-4837-exception-region-boundary-split.mjs
          node tests/phase11/shared/bridge.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/managed/shared/bridge-lowering-v2.js tests/issue-4884-managed-bridge-multi-call-effects.mjs tests/phase11/shared/issue-4884-managed-bridge-multi-call-effects.test.mjs
          git rm .github/workflows/tmp-owner7-reconcile.yml
          git commit -m 'batch(owner-7): reconcile #8295 multi-call lowering'
          git push origin HEAD:batch-20260912-owner7
