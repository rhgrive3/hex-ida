name: tmp-review-8909-r6

on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-07-batch-02

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply Rust budget repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/metadata/rust.js)" = "62e0898af984814607d2d491bb5c5c8a93acfcb4"
          test "$(git hash-object tests/phase12/metadata/issue-8655-rust-punycode-work-budget.test.mjs)" = "817862e6bad138bf160bef3449fe15fb5ab682ef"
          test "$(git hash-object tests/phase12/metadata/issue-8766-rust-v0-backref-output-budget.test.mjs)" = "c3fd6ae29773de03f2978e9d73f43e230c3617e1"
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          rust_b64 = ''''''
          Path('js/metadata/rust.js').write_bytes(gzip.decompress(base64.b64decode(rust_b64)))

          p = Path('tests/phase12/metadata/issue-8655-rust-punycode-work-budget.test.mjs')
          s = p.read_text()
          marker = '#8655 review aggregate splice ceiling is enforced inside first symbol'
          if marker in s:
              raise SystemExit('unexpected pre-existing #8655 review regression')
          s += "\n\ntest('#8655 review aggregate splice ceiling is enforced inside first symbol', () => {\n  const { name } = frontInsertSymbol(4);\n  assert.equal(demangleRustV0(name).parsed, true);\n  const bounded = new RustMetadataProvider({\n    symbols: [{ name, address: 0x1000n }],\n    binaryIdentity: 'sha256:agg-hard',\n    options: { rustDemangle: { aggregateMaxSpliceWork: 1 } },\n  }).probe();\n  assert.equal(bounded.counts.symbols, 0);\n  assert.equal(bounded.completeness.complete, false);\n  assert.equal(bounded.completeness.capped, true);\n});\n"
          p.write_text(s)

          p = Path('tests/phase12/metadata/issue-8766-rust-v0-backref-output-budget.test.mjs')
          s = p.read_text()
          marker = '#8766 output ceiling never overshoots'
          if marker in s:
              raise SystemExit('unexpected pre-existing #8766 review regression')
          s += "\n\ntest('#8766 output ceiling never overshoots', () => {\n  const result = demangleRustV0('_R' + P(14), 40, { maxOutputChars: 64 });\n  assert.equal(result.parsed, false);\n  assert.equal(result.reason, 'v0-resource-budget-exceeded');\n  assert.equal(result.resourceLimited, true);\n  assert.ok(result.stats.outputChars <= 64, `overshot ${result.stats.outputChars}`);\n});\n\ntest('#8766 review generic composition is rejected within ceiling', () => {\n  const symbol = '_RINvC4core3foo' + 'a'.repeat(32) + 'E';\n  const result = demangleRustV0(symbol, 40, { maxOutputChars: 32 });\n  assert.equal(result.parsed, false);\n  assert.equal(result.reason, 'v0-resource-budget-exceeded');\n  assert.equal(result.resourceLimited, true);\n  assert.ok(result.stats.outputChars <= 32, `overshot ${result.stats.outputChars}`);\n});\n"
          p.write_text(s)
          PY

      - name: Verify focused Rust regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s node --check js/metadata/rust.js
          timeout 60s node --test \
            tests/phase12/metadata/issue-8655-rust-punycode-work-budget.test.mjs \
            tests/phase12/metadata/issue-8766-rust-v0-backref-output-budget.test.mjs
          timeout 60s node tests/check.mjs
          {
            echo '### #8909 R6 repair'
            echo '- aggregate budget enforced inside first symbol: PASS'
            echo '- render/output accounting is pre-allocation and non-overshooting: PASS'
            echo '- focused Rust regressions + syntax: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit repaired head and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-review-8909-r6.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(review): enforce Rust resource ceilings before work'
          git push origin HEAD:codex/issue-campaign-20260914-lane-07-batch-02
