name: fixer2-issue-8150-apply
on:
  push:
    branches:
      - fixer2/issue-8150-tlv-init
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix(binary): recover Mach-O TLV initializers') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixer2/issue-8150-tlv-init
          fetch-depth: 1
      - name: Verify, patch, and test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/binary/macho-core.js)" = "5d284bcb8d821d44545b5c57ce52591df72bc4c1"
          test "$(git hash-object tests/phase4/binary/issue-8150-macho-tlv-init.test.mjs)" = "c6908c20952a829dcf2e65a6243a5029827ffaf9"
          cat >/tmp/issue8150.patch <<'PATCH'
          --- a/js/binary/macho-core.js
          +++ b/js/binary/macho-core.js
          @@ -5,6 +5,7 @@
           import { validateFatSlice, validateFatContainer, probePastEndArm64SliceSync, parseInnerMachOHeader } from './macho-fat.js';
           
           const S_MOD_INIT_FUNC_POINTERS = 0x9;
          +const S_THREAD_LOCAL_INIT_FUNCTION_POINTERS = 0x15;
           
           export const DICE_KIND_DATA = 1;
           export const DICE_KIND_JUMP_TABLE8 = 2;
          @@ -228,7 +229,7 @@
               if (!linkeditData.exportsTrie && info.export.size) parseExportTrie(r, info.export, image, metadataBudget);
             }
             if (linkeditData.exportsTrie) parseExportTrie(r, linkeditData.exportsTrie, image, metadataBudget);
          -  parseModInitFunctions(r, image, bits, metadataBudget);
          +  parseLifecycleFunctionPointers(r, image, bits, metadataBudget);
           
             const namesByAddr = new Map();
             const nameIndexEntries = image.symbols.length + image.exports.length;
          @@ -919,11 +920,13 @@
             status.recovered = ranges.length;
           }
           
          -function parseModInitFunctions(r, image, bits, metadataBudget) {
          -  const modInitSections = image.sections.filter((s) => (s.flags & 0xff) === S_MOD_INIT_FUNC_POINTERS);
          -  if (modInitSections.length === 0) return;
          +function parseLifecycleFunctionPointers(r, image, bits, metadataBudget) {
          +  const lifecycleSections = image.sections.filter((s) => {
          +    const sectionType = s.flags & 0xff;
          +    return sectionType === S_MOD_INIT_FUNC_POINTERS || sectionType === S_THREAD_LOCAL_INIT_FUNCTION_POINTERS;
          +  });
          +  if (lifecycleSections.length === 0) return;
           
          -  image.metadata.initializers ||= [];
             const ptrSize = bits === 64 ? 8 : 4;
             const ptrSizeBig = BigInt(ptrSize);
             const arch = image.arch;
          @@ -931,10 +934,17 @@
             const instructionBytes = (arch === 'arm64' || arch === 'arm64e' || arch === 'arm64_32') ? 4n : arch === 'arm' ? 2n : 1n;
             const recoveredTargets = new Set();
           
          -  for (const sec of modInitSections) {
          +  for (const sec of lifecycleSections) {
          +    const isTlvInitializer = (sec.flags & 0xff) === S_THREAD_LOCAL_INIT_FUNCTION_POINTERS;
          +    const metadataKey = isTlvInitializer ? 'tlvInitializers' : 'initializers';
          +    const budgetComponent = isTlvInitializer ? 'tlv-init' : 'mod-init';
          +    const lifecycleLabel = isTlvInitializer ? 'TLV initializer' : 'constructor';
          +    const sectionTypeName = isTlvInitializer ? 'S_THREAD_LOCAL_INIT_FUNCTION_POINTERS' : 'S_MOD_INIT_FUNC_POINTERS';
          +    image.metadata[metadataKey] ||= [];
          +
               if (sec.size % ptrSizeBig !== 0n) {
                 metadataBudget.partial(
          -        'mod-init:truncated-section',
          +        `${budgetComponent}:truncated-section`,
                   `Mach-O section ${sec.name} size ${sec.size} is not a multiple of pointer width ${ptrSize}`,
                 );
               }
          @@ -947,24 +957,25 @@
               const safeCount = Math.min(count, Math.floor(fileAvailable / ptrSize));
               if (safeCount < count) {
                 metadataBudget.partial(
          -        'mod-init:file-truncated',
          +        `${budgetComponent}:file-truncated`,
                   `Mach-O section ${sec.name} file data is truncated or zero-fill`,
                 );
               }
           
               for (let i = 0; i < safeCount; i++) {
          -      if (!metadataBudget.take({ inputBytes: ptrSize, records: 1, objects: 1, operations: 1, estimatedHeapBytes: 64 }, 'mod-init')) {
          +      if (!metadataBudget.take({ inputBytes: ptrSize, records: 1, objects: 1, operations: 1, estimatedHeapBytes: 64 }, budgetComponent)) {
                   break;
                 }
                 const slotVa = sec.address + BigInt(i * ptrSize);
                 const slotFileOff = secFileOffset + i * ptrSize;
                 const raw = bits === 64 ? r.u64(slotFileOff) : BigInt(r.u32(slotFileOff));
           
          -      // Resolve under Mach-O pointer/rebase/chained-fixup authority
          +      // Both section kinds contain native pointers. Keep chained-fixup/rebase
          +      // ownership authoritative instead of interpreting encoded words as VAs.
                 const resolved = resolveMachOPointer(image, raw, { address: slotVa });
           
                 let isValid = false;
          -      let target = resolved;
          +      const target = resolved;
                 let failureReason = null;
           
                 if (target == null) {
          @@ -989,8 +1000,7 @@
                   }
                 }
               }
           
          -      // Record in metadata
          -      image.metadata.initializers.push({
          +      image.metadata[metadataKey].push({
                 address: target,
                 raw,
                 slotAddress: slotVa,
          @@ -1006,13 +1016,14 @@
                     source: 'constructor',
                     confidence: 0.95,
                     exactFunctionStart: true,
          -          functionStartEvidence: 'Mach-O S_MOD_INIT_FUNC_POINTERS loader-invoked constructor in validated executable mapping with file-backed instruction bytes',
          +          functionStartEvidence: `Mach-O ${sectionTypeName} loader-invoked ${lifecycleLabel} in validated executable mapping with file-backed instruction bytes`,
          +          ...(isTlvInitializer ? { abiMetadata: { machoLifecycle: 'tlv-initializer' } } : {}),
                   }));
                 }
               } else {
                 metadataBudget.partial(
          -        `mod-init:${failureReason}`,
          -        `Ignored Mach-O constructor pointer at 0x${slotVa.toString(16)} (raw 0x${raw.toString(16)}): ${failureReason}`,
          +        `${budgetComponent}:${failureReason}`,
          +        `Ignored Mach-O ${lifecycleLabel} pointer at 0x${slotVa.toString(16)} (raw 0x${raw.toString(16)}): ${failureReason}`,
                 );
               }
             }
          PATCH
          git apply --check /tmp/issue8150.patch
          git apply /tmp/issue8150.patch
          test "$(git hash-object js/binary/macho-core.js)" = "7fc46a2795cb4618a048b30021cda2544ae805d9"
          node --check js/binary/macho-core.js
          node --test tests/phase4/binary/issue-8150-macho-tlv-init.test.mjs tests/phase4/binary/issue-8118-macho-mod-init.test.mjs
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rhgrive3"
          git config user.email "rhgrive@gmail.com"
          git rm .github/workflows/fixer2-issue-8150-apply.yml
          git add js/binary/macho-core.js tests/phase4/binary/issue-8150-macho-tlv-init.test.mjs
          git commit -m "fix(binary): recover Mach-O TLV initializers (#8150)"
          git push origin HEAD:fixer2/issue-8150-tlv-init
