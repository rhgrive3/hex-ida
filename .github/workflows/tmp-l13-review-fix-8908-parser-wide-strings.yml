name: tmp-l13-review-fix-8908-parser-wide-strings
on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-03-batch-03
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-campaign-20260914-lane-03-batch-03
          fetch-depth: 0
      - name: Guard exact reviewed head and base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "de104f410822c75ba8b895561fe917a66185b3d0"
          timeout 30s git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "86cb8a1a36a2eecb205be43ecacd4c9cafefebaf"
      - name: Apply parser-wide string and definition reuse repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          helper = Path('js/managed/cil/metadata-string-cache.js')
          if helper.exists():
              raise SystemExit('metadata-string-cache.js already exists on guarded head')
          helper.write_text('''// #8699: one exact #Strings interning authority per aggregate metadata budget.
          // The budget object is parse-scoped; the backing buffer/view and stream range
          // keep unrelated heaps separate while allowing later readers/overlays to reuse
          // the same exact heap offsets without re-decoding or re-charging them.
          const cachesByBudget = new WeakMap();

          function isObjectKey(value) {
            return value !== null && (typeof value === 'object' || typeof value === 'function');
          }

          export function cilStringCacheFor(budget, bytes, stringsStream) {
            if (!isObjectKey(budget) || !isObjectKey(bytes?.buffer) || stringsStream == null) return new Map();
            let byBuffer = cachesByBudget.get(budget);
            if (byBuffer == null) {
              byBuffer = new WeakMap();
              cachesByBudget.set(budget, byBuffer);
            }
            let byRange = byBuffer.get(bytes.buffer);
            if (byRange == null) {
              byRange = new Map();
              byBuffer.set(bytes.buffer, byRange);
            }
            const key = `${bytes.byteOffset ?? 0}:${bytes.byteLength ?? bytes.length ?? 0}:${stringsStream.offset}:${stringsStream.size}`;
            let cache = byRange.get(key);
            if (cache == null) {
              cache = new Map();
              byRange.set(key, cache);
            }
            return cache;
          }
          ''')

          replace_once(
              'js/managed/cil/metadata-definitions.js',
              "import { stableStringify } from '../../core/identity/index.js';\n",
              "import { stableStringify } from '../../core/identity/index.js';\n"
              "import { cilStringCacheFor } from './metadata-string-cache.js';\n",
          )
          replace_once(
              'js/managed/cil/metadata-definitions.js',
              "  const textCache = new Map();\n",
              "  const textCache = cilStringCacheFor(budget, bytes, stringsStream);\n",
          )

          replace_once(
              'js/managed/cil/metadata-generics.js',
              "import { codedIndexSize, tableIndexSize, cilMetadataToken } from './metadata-layout.js';\n",
              "import { codedIndexSize, tableIndexSize, cilMetadataToken } from './metadata-layout.js';\n"
              "import { cilStringCacheFor } from './metadata-string-cache.js';\n",
          )
          replace_once(
              'js/managed/cil/metadata-generics.js',
              "  const textCache = new Map();\n",
              "  const textCache = cilStringCacheFor(budget, bytes, stringsStream);\n",
          )

          replace_once(
              'js/managed/cil/metadata-manifest-security.js',
              "import { CLI_HEADER_SIZE, validateCliHeaderSize } from './cli-header.js';\n",
              "import { CLI_HEADER_SIZE, validateCliHeaderSize } from './cli-header.js';\n"
              "import { cilStringCacheFor } from './metadata-string-cache.js';\n",
          )
          replace_once(
              'js/managed/cil/metadata-manifest-security.js',
              "  const textCache = new Map();\n",
              "  const textCache = cilStringCacheFor(budget, bytes, stringsStream);\n",
          )
          replace_once(
              'js/managed/cil/metadata-manifest-security.js',
              "  const defs = readCilDefinitions(u8, view, layout, stringsStream, blobStream, guidStream, budget);\n"
              "  const extra = readManifestSecurity(u8, view, layout, stringsStream, blobStream, defs, budget);\n",
              "  // Public parse has already materialized and validated TypeDef/MethodDef in\n"
              "  // overlayCilMetadata(). Reuse that canonical authority instead of charging\n"
              "  // and retaining every definition row a second time. Standalone callers that\n"
              "  // pass a base parse (which has no runtimeVersion field) retain the old path.\n"
              "  const defs = Object.prototype.hasOwnProperty.call(parsed, 'runtimeVersion')\n"
              "    && Array.isArray(parsed.types) && Array.isArray(parsed.methods)\n"
              "    ? { types: parsed.types, methods: parsed.methods }\n"
              "    : readCilDefinitions(u8, view, layout, stringsStream, blobStream, guidStream, budget);\n"
              "  const extra = readManifestSecurity(u8, view, layout, stringsStream, blobStream, defs, budget);\n",
          )

          test_path = Path('tests/phase11/cil/issue-8699-cil-metadata-string-alias-budget.test.mjs')
          test_text = test_path.read_text()
          anchor = "\n// Correctness: distinct field names must still decode losslessly and stay distinct.\n"
          if test_text.count(anchor) != 1:
              raise SystemExit(f'cross-reader fixture anchor count={test_text.count(anchor)}')
          fixture = r'''
          function crossReaderAliasFixture(n = 4, nameLen = 2048) {
            const shared = 'x'.repeat(nameLen);
            const pre = buildCil({
              methods: [],
              types: [{ name: 'placeholder-owner', namespace: '', flags: 1, fieldList: 1, methodList: 1 }],
              leadingStrings: [shared],
            });
            const nameOff = pre.layout.leadingStringIndex[shared];
            const rows = new Uint8Array(n * 8);
            const v = new DataView(rows.buffer);
            for (let i = 0; i < n; i++) {
              const p = i * 8;
              v.setUint16(p, i, true);
              v.setUint16(p + 2, 0, true);
              v.setUint16(p + 4, 2, true); // TypeDef rid 1, tag 0
              v.setUint16(p + 6, nameOff, true);
            }
            const built = buildCil({
              methods: [],
              types: [{ name: 'placeholder-owner', namespace: '', flags: 1, fieldList: 1, methodList: 1 }],
              leadingStrings: [shared],
              extraRows: new Map([[0x2a, { count: n, bytes: rows }]]),
            });
            // Point TypeDef.Name at the same exact first leading #Strings offset used by
            // every GenericParam. The unreferenced placeholder remains in the heap so the
            // test checks reference accounting, not whole-heap content.
            const tablesStream = built.layout.streams.find(stream => stream.name === '#~' || stream.name === '#-');
            const typeDefPos = tablesStream.offset + built.layout.tables.offsets.get(0x02);
            new DataView(built.bytes.buffer, built.bytes.byteOffset, built.bytes.byteLength)
              .setUint16(typeDefPos + 4, nameOff, true);
            return built.bytes;
          }
          '''
          test_text = test_text.replace(anchor, '\n' + fixture + anchor, 1)
          anchor2 = "\n// GenericParam duplicate-number detection must remain exact with the Set.\n"
          if test_text.count(anchor2) != 1:
              raise SystemExit(f'cross-reader test anchor count={test_text.count(anchor2)}')
          regression = r'''
          // #8699: the aggregate parse budget owns exact #Strings interning across
          // definitions and GenericParam readers. The one 2 KiB referenced heap entry is
          // admitted once, not once per reader.
          {
            const image = parseCil(crossReaderAliasFixture(), {
              binaryId: 'parser-wide-string-cache',
              resourceBudget: { maxStrings: 1, maxStringBytes: 2048 },
            });
            assert.equal(image.types[0].name.length, 2048);
            assert.equal(image.genericParams.length, 4);
            assert.ok(image.genericParams.every(row => row.name === image.types[0].name));
          }

          // The public metadata + manifest pipeline must likewise charge each canonical
          // retained definition row once. One TypeDef + four GenericParam rows is exactly
          // five rows; reconstructing TypeDef for manifest/security would exceed this.
          {
            const image = parseCil(crossReaderAliasFixture(), {
              binaryId: 'parser-wide-row-reuse',
              resourceBudget: { maxRows: 5 },
            });
            assert.equal(image.types.length, 1);
            assert.equal(image.genericParams.length, 4);
          }
          '''
          test_path.write_text(test_text.replace(anchor2, '\n' + regression + anchor2, 1))
          PY
      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            js/managed/cil/metadata-string-cache.js \
            js/managed/cil/metadata-definitions.js \
            js/managed/cil/metadata-generics.js \
            js/managed/cil/metadata-manifest-security.js \
            tests/phase11/cil/issue-8699-cil-metadata-string-alias-budget.test.mjs; do
            timeout 10s node --check "$f"
          done
      - name: Focused CIL validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node tests/phase11/cil/issue-8699-cil-metadata-string-alias-budget.test.mjs
          timeout 90s node tests/phase11/cil/issue-8699-8797-public-parse-single-pass.test.mjs
          timeout 60s node tests/phase11/cil/issue-8699-retained-row-heap-budget.test.mjs
          timeout 90s node tests/phase11/cil/issue-8797-cil-exportedtype-resolution-budget.test.mjs
          timeout 90s node tests/phase11/cil/issue-8778-cil-definition-identity.test.mjs
      - name: Commit repair and remove transport
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/issue-campaign-20260914-lane-03-batch-03'
          transport_head="$(git rev-parse HEAD)"
          remote_head="$(timeout 20s git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$transport_head"
          timeout 30s git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "86cb8a1a36a2eecb205be43ecacd4c9cafefebaf"
          rm .github/workflows/tmp-l13-review-fix-8908-parser-wide-strings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/managed/cil/metadata-string-cache.js \
            js/managed/cil/metadata-definitions.js \
            js/managed/cil/metadata-generics.js \
            js/managed/cil/metadata-manifest-security.js \
            tests/phase11/cil/issue-8699-cil-metadata-string-alias-budget.test.mjs \
            .github/workflows/tmp-l13-review-fix-8908-parser-wide-strings.yml
          git commit -m "fix(cil): share metadata string cache across parse"
          remote_head="$(timeout 20s git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$transport_head"
          timeout 30s git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "86cb8a1a36a2eecb205be43ecacd4c9cafefebaf"
          timeout 30s git push origin HEAD:"$branch"
