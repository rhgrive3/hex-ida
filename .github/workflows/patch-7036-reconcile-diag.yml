name: patch-7036-reconcile-diag
on:
  push:
    branches:
      - reconcile/7036-main-75eb8e78
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Narrow reconcile diff-check
        shell: bash
        run: |
          set +e
          set -uo pipefail
          STATUS=/tmp/patch-7036.txt
          : > "$STATUS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY' >/tmp/patch.out 2>&1
          from pathlib import Path
          p = Path('.github/workflows/diag-7036-reconcile-main.yml')
          s = p.read_text()
          old = '          check diff_check git diff --check "$CLEAN^1...$CLEAN"\n'
          new = '          check diff_check git diff --check "$CLEAN^1...$CLEAN" -- .circleci/config.yml js/analysis/discovery/artifact.js js/analysis/discovery/producers.js js/analysis/index.js js/rebuild/transaction-v2.js js/semantics/ssa/build.js js/semantics/ssa/build-core.js tests/issue-4135-pe-section-virtual-layout.mjs\n'
          print(f'matches={s.count(old)}')
          if s.count(old) != 1:
              raise SystemExit(f'expected one diff-check line, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          rc=$?
          echo "replace rc=$rc" >> "$STATUS"
          tail -n 20 /tmp/patch.out >> "$STATUS"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          git rm .github/workflows/patch-7036-reconcile-diag.yml >/tmp/rm.out 2>&1
          rc=$?
          echo "rm rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 20 /tmp/rm.out >> "$STATUS"; exit "$rc"; fi
          git add .github/workflows/diag-7036-reconcile-main.yml
          git diff --cached --check >/tmp/check.out 2>&1
          rc=$?
          echo "diff_check rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/check.out >> "$STATUS"; exit "$rc"; fi
          git commit -m 'ci(diag): narrow #7036 reconcile diff-check' >/tmp/commit.out 2>&1
          rc=$?
          echo "commit rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/commit.out >> "$STATUS"; exit "$rc"; fi
          git push origin HEAD:reconcile/7036-main-75eb8e78 >/tmp/push.out 2>&1
          rc=$?
          echo "push rc=$rc" >> "$STATUS"
          if [ "$rc" -ne 0 ]; then tail -n 40 /tmp/push.out >> "$STATUS"; exit "$rc"; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-7036-reconcile-diag
          path: /tmp/patch-7036.txt
          retention-days: 1
