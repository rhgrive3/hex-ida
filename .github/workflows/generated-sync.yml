name: Generated userscript sync

on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'capstone.wasm'
      - 'scripts/build-userscript.mjs'
      - 'scripts/userscript-release-version.mjs'
      - 'scripts/sync-generated-userscript.mjs'
      - 'tools/validation/generated-output-policy.mjs'
      - 'tests/dev-agent/sync-generated-userscript.mjs'
      - 'userscript/hex.user.template.js'
      - 'userscript/release-version.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generated-sync.yml'
      - '.github/workflows/generated-userscript-autofix.yml'
      - '.github/workflows/generated-userscript-main-sync.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'capstone.wasm'
      - 'scripts/build-userscript.mjs'
      - 'scripts/userscript-release-version.mjs'
      - 'scripts/sync-generated-userscript.mjs'
      - 'tools/validation/generated-output-policy.mjs'
      - 'tests/dev-agent/sync-generated-userscript.mjs'
      - 'userscript/hex.user.template.js'
      - 'userscript/release-version.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generated-sync.yml'
      - '.github/workflows/generated-userscript-autofix.yml'
      - '.github/workflows/generated-userscript-main-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Restore deployment-only build identity
        run: git restore --source=HEAD --worktree -- js/userscript/deployment-identity.generated.js
      - name: Resolve generated-output ownership policy
        id: generated-policy
        shell: bash
        run: |
          set -euo pipefail
          mode="$(node tools/validation/generated-output-policy.mjs)"
          case "$mode" in enforce|ephemeral) ;; *) exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Reject unexpected build side effects
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(userscript/hex\.user\.template\.js|userscript/release-version\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'userscript:build changed files outside the generated-output allowlist:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Require canonical generated outputs to remain tracked
        if: steps.generated-policy.outputs.mode == 'enforce'
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- \
            userscript/hex.user.template.js \
            userscript/release-version.json >/dev/null
      - name: Require release-transaction generated outputs to match source
        if: steps.generated-policy.outputs.mode == 'enforce'
        run: git diff --exit-code -- userscript/hex.user.template.js userscript/release-version.json
      - name: Keep component output ephemeral
        if: steps.generated-policy.outputs.mode == 'ephemeral'
        run: echo 'Component lane built generated output ephemerally; integration owns committed synchronization.'
