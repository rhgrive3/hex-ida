name: Generated userscript sync

on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'capstone.wasm'
      - 'scripts/build-userscript.mjs'
      - 'scripts/userscript-release-version.mjs'
      - 'userscript/hex.user.template.js'
      - 'userscript/release-version.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generated-sync.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'capstone.wasm'
      - 'scripts/build-userscript.mjs'
      - 'scripts/userscript-release-version.mjs'
      - 'userscript/hex.user.template.js'
      - 'userscript/release-version.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generated-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Resolve generated-output ownership policy
        id: generated-policy
        shell: bash
        run: |
          set -euo pipefail
          mode="$(node tools/validation/generated-output-policy.mjs)"
          case "$mode" in
            enforce|ephemeral) ;;
            *) echo "unknown generated-output policy mode: $mode" >&2; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Require userscript-owned generated outputs to match source
        if: steps.generated-policy.outputs.mode == 'enforce' && github.event_name != 'push'
        run: >-
          git diff --exit-code --
          userscript/hex.user.template.js
          userscript/release-version.json
      - name: Validate main build before push-only canonical publication
        if: steps.generated-policy.outputs.mode == 'enforce' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test -f userscript/hex.user.template.js
          test -f userscript/release-version.json
          unexpected="$({ git diff --name-only -- .; git ls-files --others --exclude-standard; } | sort -u | grep -Ev '^(userscript/hex\.user\.template\.js|userscript/release-version\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'userscript:build changed files outside the generated-output allowlist:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          echo 'Main canonical delta is published by the push-only Generated userscript main sync workflow.'
      - name: Keep component output ephemeral
        if: steps.generated-policy.outputs.mode == 'ephemeral'
        run: echo 'Component lane built generated output ephemerally; integration owns committed synchronization.'
