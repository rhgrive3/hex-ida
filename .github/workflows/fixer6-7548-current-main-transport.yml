name: Fixer6 7548 current-main transport

on:
  push:
    branches:
      - fix/alias-binary-escape-authority-20260909-l4210

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply and verify alias authority repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('js/analysis/alias/regions-v2.js')
          s = p.read_text()
          old = """function uniqueBinaryId(origin, explicit) {
            const direct = optionalIdentityString(explicit, 'binary-id');
            if (direct) return direct;
            const ids = new Set();
            for (const range of origin?.byteRanges ?? []) {
              if (range?.binaryId == null) continue;
              ids.add(optionalIdentityString(range.binaryId, 'binary-id'));
            }
            return ids.size === 1 ? [...ids][0] : null;
          }
          """
          new = """function uniqueBinaryId(origin, explicit) {
            const direct = optionalIdentityString(explicit, 'binary-id');
            const ids = new Set();
            for (const range of origin?.byteRanges ?? []) {
              if (range?.binaryId == null) continue;
              ids.add(optionalIdentityString(range.binaryId, 'binary-id'));
            }
            // Explicit identity and byte provenance are co-authorities. A direct claim
            // may not contradict provenance, and it may not collapse provenance that
            // spans multiple binaries into one precise binary scope (#5218). Without an
            // explicit claim, however, multi-binary provenance keeps the historical
            // conservative path: no unique binary authority is available, so callers
            // can fall back to an unknown/non-binary-scoped region instead of throwing.
            if (direct && (ids.size > 1 || (ids.size === 1 && !ids.has(direct)))) {
              throw new TypeError('alias-region-binary-identity-mismatch');
            }
            if (direct) return direct;
            return ids.size === 1 ? [...ids][0] : null;
          }
          """
          if s.count(old) != 1:
              raise SystemExit('regions uniqueBinaryId anchor mismatch')
          p.write_text(s.replace(old, new, 1))

          p = Path('js/analysis/alias/solver.js')
          s = p.read_text()
          old = """    pointsToRun = candidate.recovery == null
                ? baseline
                : { ...baseline, recovery: { ...candidate.recovery, publicationAllowed: false } };
              return pointsToRun;
          """
          new = """    pointsToRun = candidate.recovery == null
                ? baseline
                : { ...baseline, recovery: { ...candidate.recovery, publicationAllowed: false } };
              // Escape facts belong to the points-to map that is actually published. A
              // rejected refinement restores the baseline map, so proofs cached against
              // the rejected candidate must not survive into baseline alias answers
              // (#5215).
              escapeRun = null;
              return pointsToRun;
          """
          if s.count(old) != 1:
              raise SystemExit('solver fallback anchor mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          printf '%s' '' | base64 -d > tests/phase7/alias/issue-5218-binary-identity-mismatch.test.mjs
          rm .github/workflows/fixer6-7548-current-main-transport.yml
          node --check js/analysis/alias/regions-v2.js
          node --check js/analysis/alias/solver.js
          node --check tests/phase7/alias/issue-5215-stale-escape-cache.test.mjs
          node --check tests/phase7/alias/issue-5218-binary-identity-mismatch.test.mjs
          TERM=xterm timeout 45s node --test tests/phase7/alias/issue-5215-stale-escape-cache.test.mjs tests/phase7/alias/issue-5218-binary-identity-mismatch.test.mjs
          mapfile -t alias_files < <(find tests/phase7/alias -maxdepth 1 -type f -name '*.test.mjs' ! -name 'precision-v2.test.mjs' | sort)
          TERM=xterm timeout 90s node --test "${alias_files[@]}"
          test "$(git hash-object js/analysis/alias/regions-v2.js)" = "08fe10258a1b723500546b79c3f0d898861ff6b4"
          test "$(git hash-object js/analysis/alias/solver.js)" = "7e87892dfbf59a1f35e352eee00f96905c348087"
          test "$(git hash-object tests/phase7/alias/issue-5215-stale-escape-cache.test.mjs)" = "fd4e53375b0f32e0d6ecdde28fb7bf087d4b178d"
          test "$(git hash-object tests/phase7/alias/issue-5218-binary-identity-mismatch.test.mjs)" = "8008319b24bca4701a7920a4f4790a05b3919134"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(alias): preserve conservative multi-binary fallback (#5218)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
