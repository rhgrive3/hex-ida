name: Fixer2 issue 8440 remote write
on:
  push:
    branches:
      - fix/issue-8440-fixer2-binary
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact owner-scoped repair
        shell: bash
        run: |
          set -euo pipefail
          baseline=$(git hash-object js/binary/pe-loader-core.js)
          test "$baseline" = "e77c52abae2b1a9d319427d131a698c15d674b2b"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/binary/pe-loader-core.js')
          s = p.read_text()
          old = """  const recordBytes = headerBytes + (packedEpilog ? 0 : epilogCount * 4) + codeWords * 4 + (hasHandler ? 4 : 0);\n  if (!Number.isSafeInteger(recordBytes) || !mappedFileSpanForRva(image, xdataRva, recordBytes)) return invalidExceptionRecord(image, kind, budget, 'arm64-xdata-span', `Ignored ARM64 .xdata record that crosses its file-backed mapping at RVA 0x${xdataRva.toString(16)}`);\n  const bytes = functionLength * 4;\n"""
          new = """  const recordBytes = headerBytes + (packedEpilog ? 0 : epilogCount * 4) + codeWords * 4 + (hasHandler ? 4 : 0);\n  const recordSpan = Number.isSafeInteger(recordBytes)\n    ? mappedFileSpanForRva(image, xdataRva, recordBytes)\n    : null;\n  if (!recordSpan) return invalidExceptionRecord(image, kind, budget, 'arm64-xdata-span', `Ignored ARM64 .xdata record that crosses its file-backed mapping at RVA 0x${xdataRva.toString(16)}`);\n  if (!packedEpilog && epilogCount > 0) {\n    const scopeBytes = epilogCount * 4;\n    if (!budget.take({ inputBytes:scopeBytes, operations:epilogCount }, 'arm64-xdata-epilog-scopes')) return null;\n    const scopeStart = recordSpan.start + headerBytes;\n    for (let i = 0; i < epilogCount; i++) {\n      const scope = r.u32(scopeStart + i * 4);\n      if (((scope >>> 18) & 0xf) !== 0) {\n        const scopeRva = xdataRva + headerBytes + i * 4;\n        return invalidExceptionRecord(image, kind, budget, 'arm64-xdata-epilog-reserved', `Ignored ARM64 .xdata epilog scope with nonzero reserved bits at RVA 0x${scopeRva.toString(16)}`);\n      }\n    }\n  }\n  const bytes = functionLength * 4;\n"""
          if s.count(old) != 1:
              raise SystemExit(f'expected one production patch target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          printf '%s' '' | base64 -d > tests/pe-arm64-xdata-epilog-scope-reserved.test.mjs
          test "$(git hash-object js/binary/pe-loader-core.js)" = "8861486417a3845f5224c429c462ff0390d5acd9"
          test "$(git hash-object tests/pe-arm64-xdata-epilog-scope-reserved.test.mjs)" = "78b98f20456d377437eaf6ddb37a4084d703afbb"
          node --check js/binary/pe-loader-core.js
          node tests/pe-arm64-xdata-epilog-scope-reserved.test.mjs
          node tests/pe-arm64-xdata-header-layout.test.mjs
          rm .github/workflows/fixer2-8440-remote-write.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(pe): validate ARM64 xdata epilog reserved bits (#8440)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
