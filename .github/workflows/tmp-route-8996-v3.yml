name: tmp-route-8996-v3
on:
  push:
    branches:
      - codex/issue-campaign-20260914-lane-10-batch-04
permissions:
  contents: write
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repair exact Phase 7 route block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.circleci/config.yml')
          s = p.read_text()
          start_marker = '              codex/issue-campaign-20260914-lane-10-batch-04)\n'
          end_marker = '              *)\n'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          block = '''              codex/issue-campaign-20260914-lane-10-batch-04)
                # PR #8996 has converged to the Phase 7 #8817 repair; #8975 and
                # #8653 are already superseded by main. Require the complete
                # three-file inventory before validating the two Phase 7 files.
                FILES_JSON="$(git diff --name-only --diff-filter=ACMR "$OWNERSHIP_BASE_SHA...$OWNERSHIP_HEAD_SHA" | node -e '
                  const fs = require("node:fs");
                  const actual = fs.readFileSync(0, "utf8").split(/\\r?\\n/).filter(Boolean).sort();
                  const expected = [
                    ".circleci/config.yml",
                    "js/analysis/semantic-function-base.js",
                    "tests/phase7/abi/issue-8817-aapcs64-proven-fixed-prefix-retention.test.mjs",
                  ].sort();
                  if (actual.length !== expected.length || actual.some((file, i) => file !== expected[i])) {
                    console.error("PR #8996 Phase 7 route inventory mismatch");
                    console.error(JSON.stringify({ actual, expected }));
                    process.exit(1);
                  }
                  process.stdout.write(JSON.stringify([
                    "js/analysis/semantic-function-base.js",
                    "tests/phase7/abi/issue-8817-aapcs64-proven-fixed-prefix-retention.test.mjs",
                  ]));
                ')"
                node tools/validation/phase7-ownership.mjs --files-json "$FILES_JSON"
                ;;
'''
          s = s[:start] + block + s[end:]
          p.write_text(s)
          check = p.read_text()
          if 'split(/\\r?\\n/).filter(Boolean).sort();' not in check:
              raise SystemExit('canonical line-split expression missing after repair')
          PY
      - name: Validate repaired route
        shell: bash
        run: |
          set -euo pipefail
          node tools/validation/phase7-ownership.mjs --files-json '["js/analysis/semantic-function-base.js","tests/phase7/abi/issue-8817-aapcs64-proven-fixed-prefix-retention.test.mjs"]'
          node tests/ci/circleci-impact.test.mjs
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-route-8996-v3.yml
          git config user.name 'rhgrive3'
          git config user.email 'rhgrive@gmail.com'
          git add .circleci/config.yml .github/workflows/tmp-route-8996-v3.yml
          git commit -m 'ci: repair PR 8996 ownership route syntax'
          git push origin HEAD:codex/issue-campaign-20260914-lane-10-batch-04
