name: Temporary patch 1573 1575
on:
  push:
    branches: [fix/scheduler-boundaries-1573-1575]
    paths: [.github/workflows/tmp-patch-1573-1575.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scheduler-boundaries-1573-1575
          fetch-depth: 0
      - run: |
          python3 tools/tmp-patch-1573-1575.py
          node --check js/core/scheduler/analysis-scheduler.js
      - run: |
          rm .github/workflows/tmp-patch-1573-1575.yml tools/tmp-patch-1573-1575.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/scheduler/analysis-scheduler.js .github/workflows/tmp-patch-1573-1575.yml tools/tmp-patch-1573-1575.py
          git diff --cached --check
          git commit -m "fix(scheduler): harden priority, starvation, and dependency ids (#1573 #1575)"
          git push origin HEAD:fix/scheduler-boundaries-1573-1575
