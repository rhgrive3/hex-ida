name: Diagnose C4-04 audit patch

on:
  push:
    branches:
      - 'diag/c4-ownership-20260916'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/analysis-roadmap-v8-current-main-20260907
          fetch-depth: 1
      - name: Audit JSON patch contract
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('docs/analysis-local-acceptance-audit.json','utf8'));
          const finding = audit.findings.find(row => row.id === 'HEX-C4-04');
          const taskA = audit.tasks.find(row => row.id === 'FR-C4-04A');
          const taskB = audit.tasks.find(row => row.id === 'FR-C4-04B');
          if (!finding || !taskA || !taskB) throw new Error('missing C4 rows');
          if (!audit.integrationFollowup || typeof audit.integrationFollowup !== 'object') throw new Error('integrationFollowup not object');
          audit.integrationFollowup.c4ProofAdoption20260916 = {status:'probe'};
          JSON.parse(JSON.stringify(audit));
          NODE
      - name: Status markdown patch contract
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const status = fs.readFileSync('docs/解析ツール改善.md','utf8');
          const anchor = '研究完了、有限テスト成功、全機能完成、生成物同期、独立検証、実機受入は別の事実である。\n\n';
          const oldRow = '| HEX-C4-04 | partial | generic normal-return PCをbyte equivalenceの独立observableに追加。native全state/fault/exceptionの変換authorityは依然未許可。 |';
          if (!status.includes(anchor)) throw new Error('status anchor missing');
          if (!status.includes(oldRow)) throw new Error('status C4 row missing');
          NODE
      - name: Checkpoint markdown patch contract
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checkpoint = fs.readFileSync('docs/analysis-roadmap-v8-integration-checkpoint.md','utf8');
          const anchor = '# Analysis roadmap v8 integration checkpoint\n\n';
          if (!checkpoint.startsWith(anchor)) throw new Error('checkpoint heading anchor missing');
          NODE
      - name: Diff-check probe
        shell: bash
        run: git diff --check
