name: tmp-diagnose-issue-5435-scpa

on:
  push:
    branches:
      - fix/mod5-3-5435-entry-loop-ssa

permissions:
  contents: read

jobs:
  scpa-first-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mod5-3-5435-entry-loop-ssa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Capture only SCPA first-failure output
        id: scpa
        shell: bash
        run: |
          set +e
          HEX_TEST_OUTPUT=quiet npm run scpa:test > /tmp/scpa.out 2>&1
          status=$?
          set -e
          {
            echo "status=$status"
            tail -c 24000 /tmp/scpa.out
          } > /tmp/issue-5435-scpa-diagnostic.txt
          exit "$status"
      - name: Upload compact failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-5435-scpa-first-failure
          path: /tmp/issue-5435-scpa-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
