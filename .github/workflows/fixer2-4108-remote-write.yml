name: fixer2-4108-remote-write
"on":
  push:
    branches:
      - fixer2/issue-4108-pe-thunk-reserved-bits
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply and validate Fixer 2 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/fixer2/4108.patch.b64 > /tmp/4108.patch
          git apply --check /tmp/4108.patch
          git apply /tmp/4108.patch
          mkdir -p tests/phase4/binary
          base64 -d .github/fixer2/4108.test.b64 > tests/phase4/binary/issue-4108-pe64-import-thunk-reserved-bits.test.mjs
          test "$(git hash-object js/binary/pe-loader-core.js)" = d9e70c6bcb6f53c1baaf347167949922dd77dcb6
          test "$(git hash-object tests/phase4/binary/issue-4108-pe64-import-thunk-reserved-bits.test.mjs)" = 0ec0af4e92b7b2efc3451bf0eb9dca5e3ff54051
          node --check js/binary/pe-loader-core.js
          node --test tests/phase4/binary/issue-4108-pe64-import-thunk-reserved-bits.test.mjs
          npm run binary:test
          npm run lint
          git rm .github/workflows/fixer2-4108-remote-write.yml .github/fixer2/4108.patch.b64 .github/fixer2/4108.test.b64
          git add js/binary/pe-loader-core.js tests/phase4/binary/issue-4108-pe64-import-thunk-reserved-bits.test.mjs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(pe): reject reserved PE32+ import thunk bits (#4108)"
          git push origin HEAD:fixer2/issue-4108-pe-thunk-reserved-bits
