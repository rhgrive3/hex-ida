name: fixer2-4108-remote-write
on:
  push:
    branches:
      - fixer2/issue-4108-pe-thunk-reserved-bits
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply validated patch and regression
        shell: bash
        env:
          PATCH_B64: 
          TEST_B64: 