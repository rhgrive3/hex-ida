name: Temporary artifact/evidence authority materializer
on:
  push:
    branches: [fix/2934-2935-2943-artifact-evidence-authority]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2934-2935-2943-artifact-evidence-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 tools/tmp-artifact-evidence-authority.py
      - name: Focused regression
        run: |
          node tests/core-artifact-evidence-authority-ids.mjs
          npm run artifact-store:test
          npm run evidence:test
      - name: Commit production repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/core/artifacts/store.js js/core/artifacts/backends.js js/core/evidence/index.js tests/core-artifact-evidence-authority-ids.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix(core): reject coerced artifact and evidence authority IDs'
          git push origin HEAD:fix/2934-2935-2943-artifact-evidence-authority
